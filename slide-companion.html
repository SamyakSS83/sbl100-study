of infection."],"terms":[{"term":"Neutrophil","meaning":"Abundant short-lived granulocyte specialized for rapid antimicrobial defense."},{"term":"First responder","meaning":"A cell recruited very early during infection or injury."},{"term":"Granulocyte","meaning":"A white blood cell containing prominent cytoplasmic granules."}],"diagramGuide":["The neutrophil image has a multilobed nucleus. The bullets identify it as the most abundant WBC, an efficient phagocyte, and an early cell at infection sites."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A newly infected tissue recruits the most abundant circulating WBC as a primary responder. Which cell is expected?","options":["Natural killer cell","Neutrophil","Basophil","Monocyte"],"answer":1,"explanation":"Neutrophils are shown as roughly 50-60% of WBCs and rapid primary-response phagocytes."},{"type":"mcq","q":"Approximately what fraction of circulating white blood cells is made up of neutrophils according to the slide?","options":["15–25%","50–60%","80–90%","2–10%"],"answer":1,"explanation":"The slide identifies neutrophils as the most abundant WBC population at roughly 50–60%."}]}},{"page":276,"lecture":"Host Pathogen Interaction","slideInLecture":18,"title":"Chemotaxis guides neutrophils","explain":"Neutrophils locate infection by chemotaxis: they detect soluble attractant molecules and move up the concentration gradient toward the source.","mustKnow":["Chemotaxis is directed movement along a chemical gradient.","Neutrophils move toward higher concentrations of attractant signals."],"terms":[{"term":"Chemotaxis","meaning":"Directed cell movement in response to a chemical concentration gradient."},{"term":"Chemoattractant","meaning":"A molecule that attracts motile cells."},{"term":"Concentration gradient","meaning":"A spatial change from lower to higher concentration."}],"diagramGuide":["Chemotaxis means directed movement along a chemical concentration gradient toward a microbial or inflammatory source."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A neutrophil detects increasing chemoattractant concentrations toward a wound. Its net movement should be:","options":["Up the concentration gradient","Down the concentration gradient","Independent of the gradient","Restricted to the bloodstream"],"answer":0,"explanation":"Positive chemotaxis directs movement toward higher chemoattractant concentration."}]}},{"page":277,"lecture":"Host Pathogen Interaction","slideInLecture":19,"title":"Neutrophil chemotaxis in motion","explain":"The linked demonstration visualizes a neutrophil changing shape and crawling toward a chemical source. Receptor sensing at the front polarizes the cell so that protrusion and movement are directed rather than random.","mustKnow":["Chemotaxis requires sensing plus polarized cell movement.","The leading edge faces the chemoattractant source."],"terms":[{"term":"Cell polarity","meaning":"An asymmetric front–rear organization that gives a migrating cell direction."},{"term":"Leading edge","meaning":"The forward, protruding side of a moving cell."}],"diagramGuide":["The moving neutrophil changes shape and extends its leading edge toward the chemoattractant source; this is directional migration, not random motion."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which observation best distinguishes the filmed behavior as chemotaxis rather than random motility?","options":["Repeated engulfment without displacement","Symmetric membrane blebbing in all directions","Loss of all cell polarity","Persistent movement toward a localized chemical source"],"answer":3,"explanation":"Chemotaxis is directional migration toward a chemical source."}]}},{"page":278,"lecture":"Host Pathogen Interaction","slideInLecture":20,"title":"Phagocytosis","explain":"Phagocytosis is cellular eating. A phagocyte recognizes and surrounds a microbe, encloses it inside a membrane-bound compartment and then digests it using antimicrobial molecules and enzymes.","mustKnow":["Phagocytosis means engulfment of a particle or microbe by a cell.","Neutrophils are professional phagocytes.","Engulfment is followed by intracellular killing and digestion."],"terms":[{"term":"Phagocytosis","meaning":"Engulfment of a large particle or microbe into a cell."},{"term":"Phagocyte","meaning":"A cell specialized to engulf particles or microbes."},{"term":"Engulfment","meaning":"Extension of the cell membrane around a target to internalize it."}],"diagramGuide":["The word roots explain the process: phago means eat and cyte means cell; the operational sequence is find, engulf, and digest."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which sequence best operationalizes phagocytosis by a neutrophil?","options":["Adhesion, mitosis, memory formation","Lysis, antigen rearrangement, exocytosis","Recognition, engulfment, intracellular digestion","Secretion, diffusion, antibody synthesis"],"answer":2,"explanation":"Phagocytes find/recognize, engulf, and digest microbes."}]}},{"page":279,"lecture":"Host Pathogen Interaction","slideInLecture":21,"title":"Neutrophils engulf bacteria","explain":"The linked microscopy shows a motile neutrophil chasing and engulfing bacteria. It combines the two processes just introduced: chemotaxis brings the cell to its target, then phagocytosis internalizes the target.","mustKnow":["Chemotaxis precedes contact with the bacterium.","Phagocytosis begins after recognition and contact."],"terms":[{"term":"Recognition","meaning":"Binding of a target directly or through molecules coating its surface."}],"diagramGuide":["The micrograph shows a neutrophil among red blood cells with bacteria being engulfed; recognition and enclosure precede intracellular digestion."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In the micrograph, bacterial enclosure by the neutrophil must occur before formation of which compartment?","options":["Extracellular trap","Phagosome","Nucleus","Golgi cisterna"],"answer":1,"explanation":"Engulfment encloses the bacterium in a membrane-bound phagosome."}]}},{"page":280,"lecture":"Host Pathogen Interaction","slideInLecture":22,"title":"The phagocytosis pathway","explain":"After chemotaxis and attachment, the neutrophil surrounds the microbe and encloses it in a phagosome. Lysosomes or antimicrobial granules fuse with the phagosome to make a phagolysosome. Enzymes digest the microbe, and indigestible residue is later discharged.","mustKnow":["Engulfment forms a phagosome.","Phagosome–lysosome fusion forms a phagolysosome.","Microbial digestion occurs in the phagolysosome.","Residual waste can be expelled."],"terms":[{"term":"Phagosome","meaning":"Membrane-bound vesicle containing an engulfed particle."},{"term":"Lysosome","meaning":"Enzyme-rich acidic organelle that degrades material."},{"term":"Phagolysosome","meaning":"Digestive compartment formed by fusion of a phagosome with lysosomes."},{"term":"Pseudopod","meaning":"Temporary cell extension used to surround a target."}],"diagramGuide":["Read clockwise: attachment, pseudopod extension, phagosome formation, lysosome fusion, killing/digestion, and discharge of residual material.","Granules/lysosomes deliver antimicrobial molecules to the microbe-containing compartment."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which event immediately converts a microbe-containing phagosome into the main digestive compartment?","options":["Fusion with a lysosome","Binding to a B-cell receptor","Release through exocytosis","Division of the phagocyte"],"answer":0,"explanation":"Phagosome-lysosome fusion creates the phagolysosomal digestive compartment."},{"type":"mcq","q":"What is the membrane-bound compartment formed immediately after a phagocyte engulfs a microbe?","options":["Proteasome","Inflammasome","Apoptosome","Phagosome"],"answer":3,"explanation":"Engulfment encloses the microbe in a phagosome."},{"type":"mcq","q":"Where does most enzymatic killing and digestion of an engulfed bacterium occur?","options":["Extracellular matrix","Phagolysosome","Nucleus","Golgi cisterna"],"answer":1,"explanation":"Fusion of the phagosome with lysosomal/granule compartments creates the degradative phagolysosome."}]}},{"page":281,"lecture":"Host Pathogen Interaction","slideInLecture":23,"title":"What neutrophil granules contain","explain":"Neutrophil granules store concentrated antimicrobial cargo. Their contents include digestive enzymes that break microbial structures and other proteins that kill or inhibit microbes. Fusion delivers this cargo into the phagocytic compartment.","mustKnow":["Granules contain digestive enzymes and antimicrobial proteins.","Granule contents help kill and digest engulfed bacteria.","Storage in granules permits rapid deployment."],"terms":[{"term":"Granule","meaning":"Intracellular storage compartment containing ready-made antimicrobial molecules."},{"term":"Digestive enzyme","meaning":"A protein that chemically breaks large biological molecules into smaller products."},{"term":"Degranulation","meaning":"Release of stored granule contents."}],"diagramGuide":["The highlighted granules contain digestive enzymes and antimicrobial proteins; after fusion, these contents act inside the phagolysosome."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A neutrophil forms phagosomes normally but cannot deliver granule contents. Which function is most directly lost?","options":["Chemotactic gradient detection","Production of erythrocytes","Antigen-specific memory","Intracellular microbial killing"],"answer":3,"explanation":"Granules supply digestive enzymes and antimicrobial proteins to the microbe-containing compartment."},{"type":"mcq","q":"Neutrophil granules principally store which class of effector molecules?","options":["Digestive enzymes and antimicrobial proteins","Steroid hormones and glycogen","Antibodies and MHC molecules","DNA polymerases and histones"],"answer":0,"explanation":"Granules provide rapidly deployable enzymes and antimicrobial proteins for microbial killing."}]}},{"page":282,"lecture":"Host Pathogen Interaction","slideInLecture":24,"title":"Neutrophils also signal","explain":"Neutrophils do more than ingest microbes. They release mediators that promote inflammation and influence other immune cells, helping connect the immediate innate response with later adaptive immunity.","mustKnow":["Neutrophils can trigger or amplify inflammation.","Neutrophil signals can affect adaptive immune responses.","Neutrophils are not only microbe-eating cells."],"terms":[{"term":"Inflammatory mediator","meaning":"A released molecule that promotes vascular or cellular features of inflammation."},{"term":"Immune crosstalk","meaning":"Communication between different immune cells or immune-system branches."}],"diagramGuide":["The red annotation adds a signaling role to killing: neutrophils release mediators that trigger inflammation and influence adaptive immunity."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which outcome shows that neutrophils do more than directly ingest bacteria?","options":["Production of gastric acid","Generation of antigen receptors by gene rearrangement","Recruitment/activation of other immune responses by inflammatory mediators","Differentiation into plasma cells"],"answer":2,"explanation":"The slide emphasizes inflammatory signaling and links to adaptive immunity."}]}},{"page":283,"lecture":"Host Pathogen Interaction","slideInLecture":25,"title":"Neutrophil extracellular traps","explain":"Neutrophils can release web-like neutrophil extracellular traps, or NETs. These structures contain decondensed DNA associated with antimicrobial proteins, allowing them to trap microbes outside cells and concentrate toxic molecules around them.","mustKnow":["NET stands for neutrophil extracellular trap.","NETs are DNA-rich extracellular webs.","NETs trap microbes and expose them to antimicrobial proteins."],"terms":[{"term":"NET","meaning":"Neutrophil extracellular trap made largely of DNA and antimicrobial proteins."},{"term":"NETosis","meaning":"A process by which a neutrophil releases an extracellular trap."},{"term":"Decondensed DNA","meaning":"DNA loosened from its compact chromatin organization."}],"diagramGuide":["Follow the numbered sequence: rolling, slow rolling, adhesion, transmigration, then effector actions including NET release and exocytosis/ROS.","The NET is a web-like extracellular scaffold that traps microbes."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which step occurs after firm adhesion but before neutrophil effector release in the vessel diagram?","options":["Hematopoietic differentiation","Transmigration across endothelium","Rolling on selectins","Initial tethering"],"answer":1,"explanation":"The displayed recruitment order proceeds from rolling to adhesion to transmigration, then tissue effector actions."},{"type":"mcq","q":"The structural scaffold of a neutrophil extracellular trap is primarily:","options":["DNA","Peptidoglycan","Phospholipid","Collagen"],"answer":0,"explanation":"NETs are extracellular DNA-rich webs decorated with antimicrobial proteins."},{"type":"mcq","q":"What is the immediate defensive function of a NET?","options":["Activate erythrocyte production","Digest host collagen","Generate antigen-specific antibodies","Trap microbes extracellularly"],"answer":3,"explanation":"NETs immobilize microbes and concentrate antimicrobial molecules around them."}]}},{"page":284,"lecture":"Host Pathogen Interaction","slideInLecture":26,"title":"Monocytes become tissue macrophages","explain":"Monocytes are circulating white blood cells that make up roughly 2–10% of WBCs. After leaving blood and entering tissues, they can differentiate into macrophages with tissue-adapted forms in organs such as lung, liver, brain, bone and intestine.","mustKnow":["Monocytes circulate in blood.","Monocytes migrate into tissues and become macrophages.","Different tissues contain specialized macrophage populations."],"terms":[{"term":"Monocyte","meaning":"Circulating myeloid white blood cell that can differentiate into macrophages."},{"term":"Differentiation","meaning":"Acquisition of a more specialized cell identity and function."},{"term":"Tissue macrophage","meaning":"A macrophage residing and functioning within a particular organ."}],"diagramGuide":["The central monocyte leaves blood and differentiates into tissue macrophages; the organ icons show specialized macrophages in lung, liver, brain, intestine, and other tissues."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which tissue-cell relationship is supported by the differentiation arrows?","options":["Circulating monocyte becomes tissue macrophage","Neutrophil becomes natural killer cell","B cell becomes monocyte","Macrophage becomes erythrocyte"],"answer":0,"explanation":"Monocytes migrate into tissues and differentiate into macrophages."},{"type":"mcq","q":"Approximately what percentage of circulating WBCs is represented by monocytes on the slide?","options":["70–80%","2–10%","20–30%","50–60%"],"answer":1,"explanation":"The slide gives monocytes as approximately 2–10% of WBCs."},{"type":"mcq","q":"What happens to many monocytes after they leave the bloodstream and enter tissues?","options":["They become macrophages","They become erythrocytes","They become platelets","They become epithelial cells"],"answer":0,"explanation":"Tissue entry is followed by differentiation of monocytes into macrophages."}]}},{"page":285,"lecture":"Host Pathogen Interaction","slideInLecture":27,"title":"Macrophages: big eaters and antigen presenters","explain":"Macrophages are long-lived tissue phagocytes. They engulf microbes and debris and can display microbial peptide fragments to T cells. This antigen-presentation function helps connect innate detection to adaptive activation.","mustKnow":["Macrophages phagocytose microbes in tissues.","Macrophages can present antigens to T cells.","Neutrophils normally circulate in blood, whereas macrophages reside in tissues."],"terms":[{"term":"Antigen presentation","meaning":"Display of peptide fragments on cell-surface MHC molecules for recognition by T cells."},{"term":"MHC","meaning":"Cell-surface proteins that hold peptide fragments for T-cell inspection."},{"term":"Tissue phagocyte","meaning":"A particle-engulfing immune cell located within tissue."}],"diagramGuide":["The slide assigns macrophages two linked jobs: tissue phagocytosis and antigen presentation to adaptive immune cells."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"After ingesting a microbe, which macrophage activity most directly connects innate detection to an adaptive T-cell response?","options":["Synthesis of peptidoglycan","Release of gastric HCl","Formation of a bacterial capsule","Presentation of microbial antigen"],"answer":3,"explanation":"Antigen presentation enables macrophages to communicate microbial information to T cells."},{"type":"mcq","q":"Which macrophage function directly helps activate antigen-specific T-cell responses?","options":["Hemoglobin synthesis","Antibody secretion","Platelet release","Antigen presentation"],"answer":3,"explanation":"Macrophages can display processed antigen to T cells, linking innate uptake to adaptive activation."}]}},{"page":286,"lecture":"Host Pathogen Interaction","slideInLecture":28,"title":"Natural killer cells","explain":"Natural killer cells are innate lymphocytes, not B or T cells. They survey host cells and kill cells altered by viral infection, some intracellular infections or cancer. Their response does not require the same antigen-specific priming used by adaptive cytotoxic T cells.","mustKnow":["NK cells are part of innate immunity.","NK cells are lymphoid cells but are neither B nor T lymphocytes.","They kill infected and cancerous host cells."],"terms":[{"term":"Natural killer cell","meaning":"Innate lymphocyte that kills stressed, infected or transformed host cells."},{"term":"Intracellular pathogen","meaning":"A pathogen that lives or replicates within host cells."},{"term":"Transformed cell","meaning":"A cell with cancer-like abnormal growth properties."}],"diagramGuide":["The cartoon separates NK cells from B and T lymphocytes and shows their targets as infected cells and cancer cells."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which target profile is most consistent with the NK-cell panel?","options":["Free bacterial endotoxin molecule","Normal erythrocyte with intact self markers","Virus-infected host cell","Extracellular collagen fiber"],"answer":2,"explanation":"NK cells kill infected and malignant host cells rather than free molecules or matrix."},{"type":"mcq","q":"Which statement correctly classifies natural killer cells?","options":["Antibody-producing granulocytes","Tissue-resident erythrocytes","Adaptive myeloid cells","Innate lymphoid cells"],"answer":3,"explanation":"NK cells are lymphoid in lineage but function as innate immune cells and are neither B nor T cells."}]}},{"page":287,"lecture":"Host Pathogen Interaction","slideInLecture":29,"title":"Missing-self recognition by NK cells","explain":"Healthy cells display surface molecules, especially MHC class I, that provide inhibitory 'do not kill' signals to NK cells. Infected or cancerous cells may lose these molecules. Loss of inhibitory signaling shifts the balance toward NK-cell killing; this is called missing-self recognition.","mustKnow":["Normal MHC class I helps inhibit NK-cell killing.","Reduced or missing MHC class I can mark an abnormal cell.","NK decisions reflect a balance of activating and inhibitory signals."],"terms":[{"term":"Missing self","meaning":"NK-cell recognition of abnormally low self MHC class I on a target cell."},{"term":"MHC class I","meaning":"A surface molecule on most nucleated cells that can deliver an inhibitory signal to NK cells."},{"term":"Inhibitory receptor","meaning":"A receptor whose engagement reduces cell activation."}],"diagramGuide":["Compare the two target cells: normal cells display inhibitory self-surface signals, while infected/cancer cells may lose them; loss of inhibition permits NK killing."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"An infected cell loses a surface protein that normally delivers an inhibitory signal to NK cells. What is the predicted result?","options":["Complement synthesis by the target","NK-cell activation and target killing","Guaranteed protection from NK cells","Bacterial spore formation"],"answer":1,"explanation":"Loss of normal self-surface inhibition is the missing-self cue for NK killing."},{"type":"mcq","q":"Which surface molecule on a normal host cell commonly supplies an inhibitory signal to NK cells?","options":["Peptidoglycan","MHC class I","Secreted IgA","Lipid A"],"answer":1,"explanation":"Normal expression of MHC class I engages inhibitory NK receptors and restrains killing."},{"type":"mcq","q":"The term “missing self” refers most directly to reduced expression of:","options":["MHC class I on a target cell","Antibody on a B cell","Complement in plasma","Collagen in connective tissue"],"answer":0,"explanation":"Virus-infected and transformed cells may lose MHC class I, removing an inhibitory NK-cell signal."}]}},{"page":288,"lecture":"Host Pathogen Interaction","slideInLecture":30,"title":"How NK cells kill targets","explain":"After recognizing an abnormal target, an NK cell releases cytotoxic granules at the contact site. Perforin helps create membrane pores or supports granzyme entry; granzymes are proteases that activate apoptosis. Killing the infected host cell also removes the pathogen's intracellular niche.","mustKnow":["NK cells release cytotoxic granules.","Perforin promotes granzyme access to the target cell.","Granzymes trigger apoptotic death.","The host target cell, not only the microbe, is eliminated."],"terms":[{"term":"Perforin","meaning":"Pore-forming cytotoxic protein released by NK cells and cytotoxic T cells."},{"term":"Granzyme","meaning":"Cytotoxic protease that enters a target and activates cell-death pathways."},{"term":"Cytotoxic granule","meaning":"Secretory vesicle containing cell-killing proteins."},{"term":"Apoptosis","meaning":"Controlled cell death triggered here in the abnormal target cell."}],"diagramGuide":["The top panel shows inhibitory recognition sparing a healthy cell; the lower panel shows an abnormal target receiving released granules.","Perforin enables entry/pore formation and proteases such as granzymes activate target-cell death."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which molecule-function pairing fits granule-mediated NK killing?","options":["Perforin - enables pore/entry; granzyme - proteolytic death signal","Perforin - antibody; granzyme - complement receptor","Perforin - adhesin; granzyme - capsule enzyme","Perforin - cytokine receptor; granzyme - MHC molecule"],"answer":0,"explanation":"Perforin facilitates access and granzyme proteases activate death pathways in the target."},{"type":"mcq","q":"Which NK-cell granule protein promotes entry of granzymes into the target cell?","options":["Lysozyme","Coagulase","Caspase-9","Perforin"],"answer":3,"explanation":"Perforin facilitates delivery of granzymes, which initiate apoptotic death."},{"type":"mcq","q":"Granzyme entry into an NK-cell target most directly triggers:","options":["Cell-wall synthesis","Complement secretion","Apoptosis","Antibody production"],"answer":2,"explanation":"Granzymes activate intracellular death pathways that cause apoptosis of the target cell."}]}},{"page":289,"lecture":"Host Pathogen Interaction","slideInLecture":31,"title":"NK-cell killing demonstration","explain":"The linked material illustrates contact-dependent cytotoxicity. An NK cell forms a focused junction with a selected target, directs granules toward that junction and triggers target-cell death while limiting damage to nearby cells.","mustKnow":["Cytotoxic granules are released directionally at the immune-cell–target junction.","Focused secretion helps protect neighboring cells."],"terms":[{"term":"Immune synapse","meaning":"Organized contact zone between an immune cell and its target."},{"term":"Directed secretion","meaning":"Release of molecules toward one selected target rather than in all directions."}],"diagramGuide":["Treat the molecular image as the recognition/contact stage: a cytotoxic lymphocyte must first form a close interface with its target before polarized granule release."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Before polarized cytotoxic granule release, which event must occur at the target-cell interface?","options":["Phagosome-lysosome fusion","Bacterial binary fission","Complement synthesis in the liver","Stable recognition/contact synapse"],"answer":3,"explanation":"Cytotoxic killing requires target recognition and close contact before directed granule release."}]}},{"page":290,"lecture":"Host Pathogen Interaction","slideInLecture":32,"title":"Cytotoxic lymphocyte mechanism","explain":"This video resource reinforces the sequence of target recognition, stable contact, polarized granule release and apoptotic target death. The essential molecular pair is perforin plus granzymes.","mustKnow":["Target recognition precedes granule release.","Perforin and granzymes execute cytotoxic killing.","The target typically dies by apoptosis."],"terms":[{"term":"Cytotoxic lymphocyte","meaning":"An NK cell or cytotoxic T cell capable of killing another cell."}],"diagramGuide":["The faint video frame belongs to the killing sequence: target recognition and synapse formation precede directed release of cytotoxic granules and target death."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which sequence best represents granule-mediated lymphocyte cytotoxicity?","options":["Chemotaxis, antibody secretion, capsule formation, lysis","Endotoxin release, receptor loss, DNA replication, memory","Target recognition, synapse formation, granule release, target-cell death","Granule release, target recognition, mitosis, phagocytosis"],"answer":2,"explanation":"Recognition and synapse formation precede polarized cytotoxic granule release and death."},{"type":"mcq","q":"In granule-mediated cytotoxicity, what occurs immediately before polarized granule release?","options":["Bacterial binary fission","Target recognition and immune-synapse formation","Antibody class switching","Phagolysosome exocytosis"],"answer":1,"explanation":"The cytotoxic lymphocyte first recognizes and binds its target, then directs granules toward the contact site."}]}},{"page":291,"lecture":"Host Pathogen Interaction","slideInLecture":33,"title":"Cytotoxic T cells","explain":"The linked cytotoxic T-cell example uses a killing mechanism similar to NK cells but target selection differs. Cytotoxic T cells belong to adaptive immunity and recognize a specific antigen peptide displayed on MHC class I before releasing perforin and granzymes.","mustKnow":["Cytotoxic T cells are adaptive immune cells.","They recognize specific peptide–MHC class I complexes.","They can kill through perforin and granzymes."],"terms":[{"term":"Cytotoxic T cell","meaning":"Adaptive T lymphocyte that kills cells displaying its specific antigen on MHC class I."},{"term":"Peptide–MHC complex","meaning":"A peptide fragment held by an MHC molecule for T-cell recognition."},{"term":"T-cell receptor","meaning":"Antigen-specific receptor used by a T cell to inspect peptide–MHC."}],"diagramGuide":["The cytotoxic T-cell frame represents adaptive cell-mediated killing; unlike NK missing-self recognition, a cytotoxic T cell recognizes a specific peptide-MHC complex."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What gives a cytotoxic T cell greater antigen specificity than the missing-self mechanism of an NK cell?","options":["Sensing any extracellular ATP","Recognition of a particular peptide-MHC complex","Recognition of any low-pH compartment","Binding directly to peptidoglycan"],"answer":1,"explanation":"Cytotoxic T cells use antigen receptors to recognize specific peptide-MHC complexes."},{"type":"mcq","q":"Cytotoxic T cells recognize target cells through specific binding to:","options":["Peptide–MHC class I complexes","Free circulating LPS","Peptidoglycan–TLR4 complexes","Complement-coated erythrocytes"],"answer":0,"explanation":"A cytotoxic T-cell receptor recognizes a specific peptide displayed by MHC class I."}]}},{"page":292,"lecture":"Host Pathogen Interaction","slideInLecture":34,"title":"Overall mechanism of microbial pathogenicity","explain":"Disease depends on a sequence of successful events: enough microbes reach a portal of entry, adhere, penetrate or evade defenses, damage host cells and eventually leave through a portal of exit. Virulence factors are microbial features that increase success at one or more steps.","mustKnow":["Virulence is a pathogen's capacity to harm a host.","Pathogenicity involves entry, adherence, defense evasion, damage and exit.","The number of invading microbes can affect whether disease develops.","Virulence factors convert a microbe into a more effective pathogen."],"terms":[{"term":"Virulence","meaning":"Degree or capacity of a pathogen to cause harm."},{"term":"Virulence factor","meaning":"A microbial structure or product that promotes colonization, invasion, evasion or damage."},{"term":"Portal of entry","meaning":"Route by which a pathogen enters the host."},{"term":"Portal of exit","meaning":"Route by which a pathogen leaves the host for transmission."}],"diagramGuide":["Read the flow left to right: portal of entry, penetration/evasion, damage, and portal of exit.","Adherence feeds into establishment of infection, while inoculum size and virulence factors influence whether disease occurs."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which ordering follows the pathogenicity flowchart from entry to transmission?","options":["Portal of entry -> defense evasion -> host damage -> portal of exit","Host damage -> portal of exit -> adherence -> portal of entry","Portal of exit -> colonization -> entry -> inoculum","Adherence -> portal of exit -> entry -> no host damage"],"answer":0,"explanation":"The chart runs from entry through penetration/evasion and damage to exit."},{"type":"mcq","q":"What does virulence describe?","options":["The host's capacity to make antibodies","The rate of leukocyte production","The ability of a drug to dissolve clots","A pathogen's capacity to harm its host"],"answer":3,"explanation":"Virulence is the degree or capacity of a pathogen to cause host damage."},{"type":"mcq","q":"Which combination best captures the slide's distinction between a microbe and a pathogen?","options":["Host cell + capsule = pathogen","Toxin + erythrocyte = pathogen","Microbe + virulence factors = pathogen","Microbe + antibody = pathogen"],"answer":2,"explanation":"Virulence factors equip a microbe to enter, persist, evade defenses, damage the host, or spread."}]}},{"page":293,"lecture":"Host Pathogen Interaction","slideInLecture":35,"title":"Steps in bacterial pathogenesis","explain":"The diagram organizes bacterial disease into exposure, adhesion, invasion, colonization with immune evasion, toxin action and tissue damage. Not every bacterium uses every step, but successful disease generally requires persistence at the host site and enough damage to disturb normal function.","mustKnow":["Exposure is followed by attachment or adhesion.","Invasion and colonization allow persistence and spread.","Immune evasion helps bacteria survive in the host.","Toxins and direct microbial effects produce tissue damage and disease."],"terms":[{"term":"Colonization","meaning":"Establishment and multiplication of microbes at a host site."},{"term":"Invasion","meaning":"Entry into host tissues or cells beyond the initial surface."},{"term":"Immune evasion","meaning":"Avoidance, suppression or resistance of host immune defenses."},{"term":"Toxin","meaning":"A microbial product that directly damages cells or disrupts physiology."}],"diagramGuide":["Follow the panels in order: exposure, adhesion, invasion, colonization/growth, toxicity, then tissue damage and disease.","The epithelial surface and mucus layer remain the spatial reference throughout."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which stage immediately precedes invasion in the illustrated pathogenesis sequence?","options":["Toxicity","Tissue damage","Portal of exit","Adhesion"],"answer":3,"explanation":"The panel order is exposure, adhesion, invasion, colonization/growth, toxicity, and damage."},{"type":"mcq","q":"Which process enables a bacterium to persist despite active host defenses?","options":["Blood coagulation","Immune evasion","Translation termination","Erythropoiesis"],"answer":1,"explanation":"Immune-evasion mechanisms allow bacteria to avoid recognition, killing, or clearance."},{"type":"mcq","q":"Which event is most directly responsible for the clinical manifestations of bacterial disease?","options":["Tissue damage by toxins or direct microbial effects","Initial exposure alone","Receptor absence from a non-target tissue","Formation of normal flora"],"answer":0,"explanation":"Disease signs and symptoms arise when toxins or direct microbial activities damage host tissue."}]}},{"page":294,"lecture":"Host Pathogen Interaction","slideInLecture":36,"title":"Adherence requires a microbial ligand and host receptor","explain":"Adherence is often essential because microbes must resist being washed away before they can colonize. Attachment depends on complementary binding: a microbial surface ligand, often called an adhesin, binds a receptor on the host cell.","mustKnow":["Adherence is microbial attachment to host cells.","A microbial ligand binds a host receptor.","Attachment commonly precedes colonization and infection."],"terms":[{"term":"Adherence","meaning":"Attachment of a microorganism to a host surface or cell."},{"term":"Adhesin","meaning":"A microbial surface molecule that mediates attachment."},{"term":"Ligand","meaning":"A molecule that binds specifically to a receptor."},{"term":"Receptor","meaning":"A host component recognized and bound by a microbial ligand."}],"diagramGuide":["The binding pair is asymmetric: the receptor is a host-cell component and the ligand/adhesin is microbial."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In a bacterial attachment pair, which component is expected on the microbe?","options":["MHC class I","Complement C3 made by the bacterium","Adhesin ligand","Host receptor"],"answer":2,"explanation":"The microbial ligand/adhesin binds a receptor that is a host-cell component."},{"type":"mcq","q":"During bacterial adherence, the receptor is generally located on the _____ and the ligand on the _____.","options":["microbe; host cell","antibody; erythrocyte","capsule; lysosome","host cell; microbe"],"answer":3,"explanation":"Adherence commonly involves a microbial ligand or adhesin binding a receptor on the host cell."}]}},{"page":295,"lecture":"Host Pathogen Interaction","slideInLecture":37,"title":"M protein in Group A Streptococcus","explain":"Group A Streptococcus uses surface M protein in adherence and immune evasion. M protein helps interactions with fibronectin, promoting attachment and invasion. It also recruits host proteins such as fibrinogen, albumin and plasminogen, forming a cloak that hides bacterial epitopes and changes antibody access.","mustKnow":["M protein is a virulence factor of Group A Streptococcus.","Fibronectin binding promotes attachment and invasion.","A host-protein cloak can hide bacterial epitopes from antibodies.","M protein contributes to both adherence and immune evasion."],"terms":[{"term":"M protein","meaning":"Major surface virulence protein of Group A Streptococcus."},{"term":"Fibronectin","meaning":"A host extracellular-matrix protein that bacteria can exploit for attachment."},{"term":"Epitope","meaning":"The specific part of an antigen recognized by an antibody or receptor."},{"term":"Host-protein cloak","meaning":"Layer of recruited host proteins that masks a pathogen's surface."}],"diagramGuide":["The diagram places GAS M protein on the bacterial surface, binding host proteins such as fibronectin; the resulting cloak changes antibody access and supports adherence/invasion."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which host-protein recruitment would most directly create the M-protein cloak shown for GAS?","options":["Caspase coating an epithelial receptor","Fibronectin/fibrinogen coating the bacterial surface","Peptidoglycan coating the host nucleus","LPS coating a Gram-positive cell"],"answer":1,"explanation":"M protein recruits host proteins including fibronectin and fibrinogen, masking bacterial epitopes."},{"type":"mcq","q":"M protein is a virulence factor associated with:","options":["Mycobacterium leprae","Clostridium perfringens","Group A Streptococcus","Vibrio cholerae"],"answer":2,"explanation":"M protein is a major surface virulence factor of Group A Streptococcus."},{"type":"mcq","q":"Which host extracellular-matrix protein is specifically linked to M-protein-mediated adherence and invasion?","options":["Tubulin","Fibronectin","Keratin","Elastin"],"answer":1,"explanation":"Binding to fibronectin promotes attachment to and invasion of epithelial and endothelial cells."}]}},{"page":296,"lecture":"Host Pathogen Interaction","slideInLecture":38,"title":"Why adherence matters","explain":"Attachment lets microbes remain at a favorable site long enough to colonize and cause disease. Because adhesin–receptor binding is selective, it can determine which host species or tissue a pathogen infects. Blocking adherence is therefore a possible treatment strategy.","mustKnow":["Adherence supports colonization and disease.","Receptor availability contributes to host and tissue specificity.","Adhesins or their receptor interactions can be drug targets."],"terms":[{"term":"Host specificity","meaning":"Restriction of a pathogen to particular host species."},{"term":"Tissue tropism","meaning":"Preference of a pathogen for particular tissues or cell types."},{"term":"Drug target","meaning":"A molecule or interaction whose inhibition can reduce disease."}],"diagramGuide":["The receptor-ligand cartoon explains host specificity: adherence succeeds only when a microbial adhesin matches a receptor on the host tissue."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why can the same bacterial adhesin colonize one tissue but not another?","options":["Its matching host receptor is tissue-restricted","All tissues have identical receptors","Adherence occurs without molecular binding","The capsule determines blood group"],"answer":0,"explanation":"Tissue distribution of the matching host receptor helps determine tropism and host specificity."},{"type":"mcq","q":"Host specificity of an adherent pathogen is strongly influenced by:","options":["Distribution of the matching host receptor","The host's erythrocyte count","Lysosomal pH in every tissue","The pathogen's ATP concentration"],"answer":0,"explanation":"A pathogen can efficiently attach only where its adhesin's matching receptor is available."}]}},{"page":297,"lecture":"Host Pathogen Interaction","slideInLecture":39,"title":"Bacterial capsules","explain":"A capsule is an organized outer layer, usually made of polysaccharide, located outside the bacterial cell wall. It can promote attachment and protect bacteria from host defenses. Encapsulated pathogens listed here include Streptococcus pneumoniae, Haemophilus influenzae and Bacillus anthracis.","mustKnow":["A capsule lies outside the bacterial cell wall.","Most bacterial capsules are polysaccharide-rich.","Capsules can aid attachment and immune evasion.","S. pneumoniae, H. influenzae and B. anthracis are examples shown."],"terms":[{"term":"Capsule","meaning":"Organized protective layer external to a bacterial cell wall."},{"term":"Polysaccharide","meaning":"A long carbohydrate polymer; a common capsule material."},{"term":"Encapsulated bacterium","meaning":"A bacterium surrounded by a distinct capsule."}],"diagramGuide":["The capsule is the outer polysaccharide layer beyond the cell wall; the slide links it to attachment and evasion of host defenses."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which structural description identifies a capsule?","options":["Lipid bilayer inside the cytoplasm","Protein shell surrounding the nucleus","Peptidoglycan located inside ribosomes","Polysaccharide layer external to the cell wall"],"answer":3,"explanation":"The capsule is shown as an outer polysaccharide layer outside the bacterial cell wall."},{"type":"mcq","q":"Where is a bacterial capsule located?","options":["Inside the nucleoid","Between DNA strands","Within the ribosome","Outside the cell wall"],"answer":3,"explanation":"A capsule is an external layer surrounding the bacterial cell wall."},{"type":"mcq","q":"Which organism is listed as an encapsulated bacterial example?","options":["Mycobacterium leprae","Clostridium perfringens","Streptococcus pneumoniae","Vibrio cholerae"],"answer":2,"explanation":"The slide lists S. pneumoniae, H. influenzae, and B. anthracis as capsule-bearing examples."}]}},{"page":298,"lecture":"Host Pathogen Interaction","slideInLecture":40,"title":"Capsules can mask PAMP recognition","explain":"Innate immune cells use pattern-recognition receptors such as Toll-like receptors to detect conserved pathogen-associated molecular patterns. TLR4 recognizes bacterial lipopolysaccharide. A capsule can cover underlying microbial patterns, reducing receptor access and weakening early immune activation.","mustKnow":["PAMPs are conserved microbial features recognized by innate immunity.","TLRs are pattern-recognition receptors.","TLR4 recognizes bacterial LPS.","A capsule may mask PAMPs and reduce recognition."],"terms":[{"term":"PAMP","meaning":"Pathogen-associated molecular pattern: a conserved microbial structure sensed by innate immunity."},{"term":"TLR","meaning":"Toll-like receptor, a family of pattern-recognition receptors."},{"term":"TLR4","meaning":"A receptor best known for detecting bacterial lipopolysaccharide."},{"term":"LPS","meaning":"Lipopolysaccharide, a major outer-membrane component of Gram-negative bacteria."}],"diagramGuide":["In the normal route, bacterial PAMP recognition by a TLR activates signaling and inflammatory cytokines; the capsule blocks access, so the crossed-out route produces little/no response."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"If a capsule masks an LPS-containing surface from the pathway shown, which recognition event is reduced?","options":["Fas binding to Fas ligand","GPCR binding to epinephrine","TLR4 detection of a PAMP","T-cell receptor binding to peptide-MHC"],"answer":2,"explanation":"The slide specifically identifies LPS as a PAMP recognized by TLR4."},{"type":"mcq","q":"TLR4 is shown recognizing which bacterial PAMP?","options":["Collagen","Lipopolysaccharide","Fibronectin","M protein"],"answer":1,"explanation":"TLR4 is a pattern-recognition receptor for bacterial LPS."},{"type":"mcq","q":"How can a capsule reduce innate immune recognition?","options":["By masking underlying PAMPs","By producing host MHC class I","By activating caspase-9","By converting T cells into macrophages"],"answer":0,"explanation":"The capsule can physically conceal microbial patterns from host pattern-recognition receptors."}]}},{"page":299,"lecture":"Host Pathogen Interaction","slideInLecture":41,"title":"Capsules inhibit phagocytosis","explain":"Phagocytes ingest bacteria more efficiently when the microbial surface is directly recognizable or coated with opsonins. A capsule can hide binding targets and prevent close receptor contact, making attachment and engulfment less efficient.","mustKnow":["Capsules can reduce phagocyte binding to bacteria.","Reduced binding leads to reduced engulfment.","Opsonization can improve phagocytosis of encapsulated bacteria."],"terms":[{"term":"Opsonization","meaning":"Coating a target with molecules that make it easier for phagocytes to bind and ingest."},{"term":"Opsonin","meaning":"A molecule, such as certain antibodies or complement fragments, that promotes phagocytosis."},{"term":"Antiphagocytic","meaning":"Able to resist or inhibit engulfment by phagocytes."}],"diagramGuide":["Compare left and right: complement C3b opsonization promotes binding to the phagocyte; the capsule interferes with opsonization/binding and therefore uptake."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In the opsonization diagram, loss of surface C3b deposition would first reduce:","options":["Lysosomal acidification","Binding of the bacterium to the phagocyte","Bacterial DNA replication","Host collagen synthesis"],"answer":1,"explanation":"Opsonin deposition promotes phagocyte binding, so blocking it impairs attachment before engulfment."},{"type":"mcq","q":"What is the main effect of a capsule on phagocytosis?","options":["It increases lysosomal enzyme activity","It exposes more PAMPs","It converts complement into antibody","It reduces phagocyte attachment and engulfment"],"answer":3,"explanation":"Capsules hinder effective contact between a phagocyte and the bacterial surface."},{"type":"mcq","q":"Which surface coating can restore efficient recognition of an encapsulated bacterium by phagocytes?","options":["Gsα","Lipid A","C3b","eEF-2"],"answer":2,"explanation":"C3b is an opsonin; phagocytes bind it through complement receptors to improve engulfment."}]}},{"page":300,"lecture":"Host Pathogen Interaction","slideInLecture":42,"title":"Capsules can support survival after engulfment","explain":"Some capsules protect bacteria even after they enter a phagocyte. The capsule can reduce access or effectiveness of lysosomal enzymes and other antimicrobial factors, allowing the bacterium to resist digestion inside the phagolysosomal pathway.","mustKnow":["Some encapsulated bacteria resist intracellular digestion.","Capsules may reduce damage by lysosomal enzymes.","Engulfment does not guarantee microbial killing."],"terms":[{"term":"Intracellular survival","meaning":"Persistence of a microbe inside a host cell despite antimicrobial mechanisms."},{"term":"Lysosomal enzyme","meaning":"An acidic-compartment enzyme that degrades biological material."},{"term":"Phagocyte evasion","meaning":"A microbial strategy that prevents engulfment, killing or digestion by phagocytes."}],"diagramGuide":["The bacterium is already inside a phagocyte, but its capsule resists lysosomal enzyme action; engulfment therefore does not guarantee killing."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A bacterium is visible inside a phagosome but remains viable. Which capsule-associated step has most likely failed?","options":["Effective lysosomal digestion","Initial exposure to a host receptor","Release through a portal of exit","Synthesis of cytokines by the liver"],"answer":0,"explanation":"The diagram shows capsule-mediated resistance to lysosomal digestion after uptake."},{"type":"mcq","q":"A capsule can promote intracellular survival after engulfment by increasing resistance to:","options":["Mitochondrial ATP synthesis","Lysosomal enzymes","Host ribosomes","Plasma antibodies only"],"answer":1,"explanation":"Some capsules protect engulfed bacteria from digestion by lysosomal enzymes."}]}},{"page":301,"lecture":"Host Pathogen Interaction","slideInLecture":43,"title":"Biofilms and Quorum Sensing","explain":"A biofilm is a surface-associated microbial community. Quorum sensing lets bacteria detect population density and change gene expression together, which helps coordinate biofilm behavior.","mustKnow":["Biofilms are organized bacterial communities.","Quorum sensing links population density to altered gene expression."],"terms":[{"term":"Biofilm","meaning":"A community of microorganisms attached to a surface."},{"term":"Quorum sensing","meaning":"Population-density sensing that changes bacterial gene expression."}],"diagramGuide":["Follow the biofilm stages left to right: attachment, initial adherence, microcolony/biofilm maturation, then dispersal.","Quorum sensing coordinates density-dependent gene expression during community development."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which biofilm stage supplies cells that can colonize a new site?","options":["Initial attachment","Irreversible attachment","Maturation only","Dispersal"],"answer":3,"explanation":"The last panel shows cells leaving the mature community during dispersal."},{"type":"mcq","q":"Quorum sensing allows bacteria to alter gene expression in response to:","options":["Population density","Host blood group","Atmospheric pressure","Chromosome number"],"answer":0,"explanation":"Accumulating signaling molecules let bacteria estimate local cell density and coordinate gene expression."},{"type":"mcq","q":"What best defines a biofilm?","options":["A single bacterium in plasma","A host-cell apoptotic body","A soluble bacterial exotoxin","An organized surface-associated microbial community"],"answer":3,"explanation":"Biofilms are structured microbial communities, usually attached to a surface and embedded in a matrix."}]}},{"page":302,"lecture":"Host Pathogen Interaction","slideInLecture":44,"title":"Breaching the Mucus Barrier","explain":"Mucus keeps many pathogens away from host-cell surfaces. To attach to or invade those cells, a pathogen often must first cross or disrupt this protective barrier.","mustKnow":["Mucus is a physical host barrier.","Breaching mucus can be necessary for access to host cells."],"terms":[{"term":"Mucus barrier","meaning":"A protective secretion that limits microbial access to underlying cells."},{"term":"Barrier breach","meaning":"Crossing or disrupting a host defense layer."}],"diagramGuide":["The diagram is layered: mucus is the first barrier, epithelial cells lie below it, and basement membrane is deeper. Pathogens must cross mucus to contact cell receptors."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"After crossing the mucus layer, which structure does a pathogen encounter next in the displayed tissue arrangement?","options":["Lymph-node germinal center","Mitochondrial matrix","Epithelial cell surface","Bone marrow"],"answer":2,"explanation":"The diagram places the epithelial surface directly beneath mucus."}]}},{"page":303,"lecture":"Host Pathogen Interaction","slideInLecture":45,"title":"Bacterial Enzymes as Virulence Factors","explain":"Pathogenic bacteria can produce enzymes that change host barriers or defenses. The listed groups are coagulase and kinases, hyaluronidase and collagenase, and IgA protease.","mustKnow":["Bacterial enzymes can promote invasion or immune evasion.","Know the three listed enzyme groups."],"terms":[{"term":"Virulence factor","meaning":"A microbial feature that helps cause disease."},{"term":"IgA protease","meaning":"A bacterial enzyme that cleaves the antibody IgA."}],"diagramGuide":["The brick wall represents connective-tissue barriers; the listed enzymes are grouped by what they help bacteria overcome: clotting, matrix, or mucosal antibody."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which enzyme is best matched to escape from a mucosal IgA defense rather than connective-tissue spread?","options":["Coagulase","IgA protease","Collagenase","Hyaluronidase"],"answer":1,"explanation":"IgA protease targets mucosal antibody; collagenase and hyaluronidase target matrix."},{"type":"mcq","q":"Which bacterial enzyme directly targets a mucosal antibody?","options":["Coagulase","Hyaluronidase","IgA protease","Collagenase"],"answer":2,"explanation":"IgA protease cleaves secretory IgA and helps pathogens evade mucosal immunity."},{"type":"mcq","q":"Which pair of enzymes primarily promotes spread through connective tissue?","options":["Caspase-8 and caspase-9","Hyaluronidase and collagenase","Coagulase and IgA protease","Lysozyme and perforin"],"answer":1,"explanation":"Hyaluronidase and collagenase digest connective-tissue components and facilitate invasion."}]}},{"page":304,"lecture":"Host Pathogen Interaction","slideInLecture":46,"title":"Hyaluronidase and Collagenase","explain":"These enzymes digest components of connective tissue, making tissue invasion easier. The slide associates hyaluronidase with Staphylococcus aureus and Streptococcus pyogenes, and collagenase with Clostridium perfringens.","mustKnow":["Both enzymes support invasion by digesting connective tissue.","Hyaluronidase: S. aureus and S. pyogenes.","Collagenase: C. perfringens and gas gangrene."],"terms":[{"term":"Hyaluronidase","meaning":"An enzyme that helps break down connective-tissue material."},{"term":"Collagenase","meaning":"An enzyme that breaks down collagen."},{"term":"Gas gangrene","meaning":"A severe tissue infection associated here with C. perfringens."}],"diagramGuide":["Hyaluronidase digests hyaluronic-acid-rich ground substance; collagenase digests collagen. Both open paths through connective tissue.","The examples pair hyaluronidase with S. aureus/S. pyogenes and collagenase with C. perfringens."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A pathogen spreads through collagen-rich deep tissue. Which listed enzyme is the closest mechanistic match?","options":["Collagenase","Coagulase","IgA protease","Streptokinase"],"answer":0,"explanation":"Collagenase digests collagen and is linked on the slide to tissue invasion."},{"type":"mcq","q":"Which enzyme-organism association is correct?","options":["Collagenase—Clostridium perfringens","Collagenase—Vibrio cholerae","Hyaluronidase—Mycobacterium leprae","Hyaluronidase—Bacillus anthracis only"],"answer":0,"explanation":"C. perfringens produces collagenase, supporting deep-tissue spread in gas gangrene."},{"type":"mcq","q":"Hyaluronidase is listed for both Staphylococcus aureus and:","options":["Vibrio cholerae","Mycobacterium tuberculosis","Haemophilus influenzae","Streptococcus pyogenes"],"answer":3,"explanation":"The slide associates hyaluronidase with S. aureus and S. pyogenes."}]}},{"page":305,"lecture":"Host Pathogen Interaction","slideInLecture":47,"title":"Coagulase and Streptokinase","explain":"Coagulase promotes clot formation around bacteria, which can reduce access by phagocytes, immune factors, and antibiotics. Streptokinase has the opposite clot-related use: it is used clinically to dissolve clots.","mustKnow":["Coagulase can shield bacteria from host defenses.","Coagulase-producing S. aureus strains are associated with pathogenicity.","Streptokinase is used to dissolve clots."],"terms":[{"term":"Coagulase","meaning":"A bacterial enzyme that promotes clot formation."},{"term":"Streptokinase","meaning":"A clot-dissolving bacterial protein used clinically."},{"term":"Phagocytosis","meaning":"Engulfment and digestion of microbes by host cells."}],"diagramGuide":["The left-to-right clot sequence contrasts coagulase, which creates a protective clot, with kinase/streptokinase, which dissolves clots and permits spread.","The checks connect clot formation with reduced phagocyte, immune, and antibiotic access."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which contrast between the two enzyme types is correct?","options":["Both enzymes exclusively form clots","Coagulase dissolves clots; streptokinase makes capsules","Both enzymes digest IgA","Coagulase forms a protective clot; streptokinase dissolves clots"],"answer":3,"explanation":"The figure contrasts coagulase-driven clot formation with kinase-mediated clot dissolution."},{"type":"mcq","q":"How does coagulase help Staphylococcus aureus evade host defenses?","options":["It digests collagen","It blocks eEF-2","It promotes a clot-like protective barrier","It cleaves secretory IgA"],"answer":2,"explanation":"Coagulase-driven clot formation can shield bacteria from phagocytes, immune factors, and antibiotics."},{"type":"mcq","q":"What is the clinical use of streptokinase stated on the slide?","options":["Inducing antibody class switching","Dissolving blood clots during heart attacks","Blocking bacterial translation","Treating gastric acidity"],"answer":1,"explanation":"Streptokinase is a thrombolytic enzyme used to dissolve clots."}]}},{"page":306,"lecture":"Host Pathogen Interaction","slideInLecture":48,"title":"Basic Bacterial Cell-Wall Structure","explain":"The bacterial cell wall is an outer layer containing peptidoglycan, a network built from sugars and amino acids. Surface proteins may also be carried on the wall.","mustKnow":["Peptidoglycan contains sugars and amino acids.","The cell wall can display surface proteins."],"terms":[{"term":"Peptidoglycan","meaning":"A sugar-and-amino-acid polymer that forms the bacterial cell wall."},{"term":"Surface protein","meaning":"A protein exposed or attached at the bacterial surface."}],"diagramGuide":["The envelope diagram places peptidoglycan outside the cytoplasmic membrane; surface proteins may project from or associate with the wall."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which wall component is explicitly composed of sugars and amino acids?","options":["Lipid A","Cholesterol","Peptidoglycan","Mycolic acid"],"answer":2,"explanation":"Peptidoglycan is identified as the sugar-and-amino-acid wall polymer."},{"type":"mcq","q":"Peptidoglycan is composed principally of:","options":["Sugars and amino acids","Lipids and RNA","DNA and cholesterol","Cellulose and glycogen"],"answer":0,"explanation":"Peptidoglycan is a mesh-like polymer containing sugar chains cross-linked by short peptides."}]}},{"page":307,"lecture":"Host Pathogen Interaction","slideInLecture":49,"title":"Mycolic Acid Resists Lysosomal Digestion","explain":"Mycolic acid in the cell wall helps some bacteria resist digestion by lysosomal enzymes after they are engulfed. The examples given are Mycobacterium tuberculosis and Mycobacterium leprae.","mustKnow":["Mycolic acid increases resistance to lysosomal digestion.","M. tuberculosis and M. leprae contain mycolic acid in their walls."],"terms":[{"term":"Mycolic acid","meaning":"A waxy cell-wall lipid that helps mycobacteria resist degradation."},{"term":"Lysosomal enzyme","meaning":"A degradative enzyme inside a lysosome."}],"diagramGuide":["The phagocyte diagram shows mycobacteria surviving after uptake because the mycolic-acid-rich wall resists lysosomal digestion."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which organisms on the slide gain lysosomal resistance from a mycolic-acid-rich wall?","options":["Clostridium perfringens and Bacillus anthracis","Mycobacterium tuberculosis and M. leprae","Vibrio cholerae and E. coli","Streptococcus pyogenes and S. pneumoniae"],"answer":1,"explanation":"The two listed examples are M. tuberculosis and M. leprae."},{"type":"mcq","q":"Mycolic acid contributes to virulence chiefly by increasing resistance to:","options":["Host-cell attachment","Antibody synthesis","Blood coagulation","Lysosomal digestion"],"answer":3,"explanation":"The mycolic-acid-rich wall helps mycobacteria withstand lysosomal degradation."}]}},{"page":308,"lecture":"Host Pathogen Interaction","slideInLecture":50,"title":"Invasins and Membrane Ruffling","explain":"Invasins are pathogen surface proteins that rearrange actin in the host-cell cytoskeleton. This produces membrane ruffling and helps the microbe enter the cell.","mustKnow":["Invasins are pathogen surface proteins.","They alter host actin filaments.","Actin rearrangement enables microbial entry."],"terms":[{"term":"Invasin","meaning":"A microbial surface protein that promotes entry into host cells."},{"term":"Membrane ruffling","meaning":"Actin-driven folding or movement of the host plasma membrane."},{"term":"Actin","meaning":"A cytoskeletal protein involved in cell shape and movement."}],"diagramGuide":["Follow the arrows: bacterial invasin signals to host actin, membrane ruffles rise around the bacterium, the bacterium is enclosed, and then enters the cell."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In the membrane-ruffling sequence, which host component is rearranged directly by invasin-triggered signaling?","options":["Actin cytoskeleton","Peptidoglycan wall","Nuclear DNA polymerase","Lysosomal cathepsin"],"answer":0,"explanation":"Invasins alter host actin filaments, driving membrane ruffles around the microbe."},{"type":"mcq","q":"Invasin-triggered membrane ruffling allows microbial entry by rearranging:","options":["Host collagen fibers","Microbial ribosomes","Host actin filaments","Bacterial peptidoglycan"],"answer":2,"explanation":"Invasins trigger signaling that reorganizes the host actin cytoskeleton and drives membrane engulfment."}]}},{"page":309,"lecture":"Host Pathogen Interaction","slideInLecture":51,"title":"Toxins, Toxigenicity, and Toxemia","explain":"A toxin is a poisonous substance produced by a microorganism. Toxigenicity is the organism's ability to produce toxins, while toxemia means toxins are present in the blood.","mustKnow":["Toxin: poisonous microbial product.","Toxigenicity: ability to produce toxin.","Toxemia: toxin present in blood."],"terms":[{"term":"Toxin","meaning":"A poisonous substance produced by a microorganism."},{"term":"Toxigenicity","meaning":"The ability of a microorganism to produce toxins."},{"term":"Toxemia","meaning":"The presence of toxins in the bloodstream."}],"diagramGuide":["The lower cartoons contrast exotoxin secretion from a living bacterium with endotoxin as part of the outer envelope released especially when cells break down."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which statement distinguishes exotoxin from endotoxin in the lower diagrams?","options":["Both are host antibodies","Endotoxin is secreted only by living Gram-positive cells","Exotoxin is the lipid A portion of LPS","Exotoxin is secreted protein; endotoxin is part of the bacterial outer envelope"],"answer":3,"explanation":"The slide contrasts secreted exotoxin with envelope-associated endotoxin."},{"type":"mcq","q":"What is toxigenicity?","options":["The capacity of a phagocyte to ingest bacteria","The ability of a microorganism to produce toxins","The presence of toxin in blood","The host response to a capsule"],"answer":1,"explanation":"Toxigenicity denotes toxin-producing ability."},{"type":"mcq","q":"What does toxemia mean?","options":["Presence of toxins in the blood","Presence of bacteria in a biofilm","Loss of MHC class I","Release of antibodies into mucus"],"answer":0,"explanation":"Toxemia specifically refers to circulating toxin in blood."}]}},{"page":310,"lecture":"Host Pathogen Interaction","slideInLecture":52,"title":"Diphtheria Toxin Blocks Translation","explain":"Diphtheria toxin is an A-B toxin. After receptor-mediated endocytosis and acid-triggered translocation, fragment A enters the cytoplasm and ADP-ribosylates eEF-2, stopping protein translation and killing the host cell.","mustKnow":["Diphtheria toxin is an A-B toxin.","Fragment A modifies eEF-2.","The result is inhibition of protein synthesis."],"terms":[{"term":"A-B toxin","meaning":"A toxin with an active component and a cell-binding or delivery component."},{"term":"eEF-2","meaning":"A eukaryotic elongation factor required for protein translation."},{"term":"ADP-ribosylation","meaning":"Covalent addition of an ADP-ribose group to a target protein."}],"diagramGuide":["Follow the A-B toxin route: receptor binding and endocytosis, endosomal acidification, A-fragment translocation, then eEF-2 ADP-ribosylation and halted translation."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Diphtheria toxin fragment A reaches the cytosol. Which substrate modification causes translation arrest?","options":["Cleavage of GM1 ganglioside","Acetylation of peptidoglycan","ADP-ribosylation of eEF-2","Phosphorylation of actin"],"answer":2,"explanation":"Fragment A ADP-ribosylates eEF-2, preventing protein synthesis."},{"type":"mcq","q":"How does diphtheria toxin enter a host cell?","options":["Passive diffusion through the nucleus","Complement-mediated lysis","Phagocytosis by an erythrocyte","Receptor-mediated endocytosis"],"answer":3,"explanation":"After receptor binding, the toxin is internalized by receptor-mediated endocytosis."},{"type":"mcq","q":"Diphtheria toxin fragment A halts translation by ADP-ribosylating:","options":["TLR4","Caspase-8","eEF-2","Gsα"],"answer":2,"explanation":"Modification of the diphthamide residue of eEF-2 prevents protein elongation."}]}},{"page":311,"lecture":"Host Pathogen Interaction","slideInLecture":53,"title":"Cholera Toxin Raises cAMP","explain":"Cholera toxin is an AB5 toxin: five B subunits bind GM1 and deliver the active A1 fragment. A1 locks Gs alpha in its active GTP-bound state, keeping adenylyl cyclase active. The resulting cAMP surge drives ion and water loss into the intestine, causing diarrhea.","mustKnow":["Cholera toxin has one active A subunit and five binding B subunits.","It keeps Gs alpha active and raises cAMP.","High cAMP causes ion and water efflux into the intestine."],"terms":[{"term":"AB5 toxin","meaning":"A toxin containing one active A subunit and five receptor-binding B subunits."},{"term":"GM1","meaning":"The cell-surface receptor bound by cholera toxin B subunits."},{"term":"cAMP","meaning":"A second messenger produced by adenylyl cyclase."}],"diagramGuide":["The AB5 diagram shows five B subunits binding GM1 and one enzymatic A subunit entering the cell.","The signaling chain is persistent Gs activation to adenylyl cyclase to high cAMP to ion/water secretion into the intestine."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which molecular event lies directly between cholera-toxin entry and the cAMP surge?","options":["Polymerization of peptidoglycan","Persistent activation of Gs alpha","Inactivation of all adenylyl cyclase","Cleavage of eEF-2"],"answer":1,"explanation":"A1 locks Gs alpha active, which persistently stimulates adenylyl cyclase."},{"type":"mcq","q":"Which receptor is bound by the B pentamer of cholera toxin?","options":["TLR4","GM1 ganglioside","TNFR1","Fas"],"answer":1,"explanation":"The five B subunits bind GM1 receptors and promote toxin internalization."},{"type":"mcq","q":"Cholera toxin causes persistent activation of adenylyl cyclase by locking which protein in its active GTP-bound state?","options":["Gsα","BAX","eEF-2","FADD"],"answer":0,"explanation":"The A1 fragment modifies Gsα, causing persistent adenylyl cyclase activity and high cAMP."}]}},{"page":312,"lecture":"Host Pathogen Interaction","slideInLecture":54,"title":"How GPCR Signaling Begins","explain":"G protein-coupled receptors have seven membrane-spanning helices. Ligand binding activates a trimeric G protein, which then regulates an effector such as adenylyl cyclase.","mustKnow":["GPCRs have seven transmembrane helices.","They activate trimeric G proteins after ligand binding.","Adenylyl cyclase is one possible downstream effector."],"terms":[{"term":"GPCR","meaning":"A seven-transmembrane receptor that signals through G proteins."},{"term":"Trimeric G protein","meaning":"A signaling protein complex with alpha, beta, and gamma subunits."},{"term":"Effector","meaning":"A downstream protein whose activity is changed by a signal."}],"diagramGuide":["The receptor crosses the membrane seven times; ligand binding changes the cytosolic face, where it activates a heterotrimeric G protein that regulates an effector such as adenylyl cyclase."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A receptor has seven transmembrane helices and activates a trimeric G protein. Which effector shown may be activated next?","options":["Adenylyl cyclase","Peptidoglycan synthase","Caspase-9 apoptosome","Lysosomal collagenase"],"answer":0,"explanation":"The GPCR diagram shows activated G protein regulating an effector such as adenylyl cyclase."},{"type":"mcq","q":"How many transmembrane helices characterize a typical GPCR?","options":["One","Three","Twelve","Seven"],"answer":3,"explanation":"GPCRs contain seven membrane-spanning alpha helices."},{"type":"mcq","q":"A ligand-bound GPCR directly activates which intracellular signaling component?","options":["A B-cell antibody","A bacterial capsule","A trimeric G protein","A lysosomal cathepsin"],"answer":2,"explanation":"The activated receptor promotes nucleotide exchange and activation of a heterotrimeric G protein."}]}},{"page":313,"lecture":"Host Pathogen Interaction","slideInLecture":55,"title":"GPCR Amplification and Shutoff","explain":"An activated G protein can stimulate an effector to generate many second-messenger molecules, amplifying the signal. Signaling stops when the G alpha subunit hydrolyzes GTP, and receptor phosphorylation plus arrestin binding attenuates further receptor signaling.","mustKnow":["Effector activation can amplify the original signal.","GTP hydrolysis on G alpha helps stop signaling.","Receptor phosphorylation and arrestin produce attenuation."],"terms":[{"term":"Signal amplification","meaning":"Production of a larger intracellular response from a smaller initial signal."},{"term":"Signal attenuation","meaning":"Reduction of signaling despite continued or repeated stimulation."},{"term":"Arrestin","meaning":"A protein that binds phosphorylated GPCRs and limits further G-protein activation."}],"diagramGuide":["The left panels show signal amplification: one receptor activates multiple G proteins and effectors. The right panels show cessation/attenuation as GTP is hydrolyzed and components reset."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which event terminates the active alpha-subunit state in the GPCR cycle?","options":["Exchange of GDP for GTP","Ligand binding to the receptor","Activation of adenylyl cyclase","Hydrolysis of bound GTP to GDP"],"answer":3,"explanation":"GTP hydrolysis returns the alpha subunit to the inactive GDP-bound state and attenuates signaling."},{"type":"mcq","q":"Which intrinsic activity of Gα helps terminate GPCR signaling?","options":["Protein glycosylation","GTP hydrolysis","ATP synthesis","DNA cleavage"],"answer":1,"explanation":"Gα hydrolyzes bound GTP to GDP and returns to its inactive state."},{"type":"mcq","q":"Which combination produces receptor-level attenuation after prolonged GPCR activation?","options":["Receptor phosphorylation and arrestin binding","Perforin release and granzyme entry","BAX activation and cytochrome c release","C3b deposition and phagocytosis"],"answer":0,"explanation":"Phosphorylation enables arrestin binding, which uncouples the receptor from further G-protein activation."}]}},{"page":314,"lecture":"Host Pathogen Interaction","slideInLecture":56,"title":"Endotoxin Is Lipid A of LPS","explain":"In Gram-negative bacteria, the lipid A portion of lipopolysaccharide acts as endotoxin and contributes importantly to disease.","mustKnow":["Endotoxin is the lipid A portion of LPS.","LPS is associated with the Gram-negative bacterial cell wall."],"terms":[{"term":"Endotoxin","meaning":"The inflammatory lipid A component of Gram-negative LPS."},{"term":"LPS","meaning":"Lipopolysaccharide, a major component of the Gram-negative outer membrane."},{"term":"Lipid A","meaning":"The endotoxin-containing lipid portion of LPS."}],"diagramGuide":["The envelope diagram locates LPS in the outer membrane of Gram-negative bacteria; lipid A is the membrane-anchored toxic portion."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which nested identification is correct?","options":["Endotoxin = secreted A subunit of cholera toxin","Endotoxin = bacterial capsule polysaccharide","Endotoxin = lipid A portion of LPS in Gram-negative outer membrane","Endotoxin = peptidoglycan of Gram-positive cytoplasm"],"answer":2,"explanation":"The slide identifies lipid A within LPS as Gram-negative endotoxin."},{"type":"mcq","q":"The toxic portion of Gram-negative lipopolysaccharide is:","options":["Peptidoglycan","M protein","Mycolic acid","Lipid A"],"answer":3,"explanation":"Endotoxin activity resides in the lipid A component of LPS."}]}},{"page":315,"lecture":"Host Pathogen Interaction","slideInLecture":57,"title":"How Endotoxin Is Released","explain":"Endotoxin can be released when Gram-negative bacteria are broken down. The listed causes are complement-mediated lysis, phagocytic digestion, and antibiotic use.","mustKnow":["Bacterial breakdown can release endotoxin.","Complement lysis, phagocytic digestion, and antibiotics are listed release routes."],"terms":[{"term":"Complement-mediated lysis","meaning":"Destruction of a microbial cell by complement proteins."},{"term":"Phagocytic digestion","meaning":"Breakdown of engulfed microbes inside a phagocyte."}],"diagramGuide":["The broken bacterium icon represents endotoxin release during bacterial lysis/digestion; listed causes include complement, phagocytes, and antibiotic treatment."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why can antibiotic treatment transiently increase exposure to endotoxin?","options":["Host cells begin producing LPS","Bacterial damage/lysis releases LPS-associated lipid A","Antibiotics convert exotoxin into antibody","Antibiotics synthesize new capsules"],"answer":1,"explanation":"Breakdown of Gram-negative bacteria can release envelope-associated endotoxin."},{"type":"mcq","q":"Which process can release endotoxin from Gram-negative bacteria?","options":["T-cell receptor rearrangement","Host collagen synthesis","Complement-mediated bacterial lysis","Antibody class switching"],"answer":2,"explanation":"Bacterial breakdown by complement, phagocytes, or antibiotics can release LPS/endotoxin."}]}},{"page":316,"lecture":"Host Pathogen Interaction","slideInLecture":58,"title":"Effects of Endotoxin","explain":"Endotoxin stimulates inflammatory signaling and cytokine secretion. The slide links this response with fever and effects involving the blood-brain barrier.","mustKnow":["Endotoxin promotes inflammation.","It stimulates cytokine secretion.","Fever is a major outcome."],"terms":[{"term":"Cytokine","meaning":"A secreted signaling protein that coordinates immune and inflammatory responses."},{"term":"Inflammation","meaning":"A coordinated host response to infection or tissue damage."},{"term":"Blood-brain barrier","meaning":"A selective barrier between circulating blood and brain tissue."}],"diagramGuide":["The central endotoxin node branches to cytokine secretion, inflammation, fever, and blood-brain-barrier effects; cytokines mediate several downstream effects."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which mediator most directly links endotoxin sensing to the multiple branches shown?","options":["Cytokine secretion","Bacterial collagen synthesis","Antibody gene rearrangement","Erythrocyte enucleation"],"answer":0,"explanation":"The diagram places cytokine secretion downstream of endotoxin and upstream of systemic effects."},{"type":"mcq","q":"Which host molecules mediate many systemic effects after endotoxin recognition?","options":["Immunoglobulin light chains only","Cytokines","Histones","Collagens"],"answer":1,"explanation":"Endotoxin induces inflammatory cytokine secretion, which contributes to fever and systemic inflammation."},{"type":"mcq","q":"Which response is most directly associated with endotoxin exposure on the slide?","options":["Fever","Reduced cAMP","Antibody-independent memory","Suppressed inflammation"],"answer":0,"explanation":"Endotoxin is pyrogenic and promotes inflammatory cytokine-driven fever."}]}},{"page":317,"lecture":"Host Pathogen Interaction","slideInLecture":59,"title":"Endotoxin Is Heat Stable","explain":"Endotoxins are pyrogens, meaning they can cause fever. They are heat stable, so killing bacteria by some sterilization methods does not necessarily remove the endotoxin already present.","mustKnow":["Endotoxins are pyrogens.","Endotoxins are heat stable.","Bacterial killing does not guarantee endotoxin removal."],"terms":[{"term":"Pyrogen","meaning":"A substance that can produce fever."},{"term":"Heat stable","meaning":"Not readily destroyed by heating."},{"term":"Sterilization","meaning":"A process intended to eliminate viable microorganisms."}],"diagramGuide":["Read the sequence left to right: macrophage uptake of endotoxin, cytokine release into blood, hypothalamic prostaglandin production, and increased temperature set point.","The red note separates bacterial killing from endotoxin removal because endotoxin is heat stable."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In the pyrogen pathway, cytokines raise temperature by acting through which intermediate site/process?","options":["Bone-marrow peptidoglycan synthesis","Renal capsule formation","Mitochondrial cytochrome-c retention","Hypothalamic prostaglandin production"],"answer":3,"explanation":"The diagram routes cytokine signals to hypothalamic prostaglandins that alter the temperature set point."},{"type":"mcq","q":"Why may killing Gram-negative bacteria fail to make a preparation endotoxin-free?","options":["Dead bacteria synthesize new antibodies","Lipid A is converted into peptidoglycan","Sterilization creates living spores in all cases","Endotoxin can remain after bacterial death"],"answer":3,"explanation":"Endotoxin is a heat-stable bacterial component that may persist even when bacteria have been killed."},{"type":"mcq","q":"A substance that induces fever is termed a:","options":["Adhesin","Invasin","Pyrogen","Opsonin"],"answer":2,"explanation":"Endotoxins are pyrogens because they can induce fever."}]}},{"page":318,"lecture":"Cell Death Pathways","slideInLecture":1,"title":"Lecture 31: Cell Death Pathways","explain":"This lecture introduces major regulated cell-death pathways, including apoptosis, necroptosis, autophagy-related degradation, and ferroptosis.","mustKnow":["The lecture topic is cell death pathways.","The following slides compare distinct mechanisms of cell death."],"terms":[{"term":"Cell-death pathway","meaning":"A defined molecular process that leads to loss of cell viability."}],"diagramGuide":["This is a section divider. The concentric-cell graphic introduces multiple regulated routes of cell death covered in the following slides."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which topic begins with this divider and is developed in the following slides?","options":["Blood-cell hematopoiesis","Mucociliary clearance","Regulated cell-death pathways","Bacterial adherence"],"answer":2,"explanation":"The divider explicitly introduces Lecture 31 on cell-death pathways."}]}},{"page":319,"lecture":"Cell Death Pathways","slideInLecture":2,"title":"Why Programmed Cell Death Is Needed","explain":"Programmed cell death supports normal development and tissue homeostasis, regulates immune-cell populations, removes infected or damaged cells, and responds to cellular stress.","mustKnow":["It shapes tissues during development.","It maintains tissue and immune homeostasis.","It eliminates damaged or infected cells.","It can be triggered by cellular stress."],"terms":[{"term":"Homeostasis","meaning":"Maintenance of stable tissue composition and function."},{"term":"Morphogenesis","meaning":"The biological process that gives tissues and organs their form."},{"term":"Cellular stress","meaning":"A condition that threatens normal cell function or survival."}],"diagramGuide":["The wheel groups physiological uses of programmed death: development/homeostasis, organ shaping, immune regulation, removal of infected or damaged cells, and stress
