","slideInLecture":1,"title":"Cloning vectors and plasmids","explain":"A cloning vector is designed mainly to carry and replicate foreign DNA, not necessarily to express it. Good plasmid vectors are small, easy to introduce, often high-copy, and contain an ori, selectable marker, and MCS. Examples include pBR322 and the pUC series.","mustKnow":["Cloning vectors primarily replicate inserted DNA.","ori influences replication and copy number.","Antibiotic-resistance genes are common selectable markers.","pBR322 and pUC are plasmid-vector examples."],"terms":[{"term":"Copy number","meaning":"Number of vector molecules maintained in one host cell."},{"term":"pBR322","meaning":"Early plasmid vector carrying ampicillin- and tetracycline-resistance markers."},{"term":"pUC","meaning":"High-copy plasmid-vector series used for cloning and blue-white screening."}],"diagramGuide":["On the plasmid map, separate ori, antibiotic-resistance marker, and MCS; each has a distinct job.","The pBR322/pUC examples below illustrate selectable markers and high-copy/blue-white-screening designs."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which vector-feature match is correct?","options":["pBR322—Ampᴿ and Tetᴿ","pUC—low copy number only","MCS—determines host-cell metabolism","ori—blue-white reporter enzyme"],"answer":0,"explanation":"The slide lists pBR322 with ampicillin- and tetracycline-resistance markers."},{"q":"Which plasmid-vector feature primarily determines how many vector molecules accumulate per cell?","options":["Selectable marker","Transcription terminator","Reporter gene","Origin of replication"],"answer":3,"explanation":"The origin of replication controls autonomous replication and influences plasmid copy number."},{"q":"Which feature is characteristic of the pUC vector series?","options":["High copy number and lacZα","Low copy number and no reporter","A YAC centromere","Only tetracycline resistance"],"answer":0,"explanation":"pUC plasmids are high-copy vectors that use lacZα for blue–white screening."}]}},{"page":96,"lecture":"Genetic Engineering Applications 2","slideInLecture":2,"title":"Expression vectors","explain":"An expression vector contains the regulatory elements needed to produce RNA and protein from an inserted gene. In a pET system, the vector enters E. coli, IPTG induces the T7 promoter, the gene is transcribed to mRNA, and the mRNA is translated. Unlike a basic cloning vector, it includes a promoter, translation-initiation signal, and terminator.","mustKnow":["Expression vectors are designed to produce RNA or protein.","They require promoter and translation-control sequences.","IPTG can induce the pET/T7 system.","A cloning vector may maintain DNA without expressing it."],"terms":[{"term":"Expression vector","meaning":"Vector designed to express an inserted gene in a host."},{"term":"RBS","meaning":"Ribosome-binding site used to initiate bacterial translation."},{"term":"IPTG","meaning":"Chemical inducer commonly used to activate lac-controlled expression systems."},{"term":"pET","meaning":"Common E. coli expression-vector system using a T7 promoter."}],"diagramGuide":["The expression-vector map adds promoter, RBS/Kozak sequence, and terminator around the insert.","In the pET map, the T7 promoter drives transcription and the His tag can aid purification."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which element most clearly distinguishes an expression vector from a simple DNA-maintenance vector?","options":["A promoter positioned to drive the insert","An origin of replication","Circular DNA","A selectable marker"],"answer":0,"explanation":"Expression requires transcriptional control of the cloned gene."},{"q":"In a bacterial expression vector, the ribosome-binding site is required primarily for:","options":["Plasmid replication","Translation initiation","Antibiotic selection","Transcription termination"],"answer":1,"explanation":"The ribosome-binding site recruits the bacterial ribosome to initiate translation of the cloned gene."},{"q":"In the pET system, transcription of the cloned gene is driven by a:","options":["KanR promoter","lacZα reporter","T7 promoter","Eukaryotic enhancer"],"answer":2,"explanation":"pET expression vectors place the insert downstream of a T7 promoter."}]}},{"page":97,"lecture":"Genetic Engineering Applications 2","slideInLecture":3,"title":"Selectable markers and reporter genes","explain":"A selectable marker gives vector-containing cells a survival advantage under a selective condition, such as antibiotic resistance. A reporter gene produces a visible or measurable signal. AmpR and KanR are selectable markers; GFP, lacZ, and luciferase are reporters.","mustKnow":["Selection identifies cells that carry the vector by survival.","Reporters produce a detectable signal.","AmpR permits growth on ampicillin.","GFP, lacZ, and luciferase are reporter examples."],"terms":[{"term":"AmpR","meaning":"Ampicillin-resistance selectable marker."},{"term":"GFP","meaning":"Green fluorescent protein used as a reporter."},{"term":"lacZ reporter","meaning":"Reporter used in blue-white colony screening."},{"term":"Luciferase","meaning":"Reporter enzyme that produces light."}],"diagramGuide":["The left half shows survival-based selection on antibiotic; the right half shows visible or measurable reporters.","Growth identifies vector-bearing cells, whereas GFP/lacZ/luciferase reports gene activity or clone status."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which pair contains one selectable marker followed by one reporter?","options":["Ampᴿ, GFP","GFP, Kanᴿ","lacZ, Ampᴿ","Luciferase, Tetᴿ"],"answer":0,"explanation":"Ampicillin resistance enables survival selection; GFP provides a detectable signal."},{"q":"Which reporter–signal pairing is correct?","options":["AmpR–luminescence","lacZ–antibiotic resistance","Luciferase–blue colonies only","GFP–fluorescence"],"answer":3,"explanation":"GFP produces fluorescence; lacZ gives a colorimetric signal and luciferase gives luminescence."}]}},{"page":98,"lecture":"Genetic Engineering Applications 2","slideInLecture":4,"title":"Host systems for recombinant expression","explain":"Host choice depends on the protein and purpose. E. coli is fast, cheap, and high-yield but lacks eukaryotic post-translational modifications. Yeast performs some modifications. Plant cells are scalable but slower. Mammalian cells provide the most appropriate complex modifications and protein quality but are slower and more expensive.","mustKnow":["E. coli is fast and inexpensive but lacks eukaryotic modifications.","Yeast can perform some post-translational modifications.","Plant cells can support scalable production.","Mammalian cells suit complex therapeutic proteins."],"terms":[{"term":"Post-translational modification","meaning":"Chemical processing of a protein after translation, such as glycosylation."},{"term":"CHO cells","meaning":"Mammalian host cells commonly used to produce therapeutic proteins."},{"term":"S. cerevisiae","meaning":"Yeast host used for eukaryotic recombinant expression."}],"diagramGuide":["Read the table by trade-off: E. coli is fast but lacks complex modifications; yeast adds some processing; plant/insect and mammalian cells support increasingly complex proteins.","Host choice follows protein requirements, not simply maximum growth rate."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A protein requires native complex glycosylation and assembly. Which host is the best match from the table?","options":["E. coli","Mammalian cells","Cell-free agarose","Bacteriophage alone"],"answer":1,"explanation":"Mammalian cells best support complex mammalian folding and post-translational modification."},{"q":"Which host is typically favored for rapid, inexpensive expression when complex post-translational processing is unnecessary?","options":["E. coli","Mammalian cells","Plant cells","Insect larvae only"],"answer":0,"explanation":"E. coli grows quickly, is inexpensive, and can produce high protein yields, but lacks eukaryotic processing."},{"q":"Which host-system limitation is correctly matched?","options":["Yeast–cannot perform any protein folding","E. coli–no eukaryotic post-translational modifications","Mammalian cells–cannot secrete proteins","Plant cells–cannot express recombinant DNA"],"answer":1,"explanation":"Bacteria generally cannot perform complex eukaryotic modifications such as authentic glycosylation."}]}},{"page":99,"lecture":"Genetic Engineering Applications 2","slideInLecture":5,"title":"Recombinant DNA workflow","explain":"The complete workflow is ordered: isolate the target gene, insert it into a vector, transform host cells, select and screen transformants, confirm recombinant clones, induce gene expression, and finally produce and purify the recombinant protein.","mustKnow":["Insertion into a vector comes before transformation.","Selection and screening come before clone confirmation.","Expression is induced only after a correct clone is found.","Protein purification is the final stage shown."],"terms":[{"term":"Transformant","meaning":"Host cell that has received introduced DNA."},{"term":"Recombinant clone","meaning":"Verified clone carrying the intended recombinant DNA."},{"term":"Induction","meaning":"Triggering expression of the inserted gene."}],"diagramGuide":["The seven icons form the complete workflow from gene isolation to purified recombinant product.","Selection/screening and clone confirmation are distinct checkpoints before expression."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which checkpoint occurs after selection/screening but before gene expression in the displayed workflow?","options":["Gene isolation","Clone confirmation","Vector insertion","Protein purification"],"answer":1,"explanation":"Putative transformants are confirmed before induction and product formation."},{"q":"In the displayed recombinant-DNA workflow, what follows confirmation of recombinant clones?","options":["Restriction digestion of the original donor","Initial isolation of the gene","Gene-expression induction","Transformation into competent cells"],"answer":2,"explanation":"After clones are confirmed, expression is induced before protein production and purification."}]}},{"page":100,"lecture":"Genetic Engineering Applications 2","slideInLecture":6,"title":"Isolating the gene of interest","explain":"A target gene can be obtained from genomic DNA or from cDNA. Genomic DNA contains introns and regulatory regions. cDNA is copied from mature mRNA by reverse transcription and therefore lacks introns. cDNA is preferred for expressing a eukaryotic coding sequence in bacteria because bacteria cannot remove introns.","mustKnow":["Genomic DNA contains introns and regulatory DNA.","cDNA is made from mRNA by reverse transcription.","cDNA contains the processed coding sequence without introns.","Bacterial expression usually uses eukaryotic cDNA."],"terms":[{"term":"Genomic DNA","meaning":"DNA taken from the genome, including introns and surrounding regulatory regions."},{"term":"cDNA","meaning":"DNA copy of processed mRNA, usually lacking introns."},{"term":"Reverse transcription","meaning":"Synthesis of DNA using RNA as the template."},{"term":"Gene-specific primer","meaning":"Primer designed to amplify one selected gene sequence."}],"diagramGuide":["The source comparison distinguishes genomic DNA containing introns from cDNA copied from processed mRNA.","Primer arrows flank the gene, showing the segment PCR will amplify."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which source gives an intron-free coding sequence suitable for bacterial expression?","options":["Unprocessed genomic DNA","cDNA made from mature mRNA","Promoter-only DNA","Bacterial rRNA"],"answer":1,"explanation":"Reverse-transcribed mature mRNA yields cDNA lacking eukaryotic introns."},{"q":"Which starting material contains introns and native regulatory regions?","options":["cDNA","Purified recombinant protein","Mature mRNA","Genomic DNA"],"answer":3,"explanation":"Genomic DNA contains introns and genomic regulatory sequences, unlike cDNA copied from mature mRNA."},{"q":"Which enzyme is used to convert mature mRNA into cDNA?","options":["Reverse transcriptase","DNA ligase","Restriction endonuclease","T7 RNA polymerase"],"answer":0,"explanation":"Reverse transcriptase synthesizes complementary DNA using RNA as the template."}]}},{"page":101,"lecture":"Genetic Engineering Applications 2","slideInLecture":7,"title":"Purifying the Gene After PCR","explain":"PCR makes many copies of the target gene. The amplified DNA is then purified to remove primers, free nucleotides, enzymes, and other reaction components. The result is a clean DNA fragment ready to be inserted into a vector.","mustKnow":["PCR amplifies the target gene.","Purification removes PCR reaction contaminants.","The purified gene fragment is ready for cloning."],"terms":[{"term":"PCR product","meaning":"The DNA fragment amplified during PCR."},{"term":"Purification","meaning":"Separation of the desired DNA from unwanted reaction components."},{"term":"Vector","meaning":"A DNA carrier used to introduce a gene into a host."}],"diagramGuide":["The left-to-right diagram shows PCR mixture → amplified target plus contaminants → gel/kit purification → clean DNA fragment.","Purification does not amplify DNA; it removes primers, nucleotides, and enzymes."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which material should be depleted by PCR-product purification while the target fragment is retained?","options":["Target double-stranded DNA","Residual primers and free nucleotides","The cloned host genome","The vector origin"],"answer":1,"explanation":"Purification removes reaction components from the amplified DNA."}]}},{"page":102,"lecture":"Genetic Engineering Applications 3","slideInLecture":1,"title":"Transformation of Host Cells","explain":"Transformation introduces a recombinant plasmid into competent bacterial cells. In heat shock, a rapid rise to about 42°C briefly opens membrane pores; electroporation uses a high-voltage pulse. Cells then recover before being placed on selective medium.","mustKnow":["Competence increases membrane permeability to DNA.","Heat shock and electroporation create temporary membrane pores.","Recovery occurs before antibiotic selection.","The plasmid needs an origin of replication and selectable marker."],"terms":[{"term":"Transformation","meaning":"Introduction of external DNA into a host cell."},{"term":"Competent cell","meaning":"A cell treated so that it can take up DNA."},{"term":"Heat shock","meaning":"Rapid temperature change used to promote DNA entry."},{"term":"Electroporation","meaning":"An electric pulse used to create temporary membrane pores."}],"diagramGuide":["Compare transformation routes: heat shock uses rapid temperature change; electroporation uses a high-voltage pulse.","After uptake, recovery precedes plating on selective medium."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which transformation description is correct?","options":["Heat shock uses a 1–2.5 kV pulse","Electroporation uses transient pores produced by high voltage","Competent cells are impermeable by design","Selection occurs before recovery"],"answer":1,"explanation":"Electroporation uses an electric pulse; heat shock uses rapid temperature change."},{"q":"During chemical transformation, plasmid DNA is first mixed with competent bacterial cells under which condition?","options":["At 95°C","On ice","In boiling SDS","Under ultraviolet light"],"answer":1,"explanation":"The plasmid and competent cells are incubated on ice before the brief heat shock."},{"q":"Which transformation method uses a short high-voltage pulse to create transient membrane pores?","options":["Heat shock","Centrifugation","Electroporation","Affinity chromatography"],"answer":2,"explanation":"Electroporation transiently permeabilizes the membrane with an electric pulse and generally gives high efficiency."}]}},{"page":103,"lecture":"Genetic Engineering Applications 3","slideInLecture":2,"title":"Selection Versus Screening","explain":"Antibiotic selection identifies cells that received a plasmid carrying the resistance marker. It does not prove that the desired insert is present. Screening then identifies colonies likely to contain the recombinant plasmid, followed by molecular confirmation.","mustKnow":["Selection detects plasmid-containing cells.","Screening distinguishes likely recombinant colonies.","A positive screened colony still needs confirmation.","White colonies are commonly treated as likely recombinants in the shown scheme."],"terms":[{"term":"Selection","meaning":"Growth condition that allows cells with a selectable marker to survive."},{"term":"Screening","meaning":"Testing selected colonies for the desired recombinant plasmid."},{"term":"Transformant","meaning":"A cell that has taken up introduced DNA."},{"term":"AmpR","meaning":"Ampicillin-resistance marker carried by a plasmid."}],"diagramGuide":["In the selection panel, only plasmid-bearing cells grow on antibiotic; in screening, colony color separates likely recombinant from non-recombinant plasmids.","White colonies are candidates, not final proof; confirmation still follows."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A colony grows on ampicillin but is blue in blue-white screening. What can be concluded from the slide's logic?","options":["It lacks all plasmid DNA","It carries a plasmid but is likely non-recombinant","It is definitively the desired recombinant","It cannot express antibiotic resistance"],"answer":1,"explanation":"Selection confirms plasmid carriage; screening distinguishes likely insert-containing clones."},{"q":"After antibiotic selection, why is a separate screening step still required?","options":["Screening supplies antibiotic resistance","Selection destroys all recombinant plasmids","Screening makes cells competent","Selection cannot show whether surviving plasmids contain the insert"],"answer":3,"explanation":"Antibiotic growth establishes vector uptake, but screening distinguishes empty vector from likely recombinant plasmids."}]}},{"page":104,"lecture":"Genetic Engineering Applications 3","slideInLecture":3,"title":"Confirming Recombinant Clones","explain":"Candidate colonies can be checked by colony PCR, restriction digestion, or DNA sequencing. Sequencing gives the exact nucleotide sequence and can confirm both the identity and orientation of the inserted gene.","mustKnow":["Colony PCR checks for an insert directly from a colony.","Restriction digestion checks fragment patterns.","DNA sequencing gives exact base information and orientation."],"terms":[{"term":"Colony PCR","meaning":"PCR performed using cells from a colony to test for an insert."},{"term":"Restriction digestion","meaning":"Cutting DNA at specific sites to produce diagnostic fragments."},{"term":"DNA sequencing","meaning":"Determining the exact order of nucleotides."},{"term":"Orientation","meaning":"The direction in which an insert lies in the vector."}],"diagramGuide":["The three panels provide increasing specificity: colony PCR checks size, restriction digestion checks fragment pattern, and sequencing checks exact bases and orientation.","Read gel bands against the ladder and expected insert/vector sizes."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which method can simultaneously confirm exact insert sequence and orientation?","options":["Colony growth alone","DNA sequencing","Antibiotic selection","Cell lysis"],"answer":1,"explanation":"Sequencing reads the nucleotide order and reveals orientation."},{"q":"Which confirmation method is most directly used to check insert size by the pattern of DNA bands?","options":["Restriction digestion","Protein staining","Affinity chromatography","Flow cytometry"],"answer":0,"explanation":"Diagnostic restriction digestion produces fragments whose gel-band sizes can reveal whether the expected insert is present."}]}},{"page":105,"lecture":"Genetic Engineering Applications 3","slideInLecture":4,"title":"From Recombinant DNA to Protein","explain":"Inside the host, the inserted gene is transcribed into mRNA and the mRNA is translated into protein. An inducible promoter allows the experimenter to decide when expression begins.","mustKnow":["DNA is transcribed into mRNA.","mRNA is translated into protein.","An inducible promoter provides control over expression."],"terms":[{"term":"Transcription","meaning":"Synthesis of RNA from a DNA template."},{"term":"Translation","meaning":"Synthesis of protein from an mRNA template."},{"term":"Inducible promoter","meaning":"A promoter activated by a chosen signal or inducer."}],"diagramGuide":["The upper sequence shows transform → grow → induce; the lower sequence shows recombinant DNA → mRNA → protein.","The promoter controls transcription; the ribosome acts later during translation."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"After induction, which molecular step immediately produces mRNA from the recombinant gene?","options":["Translation","Transcription","Ligation","Transformation"],"answer":1,"explanation":"The host transcribes DNA to mRNA before translation."},{"q":"Which vector element allows recombinant-gene expression to be switched on at a chosen time?","options":["Origin of replication","Inducible promoter","Selectable marker","Multiple cloning site"],"answer":1,"explanation":"An inducible promoter permits controlled transcription after addition of an inducer."}]}},{"page":106,"lecture":"Genetic Engineering Applications 3","slideInLecture":5,"title":"Controlling Recombinant Gene Expression","explain":"A promoter determines when, where, and how strongly a gene is transcribed. In inducible systems such as lac or T7, adding an inducer such as IPTG switches expression on, allowing controlled high-level protein production.","mustKnow":["Promoters regulate transcription.","IPTG can induce lac-based expression.","lac, T7, and ara are common expression systems.","Induction separates cell growth from strong protein production."],"terms":[{"term":"Promoter","meaning":"DNA region that controls initiation of transcription."},{"term":"Inducer","meaning":"A molecule that activates an inducible expression system."},{"term":"IPTG","meaning":"A commonly used inducer of lac-based expression."},{"term":"T7 system","meaning":"A high-expression system commonly used in E. coli."}],"diagramGuide":["Without inducer, repressor blocks transcription; IPTG inactivates the repressor and exposes the promoter.","The T7 panel separates IPTG-controlled T7 RNA-polymerase production from T7-promoter-driven target expression."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In the inducible systems shown, IPTG is used primarily to:","options":["Digest the plasmid","Relieve repression and switch on expression","Bind the His tag","Terminate transcription"],"answer":1,"explanation":"IPTG inactivates lac repression, enabling controlled expression."},{"q":"A promoter directly determines which property of recombinant-gene expression?","options":["The plasmid's antibiotic target","The amino-acid sequence of the tag","When and how strongly transcription occurs","The pore size of the host membrane"],"answer":2,"explanation":"Promoters regulate the timing, location, and level of transcription."},{"q":"Which expression system shown uses T7 RNA polymerase to transcribe the target gene?","options":["Blue–white system","Ni-NTA system","SDS-PAGE system","pET/T7 system"],"answer":3,"explanation":"The pET system uses a T7 promoter recognized by T7 RNA polymerase."}]}},{"page":107,"lecture":"Genetic Engineering Applications 3","slideInLecture":6,"title":"Recombinant Protein Workflow","explain":"The workflow proceeds in order: transform the plasmid, grow the culture, induce expression, harvest cells, lyse them, and purify the recombinant protein. Each step prepares the material for the next.","mustKnow":["Transformation comes before culture growth.","Expression is induced before harvesting.","Cell lysis releases intracellular protein.","Purification follows lysis."],"terms":[{"term":"Induction","meaning":"Activation of recombinant gene expression."},{"term":"Harvest","meaning":"Collection of cells from the culture."},{"term":"Cell lysis","meaning":"Breaking cells open to release their contents."},{"term":"Purification","meaning":"Isolation of the target protein from other cell components."}],"diagramGuide":["Follow the production line exactly: transform → culture → induce → harvest → lyse → purify → product.","Centrifugation harvests cells before lysis releases intracellular protein."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which ordering is correct for intracellular recombinant-protein production?","options":["Induce → transform → lyse → grow","Transform → grow → induce → harvest → lyse → purify","Grow → purify → transform → induce","Lyse → induce → harvest → purify"],"answer":1,"explanation":"That is the numbered workflow on the slide."},{"q":"Which operation releases an intracellular recombinant protein before purification?","options":["Cell lysis","Culture induction","Transformation","Antibiotic selection"],"answer":0,"explanation":"Cells are lysed after harvesting so the intracellular recombinant protein enters the lysate."}]}},{"page":108,"lecture":"Genetic Engineering Applications 3","slideInLecture":7,"title":"His-Tag Purification with Ni-NTA","explain":"A His-tagged protein binds nickel ions on Ni-NTA resin. Low imidazole washes away weakly or nonspecifically bound proteins. High imidazole competes with the His tag and releases the target protein, which can then be checked by SDS-PAGE.","mustKnow":["His tags bind Ni2+ on Ni-NTA resin.","Low imidazole is used during washing.","High imidazole elutes the target protein.","SDS-PAGE checks purity and molecular weight."],"terms":[{"term":"His tag","meaning":"A short histidine sequence added to aid protein purification."},{"term":"Ni-NTA resin","meaning":"Nickel-containing affinity resin that binds His-tagged proteins."},{"term":"Elution","meaning":"Release of a bound molecule from a purification column."},{"term":"Imidazole","meaning":"A competitor used to wash or elute His-tagged protein."}],"diagramGuide":["The column sequence is bind, wash, elute: His tag binds Ni²⁺, low imidazole removes weak contaminants, high imidazole competes off the target.","SDS-PAGE is an analysis step after elution, not the affinity-separation mechanism itself."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"During Ni-NTA purification, which condition should release a His-tagged target after contaminants have been washed away?","options":["No imidazole and no nickel","High imidazole","Low imidazole only","SDS before column binding"],"answer":1,"explanation":"High imidazole competes with histidines for Ni²⁺ binding."},{"q":"What is the direct basis of His-tagged protein capture on Ni-NTA resin?","options":["The tag binds agarose by base pairing","Histidines coordinate immobilized Ni²⁺","Imidazole covalently links the protein","SDS binds the nickel ions"],"answer":1,"explanation":"Histidine side chains in the tag coordinate Ni²⁺ immobilized on the NTA resin."},{"q":"Why is low imidazole used during the wash step?","options":["To denature all proteins into peptides","To elute the His-tagged protein immediately","To remove weak nonspecific binders while retaining the His-tagged protein","To polymerize the chromatography resin"],"answer":2,"explanation":"Low imidazole competes weakly and removes nonspecific proteins; high imidazole is used for target elution."}]}},{"page":109,"lecture":"Genetic Engineering Applications 3","slideInLecture":8,"title":"Reading an SDS-PAGE Gel","explain":"SDS denatures proteins and gives them a similar negative charge-to-mass relationship. The gel therefore separates proteins mainly by size: smaller proteins move faster and appear lower. A strong band at the expected size supports successful expression and purity.","mustKnow":["SDS denatures proteins.","Separation depends mainly on molecular weight.","Smaller proteins migrate farther down the gel.","A band at the expected size indicates the target protein may be present."],"terms":[{"term":"SDS-PAGE","meaning":"Gel electrophoresis used to separate denatured proteins mainly by size."},{"term":"Molecular weight","meaning":"Protein size, commonly estimated in kilodaltons."},{"term":"Band","meaning":"A visible group of proteins at a particular gel position."},{"term":"Denaturation","meaning":"Loss of a protein's folded structure."}],"diagramGuide":["In the gel, wells are at the top; smaller proteins migrate farther downward.","Compare crude, wash, and eluted lanes: enrichment is shown by one strong band at the expected molecular weight in the elution."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"An elution lane shows one intense band at the expected mass and few other bands. This most directly indicates:","options":["Efficient DNA transformation","Enrichment and high purity of the target protein","Failure of SDS denaturation","A larger-than-expected plasmid"],"answer":1,"explanation":"SDS-PAGE band position estimates mass and band complexity reflects purity."},{"q":"What is the principal effect of SDS on proteins before PAGE?","options":["It preserves native quaternary structure","It gives larger proteins a positive charge","It attaches a fluorescent antibody","It gives proteins a broadly uniform negative charge"],"answer":3,"explanation":"SDS denatures proteins and masks their native charge, making migration depend mainly on molecular size."}]}},{"page":110,"lecture":"Genetic Engineering Applications 3","slideInLecture":9,"title":"Major Uses of Genetic Engineering","explain":"The applications are grouped into four broad areas: medicine and healthcare, agriculture and food production, industrial biotechnology, and environmental sustainability.","mustKnow":["Medicine is a major application area.","Agriculture uses engineered traits.","Industry uses engineered organisms to make products.","Environmental uses include sustainable processes."],"terms":[{"term":"Industrial biotechnology","meaning":"Use of biological systems to manufacture useful products."},{"term":"Sustainability","meaning":"Meeting needs while reducing long-term environmental cost."}],"diagramGuide":["The four quadrants organize applications: medicine, agriculture, industrial biotechnology, and environment/sustainability.","Use the icons as category cues—insulin/vaccines, GM crops, enzymes/biofuels, and bioremediation."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which application-category match is correct?","options":["Bioremediation—environment and sustainability","Golden Rice—industrial enzyme production","Recombinant insulin—crop improvement","Biofuel enzymes—monoclonal-antibody therapy"],"answer":0,"explanation":"Bioremediation uses organisms or engineered systems to address environmental contamination."}]}},{"page":111,"lecture":"Genetic Engineering Applications 3","slideInLecture":10,"title":"Recombinant Human Insulin","explain":"The human insulin gene is cloned into a vector, expressed in E. coli, and the product is purified and processed to make therapeutic insulin. It is a classic example of recombinant protein production.","mustKnow":["The insulin gene is human DNA.","E. coli can serve as the expression host.","The expressed product must be purified and processed.","The final product is therapeutic insulin."],"terms":[{"term":"Recombinant insulin","meaning":"Human insulin produced using genetically engineered cells."},{"term":"Expression host","meaning":"The cell used to produce a recombinant product."},{"term":"Processing","meaning":"Steps that convert the expressed product into its usable form."}],"diagramGuide":["The diagram separates insulin A- and B-chain DNA, bacterial expression, purification, chain combination/refolding, and therapeutic product.","The final disulfide-linked A/B-chain structure is assembled after expression and purification."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In the insulin case study, what occurs after separate bacterial production and purification of A and B chains?","options":["They are reverse-transcribed","They are combined and refolded with disulfide bonds","They are inserted into rice endosperm","They are separated by CRISPR"],"answer":1,"explanation":"The mature active product requires correct A/B-chain assembly."},{"q":"In the two-chain insulin strategy shown, which chains are produced separately in bacteria?","options":["A and B insulin chains","α and β globin chains","Heavy and light antibody chains","Factor VIII and IX chains"],"answer":0,"explanation":"The insulin A and B chains are expressed and purified separately, then combined and folded."},{"q":"What stabilizes the final association of insulin's A and B chains?","options":["Hydrogen bonds to DNA","Disulfide bonds","Phosphodiester bonds","Peptide bonds formed by DNA ligase"],"answer":1,"explanation":"Correct folding creates disulfide bonds between the insulin chains."}]}},{"page":112,"lecture":"Genetic Engineering Applications 3","slideInLecture":11,"title":"Other Recombinant Therapeutic Proteins","explain":"Different recombinant proteins treat different conditions: growth hormone treats growth hormone deficiency, EPO stimulates red blood cell production in anemia, interferons have antiviral and some anticancer uses, and Factors VIII and IX treat hemophilia.","mustKnow":["hGH treats growth hormone deficiency.","EPO stimulates red blood cell production.","Factor VIII treats hemophilia A; Factor IX treats hemophilia B.","Interferons can be used in antiviral therapy and some cancers."],"terms":[{"term":"hGH","meaning":"Human growth hormone used to treat growth hormone deficiency."},{"term":"EPO","meaning":"Erythropoietin, which stimulates red blood cell production."},{"term":"Interferon","meaning":"A signaling protein used in some antiviral and cancer treatments."},{"term":"Clotting factor","meaning":"A blood protein required for normal coagulation."}],"diagramGuide":["Read each protein together with its indication: hGH—growth deficiency; EPO—anemia; interferons—antiviral/some cancers; factors VIII/IX—hemophilia.","Factor number distinguishes hemophilia A (VIII) from hemophilia B (IX)."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which therapeutic-protein/clinical-use pairing is incorrect?","options":["EPO—anemia","Factor VIII—hemophilia A","hGH—growth hormone deficiency","Factor IX—hemophilia A"],"answer":3,"explanation":"Factor IX treats hemophilia B; Factor VIII treats hemophilia A."},{"q":"Which recombinant protein is used to stimulate red-blood-cell production in chronic kidney disease?","options":["Human growth hormone","Interferon-α","Erythropoietin","Factor IX"],"answer":2,"explanation":"Recombinant EPO treats anemia by stimulating erythropoiesis."},{"q":"Hemophilia B is treated with recombinant:","options":["Factor VIII","Human growth hormone","Erythropoietin","Factor IX"],"answer":3,"explanation":"Factor IX deficiency causes hemophilia B; factor VIII deficiency causes hemophilia A."}]}},{"page":113,"lecture":"Genetic Engineering Applications 3","slideInLecture":12,"title":"Recombinant Vaccines","explain":"Recombinant vaccines present selected pathogen material without using the complete infectious pathogen. Types shown include subunit, virus-like particle, and recombinant vector vaccines. The hepatitis B vaccine uses HBsAg produced in yeast.","mustKnow":["Recombinant vaccine types include subunit, VLP, and vector vaccines.","The hepatitis B vaccine is based on HBsAg.","HBsAg is produced in yeast and is non-infectious.","The recombinant hepatitis B vaccine was approved in 1986."],"terms":[{"term":"Subunit vaccine","meaning":"A vaccine containing selected pathogen components."},{"term":"VLP","meaning":"Virus-like particle that resembles a virus but lacks infectious genetic material."},{"term":"HBsAg","meaning":"Hepatitis B surface antigen used in the vaccine."},{"term":"Recombinant vector vaccine","meaning":"A vaccine using an engineered carrier to deliver antigen information."}],"diagramGuide":["The upper sequence is gene → expression host → purified antigen → immune uptake → antibodies; no infectious whole virus is required.","The hepatitis B panel identifies HBsAg made in yeast as the antigen."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which set correctly describes the recombinant hepatitis B vaccine?","options":["Live HBV; produced in bacteria; approved 1973","HBsAg subunit; produced in yeast; non-infectious","Whole inactivated HBV; produced in rice","Cas9 protein; produced in mammalian cells"],"answer":1,"explanation":"The vaccine uses recombinant hepatitis B surface antigen made in yeast."},{"q":"The antigen used in the recombinant hepatitis B vaccine is:","options":["HBsAg","HIV gp120","Influenza hemagglutinin","Tetanus toxin"],"answer":0,"explanation":"The vaccine contains recombinant hepatitis B surface antigen, HBsAg."},{"q":"Which production host is used for the recombinant hepatitis B surface antigen shown?","options":["E. coli","Yeast","Human erythrocytes","Tobacco mosaic virus"],"answer":1,"explanation":"HBsAg is expressed in yeast and purified to make a noninfectious vaccine."}]}},{"page":114,"lecture":"Genetic Engineering Applications 3","slideInLecture":13,"title":"Monoclonal Antibodies and Biologics","explain":"Monoclonal antibodies are engineered biologic molecules designed to bind specific targets. Their production commonly uses mammalian cells because complex antibody proteins require cellular processing and folding. The slide points to therapeutic applications involving targets such as HER2 and diseases such as RSV infection.","mustKnow":["Monoclonal antibodies bind specific targets.","They are produced using genetic engineering.","Mammalian cells are commonly required for proper production of complex antibodies.","Therapeutic antibodies have applications against disease-associated targets."],"terms":[{"term":"Monoclonal antibody","meaning":"A uniform antibody population directed against one target."},{"term":"Biologic","meaning":"A therapeutic product made using living systems."},{"term":"HER2","meaning":"Human epidermal growth factor receptor 2, a therapeutic target."},{"term":"RSV","meaning":"Respiratory syncytial virus."}],"diagramGuide":["The production pipeline is antibody gene → mammalian cell → culture → purification → therapeutic mAb.","The mammalian-cell inset emphasizes folding, post-translational modification, and assembly."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why are mammalian production cells preferred for many therapeutic monoclonal antibodies?","options":["They remove all disulfide bonds","They support folding, assembly, and post-translational modification","They prevent antibody-gene transcription","They eliminate purification requirements"],"answer":1,"explanation":"Complex antibodies require eukaryotic processing and assembly."},{"q":"A monoclonal antibody is defined by its ability to:","options":["Cut DNA at a palindromic site","Replicate independently as a plasmid","Bind specifically to one target antigen","Transport lactose into bacteria"],"answer":2,"explanation":"Monoclonal antibodies are identical antibodies selected for specificity to one antigenic target."},{"q":"Which therapeutic-antibody application shown targets HER2-positive breast cancer?","options":["Interferon-β","Palivizumab","Erythropoietin","Trastuzumab"],"answer":3,"explanation":"Trastuzumab binds HER2 and is used in HER2-positive breast cancer."}]}},{"page":115,"lecture":"Genetic Engineering Applications 3","slideInLecture":14,"title":"Gene Therapy Strategies","explain":"Gene therapy introduces functional genetic material into a person's cells to restore function or reduce disease. It can replace a defective gene, add a useful gene, silence a harmful gene, or directly edit a mutation.","mustKnow":["Gene replacement supplies a functional version of a defective gene.","Gene addition provides a new useful function.","Gene silencing reduces harmful expression.","Gene editing corrects DNA at the mutation level."],"terms":[{"term":"Gene therapy","meaning":"Treatment based on changing or supplying genetic material in a patient's cells."},{"term":"Gene silencing","meaning":"Reduction or prevention of expression of a harmful gene."},{"term":"siRNA","meaning":"Small RNA that can reduce expression of a target gene."},{"term":"CRISPR","meaning":"A genome-editing system that can make targeted DNA changes."}],"diagramGuide":["The left branch distinguishes ex vivo from in vivo delivery; the right branch distinguishes replacement, addition, silencing, and editing.","Editing changes DNA sequence, whereas silencing reduces expression without necessarily correcting DNA."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which intervention is gene silencing rather than gene replacement or editing?","options":["Adding a functional copy of a missing gene","Using siRNA to reduce harmful-gene expression","Correcting a point mutation with CRISPR","Replacing a defective coding sequence"],"answer":1,"explanation":"Silencing lowers expression without necessarily changing the genomic sequence."},{"q":"Which gene-therapy strategy aims to reduce expression of a harmful gene using siRNA or antisense molecules?","options":["Gene silencing","Gene replacement","Gene addition","Gene amplification"],"answer":0,"explanation":"Gene silencing lowers or stops production from a harmful gene without necessarily changing its DNA sequence."},{"q":"Which strategy directly corrects a mutation at the DNA level?","options":["Gene addition","Gene editing","Protein replacement","RNA translation"],"answer":1,"explanation":"Gene editing, for example with CRISPR, changes the genomic DNA sequence itself."}]}},{"page":116,"lecture":"Genetic Engineering Applications 3","slideInLecture":15,"title":"Examples of Gene Therapy","explain":"The slide contrasts three applications: in vivo gene addition for spinal muscular atrophy, ex vivo gene editing for sickle cell disease, and engineered immune cells in CAR-T therapy. Editing the BCL11A enhancer can restore fetal hemoglobin and reduce sickling.","mustKnow":["SMA is shown as in vivo gene addition.","Sickle cell treatment is shown as ex vivo gene editing.","CAR-T therapy uses engineered immune cells.","BCL11A enhancer editing can increase fetal hemoglobin."],"terms":[{"term":"In vivo","meaning":"Treatment performed directly inside the body."},{"term":"Ex vivo","meaning":"Cells are modified outside the body and then returned."},{"term":"CAR-T","meaning":"T cells engineered to express a chimeric antigen receptor."},{"term":"BCL11A","meaning":"A regulator whose enhancer can be edited to reactivate fetal hemoglobin."}],"diagramGuide":["Match each picture to delivery strategy: SMA uses in vivo gene addition, sickle-cell treatment edits cells ex vivo, and CAR-T engineers immune cells.","The BCL11A-enhancer route raises fetal hemoglobin rather than directly repairing every sickle mutation."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which example is correctly paired with its strategy?","options":["SMA—in vivo SMN1 gene addition","Sickle-cell disease—unmodified cell transfusion only","CAR-T—direct addition of insulin to T cells","SMA—Bt toxin expression"],"answer":0,"explanation":"The slide presents SMA as in vivo delivery of a functional SMN1 gene."},{"q":"In the sickle-cell example, editing the BCL11A enhancer is intended to increase production of:","options":["Adult hemoglobin A only","Myoglobin","Fetal hemoglobin","Erythropoietin"],"answer":2,"explanation":"Reducing BCL11A repression reactivates fetal hemoglobin, which helps prevent sickling."},{"q":"CAR-T therapy is best classified as:","options":["In vivo replacement of a liver gene","Silencing of all T-cell genes","Direct injection of recombinant insulin","Ex vivo engineering of a patient's immune cells"],"answer":3,"explanation":"T cells are removed, genetically engineered to express a chimeric antigen receptor, and returned to the patient."}]}},{"page":117,"lecture":"Genetic Engineering Applications 3","slideInLecture":16,"title":"Genetic Engineering in Agriculture","explain":"Crop genomes can be modified for pest and disease resistance, tolerance to drought or salinity, improved nutrition, higher yield, and better quality. The intended benefits include food production, reduced chemical inputs, and improved stress tolerance.","mustKnow":["Biotic stress includes pests and pathogens.","Abiotic stress includes drought, salinity, heat, and cold.","Nutritional traits can increase vitamins, amino acids, or minerals.","Crop engineering can target yield and shelf life."],"terms":[{"term":"Biotic stress","meaning":"Stress caused by living agents such as pests or pathogens."},{"term":"Abiotic stress","meaning":"Stress caused by nonliving factors such as drought or heat."},{"term":"Trait","meaning":"A measurable characteristic of an organism."},{"term":"Sustainable agriculture","meaning":"Food production designed for long-term resource and environmental viability."}],"diagramGuide":["The pipeline runs gene identification → transformation → selection/regeneration → engineered plant.","Keep biotic stress (pests/pathogens) separate from abiotic stress (drought, salt, heat, cold)."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which pair contains one biotic and one abiotic target, respectively?","options":["Drought; salinity","Insect pest; drought","Heat; cold","Vitamin content; yield"],"answer":1,"explanation":"Pests are biological; drought is non-biological environmental stress."},{"q":"Which example is an abiotic rather than biotic stress target in crop engineering?","options":["Drought","Fungal disease","Insect infestation","Viral infection"],"answer":0,"explanation":"Drought is a nonliving environmental stress; insects and pathogens are biotic stresses."},{"q":"Engineering higher vitamin or essential-amino-acid content primarily targets:","options":["Herbicide tolerance","Nutritional quality","Pathogen resistance","Delayed flowering only"],"answer":1,"explanation":"Increasing vitamins, minerals, or essential amino acids is nutritional biofortification."}]}},{"page":118,"lecture":"Genetic Engineering Applications 3","slideInLecture":17,"title":"Bt Crops","explain":"Bt crops express Cry insecticidal proteins from Bacillus thuringiensis. These proteins protect against specific insect pests, potentially reducing chemical insecticide use. Concerns include insect resistance, non-target effects, gene flow, and biosafety.","mustKnow":["Bt refers to Bacillus thuringiensis.","Cry proteins provide insect resistance.","The protection is directed against specific target pests.","Resistance management is needed to slow evolution of resistant insects."],"terms":[{"term":"Bt crop","meaning":"A crop engineered to express an insecticidal Bt protein."},{"term":"Cry toxin","meaning":"An insecticidal protein produced by Bacillus thuringiensis."},{"term":"Non-target organism","meaning":"An organism not intended to be affected by the engineered trait."},{"term":"Gene flow","meaning":"Movement of genes between populations, such as through pollen."}],"diagramGuide":["Follow the Bt mechanism: plant expresses Cry protein → insect ingests it → toxin is activated in the gut → membrane pores form → insect dies.","The crop protects against specified target insects; the diagram does not imply universal toxicity."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What is the immediate lethal action of activated Bt Cry toxin in a susceptible insect?","options":["Inhibition of plant photosynthesis","Pore formation in the insect gut membrane","Conversion of β-carotene to vitamin A","Blocking bacterial CAP binding"],"answer":1,"explanation":"Activated Cry toxin damages gut cells by forming pores."},{"q":"Bt Cry toxins are derived from which organism?","options":["Agrobacterium tumefaciens","Escherichia coli","Bacillus thuringiensis","Saccharomyces cerevisiae"],"answer":2,"explanation":"Bt crops express Cry proteins originally produced by the bacterium Bacillus thuringiensis."},{"q":"Which practice is most directly needed to address a major long-term limitation of Bt crops?","options":["Preventing beta-carotene synthesis","Increasing chemical insecticide residues","Removing the Cry gene from all seeds","Insect-resistance management"],"answer":3,"explanation":"Target insects can evolve resistance to Cry toxins, so resistance-management strategies are required."}]}},{"page":119,"lecture":"Genetic Engineering Applications 3","slideInLecture":18,"title":"Golden Rice","explain":"Golden rice is engineered so that its endosperm produces beta-carotene, a provitamin A compound. Introducing genes activates the carotenoid pathway in the grain, producing the golden color and aiming to reduce vitamin A deficiency.","mustKnow":["Golden rice accumulates beta-carotene.","Beta-carotene is provitamin A.","Production occurs in the rice endosperm.","This is nutritional biofortification."],"terms":[{"term":"Beta-carotene","meaning":"A carotenoid that the body can convert to vitamin A."},{"term":"Endosperm","meaning":"The nutrient-rich storage tissue of a seed."},{"term":"Biofortification","meaning":"Increasing the nutritional content of a food crop."},{"term":"Carotenoid pathway","meaning":"A biochemical pathway that produces carotenoid pigments."}],"diagramGuide":["The pathway diagram adds psy and crtI activity in rice endosperm, allowing carotenoid intermediates to reach β-carotene.","The yellow grain is a visual marker of β-carotene accumulation, not vitamin A itself."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Golden Rice is engineered so that which compound accumulates in the endosperm?","options":["Erythropoietin","β-carotene","Factor VIII","Allolactose"],"answer":1,"explanation":"β-carotene is provitamin A and gives the grain its golden color."},{"q":"In Golden Rice, beta-carotene accumulates specifically in the:","options":["Grain endosperm","Leaf cuticle","Root cortex","Pollen wall"],"answer":0,"explanation":"The carotenoid pathway is engineered in the edible rice endosperm."},{"q":"Golden Rice is an example of which crop-improvement approach?","options":["Herbicide detoxification","Nutritional biofortification","Insecticidal-protein production","Delayed fruit softening"],"answer":1,"explanation":"It increases provitamin A in a staple crop to improve micronutrient intake."}]}},{"page":120,"lecture":"Genetic Engineering Applications 3","slideInLecture":19,"title":"Crop Improvement Traits","explain":"The slide compares ordinary and engineered crops across six traits: herbicide tolerance, disease resistance, improved nutrition, abiotic-stress tolerance, delayed ripening, and improved yield or quality.","mustKnow":["Herbicide-tolerant plants survive the relevant herbicide.","Disease resistance targets pathogens.","Delayed ripening can extend shelf life.","Abiotic-stress tolerance can cover drought, heat, cold, or salinity."],"terms":[{"term":"Herbicide tolerance","meaning":"Ability of a crop to survive application of a herbicide."},{"term":"Delayed ripening","meaning":"Slower maturation that can extend storage life."},{"term":"Nutritional quality","meaning":"Content of useful nutrients such as vitamins or amino acids."}],"diagramGuide":["Read the six paired comparisons as trait outcomes: herbicide survival, pathogen resistance, nutrient enhancement, abiotic tolerance, delayed ripening, and yield/quality.","Each pair contrasts a conventional/sensitive phenotype with the engineered phenotype."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which engineered outcome is matched to the correct trait category?","options":["Longer fruit shelf life—delayed ripening","Survival after pathogen attack—abiotic tolerance","Higher vitamin level—herbicide tolerance","Drought survival—disease resistance"],"answer":0,"explanation":"Delayed ripening slows softening and extends storage life."},{"q":"Which engineered trait most directly reduces post-harvest losses by keeping fruit firm longer?","options":["Disease resistance","Herbicide tolerance","Delayed ripening","Cold sensitivity"],"answer":2,"explanation":"Delayed ripening extends shelf life and reduces spoilage after harvest."},{"q":"A transgenic crop that survives salinity has been engineered primarily for:","options":["Biotic-stress resistance","Insecticidal activity","Nutritional biofortification","Abiotic-stress tolerance"],"answer":3,"explanation":"Salinity is a nonliving environmental condition and therefore an abiotic stress."}]}},{"page":121,"lecture":"Genetic Engineering Applications 3","slideInLecture":20,"title":"Industrial Genetic Engineering","explain":"Engineered organisms can manufacture food-processing proteins, industrial enzymes, bio-based chemicals, fuels, and materials. Examples include chymosin, lactase, amylase, protease, lipase, amino acids, vitamins, ethanol, and bioplastics.","mustKnow":["Chymosin and lactase are food-biotechnology examples.","Amylase, protease, and lipase are industrial enzymes.","Ethanol and bioplastics are bioproducts.","Advantages include yield, consistency, scalability, and lower cost."],"terms":[{"term":"Chymosin","meaning":"An enzyme used in cheese production."},{"term":"Lactase","meaning":"An enzyme that breaks down lactose."},{"term":"Bioplastic","meaning":"Plastic made partly or fully from biological resources."},{"term":"Scalable","meaning":"Capable of being expanded to larger production volumes."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which set contains only industrial enzymes listed on the slide?","options":["Amylase, protease, lipase","Chymosin, lactase, ethanol","Amino acids, vitamins, organic acids","Ethanol, butanol, bioplastics"],"answer":0,"explanation":"Amylase, protease, and lipase form the slide's industrial-enzyme group."},{"q":"Which product group is classified on the slide as bio-based chemicals?","options":["Amino acids, vitamins, and organic acids","Chymosin and lactase","Amylase, protease, and lipase","Ethanol and bioplastics"],"answer":0,"explanation":"The slide groups amino acids, vitamins, and organic acids under bio-based chemicals."}]},"diagramGuide":["Read the four numbered application groups from top to bottom; the right column lists the shared production advantages, not additional products."]},{"page":122,"lecture":"Genetic Engineering Applications 3","slideInLecture":21,"title":"Environmental Applications","explain":"Environmental genetic engineering applications include bioremediation, wastewater treatment, biosensors, and sustainable bioprocesses. The shared aim is to use biological systems to detect, remove, or reduce environmental burdens.","mustKnow":["Bioremediation uses organisms or biological activity to address pollutants.","Wastewater treatment removes contaminants from water.","Biosensors detect selected substances.","Sustainable bioprocesses aim to reduce environmental cost."],"terms":[{"term":"Bioremediation","meaning":"Use of biological systems to remove or transform pollutants."},{"term":"Biosensor","meaning":"A device using a biological component to detect a target."},{"term":"Bioprocess","meaning":"A production or treatment process based on cells, enzymes, or other biological systems."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which environmental application couples target binding to a measurable output such as color or fluorescence?","options":["Bioremediation","Wastewater treatment","Biosensor","Biomass conversion"],"answer":2,"explanation":"The biosensor panel shows recognition of a target producing a visible signal."},{"q":"Which environmental application uses engineered microbes to break down organic waste and remove toxins from water?","options":["Bioremediation","Wastewater treatment","Biosensing","Sustainable bioprocessing"],"answer":1,"explanation":"The wastewater-treatment panel specifically shows engineered microbes breaking down organic waste and removing toxins."}]},"diagramGuide":["Follow each panel left to right: pollutant breakdown (bioremediation), toxin removal (wastewater), target detection producing a signal (biosensor), and biomass conversion into products (sustainable bioprocess)."]},{"page":123,"lecture":"Genetic Engineering Applications 3","slideInLecture":22,"title":"Engineered Plants and Disease Protection","explain":"The slide shows genetically modified peach and apple trees growing in laboratory culture and wheat seeds treated with bacteria to make them nearly immune to a fungal disease. Both images illustrate agricultural biotechnology.","mustKnow":["Plant material can be grown under laboratory conditions.","Biotechnology can be used to improve resistance to fungal disease.","The examples involve fruit trees and wheat."],"terms":[{"term":"Plant tissue culture","meaning":"Growth of plant cells or tissues under controlled laboratory conditions."},{"term":"Fungal disease","meaning":"Plant disease caused by a fungus."},{"term":"Disease resistance","meaning":"Ability to prevent or limit disease caused by a pathogen."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In the wheat example, bacterial treatment was used primarily to increase resistance to which type of pathogen?","options":["Fungal","Viral","Protozoan","Helminth"],"answer":0,"explanation":"The slide caption identifies wheat take-all as a fungal disease."}]},"diagramGuide":["The left photograph is laboratory-grown fruit-tree material; the right photograph shows wheat seed treatment. The two images represent propagation and disease protection, respectively."]},{"page":124,"lecture":"Genetic Engineering Applications 3","slideInLecture":23,"title":"Knockout and Fluorescent Mice","explain":"One comparison shows a normal mouse and a mouse in which a hair-growth gene was knocked out, producing a hairless phenotype. The other shows mice engineered to express enhanced green fluorescent protein, causing fluorescence.","mustKnow":["A gene knockout disables a selected gene.","Knocking out a hair-growth gene changes the mouse phenotype.","GFP expression makes engineered mice fluorescent.","Genetic modification can remove function or add expression."],"terms":[{"term":"Gene knockout","meaning":"Targeted disabling of a gene."},{"term":"Phenotype","meaning":"An observable characteristic produced by genotype and environment."},{"term":"GFP","meaning":"Green fluorescent protein used as a visible marker."},{"term":"Expression","meaning":"Use of gene information to produce an RNA or protein product."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which modification explains the phenotype of the hairless mouse?","options":["Insertion of an enhanced-GFP gene","Knockout of a hair-growth gene","Overexpression of a Bt gene","Deletion of a fluorescent-protein gene"],"answer":1,"explanation":"The hairless mouse is the knockout example; GFP expression belongs to the separate fluorescent-mouse image."},{"q":"In the GFP mouse group, which mouse is identified as normal?","options":["The left mouse","The right mouse","The middle mouse","All three mice"],"answer":2,"explanation":"The caption identifies the middle mouse as normal and the two outer mice as expressing enhanced GFP."}]},"diagramGuide":["Left pair: compare normal fur with the hairless knockout phenotype. Right group: fluorescence marks mice expressing enhanced GFP; the central nonfluorescent mouse is normal."]},{"page":125,"lecture":"Genetic Engineering Applications 3","slideInLecture":24,"title":"Genetically Modified Bacteria","explain":"Bacteria are common GMOs because their DNA is relatively easy to manipulate. The slide gives engineered fuel and material examples: cyanobacteria producing polyethylene or butanol and E. coli producing diesel fuel.","mustKnow":["Bacteria are widely used because they are comparatively easy to engineer.","Engineered microbes can produce hydrocarbons.","Cyanobacteria are shown producing plastic or butanol.","E. coli is shown producing diesel fuel."],"terms":[{"term":"GMO","meaning":"An organism whose genetic material has been deliberately modified."},{"term":"Cyanobacteria","meaning":"Photosynthetic bacteria."},{"term":"Hydrocarbon","meaning":"A compound made only of hydrogen and carbon, common in fuels and plastics."},{"term":"Butanol","meaning":"An alcohol that can be used as a fuel."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which engineered microbe-product pairing is shown on the slide?","options":["Cyanobacteria—diesel fuel","E. coli—diesel fuel","E. coli—polyethylene only","Cyanobacteria—chymosin"],"answer":1,"explanation":"The slide pairs engineered E. coli with diesel production and cyanobacteria with polyethylene or butanol."},{"q":"Which fuel is shown as a photosynthetic byproduct of engineered cyanobacteria?","options":["Diesel","Methane","Ethanol","Butanol"],"answer":3,"explanation":"The slide states that engineered cyanobacteria can produce polyethylene and butanol as byproducts of photosynthesis."}]},"diagramGuide":["The bottom arrow represents engineered microbial production: photosynthetic cyanobacteria or E. coli are used as factories for plastic or fuel products."]},{"page":126,"lecture":"Genetic Engineering Applications 3","slideInLecture":25,"title":"Why Engineer Plants?","explain":"This transition slide asks how plant engineering could address practical problems such as hunger, harsh weather, and insecticide pollution. It introduces the following crop examples rather than presenting a detailed mechanism.","mustKnow":["Plant engineering can target food supply.","It can target weather-related stress.","It can reduce dependence on insecticides."],"terms":[{"term":"Crop engineering","meaning":"Genetic modification of crop plants to introduce useful traits."},{"term":"Insecticide pollution","meaning":"Environmental contamination caused by chemicals used to kill insects."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which proposed plant-engineering goal most directly addresses insecticide pollution?","options":["Increasing pesticide application frequency","Introducing insect resistance into the crop","Reducing seed germination","Eliminating drought tolerance"],"answer":1,"explanation":"Insect-resistant crops can reduce reliance on externally applied insecticides."}]},"diagramGuide":["The crop photographs cue two target problems: food production and resistance to environmental or insect stress."]},{"page":127,"lecture":"Genetic Engineering Applications 3","slideInLecture":26,"title":"GM Crop Adoption and Bt Corn","explain":"The slide reports high US adoption percentages for GM soybean, cotton, corn, and sugar beet in 2010. Bt corn contains a bacterial gene that makes an insecticidal protein active against certain insects.","mustKnow":["Bt corn carries a gene from Bt bacteria.","The resulting protein is toxic to certain insects.","The slide states that the protein is not poisonous to humans.","The displayed adoption figures refer to the US in 2010."],"terms":[{"term":"Bt corn","meaning":"Corn engineered to produce a Bacillus thuringiensis insecticidal protein."},{"term":"Adoption rate","meaning":"The proportion of crop production using a technology or trait."},{"term":"Specificity","meaning":"Activity directed toward particular targets rather than all organisms."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which crop had the lowest GM adoption percentage among the four US values shown for 2010?","options":["Soybean","Cotton","Corn","Sugar beet"],"answer":2,"explanation":"The slide lists corn at 86%, below soybean and cotton at 93% and sugar beet at 95%."},{"q":"Which crop had the highest GM adoption percentage in the displayed 2010 US data?","options":["Sugar beets","Soybeans","Cotton","Corn"],"answer":0,"explanation":"Sugar beets are listed at 95%, higher than soybeans and cotton at 93% and corn at 86%."}]},"diagramGuide":["The percentages are crop-adoption data from the US in 2010. The corn image illustrates the Bt-corn example discussed below the percentages."]},{"page":128,"lecture":"Genetic Engineering Applications 3","slideInLecture":27,"title":"Edible Vaccines and Insect-Resistant Cabbage","explain":"Two proposed plant applications are shown. A modified virus introduced into a banana sapling causes bananas to contain viral proteins, while adding scorpion genes to cabbage is presented as a way to deter insect feeding.","mustKnow":["The banana example aims to produce viral proteins in fruit.","The cabbage example aims to prevent insect feeding.","Both examples add a new biological function to a plant."],"terms":[{"term":"Edible vaccine","meaning":"A vaccine antigen produced in an edible plant tissue."},{"term":"Viral protein","meaning":"A protein encoded by a virus that can serve as an antigen."},{"term":"Transgene","meaning":"A gene introduced into an organism by genetic engineering."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which pairing correctly matches the introduced biological material with the intended plant outcome?","options":["Modified virus—viral proteins in banana fruit","Scorpion gene—vitamin A in cabbage","Bt gene—viral proteins in banana fruit","Modified virus—insect deterrence in cabbage"],"answer":0,"explanation":"The banana example uses modified viral material to produce viral proteins; the cabbage example uses a scorpion gene for insect deterrence."},{"q":"What introduced genetic material is associated with the insect-resistant cabbage example?","options":["A Bt bacterial gene","A scorpion gene","A modified viral genome","A spider gene"],"answer":1,"explanation":"The cabbage example states that scorpion genes were added to prevent insects from eating the plant."}]},"diagramGuide":["Top: modified viral material is introduced into a banana sapling so fruit contains viral proteins. Bottom: an introduced scorpion gene is linked to insect deterrence in cabbage."]},{"page":129,"lecture":"Genetic Engineering Applications 3","slideInLecture":28,"title":"Reasons to Modify Crops","explain":"Crop modification can aim for insect, herbicide, drought, freeze, or disease resistance; higher yield; faster growth; improved nutrition; or longer shelf life. Golden rice is repeated as an example of beta-carotene enrichment.","mustKnow":["Resistance traits can target organisms, chemicals, or weather.","Yield and growth rate can be modified.","Nutrition and shelf life are also targets.","Golden rice produces beta-carotene."],"terms":[{"term":"Herbicide resistance","meaning":"Ability to survive a herbicide that would kill a sensitive plant."},{"term":"Shelf life","meaning":"Time a product remains usable or acceptable during storage."},{"term":"Fortified food","meaning":"Food with increased nutritional value."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Golden Rice is engineered to accumulate a precursor of which vitamin?","options":["Vitamin A","Vitamin B12","Vitamin C","Vitamin K"],"answer":0,"explanation":"Beta-carotene is a precursor of vitamin A."},{"q":"Which modification on the slide is aimed most directly at reducing post-harvest food loss?","options":["Higher yield","Faster growth","Longer shelf life","Herbicide resistance"],"answer":2,"explanation":"Longer shelf life directly delays spoilage after harvesting."}]},"diagramGuide":["The rice image connects beta-carotene production to vitamin-A fortification; the remaining crop images illustrate other engineered agricultural traits."]},{"page":130,"lecture":"Genetic Engineering Applications 3","slideInLecture":29,"title":"Engineering Animals","explain":"This transition slide introduces the idea that animals can be genetically modified to solve practical problems. The following slides provide examples involving imaging, growth, emissions, and material production.","mustKnow":["Animals can be genetically engineered.","Engineered traits can serve research or practical applications.","The slide introduces examples rather than a specific mechanism."],"terms":[{"term":"Transgenic animal","meaning":"An animal carrying introduced genetic material."},{"term":"Animal biotechnology","meaning":"Use of biological engineering methods in animals."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which upcoming example uses an animal as a production host for a non-animal structural protein?","options":["Fast-growing salmon","Lower-methane cattle","GFP mouse","Spider-silk goat"],"answer":3,"explanation":"The goat example produces spider-silk protein in milk."}]},"diagramGuide":[]},{"page":131,"lecture":"Genetic Engineering Applications 3","slideInLecture":30,"title":"Bioluminescent and Fluorescent Animals","explain":"Light-producing or fluorescent markers can be used for protein tracking and disease detection by imaging particular cells. The slide also notes novelty pets such as GloFish and shows mice expressing enhanced GFP.","mustKnow":["Fluorescent markers can track proteins or cells.","Bioluminescent imaging can help detect disease-related cells.","GFP is a visible biological marker.","GloFish are a novelty-pet application."],"terms":[{"term":"Bioluminescence","meaning":"Light production by a living system through a chemical reaction."},{"term":"BLI","meaning":"Bioluminescent imaging used to visualize labeled biological activity."},{"term":"GFP","meaning":"Green fluorescent protein used to label cells or proteins."},{"term":"Protein tracking","meaning":"Following the location or movement of a protein using a detectable marker."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which listed use depends on locating labeled cells inside an animal?","options":["Novelty coloration","Bioluminescent imaging","Selective breeding","Methane reduction"],"answer":1,"explanation":"Bioluminescent imaging uses emitted light to identify labeled cell populations."},{"q":"Which named commercial example represents the novelty-pet use of fluorescence?","options":["Bt corn","Golden Rice","AquAdvantage salmon","GloFish"],"answer":3,"explanation":"The slide names GloFish as fluorescent novelty pets."}]},"diagramGuide":["Read the visual equation as bioluminescent source plus mouse produces a fluorescently traceable mouse. The emitted signal is used to locate labeled cells or proteins."]},{"page":132,"lecture":"Genetic Engineering Applications 3","slideInLecture":31,"title":"Fast-Growing Salmon and Lower-Methane Cattle","explain":"The salmon example uses genes from two other fish to maintain growth-hormone production and accelerate growth. The cattle example proposes modifying methane-producing bacteria to reduce methane output by about 25%.","mustKnow":["The salmon carries genes from two other fish.","The engineered salmon continually produces growth hormone.","The cattle example targets methane-producing bacteria.","The stated reduction in methane is 25%."],"terms":[{"term":"Growth hormone","meaning":"A hormone that promotes body growth."},{"term":"Methane","meaning":"A greenhouse gas produced during microbial digestion in cattle."},{"term":"Microbiome","meaning":"The community of microorganisms living in a particular environment."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What is altered in the lower-methane cattle example?","options":["Growth-hormone genes from fish","Methane-producing bacteria","The bovine GFP gene","Milk spider-silk expression"],"answer":1,"explanation":"The cattle example targets bacteria responsible for methane production."},{"q":"What stated physiological change makes the engineered salmon grow faster?","options":["Continuous growth-hormone production","Reduced methane production","Enhanced GFP expression","Increased insulin secretion"],"answer":0,"explanation":"Genes from two other fish cause the salmon to produce growth hormone continually."}]},"diagramGuide":["Top comparison: the GM salmon reaches greater size over the same 18-month period. Bottom: the cow image represents reduced methane after altering methane-producing bacteria."]},{"page":133,"lecture":"Genetic Engineering Applications 3","slideInLecture":32,"title":"Spider-Silk-Producing Goats","explain":"The slide presents goats carrying spider genes so that spider-silk protein can be produced in goat milk. This uses an animal as a biological production system for a useful material.","mustKnow":["Spider genes are introduced into goats.","The target product is spider silk.","The silk protein is produced in goat milk.","The animal acts as a production host."],"terms":[{"term":"Spider silk","meaning":"A strong protein-based fiber naturally produced by spiders."},{"term":"Production host","meaning":"An organism used to manufacture a desired biological product."},{"term":"Transgenic goat","meaning":"A goat carrying an introduced gene."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In the transgenic-goat example, spider-silk protein is recovered from which secretion?","options":["Saliva","Milk","Sweat","Bile"],"answer":1,"explanation":"The introduced spider genes enable spider-silk protein production in goat milk."}]},"diagramGuide":["The pictogram proposes transferring a spider gene into another host; the goat below is the actual production host, and milk is the collection material for spider-silk protein."]},{"page":134,"lecture":"Genetic Engineering Applications 3","slideInLecture":33,"title":"Concerns About GMOs","explain":"The slide lists possible concerns involving food safety, environmental and wildlife harm, pesticide or herbicide use, farmer health, seed and pollen drift, and herbicide-resistant weeds. It also notes regulation, bans, and labeling requirements in many countries.","mustKnow":["Health and environmental safety are major concern categories.","Seed and pollen drift can move engineered genes.","Herbicide-resistant weeds are a stated concern.","Countries differ in restrictions and labeling rules."],"terms":[{"term":"Pollen drift","meaning":"Movement of pollen away from the intended crop area."},{"term":"Superweed","meaning":"Informal term for a weed with strong herbicide resistance."},{"term":"GMO labeling","meaning":"Identification of products containing genetically modified ingredients."},{"term":"Risk assessment","meaning":"Systematic evaluation of possible hazards and their likelihood."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which concern specifically describes movement of a transgene beyond the cultivated field?","options":["Pollen drift","Off-target editing","Informed consent","Protein misfolding"],"answer":0,"explanation":"Seed and pollen drift can move engineered genetic material to other populations."},{"q":"Which listed GMO concern describes selection for weeds that survive herbicide treatment?","options":["Farmer health","Herbicide-resistant super weeds","Pollen drift","Food labeling"],"answer":1,"explanation":"The slide explicitly lists creation of herbicide-resistant super weeds as a concern."}]},"diagramGuide":["The laboratory image represents controlled production, while the bullet list identifies risks that arise after consumption, cultivation, or environmental spread."]},{"page":135,"lecture":"Genetic Engineering Applications 3","slideInLecture":34,"title":"Biosafety, Ethics, and Regulation","explain":"Genetic engineering must be evaluated for unintended effects, off-target changes, laboratory and release risks, germline editing, consent, fairness, misuse, gene flow, and ecosystem effects. Regulation involves safety testing, approval, and monitoring.","mustKnow":["Off-target changes are a biosafety issue.","Germline editing creates heritable changes.","Environmental review includes non-target organisms and biodiversity.","Regulation includes pre-use testing and post-release monitoring."],"terms":[{"term":"Off-target change","meaning":"An unintended genetic alteration outside the intended site."},{"term":"Germline editing","meaning":"Editing reproductive-line DNA so a change can be inherited."},{"term":"Informed consent","meaning":"Voluntary agreement based on adequate understanding."},{"term":"Post-release monitoring","meaning":"Continued observation after environmental or commercial release."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which issue belongs to the ethical category rather than biosafety or environmental risk?","options":["Off-target changes","Effects on non-target organisms","Informed consent","Post-release monitoring"],"answer":2,"explanation":"Informed consent is listed under ethical issues."},{"q":"Which measure belongs to regulation rather than biosafety, ethics, or environmental concerns?","options":["Preventing gene flow to wild relatives","Ensuring equitable access","Monitoring after commercialization","Detecting off-target changes"],"answer":2,"explanation":"Post-release or post-commercialization monitoring is listed under regulation."},{"q":"Which concern is specifically environmental?","options":["Heritable germline changes","Laboratory-use risks","Informed consent","Effects on non-target organisms"],"answer":3,"explanation":"Effects on non-target organisms are grouped with ecosystem and biodiversity impacts under environmental concerns."}]},"diagramGuide":["The slide is organized into four risk domains: biosafety, ethics, environment, and regulation. Pair each example with its domain rather than memorizing one undifferentiated list."]},{"page":136,"lecture":"Genetic Engineering Applications 3","slideInLecture":35,"title":"Advantages and Challenges","explain":"Genetic engineering can precisely modify traits, produce recombinant products, improve crops, and support treatment of genetic disease. Its challenges include unintended effects, difficult delivery, cost, regulation, ethics, and uncertain long-term effects.","mustKnow":["Precision and useful-product production are key advantages.","Delivery of genetic material can be difficult.","Development and production can be costly.","Long-term health and environmental effects may require monitoring."],"terms":[{"term":"Delivery","meaning":"Getting genetic material into the required cells or tissues."},{"term":"Unintended effect","meaning":"A result that was not the goal of the modification."},{"term":"Monitoring","meaning":"Repeated observation to detect effects over time."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which challenge most directly limits whether an engineered construct reaches the intended cells?","options":["Delivery of genetic material","Scalable production","Precise gene modification","Recombinant-product formation"],"answer":0,"explanation":"Difficult delivery is listed as a limitation, whereas the other options are advantages or outcomes."},{"q":"Which listed advantage is the basis of producing enzymes, vaccines, and therapeutic proteins by genetic engineering?","options":["Recombinant-product production","Precise trait modification","Continued environmental monitoring","Reduced regulatory oversight"],"answer":0,"explanation":"The advantages column explicitly lists production of useful recombinant proteins, enzymes, and vaccines."}]},"diagramGuide":["Compare the two columns: benefits are on the left and technical, economic, regulatory, or long-term limitations are on the right."]},{"page":137,"lecture":"Genetic Engineering Applications 3","slideInLecture":36,"title":"Future of
