 Genetic Engineering","explain":"Future directions include more precise base and prime editing, improved CRISPR systems, personalized medicine, synthetic biology, engineered therapeutic cells, and organisms that make greener fuels, chemicals, and materials.","mustKnow":["Base and prime editing aim for greater precision.","Personalized medicine uses individual genetic information.","Synthetic biology designs biological systems and circuits.","Sustainable biotechnology targets greener products and crops."],"terms":[{"term":"Base editing","meaning":"Targeted conversion of one DNA base into another without a standard double-strand break."},{"term":"Prime editing","meaning":"A targeted editing method capable of writing selected DNA changes."},{"term":"Personalized medicine","meaning":"Treatment adapted to an individual's biological or genetic features."},{"term":"Synthetic biology","meaning":"Design and construction of new biological systems or functions."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Base editing and prime editing are presented as routes toward what future goal?","options":["More precise genome editing","Higher pesticide use","Less individualized treatment","Replacement of all regulation"],"answer":0,"explanation":"Both technologies appear under more precise genome editing."},{"q":"Which future direction involves constructing new biological systems and circuits?","options":["Personalized medicine","Synthetic biology and engineered cells","Sustainable biotechnology","Prime editing"],"answer":1,"explanation":"New biological systems and circuits are listed under synthetic biology and engineered cells."},{"q":"Therapies selected using an individual's genetic information belong to which future direction?","options":["Sustainable biotechnology","Industrial fermentation","Personalized medicine","Environmental release monitoring"],"answer":2,"explanation":"The personalized-medicine section describes therapies based on individual genetics and targeted disease treatment."}]},"diagramGuide":["Each numbered future direction is paired with an icon: genome editing, individual-specific therapy, engineered cellular systems, and sustainable production."]},{"page":138,"lecture":"Biological Motors","slideInLecture":1,"title":"Biological Motors","explain":"This title slide begins the lecture on biological motors. The topic is how molecular systems convert energy into directed motion or other cellular work.","mustKnow":["The new lecture topic is biological motors.","The course is SBL100.","The lecture is presented by Prof. Anita Roy."],"terms":[{"term":"Biological motor","meaning":"A biological system that converts energy into motion or other work."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which lecture begins on this slide?","options":["Cellular signaling","Biological motors","Cell death pathways","Host-pathogen interaction"],"answer":1,"explanation":"The title slide begins the Biological Motors lecture."}]},"diagramGuide":[]},{"page":139,"lecture":"Biological Motors","slideInLecture":2,"title":"What Is a Motor?","explain":"A conventional motor converts electrical energy into mechanical energy. The lecture broadens the definition to include devices that convert chemical energy into mechanical energy, which is the relevant idea for molecular motors.","mustKnow":["Conventional motors convert electrical to mechanical energy.","Biological motors can convert chemical to mechanical energy.","Faraday and Tesla are mentioned in the historical introduction."],"terms":[{"term":"Mechanical energy","meaning":"Energy associated with motion or force."},{"term":"Chemical energy","meaning":"Energy stored in chemical bonds and concentration differences."},{"term":"Induction motor","meaning":"An electric motor design associated on the slide with Nikola Tesla."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A molecular motor is defined by conversion of chemical energy primarily into what output?","options":["Electrical potential only","Directed mechanical motion","Random thermal equilibrium","Permanent covalent crosslinks"],"answer":1,"explanation":"The lecture extends the motor concept to chemical-to-mechanical energy conversion."}]},"diagramGuide":["The historical motor photograph is an example of a macroscopic machine; the key relationship is energy input being converted into mechanical output."]},{"page":140,"lecture":"Biological Motors","slideInLecture":3,"title":"Cells Need Continuous Energy Input","explain":"Thermodynamics determines whether reactions are energetically favorable. Many necessary cellular reactions are unfavorable on their own, so cells must supply additional energy obtained from the environment. Energy generation and use are therefore fundamental to cell biology.","mustKnow":["Thermodynamics governs chemical equilibrium.","Some required cellular reactions are energetically unfavorable.","Unfavorable processes require energy input.","Cells continually obtain and use metabolic energy."],"terms":[{"term":"Chemical equilibrium","meaning":"A state with no net change in reactant and product concentrations."},{"term":"Energetically favorable","meaning":"Able to proceed in the favored direction under the stated conditions."},{"term":"Metabolic energy","meaning":"Energy captured and used through cellular chemical reactions."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"At the minimum of the Gibbs-free-energy curve, what is the value of ΔG for an infinitesimal forward reaction?","options":["ΔG < 0","ΔG = 0","ΔG > 0","ΔG = −7.3 kcal/mol in every reaction"],"answer":1,"explanation":"The curve minimum is chemical equilibrium, where ΔG is zero."},{"q":"On the Gibbs-free-energy graph, which region represents an energetically favorable forward reaction?","options":["The region labeled ΔG > 0","The minimum only","Every point after equilibrium","The region labeled ΔG < 0"],"answer":3,"explanation":"A negative Gibbs free-energy change indicates that forward progress is energetically favorable."}]},"diagramGuide":["Graph axes: Gibbs free energy G is vertical and extent of reaction ξ is horizontal. The curve falls when ΔG<0, reaches equilibrium at its minimum where ΔG=0, and rises in the region where forward progress has ΔG>0."]},{"page":141,"lecture":"Biological Motors","slideInLecture":4,"title":"Life Operates Out of Equilibrium","explain":"Living cells maintain ordered structures, unequal chemical concentrations, and spatial charge differences. These conditions are not equilibrium states and require continuous energy use. Molecular machines create and maintain them by converting one store of free energy into another.","mustKnow":["Living order requires a nonequilibrium state.","Cells maintain concentration and charge differences.","Proton pumps help maintain acidic lysosomal pH.","Molecular machines transduce nonequilibrium free energy."],"terms":[{"term":"Nonequilibrium","meaning":"A state maintained away from thermodynamic equilibrium."},{"term":"Free energy","meaning":"Energy available to perform work under given conditions."},{"term":"Proton pump","meaning":"A protein that moves H+ across a membrane."},{"term":"Energy transduction","meaning":"Conversion of energy from one form or reservoir to another."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which cellular feature is used as an example of a maintained nonequilibrium condition?","options":["Uniform cytosolic pH everywhere","Acidic lysosomal pH","Complete absence of ion gradients","Maximum molecular disorder"],"answer":1,"explanation":"Proton pumps maintain the lysosome at an acidic pH away from equilibrium."},{"q":"According to the slide, why can the ordered state of living systems not persist at equilibrium?","options":["The second law requires maximum disorder at equilibrium","Equilibrium prevents ATP binding","Equilibrium eliminates all molecular motion","The first law prohibits energy conversion"],"answer":0,"explanation":"The slide links equilibrium with maximum disorder under the second law, so living order requires a nonequilibrium state."},{"q":"What do molecular machines interconvert or transduce to maintain cellular nonequilibrium?","options":["Only electrical voltage","Stores of nonequilibrium free energy","Covalent bonds into atoms","Genetic information into equilibrium"],"answer":1,"explanation":"They are described as macromolecular complexes that interconvert or transduce different reservoirs of nonequilibrium free energy."}]},"diagramGuide":["No formal diagram is shown; the lysosomal proton-pump example links an energy-consuming machine to maintenance of a nonequilibrium pH gradient."]},{"page":142,"lecture":"Biological Motors","slideInLecture":5,"title":"Why Molecular Motors Are Different","explain":"Molecular motors work at nanometer scale in water, where viscosity, Brownian motion, and stochastic behavior matter. Their activity depends strongly on temperature and pH, relies on noncovalent interactions, and uses internal molecular dynamics rather than rigid macroscopic parts.","mustKnow":["Molecular motors operate at nanometer scale.","They work in aqueous, low-Reynolds-number conditions.","Brownian motion makes their environment stochastic.","Their operation depends on noncovalent interactions, temperature, and pH."],"terms":[{"term":"Brownian motion","meaning":"Random movement caused by collisions with surrounding molecules."},{"term":"Low Reynolds number","meaning":"A regime where viscous forces dominate over inertia."},{"term":"Noncovalent interaction","meaning":"A reversible interaction such as hydrogen bonding or electrostatic attraction."},{"term":"Stochastic","meaning":"Involving random variation or probability."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which combination best characterizes a molecular motor's operating environment?","options":["High Reynolds number and negligible noise","Low Reynolds number and Brownian noise","Vacuum and rigid covalent gears","Temperature-independent dry conditions"],"answer":1,"explanation":"Molecular motors work in aqueous, low-Reynolds-number environments dominated by Brownian motion."},{"q":"Which interaction type is emphasized as governing molecular motors?","options":["Only covalent bonds","Nuclear fusion","Non-covalent interactions","Metallic bonding"],"answer":2,"explanation":"The slide explicitly states that biological motors are governed by non-covalent interactions."},{"q":"Which property distinguishes molecular motors from the macroscopic motors contrasted on the slide?","options":["They operate independently of temperature and pH","They are made only of rigid parts","They require a high-Reynolds-number gas","They rely on motion within the motor molecule"],"answer":3,"explanation":"Molecular motors rely on molecular dynamics and operate under restricted aqueous, temperature, and pH conditions."}]},"diagramGuide":["Treat the bullet list as a contrast with macroscopic motors: nanometre scale, aqueous low-Reynolds-number conditions, Brownian noise, narrow pH/temperature range, and noncovalent interactions."]},{"page":143,"lecture":"Biological Motors","slideInLecture":6,"title":"Molecular Motors Convert Energy","explain":"A molecular motor is a complex of biological macromolecules that converts one form of energy into directed motion or another function. A major energy source is ATP hydrolysis to ADP and inorganic phosphate.","mustKnow":["Molecular motors are macromolecular complexes.","They convert energy into directed motion or function.","ATP is a major energy source.","ATP hydrolysis produces ADP and Pi."],"terms":[{"term":"Macromolecule","meaning":"A large biological molecule such as a protein or nucleic acid."},{"term":"ATP","meaning":"A cellular energy-carrying nucleotide."},{"term":"Hydrolysis","meaning":"Chemical bond cleavage involving water."},{"term":"Pi","meaning":"Inorganic phosphate released during ATP hydrolysis."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which chemical reaction is shown as the common energy source for directed motor motion?","options":["ATP → ADP + Pi","ADP → ATP + glucose","GTP → DNA + Pi","Protein → amino acid + ATP"],"answer":0,"explanation":"ATP hydrolysis supplies chemical free energy that can be coupled to motion."},{"q":"What kind of biological structure is defined as a molecular motor on this slide?","options":["A complex of biological macromolecules","A lipid monolayer","A single inorganic ion","A DNA base pair"],"answer":0,"explanation":"The slide defines molecular motors as complexes of biological macromolecules."}]},"diagramGuide":["The reaction arrow ATP → ADP + Pi represents chemical-bond energy being coupled to directed mechanical work."]},{"page":144,"lecture":"Biological Motors","slideInLecture":7,"title":"Principle 1: ATP or GTP Energy","explain":"The first fundamental principle is that molecular motors use energy from ATP or GTP. ATPases catalyze ATP hydrolysis, while ATP synthase can make ATP. The slide gives a standard ATP-hydrolysis free-energy change of about -7.3 kcal/mol.","mustKnow":["ATP and GTP can power molecular motors.","ATPase catalyzes ATP hydrolysis.","ATP synthase produces ATP.","The displayed standard ΔG for ATP hydrolysis is negative."],"terms":[{"term":"ATPase","meaning":"An enzyme that catalyzes ATP hydrolysis."},{"term":"ATP synthase","meaning":"A molecular machine that synthesizes ATP."},{"term":"ΔG","meaning":"Change in Gibbs free energy for a process."},{"term":"GTP","meaning":"A guanine nucleotide that can provide energy similarly to ATP."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In the ATP structure, which phosphate group is terminal and released as Pi during hydrolysis?","options":["Alpha","Beta","Gamma","Ribose"],"answer":2,"explanation":"The gamma phosphate is the terminal phosphate."},{"q":"What standard free-energy change for ATP hydrolysis is displayed on the slide?","options":["+7.3 kcal/mol","-7.3 kcal/mol","-73 kcal/mol","+0.73 kcal/mol"],"answer":1,"explanation":"The displayed value is ΔG = -7.3 kcal/mol."}]},"diagramGuide":["The opposing arrows distinguish ATPase-driven hydrolysis from ATP-synthase-driven ATP formation. In the ATP structure, the alpha phosphate is nearest ribose, beta is central, and gamma is terminal."]},{"page":145,"lecture":"Biological Motors","slideInLecture":8,"title":"Principle 2: Conformational Change","explain":"Binding ATP, hydrolyzing it, and exchanging ADP for ATP can shift a protein between different three-dimensional states. Repeating this nucleotide-controlled cycle lets molecular motors convert chemical events into mechanical movement.","mustKnow":["ATP- and ADP-bound forms can have different conformations.","ATP hydrolysis changes the nucleotide state.","ADP-to-ATP exchange resets the cycle.","Repeated conformational changes can generate movement."],"terms":[{"term":"Conformation","meaning":"The three-dimensional shape of a protein."},{"term":"Nucleotide exchange","meaning":"Replacement of one bound nucleotide by another."},{"term":"State A/State B","meaning":"Simplified labels for two protein conformations."},{"term":"Mechanochemical cycle","meaning":"A repeating cycle coupling chemical changes to mechanical action."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which nucleotide transition returns the model motor protein from state B to state A?","options":["ATP hydrolysis with ATP retained","ADP-to-ATP exchange","Binding of a second ADP","Loss of the protein tail"],"answer":1,"explanation":"Exchange of ADP for ATP restores the ATP-bound state A."},{"q":"Which nucleotide-bound state is assigned to conformation B in the simplified motor cycle?","options":["ATP-bound","GTP-bound","ADP- and Pi-bound","Nucleotide-free only"],"answer":2,"explanation":"ATP hydrolysis converts state A into the ADP/Pi-bound state B."},{"q":"What directly links nucleotide chemistry to mechanical output in the model?","options":["A change in DNA sequence","Permanent cleavage of the motor","Diffusion of the entire cell","A change in protein conformation"],"answer":3,"explanation":"ATP binding, hydrolysis, and exchange drive alternating protein conformations, which can produce motion."}]},"diagramGuide":["Follow the nucleotide cycle: ATP-bound state A → hydrolysis → ADP/Pi-bound state B → nucleotide exchange → ATP-bound state A. The conformational switch, not the nucleotide alone, produces motion."]},{"page":146,"lecture":"Biological Motors","slideInLecture":9,"title":"Active and Inactive Conformations","explain":"The slide asks how strongly the active ATP/GTP-bound conformation differs from the inactive ADP/GDP-bound conformation and shows an overlaid protein structure. The highlighted regions indicate that nucleotide state can alter selected parts of a protein rather than rebuilding the whole protein.","mustKnow":["ATP/GTP-bound states are labeled active.","ADP/GDP-bound states are labeled inactive.","Different nucleotide states can produce different protein conformations.","The structural comparison is the focus of the linked animation."],"terms":[{"term":"Active conformation","meaning":"A protein shape associated here with ATP or GTP binding."},{"term":"Inactive conformation","meaning":"A protein shape associated here with ADP or GDP binding."},{"term":"Structural overlay","meaning":"Superposition of structures to reveal conformational differences."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which nucleotide-bound conformation is labeled inactive?","options":["ATP-bound","GTP-bound","ADP/GDP-bound","ATP/GTP-bound"],"answer":2,"explanation":"The slide contrasts active ATP/GTP-bound with inactive ADP/GDP-bound conformations."}]},"diagramGuide":["The overlaid protein structures show that the same protein can occupy different three-dimensional conformations depending on whether ATP/GTP or ADP/GDP is bound."]},{"page":147,"lecture":"Biological Motors","slideInLecture":10,"title":"Categories of Biological Motors","explain":"The lecture divides biological motors into four categories: polymerization motors, cytoskeletal motors, rotary motors, and nucleic-acid motors.","mustKnow":["Polymerization motors are one category.","Cytoskeletal motors are one category.","Rotary motors are one category.","Nucleic-acid motors are one category."],"terms":[{"term":"Polymerization motor","meaning":"A system in which polymer growth or shrinkage produces force or movement."},{"term":"Cytoskeletal motor","meaning":"A motor protein that acts with cytoskeletal filaments."},{"term":"Rotary motor","meaning":"A molecular machine that generates rotation."},{"term":"Nucleic-acid motor","meaning":"A motor that moves along or acts on DNA or RNA."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which category includes kinesin, dynein, and myosin?","options":["Polymerization motors","Cytoskeletal motors","Rotary motors","Nucleic-acid motors"],"answer":1,"explanation":"These motors move on cytoskeletal tracks."}]},"diagramGuide":[]},{"page":148,"lecture":"Biological Motors","slideInLecture":11,"title":"The Cytoskeleton","explain":"The cytoskeleton is a dynamic three-dimensional network throughout the cytoplasm. It supports cell shape and protection, motility, cytokinesis, intracellular transport, cell division, and organelle organization. Its three major filament systems are actin microfilaments, intermediate filaments, and tubulin microtubules.","mustKnow":["Microfilaments are made of actin.","Microtubules are made of tubulin.","Intermediate filaments are the third major system.","The cytoskeleton supports shape, movement, division, and transport."],"terms":[{"term":"Cytoskeleton","meaning":"A dynamic network of protein filaments inside cells."},{"term":"Microfilament","meaning":"A thin cytoskeletal filament built from actin."},{"term":"Microtubule","meaning":"A hollow cytoskeletal polymer built from tubulin."},{"term":"Cytokinesis","meaning":"Physical division of one cell into two daughter cells."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which cytoskeletal polymer is assembled from tubulin?","options":["Microfilament","Intermediate filament","Microtubule","Myosin thick filament"],"answer":2,"explanation":"Microtubules are tubulin polymers; microfilaments are actin polymers."},{"q":"Which function is NOT listed for the cytoskeleton on the slide?","options":["DNA replication","Cell shape","Intracellular transport","Organization of organelles"],"answer":0,"explanation":"The slide lists shape, protection, motility, cytokinesis, transport, division, and organelle organization, but not DNA replication."}]},"diagramGuide":["In the fluorescence image, differently colored filament networks occupy the same cell. Relate actin to microfilaments, tubulin to microtubules, and the blue ovals to nuclei."]},{"page":149,"lecture":"Biological Motors","slideInLecture":12,"title":"Muscle Fibers and Striations","explain":"The slide introduces skeletal muscle structure by pairing a visible muscle with microscopic images of repeating striations. The regular banding reflects an ordered, repeating internal organization within muscle fibers.","mustKnow":["Muscle fibers show repeated striations.","Striations are visible as regular microscopic bands.","The pattern indicates ordered internal organization."],"terms":[{"term":"Muscle fiber","meaning":"An elongated muscle cell specialized for contraction."},{"term":"Striation","meaning":"A repeating light-and-dark banding pattern in striated muscle."},{"term":"Microscopy","meaning":"Use of magnification to observe structures too small for the unaided eye."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"The repeating light-dark pattern in skeletal muscle is called what?","options":["Treadmilling","Striation","Chemotaxis","Birefringence"],"answer":1,"explanation":"Ordered sarcomeres generate visible striations."}]},"diagramGuide":["The sculpture provides a macroscopic analogy for muscle form; the microscopy panels show repeating light-dark bands, i.e. striations, along muscle fibers."]},{"page":150,"lecture":"Biological Motors","slideInLecture":13,"title":"Muscle Movement Animation","explain":"This slide contains a linked video following the introduction to muscle fibers and striations. Its role is to provide an animated view of the muscle-movement topic introduced on the previous slide.","mustKnow":["The slide is a video resource.","It follows the muscle fiber and striation introduction.","The linked topic is muscle movement."],"terms":[{"term":"Animation","meaning":"A moving visual sequence used to demonstrate a process."},{"term":"Muscle movement","meaning":"Mechanical action produced by muscle contraction."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which protein pair is central to the muscle-motor mechanism introduced here?","options":["Actin and myosin","Tubulin and dynein","Collagen and elastin","Keratin and lamin"],"answer":0,"explanation":"The following slides develop actin filaments and myosin motors."}]},"diagramGuide":["This page is a video still; use it only as a transition from whole-muscle striation to molecular actin-myosin motion."]},{"page":151,"lecture":"Biological Motors","slideInLecture":14,"title":"Myosin Moving on Actin","explain":"The fluorescence image shows myosin-II motor regions in green associated with actin filaments in blue. It is visual evidence that motor proteins work on cytoskeletal tracks rather than moving freely through the cell.","mustKnow":["Actin forms the track used by myosin motors.","Myosin converts chemical energy into movement or force."],"terms":[{"term":"Myosin","meaning":"An ATP-powered motor protein that interacts with actin."},{"term":"Actin filament","meaning":"A cytoskeletal polymer that serves as a structural element and myosin track."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which filament serves as the track for a myosin motor?","options":["Microtubule","Actin filament","Intermediate filament","Collagen fibril"],"answer":1,"explanation":"Myosin moves relative to actin."}]},"diagramGuide":["The arrowhead identifies a localized event on a fluorescent filament. The long filament is the track; punctate colored signals mark associated motor molecules or labeled components."]},{"page":152,"lecture":"Biological Motors","slideInLecture":15,"title":"G-Actin and F-Actin","explain":"Actin exists as globular G-actin monomers and filamentous F-actin polymers. ATP or ADP can bind each actin subunit, and ATP affects how readily subunits join the dynamic filament.","mustKnow":["G-actin is the monomer; F-actin is the polymer.","Actin filaments form a right-handed double helix.","Actin filaments can grow and shrink."],"terms":[{"term":"G-actin","meaning":"The globular, soluble actin monomer."},{"term":"F-actin","meaning":"The filament made by polymerized actin monomers."},{"term":"Microfilament","meaning":"Another name for an actin filament."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which statement correctly distinguishes the two actin forms?","options":["G-actin is polymeric and F-actin monomeric","G-actin is globular monomer and F-actin filamentous polymer","Both are myosin light chains","F-actin lacks repeating actin subunits"],"answer":1,"explanation":"G-actin monomers polymerize into F-actin filaments."},{"q":"What approximate molecular mass is given for one G-actin subunit?","options":["5 kDa","43 kDa","11 kDa","130 kDa"],"answer":1,"explanation":"The slide gives a G-actin subunit mass of 43 kDa."},{"q":"Which factors are stated to have major roles in actin polymerization and depolymerization?","options":["DNA polymerase and sodium ions","Ribosomes and chloride ions","Actin-binding proteins and calcium ions","Histones and iron ions"],"answer":2,"explanation":"The slide specifically identifies actin-binding proteins and calcium ions."}]},"diagramGuide":["G-actin is the globular monomer and F-actin is the polymer. The filament is a right-handed double helix of repeating actin subunits."]},{"page":153,"lecture":"Biological Motors","slideInLecture":16,"title":"Helical Arrangement of Actin Subunits","explain":"The molecular model shows repeated actin subunits packed into a two-stranded helical filament. Repetition and directional packing give the filament structural polarity.","mustKnow":["F-actin is assembled from many repeating actin subunits.","The filament has a helical, polar organization."],"terms":[{"term":"Polarity","meaning":"Structural difference between the two ends of a filament."},{"term":"Subunit","meaning":"A repeating molecular building block in a polymer."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What higher-order arrangement is visible in the F-actin molecular model?","options":["Single straight chain","Right-handed double helix","Closed lipid bilayer","Triple collagen helix"],"answer":1,"explanation":"F-actin consists of two intertwined actin strands forming a right-handed double helix."}]},"diagramGuide":["The molecular model shows two intertwined rows of actin subunits, explaining the double-helical appearance of F-actin."]},{"page":154,"lecture":"Biological Motors","slideInLecture":17,"title":"Actin Polymerization: Nucleation and Elongation","explain":"Actin assembly begins with slow nucleation, when a few G-actin monomers form an unstable starter cluster. Elongation then adds monomers at both ends, but addition is faster at the plus or barbed end than at the minus or pointed end.","mustKnow":["Nucleation creates the initial actin seed.","Elongation occurs at both ends.","The plus end grows faster than the minus end."],"terms":[{"term":"Nucleation","meaning":"Formation of the small initial cluster that can seed a filament."},{"term":"Barbed end","meaning":"The faster-growing plus end of an actin filament."},{"term":"Pointed end","meaning":"The slower-growing minus end of an actin filament."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which step precedes rapid elongation during actin polymerization?","options":["Nucleation","Translation","Myosin cleavage","Sarcomere contraction"],"answer":0,"explanation":"A small actin nucleus must form before efficient filament elongation."},{"q":"During actin elongation, which filament end grows faster?","options":["The minus end","Both ends at identical rates","Neither end","The plus end"],"answer":3,"explanation":"The source diagram and companion identify elongation at both ends, with faster growth at the plus end."}]},"diagramGuide":["Read the hand-drawn sequence as nucleation before elongation: a small unstable oligomer forms first, then additional monomers extend the filament."]},{"page":155,"lecture":"Biological Motors","slideInLecture":18,"title":"From One Actin Subunit to a Filament","explain":"The slide contrasts one actin subunit with a long filament containing many subunits. Polymerization changes the scale and function of actin without changing the identity of the repeating building block.","mustKnow":["A filament is a polymer of many actin subunits.","The monomer-to-polymer change is G-actin to F-actin."],"terms":[{"term":"Polymerization","meaning":"Joining many small subunits into a larger polymer."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What is the immediate repeating subunit of the filament shown?","options":["G-actin","Myosin heavy chain","Tubulin dimer","Keratin tetramer"],"answer":0,"explanation":"The figure expands one actin subunit and shows many copies in the filament."}]},"diagramGuide":["The small blue object is one actin subunit; the enlarged multicolored structure below is the filament assembled from repeated copies."]},{"page":156,"lecture":"Biological Motors","slideInLecture":19,"title":"ATP Hydrolysis in Actin","explain":"Actin binds ATP and has ATPase activity. Polymerization changes actin's conformation and promotes ATP hydrolysis; ATP-actin adds to filaments more readily than ADP-actin, while ADP-actin is more likely to dissociate.","mustKnow":["Actin can hydrolyze ATP after entering a filament.","ATP-actin is favored for addition.","ADP-actin dissociates more readily than ATP-actin."],"terms":[{"term":"ATPase","meaning":"An activity that hydrolyzes ATP to ADP and inorganic phosphate."},{"term":"Inorganic phosphate","meaning":"The phosphate released after ATP hydrolysis, written Pi."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which monomeric actin species is preferentially incorporated into a growing filament?","options":["ATP-G-actin","ADP-G-actin","Nucleotide-free myosin","GDP-tubulin"],"answer":0,"explanation":"ATP-bound G-actin is the assembly-competent form emphasized in the polymerization scheme."},{"q":"What happens to ATP after ATP-G-actin is incorporated into the filament?","options":["It is hydrolyzed to ADP","It is converted to GTP","It remains permanently unmodified","It is released before incorporation"],"answer":0,"explanation":"Filament-incorporated actin hydrolyzes its bound ATP, producing ADP-actin."},{"q":"Which actin species dissociates more readily from a filament?","options":["ATP-actin","ADP-actin","GTP-actin","Calcium-free actin only"],"answer":1,"explanation":"The slide's nucleotide-state comparison indicates that ADP-actin is less stably retained and dissociates more readily."}]},"diagramGuide":["The upper sketch shows nucleotide-bearing actin monomers; the lower sketch shows their incorporation into a polarized filament with distinct ends."]},{"page":157,"lecture":"Biological Motors","slideInLecture":20,"title":"Steady State and Treadmilling","explain":"At steady state, total F-actin mass can remain constant even while subunits move through the filament. Addition at the plus end and loss at the minus end create treadmilling, a directional flux of actin subunits.","mustKnow":["Steady state does not mean the filament is inactive.","Treadmilling combines plus-end addition with minus-end loss.","Critical concentration separates net polymerization from net depolymerization."],"terms":[{"term":"Treadmilling","meaning":"Subunit addition at one end and loss at the other with little net mass change."},{"term":"Critical concentration","meaning":"The free actin concentration at which addition and loss balance."},{"term":"Steady state","meaning":"A state with no net change in total filament mass despite ongoing exchange."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which flux pattern defines actin treadmilling?","options":["Addition at both ends equally","Addition at plus end and loss at minus end","Loss at plus end and addition at neither end","Permanent retention of every subunit"],"answer":1,"explanation":"Treadmilling maintains flux through the filament by opposite net behavior at its two ends."},{"q":"What does the critical concentration separate in actin dynamics?","options":["ATP synthesis from glycolysis","Myosin from kinesin motion","Net polymerization from net depolymerization","Thin filaments from thick filaments"],"answer":2,"explanation":"Above or below the critical concentration, the balance shifts between net subunit addition and net subunit loss."},{"q":"Why can an actin filament at steady state still be dynamic?","options":["Every actin subunit stops exchanging","The filament is covalently fixed","ATP hydrolysis ceases completely","Subunit addition and loss can continue at equal overall rates"],"answer":3,"explanation":"Steady length can coexist with ongoing addition at one end and loss at the other."}]},"diagramGuide":["The filament sketch marks different behavior at its two ends. Treadmilling means net addition at the plus/barbed end while subunits are lost from the minus/pointed end."]},{"page":158,"lecture":"Biological Motors","slideInLecture":21,"title":"Sarcomere Organization","explain":"A sarcomere runs from one Z line to the next. Thin actin filaments extend inward from the Z lines, while thick myosin filaments are centered around the M line; their overlap produces the banded appearance of muscle.","mustKnow":["A sarcomere is bounded by two Z lines.","Actin is the thin filament; myosin is the thick filament.","The M line lies at the center of the sarcomere."],"terms":[{"term":"Sarcomere","meaning":"The repeating contractile unit of striated muscle."},{"term":"Z line","meaning":"The boundary where thin filaments are anchored."},{"term":"M line","meaning":"The central region associated with thick filaments."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which landmarks delimit one complete sarcomere?","options":["Two adjacent Z lines","Two adjacent M lines","One Z line and one H zone","Two A-band centers"],"answer":0,"explanation":"A sarcomere extends from Z line to Z line."},{"q":"Which sarcomere region contains thick filament but no thin-filament overlap?","options":["H zone","I band","Z line","Entire A band"],"answer":0,"explanation":"The H zone is the central thick-filament-only region around the M line."},{"q":"Where are thin actin filaments anchored in the sarcomere diagram?","options":["At the M line","At the Z lines","Only within the H zone","At the center of each thick filament"],"answer":1,"explanation":"Thin filaments extend inward from the Z lines toward the center of the sarcomere."}]},"diagramGuide":["A sarcomere runs from one Z line to the next. Thin actin filaments anchor at Z lines; thick myosin filaments center on the M line; the H zone contains thick filament without thin-filament overlap."]},{"page":159,"lecture":"Biological Motors","slideInLecture":22,"title":"Myosin Structure","explain":"Myosin contains two heavy chains plus essential and regulatory light chains. Each heavy chain has a head that binds actin and ATP, a neck associated with light chains, and a coiled-coil tail that supports dimerization and cargo or filament interactions.","mustKnow":["The myosin head binds both actin and ATP.","The neck carries light chains.","The tail is a dimeric coiled-coil."],"terms":[{"term":"Motor domain","meaning":"The myosin head region that binds actin and hydrolyzes ATP."},{"term":"Light chain","meaning":"A smaller protein associated with the myosin neck."},{"term":"Coiled-coil","meaning":"A rope-like structure formed by intertwined alpha helices."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which myosin domain contains both ATP- and actin-binding sites?","options":["Head","Neck","Tail","Regulatory light chain alone"],"answer":0,"explanation":"Both binding sites are in the globular head domain."},{"q":"What is the composition of the myosin molecule shown?","options":["One heavy chain and four actin chains","Two tubulin chains and two regulatory chains","Two heavy chains, two essential light chains, and two regulatory light chains","One heavy chain, one essential light chain, and no regulatory chains"],"answer":2,"explanation":"The slide lists two heavy chains plus two essential and two regulatory light chains."},{"q":"Which structural region of myosin carries the essential and regulatory light chains?","options":["Head","Coiled-coil tail tip","Actin filament","Neck"],"answer":3,"explanation":"The diagram places both classes of light chain around the neck region."}]},"diagramGuide":["From left to right: globular heads, neck with essential and regulatory light chains, then the long coiled-coil tail. The bracket indicates an approximately 130-nm tail region."]},{"page":160,"lecture":"Biological Motors","slideInLecture":23,"title":"Myosin Movement Video Resource","explain":"This slide points to an animation of myosin action. The exam-relevant idea is that repeated ATP-linked changes in the myosin head produce attachment, force generation, release, and resetting on actin.","mustKnow":["Myosin movement is cyclic rather than a single permanent pull.","ATP controls changes in actin-myosin binding and motor conformation."],"terms":[{"term":"Cross-bridge cycle","meaning":"The repeating sequence of myosin attachment, force generation, detachment, and reset."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which event directly produces the myosin working stroke?","options":["Myosin-head conformational change","Actin conversion into tubulin","Permanent tail depolymerization","DNA transcription in the bead"],"answer":0,"explanation":"A nucleotide-linked conformational change in the head generates the working stroke."}]},"diagramGuide":["This page is a myosin-animation still; use it as a transition to experiments that measure individual motor steps."]},{"page":161,"lecture":"Biological Motors","slideInLecture":24,"title":"Fluorescent Tracking of Myosin and Actin","explain":"The microscopy frame labels myosin-II in green and actin in blue. Fluorescent tags let researchers distinguish two molecular components and follow where they are over time inside a sample.","mustKnow":["Different fluorescent colors can label different proteins.","The image links myosin distribution with the actin network."],"terms":[{"term":"Fluorescent tag","meaning":"A light-emitting label used to locate a molecule in an image."},{"term":"HaloTag","meaning":"A protein-tagging system that can be linked to fluorescent dyes."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why are actin and myosin assigned different fluorophores in the image?","options":["To separate their spatial distributions","To change their nucleotide specificity","To increase ATP hydrolysis stoichiometry","To convert force into fluorescence"],"answer":0,"explanation":"Distinct labels allow the two proteins to be localized independently."}]},"diagramGuide":["The color key labels myosin and actin separately. Track the differently colored puncta along the filament network rather than treating color as structural evidence by itself."]},{"page":162,"lecture":"Biological Motors","slideInLecture":25,"title":"Arthur Ashkin and Optical Tweezers","explain":"Arthur Ashkin showed that one tightly focused laser beam can trap a dielectric particle in three dimensions. The method uses light-generated forces to hold and manipulate microscopic objects.","mustKnow":["Arthur Ashkin is associated with optical tweezers.","A tightly focused laser can trap a dielectric particle in 3D."],"terms":[{"term":"Optical tweezers","meaning":"A focused-laser method for trapping and moving microscopic particles."},{"term":"Dielectric particle","meaning":"A nonconducting particle that can be polarized by an electric field."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Arthur Ashkin's single-beam trap uses what physical input?","options":["A tightly focused laser beam","A uniform magnetic field","A chemical ATP gradient","A rotating glass needle"],"answer":0,"explanation":"Radiation pressure and the intensity gradient of a focused laser trap a dielectric particle."},{"q":"In what year did Arthur Ashkin observe three-dimensional trapping with one focused beam, according to the slide?","options":["1985","1829","1955","2005"],"answer":0,"explanation":"The slide dates Ashkin's observation of single-beam three-dimensional trapping to 1985."}]},"diagramGuide":["The photograph identifies Arthur Ashkin; the relevant apparatus relationship is one tightly focused laser creating a three-dimensional trap for a dielectric sphere."]},{"page":163,"lecture":"Biological Motors","slideInLecture":26,"title":"Gaussian Beam and Scattering Force","explain":"The laser is brightest at the center and weaker toward the edges, giving a Gaussian intensity profile. A bead refracts and scatters the light, and the scattering force increases with optical intensity.","mustKnow":["A Gaussian beam has maximum intensity at its center.","The bead changes the direction of incident light.","Scattering force is proportional to optical intensity."],"terms":[{"term":"Gaussian intensity profile","meaning":"A beam profile that is brightest at the center and fades toward the edges."},{"term":"Scattering force","meaning":"A light-driven force generally directed along beam propagation."},{"term":"Refraction","meaning":"Bending of light as it passes between materials."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In the Gaussian beam profile, where is optical intensity greatest?","options":["At the central focus","At both outer edges","Uniformly across the beam","Only behind the bead"],"answer":0,"explanation":"A Gaussian profile is brightest at the center."},{"q":"What happens to light rays when the focused beam interacts with the bead?","options":["They lose all momentum","They are bent by reflection and refraction","They become chemically bound to the bead","They pass through without changing direction"],"answer":1,"explanation":"The slide describes bending of the rays according to reflection and refraction."},{"q":"Which beam property creates the lateral intensity gradient used for trapping?","options":["Uniform intensity across the beam","Random polarization only","A Gaussian profile brighter at the center","A hollow center with bright edges"],"answer":2,"explanation":"A Gaussian beam is brightest centrally and dimmer toward the edges, creating the required gradient."}]},"diagramGuide":["The central laser ray passes through the bead center; off-axis rays refract. Their horizontal force components point inward, while vertical components and scattering act along the beam axis."]},{"page":164,"lecture":"Biological Motors","slideInLecture":27,"title":"Light Momentum Produces Force","explain":"Light carries momentum. When a bead bends light by refraction or reflection, the light's momentum changes; conservation of momentum gives the bead an equal and opposite momentum change, which appears as force.","mustKnow":["Light carries momentum.","Changing light direction changes light momentum.","The bead experiences an equal and opposite momentum change."],"terms":[{"term":"Conservation of momentum","meaning":"Total momentum is conserved, so a change in light momentum is balanced by the object."},{"term":"Radiation pressure","meaning":"Pressure or force caused by transfer of light momentum."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"The force on the bead follows from conservation of which quantity when light is refracted?","options":["Charge","Momentum","Mass number","ATP concentration"],"answer":1,"explanation":"Changing light momentum requires an equal and opposite momentum change of the bead."},{"q":"Light momentum is described as proportional to which physical quantity?","options":["Its wavelength only","The bead diameter only","The fluid viscosity only","Its energy"],"answer":3,"explanation":"The slide states that light carries momentum proportional to its energy and directed along propagation."}]},"diagramGuide":["For each refracted ray, compare incoming and outgoing directions. The light's momentum change is balanced by an equal and opposite momentum change of the bead."]},{"page":165,"lecture":"Biological Motors","slideInLecture":28,"title":"Gradient and Scattering Forces in an Optical Trap","explain":"Scattering force pushes mainly along the incident beam. Gradient force points toward the high-intensity beam center and acts as a restoring force; displacement of a trapped bead can therefore report the force applied by a molecular motor.","mustKnow":["Gradient force pulls the bead toward the beam center.","Scattering force points mainly along beam propagation.","Optical traps measure piconewton forces and nanometer displacements."],"terms":[{"term":"Gradient force","meaning":"The restoring optical force directed toward the highest-intensity region."},{"term":"Piconewton","meaning":"A force unit equal to 10^-12 newton."},{"term":"Nanometer","meaning":"A length unit equal to 10^-9 meter."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which force component acts as the inward restoring force in an optical trap?","options":["Scattering force","Gradient force","Buoyant force","Centrifugal force"],"answer":1,"explanation":"The gradient force points toward the high-intensity beam center."},{"q":"In which direction does the scattering-force component point?","options":["Primarily along the direction of incident light","Toward the beam center in the xy plane","Opposite every incident ray","Randomly because of Brownian motion"],"answer":0,"explanation":"The slide separates scattering force along incident-light propagation from the inward gradient force."},{"q":"What measurement ranges are emphasized for biological optical-tweezer experiments?","options":["Forces in newtons and displacements in metres","Forces in piconewtons and displacements in nanometres","Forces in joules and displacements in seconds","Forces in pascals and displacements in litres"],"answer":1,"explanation":"The application is described as applying pN-range forces and measuring nm-range displacements."}]},"diagramGuide":["Separate the force vectors: scattering force points with beam propagation; gradient force points toward the high-intensity beam center and acts as the restoring force."]},{"page":166,"lecture":"Biological Motors","slideInLecture":29,"title":"Optical Trap as a Spring","explain":"Near its center, an optical trap behaves like a spring: force is proportional to bead displacement. Hooke's law, F = -kx, lets displacement become a force measurement once trap stiffness k is known.","mustKnow":["An optical trap can be calibrated like a spring.","Force magnitude equals stiffness times displacement.","The minus sign indicates restoring force."],"terms":[{"term":"Hooke's law","meaning":"The relation F = -kx for a linear restoring force."},{"term":"Trap stiffness","meaning":"The proportionality constant k between displacement and restoring force."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"For trap stiffness k, a bead displaced by x experiences which restoring-force relation?","options":["F = k/x","F = −kx","F = x/k","F = −k/x²"],"answer":1,"explanation":"The trap is approximated as a Hookean spring."},{"q":"At constant trap stiffness, what happens to restoring-force magnitude when displacement doubles?","options":["It halves","It is unchanged","It doubles","It becomes zero"],"answer":2,"explanation":"From |F| = kx, doubling x at fixed k doubles the restoring-force magnitude."}]},"diagramGuide":["The spring analogy gives F = −kx. Displacement x from equilibrium produces an opposing restoring force; doubling x at fixed stiffness k doubles force magnitude."]},{"page":167,"lecture":"Biological Motors","slideInLecture":30,"title":"Measuring Single-Myosin Mechanics","explain":"The slide introduces an optical-tweezers experiment designed to detect piconewton forces and nanometer steps from individual myosin molecules. The apparatus converts tiny bead movements into quantitative motor measurements.","mustKnow":["Single-molecule experiments resolve individual motor events.","Relevant scales are piconewtons for force and nanometers for displacement."],"terms":[{"term":"Single-molecule mechanics","meaning":"Measurement of movement and force from individual molecules rather than a bulk average."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"The cited single-myosin experiment resolves forces and steps on which scales?","options":["Newton and metre","Piconewton and nanometre","Millinewton and centimetre","Pascal and litre"],"answer":1,"explanation":"Single-molecule optical trapping operates at pN force and nm displacement scales."}]},"diagramGuide":["The apparatus photograph shows the optical-tweezers setup used to measure piconewton forces and nanometre steps from a single myosin molecule."]},{"page":168,"lecture":"Biological Motors","slideInLecture":31,"title":"Dual-Beam Optical Trap","explain":"An actin filament is held taut between two trapped beads and lowered onto a pedestal bead carrying sparse myosin. When myosin binds and pulls actin, the trapped beads move, revealing stroke size, attachment time, and force.","mustKnow":["The two trapped beads hold the actin filament.","Myosin is placed on a separate pedestal bead.","Bead displacement reports myosin activity."],"terms":[{"term":"Working stroke","meaning":"The force-producing movement made by a motor protein."},{"term":"Attachment lifetime","meaning":"How long the motor remains bound during one interaction."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What directly displaces the optically trapped end beads?","options":["Myosin interacting with the suspended actin filament","Laser-induced DNA replication","Polymerization of the silica support","Diffusion of cortisol into the bead"],"answer":0,"explanation":"A myosin working event moves actin and therefore the attached trapped beads."},{"q":"What is the role of the two optically trapped beads in the dual-beam setup?","options":["They synthesize ATP","They coat the support with myosin","They directly fluoresce when ATP is hydrolyzed","They suspend and tension an actin filament"],"answer":3,"explanation":"The actin filament is attached between the two trapped beads and held under tension."},{"q":"Which motor properties can be extracted from bead displacements in this setup?","options":["Working stroke, attachment lifetime, and force magnitude","DNA sequence, mutation rate, and chromosome number","Only ATP concentration","Only filament diameter"],"answer":0,"explanation":"The slide explicitly lists working stroke, attachment lifetime, and magnitude of force generation."}]},"diagramGuide":["Two laser traps hold beads attached to opposite ends of one actin filament. A myosin-coated pedestal bead lies below; myosin binding displaces the suspended actin-bead assembly."]},{"page":169,"lecture":"Biological Motors","slideInLecture":32,"title":"Single-Myosin Experimental Setup","explain":"The actin filament is stretched between two optically trapped beads to about 2 pN and positioned near a sparsely myosin-coated support. A quadrant photodiode tracks bead position with high resolution, allowing brief motor events to be detected.","mustKnow":["Sparse myosin coating helps isolate one or a few motors.","The actin filament is held under about 2 pN tension.","A quadrant photodiode detects bead position."],"terms":[{"term":"Heavy meromyosin","meaning":"A myosin fragment containing the motor heads and part of the tail."},{"term":"Quadrant photodiode","meaning":"A detector that measures small changes in the position of a light image."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why is heavy meromyosin kept at low density on the support?","options":["To isolate events from one or a few motors","To eliminate all actin binding","To increase bead diameter","To make the photodiode fluorescent"],"answer":0,"explanation":"Sparse coating reduces simultaneous interactions by many motors."},{"q":"To approximately what tension was the suspended actin filament pulled?","options":["0.2 pN","2 pN","20 pN","200 pN"],"answer":1,"explanation":"The second bead was moved until the actin filament experienced about 2 pN of tension."},{"q":"Which detector provided high-resolution bead-position measurements?","options":["Geiger counter","Mass spectrometer","Quadrant photodiode","Patch-clamp electrode"],"answer":2,"explanation":"A brightfield image of a bead was projected onto a quadrant photodiode detector."}]},"diagramGuide":["The two end beads tension the actin filament; sparse heavy meromyosin on the fixed support favors events from one or a few motors. A quadrant photodiode records bead position."]},{"page":170,"lecture":"Biological Motors","slideInLecture":33,"title":"Myosin Step Traces","explain":"The upper trace records bead motion parallel to the actin filament and the lower trace records perpendicular motion. The detected displacement is close to 11 nm at both low and high ATP concentrations, supporting a characteristic myosin stroke size.","mustKnow":["The productive displacement is measured along the actin filament.","The observed step is about 11 nm.","Step distance is similar at low and high ATP in the shown traces."],"terms":[{"term":"Displacement trace","meaning":"A graph showing measured position as a function of time."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What step size is observed at both low and high ATP concentrations?","options":["Approximately 2 nm","Approximately 5 nm","Approximately 11 nm","Approximately 110 nm"],"answer":2,"explanation":"The displacement traces identify a step close to 11 nm."},{"q":"Which trace acts as the perpendicular-motion control in the displayed recordings?","options":["The upper trace","Both traces are parallel motion","Neither trace records bead motion","The lower trace"],"answer":3,"explanation":"The upper trace records motion along the actin filament; the lower trace records motion perpendicular to it."}]},"diagramGuide":["In each plot, time is horizontal and displacement is vertical. The upper trace is motion parallel to actin and contains steps; the lower trace is perpendicular control motion. The highlighted step size is about 11 nm at both ATP concentrations."]},{"page":171,"lecture":"Biological Motors","slideInLecture":34,"title":"Distribution of Myosin Displacements","explain":"The histogram collects many single-motor displacement events instead of relying on one trace. Most events cluster around roughly 10 to 13 nm, while biological and measurement variation spreads the values.","mustKnow":["A histogram shows how frequently each displacement range occurred.","The main cluster is around the approximately 11 nm working stroke."],"terms":[{"term":"Histogram","meaning":"A plot that groups measurements into ranges and counts their frequency."},{"term":"Distribution","meaning":"The pattern of values observed across repeated measurements."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Where is the main cluster of displacement events in the histogram?","options":["0–2 nm","10–13 nm","20–25 nm","35–40 nm"],"answer":1,"explanation":"The tallest bars lie around 10–13 nm."},{"q":"What quantity is plotted on the vertical axis of the displacement histogram?","options":["Number of events","ATP concentration","Force in pN","Time in seconds"],"answer":0,"explanation":"The histogram plots displacement on the horizontal axis and number of events on the vertical axis."}]},"diagramGuide":["Histogram axes: displacement in nm is horizontal and number of events is vertical. The tallest bars cluster near roughly 10–13 nm."]},{"page":172,"lecture":"Biological Motors","slideInLecture":35,"title":"Force from a Single Myosin Motor","explain":"The force histogram shows repeated single-motor measurements in piconewtons. Most events lie around 2 to 5 pN, with the highest frequency near 3 pN.","mustKnow":["Single myosin forces are in the piconewton range.","The displayed distribution peaks near 3 pN.","Repeated events vary rather than giving one identical value."],"terms":[{"term":"Force distribution","meaning":"The frequency pattern of force values from repeated motor events."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"At approximately what force is the single-myosin distribution maximal?","options":["0.3 pN","3 pN","30 pN","300 pN"],"answer":1,"explanation":"The tallest histogram bin is centered near 3 pN."},{"q":"What quantity is plotted on the horizontal axis of the single-myosin histogram?","options":["Displacement in nm","Force in pN","ATP concentration in mM","Number of events"],"answer":1,"explanation":"The horizontal axis is force in piconewtons, while the vertical axis is number of events."}]},"diagramGuide":["Histogram axes: force in pN is horizontal and number of events is vertical. The modal region is near 3 pN, with fewer events at larger forces."]},{"page":173,"lecture":"Biological Motors","slideInLecture":36,"title":"Bacteria-Powered 3D Micromotors","explain":"The slide presents fabricated micromotor structures whose motion is powered by bacteria and controlled using light. It is an example of coupling living biological motors to engineered microscale devices.","mustKnow":["Bacteria can provide propulsion for engineered micromotors.","Light is used to control the system.","The device scale is micrometers."],"terms":[{"term":"Micromotor","meaning":"A motor-like device built at micrometer scale."},{"term":"Biohybrid","meaning":"A system combining biological components with engineered material."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What provides propulsion in the light-controlled 3D micromotors?","options":["Bacteria","Myosin-coated actin","Steroid receptors","Silica diffusion"],"answer":0,"explanation":"The paper title and image identify bacteria-powered micromotors."}]},"diagramGuide":["The micrograph shows gear-like synthetic micromotors. Attached or confined bacteria provide the biological propulsion and light controls the system."]},{"page":174,"lecture":"Biological Motors","slideInLecture":37,"title":"Array of Bacterial Micromotors","explain":"The microscopy image shows repeated gear-like micromotor structures surrounded by bacteria. It demonstrates that the biohybrid design can be fabricated as multiple microscale units rather than only one device.","mustKnow":["The repeated structures are microscale engineered devices.","Bacteria around the structures are part of the propulsion system."],"terms":[{"term":"Microscopy array","meaning":"A field containing multiple repeated small structures viewed by microscopy."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What repeated structure is shown in the micrograph?","options":["Four-gear micromotor assemblies","Actin sarcomeres","Nuclear receptor dimers","Bacterial chromosomes"],"answer":0,"explanation":"The field contains repeated groups of four gear-like micromotor units."}]},"diagramGuide":["Repeated four-gear assemblies demonstrate the geometry and replication of the bacteria-powered micromotor design; the image is structural, not a force graph."]},{"page":175,"lecture":"Biological Motors","slideInLecture":38,"title":"Bacterial Flagella","explain":"The slide introduces bacterial flagella as rotary motility structures. A flagellar motor rotates the helical flagellum, allowing a bacterium to move through liquid.","mustKnow":["Bacterial flagella generate swimming motion by rotation.","The bacterial flagellar motor is a rotary biological motor."],"terms":[{"term":"Flagellum","meaning":"A long helical appendage used for bacterial swimming."},{"term":"Flagellar motor","meaning":"The membrane-associated rotary motor that turns a bacterial flagellum."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"The bacterial flagellar motor belongs to which motor class?","options":["Polymerization motor","Linear cytoskeletal motor","Rotary motor","Nucleic-acid motor"],"answer":2,"explanation":"It rotates the flagellum to propel the bacterium."}]},"diagramGuide":["The video still shows bacterial trajectories. The key mechanism is rotary motion of the flagellar motor transmitted to the helical flagellum."]},{"page":176,"lecture":"Biological Motors","slideInLecture":39,"title":"Biological Motors Reference","explain":"The lecture cites Molecular Biology of the Cell by Bruce Alberts as its reference text. This page contains source information rather than a new mechanism.","mustKnow":["The cited reference is Molecular Biology of the Cell, 5th edition."],"terms":[],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which reference text is cited for the Biological Motors lecture?","options":["Molecular Biology of the Cell, 5th edition","Lehninger Principles, 1st edition","Gray's Anatomy, 2nd edition","The Origin of Species, 5th edition"],"answer":0,"explanation":"The reference slide names Molecular Biology of the Cell, 5th edition, by Bruce Alberts."}]},"diagramGuide":[]},{"page":177,"lecture":"Cellular Signaling","slideInLecture":1,"title":"Cellular Signaling","explain":"This begins the cellular signaling lecture. The central topic is how cells detect information, process it internally, and produce an appropriate response.","mustKnow":["Cell signaling links detection of a signal to a cellular response."],"terms":[{"term":"Cellular signaling","meaning":"Communication processes by which cells detect and respond to information."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What is the topic of the lecture beginning on this slide?","options":["Biological motors","Cellular signaling","Genetic engineering","Cancer drug development"],"answer":1,"explanation":"This is the Cellular Signaling title slide."}]},"diagramGuide":[]},{"page":178,"lecture":"Cellular Signaling","slideInLecture":2,"title":"Perceiving the Environment","explain":"The examples emphasize that living systems detect external cues and direct movement or behavior in response. At cell level, receptors perform the sensing and signaling pathways organize the response.","mustKnow":["Environmental information must first be detected.","Sensing is followed by a directed response."],"terms":[{"term":"Chemotaxis","meaning":"Directed cell movement in response to a chemical gradient."},{"term":"Phagocytosis","meaning":"Engulfment of a particle by a cell."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In the neutrophil example, directed movement toward a chemical cue is followed by what process?","options":["Phagocytosis","Transcription","Treadmilling","Endocrine secretion"],"answer":0,"explanation":"The caption describes chemotactic and phagocytic responses."}]},"diagramGuide":["The right panel names a neutrophil response to a micropipette-held target: chemical sensing directs movement (chemotaxis), followed by engulfment (phagocytosis)."]},{"page":179,"lecture":"Cellular Signaling","slideInLecture":3,"title":"Why Cells Need Signaling","explain":"Cells must detect changes around them and respond. Because a cell may receive several signals at once, it must process and integrate them into one coordinated action plan.","mustKnow":["Cells sense environmental change.","Cells can receive multiple signals simultaneously.","Signal information is integrated into a response."],"terms":[{"term":"Signal integration","meaning":"Combining multiple inputs to determine one cellular response."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why must a cell process multiple received signals?","options":["To produce one coordinated action plan","To ensure every receptor gives an identical response","To prevent all environmental sensing","To keep every pathway independent"],"answer":0,"explanation":"Cells integrate concurrent information into a unified response."}]},"diagramGuide":["The left micrograph shows a cell interacting with nearby material; the right time-lapse field illustrates that a cell population can change behavior over time after receiving information."]},{"page":180,"lecture":"Cellular Signaling","slideInLecture":4,"title":"Core Features of Cell Signaling","explain":"Signals can operate over short or long distances, and cells respond only if they have the right receptor and state. Lipid-soluble signals may cross the membrane to intracellular receptors, while many other signals use cell-surface receptors and internal relay pathways.","mustKnow":["Only target cells with suitable receptors respond.","Responses may be rapid or slow.","Some hormones use intracellular receptors; others use cell-surface receptors."],"terms":[{"term":"Target cell","meaning":"A cell able to respond because it has the appropriate receptor and machinery."},{"term":"Intracellular receptor","meaning":"A receptor located inside the cell."},{"term":"Cell-surface receptor","meaning":"A membrane receptor that detects an extracellular signal."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which signal is most likely to use an intracellular receptor?","options":["A membrane-impermeant peptide","A lipid-soluble steroid hormone","A large extracellular-matrix protein","A surface-bound juxtacrine ligand"],"answer":1,"explanation":"Some lipid-soluble hormones cross the plasma membrane and bind intracellular receptors."},{"q":"What determines the limited set of signals to which a particular cell responds?","options":["Only the signal's molecular mass","Only distance from the bloodstream","The cell's history and current state","The total number of neighboring cells"],"answer":2,"explanation":"The slide states that responsiveness depends on a cell's history and current state."}]},"diagramGuide":["No pathway diagram is shown. Organize the bullets as range, cell competence, response speed, and receptor location."]},{"page":181,"lecture":"Cellular Signaling","slideInLecture":5,"title":"Chemical Types of Signals","explain":"Cell signals have many chemical forms: amino-acid derivatives, gases, steroids, peptides or proteins, and surface-bound molecules. Their chemistry influences how they travel and whether they can cross the plasma membrane.","mustKnow":["NO and CO are gaseous signals.","Steroid hormones are derived from cholesterol.","Many peptide and protein signals act outside the cell through receptors."],"terms":[{"term":"Steroid hormone","meaning":"A cholesterol-derived signal that can often cross the plasma membrane."},{"term":"Neurotransmitter","meaning":"A signal released by a neuron to act on another cell."},{"term":"Antigen receptor","meaning":"A B-cell or T-cell receptor that recognizes foreign antigen."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which pair consists entirely of gaseous signaling molecules listed on the slide?","options":["NO and CO","NO and cortisol","CO and dopamine","Epinephrine and acetylcholine"],"answer":0,"explanation":"Nitric oxide and carbon monoxide are the two gases listed."},{"q":"Steroid signaling molecules are derived from which precursor?","options":["Glucose","Glycogen","RNA","Cholesterol"],"answer":3,"explanation":"The slide states that steroids are derived from cholesterol."},{"q":"Which signal class includes glutamate, glycine, acetylcholine, epinephrine, dopamine, and thyroid hormone on this slide?","options":["Amino acids and amino-acid derivatives","Gases","Steroids only","Extracellular-matrix proteins only"],"answer":0,"explanation":"All of these examples are placed in the amino-acid and amino-acid-derivative category."}]},"diagramGuide":[]},{"page":182,"lecture":"Cellular Signaling","slideInLecture":6,"title":"Autocrine and Paracrine Signaling","explain":"In autocrine signaling, the producing cell also responds to its own messenger. In paracrine signaling, the messenger travels a short distance to nearby target cells; PDGF released during wound repair is the slide's example.","mustKnow":["Autocrine means self-signaling.","Paracrine means local signaling to nearby cells.","PDGF is a paracrine wound-repair example."],"terms":[{"term":"Autocrine","meaning":"A signaling mode in which a cell responds to its own secreted signal."},{"term":"Paracrine","meaning":"Short-range signaling to nearby cells."},{"term":"PDGF","meaning":"Platelet-derived growth factor, a local signal involved in repair."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"PDGF released from platelets at a wound acts mainly by which signaling mode?","options":["Autocrine","Paracrine","Endocrine","Juxtacrine"],"answer":1,"explanation":"PDGF travels locally to nearby target cells during repair."},{"q":"Which feature defines autocrine signaling?","options":["The signal must enter the bloodstream","The producing cell also expresses receptors for its messenger","The ligand must remain membrane-bound on another cell","The signal acts only through an intracellular steroid receptor"],"answer":1,"explanation":"In autocrine signaling, a cell releases a messenger to which that same cell can respond."},{"q":"Why do paracrine messengers generally remain local?","options":["They are always covalently attached to DNA","They can travel only inside red blood cells","They are commonly unstable, degraded, or trapped by extracellular matrix","They cannot bind receptors"],"answer":2,"explanation":"The slide lists instability, enzymatic degradation, and extracellular-matrix binding as limits on long-distance travel."}]},"diagramGuide":["Autocrine diagram: signal returns to receptors on the same producing cell. Paracrine diagram: a signaling cell releases local mediator that diffuses only to nearby target cells."]},{"page":183,"lecture":"Cellular Signaling","slideInLecture":7,"title":"Juxtacrine and Endocrine Signaling","explain":"Juxtacrine signaling requires direct contact between surface molecules on neighboring cells. Endocrine hormones enter the bloodstream and act at distant targets; insulin released by pancreatic beta cells is the slide's example.","mustKnow":["Juxtacrine signaling is contact-dependent.","Endocrine signaling uses the bloodstream for long-range delivery.","Insulin is an endocrine hormone."],"terms":[{"term":"Juxtacrine","meaning":"Direct contact-dependent signaling between neighboring cells."},{"term":"Endocrine","meaning":"Long-range hormonal signaling through the bloodstream."},{"term":"Contact inhibition","meaning":"Reduced cell growth or division when cells contact neighbors."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which feature uniquely identifies juxtacrine signaling?","options":["Transport through blood","Direct contact between membrane-bound ligand and receptor","Diffusion to nearby cells","A cell responding to its own secretion"],"answer":1,"explanation":"Juxtacrine signaling requires direct cell-cell contact."},{"q":"Which molecules are given as juxtacrine regulators of contact inhibition?","options":["Insulin and glucagon","NO and CO","Cortisol and estradiol","Integrins and cadherins"],"answer":3,"explanation":"The slide cites the cell-adhesion molecules integrins and cadherins in contact-dependent signaling."},{"q":"What response to insulin is used as the endocrine example?","options":["Glucose uptake in liver cells","Contact inhibition in epithelial cells","Histamine release from mast cells","Phagocytosis by neutrophils"],"answer":0,"explanation":"Insulin from pancreatic beta cells is stated to stimulate glucose uptake in liver cells."}]},"diagramGuide":["Juxtacrine diagram: membrane-bound ligand and receptor touch across adjacent cells. Endocrine diagram: hormone enters blood, travels, exits near a distant target, and binds its receptor."]},{"page":184,"lecture":"Cellular Signaling","slideInLecture":8,"title":"Examples of Hormone Signals","explain":"The table links each hormone to its origin, chemical nature, and action. High-yield pairs include adrenal epinephrine, adrenal cortisol, pancreatic alpha-cell glucagon, pancreatic beta-cell insulin, and thyroid-gland thyroxine.","mustKnow":["Epinephrine and cortisol originate in the adrenal gland.","Glucagon comes from pancreatic alpha cells; insulin from beta cells.","Cortisol, estradiol, and testosterone are steroids."],"terms":[{"term":"Glucagon","meaning":"A pancreatic alpha-cell peptide hormone that promotes fuel mobilization."},{"term":"Insulin","meaning":"A pancreatic beta-cell protein hormone that promotes glucose uptake and synthesis."},{"term":"Cortisol","meaning":"An adrenal steroid hormone that affects metabolism in many tissues."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which source-cell pairing is correct according to the table?","options":["Glucagon—pancreatic alpha cells","Insulin—pancreatic alpha cells","Cortisol—thyroid gland","Thyroxine—adrenal gland"],"answer":0,"explanation":"Glucagon is produced by pancreatic alpha cells; insulin is produced by beta cells."},{"q":"Which hormone in the table is a protein secreted by pancreatic beta cells?","options":["Glucagon","Insulin","Cortisol","Thyroxine"],"answer":1,"explanation":"The table identifies insulin as a protein produced by pancreatic beta cells."},{"q":"Which listed hormone stimulates metabolism in many cell types?","options":["Estradiol","Glucagon","Thyroid hormone","Testosterone"],"answer":2,"explanation":"The thyroxine row lists stimulation of metabolism in many cell types."}]},"diagramGuide":["Read the table across each row: signal → site of origin → chemical nature → action. Do not mix a hormone's source with its target tissue."]},{"page":185,"lecture":"Cellular Signaling","slideInLecture":9,"title":"Local, Neural, and Contact Signals","explain":"The table contrasts local mediators, neurotransmitters, and contact-dependent signals. EGF and PDGF promote proliferation, NGF supports neurons, TGF-beta inhibits proliferation, histamine promotes inflammatory vessel changes, and GABA is inhibitory in the central nervous system.","mustKnow":["EGF and PDGF stimulate proliferation.","Histamine promotes vessel dilation and leakiness in inflammation.","GABA is an inhibitory neurotransmitter.","Delta is a contact-dependent transmembrane signal."],"terms":[{"term":"EGF","meaning":"Epidermal growth factor, a protein signal that stimulates proliferation."},{"term":"GABA","meaning":"An inhibitory neurotransmitter in the central nervous system."},{"term":"Histamine","meaning":"A mast-cell signal that promotes blood-vessel dilation and leakiness."},{"term":"Delta","meaning":"A membrane-bound contact-dependent signal."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which listed signal inhibits proliferation of several cell types?","options":["EGF","PDGF","TGF-β","Histamine"],"answer":2,"explanation":"The table assigns an antiproliferative action to transforming growth factor beta."},{"q":"Which local mediator causes blood vessels to dilate and become leaky during inflammation?","options":["EGF","TGF-beta","Delta","Histamine"],"answer":3,"explanation":"The histamine row lists vasodilation and increased leakiness during inflammation."},{"q":"Which contact-dependent signal inhibits neighboring cells from adopting the same specialized fate as the signaling cell?","options":["Delta","PDGF","Nitric oxide","Acetylcholine"],"answer":0,"explanation":"The table describes Delta as a transmembrane signal that inhibits neighboring-cell specialization."}]},"diagramGuide":["Read the table across each row and first classify the signal as local mediator, neurotransmitter, or contact-dependent signal; then link source and action."]},{"page":186,"lecture":"Cellular Signaling","slideInLecture":10,"title":"Signal Processing Architecture","explain":"Cell signaling can be viewed as an engineering chain: sensor, information processing, and response. Useful pathway properties include specificity, cascades, amplification, feedback, and integration.","mustKnow":["The basic sequence is sensor to processing to response.","Amplification increases signal output.","Feedback modifies pathway activity.","Integration combines inputs."],"terms":[{"term":"Specificity","meaning":"Selective recognition of particular signals and targets."},{"term":"Amplification","meaning":"Production of a larger downstream response from a smaller initial input."},{"term":"Feedback","meaning":"A downstream effect that changes earlier pathway activity."},{"term":"Cascade","meaning":"A sequence in which one activated component activates the next."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which feature allows one activated receptor to generate many downstream molecules?","options":["Specificity","Amplification","Integration","Contact inhibition"],"answer":1,"explanation":"Amplification increases output at successive signaling steps."},{"q":"Which pathway feature combines information from multiple signaling inputs?","options":["Specificity","Integration","Amplification","Cascade"],"answer":1,"explanation":"Integration is the feature that combines multiple inputs into a coordinated output."}]},"diagramGuide":["Top flow is sensor → information processing → response/action. Bottom symbols summarize specificity, cascade, amplification, feedback, and integration as pathway properties."]},{"page":187,"lecture":"Cellular Signaling","slideInLecture":11,"title":"Signaling Pathways Form Networks","explain":"The waterfall analogy and pathway map show that signals pass through multiple connected components rather than one isolated switch. Different receptors can converge on shared proteins, and one pathway can branch toward several outputs.","mustKnow":["Signaling often proceeds as a multistep cascade.","Different receptor inputs can converge.","One signal can branch into multiple responses."],"terms":[{"term":"Convergence","meaning":"Different upstream signals meeting at a shared pathway component."},{"term":"Divergence","meaning":"One upstream signal branching toward multiple downstream effects."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"When several receptor pathways feed into one shared intracellular component, the network shows what property?","options":["Divergence","Convergence","Treadmilling","Endocrine transport"],"answer":1,"explanation":"Convergence is the merging of distinct upstream inputs."},{"q":"When one receptor pathway produces several distinct downstream outputs, what network property is illustrated?","options":["Convergence","Equilibrium","Divergence","Contact inhibition"],"answer":2,"explanation":"Branching from one input toward multiple outputs is divergence."}]},"diagramGuide":["The waterfall is an analogy for a multistep cascade. In the network, arrows show direction; branching is divergence to several outputs, while merging arrows show convergence on shared intermediates."]},{"page":188,"lecture":"Cellular Signaling","slideInLecture":12,"title":"Nuclear Receptor Signaling","explain":"Cortisol diffuses through the lipid bilayer and binds an intracellular glucocorticoid receptor. The a
