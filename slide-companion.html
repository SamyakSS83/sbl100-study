s synthesized continuously toward fork movement, while the lagging strand is made discontinuously as Okazaki fragments from RNA primers.","mustKnow":["Helicase opens the parental DNA.","The leading strand is synthesized continuously.","The lagging strand forms Okazaki fragments.","RNA primers provide starts for DNA synthesis."],"terms":[{"term":"Replication fork","meaning":"Y-shaped region where parental DNA opens and is copied."},{"term":"Leading strand","meaning":"New strand synthesized continuously toward fork movement."},{"term":"Lagging strand","meaning":"New strand synthesized discontinuously."},{"term":"Okazaki fragment","meaning":"Short DNA segment made on the lagging strand."}],"diagramGuide":["The fork moves downward while helicase opens the parental duplex; topoisomerase acts ahead of helicase and SSB proteins coat separated strands.","The leading strand is synthesized continuously toward the fork; the lagging strand is synthesized discontinuously as Okazaki fragments away from the fork.","Every new DNA segment extends 5′→3′ from an RNA primer."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which replication-fork pairing is correct?","options":["Leading strand—3′→5′ synthesis; lagging strand—5′→3′ synthesis","Leading strand—requires no primer; lagging strand—requires no primer","Leading strand—continuous; lagging strand—Okazaki fragments","Leading strand—Okazaki fragments; lagging strand—continuous"],"answer":2,"explanation":"The diagram labels continuous leading synthesis and discontinuous lagging synthesis as Okazaki fragments."},{"q":"Which protein acts ahead of helicase to relieve torsional strain in the parental DNA?","options":["Topoisomerase","Single-strand binding protein","DNA ligase","RNA polymerase"],"answer":0,"explanation":"The diagram places topoisomerase ahead of helicase on the still-double-stranded DNA."},{"q":"What is the role of single-strand binding proteins at the replication fork?","options":["They synthesize RNA primers","They stabilize the separated parental strands","They join Okazaki fragments","They unwind DNA ahead of the fork"],"answer":1,"explanation":"SSB proteins coat and stabilize exposed single-stranded DNA after helicase separates the strands."}]}},{"page":47,"lecture":"Gene Expression and Regulation","slideInLecture":7,"title":"Replication video references","explain":"This slide contains external video links intended to reinforce the DNA-replication mechanism.","mustKnow":["The referenced topic is DNA replication."],"terms":[],"diagramGuide":[],"interaction":{"type":"tap","label":"Video-reference slide acknowledged"}},{"page":48,"lecture":"Gene Expression and Regulation","slideInLecture":8,"title":"Transcription: DNA to RNA","explain":"RNA polymerase converts DNA information into RNA. It binds a promoter, opens a transcription bubble, escapes the promoter, elongates RNA by complementary base addition, and terminates to release the RNA.","mustKnow":["Transcription occurs in prokaryotic cytoplasm and the eukaryotic nucleus.","RNA polymerase synthesizes RNA.","The four listed stages are initiation, promoter escape, elongation, and termination.","Initiation begins at a promoter."],"terms":[{"term":"RNA polymerase","meaning":"Enzyme that synthesizes RNA from a DNA template."},{"term":"Promoter","meaning":"DNA site where transcription machinery binds to begin transcription."},{"term":"Transcription bubble","meaning":"Locally opened DNA region being transcribed."},{"term":"Elongation","meaning":"Stage in which complementary nucleotides lengthen the RNA chain."}],"diagramGuide":["The upper gene diagram places promoter upstream, structural gene in the middle, and terminator downstream; template and coding strands run antiparallel.","In the transcription bubble, RNA polymerase moves along the template strand while the nascent RNA exits behind it.","Read the stated sequence as initiation → promoter escape → elongation → termination."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What is the sequence of transcription stages listed on the slide?","options":["Initiation → promoter escape → elongation → termination","Promoter escape → initiation → termination → elongation","Elongation → initiation → promoter escape → termination","Initiation → elongation → promoter escape → termination"],"answer":0,"explanation":"The slide numbers those four stages in that order."},{"q":"Where does transcription occur in eukaryotic cells according to the slide?","options":["Cytoplasm","Nucleus","Golgi apparatus","Lysosome"],"answer":1,"explanation":"The slide contrasts prokaryotic transcription in the cytoplasm with eukaryotic transcription in the nucleus."},{"q":"What event defines promoter escape during transcription?","options":["RNA polymerase leaves the promoter and enters productive elongation","The completed RNA is released","Introns are removed from pre-mRNA","DNA replication begins at an origin"],"answer":0,"explanation":"Promoter escape is the transition after initiation in which RNA polymerase clears the promoter and proceeds into elongation."}]}},{"page":49,"lecture":"Gene Expression and Regulation","slideInLecture":9,"title":"Template and coding DNA strands","explain":"RNA is synthesized using the noncoding antisense strand as the template. The coding or sense strand matches the mRNA sequence except that DNA has thymine where RNA has uracil.","mustKnow":["The antisense/noncoding strand is the transcription template.","The sense/coding strand has the same sequence as mRNA except T replaces U.","mRNA is complementary to the template strand."],"terms":[{"term":"Template strand","meaning":"DNA strand read by RNA polymerase; also called antisense or noncoding."},{"term":"Coding strand","meaning":"DNA strand matching mRNA sequence except for T instead of U."},{"term":"Uracil","meaning":"RNA base used in place of thymine."}],"diagramGuide":["The three panels show initiation at the promoter with sigma factor, elongation by RNA polymerase, and termination near the terminator with rho factor.","The RNA is complementary to the template/antisense strand and nearly matches the coding/sense strand except U replaces T."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"How does mRNA sequence compare with the coding (sense) strand?","options":["It is complementary and uses T instead of U","It is identical including T","It is unrelated because RNA polymerase reads the coding strand","It is the same except U replaces T"],"answer":3,"explanation":"mRNA is complementary to the template strand and matches the coding strand except U replaces T."},{"q":"Which DNA strand is directly read by RNA polymerase during transcription?","options":["Coding or sense strand","Template or antisense strand","Both strands simultaneously","Neither DNA strand"],"answer":1,"explanation":"RNA polymerase uses the template, noncoding, or antisense strand to synthesize complementary RNA."},{"q":"If the coding DNA strand contains 5′-ATGC-3′, what is the corresponding mRNA sequence?","options":["5′-ATGC-3′","5′-UACG-3′","5′-AUGC-3′","5′-TACG-3′"],"answer":2,"explanation":"The mRNA matches the coding strand in the 5′→3′ direction except that U replaces T."}]}},{"page":50,"lecture":"Gene Expression and Regulation","slideInLecture":10,"title":"Eukaryotic RNA processing","explain":"Eukaryotic mRNA is first made as pre-mRNA containing coding exons and noncoding introns. RNA processing removes introns by splicing and joins exons to create mature mRNA.","mustKnow":["Eukaryotes initially produce pre-mRNA.","Exons are the coding segments shown.","Introns are noncoding segments.","Splicing removes introns to form mature mRNA."],"terms":[{"term":"Pre-mRNA","meaning":"Initial eukaryotic RNA transcript before processing."},{"term":"Exon","meaning":"Coding segment retained in mature mRNA."},{"term":"Intron","meaning":"Noncoding segment removed during processing."},{"term":"Splicing","meaning":"Removal of introns and joining of exons."}],"diagramGuide":["The top bar is pre-mRNA with cap, leader, alternating exons and introns, trailer, and poly(A) tail.","The lower bar is mature mRNA after introns are removed and exons joined; the protein-coding sequence remains between untranslated end regions."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which sequences are removed when eukaryotic pre-mRNA becomes mature mRNA?","options":["The 5′ cap","The poly(A) tail","Introns","Exons"],"answer":2,"explanation":"RNA splicing removes non-coding introns and joins exons."},{"q":"Which features remain at the ends of the mature mRNA shown after splicing?","options":["5′ cap and poly(A) tail","Two introns","Promoter and terminator DNA","RNA primers and Okazaki fragments"],"answer":0,"explanation":"The mature mRNA diagram retains the 5′ cap and 3′ poly(A) tail while introns are removed."},{"q":"Which region of the processed mRNA is formed by joining the retained coding segments?","options":["The intron-only region","The exon-derived protein-coding sequence","The promoter","The replication origin"],"answer":1,"explanation":"Splicing removes introns and joins exons, producing the continuous protein-coding sequence in mature mRNA."}]}},{"page":51,"lecture":"Gene Expression and Regulation","slideInLecture":11,"title":"Supplementary translation video","explain":"This slide contains only a link to a supplementary video. It adds no new written fact beyond the surrounding translation slides.","mustKnow":["Treat this as optional supporting material, not a new pathway or definition."],"terms":[],"diagramGuide":[],"interaction":{"type":"tap","label":"Non-content slide: supplementary video link."}},{"page":52,"lecture":"Gene Expression and Regulation","slideInLecture":12,"title":"Translation direction","explain":"Translation is the process of making a protein from an mRNA. A ribosome moves along mRNA from its 5′ end toward its 3′ end, while the protein chain grows from the amino end to the carboxyl end.","mustKnow":["Translation occurs on ribosomes.","mRNA is read 5′ to 3′.","Protein is synthesized N-terminus to C-terminus."],"terms":[{"term":"Translation","meaning":"Synthesis of a protein using the sequence in mRNA."},{"term":"N-terminus","meaning":"The amino end and first end made of a protein."},{"term":"C-terminus","meaning":"The carboxyl end toward which a protein grows."}],"diagramGuide":["Read the mRNA strand left to right as 5′→3′; each codon feeds one amino acid into the growing chain.","The chain grows by adding each new amino acid to the C-terminal end, so synthesis is N→C."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A ribosome is moving toward the 3′ end of an mRNA. Where is the next amino acid added?","options":["To the protein's N-terminus","To the protein's C-terminus","To the mRNA's 5′ end","To the mRNA's 3′ end"],"answer":1,"explanation":"Translation reads mRNA 5′→3′ while extending the polypeptide at its C-terminal end."}]}},{"page":53,"lecture":"Gene Expression and Regulation","slideInLecture":13,"title":"Translation machinery","explain":"The ribosome is the molecular machine that joins amino acids. The mRNA supplies the coded instructions, and tRNAs carry the corresponding amino acids to the ribosome in the cytoplasm.","mustKnow":["mRNA provides the genetic message.","tRNA delivers amino acids.","The ribosome forms the protein chain."],"terms":[{"term":"Ribosome","meaning":"RNA-protein machine where peptide synthesis occurs."},{"term":"tRNA","meaning":"Transfer RNA that carries an amino acid to the ribosome."},{"term":"mRNA","meaning":"Messenger RNA containing the sequence to be translated."}],"diagramGuide":["Follow the three-part machine: mRNA is the template, tRNA is the adaptor carrying an amino acid, and the ribosome is the catalytic assembly site.","In the peptide-bond inset, the bond forms between the carboxyl group of one amino acid and the amino group of the next."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which pairing correctly separates template, adaptor, and synthesis site?","options":["mRNA—adaptor; tRNA—template; ribosome—site","mRNA—template; tRNA—adaptor; ribosome—site","mRNA—site; tRNA—template; ribosome—adaptor","mRNA—template; tRNA—site; ribosome—adaptor"],"answer":1,"explanation":"mRNA carries codons, tRNA links codons to amino acids, and the ribosome catalyzes peptide synthesis."}]}},{"page":54,"lecture":"Gene Expression and Regulation","slideInLecture":14,"title":"From gene to functional protein","explain":"Gene expression proceeds through linked stages. DNA is transcribed into RNA in the nucleus, the RNA is processed into mature mRNA, and the mRNA is translated in the cytoplasm. The new protein then folds and may be transported through the endoplasmic reticulum and Golgi.","mustKnow":["Transcription: DNA to RNA.","RNA processing produces mature mRNA.","Translation: mRNA to protein.","Folding gives a protein its three-dimensional structure."],"terms":[{"term":"Chaperone","meaning":"Protein that helps another protein fold correctly."},{"term":"Golgi apparatus","meaning":"Organelle that modifies and sorts many transported proteins."}],"diagramGuide":["Read the boxes left to right: DNA transcription in the nucleus → RNA processing → translation in the cytoplasm → folding and ER/Golgi transport.","The arrows indicate order, not chemical reversibility."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A newly transcribed eukaryotic RNA is not yet ready for cytosolic translation. Which event must occur next in the slide's sequence?","options":["Golgi transport","RNA processing","Protein folding","DNA replication"],"answer":1,"explanation":"RNA processing produces mature mRNA before translation."},{"q":"Which event belongs to protein maturation after translation rather than RNA processing?","options":["Chaperone-assisted folding","Addition of a 5′ cap","Removal of introns","Poly(A) tail addition"],"answer":0,"explanation":"Chaperones assist the newly synthesized polypeptide in acquiring its three-dimensional structure."}]}},{"page":55,"lecture":"Gene Expression and Regulation","slideInLecture":15,"title":"Why gene expression is regulated","explain":"Cells do not need every gene product at the same time. Regulation lets cells match gene activity to metabolism, growth, development, and tissue specialization. Bacteria mainly control the start of transcription, while eukaryotes use more layers of control.","mustKnow":["Gene regulation supports metabolism, growth, development, and differentiation.","Prokaryotic genes are controlled mainly at transcription.","Eukaryotic regulation is more complex."],"terms":[{"term":"Differentiation","meaning":"Development of cells into specialized cell types."},{"term":"Gene regulation","meaning":"Control of when and how strongly a gene is expressed."}],"diagramGuide":[],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"The slide contrasts bacterial and eukaryotic regulation. Which statement matches it?","options":["Bacteria regulate mainly at translation termination","Bacteria regulate mainly at transcription; eukaryotes use additional levels","Eukaryotes regulate only at transcription initiation","Neither cell type regulates metabolic genes"],"answer":1,"explanation":"Bacterial control is mainly transcriptional, while eukaryotic control is multilayered."}]}},{"page":56,"lecture":"Gene Expression and Regulation","slideInLecture":16,"title":"Regulatory levels in prokaryotes and eukaryotes","explain":"Prokaryotes mainly regulate transcription initiation. Because they have no nucleus, transcription and translation can occur at the same time. Eukaryotes can regulate transcription, RNA processing, RNA export from nucleus to cytosol, and translation.","mustKnow":["Prokaryotic control is mainly at transcription initiation.","Prokaryotic transcription and translation can be simultaneous.","Eukaryotes regulate gene expression at several stages."],"terms":[{"term":"Co-translation","meaning":"Translation beginning while an mRNA is still being transcribed."},{"term":"Post-transcriptional regulation","meaning":"Control applied after an RNA has been transcribed."}],"diagramGuide":["The tree splits regulation by cell type: prokaryotes mainly regulate transcription initiation; eukaryotes add post-transcriptional processing, export, and translation controls.","The prokaryotic branch links simultaneous transcription and translation to the absence of compartmentalization."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which feature most directly permits bacterial transcription and translation to occur simultaneously?","options":["Presence of introns","Absence of nuclear compartmentalization","Use of several RNA polymerases","Presence of a Golgi apparatus"],"answer":1,"explanation":"Without a nucleus, ribosomes can engage an mRNA while it is being transcribed."},{"q":"Which regulatory level is specifically associated with movement of a eukaryotic transcript between compartments?","options":["Transcription initiation","RNA transport from nucleus to cytosol","Ribosome assembly","DNA replication"],"answer":1,"explanation":"Eukaryotic gene expression can be regulated during transport of processed RNA from the nucleus to the cytosol."}]}},{"page":57,"lecture":"Gene Expression and Regulation","slideInLecture":17,"title":"Positive and negative gene regulation","explain":"Positive regulation increases gene expression, usually through an activator or inducer. Negative regulation decreases gene expression, usually through a repressor or inhibitor.","mustKnow":["Positive regulation increases expression.","Negative regulation decreases expression.","Activator and repressor have opposite effects."],"terms":[{"term":"Activator","meaning":"Regulatory factor that increases gene expression."},{"term":"Repressor","meaning":"Regulatory factor that decreases gene expression."},{"term":"Inducer","meaning":"Molecule that promotes expression of a gene or operon."}],"diagramGuide":[],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A DNA-bound regulator lowers transcription of its target gene. In the slide's terminology it is a:","options":["Positive activator","Negative repressor","Positive inducer","Constitutive marker"],"answer":1,"explanation":"A repressor or inhibitor mediates negative regulation."}]}},{"page":58,"lecture":"Gene Expression and Regulation","slideInLecture":18,"title":"Operons","explain":"An operon is a bacterial DNA unit containing several functionally related genes controlled by one promoter. The genes are transcribed together, allowing a whole pathway to be switched as one unit. Operons are characteristic of prokaryotes, not eukaryotes.","mustKnow":["One promoter controls a cluster of genes.","Operons are found in prokaryotes.","Lac, ara, and gal operons control sugar metabolism."],"terms":[{"term":"Operon","meaning":"Cluster of prokaryotic genes controlled together by one promoter."},{"term":"Promoter","meaning":"DNA site where RNA polymerase binds to begin transcription."},{"term":"Operator","meaning":"Regulatory DNA site where a repressor can bind."}],"diagramGuide":["The colored DNA blocks show one promoter and operator controlling several structural genes as one unit.","A single promoter upstream of multiple genes implies one polycistronic transcript."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which arrangement is diagnostic of the prokaryotic operon shown?","options":["Several genes, each with an independent promoter","A gene cluster controlled by one promoter and operator","One gene controlled by several origins of replication","A eukaryotic exon cluster under one enhancer"],"answer":1,"explanation":"An operon is a gene cluster transcribed from shared regulatory DNA."},{"q":"Which feature allows several prokaryotic genes in one operon to be transcribed together?","options":["Each gene has a separate enhancer","Each gene is on a different chromosome","The gene cluster is controlled by one promoter","The genes use separate RNA polymerases"],"answer":2,"explanation":"An operon is a cluster of functionally related genes controlled by a single promoter and transcribed as one unit."}]}},{"page":59,"lecture":"Gene Expression and Regulation","slideInLecture":19,"title":"Purpose of the lac operon","explain":"The lac operon contains genes that let bacteria take up and use lactose as an energy source. E. coli strongly uses this system when lactose is available but the preferred sugar, glucose, is unavailable.","mustKnow":["The lac operon supports lactose use.","Its genes share one promoter and one mRNA.","Glucose is preferred over lactose."],"terms":[{"term":"Lac operon","meaning":"Bacterial operon encoding proteins needed for lactose metabolism."}],"diagramGuide":[],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why is lac-operon expression normally favored only after glucose becomes unavailable?","options":["Lactose cannot enter cells containing glucose","Glucose is the preferred carbon source","Glucose directly destroys lacZ mRNA","Lactose represses CAP"],"answer":1,"explanation":"The system prioritizes glucose and switches strongly to lactose use when glucose is scarce."}]}},{"page":60,"lecture":"Gene Expression and Regulation","slideInLecture":20,"title":"Lactose uptake and breakdown","explain":"The diagram links lac-operon products to lactose use. LacY permease transports lactose into the bacterium. LacZ β-galactosidase breaks lactose into glucose and galactose and also produces the inducer allolactose. LacA encodes a transacetylase.","mustKnow":["Permease brings lactose into the cell.","β-galactosidase acts on lactose.","Allolactose helps switch on the operon."],"terms":[{"term":"Permease","meaning":"Membrane transport protein encoded by lacY that imports lactose."},{"term":"β-galactosidase","meaning":"lacZ enzyme that breaks lactose and can form allolactose."},{"term":"Allolactose","meaning":"Lactose isomer that acts as the lac-operon inducer."}],"diagramGuide":["Trace lactose from the external medium through permease, then to β-galactosidase-mediated breakdown inside the bacterium.","Use the diagram to separate transport (LacY) from catalysis (LacZ)."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In the diagram, which sequence correctly describes lactose utilization?","options":["LacZ imports lactose; LacY cleaves it","LacY imports lactose; LacZ cleaves it","LacA imports lactose; CAP cleaves it","CAP imports lactose; LacA cleaves it"],"answer":1,"explanation":"LacY is permease; LacZ is β-galactosidase."},{"q":"Which lac-operon product directly transports lactose across the bacterial membrane?","options":["β-galactosidase","Lac repressor","Transacetylase","Lactose permease"],"answer":3,"explanation":"LacY encodes lactose permease, the membrane protein that imports lactose."}]}},{"page":61,"lecture":"Gene Expression and Regulation","slideInLecture":21,"title":"Two controls of the lac operon","explain":"The lac operon integrates two nutrient signals. The lac repressor responds indirectly to lactose through allolactose and blocks transcription when lactose is absent. CAP responds indirectly to glucose through cAMP and stimulates transcription when glucose is low.","mustKnow":["Lac repressor is the lactose-control arm.","CAP is the glucose-control arm.","Allolactose disables repression.","High cAMP indicates low glucose."],"terms":[{"term":"CAP","meaning":"Catabolite activator protein that promotes lac transcription when activated by cAMP."},{"term":"cAMP","meaning":"Signal that rises when glucose is low and activates CAP."}],"diagramGuide":[],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which two indirect signals are correctly matched to their sensors?","options":["Allolactose—CAP; cAMP—lac repressor","Allolactose—lac repressor; cAMP—CAP","Glucose—lac repressor; lactose—CAP","cAMP—operator; allolactose—promoter"],"answer":1,"explanation":"Allolactose relieves repression, while cAMP activates CAP under low glucose."},{"q":"Which molecule is the indirect signal through which the lac repressor detects lactose availability?","options":["Allolactose","cAMP","Glucose","ATP"],"answer":0,"explanation":"Allolactose binds the lac repressor and signals that lactose is available."},{"q":"Which regulator–signal relationship is correct in the lac operon?","options":["CAP–allolactose","CAP–cAMP","Repressor–cAMP","RNA polymerase–allolactose"],"answer":1,"explanation":"CAP senses low glucose indirectly through cAMP, whereas the repressor senses lactose through allolactose."}]}},{"page":62,"lecture":"Gene Expression and Regulation","slideInLecture":22,"title":"Genes of the lac operon","explain":"The three structural genes lacZ, lacY, and lacA are transcribed together as one mRNA. Their products perform different parts of lactose handling: breakdown, transport, and transacetylation.","mustKnow":["lacZ encodes β-galactosidase.","lacY encodes lactose permease.","lacA encodes transacetylase.","All three genes share one transcript."],"terms":[{"term":"lacZ","meaning":"Gene for β-galactosidase."},{"term":"lacY","meaning":"Gene for lactose permease."},{"term":"lacA","meaning":"Gene for transacetylase."}],"diagramGuide":["Read the DNA map left to right: CAP site → promoter → operator → lacZ → lacY → lacA.","Match the products shown at right: LacZ β-galactosidase, LacY permease, LacA transacetylase."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which complete lac-gene mapping is correct?","options":["lacZ—permease; lacY—transacetylase; lacA—β-galactosidase","lacZ—β-galactosidase; lacY—permease; lacA—transacetylase","lacZ—repressor; lacY—CAP; lacA—polymerase","lacZ—transacetylase; lacY—β-galactosidase; lacA—permease"],"answer":1,"explanation":"The three structural genes encode β-galactosidase, permease, and transacetylase respectively."},{"q":"Which lac gene–product pairing is correct?","options":["lacZ–lactose permease","lacY–β-galactosidase","lacA–transacetylase","lacA–lac repressor"],"answer":2,"explanation":"lacA encodes transacetylase; lacZ encodes β-galactosidase and lacY encodes lactose permease."}]}},{"page":63,"lecture":"Gene Expression and Regulation","slideInLecture":23,"title":"Promoter, operator, and CAP site","explain":"The promoter is where RNA polymerase binds. The operator overlaps the promoter and can be occupied by the lac repressor, physically blocking transcription. The CAP-binding site is a positive-control site; bound CAP helps RNA polymerase attach.","mustKnow":["RNA polymerase binds the promoter.","Lac repressor binds the operator.","CAP binds the CAP site and promotes transcription."],"terms":[{"term":"Promoter","meaning":"DNA site for RNA polymerase binding."},{"term":"Operator","meaning":"Negative-control DNA site bound by the lac repressor."},{"term":"CAP-binding site","meaning":"Positive-control DNA site where CAP helps recruit RNA polymerase."}],"diagramGuide":["The operator overlaps the promoter region, so a bound repressor physically obstructs RNA polymerase.","CAP binds upstream and assists RNA-polymerase recruitment rather than removing the repressor."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A mutation prevents repressor binding but leaves the CAP site intact. Which regulatory barrier is specifically lost?","options":["CAP-assisted recruitment","Operator-mediated blockage of RNA polymerase","cAMP production","Promoter recognition by RNA polymerase"],"answer":1,"explanation":"The operator-bound repressor is the negative roadblock."},{"q":"Binding of CAP to its regulatory DNA site primarily promotes transcription by:","options":["Cleaving the operator","Converting lactose to allolactose","Destroying the lac repressor","Helping RNA polymerase bind the promoter"],"answer":3,"explanation":"DNA-bound CAP positively regulates the operon by improving RNA-polymerase recruitment to the promoter."}]}},{"page":64,"lecture":"Gene Expression and Regulation","slideInLecture":24,"title":"How lactose removes repression","explain":"Without lactose, the lac repressor binds tightly to the operator and blocks RNA polymerase. When lactose is present, its isomer allolactose binds the repressor, reducing the repressor's ability to bind DNA and clearing the operator.","mustKnow":["No lactose: repressor bound, operon blocked.","Lactose present: allolactose releases the repressor.","Removing the repressor permits transcription but does not guarantee strong transcription."],"terms":[{"term":"Lac repressor","meaning":"Protein that blocks lac-operon transcription by binding the operator."}],"diagramGuide":[],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which event directly changes the lac repressor so it no longer occupies the operator?","options":["CAP binds cAMP","Allolactose binds the repressor","Glucose binds RNA polymerase","Lactose binds the promoter"],"answer":1,"explanation":"Allolactose is the inducer that changes repressor conformation."},{"q":"In the absence of lactose, which DNA element is occupied by the lac repressor?","options":["Operator","CAP site","lacZ coding region","Transcription terminator"],"answer":0,"explanation":"Without allolactose, the repressor binds the operator and obstructs transcription."}]}},{"page":65,"lecture":"Gene Expression and Regulation","slideInLecture":25,"title":"The lac operon is inducible","explain":"Allolactose is an inducer because it triggers expression of the lac operon. The lac operon is called inducible because its default state is off, but the inducer can remove repression and permit expression.","mustKnow":["Allolactose is the inducer.","An inducible operon is normally off.","Inducer presence makes expression possible."],"terms":[{"term":"Inducible operon","meaning":"Operon normally off that can be switched on by an inducer."},{"term":"Inducer","meaning":"Small molecule that triggers gene or operon expression."}],"diagramGuide":["Compare the two panels: without lactose the repressor occupies the operator; with allolactose the repressor changes shape and leaves DNA.","Allolactose acts on the repressor, not directly on RNA polymerase."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which description makes the lac operon inducible?","options":["It is normally ON and tryptophan switches it OFF","It is normally OFF and an inducer switches it ON","It is permanently ON","It is activated directly by glucose"],"answer":1,"explanation":"An inducible operon has a default repressed state relieved by inducer."}]}},{"page":66,"lecture":"Gene Expression and Regulation","slideInLecture":26,"title":"CAP boosts transcription","explain":"RNA polymerase binds the lac promoter weakly on its own. Active CAP binds DNA before the promoter and helps RNA polymerase bind, producing high transcription. The CAP protein is made continuously from a separate regulatory gene but becomes active only under the correct signal.","mustKnow":["CAP increases RNA polymerase binding.","CAP is encoded outside the lac operon.","CAP protein is constitutively available.","CAP must bind cAMP to become active."],"terms":[{"term":"Constitutive expression","meaning":"Continuous expression rather than switching on only under one condition."},{"term":"CAP","meaning":"Activator that helps RNA polymerase bind the lac promoter."}],"diagramGuide":[],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which statement about CAP production and action is correct?","options":["CAP is encoded within lacZ and made only with lactose","CAP is constitutively available but stimulates lac transcription after activation","CAP blocks the operator when glucose is low","CAP cleaves lactose into monosaccharides"],"answer":1,"explanation":"CAP is encoded elsewhere and is constitutively produced; activated CAP improves polymerase binding."},{"q":"The gene encoding CAP is best described as:","options":["Part of the lac structural-gene cluster","Constitutively expressed elsewhere on the chromosome","Induced only by lactose","Located within the lac operator"],"answer":1,"explanation":"The CAP gene is separate from the lac operon and is constitutively expressed."},{"q":"Why does RNA polymerase produce only a few lac transcripts when CAP assistance is absent but repression has been removed?","options":["lacZ inhibits transcription","The operator cleaves the mRNA","The promoter binds RNA polymerase weakly","cAMP degrades RNA polymerase"],"answer":2,"explanation":"RNA polymerase alone binds the lac promoter poorly, producing only basal or leaky transcription."}]}},{"page":67,"lecture":"Gene Expression and Regulation","slideInLecture":27,"title":"cAMP activates CAP","explain":"CAP cannot bind its DNA site effectively by itself. When glucose is low, the cell produces more cAMP. cAMP binds CAP, changes its shape, and allows CAP to bind DNA and promote transcription.","mustKnow":["Low glucose produces high cAMP.","cAMP binds and activates CAP.","CAP without cAMP is inactive."],"terms":[{"term":"Cyclic AMP","meaning":"cAMP, a low-glucose signal that activates CAP."},{"term":"Hunger signal","meaning":"Slide description for cAMP produced when glucose is low."}],"diagramGuide":["Compare low- and high-glucose panels: low glucose gives high cAMP and CAP–cAMP binding; high glucose gives low cAMP and inactive CAP.","The red transcription arrow appears only when CAP–cAMP can occupy the CAP site and repression is absent."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A cell has high glucose. Which CAP state is expected?","options":["High cAMP; CAP bound to DNA","Low cAMP; CAP unable to bind DNA","High allolactose; CAP on operator","Low allolactose; CAP on promoter"],"answer":1,"explanation":"Glucose and cAMP are inversely related; without cAMP, CAP is inactive."},{"q":"What molecular event converts CAP into its DNA-binding form?","options":["Binding of lactose","Cleavage by β-galactosidase","Phosphorylation by LacY","Binding of cAMP"],"answer":3,"explanation":"When glucose is low, cAMP binds CAP and changes its conformation so that it can bind DNA."}]}},{"page":68,"lecture":"Gene Expression and Regulation","slideInLecture":28,"title":"Conditions for strong lac transcription","explain":"Strong lac-operon expression requires two conditions at once: lactose must be present, removing the repressor through allolactose, and glucose must be absent, activating CAP through high cAMP. This leaves RNA polymerase an open path and gives it strong promoter support.","mustKnow":["Lactose present removes repression.","Glucose absent activates CAP.","Both conditions together produce strong transcription."],"terms":[{"term":"Catabolite activation","meaning":"Activation of sugar-use genes by CAP when preferred glucose is scarce."}],"diagramGuide":[],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which molecular occupancy pattern produces maximal lac transcription?","options":["CAP absent, repressor present","CAP absent, repressor absent","CAP present, repressor present","CAP present, repressor absent"],"answer":3,"explanation":"Strong expression requires positive activation plus removal of the negative block."},{"q":"Which condition supplies the positive-regulatory input required for strong lac-operon expression?","options":["Low glucose and high cAMP","High glucose and low cAMP","High glucose and high allolactose only","Low lactose and inactive CAP"],"answer":0,"explanation":"Low glucose raises cAMP, activating CAP and allowing it to bind DNA."},{"q":"For strong lac transcription, allolactose and cAMP respectively cause:","options":["CAP release and repressor binding","Repressor release and CAP activation","Repressor activation and CAP degradation","RNA polymerase release and operator activation"],"answer":1,"explanation":"Allolactose removes the repressor, while cAMP activates CAP; both conditions are required for strong transcription."}]}},{"page":69,"lecture":"Gene Expression and Regulation","slideInLecture":29,"title":"Lac states when glucose is present","explain":"With glucose present, cAMP is low and CAP is inactive. If lactose is absent, the repressor also remains bound, so there is no transcription. If lactose is present, the repressor leaves, but inactive CAP means only low, leaky transcription.","mustKnow":["Glucose present keeps CAP inactive.","Glucose present plus no lactose gives no transcription.","Glucose present plus lactose gives low transcription."],"terms":[{"term":"Leaky transcription","meaning":"Low basal transcription occurring without full activation."}],"diagramGuide":["Read each panel from environmental inputs to DNA occupancy: glucose controls CAP through cAMP, while lactose controls the repressor through allolactose.","Both panels have glucose present, so CAP is absent; lactose only changes no transcription to low basal transcription."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Glucose and lactose are both present. Which combination explains the expected low-level lac transcription?","options":["CAP active; repressor bound","CAP inactive; repressor released","CAP active; repressor released","CAP inactive; repressor bound"],"answer":1,"explanation":"Lactose releases repressor, but glucose keeps cAMP low and CAP inactive."},{"q":"When both glucose and lactose are present, which regulator is inactive because cAMP is low?","options":["Lac repressor","RNA polymerase","CAP","β-galactosidase"],"answer":2,"explanation":"Glucose keeps cAMP low, so CAP remains inactive even though lactose removes the repressor."}]}},{"page":70,"lecture":"Gene Expression and Regulation","slideInLecture":30,"title":"Lac states when glucose is absent","explain":"When glucose is absent, cAMP is high and CAP is active. If lactose is also absent, the bound repressor still blocks transcription. If lactose is present, the repressor is released and active CAP produces strong transcription.","mustKnow":["Low glucose alone cannot overcome a bound repressor.","No glucose plus no lactose gives no transcription.","No glucose plus lactose gives strong transcription."],"terms":[],"diagramGuide":["Both panels lack glucose, so CAP is bound; the decisive difference is lactose, which removes the repressor.","CAP cannot overcome an operator-bound repressor, but CAP plus repressor release produces strong transcription."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Glucose and lactose are both absent. CAP is DNA-bound, yet transcription remains off because:","options":["RNA polymerase lacks ATP","The repressor remains on the operator","lacZ degrades cAMP","The promoter is deleted"],"answer":1,"explanation":"No allolactose is present to remove the repressor."},{"q":"When neither glucose nor lactose is present, which pair is simultaneously DNA-bound?","options":["Inactive CAP and free repressor","LacY and β-galactosidase","Allolactose and RNA polymerase","Active CAP and lac repressor"],"answer":3,"explanation":"Low glucose activates CAP, but absent lactose leaves the repressor bound to the operator."}]}},{"page":71,"lecture":"Gene Expression and Regulation","slideInLecture":31,"title":"Four-condition lac-operon table","explain":"The table combines the two switches. Lactose determines whether the repressor binds; glucose determines whether CAP binds. Strong expression occurs only with lactose present and glucose absent.","mustKnow":["Glucose+, lactose−: no transcription.","Glucose+, lactose+: low transcription.","Glucose−, lactose−: no transcription.","Glucose−, lactose+: strong transcription."],"terms":[],"diagramGuide":["Treat each row as a truth table: '+' under glucose predicts CAP off, while '+' under lactose predicts repressor off.","The only strong-transcription row is glucose − / lactose + / CAP + / repressor −."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which input row corresponds to CAP bound, repressor unbound, and strong transcription?","options":["Glucose +, lactose −","Glucose +, lactose +","Glucose −, lactose −","Glucose −, lactose +"],"answer":3,"explanation":"Low glucose activates CAP; lactose removes the repressor."},{"q":"Which condition gives low-level rather than strong lac-operon transcription?","options":["Glucose present, lactose present","Glucose absent, lactose present","Glucose absent, lactose absent","Glucose present, lactose absent"],"answer":0,"explanation":"With both sugars present, the repressor is removed but CAP is inactive, so only basal transcription occurs."}]}},{"page":72,"lecture":"Gene Expression and Regulation","slideInLecture":32,"title":"Organization of the trp operon","explain":"The trp operon contains the structural genes trpE, trpD, trpC, trpB, and trpA. They are transcribed together and translated into enzymes needed for tryptophan biosynthesis. A promoter and operator control the group.","mustKnow":["The trp genes encode enzymes for tryptophan synthesis.","The genes share one transcript.","The promoter binds RNA polymerase; the operator binds the repressor."],"terms":[{"term":"trp operon","meaning":"Operon encoding enzymes that synthesize tryptophan."},{"term":"Structural genes","meaning":"Genes encoding the pathway enzymes controlled by the operon."}],"diagramGuide":["The upper line is the trp DNA unit; the lower arrows show one transcript translated into enzymes for tryptophan biosynthesis.","The regulatory gene is separate from the clustered structural genes."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What is the direct output of transcribing and translating the trp structural genes shown?","options":["Lactose permeases","Enzymes for tryptophan biosynthesis","Tryptophan repressor only","cAMP-producing enzymes"],"answer":1,"explanation":"The clustered trp genes encode enzymes that synthesize tryptophan."},{"q":"The structural genes of the trp operon encode proteins primarily required for:","options":["Lactose import","Tryptophan biosynthesis","Glucose phosphorylation","DNA replication"],"answer":1,"explanation":"The trp structural genes encode enzymes in the tryptophan-biosynthetic pathway."}]}},{"page":73,"lecture":"Gene Expression and Regulation","slideInLecture":33,"title":"Tryptophan switches the trp operon off","explain":"The trp operon is on when tryptophan is absent because the repressor cannot block the operator. When tryptophan is present, it binds the repressor as a co-repressor. The active complex binds the operator and stops transcription.","mustKnow":["Tryptophan present: operon off.","Tryptophan absent: operon on.","Tryptophan activates the repressor as a co-repressor."],"terms":[{"term":"Co-repressor","meaning":"Small molecule that activates a repressor so it can block transcription."},{"term":"Repressible operon","meaning":"Operon normally on that can be switched off."}],"diagramGuide":["Compare the two rows: tryptophan present forms an active repressor–corepressor complex that binds the operator; tryptophan absent leaves the repressor inactive.","The red X marks blocked transcription; the lower row proceeds to enzyme production."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"When tryptophan is abundant, it switches the trp operon off by acting as a:","options":["CAP activator","Corepressor that activates repressor binding","Competitive RNA-polymerase inhibitor","DNA-cutting nuclease"],"answer":1,"explanation":"Tryptophan binds the inactive repressor, enabling operator binding."},{"q":"In the presence of abundant tryptophan, the trp repressor becomes able to bind the operator because tryptophan acts as a:","options":["Substrate","Inducer","Co-repressor","Competitive inhibitor"],"answer":2,"explanation":"Tryptophan binds the inactive repressor as a co-repressor, activating operator binding."}]}},{"page":74,"lecture":"Gene Expression and Regulation","slideInLecture":34,"title":"Inducible versus repressible operons","explain":"The lac operon is normally off and is induced when allolactose disables an active repressor. The trp operon is normally on because its repressor is inactive; tryptophan acts as a co-repressor and switches it off. Both systems use negative regulation through a repressor.","mustKnow":["Lac: default off; inducer turns it on.","Trp: default on; co-repressor turns it off.","Both are negatively regulated by repressors.","Constitutive genes do not require this switching."],"terms":[{"term":"Constitutive gene","meaning":"Gene expressed continuously with little or no switching."},{"term":"Regulatory gene","meaning":"Gene whose expression is controlled according to cellular need."}],"diagramGuide":["Read across each row rather than down a column: lac is default OFF and induced ON, whereas trp is default ON and corepressed OFF.","Both are negative regulation because a repressor is the direct DNA-blocking protein."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which paired default states are correct?","options":["lac ON; trp OFF","lac OFF; trp ON","lac ON; trp ON","lac OFF; trp OFF"],"answer":1,"explanation":"The inducible lac operon is usually OFF; the repressible trp operon is usually ON."},{"q":"How do the newly synthesized repressors of the lac and trp operons differ?","options":["Both are initially active","Both are initially inactive","Lac repressor is inactive; trp repressor is active","Lac repressor is active; trp repressor is inactive"],"answer":3,"explanation":"The lac repressor is made active, whereas the trp repressor requires its co-repressor to become active."},{"q":"Which example on the slide is classified as constitutively expressed rather than a regulated luxury gene?","options":["A glycolysis gene","trpE","lacZ","A lactose-permease gene"],"answer":0,"explanation":"The slide cites glycolysis genes as housekeeping genes that are constitutively expressed."}]}},{"page":75,"lecture":"Gene Expression and Regulation","slideInLecture":35,"title":"Gene-regulation references","explain":"This slide lists textbooks and a web source used for the lecture. It introduces no new mechanism or definition.","mustKnow":["No new examinable concept is presented on this references slide."],"terms":[],"diagramGuide":[],"interaction":{"type":"tap","label":"Non-content slide: reference list."}},{"page":76,"lecture":"Genetic Engineering Applications 1","slideInLecture":1,"title":"Genetic engineering overview","explain":"A recombinant DNA construct combines a gene of interest with vector elements that let the DNA replicate, be selected, and sometimes be expressed. The slide highlights a promoter, terminator, selectable marker, and origin of replication.","mustKnow":["A gene of interest is inserted into a DNA vector.","The origin permits replication.","A selectable marker identifies cells carrying the construct.","Promoter and terminator control transcription."],"terms":[{"term":"Recombinant DNA","meaning":"DNA assembled from sequences that originated from different sources."},{"term":"Origin of replication","meaning":"Vector sequence that permits DNA replication in a host."},{"term":"Selectable marker","meaning":"Gene used to select cells carrying the vector."}],"diagramGuide":["The circular recombinant-DNA map labels the minimum functional parts: origin, selectable marker, promoter, inserted gene, and terminator.","Promoter/terminator govern expression; origin governs replication; marker governs selection."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"On the recombinant-DNA map, which feature is required for autonomous copying in the host but does not itself select transformants?","options":["Selectable marker","Origin of replication","Promoter","Terminator"],"answer":1,"explanation":"The ori enables replication; the marker enables selection."}]}},{"page":77,"lecture":"Genetic Engineering Applications 1","slideInLecture":2,"title":"Milestones in GMO development","explain":"The timeline moves from the first genetically modified bacteria in 1973 to GM mice in 1974, commercial insulin-producing bacteria in 1982, GM food sales in 1994, and GM pets such as GloFish in 2003.","mustKnow":["1973: first genetically modified bacteria.","1982: commercial insulin-producing bacteria.","1994: genetically modified food sold.","2003: GM pets sold."],"terms":[{"term":"GMO","meaning":"Organism whose genetic material has been deliberately modified."},{"term":"GloFish","meaning":"Genetically modified fluorescent fish sold as pets."}],"diagramGuide":[],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which chronology is correct according to the slide?","options":["GM mice 1973 → GM bacteria 1974 → insulin bacteria 1994","GM bacteria 1973 → GM mice 1974 → insulin bacteria 1982","GM food 1982 → insulin bacteria 1994 → GloFish 2003","GloFish 1994 → GM food 2003 → GM mice 1974"],"answer":1,"explanation":"The listed milestones are bacteria 1973, mice 1974, insulin-producing bacteria 1982, GM food 1994, GloFish 2003."}]}},{"page":78,"lecture":"Genetic Engineering Applications 1","slideInLecture":3,"title":"Central dogma reminder","explain":"The central dogma states the main direction of genetic information flow: DNA is used to make RNA, and RNA is used to make protein.","mustKnow":["DNA → RNA → protein."],"terms":[{"term":"Central dogma","meaning":"Main flow of sequence information from DNA to RNA to protein."}],"diagramGuide":["The top arrow is information flow DNA→RNA→protein; the lower panels distinguish replication, transcription, and translation.","Do not confuse DNA replication (DNA→DNA) with gene expression."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which process is paired with the correct information flow?","options":["Replication: RNA→DNA","Transcription: protein→RNA","Translation: RNA→protein","Translation: DNA→DNA"],"answer":2,"explanation":"Translation uses RNA information to synthesize protein."}]}},{"page":79,"lecture":"Genetic Engineering Applications 1","slideInLecture":4,"title":"Definition of genetic engineering","explain":"Genetic engineering is deliberate DNA modification using molecular biology. A chosen gene is isolated, modified if needed, placed in a vector, and transferred to a host where it can be copied or expressed to make a product.","mustKnow":["It involves isolation, modification, and transfer of DNA.","A vector carries the gene of interest.","A host maintains or expresses the recombinant DNA.","It underlies recombinant DNA technology."],"terms":[{"term":"Gene of interest","meaning":"Specific DNA sequence selected for cloning or expression."},{"term":"Vector","meaning":"DNA vehicle used to carry foreign DNA into a host."},{"term":"Host cell","meaning":"Cell that receives and maintains recombinant DNA."}],"diagramGuide":["Follow the lower workflow: gene of interest → vector → recombinant DNA → host cell → desired product.","The vector is the carrier; the host is the living system that maintains or expresses it."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which sequence best captures the engineering logic shown?","options":["Host → vector → gene → product","Gene of interest → vector → recombinant DNA → host → product","Vector → product → host → gene","Gene → host → vector → recombinant DNA"],"answer":1,"explanation":"The gene is inserted into a vector, introduced into a host, then replicated and/or expressed."},{"q":"After a gene of interest is introduced into a suitable host, which two outcomes may occur according to the definition of genetic engineering?","options":["Splicing and/or mutation","Replication and/or expression","Translation and/or secretion only","Deletion and/or chromosome loss"],"answer":1,"explanation":"An introduced gene may be replicated, expressed, or both in the host."}]}},{"page":80,"lecture":"Genetic Engineering Applications 1","slideInLecture":5,"title":"Basic genetic-engineering workflow","explain":"The standard workflow is: isolate or amplify the target gene, cut the gene and vector with compatible restriction enzymes, join them with DNA ligase, introduce the recombinant vector into a host, select and verify positive cells, and express the gene to obtain the product.","mustKnow":["Restriction enzymes cut gene and vector.","DNA ligase joins insert and vector.","Transformation introduces DNA into the host.","Selection and screening identify correct clones."],"terms":[{"term":"Ligation","meaning":"Covalent joining of DNA fragments by DNA ligase."},{"term":"Transformation","meaning":"Introduction of foreign DNA into a host cell."},{"term":"Screening","meaning":"Testing selected cells to identify the correct recombinant clone."}],"diagramGuide":["Read the six numbered stages in order; cutting precedes ligation, and transformation precedes selection/screening.","The same restriction enzyme creates compatible ends on insert and vector."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"After compatible vector and insert ends have been generated, what is the next construction step?","options":["Selection","Ligation","Protein purification","Sequencing"],"answer":1,"explanation":"DNA ligase joins the insert and vector before host introduction."},{"q":"Which step immediately precedes introduction of recombinant DNA into a host cell?","options":["Isolation of genomic DNA","Protein purification","Ligation of insert and vector","Screening of colonies"],"answer":2,"explanation":"The insert is ligated into the vector before the recombinant vector is transferred into a host."},{"q":"What is the primary role of a selectable marker during the workflow?","options":["Cut the insert DNA","Determine the insert sequence","Induce protein folding","Identify cells that received the vector"],"answer":3,"explanation":"A selectable marker allows vector-containing cells to survive or otherwise be selected."}]}},{"page":81,"lecture":"Genetic Engineering Applications 1","slideInLecture":6,"title":"Core genetic-engineering terms","explain":"The slide defines the parts and outcomes of cloning. A vector carries foreign DNA into a host; recombinant DNA contains joined sequences from different sources; transformation delivers it; a clone is the genetically identical population produced from one starting cell.","mustKnow":["Vector carries DNA.","Host cell receives recombinant DNA.","Transformation is DNA introduction.","A selectable marker allows carrier cells to survive or be identified."],"terms":[{"term":"Clone","meaning":"Genetically identical population derived from one progenitor cell."},{"term":"Transformation","meaning":"Introduction of foreign or recombinant DNA into a host."},{"term":"Recombinant DNA","meaning":"DNA made by joining sequences from different sources."},{"term":"Selectable marker","meaning":"Gene that enables selection of cells containing a vector."}],"diagramGuide":["Each icon is a separate term: free DNA segment = gene of interest, circle = vector, circle plus insert = recombinant DNA, cell = host.","A clone is the descendant population after one transformed progenitor grows."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A bacterial population derived from one transformed progenitor is a:","options":["Vector","Clone","Marker","Restriction site"],"answer":1,"explanation":"A clone is a genetically identical descendant population."},{"q":"Which term denotes DNA formed by joining sequences originating from different sources?","options":["Recombinant DNA","Clone","Vector","Competent cell"],"answer":0,"explanation":"Recombinant DNA contains DNA sequences joined from different sources."}]}},{"page":82,"lecture":"Genetic Engineering Applications 1","slideInLecture":7,"title":"Restriction enzymes","explain":"Restriction endonucleases are bacterial defense enzymes that cut DNA at specific short recognition sequences, usually 4–8 base pairs. Many sites are palindromic. Cutting the insert and vector with the same enzyme can create matching ends for cloning.","mustKnow":["Restriction enzymes recognize specific DNA sequences.","Many recognition sites are palindromic.","The same enzyme can generate compatible vector and insert ends.","They naturally help bacteria defend against foreign DNA."],"terms":[{"term":"Restriction endonuclease","meaning":"Enzyme that cuts DNA at or near a specific recognition sequence."},{"term":"Palindromic sequence","meaning":"DNA site read the same 5′ to 3′ on both complementary strands."},{"term":"Recognition site","meaning":"Specific DNA sequence recognized by a restriction enzyme."}],"diagramGuide":["The recognition-site inset is antiparallel: the sequence reads identically 5′→3′ on the two strands.","The scissors mark a sequence-specific cut; the resulting compatible ends permit cloning."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which feature is typical of the restriction-enzyme recognition sites described?","options":["Usually 40–80 bp and non-specific","Usually 4–8 bp and often palindromic","Always RNA and asymmetric","Located only in eukaryotic promoters"],"answer":1,"explanation":"Restriction enzymes commonly recognize short palindromic DNA sequences."},{"q":"Restriction endonucleases occur naturally in bacteria mainly as protection against:","options":["Misfolded bacterial proteins","Foreign bacteriophage DNA","Excess cellular RNA","Damaged phospholipids"],"answer":1,"explanation":"Bacterial restriction enzymes are part of a defense system against invading foreign DNA such as bacteriophage DNA."},{"q":"A typical restriction-enzyme recognition sequence is approximately:","options":["1–2 base pairs","20–30 base pairs","4–8 base pairs","Hundreds of base pairs"],"answer":2,"explanation":"The slide states that restriction enzymes usually recognize short sequences 4–8 base pairs long."}]}},{"page":83,"lecture":"Genetic Engineering Applications 1","slideInLecture":8,"title":"Sticky and blunt DNA ends","explain":"Different restriction enzymes create different cut ends. Sticky ends contain single-stranded overhangs that can base-pair with complementary ends. Blunt ends have no overhang. The enzyme choice depends on the available recognition sites and required compatibility.","mustKnow":["Sticky ends have overhangs.","Blunt ends have no overhangs.","Compatible ends make ligation easier.","Restriction-site location affects enzyme choice."],"terms":[{"term":"Sticky end","meaning":"DNA end with a single-stranded overhang."},{"term":"Blunt end","meaning":"DNA end with no single-stranded overhang."},{"term":"Compatible ends","meaning":"DNA ends able to align for joining."}],"diagramGuide":["Sticky-end drawings have single-stranded overhangs that base-pair before ligation; blunt-end drawings terminate flush.","The bottom equation shows vector and insert cut with compatible ends and then sealed into a recombinant plasmid."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why can two DNA fragments cut with the same sticky-end-producing enzyme align before ligase acts?","options":["Their phosphates repel each other","Their complementary overhangs base-pair","Ligase first synthesizes missing genes","Their blunt ends contain primers"],"answer":1,"explanation":"Complementary single-stranded overhangs anneal."},{"q":"Which enzyme shown produces blunt ends rather than staggered cohesive ends?","options":["EcoRI","HindIII","BamHI","SmaI"],"answer":3,"explanation":"SmaI cuts straight across both DNA strands, producing blunt ends."}]}},{"page":84,"lecture":"Genetic Engineering Applications 1","slideInLecture":9,"title":"DNA ligase joins DNA fragments","explain":"DNA ligase seals breaks in the sugar-phosphate backbone. It forms a phosphodiester bond between a 3′-OH and a 5′-phosphate. Sticky-end ligation is usually more efficient because complementary overhangs align the fragments before sealing.","mustKnow":["Ligase forms phosphodiester bonds.","It joins a 3′-OH to a 5′-phosphate.","It joins insert and vector after restriction digestion.","Sticky ends usually ligate more efficiently than blunt ends."],"terms":[{"term":"Phosphodiester bond","meaning":"Covalent bond linking neighboring nucleotides in the DNA backbone."},{"term":"Nick","meaning":"Single-strand break in an otherwise continuous DNA duplex."}],"diagramGuide":["In the nick-sealing inset, ligase connects an adjacent 3′-OH and 5′-phosphate to restore the sugar-phosphate backbone.","The sticky-end panel shows base pairing aligns fragments before covalent sealing."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"DNA ligase seals a nick by forming a phosphodiester bond between:","options":["Two 5′ phosphates","A 3′-OH and an adjacent 5′-phosphate","Two nitrogenous bases","A primer and RNA polymerase"],"answer":1,"explanation":"Those are the reactive backbone groups at a DNA nick."},{"q":"DNA ligase forms a covalent bond between which adjacent groups?","options":["3′-OH and 5′-phosphate","5′-OH and 3′-phosphate","Two nitrogenous bases","Two 3′-phosphate groups"],"answer":0,"explanation":"Ligase seals the backbone by joining a 3′ hydroxyl to an adjacent 5′ phosphate."},{"q":"Compared with blunt-end ligation, sticky-end ligation is generally more efficient because:","options":["Sticky ends do not require ligase","Overhangs base-pair and align the fragments","Blunt ends repel DNA polymerase","Sticky ends contain ATP"],"answer":1,"explanation":"Complementary overhangs transiently base-pair, holding the fragments in the correct alignment for ligase."}]}},{"page":85,"lecture":"Genetic Engineering Applications 1","slideInLecture":10,"title":"T4 DNA ligase mechanism","explain":"T4 DNA ligase uses ATP. First it forms a ligase–AMP intermediate, then transfers AMP to the DNA 5′-phosphate. The neighboring 3′-OH attacks this activated phosphate, forming the phosphodiester bond and sealing the DNA.","mustKnow":["T4 DNA ligase is ATP-dependent.","A ligase–AMP intermediate forms.","AMP activates the DNA 5′-phosphate.","The 3′-OH attack completes backbone joining."],"terms":[{"term":"Ligase–AMP","meaning":"Activated covalent intermediate formed between ligase and AMP."},{"term":"PPi","meaning":"Pyrophosphate released when ligase reacts with ATP."}],"diagramGuide":["Read the numbered mechanism: ligase binds → ATP forms ligase–AMP → AMP activates the DNA 5′-phosphate → 3′-OH attack forms the bond.","AMP is an enzyme/DNA intermediate, not part of the final phosphodiester bond."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which ordering matches the T4 ligase mechanism shown?","options":["DNA–AMP → ligase–AMP → ATP binding → bond formation","Ligase–AMP → DNA–AMP → 3′-OH attack → phosphodiester bond","3′-OH attack → ATP synthesis → DNA–AMP → ligase binding","PPi binding → blunt-end melting → AMP removal"],"answer":1,"explanation":"ATP first adenylates ligase, AMP is transferred to DNA, then 3′-OH attack seals the backbone."},{"q":"During T4 DNA-ligase catalysis, AMP is transferred directly to the:","options":["3′-OH at the DNA end","Nitrogenous base at the nick","5′-phosphate at the DNA end","2′-OH of deoxyribose"],"answer":2,"explanation":"AMP activates the 5′ phosphate, forming a DNA–AMP intermediate before phosphodiester-bond formation."}]}},{"page":86,"lecture":"Genetic Engineering Applications 1","slideInLecture":11,"title":"Requirements for efficient ligation","explain":"Successful ligation requires DNA ends that can be physically joined and ATP for T4 DNA ligase. Sticky ends are usually more efficient because complementary base pairing holds the fragments in alignment, increasing their effective local concentration.","mustKnow":["T4 ligase requires ATP.","DNA ends must be compatible or blunt.","Ligation creates a stable recombinant molecule.","Sticky ends are generally more efficient."],"terms":[{"term":"Cohesive end","meaning":"Another name for a sticky end with a complementary overhang."},{"term":"Effective concentration","meaning":"Local availability of aligned DNA ends for the ligase reaction."}],"diagramGuide":["The plasmid cartoon shows insert and vector first held together by complementary sticky ends, then covalently closed by ligase.","The final continuous circle represents a stable recombinant molecule."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What mainly gives sticky-end ligation an efficiency advantage over blunt-end ligation?","options":["Sticky ends eliminate the need for ligase","Complementary pairing holds partners together","Sticky ends carry selectable markers","Blunt ends cannot form phosphodiester bonds"],"answer":1,"explanation":"Annealing raises the effective local concentration of correctly aligned ends."},{"q":"Which energy source is specifically required by T4 DNA ligase?","options":["GTP","NADPH","CTP","ATP"],"answer":3,"explanation":"T4 DNA ligase uses ATP to generate the ligase–AMP intermediate."}]}},{"page":87,"lecture":"Genetic Engineering Applications 1","slideInLecture":12,"title":"PCR principle and components","explain":"Polymerase chain reaction is an in vitro method that selectively amplifies a chosen DNA region. Repeated temperature changes in a thermal cycler allow a small starting amount to produce millions of copies. The reaction requires template DNA, primers, nucleotides, polymerase, and suitable buffer.","mustKnow":["PCR amplifies a specific DNA sequence.","It is performed in vitro.","A thermal cycler repeatedly changes temperature.","Primers define the target region."],"terms":[{"term":"PCR","meaning":"Polymerase chain reaction, a method for amplifying selected DNA."},{"term":"Primer","meaning":"Short DNA strand that defines an amplification boundary and provides a starting 3′ end."},{"term":"Thermal cycler","meaning":"Instrument that runs PCR temperature cycles."}],"diagramGuide":["Identify every required PCR component in the bottom row: template, two primers, thermostable polymerase, dNTPs, Mg²⁺ buffer, and thermal cycler.","Forward and reverse primers flank opposite ends of the target region."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which PCR component pair defines the boundaries of the amplified target?","options":["Mg²⁺ and dNTPs","Forward and reverse primers","Template and thermal cycler","Buffer and polymerase"],"answer":1,"explanation":"The two primers anneal on opposite strands flanking the target."},{"q":"Which PCR component synthesizes new DNA while tolerating repeated heating?","options":["Thermostable DNA polymerase","RNA polymerase","DNA ligase","Reverse transcriptase"],"answer":0,"explanation":"A heat-stable polymerase such as Taq synthesizes DNA through repeated thermal cycles."}]}},{"page":88,"lecture":"Genetic Engineering Applications 1","slideInLecture":13,"title":"Uses of PCR","explain":"PCR supplies many copies of a selected sequence. Those copies can be used for cloning, pathogen detection, mutation analysis, sequencing, and other downstream tests.","mustKnow":["PCR supports gene amplification and cloning.","PCR can detect pathogen nucleic acid.","PCR can help detect mutations.","PCR can prepare DNA for sequencing."],"terms":[{"term":"SNP","meaning":"Single-nucleotide polymorphism, a one-base genetic variation."},{"term":"Template preparation","meaning":"Producing enough DNA for a later method such as sequencing."}],"diagramGuide":["The primer arrows face inward and define the DNA segment copied; the lower product stack represents amplification of that bounded region.","PCR enriches a selected interval rather than copying the entire genome equally."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which use of PCR depends most directly on producing enough copies for a downstream readout?","options":["Protein folding","Sequencing-template preparation","Cell lysis","Affinity chromatography"],"answer":1,"explanation":"PCR can generate sufficient target DNA for sequencing."},{"q":"Using PCR to detect a pathogen depends on amplification of:","options":["All host genomic DNA equally","A pathogen-specific nucleic-acid target","Only bacterial proteins","Only membrane lipids"],"answer":1,"explanation":"Diagnostic PCR detects a pathogen by amplifying a nucleic-acid sequence specific to it."}]}},{"page":89,"lecture":"Genetic Engineering Applications 1","slideInLecture":14,"title":"PCR cycle and exponential amplification","explain":"Each PCR cycle has three ordered steps: denaturation separates DNA strands, annealing lets primers bind, and extension allows polymerase to synthesize new DNA. Under ideal conditions, the target approximately doubles each cycle, giving about 2ⁿ copies after n cycles.","mustKnow":["Order: denaturation, annealing, extension.","Denaturation separates strands.","Annealing binds primers.","Ideal amplification is approximately 2ⁿ."],"terms":[{"term":"Denaturation","meaning":"Heat separation of the two DNA strands."},{"term":"Annealing","meaning":"Binding of primers to complementary target sequences."},{"term":"Extension","meaning":"DNA synthesis from the primers by polymerase."}],"diagramGuide":["Read each cycle left to right: strand separation at 94–95°C, primer binding at 50–65°C, extension at 72°C.","The staircase graph represents ideal doubling, approximately 2ⁿ products after n cycles."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which temperature-stage match is correct?","options":["94–95°C—annealing","50–65°C—extension","72°C—extension","72°C—denaturation"],"answer":2,"explanation":"Typical PCR uses high heat for denaturation, lower temperature for annealing, and 72°C for polymerase extension."},{"q":"Under ideal conditions, how many target copies are expected after 10 PCR cycles from one starting copy?","options":["20","100","1,024","512"],"answer":2,"explanation":"Ideal PCR amplification follows 2^n; 2^10 equals 1,024."}]}},{"page":90,"lecture":"Genetic Engineering Applications 1","slideInLecture":15,"title":"Agarose gel electrophoresis","explain":"DNA has a negatively charged phosphate backbone, so it moves toward the positive electrode in an electric field. The agarose gel acts as a sieve: smaller fragments pass through more easily and therefore travel faster and farther than larger fragments.","mustKnow":["DNA moves toward the positive anode.","Agarose separates DNA mainly by size.","Smaller fragments travel farther.","Migration distance is inversely related to fragment size."],"terms":[{"term":"Agarose gel","meaning":"Porous matrix used to separate DNA fragments."},{"term":"Anode","meaning":"Positive electrode toward which DNA migrates."},{"term":"Molecular sieve","meaning":"Matrix that slows large molecules more than small ones."}],"diagramGuide":["DNA starts at wells near the negative side and migrates toward the positive anode because of its phosphate backbone.","Use distance from the wells to infer size: lower/farther bands are smaller."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Two DNA bands start at the same well. Band X migrates farther toward the anode than band Y. What follows?","options":["X is larger","X is smaller","X is less negatively charged because of sequence","Y contains no phosphate"],"answer":1,"explanation":"In agarose, smaller DNA fragments move faster and farther."},{"q":"Why does DNA migrate toward the anode during agarose-gel electrophoresis?","options":["Its bases are positively charged","DNA binds positively charged SDS","Agarose carries DNA by osmosis","Its phosphate backbone is negatively charged"],"answer":3,"explanation":"The negatively charged phosphate backbone drives DNA toward the positive electrode."},{"q":"A DNA band remaining closest to the loading well most likely contains fragments that are:","options":["Larger than bands that migrated farther","Smaller than all other fragments","More negatively charged per nucleotide","Single-stranded rather than double-stranded"],"answer":0,"explanation":"The agarose matrix slows large fragments more strongly, so they remain nearer the wells."}]}},{"page":91,"lecture":"Genetic Engineering Applications 1","slideInLecture":16,"title":"Sanger DNA sequencing","explain":"Sanger sequencing mixes normal dNTPs with a small amount of ddNTPs. A ddNTP lacks the 3′-OH needed to add the next nucleotide, so its incorporation stops DNA synthesis. The resulting fragments of different lengths reveal the DNA sequence.","mustKnow":["dNTPs support DNA extension.","ddNTPs terminate DNA synthesis.","ddNTPs lack a 3′-OH.","Fragments ending at each base are used to determine sequence."],"terms":[{"term":"dNTP","meaning":"Normal deoxynucleotide used to extend DNA."},{"term":"ddNTP","meaning":"Chain-terminating nucleotide lacking a 3′-OH."},{"term":"Chain termination","meaning":"Stopping DNA synthesis after incorporation of a ddNTP."}],"diagramGuide":["Compare nucleotide structures: dNTP has a 3′-OH; ddNTP has 3′-H, so no next phosphodiester bond can form.","The chromatogram color peaks are read in order to recover the newly synthesized sequence."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A Sanger reaction fragment terminates immediately after incorporation of a ddNTP because the ddNTP lacks:","options":["A 5′ phosphate","A nitrogenous base","A 3′-OH","A sugar"],"answer":2,"explanation":"Without a 3′-OH, the next nucleotide cannot be joined."},{"q":"What is produced by occasional ddNTP incorporation during Sanger sequencing?","options":["Fragments of identical length","Fragments of different lengths ending at specific bases","Only full-length double-stranded DNA","RNA fragments lacking a 5′ cap"],"answer":1,"explanation":"Random chain termination generates a nested set of DNA fragments ending at each possible nucleotide position."}]}},{"page":92,"lecture":"Genetic Engineering Applications 1","slideInLecture":17,"title":"CRISPR-Cas9 overview","explain":"CRISPR-Cas9 is a genome-editing system adapted from bacterial antiviral defense. A guide RNA directs the Cas9 nuclease to a matching DNA sequence, where Cas9 creates a double-strand break. Cellular repair of the break can knock out, insert, or correct genes.","mustKnow":["Guide RNA provides target specificity.","Cas9 is the DNA-cutting nuclease.","Cas9 creates a double-strand break.","Repair can create a knockout or a precise change."],"terms":[{"term":"Guide RNA","meaning":"RNA that base-pairs with the chosen DNA target and directs Cas9."},{"term":"Cas9","meaning":"RNA-guided nuclease that cuts target DNA."},{"term":"Double-strand break","meaning":"Cut through both strands of a DNA duplex."},{"term":"Gene knockout","meaning":"Disruption that removes or strongly reduces gene function."}],"diagramGuide":["The two-part diagram assigns specificity to guide RNA and cutting activity to Cas9.","Editing begins only after the guide–Cas9 complex reaches complementary target DNA."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which division of labor in CRISPR-Cas9 is correct?","options":["Cas9 supplies sequence specificity; gRNA repairs DNA","gRNA supplies sequence specificity; Cas9 cuts DNA","gRNA cuts DNA; Cas9 supplies donor template","Cas9 makes cAMP; gRNA binds CAP"],"answer":1,"explanation":"Guide RNA targets the sequence; Cas9 is the nuclease."},{"q":"CRISPR-Cas9 originated from a natural bacterial system that functions in defense against:","options":["Fungi","Protozoa","Viruses","Antibiotics"],"answer":2,"explanation":"CRISPR-Cas systems evolved as bacterial adaptive defense mechanisms against invading viral genetic material."}]}},{"page":93,"lecture":"Genetic Engineering Applications 1","slideInLecture":18,"title":"CRISPR targeting, cutting, and repair","explain":"The guide RNA pairs with a roughly 20-nucleotide target next to a PAM sequence, allowing Cas9 to bind and cut both DNA strands. The cell then repairs the break. Error-prone NHEJ often creates small insertions or deletions and gene knockout, while HDR uses donor DNA for precise insertion or correction.","mustKnow":["Cas9 targeting requires guide matching plus a PAM.","Cas9 makes a double-strand break.","NHEJ often creates indels and knockout.","HDR uses donor DNA for precise editing."],"terms":[{"term":"PAM","meaning":"Short DNA motif next to the target that Cas9 requires for cutting."},{"term":"NHEJ","meaning":"Error-prone end joining that often creates small insertions or deletions."},{"term":"HDR","meaning":"Template-guided repair used for precise sequence insertion or correction."},{"term":"Indel","meaning":"Small insertion or deletion in DNA."}],"diagramGuide":["Follow the numbered panels: guide targeting near PAM → Cas9 double-strand break → cellular repair.","NHEJ often creates indels and knockout; HDR uses a donor template for precise insertion or correction."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"After a Cas9 double-strand break, which outcome most strongly indicates NHEJ rather than HDR?","options":["Precise donor-directed correction","A small insertion or deletion causing knockout","Insertion copied from a supplied template","No DNA-end joining"],"answer":1,"explanation":"Error-prone NHEJ commonly creates indels; HDR uses a homologous donor."},{"q":"Which repair pathway commonly creates small insertions or deletions after Cas9 cutting?","options":["Homology-directed repair","Base-excision repair","Mismatch repair","Non-homologous end joining"],"answer":3,"explanation":"Error-prone non-homologous end joining frequently creates indels that can disrupt a gene."},{"q":"Precise insertion or correction at a Cas9 break requires which combination?","options":["HDR with a donor DNA template","NHEJ without a template","Translation with a guide protein","Ligase with no homologous sequence"],"answer":0,"explanation":"Homology-directed repair can copy a designed change from a supplied donor template."}]}},{"page":94,"lecture":"Genetic Engineering Applications 1","slideInLecture":19,"title":"Vectors in genetic engineering","explain":"A vector is a DNA vehicle that carries foreign DNA into a host for replication and sometimes expression. A useful vector needs an origin of replication, a selectable marker, an insertion site such as an MCS, and the ability to enter a suitable host. Vector choice depends partly on insert size and purpose.","mustKnow":["Vectors deliver and maintain foreign DNA.","ori permits replication.","A selectable marker supports selection.","An MCS provides insertion sites."],"terms":[{"term":"MCS","meaning":"Multiple cloning site containing several useful restriction sites."},{"term":"ori","meaning":"Origin of replication."},{"term":"Vector","meaning":"DNA molecule used to carry foreign DNA into a host."}],"diagramGuide":["The vector icons increase in carrying capacity from plasmid/phage-type vectors toward BAC and YAC.","On the feature list, ori supports replication, marker supports selection, and MCS supports insertion."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A useful cloning vector must contain all of the following core features except:","options":["Origin of replication","Selectable marker","Insertion site/MCS","A pre-existing copy of every target gene"],"answer":3,"explanation":"The target gene is inserted; it is not a universal built-in vector feature."},{"q":"Which vector feature provides a defined region containing sites for insertion of foreign DNA?","options":["Origin of replication","Multiple cloning site","Selectable marker","Centromere"],"answer":1,"explanation":"The MCS or cloning site contains restriction sites used to insert the gene of interest."},{"q":"Which factor most directly determines whether a plasmid, BAC, or YAC is suitable for a project?","options":["Number of introns in the host","Color of the host colony","Insert size and intended application","Charge of the encoded protein"],"answer":2,"explanation":"Vector choice depends chiefly on the size of DNA to be carried and whether cloning or expression is required."}]}},{"page":95,"lecture":"Genetic Engineering Applications 2
