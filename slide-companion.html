ransferase conjugation"],"answer":2,"explanation":"The lower pathway labels beta-lyase and ends in a reactive thiol."},{"q":"Which enzymes sequentially shorten a glutathione conjugate toward a cysteine conjugate?","options":["Kinase and phosphatase","Gamma-glutamyl transpeptidase and cysteinyl glycinase","CYP450 and glucuronyl transferase","Beta-lyase and catalase"],"answer":1,"explanation":"The mercapturic acid pathway removes glutamate and then glycine using these enzymes."},{"q":"N-acetylation of a cysteine conjugate favors formation of a product excreted through:","options":["Exhaled air","Urine","Sweat only","Saliva only"],"answer":1,"explanation":"Mercapturic-acid derivatives are excreted in urine."}]}},{"page":359,"lecture":"Drug Development 1","slideInLecture":7,"title":"Main Drug-Development Stages","explain":"Drug development moves from discovery to preclinical testing, clinical development in humans, and regulatory review. Each stage asks a different question: whether a lead exists, whether it appears sufficiently safe and active before human use, whether it works in people, and whether authorities approve it.","mustKnow":["Drug discovery includes target identification, validation, lead finding, and lead optimization.","Preclinical development includes short-term testing, formulation, and pharmacokinetics.","Clinical development proceeds through Phase I, II, and III studies.","Regulatory approval follows review of efficacy and safety data."],"terms":[{"term":"Preclinical","meaning":"Testing performed before human clinical trials."},{"term":"Clinical trial","meaning":"A controlled study of a drug in human participants."},{"term":"Regulatory approval","meaning":"Authorization by a regulatory authority to market a drug."}],"diagramGuide":["Read the pipeline left to right: discovery, preclinical development, clinical development, regulatory approval.","Clinical Step 1 emphasizes small safety/tolerance studies; Step 2 efficacy plus longer toxicity; Step 3 large trials.","Regulatory review follows the clinical stages."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"At which stage are selected side effects first studied in healthy volunteers?","options":["Regulatory approval","Clinical development Step 1","Lead finding","Preclinical formulation"],"answer":1,"explanation":"Step 1 lists selected side effects in healthy volunteers."},{"q":"Which drug-development stage occurs immediately before testing in humans?","options":["Preclinical development","Regulatory review","Phase IV surveillance","Discovery"],"answer":0,"explanation":"Preclinical testing evaluates a candidate before clinical development begins."},{"q":"Target identification, target validation, lead finding, and lead optimization belong to:","options":["Regulatory review","Post-marketing surveillance","Drug discovery","Phase III trials"],"answer":2,"explanation":"These are the major activities in the discovery stage."}]}},{"page":360,"lecture":"Drug Development 1","slideInLecture":8,"title":"From 10,000 Candidates to One Drug","explain":"Drug discovery is a severe filtering process. Thousands of candidates are progressively tested against many requirements, including target activity, safety, stability, solubility, reversibility, oral usefulness, patentability, and manufacturability, until very few remain.","mustKnow":["About 10,000 candidates may be narrowed to one drug molecule.","Potency alone is not enough for a candidate to succeed.","Safety, pharmacokinetic, formulation, and manufacturing properties also matter."],"terms":[{"term":"Candidate","meaning":"A molecule being evaluated as a possible drug."},{"term":"Lead optimization","meaning":"Modification of a promising compound to improve its overall drug properties."},{"term":"Manufacturability","meaning":"The practicality of producing a molecule reliably at useful scale."}],"diagramGuide":["The staircase is a multi-parameter filter from 10,000 candidates to one molecule.","The labels span potency/selectivity through solubility, permeability, metabolic stability, safety, patentability, and manufacturability.","A candidate can fail despite strong target activity if it fails a later property."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which criterion appears latest on the staircase, closest to the surviving drug?","options":["Manufacturability","Target engagement","Potency","Selectivity"],"answer":0,"explanation":"Manufacturability is printed at the top of the final steps."},{"q":"The development staircase begins with approximately how many drug candidates?","options":["10,000","10","100","1,000"],"answer":0,"explanation":"The slide illustrates attrition from about 10,000 candidates to one drug molecule."}]}},{"page":361,"lecture":"Drug Development 1","slideInLecture":9,"title":"Attrition and Scale-Up","explain":"The development funnel shown reduces roughly 10,000 discovery compounds to about 250 entering preclinical work, about five entering clinical development, and one final compound. The manufacturing images emphasize that the surviving molecule must also be produced safely and at large scale.","mustKnow":["Drug development has very high attrition.","The funnel shown narrows 10,000 compounds to 250, then five, then one.","Large-scale manufacturing is part of turning a compound into a usable product."],"terms":[{"term":"Attrition","meaning":"Loss of candidates as they fail successive development stages."},{"term":"Scale-up","meaning":"Expansion of production from small laboratory quantities to manufacturing quantities."}],"diagramGuide":["The funnel quantifies attrition: about 10,000 discovery compounds -> 250 preclinical -> 5 clinical -> 1 approved.","Clinical phases I-IV are listed beside the narrow portion.","The plant photographs emphasize process development and scale-up after molecular selection."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Approximately what fraction of the original 10,000 compounds reaches clinical development in the illustrated funnel?","options":["250 of 10,000","1 of 250","5 of 250","5 of 10,000"],"answer":3,"explanation":"The funnel labels five compounds at clinical development from an initial 10,000."},{"q":"The narrowing drug-development funnel primarily illustrates:","options":["Increasing compound diversity","Progressive candidate attrition","Decreasing manufacturing scale","Increasing mutation rate"],"answer":1,"explanation":"Most candidates fail as requirements become more stringent through development."}]}},{"page":362,"lecture":"Drug Development 2","slideInLecture":1,"title":"Lecture 35: Drug Discovery","explain":"This lecture section introduces biological drug targets, computational screening, high-throughput screening, the RAAS pathway, and the development of ACE inhibitors.","mustKnow":["The section connects target biology with methods for discovering and optimizing drugs."],"terms":[{"term":"Drug discovery","meaning":"The early process of finding and improving molecules that act on a biological target."}],"diagramGuide":["This divider begins Lecture 35 on Drug Development."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which topic begins immediately after this divider?","options":["FRET microscopy","Apoptotic caspases","Biomolecules as drug targets","Cancer incidence"],"answer":2,"explanation":"The next slide introduces biomolecule classes relevant to drug development."}]}},{"page":363,"lecture":"Drug Development 2","slideInLecture":2,"title":"Biomolecules as Drug Targets","explain":"Drug discovery can focus on different classes of biomolecules. Proteins include receptors, enzymes, carrier proteins, and structural proteins; nucleic acids include DNA and RNA; lipids form cell membranes; and carbohydrates appear on cell surfaces and in recognition molecules.","mustKnow":["Important protein targets include receptors and enzymes.","DNA and RNA are nucleic-acid targets.","Lipids and carbohydrates can also participate in drug-relevant biology."],"terms":[{"term":"Receptor","meaning":"A biomolecule that recognizes a signal or ligand and produces a response."},{"term":"Carrier protein","meaning":"A protein that transports another molecule."},{"term":"Nucleic acid","meaning":"DNA or RNA, molecules that store or use genetic information."},{"term":"Cell-surface carbohydrate","meaning":"A carbohydrate exposed on a cell that can aid recognition."}],"diagramGuide":["Four target classes are arranged vertically: proteins, nucleic acids, lipids, and carbohydrates.","Examples beside proteins include receptors, enzymes, carriers, and tubulin; carbohydrates include antigens and recognition molecules."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which listed target is classified as a structural protein?","options":["Cell-surface antigen","Tubulin","DNA","Phospholipid"],"answer":1,"explanation":"Tubulin appears under structural proteins."},{"q":"Which class of biomolecule is built directly from amino-acid monomers?","options":["Nucleic acids","Polysaccharides","Steroids","Proteins"],"answer":3,"explanation":"Proteins are polymers of amino acids."}]}},{"page":364,"lecture":"Drug Development 2","slideInLecture":3,"title":"Computational Drug Discovery","explain":"In-silico virtual screening uses computation to rank molecules before laboratory testing. Structure-based methods use a target's three-dimensional structure for docking, scoring, and ranking, while ligand-based methods use known ligands through similarity, pharmacophore, or QSAR models. Predicted hits still require a biological assay.","mustKnow":["Structure-based screening uses the target structure.","Ligand-based screening uses information from known ligands.","Docking and scoring rank predicted binders.","Computational hits must be tested experimentally."],"terms":[{"term":"Virtual screening","meaning":"Computational evaluation of many compounds as potential hits."},{"term":"Docking","meaning":"Prediction of how a molecule may fit into a target binding site."},{"term":"Pharmacophore","meaning":"A pattern of features associated with biological activity."},{"term":"QSAR","meaning":"A model relating chemical structure to measured biological activity."}],"diagramGuide":["Top split: structure-based screening starts from a protein structure; ligand-based screening starts from known small molecules.","Both streams pass through filters for drug-likeness/toxicity and ADME.","A final hit list still proceeds to a biological assay."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which method belongs to ligand-based virtual screening?","options":["Pharmacophore mapping","Protein-ligand docking","Structure-based scoring","Active-site geometry ranking"],"answer":0,"explanation":"Pharmacophore mapping is listed in the ligand-based branch."},{"q":"Structure-based virtual screening requires information about the:","options":["Compound's brand name","Clinical trial phase","Three-dimensional target structure","Patient's blood group"],"answer":2,"explanation":"Structure-based screening evaluates compounds against a target structure."},{"q":"Ligand-based screening is most directly guided by:","options":["Drug packaging","Known active molecules","An adiabatic calorimeter","Tumor histology alone"],"answer":1,"explanation":"Ligand-based methods use features or similarities derived from known active ligands."}]}},{"page":365,"lecture":"Drug Development 2","slideInLecture":4,"title":"High-Throughput Screening","explain":"High-throughput screening, or HTS, uses automated assays to test very large compound libraries rapidly. Primary hits are checked again in secondary assays, confirmed hits are evaluated for dose-response behavior, and promising compounds become leads for optimization.","mustKnow":["HTS searches compound libraries for initial hits.","Automation allows many samples to be tested rapidly.","Primary hits require confirmation and dose-response testing.","Confirmed hits can become leads for medicinal chemistry."],"terms":[{"term":"HTS","meaning":"Automated testing of large numbers of compounds in an assay."},{"term":"Hit","meaning":"A compound that produces the desired result in a screening assay."},{"term":"Lead","meaning":"A promising hit selected for further optimization."},{"term":"Dose-response","meaning":"The relationship between compound concentration and measured effect."}],"diagramGuide":["The funnel starts with a biological assay and a large chemical library.","Primary hits undergo secondary/counter screens, confirmation, then SAR and medicinal chemistry before becoming leads.","Automation images explain how many compounds can be tested quickly."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What is the main purpose of a counter screen after the primary HTS?","options":["Increase the library size","Replace the biological assay with docking","Begin Phase III clinical trials","Eliminate nonspecific or artifactual hits"],"answer":3,"explanation":"Secondary and counter screens test whether primary activity is genuine and specific."},{"q":"In high-throughput screening, the primary screen is used to identify:","options":["Possible hits","Approved drugs","Clinical endpoints","Patent dates"],"answer":0,"explanation":"The primary screen finds compounds with apparent activity for later confirmation."},{"q":"Which technology most directly enables high-throughput testing of large compound libraries?","options":["Manual microscopy only","Surgical imaging","DNA sequencing alone","Automated liquid handling and plate readers"],"answer":3,"explanation":"Robotic liquid handling and automated detection provide the required throughput."}]}},{"page":366,"lecture":"Drug Development 2","slideInLecture":5,"title":"Renin-Angiotensin-Aldosterone System","explain":"Low blood pressure or low sodium activates renin release from the kidney. Renin helps generate angiotensin I, and ACE converts it to angiotensin II. Angiotensin II raises blood pressure through vasoconstriction and by promoting aldosterone-dependent sodium and water retention.","mustKnow":["Low blood pressure stimulates renin release.","ACE converts angiotensin I to angiotensin II.","Angiotensin II causes vasoconstriction.","Aldosterone increases sodium and water retention, increasing blood pressure."],"terms":[{"term":"Renin","meaning":"A kidney-released enzyme that initiates the RAAS cascade."},{"term":"ACE","meaning":"Angiotensin-converting enzyme, which generates angiotensin II from angiotensin I."},{"term":"Angiotensin II","meaning":"A RAAS peptide that promotes vasoconstriction and aldosterone release."},{"term":"Aldosterone","meaning":"A hormone that increases renal sodium and water retention."}],"diagramGuide":["Start at low blood volume/pressure: kidney JG cells release renin.","Liver angiotensinogen is processed to angiotensin I; lung ACE produces angiotensin II.","Angiotensin II causes vasoconstriction and aldosterone release; aldosterone increases sodium and water retention, restoring pressure."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which intervention would most directly reduce formation of angiotensin II from angiotensin I?","options":["Renin stimulation","Increased sodium reabsorption","ACE inhibition","Aldosterone agonism"],"answer":2,"explanation":"ACE is the enzyme shown between angiotensin I and angiotensin II."},{"q":"Renin acts upstream of ACE in the RAAS pathway to generate:","options":["Aldosterone","Bradykinin","Angiotensin I","Angiotensin II"],"answer":2,"explanation":"Renin produces angiotensin I, which ACE then converts to angiotensin II."},{"q":"Angiotensin II promotes release of which hormone in the RAAS pathway?","options":["Melatonin","Aldosterone","Insulin","Thyroxine"],"answer":1,"explanation":"Angiotensin II stimulates aldosterone release as part of blood-pressure regulation."}]}},{"page":367,"lecture":"Drug Development 2","slideInLecture":6,"title":"Angiotensin Peptides and ACE","explain":"Angiotensins are related peptide hormones generated by stepwise cleavage. The slide shows angiotensin I as a peptide substrate and ACE as the enzyme that removes residues to generate shorter angiotensin products, including active angiotensin II.","mustKnow":["Angiotensin I is a peptide precursor.","ACE processes angiotensin I into a shorter peptide product.","ACE has a defined active site that recognizes peptide substrates."],"terms":[{"term":"Peptide","meaning":"A chain of amino acids linked by peptide bonds."},{"term":"Precursor","meaning":"A molecule converted into another product in a pathway."},{"term":"Active site","meaning":"The region of an enzyme where substrate binding and catalysis occur."}],"diagramGuide":["The numbered circles show peptide shortening from angiotensin I.","ACE and ACE2 generate different products: ACE makes angiotensin II, whereas ACE2 routes toward angiotensin 1-9 or 1-7.","The structural panels locate a catalytic Zn2+ in the enzyme active site."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which product is generated directly from angiotensin I by ACE in the diagram?","options":["Angiotensin 1-5","Angiotensin II","Angiotensin 1-7","Angiotensin IV"],"answer":1,"explanation":"The left branch labels ACE conversion of angiotensin I to angiotensin II."},{"q":"ACE converts angiotensin I into:","options":["Angiotensinogen","Angiotensin II","Renin","Aldosterone"],"answer":1,"explanation":"Angiotensin-converting enzyme generates angiotensin II from angiotensin I."}]}},{"page":368,"lecture":"Drug Development 2","slideInLecture":7,"title":"Captopril: First ACE Inhibitor","explain":"The path to captopril began with teprotide, a nine-amino-acid ACE inhibitor isolated from Brazilian pit-viper venom. Researchers synthesized analogs of this venom peptide, leading to captopril, the first orally bioavailable ACE inhibitor.","mustKnow":["Bothrops jararaca venom showed blood-pressure-lowering activity.","Teprotide is a nonapeptide that inhibits ACE.","Captopril was developed from analog studies inspired by teprotide.","Captopril was the first orally bioavailable ACE inhibitor."],"terms":[{"term":"Teprotide","meaning":"A nine-amino-acid ACE-inhibiting peptide isolated from pit-viper venom."},{"term":"ACE inhibitor","meaning":"A compound that blocks angiotensin-converting enzyme."},{"term":"Orally bioavailable","meaning":"Able to reach systemic circulation in an active form after oral dosing."},{"term":"Analog","meaning":"A chemically related molecule made by modifying a starting structure."}],"diagramGuide":["The slide connects pit-viper venom to teprotide, then medicinal-chemistry analogs to captopril.","Teprotide is a nonapeptide and inhibits ACE but captopril is highlighted as orally bioavailable.","The historical timeline ends with medical approval in 1980."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What property distinguished captopril from the venom peptide lead teprotide?","options":["Oral bioavailability","Nine-amino-acid length","Isolation directly from venom","Lack of ACE inhibition"],"answer":0,"explanation":"Captopril is identified as the first orally bioavailable ACE inhibitor."},{"q":"Teprotide was originally isolated from the venom of:","options":["Naja naja","Dendroaspis polylepis","Crotalus atrox","Bothrops jararaca"],"answer":3,"explanation":"The slide identifies the Brazilian pit viper Bothrops jararaca as the source."},{"q":"Teprotide is best described as a:","options":["Monoclonal antibody","Nucleoside analog","Nonapeptide ACE inhibitor","Steroid receptor agonist"],"answer":2,"explanation":"Teprotide is a nine-residue peptide that inhibits ACE."}]}},{"page":369,"lecture":"Drug Development 2","slideInLecture":8,"title":"How Captopril Binds ACE","explain":"Captopril uses several contacts in the ACE active site. Its zinc-binding group coordinates the catalytic Zn2+, its carboxylate forms ionic and hydrogen-bond interactions, and hydrophobic portions occupy hydrophobic binding regions.","mustKnow":["Coordination with Zn2+ is essential for captopril activity.","The carboxylate forms ionic and hydrogen-bond interactions.","Hydrophobic substituents can strengthen contacts in hydrophobic pockets."],"terms":[{"term":"Coordination","meaning":"Binding interaction between a metal ion and an electron-donating group."},{"term":"Carboxylate","meaning":"The negatively charged form of a carboxylic acid group."},{"term":"Hydrogen bond","meaning":"A directional noncovalent attraction involving a hydrogen-bearing group."},{"term":"Hydrophobic pocket","meaning":"A nonpolar region of a protein binding site."}],"diagramGuide":["The left atomic diagram labels residues contacting captopril and the catalytic zinc.","The right pocket separates zinc-binding, hydrogen-bonding, hydrophobic, and ionic regions.","Captopril's thiol coordinates Zn2+; its carboxylate makes ionic/H-bond contacts."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which captopril functional group coordinates the ACE Zn2+ most directly?","options":["Carboxylate","Amide carbonyl","Methyl group","Thiol"],"answer":3,"explanation":"The diagram draws the sulfur-containing thiol at the zinc-binding site."},{"q":"Which interaction of captopril is stated to be essential for ACE-inhibitory activity?","options":["Hydrogen bonding to ATP","Coordination with Zn2+","Covalent binding to DNA","Chelation of Ca2+"],"answer":1,"explanation":"Coordination of the catalytic zinc ion is essential for activity."},{"q":"Captopril's carboxylate interacts with ACE through:","options":["Ionic and hydrogen-bond interactions","Disulfide bonds only","Peptide bonds","Base pairing"],"answer":0,"explanation":"The carboxylate forms both ionic and hydrogen-bond contacts in the active site."}]}},{"page":370,"lecture":"Drug Development 2","slideInLecture":9,"title":"Structure-Activity Relationships of ACE Inhibitors","explain":"ACE-inhibitor activity depends on recurring structural features. The N-ring contains a carboxylic acid, larger hydrophobic rings can improve potency and pharmacokinetics, and zinc-binding groups such as thiol, carboxylate, or phosphate interact with ACE. Esterification can create prodrugs.","mustKnow":["The N-ring must contain a carboxylic acid in the SAR shown.","Larger hydrophobic N-rings can improve potency and pharmacokinetics.","Thiol binds Zn2+ more strongly than the carboxylate and phosphate groups shown.","Esterification of carboxylate or phosphate can produce a prodrug."],"terms":[{"term":"SAR","meaning":"Structure-activity relationship: how structural changes alter biological activity."},{"term":"Thiol","meaning":"A sulfur-containing -SH group."},{"term":"Esterification","meaning":"Conversion of an acid group into an ester."},{"term":"Potency","meaning":"The amount of a compound required to produce a given effect."}],"diagramGuide":["The generic pharmacophore places a Zn2+-binding group at one end and an N-ring carboxylic acid at the other.","Thiol, carboxylate, and phosphate are compared as zinc-binding groups; thiol is stated to bind most strongly.","Esterifying acidic groups can mask charge and create prodrugs, as illustrated by enalapril versus enalaprilat."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which compound shown is the ester prodrug of enalaprilat?","options":["Quinaprilat","Captopril","Enalapril","Lisinopril"],"answer":2,"explanation":"Enalapril is the esterified prodrug paired with active enalaprilat."},{"q":"Which zinc-binding group is stated to bind Zn2+ more strongly than carboxylate or phosphate?","options":["Amide","Methyl","Ether","Thiol"],"answer":3,"explanation":"The SAR slide identifies thiol as the strongest of the three zinc-binding groups shown."},{"q":"Esterification of an acidic ACE-inhibitor group is used primarily to create a:","options":["Radiotracer","Metal complex","Prodrug","Protein conjugate"],"answer":2,"explanation":"Masking carboxylate or phosphate as an ester can improve delivery and create a prodrug."}]}},{"page":371,"lecture":"Drug Development and Techniques","slideInLecture":1,"title":"Lecture 36: Discovery and Techniques","explain":"This lecture section combines drug-discovery strategies with experimental techniques, moving from computational and phenotypic screening to prodrugs and thermal shift assays.","mustKnow":["The section links compound discovery, drug-property improvement, and protein-stability measurement."],"terms":[{"term":"Biophysical technique","meaning":"A method that measures a physical property of a biological molecule or interaction."}],"diagramGuide":["This divider begins Lecture 36, combining Drug Development with Techniques in Biochemistry and Biophysics."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which pair of themes is announced for Lecture 36?","options":["Stem cells and microbial pathogenesis","Drug development and biochemical/biophysical techniques","Cancer incidence and immunology","Bioenergetics and genetics"],"answer":1,"explanation":"Both themes are printed on the title slide."}]}},{"page":372,"lecture":"Drug Development and Techniques","slideInLecture":2,"title":"Virtual Screening Workflow","explain":"Computational screening can begin from either a protein structure or known active ligands. Both routes rank candidate molecules, produce a final hit list, and pass those compounds to a biological assay for experimental confirmation.","mustKnow":["Structure-based and ligand-based screening are two computational routes.","Computation creates a ranked hit list rather than proving activity.","Biological assays validate predicted hits."],"terms":[{"term":"Hit list","meaning":"A ranked set of compounds predicted to be promising."},{"term":"Biological assay","meaning":"An experiment that measures a compound's biological activity."}],"diagramGuide":["Structure-based and ligand-based virtual screening converge on a filtered hit list.","Drug-likeness, toxicity, ADME, and filtering rate are depicted as sequential constraints.","The biological assay is the experimental validation step after computation."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What should happen immediately after a computational final hit list is produced?","options":["Test hits in a biological assay","Declare regulatory approval","Begin Phase III trials","Discard molecular structures"],"answer":0,"explanation":"The flowchart sends the final hit list to a biological assay."},{"q":"Which step experimentally tests the final hit list from virtual screening?","options":["Tablet coating","Biological assay","File compression","Patent search"],"answer":1,"explanation":"Computational predictions must be validated in a biological assay."},{"q":"Which pair represents the two main virtual-screening routes shown?","options":["Structure-based and ligand-based","Clinical and preclinical","Oral and intravenous","Genetic and epigenetic"],"answer":0,"explanation":"Both structure-based and ligand-based workflows converge on a filtered hit list."}]}},{"page":373,"lecture":"Drug Development and Techniques","slideInLecture":3,"title":"HTS Workflow","explain":"High-throughput screening uses automated liquid handling and detection systems to test many compounds. A primary screen identifies possible activity, secondary assays confirm it, and dose-response analysis helps select a lead.","mustKnow":["HTS depends heavily on automation.","Secondary assays reduce false or nonreproducible hits.","Dose-response testing follows hit confirmation.","The goal is a credible lead for optimization."],"terms":[{"term":"Primary screen","meaning":"The first large-scale assay used to find possible hits."},{"term":"Secondary assay","meaning":"A follow-up test used to confirm and characterize primary hits."},{"term":"Liquid handler","meaning":"An automated instrument that dispenses small liquid volumes."}],"diagramGuide":["Primary screen -> secondary/counter screen -> confirmed hits -> SAR/medicinal chemistry -> leads -> clinical trials.","The narrowing diamonds show attrition at each decision point.","Robotic liquid handling and plate readers enable throughput."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which step directly precedes structure-activity relationship analysis in the workflow?","options":["Primary screen","Clinical trials","Biological target selection","Confirmed hits"],"answer":3,"explanation":"The funnel places confirmed hits immediately before SAR and medicinal chemistry."},{"q":"Why are secondary assays performed after a primary HTS?","options":["To manufacture tablets","To recruit trial participants","To calculate drug price","To confirm hits and remove artifacts"],"answer":3,"explanation":"Secondary and counter screens test reproducibility and eliminate nonspecific or artifactual activity."},{"q":"Dose-response analysis is performed after:","options":["Phase III completion","Commercial packaging","Hit confirmation","Regulatory approval"],"answer":2,"explanation":"Confirmed hits are characterized by dose-response before lead selection and optimization."}]}},{"page":374,"lecture":"Drug Development and Techniques","slideInLecture":4,"title":"Phenotypic Screening","explain":"Phenotypic screening selects compounds because they produce a desired change in cells or organisms, such as stopping unwanted proliferation. It does not require the molecular target to be known first, but target identification may be needed later.","mustKnow":["Phenotypic screening begins with an observable biological effect.","The target does not need to be known before screening.","Target deconvolution may be required after an active compound is found."],"terms":[{"term":"Phenotype","meaning":"An observable characteristic or response of a cell or organism."},{"term":"Target-based screening","meaning":"Screening compounds directly against a predefined molecular target."},{"term":"Target deconvolution","meaning":"Identification of the molecular target responsible for a compound's phenotypic effect."}],"diagramGuide":["Phenotype-led discovery starts with a biological effect and may identify the molecular target later.","Target-led discovery starts with a defined target and screens for molecules that modulate it.","The blue callout highlights target deconvolution as a later burden in phenotypic screening."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What is the characteristic follow-up problem after a phenotypic hit is found?","options":["Obtaining a target structure before screening","Avoiding all cell-based assays","Identifying the compound's molecular target","Measuring whether any phenotype occurred"],"answer":2,"explanation":"Phenotypic screening can find active compounds before their targets are known, requiring target deconvolution."},{"q":"Phenotypic screening starts by selecting compounds that produce:","options":["A specific patent classification","A desired observable biological effect","A predetermined docking score only","A known protein crystal structure"],"answer":1,"explanation":"The screen begins from a cellular or organismal phenotype rather than a predefined molecular target."},{"q":"Identifying the molecular target after finding a phenotypic hit is called:","options":["Target deconvolution","Lead formulation","Dose escalation","First-pass metabolism"],"answer":0,"explanation":"Target deconvolution is the later task of discovering what molecule caused the observed phenotype."}]}},{"page":375,"lecture":"Drug Development and Techniques","slideInLecture":5,"title":"Phenotypic Screening Against RAS Mutants","explain":"HRAS, KRAS, and NRAS are small GTPases involved in proliferation, growth, and apoptosis. Oncogenic RAS mutations can drive uncontrolled cell division. The example compares compound potency in mutant HRASG12V cells with wild-type HRAS cells; lower EC50 values in the mutant indicate mutant-selective activity.","mustKnow":["HRAS, KRAS, and NRAS are small GTPases.","RAS mutations can cause uncontrolled cell growth and occur in about 30% of human cancers.","Lower EC50 means greater potency.","The compounds shown are more potent in HRASG12V than in wild-type HRAS."],"terms":[{"term":"Small GTPase","meaning":"A signaling protein that switches between GTP-bound and GDP-bound states."},{"term":"Oncogene","meaning":"A gene whose activating alteration can promote cancer."},{"term":"EC50","meaning":"Concentration producing half of the compound's maximum measured effect."},{"term":"Wild type","meaning":"The standard nonmutant form used for comparison."}],"diagramGuide":["The EC50 pairs compare mutant HRASG12V with wild-type HRAS; lower EC50 means greater potency.","Both example compounds inhibit mutant cells at much lower concentrations than wild-type cells.","The workflow begins with a large library and filters for growth inhibition and mutant selectivity."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which compound in the slide shows the larger mutant-versus-wild-type selectivity ratio?","options":["The data do not include wild-type EC50 values","ML162","ML210","They are identical"],"answer":1,"explanation":"ML162 compares 25 nM with 578 nM, a larger fold difference than 71 nM versus 272 nM for ML210."},{"q":"RAS mutations are found in approximately what fraction of human cancers according to the slide?","options":["10%","30%","80%","3%"],"answer":1,"explanation":"The slide states that RAS oncogenic mutations occur in about 30% of human cancers."},{"q":"For the compound with EC50 values of 25 nM in HRASG12V and 578 nM in HRASWT, which cells are more sensitive?","options":["Both equally","Sensitivity cannot be inferred","HRASWT cells","HRASG12V cells"],"answer":3,"explanation":"A lower EC50 indicates higher potency, so the mutant cells are more sensitive."}]}},{"page":376,"lecture":"Drug Development and Techniques","slideInLecture":6,"title":"Ferroptosis","explain":"Ferroptosis is a regulated cell-death process driven by iron-associated oxidation of polyunsaturated phospholipids. The pathway diagram contrasts reactions that generate lipid peroxides with antioxidant systems, including glutathione-dependent peroxidase activity and ferroptosis-suppressor pathways, that limit this damage.","mustKnow":["Ferroptosis is associated with lipid peroxidation.","Polyunsaturated fatty acids in phospholipids provide oxidation-sensitive substrates.","Iron uptake and lipoxygenase-linked reactions can promote oxidative damage.","Glutathione/peroxidase and FSP pathways oppose ferroptosis."],"terms":[{"term":"Ferroptosis","meaning":"Regulated cell death associated with iron-dependent lipid peroxidation."},{"term":"PUFA","meaning":"Polyunsaturated fatty acid."},{"term":"Lipid peroxidation","meaning":"Oxidative damage to membrane lipids."},{"term":"FSP","meaning":"Ferroptosis suppressor protein."}],"diagramGuide":["Left arm loads PUFAs into phospholipids and promotes iron/LOX-dependent lipid peroxidation.","System Xc- supplies cystine for glutathione; GPX4 uses glutathione to remove lipid hydroperoxides.","FSP1-CoQ and DHFR-BH4 are parallel antioxidant defenses; ML162 is shown binding GPX4."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Inhibition of which protein by ML162 removes a glutathione-dependent defense against ferroptosis?","options":["GPX4","ACSL4","LPCAT3","TFRC1"],"answer":0,"explanation":"The structure panel labels ML162 at GPX4, which detoxifies lipid hydroperoxides using glutathione."},{"q":"System Xc- supports ferroptosis resistance by supplying cystine for synthesis of:","options":["Heme","Glutathione","Cholesterol","Glycogen"],"answer":1,"explanation":"Imported cystine supports glutathione synthesis, which GPX4 uses to detoxify lipid hydroperoxides."},{"q":"Which two pathways are shown as glutathione-independent antioxidant defenses against ferroptosis?","options":["FSP1-CoQ and DHFR-BH4","RAS-MAPK and PI3K-AKT","PD-1-PD-L1 and MHC-TCR","Renin-ACE and aldosterone"],"answer":0,"explanation":"The diagram shows FSP1-CoQ and DHFR-BH4 as parallel antioxidant systems."}]}},{"page":377,"lecture":"Drug Development and Techniques","slideInLecture":7,"title":"Why Make a Prodrug?","explain":"A prodrug is an inactive or less active derivative converted into the active drug inside the body. Prodrugs are designed to reduce poor properties such as low solubility, weak absorption, instability, toxicity, bad taste, or short duration, and may enable a different route or dosage form.","mustKnow":["A prodrug must be converted into an active drug in the body.","Prodrugs can improve physicochemical or biological properties.","They can alter route of administration or dosage form.","Possible goals include better solubility, permeability, stability, taste, or duration."],"terms":[{"term":"Prodrug","meaning":"An inactive or less active drug derivative converted to the active form in the body."},{"term":"Physicochemical property","meaning":"A physical or chemical feature such as solubility or stability."},{"term":"Permeability","meaning":"Ability of a molecule to cross a biological barrier."},{"term":"Dosage form","meaning":"The physical form in which a medicine is administered."}],"diagramGuide":["The central body diagram shows an inactive prodrug converted by metabolism into an active drug that distributes to tissues.","The left list names properties a prodrug may improve, including solubility, permeability, stability, toxicity, taste, and duration.","A prodrug changes delivery properties; it is not merely a lower dose of the same active form."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which problem is most directly addressed by masking a polar group to improve membrane crossing?","options":["Short patent life","Target mutation","High receptor selectivity","Poor membrane permeability"],"answer":3,"explanation":"Poor membrane permeability is one of the explicit prodrug rationales."},{"q":"A prodrug is converted in the body into:","options":["A placebo","A receptor","A dietary nutrient","An active drug"],"answer":3,"explanation":"A prodrug is an inactive or less active derivative designed to release the active drug in vivo."},{"q":"Which undesirable property can prodrug design be used to reduce?","options":["Protein sequence length","Chromosome number","Poor solubility","Target specificity in every case"],"answer":2,"explanation":"Prodrugs can improve solubility, permeability, stability, toxicity, taste, or duration."}]}},{"page":378,"lecture":"Drug Development and Techniques","slideInLecture":8,"title":"How Prodrugs Are Activated","explain":"A prodrug contains a removable group or linking strategy that masks part of the drug. Activation can occur through enzymes such as phosphatases, esterases, and peptidases, through chemical processes such as hydrolysis, decarboxylation, or light, or through a mixture of both.","mustKnow":["Enzymes can activate prodrugs.","Chemical reactions can also activate prodrugs.","Phosphatase, esterase, and peptidase are listed activating enzymes.","Hydrolysis, decarboxylation, and light are listed chemical triggers."],"terms":[{"term":"Esterase","meaning":"An enzyme that hydrolyzes ester bonds."},{"term":"Phosphatase","meaning":"An enzyme that removes phosphate groups."},{"term":"Peptidase","meaning":"An enzyme that cleaves peptide bonds."},{"term":"Promoiety","meaning":"A temporary chemical group attached to improve a drug property and later removed."}],"diagramGuide":["Top scheme: a promoiety masks the drug; enzymatic or chemical transformation removes it after crossing a barrier.","The list separates enzyme activation from hydrolysis, decarboxylation, and light activation.","The PDT image is an example of light-triggered activation at a target tissue."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which activation mechanism does not require an enzyme?","options":["Peptidase cleavage","Phosphatase cleavage","Photochemical activation by light","Esterase cleavage"],"answer":2,"explanation":"Light is listed under chemical activation, whereas the other choices are enzymes."},{"q":"Which enzyme class can activate an ester prodrug?","options":["Topoisomerase","Esterase","Polymerase","Helicase"],"answer":1,"explanation":"Esterases are among the enzyme classes listed for prodrug activation."},{"q":"Which is a chemical trigger for prodrug activation rather than an enzyme?","options":["Peptidase","Phosphatase","Decarboxylation","Esterase"],"answer":2,"explanation":"Decarboxylation, hydrolysis, and light are listed as chemical activation mechanisms."}]}},{"page":379,"lecture":"Drug Development and Techniques","slideInLecture":9,"title":"Prodrug Strategy for Masking Bad Taste","explain":"A water-soluble drug can dissolve in the mouth and contact taste receptors, creating an unpleasant taste. Converting it to a less water-soluble prodrug reduces dissolution in the mouth. The example converts bitter chloramphenicol into chloramphenicol palmitate.","mustKnow":["Taste requires dissolved molecules to contact taste receptors.","Reducing water solubility can reduce dissolution in the mouth.","Chloramphenicol palmitate is shown as a taste-masking prodrug."],"terms":[{"term":"Chloramphenicol","meaning":"The water-soluble bitter drug used in the slide example."},{"term":"Chloramphenicol palmitate","meaning":"A less water-soluble prodrug used to mask chloramphenicol's taste."},{"term":"Taste receptor","meaning":"A receptor activated by dissolved chemicals in the mouth."}],"diagramGuide":["Chloramphenicol is converted to the palmitate ester shown on the right.","The added hydrophobic chain lowers water solubility, reducing dissolution in saliva and contact with taste receptors.","The active drug must later be regenerated from the prodrug."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why does chloramphenicol palmitate taste less bitter than chloramphenicol?","options":["It permanently destroys the active drug","It dissolves less in the mouth","It binds taste receptors more strongly","It is more water soluble"],"answer":1,"explanation":"Reduced aqueous solubility limits oral dissolution and taste-receptor contact."}]}},{"page":380,"lecture":"Drug Development and Techniques","slideInLecture":10,"title":"Thermal Shift Assay","explain":"A thermal shift assay measures protein stability by heating a protein while monitoring fluorescence. SYPRO Orange fluoresces more when it binds hydrophobic surfaces exposed during unfolding. The midpoint of the unfolding transition is the melting temperature, Tm; fluorescence later falls as unfolded proteins aggregate and release dye.","mustKnow":["TSA measures changes in protein thermal stability.","SYPRO Orange binds exposed hydrophobic surfaces.","Fluorescence rises as the protein unfolds.","Tm is the midpoint of the unfolding transition."],"terms":[{"term":"TSA","meaning":"Thermal shift assay."},{"term":"SYPRO Orange","meaning":"A fluorescent dye that binds exposed hydrophobic protein surfaces."},{"term":"Tm","meaning":"Melting temperature at the midpoint of thermal unfolding."},{"term":"Denaturation","meaning":"Loss of a protein's folded structure."}],"diagramGuide":["SYPRO Orange is weakly fluorescent with folded protein, then binds exposed hydrophobic surfaces during unfolding.","The melt curve rises to a fluorescence peak; the transition midpoint is Tm.","At still higher temperature, aggregation and dye dissociation reduce fluorescence."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why can fluorescence fall after the TSA curve reaches its maximum?","options":["Aggregated protein releases or excludes the dye","The protein refolds completely at higher temperature","SYPRO Orange becomes a covalent ligand","All hydrophobic surfaces become more exposed indefinitely"],"answer":0,"explanation":"The slide links the post-peak decline to aggregation and dye dissociation."},{"q":"SYPRO Orange fluorescence rises during protein unfolding because the dye binds exposed:","options":["Phosphate groups","DNA bases","Metal ions","Hydrophobic surfaces"],"answer":3,"explanation":"Unfolding exposes hydrophobic regions that bind SYPRO Orange."},{"q":"In a thermal shift assay, Tm is the:","options":["Highest fluorescence value in every curve","Temperature of protein synthesis","Temperature of the unfolding-transition midpoint","Temperature at which heating begins"],"answer":2,"explanation":"Tm is obtained from the midpoint of the thermal unfolding transition."}]}},{"page":381,"lecture":"Drug Development and Techniques","slideInLecture":11,"title":"Using TSA to Compare Protein Stability","explain":"The RecA curves show how buffer pH changes the temperature at which unfolding occurs. A curve shifted to a higher temperature has a higher Tm and indicates greater thermal stability under that condition. The derivative plot helps locate each transition peak.","mustKnow":["TSA can compare protein stability across buffer conditions.","A higher-temperature transition means a higher Tm.","A higher Tm indicates greater thermal stability.","The example tests the effect of pH on RecA."],"terms":[{"term":"RecA","meaning":"An ATP-dependent protein involved in DNA-damage repair."},{"term":"Melt curve","meaning":"Fluorescence plotted against temperature during protein unfolding."},{"term":"Derivative plot","meaning":"A transformed melt curve used to identify the unfolding-transition peak."}],"diagramGuide":["Top panel shows raw fluorescence; bottom derivative peaks sharpen each unfolding transition.","A right-shifted transition/derivative peak means a higher Tm and greater stability.","Compare buffer conditions by peak position, not simply by peak height."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which plotted feature should be used to identify the Tm most precisely?","options":["Initial fluorescence at 10 C","Maximum raw fluorescence amplitude only","Final fluorescence at 100 C","Peak of the derivative curve"],"answer":3,"explanation":"The derivative maximum marks the steepest transition and is used to locate Tm."},{"q":"When comparing RecA stability across pH conditions, a derivative peak farther to the right indicates:","options":["Greater fluorescence without unfolding","Lower Tm and lower stability","Higher Tm and greater stability","More protein but unchanged stability"],"answer":2,"explanation":"A transition at a higher temperature indicates a higher melting temperature and greater thermal stability."}]}},{"page":382,"lecture":"Drug Development and Techniques","slideInLecture":12,"title":"Detecting Ligand Binding with TSA","explain":"If a small molecule binds preferentially to the native folded protein, it can stabilize that structure. The protein-ligand complex then unfolds at a higher temperature than the unbound protein, producing a positive shift in Tm and in the melt curve.","mustKnow":["A stabilizing ligand preferentially binds the native protein.","Ligand stabilization raises the complex's Tm.","A positive thermal shift can indicate protein-ligand interaction."],"terms":[{"term":"Ligand","meaning":"A molecule that binds to a protein."},{"term":"Thermal shift","meaning":"A change in melting temperature relative to a comparison sample."},{"term":"Native state","meaning":"The normally folded form of a protein."}],"diagramGuide":["Blue sample curves and the red reference are compared by horizontal position.","A stabilizing ligand shifts the protein transition toward higher temperature; vertical dashed lines mark the corresponding Tm values.","The yellow non-protein control remains near baseline."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A ligand-bound sample curve shifts 4 C to the right of the unbound reference. What is the supported conclusion?","options":["The protein has no thermal transition","The dye is unnecessary for the assay","The ligand stabilizes the folded protein","The ligand lowers Tm"],"answer":2,"explanation":"A positive Tm shift indicates preferential binding to and stabilization of the native state."},{"q":"A positive thermal shift occurs when a ligand preferentially stabilizes which protein state?","options":["Native folded state","Aggregated state","Proteolyzed state","Covalently fragmented state"],"answer":0,"explanation":"Preferential binding to the native state raises the temperature required for unfolding."}]}},{"page":383,"lecture":"Techniques in Biochemistry and Biophysics","slideInLecture":1,"title":"Lecture 37: Biochemistry and Biophysics Techniques","explain":"This lecture section covers techniques for measuring protein stability and molecular interactions, including thermal shift assays, isothermal titration calorimetry, and FRET.","mustKnow":["The section compares fluorescence-based and heat-based measurements of molecular behavior."],"terms":[{"term":"Biophysics","meaning":"Application of physical principles and measurements to biological systems."}],"diagramGuide":["This divider begins Lecture 37 on Techniques in Biochemistry and Biophysics."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which measurement methods are developed in this lecture section?","options":["Chromatography only","TSA, ITC, and FRET","PCR, ELISA, and Western blotting","MRI, CT, and ultrasound"],"answer":1,"explanation":"The following slides cover thermal shift assays, isothermal titration calorimetry, and FRET."}]}},{"page":384,"lecture":"Techniques in Biochemistry and Biophysics","slideInLecture":2,"title":"TSA Signal and Melting Temperature","explain":"In TSA, a protein is gradually heated. Exposed hydrophobic surfaces bind SYPRO Orange as the protein unfolds, increasing fluorescence. The transition midpoint gives Tm, while aggregation at still higher temperature can release dye and reduce the signal.","mustKnow":["Protein unfolding exposes hydrophobic regions.","SYPRO Orange binding increases fluorescence.","Tm is read from the midpoint of the unfolding transition.","Aggregation can cause fluorescence to decrease after the peak."],"terms":[{"term":"Hydrophobic surface","meaning":"A nonpolar protein region normally buried away from water."},{"term":"Aggregation","meaning":"Association of unfolded proteins into larger clusters."},{"term":"Fluorescence","meaning":"Light emitted by a molecule after it absorbs light."}],"diagramGuide":["The signal sequence is dye binding during unfolding, rising fluorescence, then aggregation-associated decline.","Tm is read at the unfolding transition midpoint, not at the final baseline.","The small molecular sketch labels SYPRO Orange emission near 570 nm."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What molecular feature of an unfolding protein creates the TSA fluorescence increase?","options":["Exposure of hydrophobic surfaces","Formation of new peptide bonds","Loss of all aromatic residues","Release of DNA"],"answer":0,"explanation":"SYPRO Orange binds exposed hydrophobic surfaces."},{"q":"The approximate emission wavelength labeled for SYPRO Orange is:","options":["470 nm","570 nm","670 nm","370 nm"],"answer":1,"explanation":"The slide labels SYPRO Orange emission near 570 nm."},{"q":"Why does TSA fluorescence often decline after reaching its peak?","options":["The temperature falls","The dye becomes a ligand","The protein refolds completely","Aggregation causes dye dissociation"],"answer":3,"explanation":"At high temperature, unfolded proteins aggregate and the dye dissociates, reducing fluorescence."}]}},{"page":385,"lecture":"Techniques in Biochemistry and Biophysics","slideInLecture":3,"title":"TSA as a Binding Assay","explain":"A ligand that binds and stabilizes the folded protein shifts the melt curve toward higher temperatures. Comparing the protein alone with protein-plus-ligand therefore gives a quick indication of a stabilizing interaction.","mustKnow":["Compare ligand-bound and unbound protein curves.","A positive Tm shift indicates stabilization.","TSA detects a stability change rather than directly locating the binding site."],"terms":[{"term":"Protein-ligand complex","meaning":"A protein with a ligand bound to it."},{"term":"Positive shift","meaning":"Movement of the unfolding transition to a higher temperature."}],"diagramGuide":["The ligand-bound sample is identified by a melt transition shifted to higher temperature relative to the reference.","The derivative plot makes the positive Tm shift easier to compare.","A stabilizing shift reports binding but does not by itself give a full binding constant."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which observation is evidence for a stabilizing protein-ligand interaction in TSA?","options":["A lower initial dye concentration","An unchanged Tm with a taller baseline","Loss of every fluorescence signal","A higher derivative-peak temperature"],"answer":3,"explanation":"The ligand-stabilized protein unfolds later, shifting Tm and the derivative peak rightward."},{"q":"What limitation applies to a positive thermal shift observed in TSA?","options":["It proves irreversible covalent binding","It proves the exact binding site","It reports stabilization but not the exact binding site","It directly gives a complete crystal structure"],"answer":2,"explanation":"TSA can indicate a stabilizing interaction but does not by itself locate the binding site."}]}},{"page":386,"lecture":"Techniques in Biochemistry and Biophysics","slideInLecture":4,"title":"Isothermal Titration Calorimeter","explain":"An isothermal titration calorimeter contains a sample cell with protein and a reference cell with buffer inside an insulated jacket. The instrument measures the feedback power needed to keep both cells at the same temperature as binding releases or absorbs heat.","mustKnow":["The sample cell contains protein and the reference cell contains buffer.","The instrument detects tiny temperature differences between the cells.","Feedback power maintains equal temperatures.","Exothermic binding decreases sample-cell feedback power; endothermic binding increases it."],"terms":[{"term":"ITC","meaning":"Isothermal titration calorimetry, a method that measures heat during molecular binding."},{"term":"Reference cell","meaning":"The control cell, containing buffer in the setup shown."},{"term":"Exothermic","meaning":"Releasing heat."},{"term":"Endothermic","meaning":"Absorbing heat."}],"diagramGuide":["The instrument has matched reference and sample cells inside an adiabatic jacket.","A thermopile senses a temperature difference; feedback power restores equality.","Exothermic binding reduces required sample-cell heating, whereas endothermic binding increases it."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"During an endothermic binding event, how does the instrument maintain equal cell temperatures?","options":["It removes buffer from the reference cell","It stops ligand injection permanently","It increases feedback power to the sample cell","It decreases feedback power to the sample cell"],"answer":2,"explanation":"The slide states that an endothermic reaction requires increased feedback power."},{"q":"What is placed in the ITC reference cell?","options":["Buffer","Protein plus ligand","Ligand crystal","Fluorescent dye"],"answer":0,"explanation":"The sample cell contains protein, while the reference cell contains buffer."},{"q":"During an exothermic ITC reaction, feedback power supplied to the sample cell:","options":["Increases","Remains fixed at zero","Alternates randomly","Decreases"],"answer":3,"explanation":"Released heat reduces the heater power required to maintain the sample cell at the reference temperature."}]}},{"page":387,"lecture":"Techniques in Biochemistry and Biophysics","slideInLecture":5,"title":"Early ITC Injections","explain":"At the start of an ITC titration, protein binding sites are mostly free, so an injected ligand binds extensively and produces a large heat signal. In the exothermic example, heat release means delta H is negative and the feedback power decreases. The signal returns to baseline before the next injection.","mustKnow":["Early injections can produce large peaks because many binding sites are free.","Exothermic binding has negative delta H.","After binding reaches equilibrium, the signal returns to baseline.","The next injection is made after baseline recovery."],"terms":[{"term":"Delta H","meaning":"Enthalpy change of the binding reaction."},{"term":"Baseline","meaning":"The stable instrument signal before or between injection peaks."},{"term":"Equilibrium","meaning":"A state with no net change in binding populations."}],"diagramGuide":["At the first injections, protein is in excess and many sites are free, so binding heat is large.","For the exothermic example, delta H is negative and feedback power decreases.","Each signal must return to baseline before the next injection for clean peak integration."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why is the first exothermic ITC injection typically larger than a late injection?","options":["Ligand concentration is zero initially","More unoccupied protein sites are available","Only heat of dilution occurs initially","The protein is already saturated initially"],"answer":1,"explanation":"Early in the titration, most injected ligand binds because many sites are free."},{"q":"For the exothermic ITC example, the sign of binding enthalpy is:","options":["Zero","Undefined","Positive","Negative"],"answer":3,"explanation":"Heat release corresponds to a negative enthalpy change."},{"q":"Before the next ITC injection, the heat signal should:","options":["Remain permanently displaced","Return to baseline","Reach its maximum","Change sign"],"answer":1,"explanation":"Baseline recovery separates successive peaks and allows clean integration."}]}},{"page":388,"lecture":"Techniques in Biochemistry and Biophysics","slideInLecture":6,"title":"ITC Saturation","explain":"As repeated ligand injections fill more protein binding sites, less newly injected ligand can bind and each heat peak becomes smaller. Once the protein is saturated, the remaining signal is mainly the heat of dilution rather than binding.","mustKnow":["Peak size decreases as protein binding sites become occupied.","Complete occupancy is called saturation.","After saturation, the observed signal is mainly heat of dilution."],"terms":[{"term":"Saturation","meaning":"The state in which essentially all available binding sites are occupied."},{"term":"Heat of dilution","meaning":"Heat produced or absorbed when a solution is diluted, independent of specific binding."}],"diagramGuide":["The peak train shrinks from left to right as binding sites become occupied.","At the end, small nearly constant peaks represent mainly heat of dilution.","Saturation changes peak area, not merely the time between injections."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What does the residual signal represent after complete protein saturation?","options":["Heat of ligand dilution","Maximum binding enthalpy at empty sites","Protein synthesis","Covalent dye labeling"],"answer":0,"explanation":"Once no new specific binding occurs, the remaining heat is primarily dilution heat."},{"q":"Why do successive ITC peaks become smaller during a binding titration?","options":["Fewer unoccupied protein sites remain","The ligand becomes more concentrated","The reference cell heats permanently","Protein concentration increases"],"answer":0,"explanation":"As binding sites fill, less newly injected ligand can bind and less binding heat is produced."},{"q":"After complete saturation, the small residual ITC peaks mainly represent:","options":["Protein synthesis","Fluorescence quenching","DNA hybridization","Heat of dilution"],"answer":3,"explanation":"Once no additional binding occurs, the remaining signal is mainly dilution heat."}]}},{"page":389,"lecture":"Techniques in Biochemistry and Biophysics","slideInLecture":7,"title":"Reading ITC Results","explain":"The raw ITC trace contains one heat peak per ligand injection. Integrating each peak gives the heat per injection, which is plotted against the ligand-to-protein molar ratio to form a binding isotherm. Its plateau, inflection point, and slope provide enthalpy, stoichiometry, and binding affinity.","mustKnow":["Each raw peak corresponds to one ligand injection.","Peak areas are integrated to obtain heat values.","Integrated heat is plotted against ligand-to-protein molar ratio.","ITC can provide enthalpy, stoichiometry, and affinity."],"terms":[{"term":"Binding isotherm","meaning":"A binding-response curve measured at constant temperature."},{"term":"Stoichiometry","meaning":"The number of ligand molecules bound per protein molecule or binding unit."},{"term":"Ka","meaning":"Association constant; larger values indicate stronger association."},{"term":"Kd","meaning":"Dissociation constant; Ka equals 1 divided by Kd in the relation shown."}],"diagramGuide":["Left: raw power-versus-time peaks, one per injection.","Right: integrated peak areas plotted against ligand:protein molar ratio form a binding isotherm.","The isotherm yields delta H, stoichiometry n, and affinity; Ka equals 1/Kd."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which processing step converts the raw injection trace into points on the binding isotherm?","options":["Taking only the tallest peak height","Subtracting the protein concentration from time","Differentiating ligand molar ratio","Integrating the area of each heat peak"],"answer":3,"explanation":"The slide explicitly states that integrated peak areas generate the right-panel points."},{"q":"The x-axis of the processed ITC binding isotherm is the molar ratio of:","options":["Heat to time","Sample to reference volume","Ligand to protein","Protein to buffer"],"answer":2,"explanation":"Integrated injection heats are plotted against the ligand-to-protein molar ratio."},{"q":"Which relationship between association and dissociation constants is shown?","options":["Ka = -Kd","Ka = Kd","Ka = 1/Kd","Ka = Kd squared"],"answer":2,"explanation":"Association and dissociation constants are reciprocals: Ka equals 1 divided by Kd."}]}},{"page":390,"lecture":"Techniques in Biochemistry and Biophysics","slideInLecture":8,"title":"ITC c-Value and Dilution Control","explain":"A useful ITC binding curve must have enough sigmoid shape to estimate binding parameters accurately. The c-value, c = n[P]Ka, controls this shape through stoichiometry, protein concentration, and association strength. Heat from ligand dilution must be measured separately and subtracted.","mustKnow":["A sigmoidal isotherm is needed for accurate binding-affinity analysis.","The c-value is given as n times protein concentration times Ka.","Ligand dilution itself can release or absorb heat.","A ligand-into-buffer control is subtracted from the binding experiment."],"terms":[{"term":"c-value","meaning":"The ITC parameter n[P]Ka that influences binding-isotherm sigmoidicity."},{"term":"Sigmoidicity","meaning":"The degree to which a curve has an S shape."},{"term":"Dilution control","meaning":"Ligand titrated into buffer to measure nonbinding heat effects."}],"diagramGuide":["The family of curves shows that very low or very high c values give poorly informative shapes; an intermediate sigmoidal curve is preferred.","c combines stoichiometry, protein concentration, and association constant: c = n[P]Ka.","Ligand-into-buffer controls measure dilution heat for subtraction."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"If protein concentration is doubled while n and Ka remain constant, what happens to c?","options":["It becomes zero","It is unchanged","It doubles","It halves"],"answer":2,"explanation":"Because c = n[P]Ka, c is directly proportional to protein concentration."},{"q":"Which expression defines the ITC c-value?","options":["c = n[P]Ka","c = [L]/[P]","c = Ka/Kd","c = delta H/T"],"answer":0,"explanation":"The slide defines c as stoichiometry times protein concentration times association constant."},{"q":"How should ligand dilution heat be corrected during ITC analysis?","options":["Subtract a ligand-into-buffer control","Ignore all late injections","Multiply all peaks by c","Add a protein-into-protein control"],"answer":0,"explanation":"Ligand is titrated into buffer separately, and that dilution signal is subtracted from the binding experiment."}]}},{"page":391,"lecture":"Techniques in Biochemistry and Biophysics","slideInLecture":9,"title":"MDM2 and MDMX Control p53","explain":"The diagram shows MDM2 and MDMX as negative regulators of the tumor suppressor p53. MDM2 binds p53, promotes its ubiquitination, nuclear export, and proteasomal degradation, reducing p53-driven tumor-suppressor gene activity.","mustKnow":["MDM2 and MDMX negatively regulate p53.","MDM2 can promote p53 ubiquitination.","Ubiquitinated p53 can be degraded by the proteasome.","Reducing p53 lowers expression of p53 target genes."],"terms":[{"term":"p53","meaning":"A tumor-suppressor transcription factor activated by cellular stress and DNA damage."},{"term":"MDM2","meaning":"A negative regulator that binds p53 and promotes its ubiquitination and degradation."},{"term":"Ubiquitination","meaning":"Attachment of ubiquitin that can mark a protein for degradation."},{"term":"Proteasome","meaning":"A cellular complex that degrades selected proteins."}],"diagramGuide":["Nuclear p53 activates tumor-suppressor target genes.","MDMX mainly blocks p53 transcriptional activity; MDM2 blocks activity and promotes export, ubiquitination, and degradation.","The top route ends at the proteasome after ubiquitin addition."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which intervention would most directly increase nuclear p53 abundance according to the diagram?","options":["Increasing MDMX binding to p53","Blocking MDM2-mediated ubiquitination","Increasing MDM2 nuclear export activity","Enhancing proteasomal recognition of p53"],"answer":1,"explanation":"Preventing MDM2-dependent ubiquitination interrupts the route to export and proteasomal degradation."},{"q":"Ubiquitinated p53 is directed to which degradation machinery?","options":["Spliceosome","Centrosome","Proteasome","Ribosome"],"answer":2,"explanation":"MDM2-mediated ubiquitination directs p53 to proteasomal degradation."},{"q":"Which regulator mainly blocks p53 transcriptional activity without being shown as the principal driver of its degradation?","options":["BAX","MDMX","MDM2","p21"],"answer":1,"explanation":"MDMX primarily inhibits p53 transcriptional activity, whereas MDM2 additionally promotes export and degradation."}]}},{"page":392,"lecture":"Techniques in Biochemistry and Biophysics","slideInLecture":10,"title":"Bcl-2 Family Regulation of Apoptosis","explain":"The Bcl-2 protein family controls the mitochondrial decision to undergo apoptosis. Pro-apoptotic and anti-apoptotic family members interact at the mitochondrial membrane; their balance determines whether mitochondrial permeabilization and downstream caspase activation occur.","mustKnow":["Bcl-2 family proteins regulate the mitochondrial apoptosis pathway.","The family contains both pro-apoptotic and anti-apoptotic members.","Their interactions control mitochondrial membrane permeabilization.","Mitochondrial permeabilization promotes downstream caspase activation."],"terms":[{"term":"Bcl-2 family","meaning":"A group of proteins that promote or block mitochondrial apoptosis."},{"term":"Apoptosis","meaning":"A regulated program of cell death."},{"term":"Mitochondrial permeabilization","meaning":"Formation of openings that allow apoptotic factors to leave mitochondria."},{"term":"Caspase","meaning":"A protease that executes or regulates apoptosis."}],"diagramGuide":["Left pathway: apoptotic stimulus -> pro-apoptotic proteins -> BAX/BAK oligomerization -> cytochrome c release -> apoptosome -> caspases -> apoptosis.","Right pathway: BCL-2 overexpression restrains BAX/BAK, blocks cytochrome c release, and favors survival.","The key decision point is mitochondrial outer-membrane permeabilization."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which event is prevented by BCL-2 overexpression in the right-hand pathway?","options":["BAX/BAK-driven cytochrome c release","Expression of all BCL-2-family proteins","Formation of mitochondria","Synthesis of procaspases"],"answer":0,"explanation":"Anti-apoptotic BCL-2 prevents BAX/BAK activation and mitochondrial cytochrome c release."},{"q":"Which proteins oligomerize to promote mitochondrial outer-membrane permeabilization?","options":["BAX and BAK","MDM2 and MDMX","PD-1 and PD-L1","CFP and YFP"],"answer":0,"explanation":"Pro-apoptotic BAX and BAK oligomerize at the mitochondrial membrane."},{"q":"Mitochondrial cytochrome c release promotes formation of the:","options":["Proteasome","Replisome","Inflammasome only","Apoptosome"],"answer":3,"explanation":"Cytochrome c supports apoptosome assembly, leading to caspase activation."}]}},{"page":393,"lecture":"Techniques in Biochemistry and Biophysics","slideInLecture":11,"title":"Förster Resonance Energy Transfer","explain":"FRET transfers excitation energy from a donor fluorophore to a nearby acceptor without photon emission between them. Efficient transfer requires overlap between donor emission and acceptor absorption spectra and a very short distance. Efficiency follows E = 1/[1 + (r/R0)^6], so it falls steeply as distance increases.","mustKnow":["FRET requires a donor and an acceptor fluorophore.","Donor emission must overlap acceptor absorption.","FRET is strongly distance dependent and usually occurs within about 10 nm.","R0 is the distance at which transfer efficiency is 50%."],"terms":[{"term":"FRET","meaning":"Distance-dependent nonradiative energy transfer from a donor to an acceptor fluorophore."},{"term":"Donor","meaning":"The fluorophore that supplies excitation energy."},{"term":"Acceptor","meaning":"The nearby fluorophore that receives energy from the donor."},{"term":"Förster radius","meaning":"R0, the donor-acceptor distance giving 50% transfer efficiency."}],"diagramGuide":["The spectral plot requires donor emission to overlap acceptor absorption; the yellow overlap region visualizes this condition.","The energy-level scheme depicts nonradiative resonance transfer from excited donor to acceptor.","The equation shows sixth-power distance dependence; at r = R0, efficiency is 50%."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"If donor-acceptor distance changes from R0 to 2R0, which efficiency is closest?","options":["25%","50%","About 98.5%","About 1.5%"],"answer":3,"explanation":"E = 1/(1 + 2^6) = 1/65, approximately 1.5%."},{"q":"At donor-acceptor distance r = R0, FRET efficiency is:","options":["50%","100%","0%","25%"],"answer":0,"explanation":"R0 is defined as the Förster radius at which transfer efficiency is 50%."},{"q":"Efficient FRET requires overlap between donor emission and acceptor:","options":["Melting curve","Absorption","Emission only","Mass spectrum"],"answer":1,"explanation":"Energy transfer requires spectral overlap between donor emission and acceptor absorption."}]}},{"page":394,"lecture":"Techniques in Biochemistry and Biophysics","slideInLecture":12,"title":"Cameleon FRET Sensor for Calcium","explain":"Cameleon is a genetically encoded calcium sensor containing calmodulin and the M13 calmodulin-binding segment between CFP and YFP. Without Ca2+, the fluorophores remain arranged for weak FRET and cyan emission. Ca2+ makes calmodulin bind M13, bringing CFP and YFP into a FRET-active arrangement and producing yellow emission.","mustKnow":["Cameleon monitors Ca2+ concentration in living cells.","It contains calmodulin, M13, CFP, and YFP.","Without Ca2+, the signal is mainly cyan.","With Ca2+, calmodulin binds M13, FRET increases, and the signal becomes yellow."],"terms":[{"term":"Cameleon","meaning":"A FRET-based genetically encoded sensor for cellular Ca2+."},{"term":"Calmodulin","meaning":"A Ca2+-binding protein that changes conformation when calcium binds."},{"term":"M13","meaning":"A calmodulin-binding peptide module used in the sensor."},{"term":"CFP/YFP","meaning":"Cyan and yellow fluorescent proteins serving as the FRET donor and acceptor."}],"diagramGuide":["Top cartoon: excitation of CFP gives no FRET when proteins A and B are apart, but YFP emission when interaction brings them together.","Bottom: Cameleon places CaM and M13 between CFP and YFP.","Without Ca2+ the output is cyan; Ca2+-dependent CaM-M13 binding increases FRET and yellow emission."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which signal change reports an increase in intracellular Ca2+ for Cameleon?","options":["Increased CFP with no YFP emission","A shift from yellow to cyan","Increased YFP relative to CFP emission","Loss of both CFP and YFP fluorescence"],"answer":2,"explanation":"Ca2+ promotes CaM-M13 association, increasing CFP-to-YFP FRET and yellow output."},{"q":"Which four components form the Cameleon calcium sensor?","options":["CaM, M13, CFP, and YFP","BAX, BAK, CFP, and YFP","PD-1, PD-L1, CFP, and YFP","HIF-alpha, VHL, CFP, and YFP"],"answer":0,"explanation":"Cameleon places calmodulin and its M13-binding segment between CFP and YFP."},{"q":"In Cameleon, calcium binding causes calmodulin to interact with:","options":["VHL","MDM2","GPX4","M13"],"answer":3,"explanation":"Ca2+-bound calmodulin binds M13, bringing CFP and YFP into a FRET-active arrangement."}]}}];
const KEY="sbl-slide-companion-v3";
const stored=JSON.parse(localStorage.getItem(KEY)||"{}");
let current=Math.min(stored.current||0,SLIDES.length-1);
let unlocked=Math.max(stored.unlocked||0,current);
let completed=new Set(stored.completed||[]);
let questionProgress=stored.questionProgress||{};
let studyOverride=false;
let timer=1500,timerHandle=null;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(3,"0");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify({current,unlocked,completed:[...completed],questionProgress}));
function complete(){
  completed.add(current);
  if(current===unlocked&&unlocked<SLIDES.length-1)unlocked++;
  save();renderGate();
}
function renderGate(){
  const ok=completed.has(current);
  $("next").disabled=!ok || current===SLIDES.length-1;
  $("gate").textContent=ok?(current===SLIDES.length-1?"Course complete":"Slide cleared"):"Answer this slide to continue";
  $("gate").className=ok?"done":"locked";
  $("bar").style.width=`${completed.size/SLIDES.length*100}%`;
}
function renderInteraction(s){
  const box=$("interaction"),x=s.interaction;
  if(x.type==="tap"){
    box.innerHTML=`<button id="tapDone" class="tap">${esc(x.label)}</button>`;
    $("tapDone").onclick=()=>{complete();$("tapDone").textContent="Cleared ✓";$("tapDone").disabled=true};
    if(completed.has(current)){$("tapDone").textContent="Cleared ✓";$("tapDone").disabled=true}
    return;
  }
  if(completed.has(current)&&!studyOverride){showQuestion(s,true);return}
  box.innerHTML=`<p><strong>${completed.has(current)?"Review the slide and notes.":"Study the slide and notes first."}</strong> When ready, the slide and explanation will be hidden.</p><button id="testMe" class="tap primary">${completed.has(current)?"Test again without clues":"Test me without clues"}</button>`;
  $("testMe").onclick=()=>showQuestion(s,false);
}
function showQuestion(s,reviewed){
  const x=s.interaction,box=$("interaction");
  const questions=x.type==="mcq-set"?x.questions:[x];
  let qi=Math.min(questionProgress[current]||0,questions.length-1);
  const q=questions[qi];
  document.body.classList.add("testing");
  box.innerHTML=`${questions.length>1?`<div class="meta">Question ${qi+1} of ${questions.length}</div>`:""}<div class="question">${esc(q.q)}</div><div class="choices">${q.options.map((o,i)=>`<button class="choice" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div><div id="feedback" class="feedback" hidden></div><div id="questionActions"></div><button id="reviewSlide" class="navbtn" style="margin-top:12px">Review slide and explanation</button>`;
  $("reviewSlide").onclick=()=>{studyOverride=true;document.body.classList.remove("testing");render()};
  const buttons=[...box.querySelectorAll(".choice")];
  buttons.forEach(b=>b.onclick=()=>{
    const pick=+b.dataset.i;
    buttons.forEach((c,i)=>{c.disabled=true;if(i===q.answer)c.classList.add("correct")});
    if(pick!==q.answer)b.classList.add("wrong");
    $("feedback").hidden=false;
    $("feedback").innerHTML=`<strong>${pick===q.answer?"Correct.":"Correct answer: "+String.fromCharCode(65+q.answer)+"."}</strong> ${esc(q.explanation)}`;
    if(qi<questions.length-1){
      $("questionActions").innerHTML=`<button id="nextQuestion" class="tap primary" style="margin-top:12px">Next question</button>`;
      $("nextQuestion").onclick=()=>{questionProgress[current]=qi+1;save();showQuestion(s,false)};
    }else{
      questionProgress[current]=questions.length;
      complete();
    }
  });
  if(reviewed){
    buttons.forEach((c,i)=>{c.disabled=true;if(i===q.answer)c.classList.add("correct")});
    $("feedback").hidden=false;$("feedback").textContent=q.explanation;
  }
}
function render(){
  const s=SLIDES[current];
  document.body.classList.remove("testing");
  $("lecture").textContent=`${s.lecture} · lecture slide ${s.slideInLecture}`;
  $("counter").textContent=`Slide ${s.page} / ${SLIDES.length}`;
  $("slideImage").src=`slides/slide-${pad(s.page)}.jpg`;
  $("slideImage").alt=`Slide ${s.page}: ${s.title}`;
  $("title").textContent=s.title;
  $("explain").textContent=s.explain;
  $("mustKnow").innerHTML=s.mustKnow.map(x=>`<li>${esc(x)}</li>`).join("");
  $("knowSection").hidden=!s.mustKnow.length;
  $("diagramGuide").innerHTML=(s.diagramGuide||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  $("diagramSection").hidden=!(s.diagramGuide||[]).length;
  $("terms").innerHTML=s.terms.map(x=>`<dt>${esc(x.term)}</dt><dd>${esc(x.meaning)}</dd>`).join("");
  $("termsSection").hidden=!s.terms.length;
  $("back").disabled=current===0;
  renderInteraction(s);renderGate();
}
$("back").onclick=()=>{if(current>0){current--;studyOverride=false;save();render()}};
$("next").onclick=()=>{if(completed.has(current)&&current<SLIDES.length-1){current++;studyOverride=false;save();render()}};
function tick(){timer--;if(timer<=0){clearInterval(timerHandle);timerHandle=null;timer=1500;alert("25 minutes done. Take five minutes away from the screen.");$("timerButton").textContent="Start timer"}$("timer").textContent=`${String(Math.floor(timer/60)).padStart(2,"0")}:${String(timer%60).padStart(2,"0")}`}
$("timerButton").onclick=()=>{if(timerHandle){clearInterval(timerHandle);timerHandle=null;$("timerButton").textContent="Resume timer"}else{timerHandle=setInterval(tick,1000);$("timerButton").textContent="Pause timer"}};
render();
</script>
</body>
</html>
