ctivated receptor moves to the nucleus, binds target DNA, and changes transcription, leading to synthesis of specific proteins.","mustKnow":["Cortisol can cross the plasma membrane.","Its receptor is intracellular.","The hormone-receptor complex regulates gene transcription.","This response requires new protein synthesis."],"terms":[{"term":"Glucocorticoid receptor","meaning":"An intracellular receptor activated by glucocorticoid hormones such as cortisol."},{"term":"Transcription","meaning":"Production of RNA from a DNA template."},{"term":"Nuclear receptor","meaning":"An intracellular receptor that directly regulates gene expression."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"After cortisol binds the glucocorticoid receptor, which event occurs before target-protein synthesis?","options":["Receptor translocation to the nucleus and transcriptional activation","Opening of a ligand-gated sodium channel","Flagellar rotation","Extracellular ATP polymerization"],"answer":0,"explanation":"The activated receptor enters the nucleus and regulates transcription before translation produces protein."},{"q":"How does cortisol first enter its target cell in the depicted pathway?","options":["Through a ligand-gated ion channel","By receptor-mediated endocytosis","Through a gap junction","By diffusion through the lipid bilayer"],"answer":3,"explanation":"As a steroid hormone, cortisol diffuses across the plasma membrane's lipid bilayer."},{"q":"What is the direct nuclear effect of the activated glucocorticoid receptor?","options":["It binds target DNA and activates transcription","It hydrolyzes extracellular ATP","It opens a plasma-membrane ion channel","It degrades newly formed mRNA"],"answer":0,"explanation":"After nuclear translocation, the hormone-receptor complex regulates target DNA transcription."}]},"diagramGuide":["Follow the numbered route: cortisol outside cell → diffusion through membrane → receptor binding in cytoplasm → receptor conformational change and nuclear entry → DNA binding/transcription → mRNA → protein synthesis."]},{"page":189,"lecture":"Cellular Signaling","slideInLecture":13,"title":"Major Membrane Receptor Classes","explain":"The lecture lists three major cell-surface receptor types: G protein-coupled receptors, receptor tyrosine kinases, and ion channels. All detect extracellular information but use different mechanisms to transmit it across the membrane.","mustKnow":["GPCRs activate G proteins.","Receptor tyrosine kinases use regulated phosphorylation.","Ligand-gated ion channels control ion flow."],"terms":[{"term":"GPCR","meaning":"A seven-pass membrane receptor that activates a G protein."},{"term":"Receptor tyrosine kinase","meaning":"A receptor whose cytosolic kinase activity phosphorylates tyrosines."},{"term":"Ion channel receptor","meaning":"A receptor that changes ion flow across the membrane."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which receptor class has intrinsic or associated tyrosine-phosphorylation activity?","options":["GPCR","Receptor tyrosine kinase","Ligand-gated ion channel","Nuclear steroid receptor"],"answer":1,"explanation":"Receptor tyrosine kinases transmit signals through regulated tyrosine phosphorylation."},{"q":"Which membrane-receptor class directly controls ion movement across the membrane?","options":["GPCRs","Ligand-gated ion channels","Receptor tyrosine kinases","Nuclear receptors"],"answer":1,"explanation":"Ion-channel receptors regulate ion flow through the plasma membrane."}]},"diagramGuide":[]},{"page":190,"lecture":"Cellular Signaling","slideInLecture":14,"title":"GPCR Examples and Outputs","explain":"GPCRs mediate many physiological responses. The table links signals such as epinephrine, serotonin, light, odorants, fMet peptides, and acetylcholine to specific GPCRs, effectors, and outcomes.","mustKnow":["One receptor family can control many different physiological processes.","GPCR specificity comes from the receptor, G protein, effector, and cell context.","Rhodopsin is the light-detecting GPCR example."],"terms":[{"term":"Rhodopsin","meaning":"A light-sensitive GPCR involved in visual excitation."},{"term":"Effector","meaning":"A downstream enzyme or channel directly regulated by an activated G protein."}],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which stimulus-receptor pairing is shown in the GPCR table?","options":["Light—rhodopsin","Insulin—glucocorticoid receptor","Cortisol—nicotinic receptor","PDGF—GABA receptor"],"answer":0,"explanation":"The table pairs light with rhodopsin for visual excitation."},{"q":"Which GPCR-table pathway links epinephrine to glycogen breakdown?","options":["Rhodopsin to phospholipase C","Muscarinic receptor to cGMP phosphodiesterase","Beta-adrenergic receptor to adenylyl cyclase","Chemotactic receptor to potassium channel"],"answer":2,"explanation":"The epinephrine row pairs the beta-adrenergic receptor with adenylyl cyclase and glycogen breakdown."},{"q":"Which stimulus uses a muscarinic receptor and a potassium-channel effector in the table?","options":["Serotonin","Light","fMet peptide","Acetylcholine"],"answer":3,"explanation":"The acetylcholine row lists a muscarinic receptor, potassium channel, and slowing of pacemaker activity."}]},"diagramGuide":["Read each table row as stimulus → GPCR → effector → physiological response. Examples include light → rhodopsin → cGMP phosphodiesterase → visual excitation."]},{"page":191,"lecture":"Cellular Signaling","slideInLecture":15,"title":"GPCRs Activate Trimeric G Proteins","explain":"GPCRs contain seven membrane-spanning helices. Ligand binding changes receptor shape, allowing it to activate a heterotrimeric G protein, which can then regulate an effector such as adenylyl cyclase. Figure focus: Trace the diagram left to right: extracellular ligand -> seven-pass receptor -> alpha-beta-gamma G protein -> membrane effector.","mustKnow":["GPCRs have seven transmembrane helices.","They interact with a trimeric G protein.","Adenylyl cyclase is a common downstream effector."],"terms":[{"term":"Heterotrimeric G protein","meaning":"A GTP-binding signaling protein made of alpha, beta, and gamma subunits."},{"term":"Adenylyl cyclase","meaning":"A membrane enzyme that produces cAMP from ATP."},{"term":"Ligand","meaning":"A molecule that binds specifically to a receptor."}],"diagramGuide":["Trace the diagram left to right: extracellular ligand -> seven-pass receptor -> alpha-beta-gamma G protein -> membrane effector.","The nucleotide label is on G-alpha; GDP/GTP exchange changes the state of G-alpha, not the receptor."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which component directly exchanges GDP for GTP after ligand-bound GPCR activation?","options":["G-beta","Adenylyl cyclase","Arrestin","G-alpha"],"answer":3,"explanation":"The nucleotide-binding alpha subunit is activated by GDP release and GTP binding."},{"q":"How many membrane-spanning helices characterize the GPCR family shown?","options":["Four","Seven","Nine","Twelve"],"answer":1,"explanation":"The slide identifies GPCRs as receptors containing seven transmembrane helices."}]}},{"page":192,"lecture":"Cellular Signaling","slideInLecture":16,"title":"Three-Dimensional GPCR Structure","explain":"The structural model shows a GPCR as a compact bundle of seven alpha helices crossing the membrane. A ligand approaching the receptor can stabilize a new conformation that is transmitted to the intracellular G-protein-binding side. Figure focus: Count the seven colored alpha-helices forming the compact receptor bundle.","mustKnow":["The seven helices form one receptor bundle.","Ligand binding changes receptor conformation.","The conformational change connects outside binding to inside signaling."],"terms":[{"term":"Conformational change","meaning":"A change in a protein's three-dimensional shape."},{"term":"Transmembrane helix","meaning":"An alpha helix that passes through the lipid bilayer."}],"diagramGuide":["Count the seven colored alpha-helices forming the compact receptor bundle.","The small space-filling ligand approaches the extracellular face; signaling is transmitted to the opposite, cytoplasmic face."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A mutation that prevents movement of the cytoplasmic ends of the seven helices would most directly impair binding to which partner?","options":["Heterotrimeric G protein","Extracellular ligand","Membrane cholesterol","Nuclear CREB"],"answer":0,"explanation":"The intracellular face of an activated GPCR couples to the heterotrimeric G protein."}]}},{"page":193,"lecture":"Cellular Signaling","slideInLecture":17,"title":"GPCR Activation, Amplification, and Attenuation","explain":"The diagram follows activation from ligand-bound receptor to G protein and effector. One active receptor can activate multiple G proteins, creating amplification; receptor phosphorylation and arrestin binding then stop further activation. Figure focus: Follow numbered panels rather than reading by rows: receptor activation precedes G-protein separation and effector activation.","mustKnow":["A single active receptor can activate multiple G proteins.","This one-to-many step amplifies the signal.","Phosphorylation plus arrestin produces attenuation."],"terms":[{"term":"Signal attenuation","meaning":"Reduction or termination of signaling strength."},{"term":"Arrestin","meaning":"A protein that binds an active phosphorylated GPCR and blocks further G-protein activation."},{"term":"GRK","meaning":"A GPCR kinase that phosphorylates an active receptor."}],"diagramGuide":["Follow numbered panels rather than reading by rows: receptor activation precedes G-protein separation and effector activation.","Green box marks amplification; the upper red box marks GTP-hydrolysis shutoff; the lower red box marks GRK/arrestin attenuation."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which event belongs to receptor attenuation rather than G-alpha's intrinsic shutoff?","options":["Conversion of ATP to cAMP","Arrestin binding to a GRK-phosphorylated receptor","Hydrolysis of GTP by G-alpha","Reassociation of G-alpha with beta-gamma"],"answer":1,"explanation":"GRK phosphorylation followed by arrestin binding desensitizes the receptor."},{"q":"What produces the amplification step highlighted in the GPCR diagram?","options":["One receptor activates multiple G proteins","One arrestin activates multiple receptors","One G protein creates multiple receptors","One ligand phosphorylates multiple GRKs"],"answer":0,"explanation":"An active ligand-bound receptor can successively activate multiple G proteins."},{"q":"Which event directly ends signaling by an individual G-alpha subunit?","options":["Receptor phosphorylation","Ligand binding","GTP hydrolysis","cAMP diffusion"],"answer":2,"explanation":"G-alpha's GTPase activity hydrolyzes bound GTP to GDP, returning the subunit to its inactive state."}]}},{"page":194,"lecture":"Cellular Signaling","slideInLecture":18,"title":"The GPCR-G Protein Cycle","explain":"Ligand-bound GPCR promotes GDP release and GTP binding on G alpha. G alpha-GTP activates an effector such as adenylyl cyclase, which produces cAMP; G alpha then hydrolyzes GTP, reassociates with beta-gamma, and signaling stops. GRK and arrestin further desensitize the receptor. Figure focus: Map each written step to the adjacent cycle on slide 193.","mustKnow":["GDP-to-GTP exchange activates G alpha.","Adenylyl cyclase produces cAMP.","GTP hydrolysis deactivates G alpha.","GRK phosphorylation and arrestin block the receptor."],"terms":[{"term":"G alpha","meaning":"The nucleotide-binding G-protein subunit that regulates an effector."},{"term":"GTPase activity","meaning":"Hydrolysis of bound GTP to GDP, switching G alpha off."},{"term":"Desensitization","meaning":"Reduced receptor signaling despite continued ligand presence."}],"diagramGuide":["Map each written step to the adjacent cycle on slide 193.","Separate three shutoff events: G-alpha hydrolyzes GTP, subunits reassociate, and GRK/arrestin desensitizes the receptor."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What is the correct order immediately after ligand binding?","options":["cAMP production -> receptor binding -> GTP loading","Arrestin binding -> GRK removal -> G-alpha activation","GDP release -> GTP binding -> G-alpha-effector interaction","GTP hydrolysis -> GDP release -> arrestin removal"],"answer":2,"explanation":"Ligand-bound receptor first promotes nucleotide exchange, then active G-alpha regulates the effector."},{"q":"Which enzyme is activated by G-alpha in the pathway described on the slide?","options":["Protein phosphatase 1","Adenylyl cyclase","Glycogen synthase","Caspase-9"],"answer":1,"explanation":"Activated G-alpha binds and activates adenylyl cyclase in the illustrated pathway."},{"q":"What happens after G-alpha hydrolyzes its bound GTP?","options":["It binds arrestin","It phosphorylates the receptor","It reassociates with beta-gamma","It converts cAMP to ATP"],"answer":2,"explanation":"GDP-bound G-alpha reassociates with beta-gamma, reforming the inactive trimeric G protein."}]}},{"page":195,"lecture":"Cellular Signaling","slideInLecture":19,"title":"AMP Compared with Cyclic AMP","explain":"Both molecules contain adenine, ribose, and phosphate. In cAMP, the phosphate forms a cyclic linkage on the ribose; this ring structure distinguishes the second messenger from ordinary AMP. Figure focus: Compare the phosphate connections, not the shared adenine and ribose.","mustKnow":["cAMP is cyclic adenosine monophosphate.","Its phosphate forms a cyclic bond with ribose.","cAMP acts as an intracellular second messenger."],"terms":[{"term":"cAMP","meaning":"Cyclic adenosine monophosphate, an intracellular second messenger."},{"term":"AMP","meaning":"Adenosine monophosphate, a nucleotide with adenine, ribose, and one phosphate."}],"diagramGuide":["Compare the phosphate connections, not the shared adenine and ribose.","AMP has a non-cyclic phosphate; cAMP has a phosphate bridge linking two ribose oxygens."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which atoms are joined by the phosphate to create the cyclic feature of cAMP?","options":["Two adenine bases","Ribose and a protein","Two separate AMP molecules","Two positions on the ribose"],"answer":3,"explanation":"The phosphate forms an intramolecular cyclic linkage on one ribose."}]}},{"page":196,"lecture":"Cellular Signaling","slideInLecture":20,"title":"cAMP as an Amplifying Second Messenger","explain":"A first messenger such as serotonin binds a surface receptor, and the cell produces cAMP inside. cAMP diffuses to intracellular targets and can regulate several activities, allowing one extracellular stimulus to create a broad coordinated response. Figure focus: Read the color key: blue is low cAMP, yellow intermediate, red high.","mustKnow":["The ligand is the first messenger.","cAMP is an intracellular second messenger.","Second messengers amplify and distribute the signal."],"terms":[{"term":"First messenger","meaning":"The extracellular ligand that binds a receptor."},{"term":"Second messenger","meaning":"A small intracellular molecule generated or released after receptor activation."},{"term":"Aplysia","meaning":"The sea hare whose neuron is shown in the cAMP imaging example."}],"diagramGuide":["Read the color key: blue is low cAMP, yellow intermediate, red high.","Compare the same Aplysia neuron before 5-HT, at 19 seconds, at 100 seconds, and at 10 minutes to see a transient response."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which time point in the image shows the strongest widespread cAMP signal?","options":["About 100 seconds after 5-HT","Before 5-HT","About 10 minutes after 5-HT","All four are equal"],"answer":0,"explanation":"Red/yellow signal is maximal around the 100-second image and declines by 10 minutes."},{"q":"In the Aplysia images, which color represents the highest intracellular cAMP concentration?","options":["Blue","Green","Yellow","Red"],"answer":3,"explanation":"The slide's color scale identifies blue as low, yellow as intermediate, and red as high cAMP."},{"q":"In this signaling example, serotonin is classified as which messenger?","options":["First messenger","Second messenger","Protein kinase","Transcription factor"],"answer":0,"explanation":"Serotonin binds the extracellular receptor and is therefore the first messenger; cAMP is the second messenger."}]}},{"page":197,"lecture":"Cellular Signaling","slideInLecture":21,"title":"cAMP Cascade in a Liver Cell","explain":"Glucagon or epinephrine activates a GPCR, G protein, adenylyl cyclase, cAMP, and protein kinase A. The cascade promotes glycogen breakdown and glucose release, while another branch activates CREB to alter gene transcription. Figure focus: Trace the metabolic branch from receptor to glucose release and the nuclear branch from PKA to CREB.","mustKnow":["GPCR activation leads to cAMP and protein kinase A.","The pathway activates glycogen phosphorylase and inhibits glycogen synthase.","The metabolic output is glucose mobilization.","PKA can also activate the transcription factor CREB."],"terms":[{"term":"Protein kinase A","meaning":"A cAMP-activated kinase that phosphorylates downstream proteins."},{"term":"Glycogen phosphorylase","meaning":"An enzyme that promotes glycogen breakdown."},{"term":"CREB","meaning":"A transcription factor activated by phosphorylation in the cAMP pathway."},{"term":"Phosphodiesterase","meaning":"An enzyme that converts cAMP to AMP and helps terminate the signal."}],"diagramGuide":["Trace the metabolic branch from receptor to glucose release and the nuclear branch from PKA to CREB.","Notice opposing phosphorylation effects: phosphorylase kinase/glycogen phosphorylase are activated, whereas glycogen synthase is inhibited."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which pair is driven in opposite functional directions by PKA-dependent phosphorylation?","options":["Glucose-1-phosphate and glucose-6-phosphate","Glycogen phosphorylase and glycogen synthase","CREB and phosphorylase kinase","Adenylyl cyclase and cAMP"],"answer":1,"explanation":"The cascade promotes glycogen breakdown while inhibiting glycogen synthesis."},{"q":"Which kinase is directly activated by cAMP in the illustrated liver-cell cascade?","options":["Protein kinase A","Protein kinase C","Cyclin-dependent kinase 1","Receptor tyrosine kinase"],"answer":0,"explanation":"cAMP activates protein kinase A in the glucagon/epinephrine cascade."},{"q":"What is the immediate metabolic purpose of activating glycogen phosphorylase in this pathway?","options":["Glycogen synthesis","Glycogen breakdown","Fatty-acid synthesis","DNA replication"],"answer":1,"explanation":"Glycogen phosphorylase promotes glycogen breakdown, helping mobilize glucose."}]}},{"page":198,"lecture":"Cellular Signaling","slideInLecture":22,"title":"GPCR Signal Attenuation","explain":"GRKs phosphorylate an active GPCR, creating a high-affinity site for arrestin. Arrestin and G proteins compete for the same cytoplasmic receptor cavity, so arrestin binding prevents additional G-protein activation and can promote receptor internalization. Figure focus: Follow the receptor between surface, coated pit, vesicle, and recycling routes.","mustKnow":["GRKs phosphorylate active GPCRs.","Arrestin selectively binds the active phosphorylated receptor.","Arrestin blocks G-protein coupling.","Attenuation prevents unlimited signaling."],"terms":[{"term":"Receptor internalization","meaning":"Removal of a receptor from the cell surface into an intracellular vesicle."},{"term":"Competition","meaning":"Mutually exclusive binding of G protein or arrestin to the same receptor region."}],"diagramGuide":["Follow the receptor between surface, coated pit, vesicle, and recycling routes.","GRK phosphorylation enables arrestin binding; arrestin both blocks G-protein access and supports internalization."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which modification creates the receptor state preferentially recognized by arrestin?","options":["cAMP binding to the receptor","Dephosphorylation by a phosphatase","GRK-mediated phosphorylation of an active GPCR","GTP loading of G-alpha"],"answer":2,"explanation":"Arrestin preferentially binds the active receptor after GRK phosphorylation."},{"q":"Why are G proteins and arrestins mutually exclusive at an activated GPCR?","options":["They hydrolyze one another","They bind the same cytoplasmic receptor cavity","They require different ligands","They occupy opposite membrane leaflets"],"answer":1,"explanation":"Both engage the same inter-helical cavity on the receptor's cytoplasmic side, so binding of one prevents binding of the other."},{"q":"Which receptor-modifying enzyme acts before arrestin binds?","options":["GRK","Adenylyl cyclase","PKA","Phosphodiesterase"],"answer":0,"explanation":"A GPCR kinase, or GRK, first phosphorylates the active receptor."}]}},{"page":199,"lecture":"Cell Death and Cell Division","slideInLecture":1,"title":"Cell Survival and Cell Death","explain":"This slide opens the next lecture, which examines how cells remain alive or activate controlled death programs. The immediate transition is from signaling pathways to apoptosis. Figure focus: This is a section divider; use the background apoptotic-cell imagery only as context.","mustKnow":["Cell survival and cell death are regulated biological outcomes.","Apoptosis is the first cell-death mode introduced."],"terms":[{"term":"Cell survival","meaning":"Maintenance of cellular functions and resistance to death signals."},{"term":"Cell death","meaning":"Loss of cell viability through regulated or damaging processes."}],"diagramGuide":["This is a section divider; use the background apoptotic-cell imagery only as context.","The examinable transition is from receptor signaling to regulated survival/death decisions."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which topic immediately follows cellular signaling in the compiled material?","options":["Genetic engineering","Biological motors","Host-pathogen interaction","Cell survival and cell death"],"answer":3,"explanation":"Page 199 opens the cell survival and cell death lecture."}]}},{"page":200,"lecture":"Cell Death and Cell Division","slideInLecture":2,"title":"Apoptosis","explain":"The tissue image marks cells with the condensed, rounded appearance associated with apoptosis. Apoptosis is a regulated form of cell death in which a cell dismantles itself in an orderly way. Figure focus: Arrows indicate isolated cells with dark, compact nuclei and reduced cell volume relative to neighbors.","mustKnow":["Apoptosis is regulated cell death.","Apoptotic cells show condensation and fragmentation.","Apoptosis removes individual cells in an organized manner."],"terms":[{"term":"Apoptosis","meaning":"A programmed, tightly regulated process of cell self-destruction."},{"term":"Cell condensation","meaning":"Shrinkage and compacting of an apoptotic cell and its contents."}],"diagramGuide":["Arrows indicate isolated cells with dark, compact nuclei and reduced cell volume relative to neighbors.","Do not identify apoptosis from stain color alone; use condensation, shrinkage, and isolation together."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which microscopic feature most strongly supports an apoptotic interpretation of the arrowed cells?","options":["Small intensely condensed nuclei","Uniform enlargement of every cell","Loss of all nuclear staining","Formation of a metaphase plate"],"answer":0,"explanation":"Apoptotic cells commonly become shrunken with condensed nuclear material."}]}},{"page":201,"lecture":"Cell Death and Cell Division","slideInLecture":3,"title":"Core Features of Apoptosis","explain":"Apoptosis is a controlled cell-death program. The cell and nucleus shrink, the dying cell loses contact with neighboring cells, and the plasma membrane forms surface blebs. Figure focus: Read images A-D as a time sequence ending in fragmentation.","mustKnow":["Apoptosis is programmed and orderly.","Cell shrinkage and nuclear shrinkage are characteristic.","Loss of adhesion and membrane blebbing occur."],"terms":[{"term":"Apoptosis","meaning":"An organized program that causes a cell to die."},{"term":"Blebbing","meaning":"Formation of rounded bulges on the plasma membrane."}],"diagramGuide":["Read images A-D as a time sequence ending in fragmentation.","The SEM pair emphasizes loss of a smooth outline and formation of membrane blebs."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which combination is most characteristic of early apoptosis?","options":["Cell fusion, migration, and secretion","Cell shrinkage, loss of adhesion, and membrane blebbing","Cell swelling, membrane rupture, and inflammation","DNA replication, spindle assembly, and cytokinesis"],"answer":1,"explanation":"The slide's images and list emphasize shrinkage, detachment, and blebbing."},{"q":"What happens to the overall volume of a cell and its nucleus during apoptosis?","options":["Both increase","The cell increases while the nucleus shrinks","Both shrink","Neither changes"],"answer":2,"explanation":"Shrinkage of both the cell and nucleus is listed as a characteristic feature of apoptosis."},{"q":"Which cell-surface change is characteristic of apoptosis on this slide?","options":["Flagellum formation","Membrane blebbing","Cell-wall synthesis","Tight-junction expansion"],"answer":1,"explanation":"Apoptotic cells lose adhesion and form blebs at the cell surface."}]}},{"page":202,"lecture":"Cell Death and Cell Division","slideInLecture":4,"title":"Final Events in Apoptosis","explain":"As apoptosis proceeds, chromatin is cut into small fragments. The cell corpse is then rapidly engulfed by phagocytosis, limiting the release of intracellular material. Figure focus: The electron micrograph shows an apoptotic cell breaking into discrete membrane-bound fragments.","mustKnow":["Chromatin becomes fragmented.","The apoptotic corpse is rapidly removed by phagocytosis."],"terms":[{"term":"Chromatin fragmentation","meaning":"Breakdown of nuclear DNA-protein material into smaller pieces."},{"term":"Phagocytosis","meaning":"Engulfment and removal of particles or cells by another cell."}],"diagramGuide":["The electron micrograph shows an apoptotic cell breaking into discrete membrane-bound fragments.","Dark compact nuclear material represents chromatin condensation/fragmentation."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"The small pieces surrounding the dying cell are best identified as what?","options":["Secretory vesicles","Bacterial endospores","Membrane-bound apoptotic bodies","Replicated chromosomes"],"answer":2,"explanation":"Late apoptosis packages cellular material into membrane-bound fragments for clearance."}]}},{"page":203,"lecture":"Cell Death and Cell Division","slideInLecture":5,"title":"Morphological Sequence of Apoptosis","explain":"The diagram shows a normal cell progressing through chromatin condensation, membrane blebbing, nuclear collapse, and formation of membrane-bound apoptotic bodies. Figure focus: Follow arrows clockwise: normal cell -> chromatin condensation -> membrane blebbing/nuclear collapse -> apoptotic bodies.","mustKnow":["Chromatin condensation occurs early.","Membrane blebbing precedes apoptotic-body formation.","The dying cell breaks into apoptotic bodies."],"terms":[{"term":"Chromatin condensation","meaning":"Tight packing of chromatin in the dying nucleus."},{"term":"Apoptotic body","meaning":"A membrane-bound fragment produced by an apoptotic cell."}],"diagramGuide":["Follow arrows clockwise: normal cell -> chromatin condensation -> membrane blebbing/nuclear collapse -> apoptotic bodies.","The final particles retain membrane boundaries, distinguishing orderly packaging from lysis."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which event occurs immediately before apoptotic-body formation in the depicted sequence?","options":["DNA synthesis","Metaphase alignment","Cell-wall formation","Nuclear collapse with membrane blebbing"],"answer":3,"explanation":"The diagram places blebbing/nuclear collapse just before fragmentation into apoptotic bodies."},{"q":"Which event appears first in the illustrated apoptotic sequence?","options":["Apoptotic-body formation","Membrane blebbing","Chromatin condensation","Phagolysosome formation"],"answer":2,"explanation":"The diagram begins with chromatin condensation, followed by blebbing, nuclear collapse, and apoptotic-body formation."},{"q":"What is the final labeled morphological product of the sequence?","options":["A multinucleated cell","Apoptotic bodies","A metaphase plate","A bacterial spore"],"answer":1,"explanation":"The dying cell fragments into membrane-bound apoptotic bodies."}]}},{"page":204,"lecture":"Cell Death and Cell Division","slideInLecture":6,"title":"Clearance of Apoptotic Cells","explain":"Apoptotic bodies retain tightly packed organelles and may contain nuclear fragments, all enclosed by an intact membrane. Macrophages engulf them and degrade them in phagolysosomes, so their contents do not spill into surrounding tissue and inflammation is minimal. Figure focus: The micrograph shows a larger phagocyte contacting/engulfing a compact apoptotic body.","mustKnow":["Apoptotic bodies remain membrane enclosed.","Macrophages degrade them in phagolysosomes.","Rapid clearance limits inflammation and secondary necrosis."],"terms":[{"term":"Macrophage","meaning":"A phagocytic immune cell that engulfs cellular debris."},{"term":"Phagolysosome","meaning":"Degradative compartment formed after a phagosome combines with lysosomal machinery."},{"term":"Secondary necrosis","meaning":"Loss of membrane integrity when an apoptotic cell is not cleared promptly."}],"diagramGuide":["The micrograph shows a larger phagocyte contacting/engulfing a compact apoptotic body.","Link intact membranes and fast macrophage uptake to minimal leakage and inflammation."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Failure of rapid macrophage clearance would most directly increase the risk of what?","options":["Secondary necrosis and inflammatory leakage","Re-entry into S phase","Reassembly of the apoptotic nucleus","Conversion into a stem cell"],"answer":0,"explanation":"Uncleared apoptotic bodies can lose membrane integrity and release contents."},{"q":"Where are engulfed apoptotic bodies degraded inside macrophages?","options":["Nucleoli","Peroxisomes","Phagolysosomes","Centrosomes"],"answer":2,"explanation":"Macrophages phagocytose apoptotic bodies and degrade them within phagolysosomes."},{"q":"Which property of apoptotic bodies helps prevent inflammation?","options":["They retain an intact enclosing plasma membrane","They release ATP into surrounding tissue","They immediately lyse neighboring cells","They secrete inflammatory cytokines"],"answer":0,"explanation":"Membrane enclosure prevents cellular contents from spilling into the surrounding tissue."}]}},{"page":205,"lecture":"Cell Death and Cell Division","slideInLecture":7,"title":"Apoptosis Video Reinforcement","explain":"This slide provides a linked video intended to reinforce the visible sequence of programmed cell death. Figure focus: The embedded video frame is unavailable in the PDF; treat this as reinforcement, not a new pathway.","mustKnow":["Use the video to recognize cell shrinkage, blebbing, fragmentation, and clearance."],"terms":[{"term":"Programmed cell death","meaning":"A regulated process that dismantles and removes a cell."}],"diagramGuide":["The embedded video frame is unavailable in the PDF; treat this as reinforcement, not a new pathway.","Recall the morphology sequence from slides 201-204."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which ordered morphology sequence should the linked apoptosis video reinforce?","options":["Gastrulation -> neurulation -> organogenesis -> birth","Shrinkage -> blebbing -> fragmentation -> phagocytic clearance","Swelling -> chromosome replication -> cytokinesis -> fusion","Adhesion -> growth -> mitosis -> secretion"],"answer":1,"explanation":"This is the core visible sequence established by the surrounding apoptosis slides."}]}},{"page":206,"lecture":"Cell Death and Cell Division","slideInLecture":8,"title":"Apoptosis Animation","explain":"This linked animation is a visual review of apoptotic changes and cell removal. Figure focus: The highlighted cell is the intended focus of the animation frame.","mustKnow":["An apoptotic cell is dismantled into membrane-bound fragments rather than simply bursting."],"terms":[{"term":"Cell dismantling","meaning":"Controlled breakdown of a dying cell into removable parts."}],"diagramGuide":["The highlighted cell is the intended focus of the animation frame.","Use the surrounding epithelial sheet to judge that apoptosis removes individual cells without dissolving the whole tissue."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why can apoptosis remove one cell from an epithelial sheet with limited damage to neighbors?","options":["The apoptotic cell releases digestive enzymes extracellularly","The tissue stops expressing adhesion proteins permanently","The dying cell remains packaged into membrane-bound material","All neighboring cells undergo lysis simultaneously"],"answer":2,"explanation":"Orderly membrane-contained dismantling limits exposure of neighboring cells."}]}},{"page":207,"lecture":"Cell Death and Cell Division","slideInLecture":9,"title":"Apoptotic Cell Imaging","explain":"The microscopy image shows cells undergoing visible structural changes during apoptosis. Such imaging allows membrane and shape changes to be followed directly. Figure focus: Compare the bright rounded/blebbing cells with the flatter intact cell at left.","mustKnow":["Apoptosis can be recognized by characteristic changes in cell morphology."],"terms":[{"term":"Morphology","meaning":"The observable shape and structural appearance of a cell."}],"diagramGuide":["Compare the bright rounded/blebbing cells with the flatter intact cell at left.","The fluorescence marks cells as morphology changes; it is not itself a named molecular assay on this slide."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which observation in live-cell imaging would best distinguish apoptosis from continued proliferation?","options":["Formation of two stable spindle poles","Increase in colony size without shape change","Sustained cell spreading and attachment","Progressive rounding and bleb formation"],"answer":3,"explanation":"Rounding and blebbing are visible apoptotic morphology, unlike mitotic progression alone."}]}},{"page":208,"lecture":"Cell Death and Cell Division","slideInLecture":10,"title":"Extrinsic Apoptosis Pathway","explain":"In the receptor-mediated pathway, TNF binds TNFR1. The activated receptor recruits TRADD, FADD, and procaspase-8 into a membrane-associated complex. Procaspase-8 becomes active caspase-8, which activates executioner caspases. Figure focus: Read top to bottom: TNF/TNFR1 -> death-domain adaptors -> procaspase-8 -> initiator caspase-8 -> executioner caspases.","mustKnow":["The extrinsic pathway begins at a death receptor.","TNFR1 recruits TRADD, FADD, and procaspase-8.","Caspase-8 is the initiator caspase in this pathway.","Executioner caspases carry out cell dismantling."],"terms":[{"term":"TNFR1","meaning":"A TNF receptor that can initiate extrinsic apoptosis."},{"term":"FADD","meaning":"An adaptor that helps recruit procaspase-8."},{"term":"Caspase-8","meaning":"The initiator caspase activated in the extrinsic pathway."}],"diagramGuide":["Read top to bottom: TNF/TNFR1 -> death-domain adaptors -> procaspase-8 -> initiator caspase-8 -> executioner caspases.","TRADD and FADD are adaptors; they are not the proteases that execute cleavage."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which complex component provides protease activity first in the extrinsic pathway?","options":["Caspase-8","TRADD","FADD","TNFR1"],"answer":0,"explanation":"TRADD and FADD are adaptors; procaspase-8 becomes the initiator protease caspase-8."},{"q":"Which death receptor is named in the extrinsic apoptosis pathway?","options":["EGFR","TNFR1","GPCR","T-cell receptor"],"answer":1,"explanation":"The slide begins the pathway with TNF binding to TNFR1."},{"q":"Which pair consists of adaptor proteins recruited in the TNFR1 complex?","options":["BAX and BAK","Apaf-1 and cytochrome c","TRADD and FADD","BCL-2 and BCL-XL"],"answer":2,"explanation":"Activated TNFR1 recruits the cytoplasmic adaptors TRADD and FADD."}]}},{"page":209,"lecture":"Cell Death and Cell Division","slideInLecture":11,"title":"BCL-2 Family Controls Mitochondrial Permeability","explain":"BCL-2-family proteins form a survival-versus-death switch. Anti-apoptotic members oppose BAX and BAK, while BH3-only proteins promote their activation. Activated BAX and BAK oligomerize in the mitochondrial outer membrane and cause MOMP. Figure focus: Use the left domain diagrams to sort anti-apoptotic, multidomain pro-apoptotic, and BH3-only groups.","mustKnow":["BCL-2, BCL-XL, MCL-1, BCL-w, and A1 are anti-apoptotic.","BAX, BAK, and BOK are pro-apoptotic.","BH3-only proteins include BID, BIM, NOXA, and BAD.","BAX/BAK oligomerization causes MOMP."],"terms":[{"term":"MOMP","meaning":"Mitochondrial outer-membrane permeabilization."},{"term":"BAX/BAK","meaning":"Pro-apoptotic proteins that form membrane-permeabilizing oligomers."},{"term":"BH3-only proteins","meaning":"Upstream apoptosis inducers that activate or release pro-apoptotic BCL-2-family activity."},{"term":"BCL-2","meaning":"An anti-apoptotic protein that opposes mitochondrial permeabilization."}],"diagramGuide":["Use the left domain diagrams to sort anti-apoptotic, multidomain pro-apoptotic, and BH3-only groups.","In the right network, BCL-2 inhibits BAX/BAK while BH3-only proteins either activate BAX/BAK or neutralize BCL-2; MOMP releases cytochrome c."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which set contains only BH3-only pro-apoptotic regulators?","options":["TRADD, FADD, Apaf-1, E2F","BID, BIM, NOXA, BAD","BAX, BAK, BOK, BCL-2","BCL-XL, MCL-1, BCL-w, A1"],"answer":1,"explanation":"The slide lists BID, BIM, NOXA, and BAD among BH3-only apoptosis inducers."},{"q":"Which set contains only anti-apoptotic BCL-2 family members listed on the slide?","options":["BCL-2, BCL-XL, MCL-1","BAX, BAK, BOK","BID, BIM, BAD","BAX, BCL-2, NOXA"],"answer":0,"explanation":"BCL-2, BCL-XL, and MCL-1 are all listed as anti-apoptotic proteins."},{"q":"What cellular event is caused by BAX and BAK oligomerization?","options":["Nuclear-envelope assembly","Mitochondrial outer-membrane permeabilization","DNA replication","GPCR desensitization"],"answer":1,"explanation":"BAX and BAK form pores that permeabilize the mitochondrial outer membrane, producing MOMP."}]}},{"page":210,"lecture":"Cell Death and Cell Division","slideInLecture":12,"title":"Intrinsic Apoptosis Pathway","explain":"Cellular stress activates pro-apoptotic BCL-2-family proteins such as BAX. Mitochondria release cytochrome c, which combines with Apaf-1 and procaspase-9. Activated caspase-9 then activates executioner caspases. Figure focus: Read top to bottom: internal damage -> Bax at mitochondrion -> cytochrome-c release -> Apaf-1/procaspase-9 complex -> executioner caspases.","mustKnow":["The intrinsic pathway is mitochondria mediated.","MOMP releases cytochrome c into the cytosol.","Cytochrome c, Apaf-1, and procaspase-9 form the activation complex.","Caspase-9 activates executioner caspases."],"terms":[{"term":"Cytochrome c","meaning":"A mitochondrial protein that promotes apoptosome formation after release into the cytosol."},{"term":"Apaf-1","meaning":"A cytosolic scaffold that recruits procaspase-9."},{"term":"Caspase-9","meaning":"The initiator caspase of the intrinsic pathway."}],"diagramGuide":["Read top to bottom: internal damage -> Bax at mitochondrion -> cytochrome-c release -> Apaf-1/procaspase-9 complex -> executioner caspases.","The mitochondrion is upstream of caspase-9 in the intrinsic pathway."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which complex activates the intrinsic-pathway initiator caspase?","options":["BCL-2, BCL-XL, MCL-1, and A1","Cyclin B, CDK1, E2F, and pRb","Cytochrome c, Apaf-1, and procaspase-9","TNFR1, TRADD, FADD, and procaspase-8"],"answer":2,"explanation":"Cytochrome c released from mitochondria assembles with Apaf-1 and procaspase-9."},{"q":"From which mitochondrial compartment is cytochrome c released during intrinsic apoptosis?","options":["Matrix","Intermembrane space","Inner-membrane matrix face","Mitochondrial nucleoid"],"answer":1,"explanation":"Cytochrome c resides in the intermembrane space before MOMP releases it into the cytosol."},{"q":"Which initiator caspase is activated by the cytochrome c–Apaf-1 complex?","options":["Caspase-1","Caspase-3","Caspase-8","Caspase-9"],"answer":3,"explanation":"The intrinsic pathway recruits and activates procaspase-9."}]}},{"page":211,"lecture":"Cell Death and Cell Division","slideInLecture":13,"title":"Detecting Apoptosis with Annexin V","explain":"Healthy cells keep phosphatidylserine on the inner leaflet of the plasma membrane. During apoptosis it moves to the outer leaflet, where it acts as an eat-me signal. Annexin V binds exposed phosphatidylserine and can therefore mark apoptotic cells. Figure focus: Compare leaflet position of phosphatidylserine in normal versus apoptotic membrane cartoons.","mustKnow":["Phosphatidylserine is normally on the cytoplasmic leaflet.","Apoptosis exposes phosphatidylserine on the cell surface.","Annexin V detects exposed phosphatidylserine."],"terms":[{"term":"Annexin V","meaning":"A phospholipid-binding protein used to detect exposed phosphatidylserine."},{"term":"Phosphatidylserine","meaning":"A membrane phospholipid that becomes an external eat-me signal during apoptosis."},{"term":"Eat-me signal","meaning":"A surface cue that promotes phagocytic clearance."}],"diagramGuide":["Compare leaflet position of phosphatidylserine in normal versus apoptotic membrane cartoons.","Annexin V binds only after PS becomes exposed on the extracellular leaflet."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"An Annexin-V-positive cell most directly indicates which membrane change?","options":["Cytochrome c retention in mitochondria","Loss of all membrane phospholipids","DNA doubling during S phase","Phosphatidylserine exposure on the outer leaflet"],"answer":3,"explanation":"Annexin V recognizes phosphatidylserine after its apoptotic externalization."},{"q":"Where is phosphatidylserine normally located in a healthy cell?","options":["Outer leaflet of the plasma membrane","Cytoplasmic leaflet of the plasma membrane","Mitochondrial matrix","Nuclear pore"],"answer":1,"explanation":"In healthy cells, phosphatidylserine is maintained on the cytoplasmic, inner leaflet."},{"q":"What biological signal does exposed phosphatidylserine provide to macrophages?","options":["A proliferate signal","An eat-me signal","A secrete-cAMP signal","A DNA-repair signal"],"answer":1,"explanation":"Externalized phosphatidylserine marks the apoptotic cell for engulfment."}]}},{"page":212,"lecture":"Cell Death and Cell Division","slideInLecture":14,"title":"Detecting Cytochrome c Release","explain":"BAX/BAK pores compromise the mitochondrial outer membrane and release cytochrome c. In healthy cells, cytochrome c staining is confined to mitochondria; after apoptosis induction, its staining becomes diffuse throughout the cytosol. Figure focus: Untreated cells show punctate/reticular green mitochondrial cytochrome c; treated cells show diffuse green cytosolic signal.","mustKnow":["BAX/BAK pores release cytochrome c.","Diffuse cytochrome c staining indicates mitochondrial release.","Staurosporine is used here to induce apoptosis."],"terms":[{"term":"Staurosporine","meaning":"A compound commonly used experimentally to induce apoptosis."},{"term":"Diffuse localization","meaning":"A spread-out staining pattern consistent with release from mitochondria."}],"diagramGuide":["Untreated cells show punctate/reticular green mitochondrial cytochrome c; treated cells show diffuse green cytosolic signal.","Blue nuclei are a positional reference, not the apoptosis readout."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which fluorescence pattern indicates mitochondrial outer-membrane permeabilization?","options":["Diffuse cytosolic cytochrome-c staining","Punctate mitochondrial cytochrome-c staining","Blue nuclear staining alone","Absence of any green signal in all cells"],"answer":0,"explanation":"Cytochrome c changes from mitochondrial puncta to a diffuse distribution after release."},{"q":"Which treatment is used on the slide to induce apoptosis?","options":["Serotonin","Staurosporine","Activin","Propidium iodide"],"answer":1,"explanation":"The treated cells were exposed to staurosporine to induce apoptosis."},{"q":"In untreated cells, cytochrome c fluorescence is expected to appear in which pattern?","options":["Diffuse throughout the cytosol","Punctate and mitochondrial","Restricted to the nucleus","Absent from the cell"],"answer":1,"explanation":"Before mitochondrial permeabilization, cytochrome c remains localized to mitochondria and appears punctate."}]}},{"page":213,"lecture":"Cell Death and Cell Division","slideInLecture":15,"title":"Apoptosis Detection Video","explain":"This linked video reinforces experimental detection of apoptotic cells. Figure focus: The embedded video is reinforcement for apoptotic morphology.","mustKnow":["Annexin V detects external phosphatidylserine, while diffuse cytochrome c indicates mitochondrial release."],"terms":[{"term":"Apoptosis marker","meaning":"A measurable change used to identify cells undergoing apoptosis."}],"diagramGuide":["The embedded video is reinforcement for apoptotic morphology.","Use shrinkage, blebbing, fragmentation, and loss of attachment as the observable criteria."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which feature would be least consistent with apoptosis in the linked microscopy?","options":["Cellular fragmentation","Immediate rupture with widespread cellular swelling","Loss of attachment","Membrane blebbing"],"answer":1,"explanation":"Swelling and abrupt rupture are more typical of necrotic damage than orderly apoptosis."}]}},{"page":214,"lecture":"Cell Death and Cell Division","slideInLecture":16,"title":"Cell Cycle and Mitosis Overview","explain":"The eukaryotic cell cycle contains interphase—G1, S, and G2—and M phase. DNA and cellular components are duplicated during interphase. Mitosis separates chromosomes, and cytokinesis divides one cell into two genetically identical diploid daughter cells. Figure focus: Read the cycle clockwise G1 -> S -> G2 -> M -> cytokinesis.","mustKnow":["Interphase consists of G1, S, and G2.","DNA is replicated before mitosis.","Mitosis partitions chromosomes.","Cytokinesis physically divides the cell."],"terms":[{"term":"Mitosis","meaning":"Nuclear division that produces genetically equivalent chromosome sets."},{"term":"Cytokinesis","meaning":"Physical division of the cell into two daughters."},{"term":"Interphase","meaning":"G1, S, and G2 phases between cell divisions."}],"diagramGuide":["Read the cycle clockwise G1 -> S -> G2 -> M -> cytokinesis.","Keep chromosome partitioning (mitosis) distinct from physical cell splitting (cytokinesis)."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which event belongs to cytokinesis rather than mitosis?","options":["Separation of sister chromatids","Reformation of daughter nuclei","Physical division of the cytoplasm into two cells","Alignment of chromosomes at the spindle midplane"],"answer":2,"explanation":"Cytokinesis partitions the cell body after chromosome segregation."},{"q":"Which phases together constitute interphase?","options":["G1, S, and G2","Prophase, metaphase, and anaphase","G0, M, and cytokinesis","S, M, and telophase"],"answer":0,"explanation":"Interphase consists of G1, S, and G2."},{"q":"What structure performs the equipartition of chromosomes during mitosis?","options":["Lysosome","Mitotic spindle","Golgi apparatus","Phagolysosome"],"answer":1,"explanation":"The mitotic spindle organizes and separates chromosomes into the two daughter cells."}]}},{"page":215,"lecture":"Cell Death and Cell Division","slideInLecture":17,"title":"Purposes of Mitosis","explain":"Mitosis increases cell number during growth, replaces damaged or worn-out cells, and enables asexual reproduction in organisms such as yeast. Propidium iodide can stain DNA for analysis. Figure focus: Panel A is the phase wheel; panel B links DNA/chromosome form to phase; the histogram is DNA-content measurement after propidium iodide staining.","mustKnow":["Mitosis supports growth and development.","Mitosis replaces and repairs cells.","Mitosis can support asexual reproduction.","Propidium iodide stains DNA."],"terms":[{"term":"Propidium iodide","meaning":"A fluorescent DNA-binding stain."},{"term":"Asexual reproduction","meaning":"Production of offspring without fusion of gametes."}],"diagramGuide":["Panel A is the phase wheel; panel B links DNA/chromosome form to phase; the histogram is DNA-content measurement after propidium iodide staining.","A replicated chromosome has two cohesin-linked sister chromatids but is still counted as one chromosome until separation."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A propidium-iodide histogram peak at twice the G1 DNA content is most enriched for cells in which state?","options":["G0/G1","Early G1 only","Post-cytokinesis daughters only","G2/M"],"answer":3,"explanation":"Cells have doubled DNA after S phase and retain it through G2 until division."},{"q":"Which fluorescent stain is identified as a DNA stain on this slide?","options":["Annexin V","Propidium iodide","SYPRO Orange","Calcein"],"answer":1,"explanation":"The slide explicitly states that propidium iodide is used to stain DNA."},{"q":"Which listed purpose of mitosis is especially important in skin and gut lining?","options":["Nitrogen fixation","Cell replacement and repair","Antibody recombination","Gametogenesis only"],"answer":1,"explanation":"Mitosis replaces damaged, worn-out, or dead cells in rapidly renewed tissues such as skin and gut lining."}]}},{"page":216,"lecture":"Cell Death and Cell Division","slideInLecture":18,"title":"Interphase and G0","explain":"Interphase occupies most of the cell cycle. G1 supports growth and organelle production, S phase replicates nuclear DNA, and G2 prepares proteins and energy for division. Cells that stop cycling can enter the quiescent G0 state. Figure focus: Use the circular diagram to place DNA replication in S and chromosome segregation in M.","mustKnow":["G1: growth and organelle duplication.","S: DNA replication and sister-chromatid formation.","G2: final preparation for division.","G0: temporary or permanent cell-cycle exit."],"terms":[{"term":"G0","meaning":"A non-dividing, quiescent state outside the active cycle."},{"term":"S phase","meaning":"The phase in which nuclear DNA is replicated."},{"term":"Sister chromatids","meaning":"The two replicated copies of one chromosome."}],"diagramGuide":["Use the circular diagram to place DNA replication in S and chromosome segregation in M.","G0 branches from the proliferative cycle rather than forming part of G1-S-G2-M progression."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which phase produces sister chromatids?","options":["S phase","G1 phase","G0 phase","Cytokinesis"],"answer":0,"explanation":"Nuclear DNA replication during S phase duplicates each chromosome."},{"q":"Approximately what fraction of the cell cycle is spent in interphase according to the slide?","options":["10%","25%","50%","90%"],"answer":3,"explanation":"The slide labels interphase as approximately 90% of the cell cycle."},{"q":"Which phase is described as a quiescent state outside active cycling?","options":["G0","G1","S","G2"],"answer":0,"explanation":"Cells that temporarily or permanently stop dividing enter G0."}]}},{"page":217,"lecture":"Cell Death and Cell Division","slideInLecture":19,"title":"DNA State Across G1, S, and G2","explain":"In G1, each chromosome contains one linear double-stranded DNA molecule. S phase replicates it. In G2, each chromosome has two sister chromatids held together by cohesins. Figure focus: The text contrasts one unreplicated chromosome in G1 with two cohesin-linked sister chromatids after S.","mustKnow":["A G1 chromosome has one DNA double helix.","S phase duplicates the chromosome.","G2 sister chromatids are held together by cohesins."],"terms":[{"term":"Cohesin","meaning":"A protein complex that holds replicated sister chromatids together."},{"term":"Decondensed chromosome","meaning":"A less compact chromosome state typical of interphase."}],"diagramGuide":["The text contrasts one unreplicated chromosome in G1 with two cohesin-linked sister chromatids after S.","The dark video rectangle adds no independent label; the testable feature is DNA state across G1, S, and G2."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What physically holds newly replicated sister chromatids together in G2?","options":["BCL-2 pores","Cohesin complexes","Arrestin proteins","Annexin V"],"answer":1,"explanation":"The slide identifies cohesins as the linkage between sister chromatids."},{"q":"What is the DNA state of each decondensed chromosome in G1?","options":["Two sister chromatids","One linear double-stranded DNA molecule","Four homologous chromosomes","One single-stranded RNA molecule"],"answer":1,"explanation":"Before S phase, each G1 chromosome consists of one linear double-stranded DNA molecule."},{"q":"During which phase are sister chromatids generated?","options":["G1","S","G2","M"],"answer":1,"explanation":"Chromosome replication in S phase creates sister chromatids."}]}},{"page":218,"lecture":"Cell Death and Cell Division","slideInLecture":20,"title":"Chromosome Movement During Mitosis","explain":"Mitosis depends on interactions between spindle microtubules and chromosome kinetochores. Chromosomes condense in prophase, spindle microtubules attach in prometaphase, chromosomes align at the midplane in metaphase, and sister chromatids move to opposite poles in anaphase. Figure focus: In the right diagram, homologous chromosomes replicate independently; mitosis separates sister chromatids, not homologous pairs.","mustKnow":["Kinetochores connect chromosomes to spindle microtubules.","Metaphase chromosomes align at the spindle midplane.","Anaphase separates sister chromatids toward opposite poles."],"terms":[{"term":"Kinetochore","meaning":"A chromosome protein structure that binds spindle microtubules."},{"term":"Mitotic spindle","meaning":"The microtubule-based apparatus that separates chromosomes."},{"term":"Prometaphase","meaning":"Stage when spindle microtubules gain access to and attach to chromosomes."}],"diagramGuide":["In the right diagram, homologous chromosomes replicate independently; mitosis separates sister chromatids, not homologous pairs.","In the microscopy sequence, chromosomes condense, attach to spindle, align at the midplane, then move to opposite poles."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"During ordinary mitosis, which structures separate from one another?","options":["Germ layers","G-alpha and beta-gamma permanently","Sister chromatids","Homologous chromosome pairs"],"answer":2,"explanation":"Mitosis partitions replicated sister chromatids into daughter cells."},{"q":"At which mitotic stage do spindle microtubules gain access to chromosomes and attach to kinetochores?","options":["Prophase","Prometaphase","Metaphase","Telophase"],"answer":1,"explanation":"The slide describes kinetochore attachment after nuclear-envelope breakdown in prometaphase."},{"q":"At which stage are chromosomes aligned at the spindle midplane?","options":["Prometaphase","Metaphase","Anaphase","Telophase"],"answer":1,"explanation":"Chromosome alignment at the spindle midplane defines metaphase."}]}},{"page":219,"lecture":"Cell Death and Cell Division","slideInLecture":21,"title":"Mitosis Video Reinforcement","explain":"This linked video reviews chromosome condensation, alignment, separation, and formation of daughter cells. Figure focus: Cyan fibers are spindle microtubules; yellow structures are chromosomes/DNA.","mustKnow":["The mitotic sequence is prophase, prometaphase, metaphase, anaphase, and telophase, followed by cytokinesis."],"terms":[{"term":"Mitotic sequence","meaning":"The ordered stages that partition duplicated chromosomes."}],"diagramGuide":["Cyan fibers are spindle microtubules; yellow structures are chromosomes/DNA.","Identify stage from chromosome position relative to spindle poles, not from cell shape alone."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In the fluorescence image, the cyan structures radiating from poles are what?","options":["Condensed chromatin","Plasma membranes","Apoptotic bodies","Spindle microtubules"],"answer":3,"explanation":"The cyan arrays form the mitotic spindle around the yellow chromosomes."}]}},{"page":220,"lecture":"Cell Death and Cell Division","slideInLecture":22,"title":"Prophase","explain":"During prophase, chromosomes condense and become visible as paired sister chromatids. Compaction reduces chromosome length and increases thickness, while transcription largely shuts down. Centrosomes move apart and the mitotic spindle forms; nuclear-envelope breakdown follows at the end of this transition. Figure focus: Compare diffuse interphase chromatin in the top micrograph with thick individualized prophase chromosomes below.","mustKnow":["Chromosomes condense in prophase.","Each replicated chromosome contains two sister chromatids.","Transcription is reduced as chromatin compacts.","The mitotic spindle begins to form."],"terms":[{"term":"Chromosome condensation","meaning":"Compaction that makes chromosomes shorter, thicker, and visibly distinct."},{"term":"Centrosome","meaning":"A microtubule-organizing structure that helps form spindle poles."}],"diagramGuide":["Compare diffuse interphase chromatin in the top micrograph with thick individualized prophase chromosomes below.","The nuclear envelope breaks down late in prophase/prometaphase while centrosomes organize the spindle."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which event is associated with chromosome condensation during prophase?","options":["Displacement of transcription factors and reduced transcription","Activation of DNA replication origins","Externalization of phosphatidylserine","Formation of the blastocoel"],"answer":0,"explanation":"Condensation reduces DNA accessibility and transcriptional activity."},{"q":"Why does transcription decrease as chromosomes compact in prophase?","options":["RNA is converted into DNA","Transcription factors become displaced","Ribosomes enter the nucleus","Kinetochores degrade promoters"],"answer":1,"explanation":"The slide states that transcription shuts down partly because compaction displaces transcription factors."},{"q":"Toward where do the centrioles move as the mitotic spindle forms?","options":["The nuclear center","Opposite poles of the cell","The metaphase plate together","The nucleolus"],"answer":1,"explanation":"The centrioles move toward opposite cell poles while spindle microtubules extend between them."}]}},{"page":221,"lecture":"Cell Death and Cell Division","slideInLecture":23,"title":"Metaphase and Kinetochore Attachment","explain":"At metaphase, chromosomes align at the cell equator. Spindle microtubules connect to kinetochores assembled on each chromatid. Kinetochore-associated motors, including dynein, contribute to chromosome movement on the spindle. Figure focus: The micrograph shows chromosomes concentrated at one equatorial plate between opposite spindle poles.","mustKnow":["Metaphase chromosomes align at the equator.","Microtubules attach through kinetochores.","Dynein can help move chromosomes along spindle microtubules."],"terms":[{"term":"Metaphase plate","meaning":"The equatorial plane where chromosomes align."},{"term":"Dynein","meaning":"A microtubule motor involved in chromosome movement."}],"diagramGuide":["The micrograph shows chromosomes concentrated at one equatorial plate between opposite spindle poles.","Spindle microtubules attach through kinetochores assembled at sister chromatids."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What is the direct chromosome attachment site for spindle microtubules?","options":["Cleavage furrow","Kinetochore","Centrosome","Nucleolus"],"answer":1,"explanation":"Kinetochores are protein assemblies on centromeric chromatin that bind spindle microtubules."},{"q":"Approximately how many different polypeptides are stated to assemble into the human kinetochore?","options":["About 10","About 25","About 100","About 1,000"],"answer":2,"explanation":"The slide states that approximately 100 different polypeptides assemble into kinetochore protein complexes."},{"q":"Which motor protein is named as helping carry chromosomes along spindle microtubules?","options":["Kinesin-1","Dynein","Myosin II","Actin"],"answer":1,"explanation":"Dynein is named as a kinetochore-associated motor that moves chromosomes on the spindle."}]}},{"page":222,"lecture":"Cell Death and Cell Division","slideInLecture":24,"title":"Spindle Attachment Video","explain":"This linked video reinforces how spindle microtubules attach to kinetochores and position chromosomes. Figure focus: The frame is labeled metaphase; chromosome alignment at the equator is the diagnostic feature.","mustKnow":["Kinetochore attachment connects chromosome movement to the mitotic spindle."],"terms":[{"term":"Spindle attachment","meaning":"Binding of spindle microtubules to chromosome kinetochores."}],"diagramGuide":["The frame is labeled metaphase; chromosome alignment at the equator is the diagnostic feature.","Do not confuse metaphase alignment with anaphase poleward separation."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which chromosome arrangement identifies the stage shown?","options":["Diffuse chromatin in an intact nucleus","Random chromosomes after nuclear reformation","Alignment at the cell equator","Two groups at opposite poles"],"answer":2,"explanation":"A metaphase plate at the equator is diagnostic of metaphase."}]}},{"page":223,"lecture":"Cell Death and Cell Division","slideInLecture":25,"title":"Anaphase, Telophase, and Cytokinesis","explain":"In anaphase, sister chromatids separate and move to opposite poles. During telophase, a nuclear membrane forms around each chromosome set. Cytokinesis then pinches the cell into two daughter cells. Figure focus: Top micrograph: sister chromatids move toward opposite poles in anaphase. Bottom: chromosome sets are at poles and nuclei reform in telophase.","mustKnow":["Anaphase separates sister chromatids.","Telophase rebuilds daughter nuclei.","Cytokinesis divides the cytoplasm."],"terms":[{"term":"Anaphase","meaning":"Mitotic stage in which sister chromatids move apart."},{"term":"Telophase","meaning":"Stage in which chromosome sets are enclosed in new nuclei."},{"term":"Cytokinesis","meaning":"Division of one cell into two daughter cells."}],"diagramGuide":["Top micrograph: sister chromatids move toward opposite poles in anaphase. Bottom: chromosome sets are at poles and nuclei reform in telophase.","The cleavage furrow/cell pinching belongs to cytokinesis, which overlaps late telophase."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which event distinguishes telophase from anaphase?","options":["Initial separation of sister chromatids","Attachment of kinetochores to spindle fibers","DNA replication","Reformation of nuclear membranes around chromosome sets"],"answer":3,"explanation":"Nuclear envelopes re-form in telophase after chromosomes reach the poles."},{"q":"During which stage are sister chromatids pulled toward opposite poles?","options":["Prophase","Metaphase","Anaphase","Telophase"],"answer":2,"explanation":"Separation and poleward movement of sister chromatids occur in anaphase."},{"q":"What is the name of the process that physically pinches one cell into two daughter cells?","options":["Condensation","Cytokinesis","Replication","Gastrulation"],"answer":1,"explanation":"Cytokinesis divides the cytoplasm and completes physical cell separation."}]}},{"page":224,"lecture":"Cell Death and Cell Division","slideInLecture":26,"title":"Mitosis Completion Video","explain":"This linked video reviews the final mitotic stages and physical separation of daughter cells. Figure focus: The frame is labeled prophase and shows condensed material within one cell.","mustKnow":["Nuclear re-formation occurs in telophase, while cell separation occurs by cytokinesis."],"terms":[{"term":"Daughter cell","meaning":"One of the two cells produced by division of a parent cell."}],"diagramGuide":["The frame is labeled prophase and shows condensed material within one cell.","At this stage chromosomes are becoming visible but have not formed a metaphase plate."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which stage should follow the prophase frame before anaphase begins?","options":["Metaphase","G1","Cytokinesis","G0"],"answer":0,"explanation":"Chromosomes next attach and align during prometaphase/metaphase before separating."}]}},{"page":225,"lecture":"Cell Death and Cell Division","slideInLecture":27,"title":"Discovery of a Cytoplasmic Cell-Cycle Factor","explain":"Cytoplasm from a Xenopus oocyte undergoing meiosis was injected into an immature oocyte. The recipient underwent premature germinal-vesicle breakdown and entered meiosis, showing that a transferable cytoplasmic factor can drive maturation. Figure focus: The donor oocyte is at germinal-vesicle-breakdown stage; cytoplasm is extracted and injected into an immature oocyte.","mustKnow":["The experiment transferred cytoplasm between Xenopus oocytes.","Injected cytoplasm triggered premature meiotic entry.","A soluble cytoplasmic factor controls maturation."],"terms":[{"term":"Germinal-vesicle breakdown","meaning":"Breakdown of the oocyte nucleus as meiosis resumes."},{"term":"Maturation-promoting factor","meaning":"Cytoplasmic activity that drives entry into M phase."},{"term":"Xenopus","meaning":"A frog genus widely used in cell-cycle experiments."}],"diagramGuide":["The donor oocyte is at germinal-vesicle-breakdown stage; cytoplasm is extracted and injected into an immature oocyte.","Premature germinal-vesicle breakdown in the recipient proves a transferable cytoplasmic maturation-promoting activity."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What conclusion follows when cytoplasm from a maturing Xenopus oocyte triggers germinal-vesicle breakdown in an immature oocyte?","options":["Membrane phosphatidylserine has externalized","A transferable cytoplasmic factor promotes meiotic maturation","The donor nucleus contains a unique chromosome","The recipient has undergone fertilization"],"answer":1,"explanation":"The activity is carried in transferred cytoplasm, demonstrating a cytoplasmic maturation-promoting factor."},{"q":"Which material was transferred from a maturing Xenopus oocyte into an immature oocyte?","options":["Purified DNA","Cytoplasm","Plasma membrane","Isolated chromosomes"],"answer":1,"explanation":"Cytoplasm from a maturing oocyte was injected into an immature recipient."},{"q":"What response in the recipient oocyte indicated induced maturation?","options":["Apoptotic-body formation","Germinal-vesicle breakdown","Phosphatidylserine exposure","Blastocoel formation"],"answer":1,"explanation":"The injected recipient underwent germinal-vesicle breakdown and prematurely entered meiosis."}]}},{"page":226,"lecture":"Cell Death and Cell Division","slideInLecture":28,"title":"Cyclin-CDK Activity Across the Cell Cycle","explain":"Different cyclin-CDK complexes dominate at different transitions. Cyclin E–CDK2 promotes the G1-to-S transition, Cyclin A with CDK1/CDK2 acts through S and G2, and Cyclin B–CDK1 drives M phase. Figure focus: Left ring maps checkpoints to G1-S, G2-M, and metaphase-anaphase transitions.","mustKnow":["Cyclin E–CDK2 peaks around G1/S.","Cyclin A–CDK activity spans S and G2.","Cyclin B–CDK1 controls entry into M phase."],"terms":[{"term":"Cyclin","meaning":"A regulatory protein whose level changes during the cell cycle."},{"term":"CDK","meaning":"A cyclin-dependent kinase that phosphorylates cell-cycle targets."},{"term":"G1/S transition","meaning":"Commitment point for entering DNA synthesis."}],"diagramGuide":["Left ring maps checkpoints to G1-S, G2-M, and metaphase-anaphase transitions.","Right graph shows sequential cyclin-CDK waves: Cyclin E-CDK2, Cyclin A-CDK1/CDK2, then Cyclin B-CDK1."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which cyclin-CDK complex peaks latest in the diagram?","options":["Cyclin A-CDK2","Cyclin A-CDK1/CDK2 before G2","Cyclin B-CDK1","Cyclin E-CDK2"],"answer":2,"explanation":"Cyclin B-CDK1 rises in G2 and peaks in M phase."},{"q":"Which cyclin-CDK complex is most associated with the G1/S transition in the diagram?","options":["Cyclin E–CDK2","Cyclin A–CDK1","Cyclin B–CDK1","Cyclin D–CDK1"],"answer":0,"explanation":"Cyclin E–CDK2 activity peaks around the G1/S transition."},{"q":"Which cyclin is shown rising through S and G2 before declining in mitosis?","options":["Cyclin E","Cyclin A","Cyclin B only after cytokinesis","Cyclin D only in G0"],"answer":1,"explanation":"The plotted Cyclin A activity spans S phase and G2."}]}},{"page":227,"lecture":"Cell Death and Cell Division","slideInLecture":29,"title":"RB1 Controls the G1-to-S Checkpoint","explain":"Active, hypophosphorylated pRb binds and inhibits E2F transcription factors, preventing premature S-phase entry. Loss of both RB1 copies removes this control, allowing uncontrolled proliferation and predisposing to retinoblastoma and other cancers. Figure focus: Read the causal chain: hypophosphorylated pRb binds E2F -> S-phase genes stay off; loss of both RB1 copies -> E2F control is lost -> proliferation.","mustKnow":["Active pRb blocks E2F.","pRb controls the G1-to-S checkpoint.","Loss of both RB1 copies removes cell-cycle restraint.","RB1 loss is linked to retinoblastoma."],"terms":[{"term":"RB1","meaning":"A tumor-suppressor gene encoding the pRb cell-cycle regulator."},{"term":"E2F","meaning":"A family of transcription factors that promotes S-phase gene expression."},{"term":"Hypophosphorylated pRb","meaning":"The active form of pRb that binds and inhibits E2F."}],"diagramGuide":["Read the causal chain: hypophosphorylated pRb binds E2F -> S-phase genes stay off; loss of both RB1 copies -> E2F control is lost -> proliferation.","The named primary tumor is retinal; osteosarcoma and soft-tissue sarcoma are additional risks."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why does hypophosphorylated pRb suppress G1-to-S progression?","options":["It activates caspase-8","It degrades cyclin B directly","It externalizes phosphatidylserine","It binds and inhibits E2F transcription factors"],"answer":3,"explanation":"Active pRb restrains E2F-dependent transcription needed for S phase."},{"q":"In which phosphorylation state is pRb active as an E2F inhibitor?","options":["Hyperphosphorylated","Hypophosphorylated","Ubiquitinated","Acetylated only"],"answer":1,"explanation":"Hypophosphorylated pRb binds and inactivates E2F transcription factors."},{"q":"Loss of RB1 function also increases risk of which malignancy named on the slide?","options":["Osteosarcoma","Glioblastoma","Melanoma","Leukemia"],"answer":0,"explanation":"The slide specifically names osteosarcoma and soft-tissue sarcomas as additional risks."}]}},{"page":228,"lecture":"Cell Death and Cell Division","slideInLecture":30,"title":"Apoptosis Reference","explain":"The slide points to Gerald Karp's Cell and Molecular Biology as the reference for deeper coverage of apoptosis. Figure focus: This is a bibliography slide with no new pathway diagram.","mustKnow":["Use the reference only when a slide concept needs clarification; the examinable framework remains the apoptosis sequence and pathways presented here."],"terms":[{"term":"Reference textbook","meaning":"A source for expanded explanation beyond the lecture slide."}],"diagramGuide":["This is a bibliography slide with no new pathway diagram.","Retain the cited author/textbook only if your exam tests references."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which author is cited for detailed apoptosis reading?","options":["Gerald Karp","John Gurdon","Shinya Yamanaka","Till McCulloch"],"answer":0,"explanation":"The reference slide cites Cell and Molecular Biology by Gerald Karp."}]}},{"page":229,"lecture":"Stem Cells and Differentiation","slideInLecture":1,"title":"Stem Cells, Differentiation, and Apoptosis","explain":"This title slide introduces the lecture's three connected themes: cells that self-renew, acquisition of specialized cell identity, and regulated cell removal. Figure focus: This is the title slide for stem cells, differentiation, and apoptosis.","mustKnow":["The lecture links stem-cell potency, differentiation, and cell fate."],"terms":[{"term":"Stem cell","meaning":"An unspecialized cell capable of self-renewal and differentiation."},{"term":"Differentiation","meaning":"Acquisition of a specialized cell structure and function."}],"diagramGuide":["This is the title slide for stem cells, differentiation, and apoptosis.","The salamander image signals regeneration but supplies no labeled mechanism."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which three themes are named in the lecture title?","options":["DNA replication, transcription, and translation","Stem cells, differentiation, and apoptosis","Immunity, infection, and vaccination","Motors, actin, and tubulin"],"answer":1,"explanation":"Those three topics appear directly in the section title."}]}},{"page":230,"lecture":"Stem Cells and Differentiation","slideInLecture":2,"title":"Hematopoietic Differentiation Tree","explain":"The diagram shows a multipotent hematopoietic stem cell branching into common myeloid and common lymphoid progenitors. These branches generate red cells, platelets, granulocytes, monocytes/macrophages, B cells, T cells, and natural killer cells. Figure focus: Start at the multipotent hematopoietic stem cell and split into common myeloid versus common lymphoid progenitors.","mustKnow":["One hematopoietic stem cell can generate multiple blood-cell types.","The first major branches are myeloid and lymphoid progenitors.","B cells, T cells, and natural killer cells arise from the lymphoid branch.","Erythrocytes, megakaryocytes, granulocytes, and monocytes arise from the myeloid branch."],"terms":[{"term":"Hematopoietic stem cell","meaning":"A multipotent stem cell that produces blood-cell lineages."},{"term":"Myeloid progenitor","meaning":"A precursor for erythroid, megakaryocyte, granulocyte, mast-cell, and monocyte lineages."},{"term":"Lymphoid progenitor","meaning":"A precursor for B, T, and natural killer cell lineages."}],"diagramGuide":["Start at the multipotent hematopoietic stem cell and split into common myeloid versus common lymphoid progenitors.","Trace terminal branches: megakaryocyte -> thrombocytes; monocyte -> macrophage; B lymphocyte -> plasma cell; lymphoid branch also yields T and NK cells."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which lineage relationship is shown correctly?","options":["B lymphocyte -> erythrocyte","Common lymphoid progenitor -> platelet","Monocyte -> macrophage","Megakaryocyte -> neutrophil"],"answer":2,"explanation":"The diagram places macrophages downstream of monocytes in the myeloid branch."},{"q":"Which progenitor gives rise to B lymphocytes, T lymphocytes, and natural killer cells in the diagram?","options":["Common myeloid progenitor","Common lymphoid progenitor","Megakaryocyte","Erythrocyte"],"answer":1,"explanation":"B, T, and natural killer cells branch from the common lymphoid progenitor."},{"q":"Which mature blood cell is produced from a megakaryocyte?","options":["Platelets","Neutrophils","Plasma cells","Macrophages"],"answer":0,"explanation":"The diagram shows thrombocytes/platelets arising from megakaryocytes."}]}},{"page":231,"lecture":"Stem Cells and Differentiation","slideInLecture":3,"title":"Development Before Birth","explain":"This linked video introduces the developmental journey from a fertilized egg to a multicellular organism. Figure focus: The video is developmental overview, not a labeled still.","mustKnow":["Development transforms one fertilized cell into many organized, specialized cell types."],"terms":[{"term":"Development","meaning":"The ordered process by which an organism grows and forms specialized tissues."}],"diagramGuide":["The video is developmental overview, not a labeled still.","Use the subsequent slides for testable stages: zygote, cleavage/blastulation, gastrulation, and differentiation."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which event converts a solid morula-like cell mass into a structure with a fluid-filled cavity?","options":["Apoptosis","Metaphase","Translation","Blastulation"],"answer":3,"explanation":"Blastulation produces the blastocyst/blastula and its cavity."}]}},{"page":232,"lecture":"Stem Cells and Differentiation","slideInLecture":4,"title":"Beating Cardiomyocytes in Culture","explain":"The linked example shows differentiated heart-muscle cells beating in a culture dish. Their contraction is a visible specialized function acquired through differentiation. Figure focus: The field shows cultured cardiomyocytes; beating demonstrates acquisition of a specialized muscle-cell function.","mustKnow":["Cardiomyocytes are differentiated cells specialized for contraction.","A specialized phenotype can be observed in cultured cells."],"terms":[{"term":"Cardiomyocyte","meaning":"A heart-muscle cell specialized for contraction."},{"term":"Culture","meaning":"Growth and maintenance of cells under controlled laboratory conditions."}],"diagramGuide":["The field shows cultured cardiomyocytes; beating demonstrates acquisition of a specialized muscle-cell function.","Functional contraction is stronger differentiation evidence than cell shape alone."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Spontaneous beating in cultured cells is functional evidence of differentiation into what cell type?","options":["Cardiomyocytes","Hepatocytes","Macrophages","Retinal pigment cells"],"answer":0,"explanation":"Contractile beating is a specialized function of heart muscle cells."}]}},{"page":233,"lecture":"Stem Cells and Differentiation","slideInLecture":5,"title":"What Is Differentiation?","explain":"Differentiation converts unspecialized cells into cells with distinct structures and functions. Nerve cells conduct signals, muscle cells generate force, and red blood cells transport oxygen, yet all ultimately descend from the zygote. Figure focus: Read the vertical direction as normal development from zygote/blastocyst to organism; the reverse arrow represents experimental reprogramming.","mustKnow":["Differentiation creates specialized morphology and physiology.","Different ce
