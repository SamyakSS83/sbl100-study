ll types perform different functions.","All cell types of the organism originate from the zygote."],"terms":[{"term":"Zygote","meaning":"The single fertilized egg cell from which the organism develops."},{"term":"Cellular differentiation","meaning":"The process by which an unspecialized cell becomes specialized."}],"diagramGuide":["Read the vertical direction as normal development from zygote/blastocyst to organism; the reverse arrow represents experimental reprogramming.","Bottom branches show pluripotent cells directed toward ectoderm, mesoderm, or endoderm by different signals."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which pairing of differentiated cell and principal function is correct?","options":["Macrophage - electrical conduction","Red blood cell - oxygen transport","Neuron - force generation","Muscle cell - antibody secretion"],"answer":1,"explanation":"The slide uses oxygen transport, conduction, and contraction as specialized examples."},{"q":"Which specialized function is assigned to red blood cells on the slide?","options":["Electrical conduction","Force generation","Oxygen transport","Antibody secretion"],"answer":2,"explanation":"Red blood cells are given as the example specialized for O2 transportation."},{"q":"What is differentiation?","options":["Replacement of a cell's entire genome","Specialization of an unspecialized cell","Fusion of all embryonic cells","Permanent arrest of every stem cell"],"answer":1,"explanation":"Differentiation is the process by which unspecialized cells acquire specialized morphology and function."}]}},{"page":234,"lecture":"Stem Cells and Differentiation","slideInLecture":6,"title":"Fate, Potency, Determination, and Differentiation","explain":"Cell fate is what a cell normally becomes. Potency is the range of cell types it could become. Development progressively restricts potency. Determination commits a cell to a fate before visible specialization, and differentiation later produces the recognizable specialized phenotype. Figure focus: Treat the terms as a sequence: potency is what a cell can become; determination fixes a fate before visible change; differentiation produces the specialized phenotype.","mustKnow":["Fate means the normal developmental outcome.","Potency means the range of possible outcomes.","Determination precedes visible differentiation.","Development usually reduces potency over time."],"terms":[{"term":"Cell fate","meaning":"The cell type a cell will normally become."},{"term":"Potency","meaning":"The range of cell types a cell can potentially generate."},{"term":"Determination","meaning":"Commitment to a developmental fate before visible specialization."},{"term":"Differentiation","meaning":"Execution of a specialized cell program and phenotype."}],"diagramGuide":["Treat the terms as a sequence: potency is what a cell can become; determination fixes a fate before visible change; differentiation produces the specialized phenotype.","A determined cell may still resemble undetermined neighbors morphologically."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A cell has committed to a muscle fate but still resembles neighboring cells. Which term best describes it?","options":["Totipotent","Apoptotic","Determined","Differentiated"],"answer":2,"explanation":"Determination fixes developmental fate before the visible specialized phenotype appears."},{"q":"Which term describes the range of cell types that a cell can potentially become?","options":["Fate","Potency","Morphology","Clonality"],"answer":1,"explanation":"Developmental potential, or potency, is the range of cell types a cell can become."},{"q":"How does developmental potential generally change as development proceeds?","options":["It progressively decreases","It progressively increases","It alternates randomly","It remains identical in all cells"],"answer":0,"explanation":"Cell fates become progressively restricted, so developmental potential decreases."}]}},{"page":235,"lecture":"Stem Cells and Differentiation","slideInLecture":7,"title":"Hierarchy of Developmental Potency","explain":"Stem-cell potency narrows through a hierarchy. Totipotent cells can form all embryonic and supporting tissues needed for an organism; pluripotent cells can form the body's many tissue types but not a complete organism; multipotent and oligopotent cells are progressively more lineage restricted; unipotent cells generate one cell type. Figure focus: Order categories by decreasing breadth: totipotent -> pluripotent -> multipotent -> oligopotent -> unipotent.","mustKnow":["Totipotent has the broadest potential.","Pluripotent cells form many body cell types but not a whole organism by themselves.","Multipotent and oligopotent cells are lineage restricted.","Unipotent cells generate one cell type."],"terms":[{"term":"Totipotent","meaning":"Able to generate all embryonic and extraembryonic cell types needed for a complete organism."},{"term":"Pluripotent","meaning":"Able to generate cell types from all major body lineages but not a complete organism alone."},{"term":"Multipotent","meaning":"Able to generate several cell types within a limited lineage range."},{"term":"Unipotent","meaning":"Able to generate only one mature cell type."}],"diagramGuide":["Order categories by decreasing breadth: totipotent -> pluripotent -> multipotent -> oligopotent -> unipotent.","Use definitions rather than the slide's questionable example assigning hematopoietic stem cells to pluripotency; standard biology classifies them as multipotent."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which potency class can produce several cell types within one lineage but not all body tissues?","options":["Totipotent","Pluripotent","Unipotent","Multipotent"],"answer":3,"explanation":"Multipotent cells have a lineage-restricted but multi-cell-type output."},{"q":"Which potency class has the broadest developmental potential?","options":["Unipotent","Oligopotent","Multipotent","Totipotent"],"answer":3,"explanation":"Totipotent cells can generate all cell types required for an organism."},{"q":"Which potency class is restricted to producing one specific cell type?","options":["Pluripotent","Multipotent","Oligopotent","Unipotent"],"answer":3,"explanation":"A unipotent cell produces only its own specific cell type."}]}},{"page":236,"lecture":"Stem Cells and Differentiation","slideInLecture":8,"title":"Clonality and Clonal Expansion","explain":"A clone is a group of cells descended from one original cell. Clonal expansion occurs when that founder cell repeatedly divides, producing many genetically related descendants. Figure focus: Follow one lymphocyte clone: diversity is generated first, one antigen-matching clone is selected, and that clone expands.","mustKnow":["Clonality traces cells back to one founder.","Clonal expansion increases the number of descendants from that founder."],"terms":[{"term":"Clone","meaning":"A population of cells descended from one original cell."},{"term":"Clonal expansion","meaning":"Repeated division that enlarges a clone."}],"diagramGuide":["Follow one lymphocyte clone: diversity is generated first, one antigen-matching clone is selected, and that clone expands.","Cells labeled 2 share specificity; expansion increases number, not receptor diversity."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"After an antigen selects lymphocyte clone 2, what changes during clonal expansion?","options":["The number of clone-2 cells","The antigen specificity of each clone-2 receptor","The identity of the selecting antigen","The genome of every unrelated clone"],"answer":0,"explanation":"Expansion produces many descendants with the selected specificity."},{"q":"What does clonality mean in the lineage diagram?","options":["Cells originate from one founder cell","Cells contain different genomes","Cells cannot proliferate","Cells arise from multiple unrelated founders"],"answer":0,"explanation":"A clone is a group of descendant cells derived from one founder."},{"q":"What triggers expansion of the selected lymphocyte clone in the diagram?","options":["Antigen recognition","DNA loss","Mitochondrial rupture","Cyclin destruction"],"answer":0,"explanation":"Antigen selects the matching lymphocyte clone, which then proliferates."}]}},{"page":237,"lecture":"Stem Cells and Differentiation","slideInLecture":9,"title":"Differentiation from a Totipotent Starting Cell","explain":"The slide emphasizes that early totipotent cells begin with broad potential and generate increasingly specialized descendants through differentiation. Figure focus: The tree narrows from one high-potency state at the apex to many fixed differentiated endpoints at the base.","mustKnow":["Differentiation moves cells from broad potential toward specialized identity.","Totipotency is associated with the earliest embryonic cells."],"terms":[{"term":"Lineage restriction","meaning":"Progressive narrowing of the cell types a developing cell can produce."}],"diagramGuide":["The tree narrows from one high-potency state at the apex to many fixed differentiated endpoints at the base.","The arrows encode an inverse relation: differentiation increases downward while potency decreases."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Moving from the apex toward the base of the diagram represents what paired change?","options":["Decreasing gene expression in every lineage","Decreasing potency and increasing differentiation","Increasing potency and decreasing specialization","Increasing apoptosis and decreasing cell number only"],"answer":1,"explanation":"Development narrows potential as cells acquire specialized identities."},{"q":"In the potency pyramid, in which direction does differentiation increase?","options":["From base to apex","From apex to base","Only from left to right","It does not change"],"answer":1,"explanation":"The diagram shows broad totipotency at the apex and increasingly differentiated cell types toward the base."},{"q":"How does potency change as cells move toward differentiated cell types?","options":["It increases","It decreases","It becomes cyclic","It becomes unrelated to fate"],"answer":1,"explanation":"Developmental potency narrows as differentiation proceeds."}]}},{"page":238,"lecture":"Stem Cells and Differentiation","slideInLecture":10,"title":"Differential Gene Expression Drives Differentiation","explain":"Differentiated cells behave differently because they express different subsets of genes. Different gene-expression patterns produce different protein sets, which create different structures and functions even though cells generally contain the same genome. Figure focus: Compare heat-map color patterns between progenitor groups rather than reading every gene name.","mustKnow":["Differentiation depends on differential gene expression.","Different expressed genes produce different protein complements.","Cell identity is determined by which genes are active, not by wholesale replacement of the genome."],"terms":[{"term":"Differential gene expression","meaning":"Activation of different gene subsets in different cells."},{"term":"Proteome","meaning":"The set of proteins present in a cell under particular conditions."}],"diagramGuide":["Compare heat-map color patterns between progenitor groups rather than reading every gene name.","Different rows changing between cell types illustrate differential gene expression producing different protein sets."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What does a difference in heat-map pattern between MEP and LMPP primarily represent?","options":["Different DNA genetic codes","Different numbers of plasma membranes","Different subsets of genes being expressed","Different chromosome numbers in every cell"],"answer":2,"explanation":"Differentiation changes transcriptional programs while generally retaining the genome."},{"q":"What is the direct molecular cause of different behavior in differentiated cells according to the slide?","options":["Different subsets of genes are expressed","Each cell loses most chromosomes","All proteins are expressed equally","The genetic code changes"],"answer":0,"explanation":"Differential gene expression gives different cell types different protein complements."},{"q":"What do the contrasting colors in the two heat maps primarily represent?","options":["Different gene-expression levels","Different chromosome numbers","Different cell sizes","Different membrane potentials only"],"answer":0,"explanation":"Heat-map color differences represent relative expression levels of gene sets in the compared progenitors."}]}},{"page":239,"lecture":"Stem Cells and Differentiation","slideInLecture":11,"title":"Blastulation","explain":"Blastulation is an early developmental stage in which cleavage-stage cells organize into a blastula or blastocyst with a fluid-filled cavity. In mammals, this stage separates the inner cell mass from the outer trophoblast. Figure focus: Follow cleavage from few blastomeres to morula and then blastocyst.","mustKnow":["Blastulation follows early cleavage divisions.","It produces a hollow early embryo.","The mammalian inner cell mass gives rise to the embryo proper."],"terms":[{"term":"Blastula","meaning":"An early embryo organized around a fluid-filled cavity."},{"term":"Blastocyst","meaning":"The mammalian blastula containing an inner cell mass and outer trophoblast."},{"term":"Blastocoel","meaning":"The fluid-filled cavity of the blastula."}],"diagramGuide":["Follow cleavage from few blastomeres to morula and then blastocyst.","In the blastocyst diagram, outer trophoblast surrounds the blastocoel; the inner cell mass sits asymmetrically inside."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which structure gives rise to embryonic stem-cell cultures?","options":["Trophoblast","Blastocoel","Zona pellucida only","Inner cell mass"],"answer":3,"explanation":"Embryonic stem cells are derived from the blastocyst's inner cell mass."},{"q":"What is the fluid-filled cavity in a blastocyst called?","options":["Blastocoel","Nucleolus","Phagosome","Centromere"],"answer":0,"explanation":"The hollow cavity shown inside the blastocyst is the blastocoel."},{"q":"Which cell layer surrounds the mammalian blastocyst in the diagram?","options":["Trophoblast","Mesoderm","Neural crest","Endothelium"],"answer":0,"explanation":"The outer cell layer of the blastocyst is labeled trophoblast."}]}},{"page":240,"lecture":"Stem Cells and Differentiation","slideInLecture":12,"title":"Inner Cell Mass and Embryonic Stem Cells","explain":"The inner cell mass of the mammalian blastocyst contains cells that form the embryo proper. Embryonic stem-cell lines can be derived from these cells and retain pluripotency under suitable culture conditions. Figure focus: The XYClone laser is shown as a tool for isolating the inner cell mass.","mustKnow":["Embryonic stem cells are associated with the inner cell mass.","Inner-cell-mass cells contribute to the embryo proper.","Embryonic stem cells are pluripotent."],"terms":[{"term":"Inner cell mass","meaning":"The blastocyst cell group that gives rise to the embryo proper."},{"term":"Embryonic stem cell","meaning":"A pluripotent cell derived from the early embryo and maintained in culture."}],"diagramGuide":["The XYClone laser is shown as a tool for isolating the inner cell mass.","Embryonic stem-cell derivation uses inner-cell-mass cells, not trophoblast or blastocoel fluid."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What is the stated purpose of the XYClone laser in this context?","options":["Excision of the inner cell mass","Induction of gastrulation","Counting apoptotic bodies","Injection of bone marrow"],"answer":0,"explanation":"The slide labels the device for inner-cell-mass excision."}]}},{"page":241,"lecture":"Stem Cells and Differentiation","slideInLecture":13,"title":"Gastrulation","explain":"Gastrulation reorganizes the early embryo and establishes the primary germ layers. These layers later generate the tissues and organs of the body. Figure focus: Left diagram labels trophoblast, blastocoel, and inner cell mass before gastrulation; right sequence shows coordinated cell spreading/inward movement.","mustKnow":["Gastrulation reorganizes the blastula-stage embryo.","Gastrulation establishes ectoderm, mesoderm, and endoderm in triploblastic animals."],"terms":[{"term":"Gastrulation","meaning":"Early embryonic reorganization that establishes primary germ layers."},{"term":"Germ layer","meaning":"An early embryonic tissue layer that produces defined sets of organs."}],"diagramGuide":["Left diagram labels trophoblast, blastocoel, and inner cell mass before gastrulation; right sequence shows coordinated cell spreading/inward movement.","Gastrulation reorganizes a hollow embryo and establishes germ layers rather than simply increasing cell number."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which process transforms the blastula organization toward distinct germ layers?","options":["Clonal expansion","Gastrulation","Blastulation","Cytokinesis alone"],"answer":1,"explanation":"Gastrulation reorganizes embryonic cells and establishes germ layers."},{"q":"Which three primary germ layers are established during mammalian gastrulation?","options":["Ectoderm, mesoderm, and endoderm","Epidermis, dermis, and hypodermis","Trophoblast, blastocoel, and chorion","Myeloid, lymphoid, and erythroid"],"answer":0,"explanation":"Gastrulation establishes ectoderm, mesoderm, and endoderm."}]}},{"page":242,"lecture":"Stem Cells and Differentiation","slideInLecture":14,"title":"Gastrulation Video Reinforcement","explain":"This linked video visualizes the cell movements that reorganize the early embryo during gastrulation. Figure focus: The historical video frame introduces classic embryology experiments.","mustKnow":["Gastrulation uses coordinated cell movement to establish germ-layer organization."],"terms":[{"term":"Morphogenetic movement","meaning":"Coordinated movement of cells that changes embryonic form."}],"diagramGuide":["The historical video frame introduces classic embryology experiments.","Treat it as context for transplantation/fate experiments discussed around slides 241-244."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Classic transplantation experiments in embryology primarily test which property?","options":["Whether pRb binds E2F","Whether Annexin V binds PS","Whether cell fate is autonomous or environment-dependent","Whether cAMP is cyclic"],"answer":2,"explanation":"Moving embryonic cells reveals whether their developmental behavior persists in a new environment."}]}},{"page":243,"lecture":"Stem Cells and Differentiation","slideInLecture":15,"title":"Testing Whether Cell Behavior Is Retained","explain":"The slide asks whether cells preserve their characteristic developmental behavior outside the original embryo. This motivates transplantation and culture experiments that test whether a cell's behavior is intrinsic, imposed by its environment, or both. Figure focus: The bright sheet spreading over the blastocoel roof is the behavior being tested outside the original embryo.","mustKnow":["Cell behavior can be tested by changing the cell's environment.","Retention of behavior outside the embryo supports a stable internal developmental state."],"terms":[{"term":"Cell-autonomous behavior","meaning":"Behavior maintained by properties within the cell itself."},{"term":"Developmental environment","meaning":"External signals and neighboring tissues that influence cell behavior."}],"diagramGuide":["The bright sheet spreading over the blastocoel roof is the behavior being tested outside the original embryo.","Persistence after transplantation/culture supports a stable determined state; altered behavior would support environmental instruction."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"If transplanted cells continue their original spreading behavior in a new embryo, what is the strongest inference?","options":["Their genome has been deleted","They have become totipotent","They are undergoing necrosis","Their developmental state is stably determined"],"answer":3,"explanation":"Persistence despite a changed environment supports stable determination."}]}},{"page":244,"lecture":"Stem Cells and Differentiation","slideInLecture":16,"title":"The Three Germ Layers","explain":"Gastrulation establishes germ layers. Endoderm contributes to the digestive tract, liver, and pancreas; mesoderm contributes to kidney, cartilage, bone, spleen, and circulatory and lymphatic systems; ectoderm contributes to hair, nails, nervous system, and retina. Figure focus: Organize the text into a three-column map: ectoderm, mesoderm, endoderm and their derivatives.","mustKnow":["Endoderm: digestive tract, liver, pancreas.","Mesoderm: bone, cartilage, kidney, blood-associated systems.","Ectoderm: nervous system, retina, hair, and nails.","Diploblasts have two primary layers; triploblasts have three."],"terms":[{"term":"Endoderm","meaning":"Inner germ layer that forms much of the digestive tract and associated organs."},{"term":"Mesoderm","meaning":"Middle germ layer that forms muscle, bone, blood, kidney, and related tissues."},{"term":"Ectoderm","meaning":"Outer germ layer that forms the nervous system and external body structures."},{"term":"Triploblastic","meaning":"Having ectoderm, mesoderm, and endoderm."}],"diagramGuide":["Organize the text into a three-column map: ectoderm, mesoderm, endoderm and their derivatives.","The slide distinguishes diploblasts (two layers) from triploblasts such as mammals (three layers)."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which derivative is matched to the correct germ layer?","options":["Pancreas - endoderm","Retina - mesoderm","Bone - ectoderm","Spinal cord - endoderm"],"answer":0,"explanation":"The slide assigns digestive tract, liver, and pancreas to endoderm."},{"q":"Which germ layer gives rise to the digestive tract, liver, and pancreas?","options":["Ectoderm","Mesoderm","Endoderm","Trophoblast"],"answer":2,"explanation":"The slide lists the digestive tract, liver, and pancreas as endoderm derivatives."},{"q":"Which germ layer gives rise to bone, kidney, and the circulatory system?","options":["Ectoderm","Mesoderm","Endoderm","Inner cell mass"],"answer":1,"explanation":"Bone, kidney, and circulatory and lymphatic systems are listed as mesoderm derivatives."}]}},{"page":245,"lecture":"Stem Cells and Differentiation","slideInLecture":17,"title":"Till and McCulloch Bone-Marrow Experiment","explain":"Whole-body irradiation damaged the mice's blood-forming system. Intravenous bone-marrow transplantation rescued survival in proportion to the number of marrow cells injected, supporting the presence of rare, consistently represented marrow cells with regenerative capacity. Figure focus: Top flow is experimental design: irradiate mice -> inject graded bone-marrow doses -> measure survival.","mustKnow":["The recipients were whole-body irradiated mice.","Bone-marrow cells were injected intravenously.","More injected marrow cells correlated with greater survival.","The result supported a rare regenerative cell population in marrow."],"terms":[{"term":"Bone marrow","meaning":"Tissue containing blood-forming stem and progenitor cells."},{"term":"Hematopoietic regeneration","meaning":"Restoration of blood-cell production after damage."},{"term":"Irradiation","meaning":"Radiation treatment used here to destroy endogenous blood-forming cells."}],"diagramGuide":["Top flow is experimental design: irradiate mice -> inject graded bone-marrow doses -> measure survival.","In the left graph, survival changes with injected cell number; this dose-response supports rare regenerative units in marrow."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which experimental result supports the existence of rare regenerative cells in marrow?","options":["Survival falls as marrow dose rises","Survival rises with the number of injected marrow cells","All irradiated mice survive without injection","Differentiated erythrocytes form every tissue"],"answer":1,"explanation":"A marrow-cell dose-response is consistent with transplantable regenerative units."},{"q":"In what year was the Till and McCulloch experiment shown performed?","options":["1951","1961","1971","1981"],"answer":1,"explanation":"The slide title identifies the Till and McCulloch experiment as occurring in 1961."},{"q":"How were bone-marrow cells delivered to the irradiated mice?","options":["Oral feeding","Intravenous injection","Intramuscular injection","Inhalation"],"answer":1,"explanation":"The experimental diagram specifies intravenous injection of bone-marrow cells."}]}},{"page":246,"lecture":"Stem Cells and Differentiation","slideInLecture":18,"title":"Mauro and the Muscle Satellite Cell","explain":"Electron microscopy of frog muscle revealed satellite cells next to muscle fibers. Mauro proposed that these cells were either precursors capable of producing muscle cells or remnants of embryonic development; later work established their role as muscle stem cells. Figure focus: The TEM shows a small satellite cell positioned beside a frog muscle fiber.","mustKnow":["Satellite cells were identified by microscopy in muscle.","They were proposed as possible muscle-cell precursors.","Satellite cells are associated with muscle regeneration."],"terms":[{"term":"Satellite cell","meaning":"A muscle-associated stem cell that can generate muscle-lineage cells."},{"term":"TEM","meaning":"Transmission electron microscopy, used to view cell ultrastructure."},{"term":"Precursor cell","meaning":"A cell capable of producing a more differentiated descendant."}],"diagramGuide":["The TEM shows a small satellite cell positioned beside a frog muscle fiber.","The 1961 interpretation offered two alternatives: muscle precursor or embryonic remnant; later evidence supports the precursor/stem-cell role."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Where was the satellite cell observed in Mauro's experiment?","options":["Within bone marrow sinusoids","On the mitochondrial outer membrane","Adjacent to frog muscle fibers","Inside the blastocoel"],"answer":2,"explanation":"Transmission electron microscopy identified the small cell beside muscle tissue."}]}},{"page":247,"lecture":"Stem Cells and Differentiation","slideInLecture":19,"title":"Defining Properties of Stem Cells","explain":"Stem cells combine long-term proliferative capacity with self-renewal and differentiation. Their output depends on their potency: embryonic stem cells generate all body cell types, while tissue-specific adult stem cells generate cells of their own tissue. Many adult stem cells spend time in a low-activity quiescent state. Figure focus: Group the list into defining capacities (self-renewal, differentiation, long-term proliferation) and physiological state (often quiescent).","mustKnow":["Stem cells self-renew.","Stem cells generate differentiated descendants.","Adult stem cells reside in tissues and usually have restricted output.","Many stem cells can remain quiescent."],"terms":[{"term":"Self-renewal","meaning":"Division that preserves the stem-cell population."},{"term":"Quiescence","meaning":"A reversible low-activity, non-dividing state."},{"term":"Adult stem cell","meaning":"A tissue-resident stem cell that maintains or repairs a limited set of cell types."}],"diagramGuide":["Group the list into defining capacities (self-renewal, differentiation, long-term proliferation) and physiological state (often quiescent).","Contrast broad ESC output with tissue-restricted adult stem-cell output."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which property distinguishes self-renewal from ordinary differentiation?","options":["Production of only terminally specialized cells","Permanent exit into G0 in every division","Loss of proliferative potential after one cycle","Production of daughter cells that retain stem-cell identity"],"answer":3,"explanation":"Self-renewal maintains the stem-cell pool."},{"q":"Which term means that a stem cell can produce more stem cells like itself?","options":["Determination","Self-renewal","Gastrulation","Attenuation"],"answer":1,"explanation":"Self-renewal is the ability to generate additional stem cells."},{"q":"What metabolic and proliferative state is associated with many tissue stem cells?","options":["Quiescent with low metabolic activity","Continuously mitotic with maximal metabolism","Apoptotic with membrane rupture","Terminally differentiated with no renewal capacity"],"answer":0,"explanation":"The slide describes stem cells as capable of quiescence, with no division and low metabolic activity."}]}},{"page":248,"lecture":"Stem Cells and Differentiation","slideInLecture":20,"title":"Mature Cells Can Be Reprogrammed","explain":"The slide highlights the 2012 Nobel Prize awarded to John B. Gurdon and Shinya Yamanaka for showing that mature cells can be reprogrammed to a pluripotent state. Differentiation is therefore not necessarily an irreversible loss of genetic potential. Figure focus: The two portraits are John Gurdon and Shinya Yamanaka; the citation is the 2012 Nobel Prize in Physiology or Medicine.","mustKnow":["Gurdon and Yamanaka shared the 2012 Nobel Prize in Physiology or Medicine.","Their work showed that mature cells can be reprogrammed.","Reprogrammed mature cells can regain pluripotency."],"terms":[{"term":"Reprogramming","meaning":"Resetting a differentiated cell's gene-expression state toward an earlier developmental potential."},{"term":"Induced pluripotency","meaning":"Acquisition of pluripotent properties by a previously differentiated cell."}],"diagramGuide":["The two portraits are John Gurdon and Shinya Yamanaka; the citation is the 2012 Nobel Prize in Physiology or Medicine.","The shared concept is reprogramming mature cells to pluripotency by two different experimental routes."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which pairing of scientist and experimental strategy is correct?","options":["Gurdon - somatic-cell nuclear transfer; Yamanaka - transcription-factor reprogramming","Gurdon - Annexin V staining; Yamanaka - bone-marrow transplantation","Gurdon - GPCR crystallography; Yamanaka - cyclin discovery","Gurdon - teratoma removal; Yamanaka - gastrulation imaging"],"answer":0,"explanation":"The Nobel recognized two routes demonstrating nuclear/cellular reprogramming."},{"q":"Which two scientists shared the 2012 Nobel Prize highlighted on the slide?","options":["Till and McCulloch","Gurdon and Yamanaka","Watson and Crick","Bax and Bak"],"answer":1,"explanation":"John Gurdon and Shinya Yamanaka shared the 2012 prize for discoveries concerning cellular reprogramming."}]}},{"page":249,"lecture":"Stem Cells and Differentiation","slideInLecture":21,"title":"Gurdon's Somatic Cell Nuclear Transfer","explain":"Gurdon transferred nuclei from differentiated tadpole intestinal cells into enucleated Xenopus eggs. A small fraction developed into normal tadpoles, showing that a differentiated nucleus can still contain the genetic information needed to direct an entire organism when reset by egg cytoplasm. Figure focus: Follow source boxes into the enucleated Xenopus egg, then read the developmental outcome.","mustKnow":["The donor nucleus came from differentiated intestinal epithelium.","The recipient was an enucleated Xenopus egg.","Some transplants produced normal tadpoles.","Differentiation does not normally delete the genome needed for development."],"terms":[{"term":"Somatic cell nuclear transfer","meaning":"Transfer of a body-cell nucleus into an egg whose nucleus has been removed."},{"term":"Enucleated egg","meaning":"An egg cell from which the nucleus has been removed."},{"term":"Nuclear reprogramming","meaning":"Resetting a differentiated nucleus to support an earlier developmental program."}],"diagramGuide":["Follow source boxes into the enucleated Xenopus egg, then read the developmental outcome.","The one-nucleolus mutation is a lineage marker proving offspring nuclei came from the differentiated donor rather than residual egg nucleus."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why was the one-nucleolus mutation useful in Gurdon's experiment?","options":["It served as a pluripotency factor","It marked descendants of the donor nucleus","It induced egg enucleation","It increased the transplantation rate"],"answer":1,"explanation":"The nucleolus phenotype tracked the genetic origin of resulting tadpoles."},{"q":"From which differentiated tissue were Gurdon's donor nuclei obtained?","options":["Adult muscle fibers","Tadpole intestinal epithelium","Mouse embryonic fibroblasts","Bone-marrow stem cells"],"answer":1,"explanation":"The donor nuclei came from intestinal epithelial cells of feeding tadpoles."},{"q":"What fraction of differentiated-cell nuclear transplants produced normal tadpoles on the slide?","options":["1.5% (10 of 726)","10% (72 of 726)","25% (182 of 726)","50% (363 of 726)"],"answer":0,"explanation":"The slide reports 10 normal tadpoles from 726 transplants, approximately 1.5%."}]}},{"page":250,"lecture":"Stem Cells and Differentiation","slideInLecture":22,"title":"Dolly the Sheep","explain":"Dolly was produced by somatic cell nuclear transfer using a nucleus from an adult mammary cell and an enucleated egg. Her birth demonstrated that an adult somatic nucleus can be reprogrammed to support mammalian development. Figure focus: The TIME cover identifies Dolly and the year 1997.","mustKnow":["Dolly was produced by somatic cell nuclear transfer.","The donor nucleus came from an adult somatic cell.","An enucleated egg provided the reprogramming cytoplasm.","Dolly provided mammalian evidence for nuclear reprogramming."],"terms":[{"term":"Dolly","meaning":"The first mammal cloned from an adult somatic-cell nucleus."},{"term":"Clone","meaning":"An organism or cell population derived from one genetic source."},{"term":"Somatic nucleus","meaning":"The nucleus of a non-germline body cell."}],"diagramGuide":["The TIME cover identifies Dolly and the year 1997.","Dolly is the mammalian extension of somatic-cell nuclear reprogramming, not an iPSC experiment."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which cell component from the adult donor was transferred to generate Dolly?","options":["A retroviral vector carrying OSKM","A bone-marrow stem-cell colony","A somatic-cell nucleus","A complete adult mammary cell with its membrane"],"answer":2,"explanation":"Dolly was made by transferring an adult somatic nucleus into an enucleated egg."}]}},{"page":251,"lecture":"Stem Cells and Differentiation","slideInLecture":23,"title":"Induced pluripotent stem cells: the Yamanaka factors","explain":"Yamanaka reprogrammed differentiated mouse fibroblasts into stem-cell-like cells by delivering selected transcription-factor genes with retroviral vectors. The minimum four-factor combination was Oct3/4, Sox2, c-Myc and Klf4, often abbreviated OSKM. Figure focus: Follow the boxes: differentiated mouse embryonic fibroblasts + retroviral candidate genes -> stem-cell-like colonies.","mustKnow":["iPSCs are differentiated cells reprogrammed back to a pluripotent state.","The four Yamanaka factors are Oct3/4, Sox2, c-Myc and Klf4.","The starting cells shown are mouse embryonic fibroblasts."],"terms":[{"term":"iPSC","meaning":"Induced pluripotent stem cell made by reprogramming a differentiated cell."},{"term":"OSKM","meaning":"Oct3/4, Sox2, Klf4 and c-Myc."},{"term":"Retroviral vector","meaning":"A modified virus used here to deliver reprogramming genes into cells."},{"term":"Pluripotent","meaning":"Able to produce nearly every cell type of the body."}],"diagramGuide":["Follow the boxes: differentiated mouse embryonic fibroblasts + retroviral candidate genes -> stem-cell-like colonies.","The micrographs compare ES cells, an iPS clone, and parental MEFs; colony morphology shifts toward ES-like appearance after reprogramming."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which factor set is sufficient in the slide's minimum reprogramming combination?","options":["Rx, Pax6, Chx10, Mitf","BAX, BAK, BID, BIM","Cyclin E, Cyclin A, Cyclin B, CDK1","Oct3/4, Sox2, c-Myc, Klf4"],"answer":3,"explanation":"These four transcription factors form the OSKM reprogramming set."},{"q":"What differentiated starting cell type was used in Yamanaka's experiment shown here?","options":["Mouse embryonic fibroblasts","Human erythrocytes","Xenopus intestinal cells","Mouse oocytes"],"answer":0,"explanation":"The source cells shown are mouse embryonic fibroblasts."},{"q":"How many candidate genes were initially screened using retroviral delivery?","options":["4","12","24","48"],"answer":2,"explanation":"The slide states that 24 candidate genes were initially used to search for reprogramming factors."}]}},{"page":252,"lecture":"Stem Cells and Differentiation","slideInLecture":24,"title":"How the four reprogramming factors were identified","explain":"The graphs show a stepwise elimination experiment. Researchers began with 24 candidate factors, removed factors one at a time, narrowed the active set to 10, and then tested smaller combinations. Loss of colony formation identified factors required for reprogramming, leading to the four-factor OSKM set. Figure focus: Panel A removes one of 24 factors, panel B removes one of a narrowed 10, and panel C tests three-, two-, and four-factor mixtures.","mustKnow":["Candidate factors were narrowed by systematic removal and colony-count assays.","A sharp fall in colonies after removing a factor indicates that factor is important.","Four factors were sufficient; two- or three-factor combinations were much less effective."],"terms":[{"term":"Colony assay","meaning":"A test that counts groups of successfully reprogrammed, proliferating cells."},{"term":"Candidate factor","meaning":"A gene tested for a possible role in reprogramming."},{"term":"Factor elimination","meaning":"Removing one factor from a mixture to test whether it is required."}],"diagramGuide":["Panel A removes one of 24 factors, panel B removes one of a narrowed 10, and panel C tests three-, two-, and four-factor mixtures.","A sharp colony decrease on factor removal implies necessity; retained colonies after reduction imply sufficiency of the remaining combination."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"If removing candidate factor 14 leaves colony number unchanged, what does that result suggest under the tested conditions?","options":["Factor 14 is not essential in that mixture","Factor 14 alone is sufficient","Factor 14 destroys all colonies","The assay cannot measure reprogramming"],"answer":0,"explanation":"A factor whose removal does not reduce colonies is dispensable in that tested combination."},{"q":"What assay readout was used to judge successful reprogramming combinations?","options":["Number of colonies","Number of chromosomes lost","Amount of cytochrome c released","Frequency of membrane blebs"],"answer":0,"explanation":"The graphs compare colony number after testing different factor combinations."},{"q":"What general strategy narrowed the original candidate set to four factors?","options":["Systematic factor removal and reduced combinations","Random chromosome deletion","Protein purification from mitochondria","Selection by antibiotic resistance alone"],"answer":0,"explanation":"Factors were removed and smaller combinations tested to identify those required for colony formation."}]}},{"page":253,"lecture":"Stem Cells and Differentiation","slideInLecture":25,"title":"Tests used to validate iPSCs","explain":"A useful iPSC line should retain a normal chromosome set and show pluripotency. A normal karyotype checks chromosome number and structure. Teratoma formation after transplantation is a classic functional test because a teratoma can contain tissues derived from multiple germ layers. Figure focus: Left image is a karyotype for chromosome integrity; right panels show tissues such as heart, gut, liver, gonad, neural tube, and skin in a teratoma.","mustKnow":["Karyotyping checks chromosome number and large structural abnormalities.","Teratoma formation is evidence that candidate iPSCs can form diverse tissue types.","Genetic stability and pluripotency are separate properties and both must be checked."],"terms":[{"term":"Karyotype","meaning":"An ordered display of a cell's chromosomes."},{"term":"Teratoma","meaning":"A tumor containing several tissue types, used experimentally as a pluripotency test."},{"term":"Germ layers","meaning":"Ectoderm, mesoderm and endoderm, which generate the body's tissues."}],"diagramGuide":["Left image is a karyotype for chromosome integrity; right panels show tissues such as heart, gut, liver, gonad, neural tube, and skin in a teratoma.","The two tests answer different questions: genetic stability versus multilineage differentiation capacity."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which test answers whether candidate iPSCs can generate derivatives of multiple germ layers?","options":["Propidium-iodide cell-cycle analysis","Teratoma formation","Karyotyping","Annexin-V staining"],"answer":1,"explanation":"A teratoma containing varied tissues is a functional multilineage differentiation assay."},{"q":"What does a normal karyotype establish about candidate iPSCs?","options":["They have grossly normal chromosome number and structure","They can form every germ layer","They are free of all point mutations","They beat like cardiomyocytes"],"answer":0,"explanation":"Karyotyping checks chromosome number and major structural integrity."},{"q":"Why is teratoma formation used alongside karyotyping?","options":["It tests multilineage differentiation rather than chromosome integrity","It measures GPCR activity","It counts apoptotic bodies","It proves the absence of all tumors"],"answer":0,"explanation":"The two assays answer different questions: karyotype checks chromosomes, while teratoma tissues demonstrate broad differentiation."}]}},{"page":254,"lecture":"Stem Cells and Differentiation","slideInLecture":26,"title":"Why iPSCs changed biomedical research","explain":"iPSCs avoid many ethical issues associated with obtaining embryonic stem cells and can be made from a particular patient. They enable patient-specific disease models, drug screening on relevant differentiated cells, and possible gene correction followed by replacement of diseased tissue. Figure focus: Group applications into modeling/testing (patient disease models, drug screens) and future intervention (gene correction, tissue engineering, transplantation).","mustKnow":["iPSCs provide an alternative to embryonic stem cells.","Patient-derived iPSCs can model that patient's disease.","Directed differentiation produces target cells for drug testing.","CRISPR plus iPSCs offers a possible route to gene correction and cell replacement."],"terms":[{"term":"Disease model","meaning":"A laboratory system that reproduces important features of a disease."},{"term":"Directed differentiation","meaning":"Guiding stem cells toward a chosen mature cell type."},{"term":"Gene correction","meaning":"Repairing a disease-causing DNA sequence."},{"term":"Tissue engineering","meaning":"Combining cells and materials to build or restore tissue."}],"diagramGuide":["Group applications into modeling/testing (patient disease models, drug screens) and future intervention (gene correction, tissue engineering, transplantation).","Patient-derived iPSCs preserve the donor genotype while directed differentiation supplies the disease-relevant cell type."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which application specifically depends on retaining a patient's genetic background?","options":["Measurement of GPCR helix number","Detection of metaphase chromosomes only","Patient-specific disease modeling","Production of universal bacterial vaccines"],"answer":2,"explanation":"Patient-derived iPSCs carry the donor genotype for disease modeling and drug testing."},{"q":"Which technology is proposed for correcting disease-causing mutations in patient-derived iPSCs?","options":["FRET","CRISPR/Cas9","Annexin V staining","Propidium iodide"],"answer":1,"explanation":"The slide proposes combining iPSCs with CRISPR/Cas9 for gene correction."},{"q":"What enables drug screening directly on a disease-relevant target cell type?","options":["Directed differentiation of patient-derived iPSCs","Removal of all reprogramming factors","Whole-body irradiation","Blocking clonal expansion"],"answer":0,"explanation":"Patient iPSCs can be directed into the relevant cell type and used for large-scale drug screening."}]}},{"page":255,"lecture":"Stem Cells and Differentiation","slideInLecture":27,"title":"Starting optic-cup development from embryonic stem cells","explain":"Mouse embryonic stem cells were grown as a three-dimensional embryoid body under conditions that favor retinal development. Matrix proteins supplied structural support, while Activin promoted the retinal-field gene Rx. GFP made Rx-positive regions visible as spherical outgrowths. Figure focus: Read the timeline Day 1 -> Day 5 -> Day 7 -> Day 9: ES aggregate -> Rx-positive neuroepithelium -> evagination/spherical vesicle -> invagination and neural-retina/RPE pattern.","mustKnow":["Activin was used to induce Rx expression.","Rx-positive cells were visualized by GFP.","The culture produced spherical evaginations that begin optic-cup morphogenesis."],"terms":[{"term":"Embryoid body","meaning":"A three-dimensional aggregate of pluripotent stem cells that can begin organized differentiation."},{"term":"Rx/Rax","meaning":"A transcription factor important in early eye and retinal development."},{"term":"GFP","meaning":"Green fluorescent protein used as a visible reporter of gene expression."},{"term":"Matrigel","meaning":"A protein-rich matrix that supports three-dimensional cell growth."}],"diagramGuide":["Read the timeline Day 1 -> Day 5 -> Day 7 -> Day 9: ES aggregate -> Rx-positive neuroepithelium -> evagination/spherical vesicle -> invagination and neural-retina/RPE pattern.","Green signal is Rx-GFP; red/blue outlines mark apical-basal organization in the schematic."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which treatment was used to promote expression of the retinal-field gene Rx?","options":["Annexin V","Staurosporine","TNF","Activin"],"answer":3,"explanation":"The slide states that Activin was used to induce Rx expression."},{"q":"How were Rx-positive cells visualized in the optic-cup culture?","options":["Annexin V positivity","GFP fluorescence","Propidium iodide staining","Cytochrome c diffusion"],"answer":1,"explanation":"Rx-positive cells appear GFP-positive in the culture."},{"q":"Which matrix proteins are named as an alternative to Matrigel in the culture conditions?","options":["Laminin and entactin","Actin and myosin","Collagen and keratin","BAX and BAK"],"answer":0,"explanation":"The slide names laminin plus entactin as matrix proteins used in the low-serum culture."}]}},{"page":256,"lecture":"Stem Cells and Differentiation","slideInLecture":28,"title":"Self-organization into an optic cup","explain":"The Rx-positive vesicles change shape over time without being manually sculpted. By about day 9, the initially spherical retinal tissue bends inward and develops the characteristic cup-like architecture of the early eye. Figure focus: Compare Day 7 spherical vesicle with Day 9 cup; green Rx-GFP identifies retinal tissue throughout.","mustKnow":["Rx-positive spherical vesicles develop into optic cups.","The characteristic cup shape appears at approximately day 9.","The experiment demonstrates self-organizing morphogenesis in a 3D culture."],"terms":[{"term":"Morphogenesis","meaning":"The biological process that generates tissue shape and structure."},{"term":"Evagination","meaning":"Outward bulging of a tissue layer."},{"term":"Invagination","meaning":"Inward folding of a tissue layer."}],"diagramGuide":["Compare Day 7 spherical vesicle with Day 9 cup; green Rx-GFP identifies retinal tissue throughout.","The shape change is self-organized morphogenesis, not manual folding."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"At what approximate time does the Rx-positive structure display the characteristic optic-cup shape?","options":["Day 9","Day 1","Day 5","Day 16"],"answer":0,"explanation":"The Day 9 panels show the cup-shaped morphology."},{"q":"Which fluorescent marker identifies the developing vesicles in the time-course images?","options":["Rx-GFP","Annexin-V-PE","PI-DNA","BCL-2-YFP"],"answer":0,"explanation":"The green signal is labeled Rx-GFP and marks retinal-field identity."}]}},{"page":257,"lecture":"Stem Cells and Differentiation","slideInLecture":29,"title":"Neural retina and pigment epithelium separate","explain":"Different parts of the optic vesicle acquire different marker profiles. The invaginating distal layer expresses neural-retina markers such as Chx10 together with Rx and Pax6. The proximal outer layer expresses markers including Mitf and Otx2 and later becomes pigmented, resembling retinal pigment epithelium. Figure focus: Follow phases 1-4 from spherical vesicle through distal flattening, flexure, and apically convex invagination.","mustKnow":["Distal invaginated tissue becomes neural retina.","The outer proximal epithelium becomes retinal pigment epithelium (RPE).","Chx10 marks neural-retina progenitors; Mitf and Otx2 support RPE identity.","Pigmentation of the outer layer is visible by about day 12."],"terms":[{"term":"Chx10","meaning":"A marker associated with neural-retina progenitor cells."},{"term":"RPE","meaning":"Retinal pigment epithelium, the pigmented support layer outside the neural retina."},{"term":"Mitf","meaning":"A transcription factor associated here with RPE development."},{"term":"Pax6","meaning":"A transcription factor with a central role in eye development."}],"diagramGuide":["Follow phases 1-4 from spherical vesicle through distal flattening, flexure, and apically convex invagination.","Distal invaginated layer carries neural-retina markers (Chx10, Rx, Pax6); proximal outer shell carries RPE markers and pigments by Day 12."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which marker most specifically identifies the neural-retina progenitor side in the slide?","options":["Connexin 43","Chx10","Mitf","Otx2"],"answer":1,"explanation":"Chx10 is listed with Rx and Pax6 in the distal neural-retina layer; Mitf/Otx2 characterize the RPE side."},{"q":"Which region of the spherical vesicle invaginates to form neural-retina tissue?","options":["Distal portion","Proximal outer shell","Central lumen only","Entire vesicle uniformly"],"answer":0,"explanation":"The distal portion invaginates and expresses neural-retina markers."},{"q":"Which marker pair supports retinal pigment epithelium identity in the outer epithelium?","options":["Mitf and Otx2","Chx10 and caspase-9","TRADD and FADD","Oct3/4 and c-Myc"],"answer":0,"explanation":"The outer epithelium expresses RPE-associated markers including Mitf and Otx2."}]}},{"page":258,"lecture":"Stem Cells and Differentiation","slideInLecture":30,"title":"Reference for apoptosis","explain":"This is a reference slide rather than new examinable content. It points to Gerald Karp's Cell and Molecular Biology for additional detail on apoptosis. Figure focus: This bibliography slide repeats the apoptosis reference and adds no stem-cell mechanism.","mustKnow":["The cited topic is apoptosis.","The cited textbook author is Gerald Karp."],"terms":[{"term":"Apoptosis","meaning":"A regulated program of cell death."}],"diagramGuide":["This bibliography slide repeats the apoptosis reference and adds no stem-cell mechanism.","Do not infer new optic-cup facts from this slide."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which topic is the cited Karp reference intended to expand?","options":["Hematopoiesis","Clonal selection","Apoptosis","Optic-cup morphogenesis"],"answer":2,"explanation":"The reference text explicitly says it is for details on apoptosis."}]}},{"page":259,"lecture":"Host Pathogen Interaction","slideInLecture":1,"title":"Host–pathogen interaction","explain":"This lecture introduces how host defenses detect and eliminate infectious agents and how pathogens enter, attach, evade immunity and damage the host. Figure focus: This is the title slide for host-pathogen interaction.","mustKnow":["Host–pathogen interaction includes both immune defense and microbial disease mechanisms."],"terms":[{"term":"Host","meaning":"The organism in or on which another organism lives."},{"term":"Pathogen","meaning":"A microbe capable of causing disease."}],"diagramGuide":["This is the title slide for host-pathogen interaction.","Use it as a section boundary; specific immune-cell lineages begin on the next slide."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which new lecture begins on page 259?","options":["Stem-cell reprogramming","Cellular signaling","Bioenergetics","Host-pathogen interaction"],"answer":3,"explanation":"The title slide marks the start of host-pathogen interaction."}]}},{"page":260,"lecture":"Host Pathogen Interaction","slideInLecture":2,"title":"Where blood cells form","explain":"Blood-cell production is called hematopoiesis. In adults, it occurs mainly in bone marrow. Lymphocytes also mature or become activated in lymphoid organs such as the thymus, lymph nodes, spleen and tonsils. Figure focus: Locate primary blood-cell production in bone marrow, then distinguish lymphoid tissues shown around the body.","mustKnow":["Adult blood cells are produced mainly in bone marrow.","The thymus is important for T-cell maturation.","The spleen and lymph nodes are lymphoid organs, not the primary source of all blood cells."],"terms":[{"term":"Hematopoiesis","meaning":"Formation of blood cells from stem and progenitor cells."},{"term":"Bone marrow","meaning":"Soft tissue inside bones and the main adult site of blood-cell production."},{"term":"Lymphoid organ","meaning":"An organ where immune cells develop, reside or respond to antigens."}],"diagramGuide":["Locate primary blood-cell production in bone marrow, then distinguish lymphoid tissues shown around the body.","Thymus supports T-cell maturation; lymph nodes, spleen, and tonsils organize immune-cell residence/activation rather than making all blood cells."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which organ shown is the principal adult site of hematopoiesis?","options":["Bone marrow","Thymus","Spleen","Tonsils"],"answer":0,"explanation":"Adult blood-cell production occurs mainly in bone marrow; the other labeled organs are lymphoid sites."},{"q":"Which organ is specifically important for T-cell maturation?","options":["Thymus","Spleen","Bone marrow","Tonsil"],"answer":0,"explanation":"T-cell precursors mature in the thymus."}]}},{"page":261,"lecture":"Host Pathogen Interaction","slideInLecture":3,"title":"The blood-cell lineage tree","explain":"A multipotent hematopoietic stem cell branches into common myeloid and common lymphoid progenitors. The myeloid branch produces erythrocytes, platelets, mast cells, granulocytes and monocytes/macrophages. The lymphoid branch produces B cells, T cells and natural killer cells.","mustKnow":["All blood-cell lineages begin from hematopoietic stem cells.","Neutrophils, monocytes and macrophages belong to the myeloid branch.","B cells, T cells and NK cells belong to the lymphoid branch.","Monocytes can differentiate into macrophages."],"terms":[{"term":"Progenitor","meaning":"A partially specialized precursor that produces a restricted set of cell types."},{"term":"Myeloid lineage","meaning":"Branch producing red cells, platelets, granulocytes, monocytes and several other cells."},{"term":"Lymphoid lineage","meaning":"Branch producing B cells, T cells and NK cells."},{"term":"Megakaryocyte","meaning":"Large marrow cell that releases platelets."}],"diagramGuide":["Start at the multipotent hematopoietic stem cell, then follow the first split into common myeloid and common lymphoid progenitors.","Trace monocyte to macrophage; trace small lymphocyte to B cell/plasma cell, T cell, and NK cell.","Do not group NK cells with the myeloid phagocytes: the diagram places NK cells on the lymphoid branch."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A marrow precursor gives rise to neutrophils, monocytes, erythrocytes, and megakaryocytes but not T cells. Which labeled progenitor matches it?","options":["Common lymphoid progenitor","Plasma cell","Natural killer cell","Common myeloid progenitor"],"answer":3,"explanation":"The lineage diagram places those four outputs under the common myeloid progenitor; T cells arise from the lymphoid branch."},{"type":"mcq","q":"Which mature cell is derived from the common lymphoid progenitor rather than the common myeloid progenitor?","options":["Megakaryocyte","Neutrophil","Natural killer cell","Monocyte"],"answer":2,"explanation":"Natural killer cells share the common lymphoid progenitor with B and T cells; megakaryocytes, neutrophils, and monocytes are myeloid."},{"type":"mcq","q":"Which precursor-product relationship is shown in the blood-cell lineage tree?","options":["B cell → neutrophil","Megakaryocyte → erythrocyte","T cell → mast cell","Monocyte → macrophage"],"answer":3,"explanation":"Circulating monocytes can enter tissues and differentiate into macrophages."}]}},{"page":262,"lecture":"Host Pathogen Interaction","slideInLecture":4,"title":"The immune system is distributed","explain":"The immune system is a functional network rather than one anatomically isolated organ system. It combines barriers, antimicrobial secretions, circulating white blood cells, bone marrow, liver-made complement, lymphatic organs and immune cells permanently resident in tissues.","mustKnow":["Skin and mucous membranes are physical barriers.","The liver produces many complement proteins.","Bone marrow produces immune-cell precursors.","Many tissues contain resident immune cells."],"terms":[{"term":"Complement","meaning":"A group of blood proteins that helps tag, inflame and destroy microbes."},{"term":"Resident immune cell","meaning":"An immune cell that normally lives within a tissue."},{"term":"Mucous membrane","meaning":"Moist epithelial lining that protects body passages exposed to the environment."}],"diagramGuide":["Read the slide as a distributed system: barriers and secretions act at surfaces, WBCs circulate, bone marrow supplies cells, liver supplies complement, and lymphoid organs organize responses."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which source-product pairing is shown for a soluble innate immune component?","options":["Skin - immunoglobulin synthesis","Lymphatic vessel - lysozyme synthesis","Liver - complement proteins","Bone marrow - gastric HCl"],"answer":2,"explanation":"The slide identifies the liver as a source of complement proteins."},{"type":"mcq","q":"Which organ is identified as a major source of complement proteins?","options":["Spleen","Bone marrow","Thymus","Liver"],"answer":3,"explanation":"The liver synthesizes many circulating complement proteins."}]}},{"page":263,"lecture":"Host Pathogen Interaction","slideInLecture":5,"title":"Blood and lymph transport immune cells","explain":"Blood rapidly carries immune cells and soluble proteins around the body. Fluid leaving blood capillaries becomes tissue fluid; much of it enters lymphatic vessels as lymph. Lymph passes through lymph nodes and eventually returns to the bloodstream.","mustKnow":["Blood and lymph form linked transport routes for immune surveillance.","Lymph is derived from interstitial fluid.","Lymph nodes filter lymph and organize immune-cell encounters."],"terms":[{"term":"Lymph","meaning":"Interstitial fluid after it enters lymphatic vessels."},{"term":"Lymph node","meaning":"A filtering organ where lymph-borne material meets immune cells."},{"term":"Interstitial fluid","meaning":"Fluid surrounding cells within tissues."}],"diagramGuide":["Red arrows show blood leaving the heart through arteries and returning through veins; green lymphatics collect tissue fluid and return lymph to the venous circulation.","At capillary beds, fluid leaves blood to become tissue fluid; lymphatic capillaries collect the excess."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"After excess interstitial fluid enters the green vessels in the diagram, what is it called?","options":["Cytosol","Lymph","Plasma","Serum"],"answer":1,"explanation":"Interstitial fluid becomes lymph after entering lymphatic capillaries."},{"type":"mcq","q":"Which structure filters lymph and provides a site for immune-cell encounters?","options":["Renal glomerulus","Lymph node","Artery","Bone marrow sinusoid"],"answer":1,"explanation":"Lymph nodes filter lymph and organize interactions among antigens and immune cells."}]}},{"page":264,"lecture":"Host Pathogen Interaction","slideInLecture":6,"title":"Two interacting arms of immunity","explain":"Innate immunity provides rapid, broad defense, while adaptive immunity generates highly specific responses. They are presented as first and second lines of defense, but they cooperate continuously rather than acting as isolated systems.","mustKnow":["Innate immunity is rapid and nonspecific.","Adaptive immunity is antigen-specific.","Innate and adaptive immunity interact."],"terms":[{"term":"Innate immunity","meaning":"Immediate defense using pre-existing barriers, cells and molecules."},{"term":"Adaptive immunity","meaning":"Antigen-specific defense mediated mainly by B and T lymphocytes."}],"diagramGuide":["The tree divides immunity into innate/nonspecific first-line defense and adaptive/specific second-line defense.","The bottom statement is important: the two arms interact rather than operating independently."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which classification correctly matches the two branches in the overview?","options":["Innate: nonspecific; adaptive: specific","Innate: specific; adaptive: nonspecific","Innate: memory-forming only; adaptive: no memory","Innate: second line only; adaptive: first line only"],"answer":0,"explanation":"The overview labels innate immunity nonspecific and adaptive immunity specific."}]}},{"page":265,"lecture":"Host Pathogen Interaction","slideInLecture":7,"title":"Innate versus adaptive immunity","explain":"Innate responses begin with little or no delay, recognize broad microbial patterns and do not generate classical antigen-specific memory. Adaptive responses have a slower first response because matching lymphocytes must activate and expand, but they are specific and form memory cells.","mustKnow":["Innate: no major time lag, broad recognition, no classical antigen-specific memory.","Adaptive: initial lag, antigen specificity and memory.","Memory makes later adaptive responses faster and stronger."],"terms":[{"term":"Antigen","meaning":"A molecule specifically recognized by an antibody or lymphocyte receptor."},{"term":"Immunological memory","meaning":"Enhanced response after previous exposure to the same antigen."},{"term":"Time lag","meaning":"Delay before a measurable immune response develops."}],"diagramGuide":["Compare each row horizontally: innate has no lag, no antigen specificity, and no memory; adaptive has a lag, specificity, and memory."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A response begins slowly after first exposure but is faster on re-exposure to the same antigen. Which arm accounts for both properties?","options":["Innate immunity","Mechanical barrier defense","Normal flora","Adaptive immunity"],"answer":3,"explanation":"A lag and immunological memory are paired features of adaptive immunity."},{"type":"mcq","q":"Which property belongs to innate immunity rather than adaptive immunity?","options":["Antigen-specific memory","A lag during first exposure","Broad recognition with little time lag","Clonal expansion of specific lymphocytes"],"answer":2,"explanation":"Innate immunity responds rapidly and recognizes broad microbial patterns rather than specific antigens."}]}},{"page":266,"lecture":"Host Pathogen Interaction","slideInLecture":8,"title":"Map of a typical immune response","explain":"External innate defenses try to prevent entry. If microbes enter, internal innate mechanisms respond rapidly through phagocytes, antimicrobial proteins, inflammation, complement and NK cells. Adaptive immunity adds antibody-mediated humoral responses and cytotoxic cell-mediated responses.","mustKnow":["External innate defenses include skin, mucous membranes and secretions.","Internal innate defenses include phagocytes, inflammation, complement and NK cells.","Humoral adaptive immunity uses antibodies.","Cell-mediated adaptive immunity uses cytotoxic lymphocytes."],"terms":[{"term":"Humoral response","meaning":"Antibody-based adaptive defense in body fluids."},{"term":"Cell-mediated response","meaning":"Adaptive defense carried out mainly by T cells."},{"term":"Phagocyte","meaning":"A cell that engulfs particles or microbes."},{"term":"Inflammation","meaning":"A local protective response that recruits cells and molecules to injury or infection."}],"diagramGuide":["Follow invading microbes into external innate defenses first, then internal innate defenses; the adaptive branch splits into humoral antibodies and cell-mediated cytotoxic lymphocytes.","Complement is shown with internal innate defenses, not with antibody-producing humoral immunity."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which pair occupies the two adaptive branches at the right of the response map?","options":["Skin and mucous membranes","Inflammation and natural killer cells","Antibodies and cytotoxic lymphocytes","Complement and neutrophils"],"answer":2,"explanation":"The adaptive arm divides into humoral antibody and cell-mediated cytotoxic-lymphocyte responses."},{"type":"mcq","q":"Which component is classified as an internal innate defense on the response map?","options":["Mucous membrane","Natural killer cell","Cytotoxic T lymphocyte","Antibody"],"answer":1,"explanation":"Natural killer cells are internal innate effectors; antibodies and cytotoxic lymphocytes are adaptive."},{"type":"mcq","q":"Which pairing correctly matches an adaptive branch with its principal effector?","options":["Cell-mediated response—complement","Cell-mediated response—mucus","Humoral response—antibodies","Humoral response—NK cells"],"answer":2,"explanation":"The humoral adaptive response is mediated by antibodies, whereas the cell-mediated branch uses cytotoxic lymphocytes."}]}},{"page":267,"lecture":"Host Pathogen Interaction","slideInLecture":9,"title":"External innate defenses","explain":"External defenses are the body's boundary-level protections. They reduce the chance that microbes cross epithelial surfaces and enter internal tissues.","mustKnow":["External innate defenses act before microbes enter tissues.","They include mechanical, chemical and biological barriers."],"terms":[{"term":"Barrier defense","meaning":"A physical, chemical or biological feature that blocks microbial entry."},{"term":"Epithelium","meaning":"A sheet of cells covering surfaces and lining cavities."}],"diagramGuide":["The wall and fortress image represents intact external barriers preventing entry before immune cells need to attack."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"In the fortress analogy, what event must occur before internal innate defenses become relevant?","options":["Release of bacterial endotoxin","Breach of an external barrier","Class switching by B cells","Formation of memory cells"],"answer":1,"explanation":"The wall represents external innate defenses that must be breached before internal defenses confront the invader."}]}},{"page":268,"lecture":"Host Pathogen Interaction","slideInLecture":10,"title":"Mechanical barriers","explain":"Mechanical defenses physically block or remove microbes. Intact skin is a hard-to-cross surface. Saliva, tears and urine flush organisms away, while cilia move mucus and trapped particles out of the respiratory tract.","mustKnow":["Skin blocks entry.","Saliva, tears and urine remove microbes by flushing.","The mucociliary escalator clears inhaled material from airways."],"terms":[{"term":"Mucociliary escalator","meaning":"Coordinated ciliary movement that carries mucus and trapped particles toward the throat."},{"term":"Cilia","meaning":"Motile hair-like cell projections that move material across a surface."}],"diagramGuide":["Match each picture to its mechanical action: skin blocks entry, cilia move mucus upward, and saliva/tears/urine flush organisms away."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Failure of ciliary beating would most directly impair which barrier mechanism?","options":["Mucociliary clearance","Gastric acidification","Complement activation","Normal-flora antagonism"],"answer":0,"explanation":"Cilia propel mucus and trapped particles upward in the mucociliary escalator."},{"type":"mcq","q":"Which mechanical defense removes inhaled particles from the respiratory tract?","options":["Normal flora antagonism","Gastric acid","Mucociliary escalator","Complement cascade"],"answer":2,"explanation":"Coordinated ciliary movement transports mucus and trapped particles out of the airways."}]}},{"page":269,"lecture":"Host Pathogen Interaction","slideInLecture":11,"title":"Chemical barriers","explain":"Chemical defenses create conditions that damage or inhibit microbes. Sweat contains antimicrobial peptides, tears and saliva contain lysozyme, and stomach hydrochloric acid provides a very low pH that kills many swallowed organisms.","mustKnow":["Lysozyme is present in tears and saliva.","Stomach HCl is a low-pH antimicrobial barrier.","Sweat contains antimicrobial peptides."],"terms":[{"term":"Lysozyme","meaning":"An enzyme that breaks bonds in bacterial peptidoglycan cell walls."},{"term":"Antimicrobial peptide","meaning":"A short peptide that inhibits or kills microbes, often by damaging membranes."},{"term":"pH","meaning":"A scale of acidity or alkalinity; low pH is acidic."}],"diagramGuide":["The three chemical mechanisms are antimicrobial peptides in sweat, very low gastric pH from HCl, and lysozyme in tears/saliva."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which pairing is inconsistent with the chemical-barrier slide?","options":["HCl - low gastric pH","Antimicrobial peptides - sweat","Lysozyme - tears","Lysozyme - stomach acidification"],"answer":3,"explanation":"HCl, not lysozyme, creates the low pH of the stomach."},{"type":"mcq","q":"Which antimicrobial enzyme is found in both tears and saliva?","options":["Collagenase","Coagulase","Lysozyme","Streptokinase"],"answer":2,"explanation":"Lysozyme in tears and saliva damages susceptible bacterial cell walls."}]}},{"page":270,"lecture":"Host Pathogen Interaction","slideInLecture":12,"title":"Normal flora as a biological barrier","explain":"Normal flora are the resident microbes that usually coexist with the host. They hinder pathogens by occupying attachment sites, consuming nutrients and sometimes producing inhibitory substances. This competition is called microbial antagonism or colonization resistance.","mustKnow":["Normal flora compete with pathogens for nutrients and space.","This protective competition is called antagonism or colonization resistance.","Normal flora are part of external innate defense."],"terms":[{"term":"Normal flora","meaning":"Microorganisms that normally live on or in the body without causing disease."},{"term":"Colonization resistance","meaning":"Protection created when resident microbes prevent pathogen establishment."},{"term":"Antagonism","meaning":"One organism suppressing another through competition or inhibitory products."}],"diagramGuide":["The body map marks colonized sites; the key relationship is competition by normal flora for nutrients and space, termed antagonism."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Resident bacteria prevent a pathogen from establishing by consuming the same nutrient. Which labeled barrier principle is this?","options":["Opsonization","Cytotoxicity","Antagonism by normal flora","Chemotaxis"],"answer":2,"explanation":"Competition for nutrients and space by normal flora is described as antagonism."},{"type":"mcq","q":"Normal flora protect a body surface primarily by competing with pathogens for:","options":["Nutrients and space","Caspases and cytokines","Oxygen and erythrocytes","Antibodies and complement"],"answer":0,"explanation":"Competition for nutrients and attachment space creates antagonism or colonization resistance."}]}},{"page":271,"lecture":"Host Pathogen Interaction","slideInLecture":13,"title":"From barriers to internal defense","explain":"This repeated overview emphasizes the transition: barriers act first; if a pathogen breaches them, internal innate defenses respond, followed by antigen-specific adaptive responses.","mustKnow":["Defense proceeds from external barriers to internal innate mechanisms and adaptive immunity.","Complement and inflammation are innate; antibodies and cytotoxic lymphocytes are adaptive."],"terms":[{"term":"Breach","meaning":"Successful crossing of a protective barrier by a pathogen."}],"diagramGuide":["The enlarged response map adds internal innate defenses after the external barrier: phagocytes, antimicrobial proteins, inflammation, NK cells, and complement."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A pathogen has crossed mucus but adaptive immunity has not yet developed. Which listed defense can act immediately inside tissue?","options":["Antigen-specific cytotoxic clones","Phagocytic cells","Memory B cells","High-affinity antibodies from recall"],"answer":1,"explanation":"Phagocytic cells are internal innate defenses and do not require clonal priming."}]}},{"page":272,"lecture":"Host Pathogen Interaction","slideInLecture":14,"title":"Internal innate defenses","explain":"Once microbes enter tissues or blood, internal defenses detect, contain and eliminate them. Major components include soluble blood proteins and innate immune cells.","mustKnow":["Internal innate defenses act after barrier penetration.","They include soluble proteins, phagocytes, inflammatory mechanisms and NK cells."],"terms":[{"term":"Internal defense","meaning":"Immune mechanisms acting within tissues, blood or lymph after microbial entry."}],"diagramGuide":["The breached-wall and army images signal the transition from barrier defenses to cellular and soluble internal defenses."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"The breached-wall image marks the handoff from which defense category to which category?","options":["External innate to internal innate","Adaptive humoral to mechanical","Cell-mediated to normal flora","Memory to primary response"],"answer":0,"explanation":"Once external barriers fail, internal innate defenses engage the invader."}]}},{"page":273,"lecture":"Host Pathogen Interaction","slideInLecture":15,"title":"Immune components in blood","explain":"Blood contains cellular and soluble defense components. White blood cells are cellular. Complement proteins, coagulation proteins and cytokines are extracellular molecules that can tag microbes, control inflammation, form clots and coordinate cell behavior.","mustKnow":["WBCs are cellular blood components.","Complement, coagulation proteins and cytokines act extracellularly.","Cytokines are communication signals between cells."],"terms":[{"term":"Cytokine","meaning":"A secreted signaling protein that changes the behavior of immune or other cells."},{"term":"Coagulation","meaning":"The clot-forming process that limits bleeding and can help contain infection."},{"term":"Extracellular","meaning":"Located or acting outside cells."},{"term":"WBC","meaning":"White blood cell, also called a leukocyte."}],"diagramGuide":["The centrifuged blood tube separates plasma from formed elements; complement, coagulation proteins, and cytokines are extracellular plasma components, whereas WBCs are cells."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which component belongs in the extracellular plasma bracket rather than the WBC fraction?","options":["Neutrophil","Monocyte","Natural killer cell","Complement protein"],"answer":3,"explanation":"Complement is soluble in plasma; the other options are leukocytes."},{"type":"mcq","q":"Which listed blood component functions mainly as an intercellular communication signal?","options":["Erythrocyte","Platelet","Coagulation protein","Cytokine"],"answer":3,"explanation":"Cytokines are secreted signals that coordinate immune-cell behavior."}]}},{"page":274,"lecture":"Host Pathogen Interaction","slideInLecture":16,"title":"Major white blood cell types","explain":"White blood cells have distinct jobs. Macrophages engulf microbes and present antigens; B cells make antibodies after becoming plasma cells; T cells coordinate responses or kill infected cells; NK cells kill abnormal cells without antigen-specific receptors; mast cells release inflammatory mediators.","mustKnow":["B and T lymphocytes are central to adaptive immunity.","NK cells and macrophages contribute strongly to innate immunity.","Mast cells promote inflammation."],"terms":[{"term":"B lymphocyte","meaning":"Adaptive immune cell that can differentiate into an antibody-secreting plasma cell."},{"term":"T lymphocyte","meaning":"Adaptive immune cell involved in coordination or direct killing."},{"term":"Mast cell","meaning":"Tissue immune cell that releases inflammatory mediators from granules."},{"term":"Macrophage","meaning":"Large tissue phagocyte with microbe-killing and antigen-presenting functions."}],"diagramGuide":["Use morphology only as a cue, but learn the labels: monocyte has a kidney-shaped nucleus, neutrophil a multilobed nucleus, eosinophil a bilobed nucleus with granules, and basophil dense granules.","The arrows separately group B, T, and NK lymphocytes."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which labeled leukocyte is identified by a multilobed nucleus and fine cytoplasmic granules?","options":["Lymphocyte","Mast cell","Neutrophil","Monocyte"],"answer":2,"explanation":"The neutrophil drawing shows the characteristic multilobed nucleus."},{"type":"mcq","q":"Which pair consists mainly of adaptive immune lymphocytes?","options":["Mast cells and neutrophils","B cells and T cells","Macrophages and mast cells","NK cells and macrophages"],"answer":1,"explanation":"B and T lymphocytes are the principal cellular components of adaptive immunity."},{"type":"mcq","q":"Which white blood cell is strongly associated with release of mediators that promote inflammation?","options":["Erythrocyte","Mast cell","Platelet","Plasma cell"],"answer":1,"explanation":"Mast cells release inflammatory mediators and are important in immediate inflammatory responses."}]}},{"page":275,"lecture":"Host Pathogen Interaction","slideInLecture":17,"title":"Neutrophils: rapid first responders","explain":"Neutrophils are the most abundant circulating white blood cells and highly efficient phagocytes. They rapidly leave blood and accumulate at infection sites, making them major early-response cells of innate immunity.","mustKnow":["Neutrophils make up roughly 50–60% of circulating WBCs.","They are efficient phagocytes.","They arrive early at sites
