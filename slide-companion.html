responses."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which scenario is a physiological use of programmed cell death rather than accidental injury?","options":["Mechanical tearing of a membrane","Removal of self-reactive lymphocytes","Immediate rupture after extreme trauma","Random protein denaturation by heat"],"answer":1,"explanation":"Immune regulation, including deletion of inappropriate lymphocytes, is a normal role of programmed death."},{"type":"mcq","q":"Which is a homeostatic function of programmed cell death?","options":["Synthesis of bacterial capsules","Removal of damaged or infected cells","Permanent inhibition of all cell turnover","Conversion of pathogens into antibodies"],"answer":1,"explanation":"Programmed death removes unwanted, damaged, stressed, or infected cells and helps maintain tissue balance."}]}},{"page":320,"lecture":"Cell Death Pathways","slideInLecture":3,"title":"Hallmarks of Apoptosis","explain":"Apoptosis produces an orderly set of structural and biochemical changes: cell shrinkage, condensed and fragmented chromatin, membrane blebbing, apoptotic bodies, and phagocytosis. Caspases activate, DNA fragments, and phosphatidylserine becomes exposed at the cell surface.","mustKnow":["Morphology includes shrinkage, chromatin condensation, nuclear fragmentation, and blebbing.","Apoptotic bodies are removed by phagocytosis.","Biochemical signs include caspase activation, DNA fragmentation, and phosphatidylserine exposure."],"terms":[{"term":"Apoptotic body","meaning":"A membrane-bound fragment produced by an apoptotic cell."},{"term":"Phosphatidylserine inversion","meaning":"Exposure of phosphatidylserine on the outer surface of the plasma membrane."},{"term":"Chromatin condensation","meaning":"Compaction of nuclear DNA and associated proteins."}],"diagramGuide":["Read the top sequence left to right: shrinkage, membrane blebbing, apoptotic-body formation, then phagocytosis.","The micrographs contrast an intact normal nucleus with condensed/fragmented apoptotic chromatin."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which sequence preserves the morphology shown for apoptosis?","options":["Cell shrinkage -> blebbing -> apoptotic bodies -> phagocytosis","Cell swelling -> rupture -> DAMP release -> inflammation","Ruffling -> invasion -> biofilm -> dispersal","Adhesion -> clotting -> collagen digestion -> exit"],"answer":0,"explanation":"The top row shows shrinkage, blebbing, fragmentation into apoptotic bodies, then clearance."},{"type":"mcq","q":"Which feature is biochemical rather than morphological evidence of apoptosis?","options":["Caspase activation","Membrane blebbing","Cell shrinkage","Nuclear fragmentation"],"answer":0,"explanation":"Caspase activation is a biochemical hallmark; the other options are visible morphological changes."},{"type":"mcq","q":"Which membrane change marks an apoptotic cell for phagocytic clearance?","options":["Insertion of bacterial lipid A","Loss of all membrane phospholipids","Synthesis of peptidoglycan","Externalization of phosphatidylserine"],"answer":3,"explanation":"Phosphatidylserine exposure on the outer leaflet acts as an engulfment signal."}]}},{"page":321,"lecture":"Cell Death Pathways","slideInLecture":4,"title":"Initiator and Executioner Caspases","explain":"Caspases form an activation cascade. Initiator caspases such as caspase-8 and caspase-9 activate executioner caspases such as caspase-3, caspase-6, and caspase-7, which dismantle the cell.","mustKnow":["Initiators: caspase-8 and caspase-9.","Executioners: caspase-3, caspase-6, and caspase-7.","Initiators activate the downstream execution phase."],"terms":[{"term":"Caspase","meaning":"A protease that cleaves selected proteins during regulated cell death."},{"term":"Initiator caspase","meaning":"An upstream caspase that starts a caspase cascade."},{"term":"Executioner caspase","meaning":"A downstream caspase that cleaves cellular targets."}],"diagramGuide":["The diagram is a proteolytic cascade: apoptotic signals activate initiator caspases 8/9, which cleave executioner procaspases 3/6/7, and executioners cleave many cellular substrates."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which pairing correctly assigns cascade level?","options":["Caspase-3 initiator; caspase-9 executioner","Caspase-6 initiator; caspase-8 executioner","Caspase-7 initiator; caspase-9 executioner","Caspase-9 initiator; caspase-3 executioner"],"answer":3,"explanation":"Caspases 8/9 are initiators; caspases 3/6/7 are executioners."},{"type":"mcq","q":"Which pair contains only executioner caspases?","options":["Caspase-7 and caspase-9","Caspase-3 and caspase-8","Caspase-3 and caspase-7","Caspase-8 and caspase-9"],"answer":2,"explanation":"Caspases 3, 6, and 7 are executioners; caspases 8 and 9 are initiators."}]}},{"page":322,"lecture":"Cell Death Pathways","slideInLecture":5,"title":"How Caspases Produce Apoptotic Features","explain":"Caspase cleavage of cytoskeletal regulators drives cortical actin changes and membrane blebbing. Cleavage of plasma-membrane phospholipid-transfer proteins exposes phosphatidylserine on the cell surface.","mustKnow":["Caspase targets help create membrane blebs.","Caspase activity leads to surface exposure of phosphatidylserine."],"terms":[{"term":"Cell cortex","meaning":"The actin-rich layer beneath the plasma membrane."},{"term":"Membrane blebbing","meaning":"Formation of bulges in the plasma membrane during apoptosis."},{"term":"Phospholipid-transfer protein","meaning":"A protein that helps maintain lipid distribution across a membrane."}],"diagramGuide":["The left tree groups caspase functions; the center gel illustrates CAD-mediated DNA laddering after ICAD cleavage; the lower membrane sketch shows phosphatidylserine exposure.","Caspase cleavage links molecular substrates to visible apoptotic features."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"ICAD cleavage releases CAD. Which experimental pattern in the slide is the expected consequence?","options":["LPS band formation","Collagen cross-linking","Internucleosomal DNA laddering","Increased intact genomic DNA only"],"answer":2,"explanation":"Released CAD fragments DNA at regular intervals, producing the ladder pattern."},{"type":"mcq","q":"Caspase cleavage of cytoskeletal regulatory proteins contributes directly to:","options":["MHC class I expression","Membrane blebbing","LPS synthesis","Antibody secretion"],"answer":1,"explanation":"Caspase-dependent reorganization of cortical actin contributes to apoptotic surface blebs."},{"type":"mcq","q":"Cleavage of phospholipid-transfer proteins during apoptosis causes surface exposure of:","options":["Phosphatidylserine","Lipid A","Mycolic acid","Peptidoglycan"],"answer":0,"explanation":"Disrupted phospholipid asymmetry exposes phosphatidylserine on the cell surface."}]}},{"page":323,"lecture":"Cell Death Pathways","slideInLecture":6,"title":"Intrinsic Mitochondrial Apoptosis","explain":"An internal apoptotic stimulus induces pro-apoptotic proteins and activates BAX and BAK. These proteins permeabilize the mitochondrial outer membrane, releasing cytochrome c. Cytochrome c supports apoptosome formation, caspase activation, and apoptosis. Excess anti-apoptotic BCL-2 can block BAX and BAK and preserve survival.","mustKnow":["BAX and BAK permeabilize the mitochondrial outer membrane.","Cytochrome c release promotes apoptosome formation.","The apoptosome activates caspases.","BCL-2 opposes the pathway."],"terms":[{"term":"BAX and BAK","meaning":"Pro-apoptotic proteins that form openings in the mitochondrial outer membrane."},{"term":"Cytochrome c","meaning":"A mitochondrial protein that helps form the apoptosome after release into the cytosol."},{"term":"Apoptosome","meaning":"A cytosolic protein complex that activates an initiator caspase."},{"term":"BCL-2","meaning":"An anti-apoptotic protein that can prevent mitochondrial permeabilization."}],"diagramGuide":["Follow the mitochondrial route: cellular stress activates BH3-only proteins, BAX/BAK permeabilize the outer mitochondrial membrane, cytochrome c is released, apoptosome forms, caspase-9 activates caspase-3/7."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which ordering correctly follows intrinsic apoptosis after cellular stress?","options":["LPS release -> TLR4 -> caspase-9","BAX/BAK activation -> cytochrome c release -> apoptosome -> caspase-9","Fas ligation -> DISC -> caspase-8 -> BAX synthesis only","MLKL activation -> membrane rupture -> apoptosome"],"answer":1,"explanation":"The mitochondrial pathway proceeds through BAX/BAK permeabilization, cytochrome c, apoptosome, and caspase-9."},{"type":"mcq","q":"Which proteins directly permeabilize the mitochondrial outer membrane during intrinsic apoptosis?","options":["Fas and FADD","RIPK1 and RIPK3","GPX4 and FSP1","BAX and BAK"],"answer":3,"explanation":"Activated BAX and BAK oligomerize in the outer mitochondrial membrane and permit cytochrome c release."},{"type":"mcq","q":"Cytochrome c release promotes assembly of which caspase-activating complex?","options":["Phagolysosome","Inflammasome","Apoptosome","DISC"],"answer":2,"explanation":"Cytosolic cytochrome c drives apoptosome assembly and activation of initiator caspase-9."}]}},{"page":324,"lecture":"Cell Death Pathways","slideInLecture":7,"title":"Classes of BCL-2 Family Proteins","explain":"The BCL-2 family contains three pro-apoptotic classes—activators, effectors, and derepressors or sensitizers—and one anti-apoptotic class. Effectors and anti-apoptotic members contain BH1-BH4 domains, while activators and sensitizers contain only a BH3 domain.","mustKnow":["There are three pro-apoptotic classes and one anti-apoptotic class.","Effectors and anti-apoptotic members have BH1-BH4.","Activators and sensitizers are BH3-only proteins."],"terms":[{"term":"BCL-2 family","meaning":"Proteins that regulate mitochondrial apoptosis."},{"term":"BH domain","meaning":"A BCL-2 homology region used to classify and mediate interactions among family members."},{"term":"BH3-only protein","meaning":"A pro-apoptotic BCL-2 family member containing only the BH3 domain."}],"diagramGuide":["Use the domain bars: effectors BAX/BAK and anti-apoptotic BCL-2-like proteins contain BH1-BH4; activators and sensitizers such as BID/BIM/PUMA or BAD/BIK/BMF are BH3-only.","The interaction grid shows anti-apoptotic proteins binding and restraining pro-apoptotic members."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which pair belongs to the multi-domain pro-apoptotic effector class rather than the BH3-only class?","options":["BAX and BAK","BID and BIM","BAD and BIK","BMF and NOXA"],"answer":0,"explanation":"BAX and BAK contain BH1-BH4 and act as effectors; the other pairs are BH3-only."},{"type":"mcq","q":"Which BCL-2 family classes are BH3-only proteins?","options":["Receptors and adaptors","Activators and sensitizers","Effectors and anti-apoptotic members","Initiator and executioner caspases"],"answer":1,"explanation":"BH3-only activators and sensitizers contain only the BH3 homology domain."},{"type":"mcq","q":"Which BCL-2 family groups possess BH1–BH4 domains?","options":["Pro-apoptotic effectors and anti-apoptotic members","Activators and sensitizers only","Caspases 8 and 9","Fas ligand and FADD"],"answer":0,"explanation":"Multi-domain effectors and anti-apoptotic BCL-2 proteins contain all four BH domains."}]}},{"page":325,"lecture":"Cell Death Pathways","slideInLecture":8,"title":"Extrinsic Fas-Mediated Apoptosis","explain":"The extrinsic pathway begins when Fas ligand binds and clusters Fas death receptors. FADD adaptor proteins recruit caspase-8 to form the DISC. Caspase-8 becomes active and cleaves executioner caspases 3 and 7, producing apoptosis.","mustKnow":["Fas ligand activates the Fas death receptor.","FADD and caspase-8 assemble into the DISC.","Caspase-8 activates executioner caspases 3 and 7."],"terms":[{"term":"Fas","meaning":"A cell-surface death receptor."},{"term":"FADD","meaning":"An adaptor that links activated Fas to caspase-8."},{"term":"DISC","meaning":"Death-inducing signaling complex assembled at an activated death receptor."}],"diagramGuide":["Follow Fas ligand to Fas receptor clustering, FADD recruitment, DISC assembly, procaspase-8 activation, and executioner-caspase activation.","The alternative panel shows FLIP at the DISC blocking productive caspase activation and preventing apoptosis."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which complex forms at clustered Fas receptors before initiator-caspase activation?","options":["Apoptosome containing cytochrome c and caspase-9","Necrosome containing RIPK3 and MLKL","Autolysosome containing LC3 and cathepsin","DISC containing FADD and procaspase-8"],"answer":3,"explanation":"Fas recruits FADD and procaspase-8 into the death-inducing signaling complex."},{"type":"mcq","q":"Which adaptor protein is recruited to activated Fas receptors?","options":["Apaf-1","RIPK3","GPX4","FADD"],"answer":3,"explanation":"FADD links clustered Fas death receptors to procaspase-8 within the DISC."},{"type":"mcq","q":"Which initiator caspase is activated in the Fas-associated DISC?","options":["Caspase-3","Caspase-7","Caspase-8","Caspase-9"],"answer":2,"explanation":"The extrinsic pathway activates initiator caspase-8 at the DISC."}]}},{"page":326,"lecture":"Cell Death Pathways","slideInLecture":9,"title":"Necroptosis Versus Apoptosis","explain":"Necroptosis is caspase-independent, lytic, and inflammatory, and often occurs when apoptosis is blocked through loss or inhibition of caspase-8. Unlike apoptosis, it causes plasma-membrane rupture, cytoplasmic swelling and vacuolization, swollen mitochondria, and lacks the strongly condensed, fragmented nucleus of apoptosis.","mustKnow":["Necroptosis is caspase-independent and inflammatory.","It is favored when caspase-8 is absent or inhibited.","Membrane rupture and cell swelling distinguish it from apoptosis.","Apoptotic membranes remain intact while blebbing."],"terms":[{"term":"Necroptosis","meaning":"A regulated lytic and inflammatory form of cell death."},{"term":"Lytic death","meaning":"Cell death involving plasma-membrane rupture."},{"term":"Vacuolization","meaning":"Formation of vacuole-like spaces in the cytoplasm."}],"diagramGuide":["Compare micrographs feature by feature: necroptosis shows swelling, vacuolization, swollen mitochondria, and plasma-membrane rupture; apoptosis shows condensation/fragmentation and membrane blebbing while the membrane remains intact."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Electron microscopy shows swollen mitochondria, cytoplasmic vacuoles, and ruptured plasma membrane without condensed fragmented chromatin. Which death mode fits?","options":["Autophagic recycling alone","Adaptive immunity","Necroptosis","Apoptosis"],"answer":2,"explanation":"The feature set matches the necroptotic micrograph rather than apoptotic condensation and intact blebbing membrane."},{"type":"mcq","q":"Which condition commonly favors necroptosis over extrinsic apoptosis?","options":["Strong GPX4 activity","Absence or inhibition of caspase-8","High executioner-caspase activity","Intact apoptotic-body clearance"],"answer":1,"explanation":"Necroptosis is often engaged when death-receptor signaling occurs but caspase-8-dependent apoptosis is blocked."},{"type":"mcq","q":"Which morphology distinguishes necroptosis from apoptosis?","options":["Cell swelling with plasma-membrane rupture","Cell shrinkage with intact blebbing membrane","Chromatin condensation with apoptotic bodies","Phosphatidylserine exposure without lysis"],"answer":0,"explanation":"Necroptosis is lytic, with cytoplasmic swelling, swollen mitochondria, and membrane rupture."}]}},{"page":327,"lecture":"Cell Death Pathways","slideInLecture":10,"title":"Triggers of Necroptosis","explain":"Extrinsic necroptosis can begin at cell-surface receptors such as TNFR1 or pattern-recognition receptors TLR3 and TLR4. Intrinsic necroptosis begins inside the cell when ZBP1 recognizes Z-form nucleic acids.","mustKnow":["Extrinsic triggers include TNFR1, TLR3, and TLR4.","Intrinsic necroptosis can use ZBP1 recognition of Z-nucleic acids."],"terms":[{"term":"TNFR1","meaning":"A tumor-necrosis-factor receptor that can trigger death signaling."},{"term":"Pattern-recognition receptor","meaning":"A receptor that detects conserved microbial or danger-associated patterns."},{"term":"ZBP1","meaning":"An intracellular sensor that can recognize Z-form nucleic acids."}],"diagramGuide":["The top row shows extrinsic triggers at TNFR1/Fas/TRAIL receptors and TLR3/TLR4; downstream RIPK1/RIPK3 activate MLKL, which damages the membrane.","The intracellular branch shows ZBP1 sensing Z-nucleic acids and converging on RIPK3-MLKL."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which protein is the downstream membrane-disrupting effector of the RIPK1-RIPK3 necroptosis axis?","options":["LC3","MLKL","BCL-2","Caspase-9"],"answer":1,"explanation":"Activated RIPK3 phosphorylates MLKL, which oligomerizes and damages the plasma membrane."},{"type":"mcq","q":"Which receptors can serve as extrinsic triggers of necroptosis?","options":["GPCR, GM1, and MHC I","Fas only","BCR and TCR only","TNFR1, TLR3, and TLR4"],"answer":3,"explanation":"The slide lists TNFR1 and the pattern-recognition receptors TLR3 and TLR4 as extrinsic triggers."},{"type":"mcq","q":"Intrinsic necroptosis can begin when ZBP1 recognizes:","options":["Secretory IgA","Extracellular collagen","Z-form nucleic acids","MHC class I"],"answer":2,"explanation":"ZBP1-dependent recognition of Z-nucleic acids is shown as an intracellular trigger."}]}},{"page":328,"lecture":"Cell Death Pathways","slideInLecture":11,"title":"Why Necroptosis Is Inflammatory","explain":"Because necroptotic cells rupture, they release damage-associated molecular patterns, or DAMPs. T cells, dendritic cells, and macrophages can detect these signals and produce inflammatory mediators and cytokines.","mustKnow":["Necroptotic cells release DAMPs.","Immune cells detect DAMPs.","DAMP detection promotes inflammatory mediators and cytokines."],"terms":[{"term":"DAMP","meaning":"A damage-associated molecular pattern released or exposed by injured cells."},{"term":"Dendritic cell","meaning":"An immune cell specialized in sensing danger and presenting antigens."},{"term":"Inflammatory mediator","meaning":"A molecule that initiates or strengthens inflammation."}],"diagramGuide":["The left cell releases intracellular DAMPs after lytic death; the right immune cell detects DAMPs through receptors such as TLRs/RAGE and activates inflammatory signaling including NF-kB/STAT pathways."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why does the diagram predict stronger inflammation after necroptosis than after orderly apoptotic-body clearance?","options":["Lytic rupture releases DAMPs that activate immune receptors","Caspase-3 prevents all cytokine signaling","The nucleus produces bacterial LPS","Phosphatidylserine blocks phagocytosis"],"answer":0,"explanation":"Necroptotic rupture releases intracellular DAMPs that stimulate immune cells and inflammatory mediators."},{"type":"mcq","q":"Which molecules released by necroptotic cells alert immune cells to tissue damage?","options":["AB5 holotoxins","DAMPs","BH domains","MHC peptides"],"answer":1,"explanation":"Lytic membrane rupture releases damage-associated molecular patterns, or DAMPs."},{"type":"mcq","q":"Which cells are specifically listed as detecting necroptosis-derived DAMPs?","options":["T cells, dendritic cells, and macrophages","Erythrocytes, platelets, and fibroblasts","Only B cells","Only neutrophils"],"answer":0,"explanation":"The slide names T cells, dendritic cells, and macrophages as DAMP-responsive immune cells."}]}},{"page":329,"lecture":"Cell Death Pathways","slideInLecture":12,"title":"Lysosomal Degradation in Autophagy","explain":"Lysosomes contain enzymes that degrade proteins, nucleic acids, carbohydrates, and lipids. Their acidic lumen activates these enzymes. Cathepsins L, B, and D are abundant lysosomal proteases.","mustKnow":["Lysosomes contain several classes of degradative enzymes.","Low lysosomal pH activates enzyme function.","Cathepsins L, B, and D are abundant lysosomal proteases."],"terms":[{"term":"Lysosome","meaning":"An acidic organelle containing degradative enzymes."},{"term":"Cathepsin","meaning":"A lysosomal protease."},{"term":"Protease","meaning":"An enzyme that cleaves proteins."}],"diagramGuide":["Follow autophagy left to right: initiation, phagophore expansion around cargo, closed autophagosome, lysosome fusion, autolysosome degradation, and recycling.","LC3 is shown on the autophagic membrane; acidic lysosomes contain cathepsins and other hydrolases."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which step converts a cargo-containing autophagosome into a degradative compartment?","options":["Binding of Fas ligand","Activation of TLR4","Release of cytochrome c","Fusion with a lysosome"],"answer":3,"explanation":"Lysosome fusion creates an autolysosome where acidic hydrolases degrade cargo."},{"type":"mcq","q":"What activates many lysosomal degradative enzymes?","options":["High cytosolic pH","MHC class I loss","Extracellular ATP depletion","Low luminal pH"],"answer":3,"explanation":"The acidic lysosomal lumen turns on multiple degradative hydrolases."},{"type":"mcq","q":"Which cathepsins are stated to be abundant in lysosomes?","options":["8, 9, and 10","A, E, and F","L, B, and D","3, 6, and 7"],"answer":2,"explanation":"Cathepsins L, B, and D are listed at high lysosomal abundance."}]}},{"page":330,"lecture":"Cell Death Pathways","slideInLecture":13,"title":"Ferroptosis and Lipid Peroxidation","explain":"Ferroptosis is driven by iron-dependent oxidation of polyunsaturated phospholipids, producing membrane-disrupting lipid peroxides. GPX4 and glutathione, FSP1 and coenzyme Q, and DHFR-linked BH4 act as protective systems. Some therapy-resistant cancer cells remain sensitive to ferroptosis induction.","mustKnow":["Ferroptosis involves iron-dependent phospholipid peroxidation.","Lipid peroxide accumulation disrupts membranes.","GPX4 is a major protective enzyme.","Some therapy-resistant cancer cells are sensitive to ferroptosis."],"terms":[{"term":"Ferroptosis","meaning":"Regulated cell death caused by iron-dependent lipid-peroxide accumulation."},{"term":"Lipid peroxidation","meaning":"Oxidative damage to membrane lipids."},{"term":"GPX4","meaning":"A glutathione peroxidase that reduces phospholipid hydroperoxides."},{"term":"PUFA","meaning":"A polyunsaturated fatty acid that can be incorporated into oxidation-prone phospholipids."}],"diagramGuide":["The left branch builds PUFA-containing phospholipids through ACSL4/LPCAT3; iron and LOX promote lipid peroxidation and membrane damage.","Protective branches include GPX4/glutathione, FSP1/CoQ, and DHFR/BH4 systems that suppress phospholipid peroxide accumulation."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Loss of which defense would most directly permit phospholipid hydroperoxides to accumulate in the central ferroptosis pathway?","options":["Caspase-8-FLIP complex","LC3-autophagosome system","GPX4-glutathione system","Fas-FADD complex"],"answer":2,"explanation":"GPX4 uses glutathione to reduce phospholipid hydroperoxides and suppress ferroptosis."},{"type":"mcq","q":"What type of molecular damage defines ferroptosis?","options":["MHC-dependent collagen cleavage","Iron-dependent phospholipid peroxidation","Caspase-dependent DNA ligation","Antibody-dependent peptidoglycan synthesis"],"answer":1,"explanation":"Ferroptosis results from iron-dependent accumulation of phospholipid hydroperoxides."},{"type":"mcq","q":"Which enzyme is a major defense against phospholipid hydroperoxide accumulation?","options":["GPX4","Caspase-8","Coagulase","TLR4"],"answer":0,"explanation":"GPX4 reduces phospholipid hydroperoxides and suppresses ferroptotic membrane damage."}]}},{"page":331,"lecture":"Cancer Biology 1","slideInLecture":1,"title":"Lecture 32: Cancer Biology","explain":"This lecture introduces how cancer cells differ from normal cells, how the tumor microenvironment supports them, and how tumors alter metabolism and evade immunity.","mustKnow":["The lecture topic is cancer biology.","Major themes are abnormal growth, microenvironment, metabolism, and immune evasion."],"terms":[{"term":"Cancer biology","meaning":"The study of malignant cell behavior and tumor development."}],"diagramGuide":["This is a lecture divider: Cancer Biology begins here; there is no content diagram to decode."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which topic is introduced by Lecture 32?","options":["Genetic engineering","Cancer biology","Drug metabolism","Biophysical techniques"],"answer":1,"explanation":"The title slide labels Lecture 32 as Cancer Biology."}]}},{"page":332,"lecture":"Cancer Biology 1","slideInLecture":2,"title":"Origin of the Word Cancer","explain":"Hippocrates used the Greek term karkinos, meaning crab or crayfish, for cancer. The name was inspired by the appearance of a solid malignant tumor with veins spreading outward like a crab's legs.","mustKnow":["Karkinos is the Greek source of the term cancer.","The crab comparison came from the appearance of a malignant tumor and its radiating veins."],"terms":[{"term":"Karkinos","meaning":"Greek for crab or crayfish; an early term used for cancer."},{"term":"Carcinoma","meaning":"A cancer arising from epithelial tissue."},{"term":"Malignant","meaning":"Cancerous, with the capacity for destructive growth and spread."}],"diagramGuide":["Compare the radiating extensions around the tumor image with the crab's legs in the adjacent photograph.","The visual is explaining the historical name, not a biological mechanism."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Why did Hippocrates use the term karkinos for some tumors?","options":["Their cut surface had radiating veins like crab legs","They arose only in aquatic animals","They contained a hard calcium shell","They moved laterally through tissue"],"answer":0,"explanation":"Karkinos means crab or crayfish; the radiating veins resembled a crab's legs and claws."}]}},{"page":333,"lecture":"Cancer Biology 1","slideInLecture":3,"title":"Cancer Incidence and Mortality Differ","explain":"The chart compares new cases with deaths per year across cancer groups. Incidence and mortality are not the same: a common cancer may cause proportionally fewer deaths, while another category may have fewer cases but a closer death count.","mustKnow":["Incidence means new cases; mortality means deaths.","Cancer types differ in both frequency and lethality.","A high incidence does not automatically mean equally high mortality."],"terms":[{"term":"Incidence","meaning":"The number of new cases occurring in a defined period."},{"term":"Mortality","meaning":"The number of deaths occurring in a defined period."},{"term":"Carcinoma","meaning":"An epithelial cancer; several organ groups in the chart are carcinomas."}],"diagramGuide":["Green bars represent new cases per year; blue bars represent deaths per year.","Do not rank cancers from one bar alone: incidence and mortality are separate quantities.","Digestive-organ cancers have the longest incidence bar, while respiratory cancers show a relatively large death burden."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which category in the chart combines high incidence with a particularly large annual death count?","options":["Skin melanoma","Endocrine-system cancers","Bone and soft-tissue cancers","Respiratory-system cancers"],"answer":3,"explanation":"The respiratory-system row has one of the largest blue death bars and a high green incidence bar."},{"q":"In the cancer chart, what does incidence measure?","options":["Deaths per year","New cases per year","Five-year survival","Metastatic cases only"],"answer":1,"explanation":"Incidence is the number of new cases, whereas mortality is the number of deaths."}]}},{"page":334,"lecture":"Cancer Biology 1","slideInLecture":4,"title":"Three Defining Cancer Behaviors","explain":"Cancer cells can proliferate without normal growth-factor control, invade through extracellular matrix and basement membranes, and metastasize from the primary tumor to other sites.","mustKnow":["Proliferation can continue without normal growth signals.","Invasion is penetration into surrounding tissue.","Metastasis is spread from the primary tumor to another site."],"terms":[{"term":"Proliferation","meaning":"Increase in cell number through cell division."},{"term":"Invasion","meaning":"Movement of cancer cells into surrounding tissue."},{"term":"Metastasis","meaning":"Spread of cancer cells from the primary tumor to other sites."},{"term":"ECM","meaning":"Extracellular matrix, the material surrounding and supporting cells."}],"diagramGuide":["Read the duct sequence left to right: normal duct, contained benign tumor, then malignant cells crossing the basal lamina.","The body scan illustrates distant tumor deposits, linking local escape to metastasis."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which event distinguishes the malignant duct in the diagram from the benign tumor?","options":["Cells stop proliferating","Cells restore contact inhibition","Cells breach the basal lamina","Cells remain confined to the lumen"],"answer":2,"explanation":"The malignant-stage cells cross the tissue boundary, which is invasion."},{"q":"Which term specifically describes cancer cells penetrating the extracellular matrix and basement membrane?","options":["Differentiation","Invasion","Angiogenesis","Proliferation"],"answer":1,"explanation":"Invasion is local penetration through extracellular matrix and basement membranes."},{"q":"Spread of cancer cells from a primary tumor to a distant organ is called:","options":["Apoptosis","Senescence","Metastasis","Hyperplasia"],"answer":2,"explanation":"Metastasis is spread from the original primary tumor to another site."}]}},{"page":335,"lecture":"Cancer Biology 1","slideInLecture":5,"title":"Loss of Growth and Death Controls","explain":"Normal tissue homeostasis balances cell division with apoptosis. A tumor can form through increased division, decreased apoptosis, or both. Transformed cells also lose contact inhibition and can survive after leaving their normal tissue position.","mustKnow":["Homeostasis requires balanced division and cell death.","More division or less apoptosis can expand a tumor.","Transformed cells lose contact inhibition.","Cancer cells may bypass anchorage-dependent survival controls."],"terms":[{"term":"Contact inhibition","meaning":"Normal suppression of cell proliferation when cells contact neighbors."},{"term":"Anchorage dependence","meaning":"The normal requirement for attachment to a suitable surface or matrix for survival."},{"term":"Transformation","meaning":"Acquisition of abnormal growth properties by a cell."}],"diagramGuide":["The left schemes show that either increased division or reduced apoptosis can expand cell number.","The upper-right diagram links loss of anchorage dependence to apical extrusion and survival outside the normal layer.","The lower culture images contrast contact-inhibited normal cells with piled-up transformed foci."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which culture phenotype most directly indicates loss of contact inhibition?","options":["Cells maintain equal division and apoptosis","Cells form dense multilayered foci","Cells stop at a confluent monolayer","Cells undergo anoikis after detachment"],"answer":1,"explanation":"Transformed cells continue growing after contact and pile into foci."},{"q":"Which pair of changes can independently increase tumor cell number?","options":["Increased repair and reduced mutation","Reduced division and increased apoptosis","Increased division and reduced apoptosis","Reduced adhesion and increased differentiation"],"answer":2,"explanation":"Either increased cell division or decreased apoptosis shifts tissue homeostasis toward cell accumulation."},{"q":"Piling up of transformed cells in culture most directly demonstrates loss of:","options":["Anchorage dependence","Contact inhibition","DNA replication","Growth-factor receptors"],"answer":1,"explanation":"Normal cells stop dividing when they contact neighbors; transformed cells can lose this contact inhibition and form foci."}]}},{"page":336,"lecture":"Cancer Biology 1","slideInLecture":6,"title":"The Tumor Microenvironment","explain":"A tumor contains malignant cells plus a nonmalignant stroma of fibroblasts, immune cells, endothelial cells, and other support cells. Cancer-associated fibroblasts remodel extracellular matrix and release components that influence tumor growth, invasion, inflammation, and angiogenesis.","mustKnow":["Tumor stroma is nonmalignant supporting tissue.","Stroma includes fibroblasts, immune cells, and endothelial cells.","Cancer-associated fibroblasts promote several aspects of progression."],"terms":[{"term":"Stroma","meaning":"The nonmalignant cells and supporting tissue surrounding tumor cells."},{"term":"CAF","meaning":"A carcinoma-associated fibroblast altered to support tumor progression."},{"term":"Angiogenesis","meaning":"Formation of new blood vessels."}],"diagramGuide":["The central tumor is embedded in stroma containing immune cells, fibroblasts, vessels, pericytes, lymphatics, and extracellular matrix.","CAFs are shown adjacent to tumor cells because they remodel matrix and secrete signals that support progression."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which labeled stromal cell is specifically activated into a tumor-supporting CAF?","options":["Fibroblast","Pericyte","Endothelial cell","Tumor-associated lymphocyte"],"answer":0,"explanation":"Carcinoma-associated fibroblasts arise from activated fibroblasts."},{"q":"Which cell type is part of tumor stroma rather than the malignant population?","options":["Metastatic clone","Tumor-initiating cell","Mutant epithelial cancer cell","Cancer-associated fibroblast"],"answer":3,"explanation":"Fibroblasts, immune cells, and endothelial cells are nonmalignant stromal components."},{"q":"Cancer-associated fibroblasts directly promote tumor progression by remodeling the:","options":["Ribosomal subunit","Mitotic spindle","Nuclear envelope","Extracellular matrix"],"answer":3,"explanation":"CAFs remodel extracellular matrix and secrete factors affecting growth, invasion, inflammation, and angiogenesis."}]}},{"page":337,"lecture":"Cancer Biology 1","slideInLecture":7,"title":"Hypoxia Activates HIF Signaling","explain":"Tumor regions farther from blood vessels receive less oxygen and can become hypoxic or necrotic. In normal oxygen, HIF-alpha is hydroxylated, recognized by VHL, ubiquitinated, and degraded. In hypoxia, HIF-alpha survives, enters the nucleus with HIF-beta, and activates genes for responses such as angiogenesis, metabolism, and erythropoiesis.","mustKnow":["Oxygen falls with distance from tumor blood vessels.","Normoxia promotes VHL-dependent HIF-alpha degradation.","Hypoxia stabilizes HIF-alpha.","HIF activates adaptive genes including angiogenesis and metabolism genes."],"terms":[{"term":"Hypoxia","meaning":"A condition of low oxygen availability."},{"term":"HIF","meaning":"Hypoxia-inducible factor, a transcription factor activated under low oxygen."},{"term":"VHL","meaning":"A protein that helps target hydroxylated HIF-alpha for degradation in oxygenated cells."},{"term":"Ubiquitination","meaning":"Attachment of ubiquitin that can mark a protein for proteasomal degradation."}],"diagramGuide":["Oxygen falls with distance from the blood vessel: oxygenated rim, hypoxic zone, then necrotic core.","Under normoxia, hydroxylated HIF-alpha is recognized by VHL, ubiquitinated, and degraded.","Under hypoxia, HIF-alpha escapes degradation, enters the nucleus with HIF-beta, and activates response genes."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Loss of which step allows HIF-alpha to accumulate during hypoxia?","options":["Binding to HIF-beta","DNA binding in the nucleus","Transcription of angiogenic genes","Oxygen-dependent hydroxylation"],"answer":3,"explanation":"Hydroxylation is the oxygen-dependent mark that enables VHL recognition and degradation."},{"q":"Under normal oxygen, hydroxylated HIF-alpha is recognized by which protein before degradation?","options":["PD-L1","VHL","HIF-beta","VEGF"],"answer":1,"explanation":"VHL recognizes hydroxylated HIF-alpha and directs its ubiquitination and degradation."},{"q":"In hypoxia, stabilized HIF-alpha enters the nucleus and pairs with:","options":["HIF-beta","VHL","Ubiquitin","Lactate dehydrogenase"],"answer":0,"explanation":"HIF-alpha dimerizes with HIF-beta to activate hypoxia-response genes."}]}},{"page":338,"lecture":"Cancer Biology 1","slideInLecture":8,"title":"Fates of Pyruvate","explain":"Glycolysis converts glucose to pyruvate. Under aerobic conditions, pyruvate becomes acetyl-CoA and is oxidized through the citric acid cycle. Under hypoxic or anaerobic conditions, pyruvate can be reduced to lactate, regenerating NAD+, or converted to ethanol and carbon dioxide in yeast.","mustKnow":["Glycolysis produces pyruvate from glucose.","Aerobic pyruvate enters acetyl-CoA and the citric acid cycle.","Lactate fermentation regenerates NAD+.","Yeast can produce ethanol and carbon dioxide."],"terms":[{"term":"Glycolysis","meaning":"The pathway that converts glucose into pyruvate."},{"term":"Fermentation","meaning":"A pathway that regenerates NAD+ without oxygen-dependent respiration."},{"term":"Lactate dehydrogenase","meaning":"The enzyme that interconverts pyruvate and lactate while interconverting NADH and NAD+."},{"term":"Acetyl-CoA","meaning":"A metabolic intermediate that enters the citric acid cycle."}],"diagramGuide":["All routes begin with glucose-to-pyruvate glycolysis.","Aerobic pyruvate enters acetyl-CoA and the citric-acid cycle; anaerobic branches regenerate NAD+ through lactate or ethanol formation.","The lactate branch uses lactate dehydrogenase; the yeast branch releases carbon dioxide."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which product is formed from pyruvate in vigorously contracting muscle under low oxygen?","options":["Ethanol plus carbon dioxide","Oxaloacetate","Lactate","Acetyl-CoA"],"answer":2,"explanation":"The diagram assigns lactate fermentation to muscle and erythrocytes."},{"q":"Which anaerobic pyruvate product is accompanied by carbon dioxide release in yeast?","options":["Acetyl-CoA","Ethanol","Oxaloacetate","Lactate"],"answer":1,"explanation":"Yeast fermentation converts pyruvate to ethanol and carbon dioxide."}]}},{"page":339,"lecture":"Cancer Biology 1","slideInLecture":9,"title":"The Warburg Effect","explain":"Cancer cells often favor conversion of pyruvate to lactate even when oxygen is available. This metabolic reprogramming regenerates NAD+, which supports continued conversion of glucose to pyruvate through glycolysis.","mustKnow":["The Warburg effect is high lactate-producing glycolysis in cancer cells despite oxygen availability.","Pyruvate-to-lactate conversion consumes NADH and regenerates NAD+.","Regenerated NAD+ supports continued glycolysis."],"terms":[{"term":"Warburg effect","meaning":"Preference of many cancer cells for lactate-producing glycolysis even in oxygen."},{"term":"Metabolic reprogramming","meaning":"A change in how cells obtain and use energy and biosynthetic materials."},{"term":"NAD+","meaning":"An oxidized electron carrier required for a step in glycolysis."}],"diagramGuide":["The differentiated cell sends most pyruvate to oxidative phosphorylation; the tumor cell emphasizes glucose uptake and lactate export despite oxygen.","MCT exports lactate; GLUTs import glucose.","Lactate-associated signaling in the center links the metabolic shift to angiogenesis, invasion, inflammation, and progression."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What is the immediate redox benefit of pyruvate-to-lactate conversion in a tumor cell?","options":["Formation of acetyl-CoA","Regeneration of NAD+","Production of FADH2","Consumption of ATP"],"answer":1,"explanation":"Lactate dehydrogenase oxidizes NADH to NAD+, sustaining glycolysis."},{"q":"The Warburg effect describes high lactate production by cancer cells even when what is available?","options":["NADH","Pyruvate","Glucose","Oxygen"],"answer":3,"explanation":"Cancer cells can favor lactate-producing glycolysis despite oxygen availability."},{"q":"Which transporter class is shown importing glucose into the tumor cell?","options":["SGLT-only","MCT","GLUT","ABC"],"answer":2,"explanation":"GLUT transporters import glucose, whereas MCT is shown exporting lactate."}]}},{"page":340,"lecture":"Cancer Biology 1","slideInLecture":10,"title":"Ways Tumors Evade Immunity","explain":"CD8 T cells normally recognize tumor antigens displayed by MHC. Tumors can evade this response by losing tumor antigens or MHC, expressing nonclassical HLA molecules, delivering inhibitory signals to T cells, releasing suppressive cytokines, or building an immunosuppressive microenvironment with cells such as Treg and MDSC.","mustKnow":["Loss of antigen or MHC reduces T-cell recognition.","Inhibitory ligands and cytokines suppress T-cell activity.","Treg and MDSC contribute to an immunosuppressive microenvironment."],"terms":[{"term":"MHC","meaning":"A cell-surface molecule that presents peptide antigens to T cells."},{"term":"Treg","meaning":"A regulatory T cell that can suppress immune responses."},{"term":"MDSC","meaning":"A myeloid-derived suppressor cell that inhibits antitumor immunity."},{"term":"Immune evasion","meaning":"Avoidance or suppression of immune recognition and attack."}],"diagramGuide":["Panel A is effective anti-tumor immunity: antigen-MHC recognition activates a CD8 T cell.","Panels B-D show three escape levels: failed recognition, direct T-cell inhibition, and a suppressive microenvironment.","Treg and MDSC are placed in the suppressive microenvironment panel."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A tumor retains antigen presentation but expresses an inhibitory ligand that suppresses the CD8 T cell. Which evasion class is shown?","options":["T-cell inhibition","Loss of tumor antigen","Loss of MHC expression","Recruitment failure of fibroblasts"],"answer":0,"explanation":"An inhibitory ligand-receptor interaction belongs to the T-cell-inhibition mechanism in panel C."},{"q":"Loss of which surface molecule can prevent a CD8 T cell from recognizing a tumor antigen?","options":["MHC","Integrin","Cadherin","Collagen"],"answer":0,"explanation":"Tumor antigen must be presented by MHC for recognition by the T-cell receptor."},{"q":"Which two cell types are specifically associated with an immunosuppressive tumor microenvironment?","options":["Treg and MDSC","B cells and platelets","Fibroblasts and osteoclasts","Neutrophils and erythrocytes"],"answer":0,"explanation":"The slide places regulatory T cells and myeloid-derived suppressor cells in the suppressive microenvironment."}]}},{"page":341,"lecture":"Cancer Biology 1","slideInLecture":11,"title":"PD-1 and PD-L1 Checkpoint Blockade","explain":"PD-L1 on a tumor or immune cell binds PD-1 on a T cell and lowers T-cell activity. Anti-PD-1 or anti-PD-L1 antibodies block this inhibitory interaction, increasing T-cell activity and promoting tumor-cell death.","mustKnow":["PD-1 is shown on the T cell.","PD-L1 binding suppresses T-cell activity.","Blocking PD-1 or PD-L1 can restore antitumor T-cell activity."],"terms":[{"term":"PD-1","meaning":"An inhibitory checkpoint receptor on T cells."},{"term":"PD-L1","meaning":"A ligand that can inhibit T cells by binding PD-1."},{"term":"Checkpoint inhibitor","meaning":"A therapy that blocks an inhibitory immune-receptor interaction."},{"term":"TCR","meaning":"The T-cell receptor that recognizes antigen presented by MHC."}],"diagramGuide":["Left: PD-L1 binding PD-1 suppresses T-cell activity even while MHC engages the TCR.","Right: anti-PD-1 or anti-PD-L1 interrupts the checkpoint and restores T-cell activity.","The antibodies do not replace antigen recognition; they remove an inhibitory signal."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which pairing is directly disrupted by checkpoint-blocking antibodies in the figure?","options":["TCR-MHC","CD8-MHC I","EGF-EGFR","PD-1-PD-L1"],"answer":3,"explanation":"The therapeutic antibodies block the PD-1:PD-L1 inhibitory interaction."},{"q":"PD-1 is displayed on which cell in the checkpoint diagram?","options":["Fibroblast","Endothelial cell","Tumor cell","T cell"],"answer":3,"explanation":"PD-1 is the inhibitory receptor on the T cell; PD-L1 is its ligand on tumor or immune cells."},{"q":"Checkpoint-blocking antibodies restore antitumor activity primarily by removing:","options":["T-cell receptor specificity","MHC presentation","An inhibitory T-cell signal","Tumor antigen expression"],"answer":2,"explanation":"Anti-PD-1 or anti-PD-L1 blocks an inhibitory interaction; it does not replace antigen recognition."}]}},{"page":342,"lecture":"Cancer Biology 2 and Drug Development","slideInLecture":1,"title":"Lecture 33: Cancer and Drug Development","explain":"This lecture continues cancer genetics and then introduces principles of drug formulation and absorption.","mustKnow":["The lecture connects cancer biology with drug development.","The first section covers oncogenes, tumor suppressors, and p53."],"terms":[{"term":"Drug development","meaning":"The process of turning a therapeutic idea into a usable medicine."}],"diagramGuide":["This divider starts Lecture 33, which bridges Cancer Biology and Drug Development."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which two subject areas are joined in Lecture 33?","options":["Genetic engineering and motors","Stem cells and host defense","Cancer biology and drug development","Immunology and bioenergetics"],"answer":2,"explanation":"Both subjects are printed on the title slide."}]}},{"page":343,"lecture":"Cancer Biology 2 and Drug Development","slideInLecture":2,"title":"Cancer Develops Through Accumulated Changes","explain":"Cancer development is linked to mutagenesis. Chemical carcinogens can alter nucleotide sequences, X-rays can cause chromosome breaks and translocations, and UV light can damage specific DNA bases. A cancer usually emerges only after multiple rare genetic and epigenetic changes accumulate in descendants of one cell.","mustKnow":["Chemical carcinogens, X-rays, and UV light damage DNA in different ways.","Cancer usually requires multiple independent changes.","The altered lineage begins from a single cell.","Both genetic and epigenetic changes can contribute."],"terms":[{"term":"Mutagenesis","meaning":"Production of changes in genetic material."},{"term":"Carcinogen","meaning":"An agent that promotes cancer development."},{"term":"Translocation","meaning":"A chromosome rearrangement in which a segment moves to a new location."},{"term":"Epigenetic change","meaning":"A heritable change in gene activity that does not require a DNA-sequence change."}],"diagramGuide":["Left: sequential mutant-cell production and clonal proliferation culminate in invasive growth.","Center: chromosome mis-segregation creates aneuploid daughter cells.","Right: lagging chromosomes can form micronuclei and undergo chromothripsis."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which carcinogen-effect pairing matches the slide?","options":["X-rays - specific thymine dimers only","X-rays - chromosome breaks and translocations","UV light - whole-genome duplication","Chemical carcinogens - spindle assembly only"],"answer":1,"explanation":"The slide assigns chromosome breaks and translocations to radiation such as X-rays."},{"q":"Which carcinogen is associated with chromosome breaks and translocations?","options":["Ultraviolet light","X-rays","Chemical carcinogens only","Visible light"],"answer":1,"explanation":"The slide associates X-rays with chromosome breaks and translocations."},{"q":"Cancer development typically requires the accumulation of:","options":["Multiple rare genetic and epigenetic changes in one lineage","Only epigenetic changes in stromal cells","A single chromosome duplication","One common mutation in many unrelated cells"],"answer":0,"explanation":"A substantial number of independent rare genetic and epigenetic accidents accumulate in descendants of one cell."}]}},{"page":344,"lecture":"Cancer Biology 2 and Drug Development","slideInLecture":3,"title":"Oncogenes Versus Tumor Suppressors","explain":"A proto-oncogene becomes an oncogene through an activating gain-of-function change, and one altered copy can promote transformation. Tumor-suppressor loss is usually recessive at the cellular level: one working copy can remain protective, so both copies generally must be inactivated. Proto-oncogenes can be activated by coding or regulatory mutations, gene amplification, or chromosome rearrangement.","mustKnow":["Oncogene activation is a gain of function.","One activating oncogene mutation can be sufficient.","Tumor-suppressor inactivation is a loss of function.","Both tumor-suppressor copies generally must be lost."],"terms":[{"term":"Proto-oncogene","meaning":"A normal gene that can become cancer-promoting when overactivated."},{"term":"Oncogene","meaning":"An activated gene that promotes uncontrolled growth or transformation."},{"term":"Tumor-suppressor gene","meaning":"A gene whose normal function restrains cancer development."},{"term":"Gene amplification","meaning":"An increase in gene-copy number that can increase gene product."}],"diagramGuide":["Top left: a single activating mutation can convert a proto-oncogene into an oncogene.","Top right: tumor-suppressor loss generally requires two inactivating events.","Bottom: proto-oncogenes can be activated by coding mutation, regulatory mutation, amplification, or rearrangement."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which alteration can activate a proto-oncogene without changing its coding sequence?","options":["Gene amplification","Loss of both alleles","Promoter deletion that abolishes expression","Nonsense mutation causing truncation and decay"],"answer":0,"explanation":"Amplification increases production of a normal proto-oncogene product."},{"q":"At the cellular level, activation of an oncogene is generally:","options":["A dominant loss of function","A recessive gain of function","A recessive loss of function","A dominant gain of function"],"answer":3,"explanation":"One activating copy of a proto-oncogene can be sufficient to promote transformation."},{"q":"Why are two inactivating events generally required for a tumor-suppressor gene?","options":["Only amplified genes are expressed","Both copies usually must lose function","Tumor suppressors are mitochondrial","Each copy encodes a different protein"],"answer":1,"explanation":"One functional tumor-suppressor copy can remain protective, so both copies generally must be inactivated."}]}},{"page":345,"lecture":"Cancer Biology 2 and Drug Development","slideInLecture":4,"title":"EGFR and RAS Proto-Oncogenes","explain":"Normal EGFR signaling begins when EGF binds the receptor's extracellular domain, leading to phosphorylation of its intracellular domain. Truncation or other activating mutations can cause inappropriate receptor activation. RAS-family GTPases—HRAS, NRAS, and KRAS—are also proto-oncogene products.","mustKnow":["EGF binding activates EGFR phosphorylation and signaling.","EGFR truncation can produce inappropriate hyperactivation.","HRAS, NRAS, and KRAS are RAS GTPases."],"terms":[{"term":"EGFR","meaning":"Epidermal growth factor receptor, a signaling receptor that can become oncogenic."},{"term":"Hyperphosphorylation","meaning":"Excessive phosphorylation associated here with inappropriate receptor activation."},{"term":"RAS GTPase","meaning":"A molecular switch protein that signals in a GTP-bound state."},{"term":"Activating mutation","meaning":"A mutation that increases or inappropriately turns on protein function."}],"diagramGuide":["EGF binding induces receptor phosphorylation; extracellular-domain truncation produces ligand-independent phosphorylation.","RAS is OFF when GDP-bound and ON when GTP-bound.","RAS GAP accelerates return to the GDP-bound OFF state."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which molecular state represents active RAS in the diagram?","options":["GDP-bound RAS","RAS bound only to GAP","Unphosphorylated EGFR","GTP-bound RAS"],"answer":3,"explanation":"The figure marks RAS-GTP as ON and RAS-GDP as OFF."},{"q":"Normal EGFR signaling begins when EGF binds the receptor's:","options":["Intracellular kinase domain","Extracellular domain","Nuclear localization signal","Cytoskeletal tail"],"answer":1,"explanation":"EGF binds extracellularly and induces phosphorylation of the intracellular domain."},{"q":"Which protein accelerates conversion of active GTP-bound RAS to inactive GDP-bound RAS?","options":["EGFR","p21","MDM2","RAS GAP"],"answer":3,"explanation":"RAS GAP accelerates GTP hydrolysis and returns RAS to its GDP-bound OFF state."}]}},{"page":346,"lecture":"Cancer Biology 2 and Drug Development","slideInLecture":5,"title":"p53 Stops the Cell Cycle After DNA Damage","explain":"DNA damage raises p53 activity. As a transcription factor, p53 increases p21 expression. p21 inhibits cyclin-CDK complexes, pausing the cell cycle while repair occurs. Cancer-associated p53 mutations commonly disable this transcriptional tumor-suppressor function.","mustKnow":["DNA damage induces p53.","p53 upregulates p21.","p21 inhibits cyclin-CDK and arrests the cell cycle.","Cancer mutations often inactivate p53."],"terms":[{"term":"p53","meaning":"A tumor-suppressor transcription factor activated by cellular damage."},{"term":"p21","meaning":"A p53-induced inhibitor of cyclin-CDK activity."},{"term":"CDK","meaning":"A cyclin-dependent kinase that helps drive cell-cycle progression."},{"term":"Cell-cycle arrest","meaning":"A temporary or permanent stop in cell-cycle progression."}],"diagramGuide":["The cell-cycle wheel places p21 downstream of p53 and upstream of cyclin-CDK inhibition.","The protein structure maps cancer-associated and anticancer mutations to different positions.","Follow the causal chain: DNA damage -> p53 -> p21 -> CDK/cyclin inhibition -> arrest."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which change would most directly defeat p53-mediated cell-cycle arrest after DNA damage?","options":["Reduced cyclin-CDK activity","Activation of a checkpoint kinase","Loss of p21 induction","Increased DNA repair"],"answer":2,"explanation":"p21 is the p53-induced inhibitor that shuts down cyclin-CDK activity."},{"q":"Which protein is transcriptionally upregulated by p53 to arrest the cell cycle?","options":["RAS","EGFR","p21","MDM2 only"],"answer":2,"explanation":"p53 induces p21, which inhibits cyclin-CDK complexes."},{"q":"p21 arrests the cell cycle by inhibiting:","options":["BAX-BAK complexes","HIF-VHL complexes","Cyclin-CDK complexes","PD-1-PD-L1 complexes"],"answer":2,"explanation":"p21 inhibits cyclin-dependent kinase/cyclin activity after DNA damage."}]}},{"page":347,"lecture":"Cancer Biology 2 and Drug Development","slideInLecture":6,"title":"MDM2 and MDMX Restrain p53","explain":"MDM2 and MDMX bind p53 and inhibit its transcriptional activity. MDM2 also promotes p53 nuclear export, ubiquitination, and proteasomal degradation, reducing expression of p53 target genes responsible for tumor suppression.","mustKnow":["MDM2 and MDMX are negative regulators of p53.","Both can inhibit p53 transcriptional activity.","MDM2 promotes p53 ubiquitination and proteasomal degradation."],"terms":[{"term":"MDM2","meaning":"A p53-binding negative regulator that promotes p53 ubiquitination and degradation."},{"term":"MDMX","meaning":"A p53-binding negative regulator that suppresses p53 transcriptional activity."},{"term":"Proteasomal degradation","meaning":"Destruction of a tagged protein by the proteasome."},{"term":"Nuclear export","meaning":"Movement of a molecule from the nucleus to the cytoplasm."}],"diagramGuide":["At the DNA, both p53-MDMX and p53-MDM2 complexes inhibit p53 transcriptional activity.","MDM2 additionally drives nuclear export, ubiquitination, and proteasomal degradation of p53.","The arrows form a route from nuclear p53 to cytoplasmic destruction."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which MDM2 action is not shown as the principal action of MDMX in this diagram?","options":["Reducing p53 target-gene expression","Promoting p53 ubiquitination and proteasomal degradation","Binding p53","Inhibiting p53 transcriptional activity"],"answer":1,"explanation":"The slide assigns the ubiquitination/export/degradation route specifically to MDM2."},{"q":"Which negative regulator promotes both nuclear export and proteasomal degradation of p53?","options":["MDMX","MDM2","p21","BCL-2"],"answer":1,"explanation":"MDM2 promotes p53 nuclear export, ubiquitination, and proteasomal degradation."},{"q":"A shared effect of MDM2 and MDMX on p53 is inhibition of its:","options":["DNA sequence","Translation by ribosomes","Mitochondrial import","Transcriptional activity"],"answer":3,"explanation":"Both regulators can bind p53 and suppress its transcriptional activity."}]}},{"page":348,"lecture":"Cancer Biology 2 and Drug Development","slideInLecture":7,"title":"MDMX Modulates MDM2 Activity","explain":"MDMX binds p53 and blocks its transcriptional activity. It can also form a heterodimer with MDM2, enhancing MDM2's E3 activity toward p53 and strengthening p53 degradation. The MDM2-MDMX interaction also changes the stability and ubiquitination of the regulators themselves.","mustKnow":["MDMX directly inhibits p53 transcriptional activity.","MDMX forms a heterodimer with MDM2.","The heterodimer strengthens ubiquitination of p53.","MDM2 and MDMX also regulate each other's stability."],"terms":[{"term":"Heterodimer","meaning":"A complex made from two different protein subunits."},{"term":"E3 activity","meaning":"Ubiquitin-ligase activity that helps attach ubiquitin to selected targets."},{"term":"Self-ubiquitination","meaning":"Attachment of ubiquitin to the ubiquitin ligase itself."},{"term":"Transactivation domain","meaning":"A transcription-factor region that helps activate target-gene expression."}],"diagramGuide":["Upper branch: MDMX binds p53 and inhibits transcription.","Middle branch: an MDMX-MDM2 heterodimer has stronger E3 activity toward p53 than MDM2 alone.","Lower branches show reciprocal effects on MDM2 and MDMX ubiquitination and stability."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"What is the consequence of forming the MDM2-MDMX heterodimer shown in the central branch?","options":["Enhanced E3 activity toward p53","Loss of all p53 binding","Activation of p53 transcription","Conversion of MDM2 into a kinase"],"answer":0,"explanation":"The heterodimer is labeled as having stronger E3 activity than MDM2 alone."},{"q":"Formation of an MDM2-MDMX heterodimer strengthens which activity toward p53?","options":["DNA-polymerase activity","Phosphatase activity","Kinase activity","E3 ubiquitin-ligase activity"],"answer":3,"explanation":"The heterodimer enhances E3 activity and p53 ubiquitination."}]}},{"page":349,"lecture":"Cancer Biology 2 and Drug Development","slideInLecture":8,"title":"What Oral Tablets and Capsules Contain","explain":"Only about 5-10% of an oral formulation may be active pharmaceutical ingredient. Much of the rest consists of fillers, lubricants, glidants, and materials that help the dose disintegrate and dissolve. Hard capsules carry dry powders or pellets, while soft capsules are suited to oils or drug dissolved or suspended in oil.","mustKnow":["API may form only 5-10% of an oral product.","Excipients support manufacturing, disintegration, and dissolution.","Hard capsules hold dry powders or pellets.","Soft capsules are used for oils or oil-based contents."],"terms":[{"term":"API","meaning":"Active pharmaceutical ingredient, the component producing the intended drug effect."},{"term":"Excipient","meaning":"A non-active formulation component such as a filler, lubricant, or glidant."},{"term":"Disintegration","meaning":"Breaking of a tablet or capsule contents into smaller pieces."},{"term":"Dissolution","meaning":"Movement of drug molecules into solution."}],"diagramGuide":["The percentage labels contrast a small API fraction with a much larger excipient fraction.","Hard capsules are paired with powders or pellets; soft capsules with oils or oil-based drug.","The structures and packages are examples, not a reaction pathway."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which dosage-form pairing is correct?","options":["Hard capsule - exclusively volatile liquid","Tablet - approximately 90% API","Soft capsule - dry miniature pellets only","Soft capsule - API dissolved or suspended in oil"],"answer":3,"explanation":"The slide assigns oils and oil-based formulations to soft-shelled capsules."},{"q":"Approximately what fraction of an oral tablet may be active pharmaceutical ingredient?","options":["90-95%","5-10%","25-35%","50-60%"],"answer":1,"explanation":"The slide states that API may comprise only about 5-10% of the formulation."},{"q":"Which capsule type is best matched with oils or drug dissolved in oil?","options":["Hard-shelled capsule","Soft-shelled capsule","Enteric tablet","Compressed lozenge"],"answer":1,"explanation":"Soft-shelled capsules are used for oils and oil-based solutions or suspensions."}]}},{"page":350,"lecture":"Cancer Biology 2 and Drug Development","slideInLecture":9,"title":"Steps Limiting Oral Drug Absorption","explain":"After an oral dose, the formulation must disintegrate and the drug must dissolve, cross the gastrointestinal wall, and enter the portal vein. Gut-wall and liver metabolism can remove part of the dose before it reaches systemic circulation. The fraction that reaches circulation contributes to bioavailability.","mustKnow":["Disintegration and dissolution occur before absorption.","Drug crosses the gastrointestinal wall into portal blood.","Gut-wall and hepatic metabolism can reduce the amount reaching circulation.","Bioavailability reflects drug reaching systemic circulation."],"terms":[{"term":"Absorption","meaning":"Movement of a drug from its administration site into the bloodstream."},{"term":"Portal vein","meaning":"The vessel carrying absorbed gastrointestinal contents to the liver."},{"term":"Hepatic metabolism","meaning":"Chemical processing of a drug by the liver."},{"term":"Bioavailability","meaning":"The fraction of an administered dose that reaches systemic circulation."}],"diagramGuide":["Follow the route: dosage form -> disintegration/dissolution -> GI preparation -> portal vein -> liver -> hepatic vein/systemic circulation.","Side arrows mark losses by fecal excretion, gut-wall metabolism, and hepatic metabolism.","Bioavailability is assessed after these pre-systemic losses."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which route exposes an absorbed oral drug to hepatic metabolism before systemic circulation?","options":["Lymphatic vessel to kidney","Aorta to stomach","Portal vein to liver","Hepatic vein to intestine"],"answer":2,"explanation":"GI absorption drains into the portal vein and then the liver."},{"q":"Which sequence correctly orders early events after swallowing a tablet?","options":["Disintegration -> dissolution -> absorption","Dissolution -> hepatic metabolism -> disintegration","Portal entry -> disintegration -> dissolution","Absorption -> dissolution -> disintegration"],"answer":0,"explanation":"The dosage form first disintegrates, the drug dissolves, and dissolved drug is then absorbed."},{"q":"Which two sites can remove orally absorbed drug before it reaches systemic circulation?","options":["Kidney and bladder","Muscle and bone","Lung and skin","Gut wall and liver"],"answer":3,"explanation":"Pre-systemic loss can occur through gut-wall metabolism and hepatic first-pass metabolism."}]}},{"page":351,"lecture":"Cancer Biology 2 and Drug Development","slideInLecture":10,"title":"Drug Administration Routes","explain":"The route of administration controls where a drug enters the body and how quickly or directly it reaches its target. IV delivery enters the bloodstream directly, while routes such as oral, intramuscular, subcutaneous, inhaled, topical, transdermal, sublingual, epidural, and rectal delivery use different tissues for absorption.","mustKnow":["IV delivery avoids breakdown in the digestive tract.","Intramuscular delivery can be absorbed rapidly because muscle has many blood vessels.","Subcutaneous delivery is used for drugs such as insulin and monoclonal antibodies.","Transdermal patches provide controlled delivery through the skin."],"terms":[{"term":"IV","meaning":"Intravenous delivery directly into a vein."},{"term":"IM","meaning":"Intramuscular injection into muscle."},{"term":"SC","meaning":"Subcutaneous injection below the dermis and epidermis."},{"term":"Sublingual","meaning":"Delivery under the tongue for absorption through the mucous membrane."}],"diagramGuide":["Use the body map to distinguish local routes from routes entering blood rapidly.","IV is intravascular; IM enters vascular muscle; SC is below dermis; sublingual crosses oral mucosa.","Transdermal patches emphasize controlled delivery, unlike topical preparations intended mainly for local action."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which route is paired with direct entry into venous circulation through oral mucosa?","options":["Otic","Sublingual","Topical","Intramuscular"],"answer":1,"explanation":"The slide states that sublingual drugs cross the mucous membrane and enter venous circulation."},{"q":"Which route is commonly used for insulin because intestinal absorption is difficult?","options":["Rectal","Subcutaneous","Otic","Topical"],"answer":1,"explanation":"The slide lists insulin and monoclonal antibodies as examples of subcutaneous delivery."},{"q":"A nicotine patch is an example of which administration route?","options":["Topical local delivery","Transdermal controlled delivery","Intramuscular delivery","Sublingual delivery"],"answer":1,"explanation":"A transdermal patch provides controlled drug delivery through skin into the bloodstream."}]}},{"page":352,"lecture":"Cancer Biology 2 and Drug Development","slideInLecture":11,"title":"ADME Properties","explain":"ADME summarizes what the body does to a drug: it is absorbed into blood, distributed to tissues, chemically modified by metabolism, and removed by excretion. These stages determine how much active drug reaches its target and how long it remains in the body.","mustKnow":["Absorption moves a drug from its administration site into blood.","Distribution moves the drug from blood into tissues.","Metabolism can inactivate a drug or activate a prodrug.","Excretion occurs mainly through the kidneys, but also through bile and other routes."],"terms":[{"term":"ADME","meaning":"Absorption, distribution, metabolism, and excretion."},{"term":"Bioavailability","meaning":"The fraction of an administered drug that reaches systemic circulation."},{"term":"CYP450","meaning":"A major enzyme family involved in drug metabolism."}],"diagramGuide":["Read ADME vertically as a sequence, but note that each box has distinct determinants.","Distribution is governed by blood flow, size, lipophilicity, and plasma-protein interaction.","Metabolism is mainly CYP450-mediated; excretion is mainly renal, with several secondary routes."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which property is listed as a determinant of distribution rather than absorption?","options":["Plasma-protein interaction","Dosage form","Route of administration","Food interaction at administration"],"answer":0,"explanation":"Plasma-protein binding appears in the distribution box."},{"q":"Which ADME stage moves drug from blood into tissues?","options":["Distribution","Metabolism","Excretion","Absorption"],"answer":0,"explanation":"Distribution is movement of drug from the circulation into tissues."},{"q":"Which organ system is shown as the principal route of drug excretion?","options":["Endocrine system","Lymphatic system","Renal system","Skeletal system"],"answer":2,"explanation":"Renal elimination is the main excretion route shown, although bile and other routes also contribute."}]}},{"page":353,"lecture":"Drug Development 1","slideInLecture":1,"title":"Lecture 34: Drug Development","explain":"This lecture section focuses on how drugs move through the body, how they are metabolized, and how a large pool of candidate compounds is narrowed to an approved drug.","mustKnow":["The section links pharmacokinetics, metabolism, and the drug-development pipeline."],"terms":[{"term":"Drug development","meaning":"The process of turning a candidate molecule into a tested and approved medicine."}],"diagramGuide":["This divider begins Lecture 34 on Drug Development."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which lecture number introduces the pharmacokinetics and metabolism section?","options":["Lecture 32","Lecture 35","Lecture 37","Lecture 34"],"answer":3,"explanation":"The title slide identifies this as Lecture 34."}]}},{"page":354,"lecture":"Drug Development 1","slideInLecture":2,"title":"ADME Revisited","explain":"A drug must pass through four linked stages. Route and formulation affect absorption; blood flow and binding affect distribution; enzymes alter the drug during metabolism; and kidneys, bile, lungs, or secretions remove it during excretion.","mustKnow":["ADME stages are linked rather than independent.","Distribution depends on factors such as blood flow, molecular size, lipophilicity, and plasma-protein binding.","Kidney removal is the main excretion route shown."],"terms":[{"term":"Lipophilicity","meaning":"A molecule's tendency to dissolve in fats rather than water."},{"term":"Plasma protein","meaning":"A blood protein that can bind a drug and affect its distribution."},{"term":"Prodrug","meaning":"An inactive or less active compound converted into an active drug in the body."}],"diagramGuide":["Absorption covers entry to blood and bioavailability; distribution covers movement from blood to tissues.","Metabolism can detoxify, create toxicity, or activate a prodrug.","Excretion is mainly renal but can also occur through bile, lungs, and secretions."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"A compound becomes pharmacologically active only after CYP450 conversion. Which ADME statement fits it?","options":["It is distributed only in plasma","It bypasses chemical alteration","It is a prodrug activated during metabolism","It is excreted before absorption"],"answer":2,"explanation":"The metabolism box explicitly includes conversion of a prodrug to its active form."},{"q":"Plasma-protein binding is primarily a determinant of which ADME stage?","options":["Excretion","Absorption","Distribution","Metabolism"],"answer":2,"explanation":"Distribution depends on blood flow, size, lipophilicity, and plasma-protein interactions."},{"q":"Conversion of an inactive prodrug into an active compound belongs to:","options":["Absorption only","Distribution only","Metabolism","Renal filtration"],"answer":2,"explanation":"Metabolic enzymes can activate a prodrug as well as detoxify or create toxicity."}]}},{"page":355,"lecture":"Drug Development 1","slideInLecture":3,"title":"Pharmacokinetic Concentration Curve","explain":"A plasma-concentration curve tracks drug level over time. Cmax is the highest concentration, tmax is when that peak occurs, half-life describes how quickly the level falls, and AUC measures total exposure.","mustKnow":["Cmax is the maximum plasma concentration.","tmax is the time at which Cmax occurs.","t1/2 is the drug half-life.","AUC represents total drug exposure over time."],"terms":[{"term":"Cmax","meaning":"Maximum observed plasma-drug concentration."},{"term":"tmax","meaning":"Time required to reach Cmax."},{"term":"Half-life","meaning":"Time required for the drug concentration to fall by half."},{"term":"AUC","meaning":"Area under the concentration-time curve, representing total exposure."}],"diagramGuide":["MEC is the minimum effective concentration; MSC is the upper safety threshold shown below the toxic level.","Cmax is the curve's peak and tmax is its time coordinate.","AUC is the area under the entire concentration-time curve and represents total exposure."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Two formulations have the same Cmax, but formulation X has a larger AUC. What differs most directly?","options":["Minimum effective concentration","Total drug exposure","Peak concentration","Time of peak by definition"],"answer":1,"explanation":"AUC, not Cmax, measures total exposure over time."},{"q":"Which pharmacokinetic quantity is the time coordinate of the concentration peak?","options":["tmax","AUC","t1/2","Cmax"],"answer":0,"explanation":"tmax is the time at which Cmax is reached."},{"q":"The area under a plasma concentration-time curve represents:","options":["Time to first effect","Rate of renal filtration","Maximum safe concentration","Total drug exposure"],"answer":3,"explanation":"AUC integrates concentration across time and represents total exposure."}]}},{"page":356,"lecture":"Drug Development 1","slideInLecture":4,"title":"Drug Metabolism Reactions","explain":"Drug metabolism generally makes lipophilic compounds more water-compatible so they can be eliminated. Oxidation, reduction, hydrolysis, and related reactions introduce or expose functional groups, while conjugation attaches highly hydrophilic groups.","mustKnow":["Metabolism commonly converts lipophilic molecules into more hydrophilic products.","Hydroxylation, hydrolysis, reduction, dealkylation, and oxidation are listed metabolic reactions.","Glucuronidation, sulphonation, glutathione conjugation, methylation, and acetylation are conjugation reactions.","Metabolism may detoxify a drug, activate it, or produce a toxic metabolite."],"terms":[{"term":"Hydroxylation","meaning":"Addition of a hydroxyl group during metabolism."},{"term":"Hydrolysis","meaning":"Bond cleavage using water, such as cleavage of an ester or amide."},{"term":"Conjugation","meaning":"Attachment of a hydrophilic group to a drug or metabolite."},{"term":"Glucuronidation","meaning":"Conjugation with glucuronic acid to aid elimination."}],"diagramGuide":["Left list: Phase I-style reactions oxidize, reduce, or hydrolyze lipophilic drugs.","Right list: conjugation attaches hydrophilic endogenous groups.","The central flow warns that metabolism can yield detoxified, active, or toxic metabolites."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which reaction is a conjugation rather than a Phase I functionalization?","options":["Glucuronidation","Epoxidation","Oxidative deamination","Dealkylation"],"answer":0,"explanation":"Glucuronidation is listed among conjugation reactions."},{"q":"Which reaction is listed as a Phase I-style transformation rather than conjugation?","options":["Acetylation","Glucuronidation","Sulphonation","Dealkylation"],"answer":3,"explanation":"Dealkylation is an oxidative functionalization reaction; the other choices are conjugations."},{"q":"The general physicochemical result of drug metabolism is conversion of lipophilic molecules into more:","options":["Hydrophobic molecules","Hydrophilic molecules","Volatile molecules","Polymeric molecules"],"answer":1,"explanation":"Increasing hydrophilicity generally facilitates elimination in bile or urine."}]}},{"page":357,"lecture":"Drug Development 1","slideInLecture":5,"title":"Paracetamol Metabolism","explain":"Paracetamol follows multiple metabolic routes. Most is converted to conjugated products, while a smaller route creates a reactive metabolite that can be neutralized by glutathione. The diagram highlights glutathione as a protective detoxification molecule.","mustKnow":["Paracetamol has several competing metabolic pathways.","Glutathione detoxifies a reactive paracetamol metabolite.","Loss of sufficient glutathione increases the danger from the reactive pathway."],"terms":[{"term":"Glutathione","meaning":"A cellular molecule that conjugates and detoxifies reactive compounds."},{"term":"Reactive metabolite","meaning":"A chemically reactive metabolic product capable of damaging cellular molecules."},{"term":"Conjugate","meaning":"A product formed by attaching another chemical group to a molecule."}],"diagramGuide":["Most paracetamol goes to glucuronide and sulfate conjugates.","A smaller CYP route forms NAPQI, which is detoxified by glutathione to an APAP-GSH conjugate.","When not detoxified, NAPQI can form protein adducts; a separate deacetylation route is also shown."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which metabolite is directly neutralized by glutathione in the pathway?","options":["Paracetamol glucuronide","Paracetamol sulfate","p-Aminophenol","NAPQI"],"answer":3,"explanation":"The diagram connects NAPQI to glutathione and the APAP-GSH conjugate."},{"q":"Which reactive paracetamol metabolite is detoxified by glutathione?","options":["Paracetamol glucuronide","Paracetamol sulfate","Acetyl-CoA","NAPQI"],"answer":3,"explanation":"The CYP-dependent route forms NAPQI, which can be conjugated to glutathione."},{"q":"Depletion of glutathione increases toxicity because NAPQI can form:","options":["Phospholipid bilayers","Glucose polymers","Protein adducts","DNA primers"],"answer":2,"explanation":"Without sufficient glutathione, reactive NAPQI can covalently modify proteins."}]}},{"page":358,"lecture":"Drug Development 1","slideInLecture":6,"title":"Phase III Handling of Glutathione Conjugates","explain":"Glutathione conjugates can be processed through the mercapturic acid pathway. Enzymes shorten the glutathione portion to a cysteine conjugate, which may be N-acetylated and excreted in urine. A competing beta-lyase route can generate reactive thiols that damage the kidney.","mustKnow":["The mercapturic acid pathway degrades glutathione conjugates.","Cysteine conjugates can be N-acetylated before urinary excretion.","Beta-lyase can instead produce reactive thiols associated with nephrotoxicity."],"terms":[{"term":"Mercapturic acid pathway","meaning":"A pathway that processes glutathione conjugates toward excretion."},{"term":"N-acetylation","meaning":"Addition of an acetyl group to nitrogen."},{"term":"Beta-lyase","meaning":"An enzyme that can break down cysteine conjugates to reactive thiols."},{"term":"Nephrotoxicity","meaning":"Toxic damage to the kidneys."}],"diagramGuide":["Top sequence: glutathione conjugate loses glutamate, then glycine, yielding a cysteine conjugate; NAT-mediated acetylation forms a mercapturic-acid derivative.","Bottom branch: beta-lyase converts a cysteine conjugate into a reactive thiol associated with nephrotoxicity."],"interaction":{"type":"mcq-set","questions":[{"type":"mcq","q":"Which enzyme-dependent branch is associated with formation of a nephrotoxic reactive thiol?","options":["Gamma-glutamyl transpeptidase cleavage alone","Cysteinyl glycinase cleavage alone","Beta-lyase cleavage","N-acetylt
