hosphate (PPi). Step 2: AMP is transferred to the DNA's 5′-phosphate, activating it (DNA–AMP). Step 3: the neighbouring 3′-OH attacks the activated phosphate, forming the phosphodiester bond and releasing AMP. This is group transfer again (Module 1): ATP's energy is passed on by adenylylation, not by plain hydrolysis. E. coli's own ligase uses NAD⁺ instead of ATP for the same adenylylation chemistry."}, {"id": "p47", "m": 3, "q": "Read the Sanger gel (four ddNTP lanes). What is the sequence of the newly synthesised strand, 5′→3′?", "o": ["5′-GATCCA-3′", "5′-ACCTAG-3′", "5′-CTAGGT-3′", "5′-TGGATC-3′"], "a": 0, "e": "Each band is a fragment that stopped where a ddNTP was added. The shortest fragments (bottom) ended closest to the primer, i.e. at the 5′ end of the new strand. Reading bottom → top: ddG, ddA, ddT, ddC, ddC, ddA = 5′-GATCCA-3′. The template strand is its complement, 3′-CTAGGT-5′. Modern sequencers use four fluorescent dyes in one capillary, but the logic is identical: chain termination plus size separation.", "f": "<svg viewBox='0 0 220 175'><text x='38' y='14' font-size='11' fill='currentColor'>ddA</text><rect x='30' y='20' width='34' height='5' fill='currentColor' opacity='.5'/><text x='83' y='14' font-size='11' fill='currentColor'>ddC</text><rect x='75' y='20' width='34' height='5' fill='currentColor' opacity='.5'/><text x='128' y='14' font-size='11' fill='currentColor'>ddG</text><rect x='120' y='20' width='34' height='5' fill='currentColor' opacity='.5'/><text x='173' y='14' font-size='11' fill='currentColor'>ddT</text><rect x='165' y='20' width='34' height='5' fill='currentColor' opacity='.5'/><rect x='120' y='150' width='34' height='4' fill='var(--acc)'/><rect x='30' y='130' width='34' height='4' fill='var(--acc)'/><rect x='165' y='110' width='34' height='4' fill='var(--acc)'/><rect x='75' y='90' width='34' height='4' fill='var(--acc)'/><rect x='75' y='70' width='34' height='4' fill='var(--acc)'/><rect x='30' y='50' width='34' height='4' fill='var(--acc)'/><text x='5' y='170' font-size='9' fill='currentColor'>bottom = shortest fragment, (+) electrode</text></svg>"}, {"id": "p48", "m": 3, "q": "Why does incorporating a ddNTP stop DNA synthesis?", "o": ["It lacks a 3′-OH, so no next phosphodiester bond can form", "It lacks a base, so the polymerase cannot read it", "It lacks the 5′-triphosphate needed to be incorporated", "It binds the template too tightly for the polymerase to move"], "a": 0, "e": "Dideoxynucleotides lack the 3′-hydroxyl. They still have a 5′-triphosphate, so polymerase can add them, but with no 3′-OH the next nucleotide cannot attach and the chain ends. Mixing a little ddNTP with plenty of normal dNTP produces fragments ending at every position of that base. Too much ddNTP makes all fragments short; too little makes long reads with weak signal. Uses: confirming cloned inserts (including orientation), finding mutations, verifying PCR products."}, {"id": "p49", "m": 3, "q": "You want Cas9 to cut a different gene. What must you change?", "o": ["The nuclease domains of the Cas9 protein", "The guide RNA's target-matching sequence", "The DNA ligase used to repair the break", "The repair template used for knockouts"], "a": 1, "e": "Cas9 is a programmable nuclease. The guide RNA (gRNA) carries a ~20-nt spacer that base-pairs with the target DNA, and that sequence decides where Cas9 cuts. Retargeting just means designing a new gRNA, which is why CRISPR is faster and easier than older protein-engineering methods. Cas9 makes a double-strand break. The cell's repair then either causes small insertions/deletions that knock the gene out, or, with a supplied template, inserts or corrects sequence. CRISPR originated as a bacterial defence against viruses."}, {"id": "p50", "m": 3, "q": "Which pairing of tool and purpose is correct?", "o": ["PCR — reads a DNA sequence base by base", "Sanger sequencing — amplifies a chosen region millions of times", "CRISPR-Cas9 — makes a targeted double-strand break for editing", "Restriction enzyme — seals nicks in the backbone"], "a": 2, "e": "Keep the verbs straight: PCR amplifies, Sanger sequencing reads, CRISPR-Cas9 edits (cuts at a guided site), restriction enzymes cut at fixed recognition sequences, DNA ligase joins, and gel electrophoresis sizes. MCQs often swap two of these. A good self-test: for each tool, say its input, its output, and the key molecule that makes it work (primers, ddNTPs, gRNA, recognition site, ATP/AMP, agarose sieve)."}, {"id": "p51", "m": 3, "q": "A plasmid lacking an origin of replication (ori) is transformed into E. coli and selected on antibiotic. What happens?", "o": ["Colonies grow normally because the resistance marker is present", "Few stable colonies: plasmid isn't copied and is lost", "The plasmid integrates and its copy number rises", "Colonies grow and overexpress the cloned insert"], "a": 1, "e": "The ori lets a plasmid replicate on its own in the host, and also sets its copy number. Without it, the plasmid isn't copied when the cell divides, so daughter cells lose it and also lose antibiotic resistance. A useful vector needs three core parts: ori (replication), a selectable marker (survival on antibiotic, e.g. Ampᴿ/Kanᴿ/Tetᴿ), and a cloning site/MCS with unique restriction sites (for insertion). Expression vectors add a promoter, ribosome-binding site, and often a tag."}, {"id": "p52", "m": 3, "q": "Restriction enzymes evolved in bacteria mainly to:", "o": ["Repair their own DNA after UV damage", "Cut foreign DNA such as phage genomes", "Splice introns out of their own mRNA", "Join Okazaki fragments during replication"], "a": 1, "e": "Restriction–modification systems are bacterial immunity. A restriction endonuclease cuts DNA at its recognition site, and a matching methyltransferase methylates those sites in the host's own DNA so it is spared. Unmethylated phage DNA gets ‘restricted’. This is a different defence from CRISPR, which works as adaptive immunity using stored spacer sequences. Both natural systems became core lab tools."}, {"id": "p53", "m": 4, "q": "Put the recombinant-protein pipeline in order: (a) screen colonies (b) transform host (c) isolate gene/cDNA (d) ligate into vector (e) purify protein (f) induce expression (g) select on antibiotic", "o": ["c → d → b → g → a → f → e", "c → b → d → g → a → e → f", "d → c → b → a → g → f → e", "c → d → g → b → a → f → e"], "a": 0, "e": "Isolate the gene (often by PCR or as cDNA) → cut and ligate into the vector → transform competent cells → select with the antibiotic (cells carrying the plasmid survive) → screen colonies for recombinants (e.g. blue/white) → confirm the insert (colony PCR, digest, sequencing) → induce expression → harvest and lyse → purify (e.g. His-tag/Ni-NTA) → check by SDS-PAGE. Selection has to come after transformation, because only then is there anything to select. Being able to rebuild this chain quickly is the single most useful skill for this module."}, {"id": "p54", "m": 4, "q": "To express human insulin in E. coli, you should clone:", "o": ["Genomic DNA, because it keeps the native regulatory regions", "cDNA from mature mRNA, because bacteria can't splice", "The purified insulin protein, inserted into the plasmid", "Pre-mRNA, because it is the closest copy of the gene"], "a": 1, "e": "Genomic DNA contains introns (and eukaryotic regulatory elements bacteria don't recognise). cDNA is made by reverse transcriptase from mature, spliced mRNA, so it contains only the coding sequence. Human regulatory regions would not work in bacteria anyway, so the cDNA goes behind a bacterial promoter in an expression vector. Proteins can't be cloned, since cloning means DNA, and pre-mRNA still contains introns."}, {"id": "p55", "m": 4, "q": "After heat-shock transformation, cells are put back on ice, then grown in antibiotic-free medium for ~1 hour before plating on ampicillin. Why the antibiotic-free recovery?", "o": ["To let membrane pores reopen so more DNA can enter", "To let cells express resistance before the drug", "To kill off the cells that failed to take up DNA", "To switch on the lac promoter for later induction"], "a": 1, "e": "Taking up the plasmid isn't enough: the cell must transcribe and translate the resistance gene (e.g. β-lactamase for ampicillin) before the drug arrives. The sequence is: competent cells + DNA on ice (DNA sticks to the surface) → 42 °C for 30–60 s (transient membrane openings, DNA enters) → ice for 2–5 min (membrane reseals) → recovery growth → plate on selective medium. Competence (made chemically, e.g. CaCl₂, or by electroporation) is what lets DNA cross the membrane at all."}, {"id": "p56", "m": 4, "q": "On an ampicillin + X-gal plate, you see blue and white colonies (insertion site is inside lacZα). Which colonies do you pick and why?", "o": ["Blue, because they express β-galactosidase from the insert", "White, because an insert disrupted lacZα so X-gal isn't cleaved", "Both colours, because ampicillin has already proved the insert is present", "Neither; you need a plate without antibiotic first"], "a": 1, "e": "Ampicillin selects for cells carrying any plasmid, with or without insert. X-gal screens: an intact lacZα makes functional β-galactosidase, which cleaves X-gal to a blue product, meaning empty vector. An insert in the MCS disrupts lacZα, so the colony stays white and is a likely recombinant. ‘Likely’ is the key word: white colonies are then confirmed by colony PCR, restriction digestion, or sequencing, and only sequencing gives the exact sequence and orientation."}, {"id": "p57", "m": 4, "q": "Which method confirms both the exact sequence and the orientation of an insert?", "o": ["Antibiotic selection", "Blue/white screening", "Colony PCR with insert-only primers", "DNA sequencing"], "a": 3, "e": "Selection shows a plasmid is present. Screening points to likely recombinants. Colony PCR shows an insert of roughly the right size (and can show orientation only if one primer sits in the vector). Restriction mapping gives size, and orientation when there is an asymmetric site. Sequencing reads every base, catching PCR-introduced mutations, frameshifts, and orientation. Ranked from weakest to strongest evidence: selection < screening < colony PCR/digest < sequencing."}, {"id": "p58", "m": 4, "q": "Why is IPTG used to induce a lac-controlled expression vector instead of lactose?", "o": ["IPTG activates CAP directly, bypassing cAMP", "IPTG releases LacI but isn't metabolised", "IPTG is a co-repressor that switches the operon off", "Lactose cannot enter E. coli without permease"], "a": 1, "e": "IPTG is a lactose analogue that binds LacI and releases it from the operator, just as allolactose does (Module 2). It is not metabolised by β-galactosidase, so its concentration stays constant and induction stays steady. In the common T7 system (e.g. pET vectors in BL21(DE3)), IPTG induces the host's T7 RNA polymerase gene, and that polymerase then transcribes the target gene from a strong T7 promoter on the plasmid. Inducible promoters keep the gene off while cells grow, which matters when the protein is toxic, then switch it on at high density."}, {"id": "p59", "m": 4, "q": "During His-tag purification on Ni-NTA, your target protein appears in the WASH fraction, not the elution. Most likely cause?", "o": ["Imidazole in the wash buffer was too high", "Imidazole in the elution buffer was too high", "The protein is too large for SDS-PAGE", "The His-tag bound Ni²⁺ too strongly"], "a": 0, "e": "Imidazole resembles the histidine side chain and competes for Ni²⁺. Low imidazole in the wash removes weakly, nonspecifically bound host proteins while the His-tagged protein stays bound; high imidazole then outcompetes the tag and elutes it. If the wash already contains too much imidazole, the target leaves early. Other causes would be a cleaved or buried tag. Workflow: lysate → bind → wash (low imidazole) → elute (high imidazole) → SDS-PAGE to judge purity and size."}, {"id": "p60", "m": 4, "q": "SDS-PAGE: M = marker (kDa), U = uninduced, I = induced, E = Ni-NTA eluate. What is the best interpretation?", "o": ["Expression failed: U and I look identical", "A ~32-kDa protein appears on induction and is purified in E", "The eluate contains every host protein, so purification failed", "The protein is ~70 kDa, since it is the top band in lane I"], "a": 1, "e": "Compare U with I: a new, thick band just below the 35-kDa marker appears only after induction, so that is the recombinant protein. Lane E shows essentially that single band, so affinity purification worked. Estimate size against the marker on a log scale (here about 32 kDa) and compare with the predicted mass including the tag. SDS denatures proteins and coats them with uniform negative charge, so migration depends mainly on size, and smaller proteins run lower.", "f": "<svg viewBox='0 0 260 190'><rect x='10' y='10' width='240' height='175' fill='currentColor' fill-opacity='.05' stroke='currentColor' stroke-opacity='.4'/><text x='58' y='24' font-size='10' fill='currentColor'>M</text><text x='110' y='24' font-size='10' fill='currentColor'>U</text><text x='162' y='24' font-size='10' fill='currentColor'>I</text><text x='214' y='24' font-size='10' fill='currentColor'>E</text><rect x='45' y='42' width='36' height='3' fill='currentColor'/><text x='16' y='46' font-size='9' fill='currentColor'>100</text><rect x='45' y='65' width='36' height='3' fill='currentColor'/><text x='16' y='69' font-size='9' fill='currentColor'>70</text><rect x='45' y='87' width='36' height='3' fill='currentColor'/><text x='16' y='91' font-size='9' fill='currentColor'>50</text><rect x='45' y='110' width='36' height='3' fill='currentColor'/><text x='16' y='114' font-size='9' fill='currentColor'>35</text><rect x='45' y='132' width='36' height='3' fill='currentColor'/><text x='16' y='136' font-size='9' fill='currentColor'>25</text><rect x='45' y='165' width='36' height='3' fill='currentColor'/><text x='16' y='169' font-size='9' fill='currentColor'>15</text><rect x='97' y='49' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='97' y='61' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='97' y='73' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='97' y='81' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='97' y='95' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='97' y='102' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='97' y='120' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='97' y='127' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='97' y='141' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='97' y='154' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='149' y='49' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='149' y='61' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='149' y='73' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='149' y='81' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='149' y='95' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='149' y='102' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='149' y='120' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='149' y='127' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='149' y='141' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='149' y='154' width='36' height='2' fill='currentColor' opacity='.45'/><rect x='149' y='114' width='36' height='6' fill='var(--acc)'/><rect x='201' y='115' width='36' height='4' fill='var(--acc)'/></svg>"}, {"id": "p61", "m": 4, "q": "Which recombinant product–disease pairing is correct?", "o": ["Erythropoietin — anaemia of chronic kidney disease", "Factor VIII — hemophilia B (Factor IX deficiency)", "Interferon-α — growth hormone deficiency in children", "Human growth hormone — chronic hepatitis B infection"], "a": 0, "e": "The kidneys make EPO, so kidney failure causes anaemia, and recombinant EPO stimulates red-cell production. Factor VIII treats hemophilia A; Factor IX treats hemophilia B. Interferons (IFN-α/β) are antivirals, used against hepatitis B/C and some cancers such as melanoma. hGH treats growth-hormone deficiency. Recombinant versions are safer than plasma- or cadaver-derived products, which carried infection risks. Insulin was the first commercial recombinant product (1982)."}, {"id": "p62", "m": 4, "q": "The hepatitis B vaccine is described as recombinant and non-infectious. Why non-infectious?", "o": ["It contains whole hepatitis B virus killed after growth in yeast", "It contains only yeast-made HBsAg, with no viral genome", "It contains a live attenuated hepatitis B strain from yeast", "It contains ready-made antibodies against hepatitis B virus"], "a": 1, "e": "The gene for the hepatitis B surface antigen (HBsAg) is expressed in yeast. The protein self-assembles into virus-like particles that look like the virus to the immune system but contain no viral nucleic acid, so they can't replicate. This is a subunit/VLP vaccine and was the first recombinant vaccine (1986). Yeast is used because it is a eukaryote that can fold and assemble the protein properly. Giving ready-made antibodies would be passive immunisation, not vaccination."}, {"id": "p63", "m": 4, "q": "Therapeutic monoclonal antibodies (e.g. against HER2) are usually produced in mammalian cells rather than E. coli because:", "o": ["E. coli cannot transcribe the antibody genes at all", "They need complex folding, disulfides and glycosylation", "Mammalian cells are cheaper and faster to grow at scale", "E. coli genomic DNA would contaminate the final antibody"], "a": 1, "e": "Antibodies are large multi-chain glycoproteins (two heavy and two light chains joined by disulfides). Their stability, half-life and effector functions depend on proper folding in the ER and on glycosylation, which bacteria can't do correctly. Mammalian lines such as CHO cells carry out these modifications. The same logic decides host choice generally: bacteria for simple, unmodified proteins (insulin), yeast for some eukaryotic folding (HBsAg), mammalian cells for complex glycoproteins."}, {"id": "p64", "m": 4, "q": "Match the gene-therapy case to its strategy: sickle-cell disease treated by editing the BCL11A enhancer in a patient's own stem cells, which are then reinfused.", "o": ["In vivo gene addition", "Ex vivo gene editing", "Gene silencing by siRNA in the bloodstream", "CAR-T engineered immune cells"], "a": 1, "e": "The cells are taken out, edited with CRISPR, and returned, which makes it ex vivo editing. Disrupting the BCL11A erythroid enhancer removes a repressor of fetal haemoglobin (HbF), and HbF prevents red cells from sickling. Compare: SMA (spinal muscular atrophy) is treated by in vivo gene addition, delivering a functional SMN1 gene with a viral vector into the patient. CAR-T cells are T cells engineered ex vivo with a chimeric antigen receptor that targets cancer cells. siRNA/antisense are examples of gene silencing."}, {"id": "p65", "m": 4, "q": "Bt cotton and Golden Rice are both GM crops. Which statement correctly contrasts them?", "o": ["Both express Cry toxin, giving resistance to insect pests", "Bt makes Cry toxin; Golden Rice makes β-carotene", "Golden Rice resists herbicides; Bt crops make vitamin A", "Both were engineered mainly for tolerance to drought"], "a": 1, "e": "Bt crops carry a Cry gene from Bacillus thuringiensis. The Cry protein is activated in the alkaline gut of specific insects and kills them, so farmers use fewer chemical insecticides. A key concern is pests evolving resistance, which requires resistance management. Golden Rice carries carotenoid-pathway genes so that β-carotene (provitamin A) builds up in the grain, to combat vitamin A deficiency. That is nutritional biofortification. Rice normally makes no β-carotene in the endosperm."}, {"id": "p66", "m": 4, "q": "Which is listed as an environmental/ecological concern specific to GM crops?", "o": ["Gene flow from GM crops to wild relatives", "Recombinant insulin causing allergy", "Germline editing of human embryos", "Overuse of imidazole during large-scale protein purification"], "a": 0, "e": "Pollen can carry transgenes into related wild plants (gene flow), with possible ecological effects such as herbicide-resistant ‘superweeds’. Other concerns: effects on non-target organisms, biodiversity, and pests becoming resistant to Bt. Ethical issues are a separate category (germline editing, consent, equitable access, enhancement). Biosafety covers unintended or off-target effects and lab or large-scale release risks. Regulation covers risk assessment, approval and post-release monitoring."}, {"id": "p67", "m": 4, "q": "Which is an industrial (not medical or agricultural) product of genetic engineering?", "o": ["Recombinant chymosin for cheese-making", "Recombinant Factor IX for hemophilia B", "CAR-T cells engineered against cancer", "Bt maize expressing an insecticidal toxin"], "a": 0, "e": "The industrial and food bucket includes chymosin (rennet for cheese) and lactase, enzymes such as amylase, protease and lipase (detergents, food processing), bio-based chemicals (amino acids, vitamins, organic acids), and biofuels and bioproducts (ethanol, bioplastics; cyanobacteria engineered to make polyethylene or butanol; E. coli making diesel). The advantages are high yield, consistent quality, scalability and lower cost. Factor IX and CAR-T are medicine; Bt maize is agriculture."}, {"id": "p68", "m": 4, "q": "A cloning vector and an expression vector differ mainly because the expression vector also has:", "o": ["An origin of replication that sets copy number", "A selectable marker such as Ampᴿ or Kanᴿ", "A promoter and RBS positioned before the insert", "A multiple cloning site with unique restriction sites"], "a": 2, "e": "Every useful vector has ori, a marker and a cloning site. To make protein, the insert must sit downstream of a promoter the host recognises (often inducible: lac, T7, ara) and a ribosome-binding site, with a terminator after it. Tags (His) are often added for purification. A gene in a plain cloning vector is copied along with the plasmid but may never be expressed."}, {"id": "p69", "m": 5, "q": "A motor protein cycles: ATP binds (state A) → ATP hydrolysed, ADP + Pi bound (state B) → products released → new ATP binds (state A). What actually produces the mechanical step?", "o": ["Heat released by hydrolysis pushing the protein", "Conformation changes between nucleotide states", "Pi diffusing away and pulling the protein along", "ATP binding the track rather than the motor"], "a": 1, "e": "Molecular motors run on chemomechanical coupling. Each nucleotide state (ATP-bound, ADP·Pi-bound, empty or ADP-bound) stabilises a different conformation, and the motor makes one structural rearrangement per transition. Because each step is coupled to an essentially irreversible chemical cycle (ATP hydrolysis, ΔG ≈ −30.5 kJ/mol or −7.3 kcal/mol under standard conditions), the motion is biased in one direction instead of random. Heat cannot do directed work at this scale, since it just adds to Brownian noise. Often only a small region of the protein changes shape, and a lever amplifies it."}, {"id": "p70", "m": 5, "q": "A myosin molecule in water stops consuming ATP mid-stroke. What happens to its motion?", "o": ["It coasts for several micrometres on its momentum", "It stops almost at once: inertia is negligible", "It accelerates as stored ATP energy is released", "It keeps constant speed because water is frictionless"], "a": 1, "e": "At nanometre scale in water, viscous forces overwhelm inertia (low Reynolds number), so a molecule stopped from being driven halts within far less than an atom's width. Molecular motors also face constant Brownian buffeting, work stochastically, depend on non-covalent interactions, and need specific temperature and pH. Macroscopic motors are rigid, inertial and tolerant of their surroundings. This is why molecular motors need a continuous chemical cycle rather than a single push."}, {"id": "p71", "m": 5, "q": "Classify each motor: (1) bacterial flagellar motor, (2) myosin II, (3) helicase unwinding DNA, (4) actin polymerisation pushing a cell's leading edge.", "o": ["1 rotary, 2 cytoskeletal, 3 nucleic-acid, 4 polymerisation", "1 cytoskeletal, 2 rotary, 3 polymerisation, 4 nucleic-acid", "1 rotary, 2 nucleic-acid, 3 cytoskeletal, 4 polymerisation", "1 polymerisation, 2 cytoskeletal, 3 rotary, 4 nucleic-acid"], "a": 0, "e": "The course names four families. Rotary motors: the bacterial flagellar motor and ATP synthase spin a shaft. Cytoskeletal motors: myosin walks on actin; kinesin and dynein walk on microtubules. Nucleic-acid motors: helicases, RNA/DNA polymerases and ribosomes move along nucleic acids using NTP energy. Polymerisation motors: growth of actin or microtubule filaments itself pushes membranes. Bacteria-powered micromotors are engineered devices driven by rotary flagellar motion, with light as the control."}, {"id": "p72", "m": 5, "q": "Which statement about actin is correct?", "o": ["G-actin and F-actin are two different proteins encoded by separate actin genes", "G-actin is the ~43-kDa globular monomer; F-actin is its double-helical polymer", "F-actin is a monomer that only exists in muscle", "Actin polymerisation is independent of ATP and Ca²⁺"], "a": 1, "e": "One protein, two assembly states: G (globular) actin, about 43 kDa and 5 nm across, polymerises into F (filamentous) actin, a right-handed double helix of repeating subunits. Actin binds ATP or ADP, and the nucleotide state affects polymerisation rate. Actin-binding proteins and Ca²⁺ regulate assembly and disassembly. Actin is highly conserved and found in essentially all eukaryotic cells (cell shape, migration, cytokinesis), not just muscle. The cytoskeleton has three filament systems: actin microfilaments, intermediate filaments, and tubulin microtubules."}, {"id": "p73", "m": 5, "q": "Actin polymerisation in a test tube shows a lag phase, then rapid growth, then a plateau. What causes the lag?", "o": ["Slow nucleation: small oligomers are unstable", "ATP hydrolysis must finish before any polymer forms", "The minus end grows faster than the plus end at first", "Depolymerisation outpaces addition at both filament ends"], "a": 0, "e": "Dimers and trimers of actin are unstable and fall apart quickly, so forming a nucleus is the slow step (lag). Once nuclei exist, monomers add quickly (elongation), faster at the plus (barbed) end than at the minus (pointed) end. The plateau is steady state: polymer mass is constant while subunits still exchange. Free monomer then sits at the critical concentration. Cells bypass the lag using nucleating proteins."}, {"id": "p74", "m": 5, "q": "At steady state, an actin filament's length stays constant, but labelled subunits move from the plus end toward the minus end over time. This is:", "o": ["Nucleation", "Treadmilling", "Depolymerisation catastrophe", "Crossbridge cycling"], "a": 1, "e": "In treadmilling, ATP-actin adds at the plus end while ADP-actin leaves the minus end at the same rate. Length is constant but subunits flux through. It works because ATP-actin binds more readily than ADP-actin, and actin hydrolyses its ATP after joining the filament, so older subunits (toward the minus end) are ADP-bound and dissociate more easily. Steady state does not mean the filament is inactive. A dynamic equilibrium like this is driven by ATP and is far from true chemical equilibrium."}, {"id": "p75", "m": 5, "q": "Which feature of myosin II is correct?", "o": ["The tail binds actin and ATP; the head is a coiled-coil", "The head binds actin and ATP; the tail is a coiled-coil", "It has one heavy chain and a single light chain only", "The neck hydrolyses ATP; the head anchors the thick filament"], "a": 1, "e": "Myosin II is a hexamer: 2 heavy chains + 2 essential light chains + 2 regulatory light chains. Each heavy chain has a head (motor domain with actin- and ATP-binding sites), a neck (lever arm wrapped by the light chains), and a long tail. The two tails wind into a coiled-coil that bundles with others into the thick filament. ATP binding releases the head from actin, hydrolysis re-cocks it, and Pi release triggers the power stroke."}, {"id": "p76", "m": 5, "q": "Sarcomere diagram: thin lines = actin, thick bars = myosin. During contraction, what shortens and what stays the same?", "o": ["Thick and thin filaments shorten; the A band shortens too", "I band and H zone shorten; A band length is constant", "Only the A band shortens; the I band stays the same", "The M line slides toward one Z line; nothing else changes"], "a": 1, "e": "Sliding filament model: filaments slide past each other and don't change length. Thin actin filaments are anchored at the Z lines; thick myosin filaments are centred on the M line. As myosin heads pull actin toward the M line, the Z lines come closer (the sarcomere shortens), the I band (actin-only region) narrows, and the H zone (myosin-only region) narrows. The A band equals the full length of the thick filament, so it stays constant. A sarcomere runs Z to Z, and its repeating overlap produces the striations seen in muscle fibres.", "f": "<svg viewBox='0 0 320 130'><line x1='20' y1='15' x2='20' y2='105' stroke='currentColor' stroke-width='3'/><line x1='300' y1='15' x2='300' y2='105' stroke='currentColor' stroke-width='3'/><line x1='160' y1='25' x2='160' y2='95' stroke='currentColor' stroke-dasharray='3 3'/><line x1='20' y1='35' x2='125' y2='35' stroke='currentColor' stroke-width='1.5'/><line x1='195' y1='35' x2='300' y2='35' stroke='currentColor' stroke-width='1.5'/><line x1='20' y1='60' x2='125' y2='60' stroke='currentColor' stroke-width='1.5'/><line x1='195' y1='60' x2='300' y2='60' stroke='currentColor' stroke-width='1.5'/><line x1='20' y1='85' x2='125' y2='85' stroke='currentColor' stroke-width='1.5'/><line x1='195' y1='85' x2='300' y2='85' stroke='currentColor' stroke-width='1.5'/><line x1='70' y1='47' x2='250' y2='47' stroke='var(--acc)' stroke-width='5'/><line x1='70' y1='72' x2='250' y2='72' stroke='var(--acc)' stroke-width='5'/><text x='14' y='120' font-size='10' fill='currentColor'>Z</text><text x='294' y='120' font-size='10' fill='currentColor'>Z</text><text x='156' y='120' font-size='10' fill='currentColor'>M</text><text x='128' y='14' font-size='9' fill='currentColor'>H zone</text><line x1='125' y1='18' x2='195' y2='18' stroke='currentColor'/><text x='30' y='12' font-size='9' fill='currentColor'>I band</text><text x='140' y='128' font-size='9' fill='currentColor'></text></svg>"}, {"id": "p77", "m": 5, "q": "In an optical trap, which force pulls the bead toward the beam centre?", "o": ["Scattering force, acting along the beam direction", "Gradient force, from the beam's intensity profile", "Gravity, because the bead is denser than water", "Magnetic force from the laser's oscillating field"], "a": 1, "e": "Light carries momentum. When a dielectric bead refracts light, the change in the light's momentum pushes back on the bead. Two components result. The scattering force points along the beam (radiation pressure). The gradient force points up the intensity gradient, toward the bright centre in the xy plane, which makes it the restoring force that traps the bead. Arthur Ashkin showed in 1985 that a single tightly focused beam traps a bead in 3D (Nobel 2018). If a motor drags the bead off-centre, the gradient force pulls back.", "f": "<svg viewBox='0 0 300 150'><path d='M20 130 C 100 130 110 20 150 20 C 190 20 200 130 280 130' fill='none' stroke='var(--acc)' stroke-width='2'/><text x='120' y='14' font-size='10' fill='currentColor'>beam intensity</text><line x1='150' y1='20' x2='150' y2='135' stroke='currentColor' stroke-dasharray='3 3'/><circle cx='195' cy='85' r='14' fill='none' stroke='currentColor' stroke-width='2'/><line x1='180' y1='85' x2='160' y2='85' stroke='currentColor' stroke-width='2'/><polygon points='160,80 152,85 160,90' fill='currentColor'/><text x='200' y='112' font-size='10' fill='currentColor'>bead displaced by x</text><text x='105' y='148' font-size='10' fill='currentColor'>trap centre</text></svg>"}, {"id": "p78", "m": 5, "q": "A trap has stiffness k = 0.05 pN/nm. A myosin pulls the bead 60 nm off-centre. What force does the motor exert?", "o": ["0.05 pN", "1.2 pN", "3 pN", "1200 pN"], "a": 2, "e": "Near its centre a trap acts like a Hookean spring: F = −kx. |F| = 0.05 pN/nm × 60 nm = 3 pN. The minus sign means the trap force opposes the displacement; at stall, the motor's force balances it. That is how bead displacement becomes force once the trap is calibrated. 3 pN matches the force histogram in the course, where single myosin forces cluster around 2–5 pN with a peak near 3 pN."}, {"id": "p79", "m": 5, "q": "In the dual-beam assay, single myosin steps were ~11 nm at both low and high ATP. What does that suggest?", "o": ["Step size is structural; ATP mainly sets step frequency", "Step size scales linearly with ATP concentration", "ATP is not consumed by myosin during stepping", "The trap, not myosin, produces the 11-nm movement whenever ATP is added"], "a": 0, "e": "If the displacement per event is the same at different [ATP], it is a structural property: the lever-arm swing of the head. [ATP] changes kinetics instead: at low ATP the head stays bound to actin longer (ATP binding is what detaches it), so dwell times lengthen while step size stays the same. The displacement histogram clusters around 10–13 nm, with spread from thermal and measurement noise. Perpendicular-motion traces serve as a control."}, {"id": "p80", "m": 5, "q": "In the dual-beam optical trap experiment, why is the pedestal bead only sparsely coated with myosin (HMM)?", "o": ["So only one or a few motors interact at a time", "Because dense myosin would sever the actin filament", "To raise the trap stiffness for force measurement", "So that actin can polymerise during the measurement"], "a": 0, "e": "The aim is to measure single-molecule events. Too many motors would produce continuous sliding and average away individual steps. In the setup, an actin filament is held taut between two trapped beads (about 2 pN of tension), lowered onto a pedestal sparsely coated with heavy meromyosin, and bead displacements are recorded. From the traces you extract working-stroke size, attachment lifetime, and force: nanometres and piconewtons."}, {"id": "p81", "m": 5, "q": "Why must living cells be out of chemical equilibrium, and what maintains that?", "o": ["Equilibrium means maximal disorder; ATP-driven machines keep gradients", "Equilibrium would make reactions too fast for the cell to control", "Cells are at equilibrium; only their surroundings are not", "Gradients form spontaneously in membranes and need no continuous energy input at all"], "a": 0, "e": "The second law says that at equilibrium disorder is maximal and nothing net happens. Life needs order: ion gradients, acidic lysosomes kept that way by proton pumps, and localised structures. Molecular machines convert one store of free energy, usually ATP, into another (gradients, motion, ordered structures). A cell at equilibrium is a dead cell. This links back to Module 1: cells continually spend free energy and release heat and entropy to the environment."}, {"id": "p82", "m": 5, "q": "Which motor family would you expect ATP synthase to belong to, and what does it convert?", "o": ["Cytoskeletal; ATP into sliding along actin tracks", "Rotary; a proton gradient into ATP via rotation", "Polymerisation; ATP into growth of a filament", "Nucleic-acid; NTPs into separating DNA strands"], "a": 1, "e": "ATP synthase is a rotary motor. Protons flowing down their electrochemical gradient turn a rotor, and the rotation drives conformational changes in the catalytic head that make ATP from ADP + Pi. Run in reverse, it acts as an ATPase pumping protons. That reversibility is why the course writes ATP ⇌ ADP + Pi with both ATPase and ATP synthase. The bacterial flagellar motor is the other rotary example, also powered by an ion gradient."}, {"id": "p83", "m": 6, "q": "Classify: (1) PDGF released by platelets at a wound acts on nearby fibroblasts; (2) insulin from pancreatic β-cells acts on liver; (3) a tumour cell secretes a growth factor and responds to it; (4) cadherins on touching cells halt division.", "o": ["1 paracrine, 2 endocrine, 3 autocrine, 4 juxtacrine", "1 endocrine, 2 paracrine, 3 juxtacrine, 4 autocrine", "1 autocrine, 2 endocrine, 3 paracrine, 4 juxtacrine", "1 paracrine, 2 juxtacrine, 3 autocrine, 4 endocrine"], "a": 0, "e": "Signalling types are classified by route and distance, not by the type of molecule. Paracrine: short range through extracellular fluid, kept local because the messenger is unstable, degraded, or held by the matrix (PDGF at a wound). Endocrine: carried in the blood to distant targets; such messengers are called hormones (insulin). Autocrine: the cell responds to its own signal, which cancer cells exploit to sustain growth. Juxtacrine: needs direct membrane contact between cells (integrins and cadherins mediating contact inhibition)."}, {"id": "p84", "m": 6, "q": "Cortisol activates gene transcription without a cell-surface receptor. Why can it do this?", "o": ["It is a peptide taken into the cell by endocytosis", "It is a lipid-soluble steroid with an intracellular receptor", "It opens a ligand-gated ion channel that carries it into the nucleus", "It binds a GPCR located on the nuclear membrane"], "a": 1, "e": "Steroids are made from cholesterol and are hydrophobic, so they diffuse through the lipid bilayer. Cortisol binds the glucocorticoid receptor in the cytoplasm. The receptor changes shape, moves into the nucleus, and acts as a transcription factor at target genes. The response is slow (it requires new protein synthesis) but long-lasting. Hydrophilic signals like peptides, epinephrine and glucagon cannot cross the membrane and use surface receptors instead: GPCRs, receptor tyrosine kinases, or ion channels."}, {"id": "p85", "m": 6, "q": "Put the GPCR activation steps in order: (a) Gα exchanges GDP for GTP (b) adenylyl cyclase makes cAMP (c) ligand binds receptor (d) Gα·GTP leaves Gβγ and binds effector (e) Gα hydrolyses GTP (f) trimer re-forms.", "o": ["c → a → d → b → e → f", "c → d → a → b → f → e", "a → c → d → b → e → f", "c → a → b → d → e → f"], "a": 0, "e": "Ligand binding changes the receptor's shape, raising its affinity for the trimeric G protein. The receptor then acts as a GEF: Gα releases GDP and binds GTP. Gα·GTP separates from Gβγ and binds an effector such as adenylyl cyclase, which makes cAMP. Gα's intrinsic GTPase hydrolyses GTP → GDP, Gα turns off, and it rejoins Gβγ. The G protein is a timer: it stays active only until it hydrolyses its GTP. Remember the GPCR (seven-transmembrane receptor) and the G protein (separate trimeric switch) are different molecules."}, {"id": "p86", "m": 6, "q": "Cholera toxin locks Gsα in its GTP-bound state. Predict the effect in intestinal cells.", "o": ["cAMP falls, causing constipation", "cAMP stays high; ion and water efflux causes severe diarrhoea", "The receptor is phosphorylated by GRK, arrestin binds, and the signal stops", "Translation stops because eEF-2 is modified"], "a": 1, "e": "The A1 fragment of cholera toxin ADP-ribosylates Gsα, which blocks its GTPase. Gsα can't switch itself off, so adenylyl cyclase stays on and cAMP accumulates. cAMP drives ion (Cl⁻) secretion, water follows by osmosis, and the result is massive watery diarrhoea. This is the cleanest demonstration that GTP hydrolysis is the off-switch. GRK and arrestin act on the receptor, so they can't help once the downstream G protein itself is locked on. eEF-2 is the target of diphtheria toxin, a different toxin."}, {"id": "p87", "m": 6, "q": "How do GRK and arrestin shut off a GPCR that still has ligand bound?", "o": ["GRK degrades the ligand; arrestin hydrolyses Gα's GTP", "GRK phosphorylates the receptor; arrestin then blocks coupling", "Arrestin dephosphorylates the receptor so its ligand falls off and is degraded", "GRK activates adenylyl cyclase until ATP is used up"], "a": 1, "e": "GRKs (GPCR kinases) recognise the active, ligand-bound receptor and phosphorylate its cytoplasmic side. Arrestins then bind the phosphorylated receptor at the same intracellular cavity that the G protein uses. Binding is competitive, so a bound arrestin physically prevents further G-protein activation. G proteins come off the receptor easily once GTP binds; arrestins do not, so they hold the receptor in a desensitised state. This is receptor-level attenuation. Gα's GTPase is G-protein-level shutoff. The two act at different points."}, {"id": "p88", "m": 6, "q": "One hormone molecule binding one receptor can lead to thousands of product molecules inside the cell. Which feature mainly produces this?", "o": ["Negative feedback from the response", "Amplification by cascade and second messengers", "Integration of several different signals", "Specificity of the receptor for its particular ligand"], "a": 1, "e": "Each active receptor can activate several G proteins in turn. Each adenylyl cyclase makes many cAMP molecules. cAMP diffuses and activates many downstream enzymes (such as PKA), each of which modifies many targets. Multiplying gain at every step gives huge amplification. In the course's Aplysia neuron images, serotonin causes cAMP to spread through the cell. The second messenger also brings divergence: one first messenger, many cellular responses. Specificity comes from the receptor, integration from combining signals, and feedback from responses acting back on the pathway."}, {"id": "p89", "m": 6, "q": "Two cell types have the same receptor for a hormone but respond differently. Which principle explains this?", "o": ["Each cell's response depends on its history and downstream machinery", "The hormone is chemically converted into a different molecule in each cell", "Only one of the two cell types is truly receiving the hormone signal", "Identical receptors must always give identical responses in all cells"], "a": 0, "e": "Responses depend on what lies downstream of the receptor: which effectors, kinases, and target genes are present. That in turn depends on the cell's differentiation history (Module 8). The course says that each cell responds to a limited set of signals depending on its history and state, and that responses can be fast (modifying existing proteins) or slow (changing gene expression). Signal processing is a control loop: sensor → information processing (cascade, amplification, feedback, integration) → response."}, {"id": "p90", "m": 6, "q": "Which is NOT one of the three classes of cell-surface receptor named in this course?", "o": ["G-protein-coupled receptors", "Receptor tyrosine kinases", "Ligand-gated ion channels", "Glucocorticoid receptors"], "a": 3, "e": "The glucocorticoid receptor is intracellular: it is a nuclear receptor that binds steroids after they cross the membrane. Surface receptors come in three classes: GPCRs (seven transmembrane helices, coupled to trimeric G proteins), receptor tyrosine kinases (ligand binding causes dimerisation and phosphorylation on tyrosines, as with growth-factor receptors like HER2 in Module 12), and ion channels (ligand binding opens a pore, giving fast responses as at synapses)."}, {"id": "p91", "m": 7, "q": "A tissue sample shows cells that have shrunk, with condensed fragmented chromatin, membrane blebs and small membrane-bound bodies inside macrophages, and no inflammation. What process is this?", "o": ["Necrosis", "Apoptosis", "Mitosis", "Pyroptosis"], "a": 1, "e": "These are the hallmarks of apoptosis: an orderly process with cell and nuclear shrinkage, loss of adhesion to neighbours, chromatin condensation and fragmentation, blebbing, apoptotic bodies, and rapid phagocytosis. There is no inflammation because the contents stay inside intact membranes, the bodies are cleared quickly (preventing secondary necrosis), and the engulfing cells don't release pro-inflammatory cytokines. Necrosis is the opposite: swelling, rupture, spilled contents, inflammation. Pyroptosis is inflammatory too (Module 11)."}, {"id": "p92", "m": 7, "q": "Order the extrinsic apoptosis pathway.", "o": ["TNF → TNFR1 → TRADD/FADD + procaspase-8 → caspase-8 → executioners", "TNF → BAX pore → cytochrome c release → Apaf-1 → caspase-9 → executioners", "TNF → TNFR1 → Apaf-1 + procaspase-9 → caspase-9 → executioner caspases", "TNF → TRADD → BCL-2 activation → caspase-8 → cytochrome c → executioners"], "a": 0, "e": "The extrinsic (death-receptor) pathway: TNF binds TNFR1 → the receptor recruits the adaptors TRADD and FADD plus procaspase-8 at the inner membrane surface → two procaspase-8 molecules held close together cleave each other → active initiator caspase-8 → executioner caspases (e.g. caspase-3) dismantle the cell. The intrinsic pathway is the mitochondrial route: stress → BAX/BAK pore → cytochrome c → Apaf-1 apoptosome → caspase-9 → executioners. Initiator caspases differ (8 vs 9); executioners are shared."}, {"id": "p93", "m": 7, "q": "Which is correct about the BCL-2 family?", "o": ["BCL-2 and BCL-XL oligomerise into the pores that release cytochrome c", "BAX/BAK form pores; BCL-2 opposes them; BH3-only proteins trigger", "BH3-only proteins such as BIM and BAD are anti-apoptotic", "BAX stays in the cytosol and blocks cytochrome c release"], "a": 1, "e": "The family works as a switch. Pore-formers BAX, BAK and BOK move to and oligomerise in the mitochondrial outer membrane, causing mitochondrial outer membrane permeabilisation (MOMP). Anti-apoptotic BCL-2, BCL-XL, MCL-1, BCL-w and A1 bind and restrain them. BH3-only proteins (BID, BIM, NOXA, BAD) sense stress and tip the balance toward death. Survival depends on the ratio. Cancers often overexpress BCL-2 to avoid apoptosis, which is the rationale for BH3-mimetic drugs."}, {"id": "p94", "m": 7, "q": "A cell line lacks Apaf-1. Which apoptotic stimulus is MOST impaired?", "o": ["TNF binding and activating TNFR1 on the surface", "DNA damage that drives BAX into mitochondria", "Phosphatidylserine flipping to the outer leaflet", "FADD recruiting and activating procaspase-8"], "a": 1, "e": "Apaf-1 binds cytochrome c released from mitochondria and assembles the apoptosome, which activates caspase-9. That is the core of the intrinsic pathway, triggered by internal stress such as DNA damage, growth-factor withdrawal, or staurosporine. Without Apaf-1, cytochrome c can still leak out but caspase-9 isn't activated efficiently. Death-receptor signalling through FADD and caspase-8 bypasses Apaf-1 and can still activate executioners directly. When you reason about knockouts, find which pathway the missing protein sits in."}, {"id": "p95", "m": 7, "q": "Annexin V–FITC staining is used to detect early apoptosis. What does it bind and why does that work?", "o": ["Cytochrome c that has leaked out into the cytosol", "Phosphatidylserine flipped to the outer leaflet", "Fragmented DNA inside the condensed nucleus", "Active caspase-8 assembled at the membrane"], "a": 1, "e": "In healthy cells phosphatidylserine (PS) sits on the inner, cytoplasmic leaflet. During apoptosis PS flips outward, where it acts as an ‘eat-me’ signal for macrophages. Annexin V binds PS strongly (Ca²⁺-dependent), so labelled annexin V marks apoptotic cells whose membranes are still intact. Pairing it with a membrane-impermeant DNA dye like propidium iodide (PI) separates early apoptosis (annexin⁺/PI⁻) from late apoptosis or necrosis (annexin⁺/PI⁺). A second readout is cytochrome c moving from a punctate mitochondrial pattern to diffuse cytosolic staining."}, {"id": "p96", "m": 7, "q": "After staurosporine treatment, immunostained cytochrome c changes from punctate to diffuse throughout the cytoplasm. This indicates:", "o": ["Cytochrome c was degraded by executioner caspases", "MOMP let cytochrome c escape into the cytosol", "The cells entered mitosis and lost mitochondria", "The nucleus fragmented and released cytochrome c"], "a": 1, "e": "Normally cytochrome c sits in the mitochondrial intermembrane space (punctate, organelle-shaped staining). BAX/BAK pores permeabilise the outer membrane, cytochrome c diffuses into the cytosol (diffuse staining), and there it nucleates the Apaf-1/caspase-9 apoptosome. Staurosporine, a broad kinase inhibitor, is a standard lab trigger of intrinsic apoptosis. This is the mitochondrial-permeability method of detecting apoptosis; the plasma-membrane method is PS/annexin V."}, {"id": "p97", "m": 7, "q": "A cell has just finished S phase and is in G2. Compared with a G1 cell, it has:", "o": ["Half the DNA, because S phase splits each chromosome", "Twice the DNA, as sister chromatids held by cohesin", "The same DNA but twice the number of chromosomes", "Condensed chromosomes already aligned at the equator"], "a": 1, "e": "G1: each chromosome is one double-stranded DNA molecule (DNA content 2C in diploid cells). S phase replicates the DNA, so by G2 each chromosome is two identical sister chromatids joined by cohesins (4C), but the chromosome number has not changed. Mitosis then separates the sisters so each daughter returns to 2C. Interphase (G1 + S + G2) takes about 90% of the cycle. G0 is a resting exit from G1 (mature neurons, cardiomyocytes). The DNA dye propidium iodide (PI) lets flow cytometry count cells by DNA content (2C vs 4C peaks)."}, {"id": "p98", "m": 7, "q": "Chromosomes are condensed and lined up on the cell's equator, with kinetochores of each sister attached to opposite spindle poles. This is:", "o": ["Prophase", "Metaphase", "Anaphase", "Telophase"], "a": 1, "e": "Metaphase means alignment on the metaphase plate (‘equator’ in a question stem points to metaphase). Prophase: chromosomes condense, transcription shuts down, the nuclear envelope breaks down at its end, and the spindle forms between centrioles. Prometaphase: microtubules capture kinetochores. Anaphase: cohesin is cleaved, sister chromatids separate to opposite poles, and the spindle elongates. Telophase: nuclei re-form around each set. Cytokinesis then pinches the cell in two. Kinetochore-bound dynein motors help move chromosomes along spindle microtubules (linking to Module 5)."}, {"id": "p99", "m": 7, "q": "Which cyclin–CDK pairing drives entry into mitosis?", "o": ["Cyclin E–CDK2", "Cyclin A–CDK2", "Cyclin B–CDK1", "Cyclin D–RB"], "a": 2, "e": "CDK activity rises in sequence: cyclin E–CDK2 at G1/S (commitment to replication), cyclin A with CDK2 or CDK1 through S and G2, then cyclin B–CDK1 for G2/M entry. Cyclin B–CDK1 is MPF (maturation/M-phase promoting factor), the factor Xenopus oocyte cytoplasm-transfer experiments revealed: cytoplasm from a maturing oocyte pushed an immature one into meiosis. Cyclins are the regulatory subunits that rise and fall; the CDKs are the kinases. Checkpoints sit at G1/S, G2/M and the metaphase→anaphase transition."}, {"id": "p100", "m": 7, "q": "Both copies of RB1 are lost in a retinal cell. What is the direct molecular consequence?", "o": ["E2F is permanently inhibited, so S phase can't begin", "E2F is always free, so the G1/S brake is lost", "Cyclin B–CDK1 can no longer form at G2/M", "Apoptosis is constantly triggered in retinal cells"], "a": 1, "e": "Active (hypophosphorylated) pRb binds and inactivates E2F transcription factors, which are needed to switch on S-phase genes. When CDKs phosphorylate pRb in late G1, E2F is released and the cell enters S. With no pRb at all, E2F is always free, so the G1/S brake is gone and retinal precursors proliferate into retinoblastoma. Loss of RB also raises the risk of osteosarcoma and soft-tissue sarcomas. RB is a classic tumour suppressor needing two hits (both alleles lost), which ties into Module 12."}, {"id": "p101", "m": 8, "q": "A cell in the early embryo has been ‘determined’ to become muscle but still looks identical to its neighbours. Which statement is correct?", "o": ["It is already differentiated, because once fate is set the cell is specialised", "It is committed (determined) but has not yet differentiated", "It is totipotent, because it looks unspecialised", "Determination always follows visible differentiation"], "a": 1, "e": "Determination means commitment to a fate, made before any visible specialisation; the course stresses that a determined cell still ‘looks’ like its undetermined neighbours. Differentiation follows: the cell carries out a specific programme and acquires characteristic morphology and physiology. Fate is what a cell normally becomes; potency is the range of types it could become. During development potency narrows progressively until fate is fixed."}, {"id": "p102", "m": 8, "q": "Order these by decreasing potency, using the course's examples: macrophage, zygote-derived first embryonic cells, granulocyte–monocyte progenitor, common myeloid progenitor.", "o": ["First embryonic cells > CMP > GMP > macrophage", "CMP > first embryonic cells > macrophage > GMP", "Macrophage > GMP > CMP > first embryonic cells", "GMP > CMP > first embryonic cells > macrophage"], "a": 0, "e": "The ladder runs: totipotent (zygote and the first cleavage cells, which can make every cell including extra-embryonic tissue) → pluripotent (any tissue of the body but not a whole organism, e.g. the inner cell mass and ES cells) → multipotent (several types within a lineage, e.g. the common myeloid progenitor) → oligopotent (a few types, e.g. the granulocyte–monocyte progenitor) → unipotent (one type, e.g. the macrophage as listed in the course). Watch out: the course slide lists the haematopoietic stem cell as its pluripotent example, but most textbooks call HSCs multipotent, since they make all blood lineages but nothing else. Follow the course in its own exam, but be ready for the distinction."}, {"id": "p103", "m": 8, "q": "Why do a neuron and a muscle cell, derived from the same zygote, have very different structures and functions?", "o": ["Their genomes diverge as they differentiate", "They express different subsets of genes", "Neurons delete their muscle-specific genes", "Muscle cells replicate DNA conservatively"], "a": 1, "e": "Differentiation results from differential gene expression, not from losing DNA. Nuclear transfer proves this: a differentiated intestinal-cell nucleus can still support development of a whole tadpole (Gurdon), and an adult cell nucleus produced Dolly the sheep. Each cell type switches on its own set of transcription factors and target genes, which links to Module 2's point that transcription differs between cells while replication is the same."}, {"id": "p104", "m": 8, "q": "Which organ derives from mesoderm?", "o": ["Liver", "Spinal cord", "Kidney", "Retina"], "a": 2, "e": "Course map: endoderm (inner) gives the digestive tract lining, liver and pancreas. Mesoderm (middle) gives the kidneys, cartilage, bone, spleen, and the circulatory and lymphatic systems, plus muscle. Ectoderm (outer) gives nails, hair, epidermis and dermis, brain, spinal cord and retina (the whole nervous system). Germ layers form during gastrulation, when the blastula reorganises. Diploblasts like Cnidaria (jellyfish) have only endoderm and ectoderm; triploblasts add mesoderm."}, {"id": "p105", "m": 8, "q": "Till and McCulloch (1961) injected bone-marrow cells into lethally irradiated mice. Survival rose with the number of cells injected. What did this suggest?", "o": ["Mature differentiated blood cells alone rescued the mice", "A rare marrow cell at constant frequency rebuilds blood", "Irradiation has no lasting effect on the blood system", "Muscle satellite cells migrate in and rebuild marrow"], "a": 1, "e": "Irradiation destroys the dividing blood-forming cells. Rescue depended on cell dose, consistent with a small, constant fraction of marrow cells able to repopulate all blood lineages. These were later identified as haematopoietic stem cells (the spleen-colony experiments). They became the basis of bone-marrow transplants. Mauro (1961) saw satellite cells by TEM in frog muscle and proposed they were either muscle precursors or embryonic remnants; they turned out to be muscle stem cells."}, {"id": "p106", "m": 8, "q": "A stem cell divides and produces one stem cell and one cell that goes on to specialise. The two arrows represent:", "o": ["Self-renewal and differentiation", "Determination and quiescence", "Apoptosis and mitosis", "Totipotency (one arrow) and pluripotency (other)"], "a": 0, "e": "The defining properties are self-renewal (making more of themselves) and the ability to differentiate, plus the course's points: no fixed proliferation limit, adult stem cells live in specific tissues (skin stem cells make skin), and they are often quiescent (rarely dividing, low metabolism), which protects them from damage. Asymmetric division gives one of each, keeping the stem pool constant while supplying specialised cells. Clonal expansion means one cell giving rise to a large genetically identical population."}, {"id": "p107", "m": 8, "q": "In Gurdon's nuclear-transfer experiment, 10 of 726 transplants of intestinal epithelial nuclei gave normal tadpoles. What is the key conclusion?", "o": ["Differentiated cells lose genes, which is why most transplants fail", "A differentiated nucleus keeps all the information for development", "Intestinal epithelial cells remain totipotent in the adult animal", "Only nuclei from embryonic cells can support any development"], "a": 1, "e": "Even a low success rate (about 1.5%) proves the principle: at least some differentiated nuclei keep a complete, reprogrammable genome. The egg cytoplasm resets the nucleus. A nucleolar marker (a heterozygous mutation giving one nucleolus instead of two) showed the tadpoles came from the donor nucleus, not from a leftover egg nucleus. Dolly (1997) extended this to mammals. Yamanaka later showed defined factors alone can reprogram differentiated cells into pluripotent ones."}, {"id": "p108", "m": 8, "q": "Yamanaka screened 24 candidate genes in mouse embryonic fibroblasts. Which minimal set produced induced pluripotent stem cells?", "o": ["Rx, Pax6, Chx10, Mitf", "Oct3/4, Sox2, c-Myc, Klf4", "BAX, BAK, BID, BIM", "lacZ, lacY, lacA, lacI (operon genes)"], "a": 1, "e": "Retroviral delivery of Oct3/4, Sox2, Klf4 and c-Myc (the ‘OSKM’ or Yamanaka factors) reprogrammed fibroblasts into iPSCs. Pluripotency was confirmed by normal karyotype and teratoma formation (tumours containing tissues from all three germ layers). Rx, Pax6, Chx10 and Mitf are markers from the optic-cup experiment. Benefits of iPSCs: they avoid ES-cell ethical issues, allow patient-specific disease models and drug screening, and can be combined with CRISPR to correct mutations before making replacement cells."}, {"id": "p109", "m": 8, "q": "In the optic-cup experiment, mouse ES cells in matrigel formed Rx⁺ vesicles. The distal part invaginated and expressed Chx10, while the outer shell became pigmented and expressed Mitf. What do these two regions become?", "o": ["Distal: neural retina; outer: pigment epithelium", "Distal: lens; outer: cornea", "Distal: pigment epithelium; outer: neural retina", "Distal: optic nerve; outer: ciliary body"], "a": 0, "e": "Rx (Rax) marks early eye field and optic vesicle; it was reported with a GFP knock-in. The invaginating distal layer expressing Chx10 (with Rx and Pax6) is neural retina. The outer layer expressing Mitf, Otx2 and Pax6 and becoming pigmented around day 12 is retinal pigment epithelium. The point: directed differentiation of pluripotent cells can self-organise into a 3D tissue (an organoid), the top rung of the course's ‘proof ladder’ (nuclear transfer → iPSC reprogramming → organised tissue)."}, {"id": "p110", "m": 8, "q": "Which statement best captures why iPSCs matter for healthcare, according to the course?", "o": ["They are safer than all other cells and can never form tumours", "They avoid ES ethics and allow patient-specific disease models", "They are totipotent and can generate complete organisms", "They still need embryo destruction but are cheaper to make"], "a": 1, "e": "iPSCs are made from a patient's own differentiated cells, so no embryo is destroyed and the cells carry the patient's genetics. That allows disease-in-a-dish models (including diseases mice model poorly), large-scale drug screening on the relevant cell type, and, combined with CRISPR, corrected cells for future transplants. They are pluripotent, not totipotent. They can form teratomas, which is one of the ways pluripotency is tested, so tumour risk is a real safety concern."}, {"id": "p111", "m": 9, "q": "A person is exposed to a new pathogen for the first time. Which response is fastest, and which gives memory?", "o": ["Adaptive is fastest; innate is what builds memory", "Innate is fastest without memory; adaptive lags but remembers", "Both are equally fast on first exposure; only innate gives lasting memory", "Innate is antigen-specific; adaptive is non-specific"], "a": 1, "e": "Innate immunity is the first line: immediate, broad (it recognises shared microbial patterns), and without memory. Adaptive immunity is the second line: it lags by days on first exposure, is antigen-specific, and leaves memory, so the response to re-exposure is faster and stronger. That memory is the basis of vaccination. The two systems cooperate: innate cells such as macrophages present antigen and release signals that start adaptive responses. Adaptive responses are humoral (antibodies, from B cells) or cell-mediated (cytotoxic T lymphocytes)."}, {"id": "p112", "m": 9, "q": "Sort these defences: (1) lysozyme in tears; (2) mucociliary escalator; (3) gut flora competing for nutrients; (4) stomach HCl; (5) urine flushing.", "o": ["Mechanical 2, 5; chemical 1, 4; biological 3", "Mechanical 1, 2; chemical 4, 5; biological 3", "Mechanical 2, 3; chemical 1, 5; biological 4", "All are adaptive defences"], "a": 0, "e": "External innate barriers come in three bins. Mechanical: intact skin, flushing by saliva, tears and urine, and the mucociliary escalator, where cilia move mucus-trapped microbes out of the airways. Chemical: antimicrobial peptides in sweat, lysozyme in tears and saliva (it digests peptidoglycan), and low pH from stomach HCl. Biological: normal flora, over 10⁵ species, which crowd out pathogens by competing for nutrients and space (antagonism). Killing normal flora with broad antibiotics can let pathogens move in."}, {"id": "p113", "m": 9, "q": "Neutrophils arrive at an infection site within hours. How do they find it, and what do they do there?", "o": ["Follow a chemical gradient, phagocytose, digest with granules", "Drift passively in blood and release antibodies at the site", "Present antigen in lymph nodes and leave the infection itself alone", "Punch holes in infected host cells using perforin"], "a": 0, "e": "Neutrophils are the most abundant white blood cells (about 50–60%) and the main early responders; they normally live in blood. They migrate up chemoattractant gradients (chemotaxis), engulf microbes into phagosomes, and fuse granules containing digestive enzymes and antimicrobial proteins with them. They also trigger inflammation, help start adaptive immunity, and can cast neutrophil extracellular traps (NETs), webs of DNA and antimicrobials that ensnare microbes. Antibodies come from B cells/plasma cells; perforin killing is done by NK cells and cytotoxic T cells."}, {"id": "p114", "m": 9, "q": "How do macrophages differ from neutrophils?", "o": ["Macrophages are blood cells; neutrophils normally live only inside tissues", "Macrophages come from monocytes, live in tissues, present antigen", "Macrophages cannot phagocytose; they only release cytokines", "Neutrophils are 2–10% of white cells and become macrophages"], "a": 1, "e": "Monocytes (about 2–10% of WBCs) circulate, enter tissues, and mature into macrophages, the ‘big eaters’. Macrophages sit in lung, liver, brain, bone and intestine, where they phagocytose and present antigen to T cells, bridging innate and adaptive immunity. Neutrophils are more numerous, short-lived and fast. Both phagocytose, but only macrophages are tissue-resident antigen presenters in this course. Macrophages also clear apoptotic bodies (Module 7)."}, {"id": "p115", "m": 9, "q": "A virus-infected cell stops displaying certain normal surface proteins (e.g. MHC I). Which cell recognises and kills it, and how?", "o": ["A neutrophil, by phagocytosing the whole infected cell", "An NK cell, sensing missing proteins and releasing perforin", "A B cell, by secreting antibodies against the missing protein", "A mast cell, by releasing histamine onto the infected cell"], "a": 1, "e": "Natural killer cells are lymphocyte-like innate cells, not B or T cells. They check other cells for normal surface proteins. Healthy cells display them and inhibit the NK cell; infected or cancer cells often lose them (viruses and tumours suppress MHC I to hide from T cells). NK cells then release granules: perforins punch membrane pores and proteases (granzymes) trigger the target's death, killing the intracellular microbe along with it. NK cells also kill cancer cells."}, {"id": "p116", "m": 9, "q": "Which organ makes most complement proteins?", "o": ["Bone marrow", "Liver", "Thymus", "Skin"], "a": 1, "e": "The immune system is a functional system spread across many organs, not a single organ. Bone marrow makes blood cells. The liver makes complement proteins (and coagulation factors). Blood and lymph carry immune cells. Lymphoid organs host adaptive responses. Most tissues contain resident immune cells such as macrophages. Complement is a cascade of blood proteins that can coat (opsonise) and lyse microbes and recruit inflammation. Complement-mediated lysis is also one way endotoxin gets released (Module 10)."}, {"id": "p117", "m": 9, "q": "Which are ALL part of innate internal defences?", "o": ["Phagocytes, complement, inflammation, NK cells", "Antibodies, cytotoxic T cells, and memory B cells", "Skin, mucous membranes, tears", "Plasma cells, helper T cells, NK cells"], "a": 0, "e": "Innate immunity is not just barriers. External defences are skin, mucous membranes and secretions. Internal innate defences are phagocytic cells, antimicrobial proteins, the inflammatory response, NK cells and complement. Antibodies (humoral) and cytotoxic lymphocytes (cell-mediated) belong to adaptive immunity. A common trap is putting NK cells in adaptive immunity because they are lymphocyte-like; in this course they are innate."}, {"id": "p118", "m": 10, "q": "Order the typical steps of bacterial pathogenesis.", "o": ["Entry → adherence → evasion → damage → exit", "Exit → damage → adherence → entry → evasion", "Adherence → exit → entry → damage → evasion", "Damage → entry → adherence → exit → evasion"], "a": 0, "e": "A microbe must enter through a portal (skin, mucosa, respiratory or GI tract), adhere using adhesins that bind host receptors, then penetrate or evade defences (capsule, enzymes, invasins, intracellular survival), damage the host (toxins, invasion), and leave through a portal of exit to spread. Virulence is the capacity to harm the host; it depends on virulence factors and on how many microbes invade (infectious dose). Microbe + virulence factors = pathogen."}, {"id": "p119", "m": 10, "q": "A drug blocks a bacterial adhesin from binding its host receptor. Why could this prevent disease even without killing bacteria?", "o": ["Without attachment, bacteria are flushed away before colonising", "Adhesins also act as the bacterium's ribosomes, so growth stops", "Blocking adhesion triggers release of endotoxin that kills them", "Adherence matters only after bacteria exit, so spread is blocked"], "a": 0, "e": "Adhesion needs a microbial ligand (adhesin) and a host receptor. Without attachment, flushing, mucociliary clearance and peristalsis remove the bacteria before they can colonise. Because receptor distribution varies between hosts and tissues, adherence also helps set host and tissue specificity. That makes adhesion an attractive drug target: an anti-adhesion drug disarms the bacteria rather than killing them, which may reduce selection pressure for resistance."}, {"id": "p120", "m": 10, "q": "Group A Streptococcus M protein binds fibronectin and also recruits fibrinogen, albumin and plasminogen onto the bacterial surface. Which TWO advantages result?", "o": ["Adherence/invasion, plus a host-protein cloak hiding epitopes", "Faster translation, plus resistance to heat sterilisation", "Endotoxin release, plus induction of high fever in the host", "Clot dissolution, plus cleavage of secretory IgA antibodies on mucosae"], "a": 0, "e": "M protein binding to fibronectin anchors GAS to epithelial and endothelial cells and promotes invasion. Coating itself in host proteins makes the bacterium look like ‘self’, masking epitopes and changing antibody access, a form of immune evasion. This shows one virulence factor can serve several steps of pathogenesis. GAS (Streptococcus pyogenes) also uses hyaluronidase and streptokinase, both covered later in this module."}, {"id": "p121", "m": 10, "q": "Which is NOT a way a capsule helps a bacterium in this course?", "o": ["Masks PAMPs so Toll-like receptors don't recognise it", "Inhibits phagocytosis", "Helps it survive lysosomal digestion inside phagocytes", "Degrades host IgA on mucosal surfaces"], "a": 3, "e": "A polysaccharide capsule (in Streptococcus pneumoniae, Haemophilus influenzae, Bacillus anthracis) does several jobs. It aids attachment. It hides pathogen-associated molecular patterns (PAMPs) from pattern-recognition receptors like TLR4, which normally senses LPS, so no alarm is raised. Its slippery, hydrophilic surface resists engulfment. After uptake it can resist lysosomal enzymes. IgA degradation is the job of a separate enzyme, IgA protease. Don't reduce the capsule to ‘just attachment’."}, {"id": "p122", "m": 10, "q": "A bacterium alters its gene expression only when its population density is high, leading to biofilm formation. This is:", "o": ["Quorum sensing", "Chemotaxis", "Phase variation of capsule", "Transformation"], "a": 0, "e": "In quorum sensing, bacteria secrete small signal molecules. As population density rises, the signal concentration crosses a threshold and switches on coordinated gene programmes, such as biofilm formation and toxin production. Biofilms are organised communities in a self-made matrix that resist antibiotics and immune attack (a common problem on catheters and implants). Chemotaxis is movement along a chemical gradient (neutrophils, Module 9). Transformation is DNA uptake (Module 4)."}, {"id": "p123", "m": 10, "q": "Staphylococcus aureus produces coagulase; strains without it are much less pathogenic. Streptococci make streptokinase. Which statement is correct?", "o": ["Coagulase builds a protective clot; streptokinase dissolves clots", "Both enzymes dissolve fibrin clots to help bacteria spread", "Coagulase digests collagen; streptokinase digests hyaluronic acid", "Coagulase is an endotoxin; streptokinase is a secreted exotoxin"], "a": 0, "e": "Coagulase converts fibrinogen to fibrin, walling bacteria off in a clot that blocks phagocytes and antibodies and makes antibiotics less effective. Kinases such as streptokinase activate plasminogen to plasmin, dissolving clots so bacteria can escape and spread. Streptokinase is used clinically to dissolve clots in heart attacks. Hyaluronidase (S. aureus, S. pyogenes) and collagenase (Clostridium perfringens, gas gangrene) digest connective tissue for invasion. The classic swap trap is coagulase forming clots versus kinase dissolving them."}, {"id": "p124", "m": 10, "q": "Mycobacterium tuberculosis survives inside macrophage phagolysosomes. Which cell-wall component is mainly responsible, according to the course?", "o": ["Lipid A", "Mycolic acid", "M protein", "Peptidoglycan alone"], "a": 1, "e": "Mycobacteria (M. tuberculosis, M. leprae) have a waxy cell wall rich in mycolic acids that resists lysosomal enzymes. That lets them persist inside the very cells meant to destroy them. Lipid A is the endotoxin of Gram-negative LPS. M protein is a GAS adhesin. Peptidoglycan is the general wall polymer of sugars and amino acids. Other intracellular strategies: capsules resisting digestion, and invasins that remodel host actin to trigger membrane ruffling and uptake."}, {"id": "p125", "m": 10, "q": "Diphtheria toxin and cholera toxin are both A–B exotoxins. How do their A-subunit targets differ?", "o": ["Diphtheria modifies eEF-2 (translation stops); cholera modifies Gsα (cAMP up)", "Diphtheria modifies Gsα (cAMP up); cholera modifies eEF-2 (translation stops)", "Both ADP-ribosylate ribosomal RNA directly, halting all protein synthesis", "Both are lipid A endotoxins that act by triggering cytokine release"], "a": 0, "e": "Diphtheria toxin is a single 62-kDa chain. It enters by receptor-mediated endocytosis, endosome acidification pushes fragment A into the cytoplasm, and A ADP-ribosylates eEF-2 at its diphthamide residue. Translation stops and the cell dies (the nasopharynx is affected). Cholera toxin is AB5: five B subunits bind GM1 and trigger endocytosis, and A1 ADP-ribosylates Gsα, locking it GTP-bound. Adenylyl cyclase then stays on, cAMP surges, and ions and water pour out, causing diarrhoea. Both are secreted proteins with specific targets, unlike endotoxin."}, {"id": "p126", "m": 10, "q": "An IV fluid bag was autoclaved, killing all Gram-negative bacteria in it, yet patients receiving it develop fever. Best explanation?", "o": ["A protein exotoxin survived the autoclaving step", "Heat-stable lipid A from dead bacteria is pyrogenic", "The contaminating bacteria were actually Gram-positive", "IgA protease released from the bacteria causes fever"], "a": 1, "e": "Endotoxin is lipid A, part of the LPS in the Gram-negative outer membrane. It is heat-stable, so sterilisation can kill bacteria without destroying it. It is released when bacteria lyse: through complement attack, phagocytic digestion, or antibiotic treatment. It triggers cytokine secretion, inflammation and fever (it is a pyrogen) and can affect the blood–brain barrier. This is why pharmaceuticals are tested for endotoxin separately from sterility. Most exotoxins are proteins and heat-labile."}, {"id": "p127", "m": 10, "q": "Which bacterial enzyme specifically attacks a mucosal antibody?", "o": ["Hyaluronidase", "Collagenase", "IgA protease", "Coagulase"], "a": 2, "e": "Secretory IgA guards mucosal surfaces by blocking microbial attachment. IgA protease cleaves it, removing that barrier, and so helps colonisation of mucosae. Many pathogens also need to breach the mucus layer to reach host cells. Hyaluronidase and collagenase break down connective tissue (invasion); coagulase builds a protective clot. Match each enzyme to which defence or tissue it defeats."}, {"id": "p128", "m": 11, "q": "Electron micrographs show a dying cell with a ruptured plasma membrane, swollen cytoplasm full of vacuoles, swollen mitochondria, and no condensed or fragmented nucleus. Nearby immune cells are activated. Caspase inhibitors don't prevent it. Which pathway is this?", "o": ["Apoptosis", "Necroptosis", "Autophagy", "Mitosis"], "a": 1, "e": "Necroptosis is regulated but caspase-independent, lytic and inflammatory. It is typically engaged when apoptosis is blocked, especially when caspase-8 is absent or inhibited. Its morphology is the opposite of apoptosis: rupture rather than an intact membrane with blebs, swelling rather than shrinkage, swollen mitochondria, and no nuclear condensation or fragmentation. The released DAMPs (damage-associated molecular patterns) are picked up by T cells, dendritic cells and macrophages, which release inflammatory cytokines. Triggers: death receptors like TNFR1 or pattern receptors like TLR3/TLR4 (extrinsic), or ZBP1 sensing Z-form nucleic acids (intrinsic)."}, {"id": "p129", "m": 11, "q": "Which caspases are initiators and which are executioners?", "o": ["Initiators 3, 6, 7; executioners 8, 9", "Initiators 8, 9; executioners 3, 6, 7", "Initiators 8, 3; executioners 9, 6, 7", "All caspases are executioners"], "a": 1, "e": "Initiator caspases sit at the top: caspase-8 (extrinsic, activated in the DISC) and caspase-9 (intrinsic, activated in the apoptosome). They cleave and activate the executioner caspases 3, 6 and 7, which cut hundreds of substrates. Two cleavage events explain apoptotic features. Cutting actin-cytoskeleton regulators drives cortical actin polymerisation, which produces blebbing. Cutting two phospholipid-transfer proteins (flippases) allows phosphatidylserine to appear on the surface. Caspases are cysteine proteases that cut after aspartate."}, {"id": "p130", "m": 11, "q": "Fas ligand binds Fas on a T cell target. What is the sequence?", "o": ["Fas → FADD → DISC → caspase-8 activation → caspase-3/7", "Fas → BAX pore → cytochrome c release → caspase-9 → caspase-3", "Fas → RIPK3 activation → membrane rupture → DAMP release", "Fas → GPX4 inactivation → lipid peroxidation → ferroptosis"], "a": 0, "e": "Fas (CD95) is a death receptor like TNFR1. Ligand binding clusters the receptors; their intracellular death domains recruit FADD, which recruits procaspase-8. Together they form the DISC (death-inducing signalling complex). Procaspase-8 brought close together dimerises and auto-activates, then activates executioner caspases 3 and 7. Cytotoxic T cells and NK cells use FasL to kill targets, alongside perforin and granzymes (Module 9). If caspase-8 is blocked here, the cell can switch to necroptosis."}, {"id": "p131", "m": 11, "q": "Classify the BCL-2 family by domain structure.", "o": ["Every member, pro- or anti-apoptotic, has only a BH3 domain", "BAX/BAK and anti-apoptotic members: BH1–4; activators: BH3-only", "Anti-apoptotic members are BH3-only; effectors carry BH1–4", "Activators carry BH1–4, while the BAX/BAK effectors are BH3-only proteins"], "a": 1, "e": "There are three pro-apoptotic classes and one anti-apoptotic class. Effectors (BAX, BAK) have BH1–4 and form mitochondrial pores. Anti-apoptotic members (BCL-2, BCL-XL, MCL-1) also have BH1–4; they bind and sequester the pro-apoptotic proteins. BH3-only activators (e.g. BID, BIM) directly activate BAX/BAK. BH3-only derepressors or sensitisers (e.g. BAD, NOXA) free activators by occupying the anti-apoptotic proteins. BH3-mimetic drugs (e.g. venetoclax, a BCL-2 inhibitor) copy that sensitiser action to kill cancer cells that depend on BCL-2."}, {"id": "p132", "m": 11, "q": "A cell dies from iron-dependent peroxidation of polyunsaturated phospholipids. Inhibiting which protein would most directly push the cell toward this death?", "o": ["Caspase-8 (initiator caspase)", "GPX4 (glutathione peroxidase 4)", "BAX (pore-forming effector)", "Cathepsin D (lysosomal protease)"], "a": 1, "e": "Ferroptosis is driven by iron-catalysed (Fenton and lipoxygenase) oxidation of PUFA-containing phospholipids, which damages membranes. ACSL4 and LPCAT3 load PUFAs into phospholipids, and iron is imported through transferrin and its receptor (TF/TFRC1). Defences: GPX4 uses glutathione (GSH) to reduce lipid hydroperoxides, FSP1 regenerates CoQ to trap radicals, and DHFR maintains BH4. Inhibiting GPX4 (e.g. with ML162) triggers ferroptosis. The course highlights that several therapy-resistant cancers are especially sensitive to it. It doesn't depend on caspases or BAX."}, {"id": "p133", "m": 11, "q": "Lysosomal enzymes are active only at low pH. What is the advantage?", "o": ["It speeds up apoptosis once enzymes reach the cytosol", "Enzymes that leak into the neutral cytosol stay mostly inactive", "It lets cathepsins work outside the cell in the acidic extracellular matrix",
