 "Low pH switches on caspases stored inside lysosomes"], "a": 1, "e": "Lysosomes hold proteases (cathepsins L, B and D, at about 1 mM), nucleases, and enzymes that break down polysaccharides and lipids. These are acid hydrolases, switched on by the acidic lumen that V-ATPase proton pumps maintain (an example of a non-equilibrium gradient, Module 5). The pH dependence is a safety catch. In autophagy, cytoplasmic material and organelles are enclosed in autophagosomes and fused with lysosomes for degradation. That supports survival under starvation, though excessive autophagy can contribute to death."}, {"id": "p134", "m": 11, "q": "Which observation alone would best distinguish apoptosis from necroptosis?", "o": ["The cell eventually dies and is removed", "Annexin V⁺, intact membrane, active caspase-3", "Activation of a death receptor like TNFR1", "Mitochondria are still present and visible in the dying cell"], "a": 1, "e": "Both pathways can start at TNFR1, so receptor identity doesn't decide it. Apoptosis keeps the membrane intact (PS exposed, but impermeable to dyes early on), activates caspases, and fragments the nucleus. Necroptosis is caspase-independent, ruptures the membrane early, and leaves the nucleus uncondensed. Always classify by the deciding clue: morphology, machinery (caspase-dependent or not), and outcome (silent or inflammatory). Ferroptosis's deciding clue is iron and lipid peroxidation; autophagy's is lysosome-mediated self-digestion."}, {"id": "p135", "m": 12, "q": "A tumour grows in size, yet its cells divide no faster than the normal tissue. Which mechanism could explain this?", "o": ["Increased contact inhibition", "Reduced apoptosis, so cells accumulate", "Greater dependence on external growth factors", "Loss of all oncogenes"], "a": 1, "e": "Tissue size reflects the balance of birth and death. Tumours can grow by more proliferation or by less cell death, for example through BCL-2 overexpression or p53 loss. Cancer hallmarks in this course: continuous proliferation signals even without growth factors, failure of apoptosis, invasion through ECM and basement membrane, and metastasis. In culture, transformed cells lose contact inhibition and pile up into foci instead of stopping as a monolayer."}, {"id": "p136", "m": 12, "q": "Which statement distinguishes invasion from metastasis?", "o": ["They are synonyms for the same process", "Invasion is local; metastasis is growth at distant sites", "Metastasis is local spread; invasion means reaching distant organs", "Invasion only happens in blood cancers"], "a": 1, "e": "Invasion comes first: cells break through the basement membrane and ECM into surrounding tissue (often using proteases such as MMPs). Metastasis is the full cascade: entering blood or lymph vessels, surviving circulation, exiting, and colonising a new organ. A benign tumour doesn't invade; a malignant one does. Metastasis causes most cancer deaths. The name cancer comes from Hippocrates' ‘karkinos’ (crab), after the vessels radiating from a cut tumour like crab legs."}, {"id": "p137", "m": 12, "q": "In normal oxygen, a protein X is hydroxylated, tagged by VHL for ubiquitination, and degraded. In hypoxic tumour cores it accumulates and switches on angiogenesis genes. X is:", "o": ["p53", "HIF-α", "RAS", "PD-L1"], "a": 1, "e": "Hypoxia-inducible factor α is constantly made. In normoxia, prolyl hydroxylases use O₂ to hydroxylate it, the VHL E3 ligase recognises it, and it is ubiquitinated and degraded by the proteasome. In hypoxia, hydroxylation fails, so HIF-α survives, pairs with HIF-β in the nucleus, and activates genes for angiogenesis (VEGF), glycolytic metabolism, and erythropoiesis (EPO). Cells far from blood vessels become hypoxic, and severe hypoxia leads to necrotic cores. VHL loss causes kidney cancer because HIF is always on."}, {"id": "p138", "m": 12, "q": "The Warburg effect: cancer cells convert most pyruvate to lactate even with oxygen present. What does the lactate step accomplish?", "o": ["Produces most of the cell's ATP directly", "Regenerates NAD⁺ so glycolysis can continue", "Feeds acetyl-CoA into the citric acid cycle", "Consumes oxygen faster than mitochondria"], "a": 1, "e": "Glycolysis (glucose → pyruvate) reduces NAD⁺ to NADH at the GAPDH step. Unless NAD⁺ is regenerated, glycolysis stops. Lactate dehydrogenase reduces pyruvate to lactate using NADH, regenerating NAD⁺. Cancer cells take up a lot of glucose and run this fast glycolysis, which also supplies building blocks for growth, even though it yields far less ATP per glucose than oxidative phosphorylation. Normally, aerobic pyruvate goes to acetyl-CoA and the TCA cycle; anaerobic pyruvate goes to lactate (or ethanol + CO₂ in yeast). High glucose uptake is why FDG-PET scans light up tumours."}, {"id": "p139", "m": 12, "q": "A patient's tumour expresses high PD-L1. An anti-PD-1 antibody is given. What is the mechanism of benefit?", "o": ["It kills the T cells that express PD-1", "It blocks the PD-1:PD-L1 brake on T cells", "It binds tumour DNA and stops its replication", "It adds PD-L1 to protect normal cells"], "a": 1, "e": "PD-1 on activated T cells is an inhibitory checkpoint receptor. When PD-L1 (on tumour or immune cells) engages it, T-cell activity drops even if the TCR is recognising tumour antigen on MHC. Anti-PD-1 or anti-PD-L1 antibodies block that interaction, ‘releasing the brake’, and restored cytotoxic T cells kill tumour cells. The antibody blocks a signal; it doesn't destroy the T cell. Other evasion routes: losing antigen or MHC, non-classical HLA, immunosuppressive cytokines, and suppressive Tregs and MDSCs in the microenvironment."}, {"id": "p140", "m": 12, "q": "One mutated allele of gene A is enough to drive growth; for gene B, both alleles must be lost. Which classification fits?", "o": ["A is a tumour suppressor; B is an oncogene", "A is an oncogene; B is a tumour suppressor", "Both A and B are oncogenes", "Both A and B are tumour suppressors"], "a": 1, "e": "A proto-oncogene becomes an oncogene through an activating (gain-of-function) change: a point mutation, amplification, or translocation. That is dominant at the cellular level, so one copy suffices. Tumour suppressors (p53, RB) are recessive at the cellular level: one working copy still protects, so both must be inactivated (the ‘two hits’). Cancer typically needs many such rare genetic or epigenetic events in one cell lineage. Carcinogens: chemicals (base changes), X-rays (breaks and translocations), UV (specific base alterations such as pyrimidine dimers)."}, {"id": "p141", "m": 12, "q": "An EGFR mutant lacks its extracellular domain. Predict its behaviour.", "o": ["It cannot signal at all, because EGF can no longer bind", "It is hyperphosphorylated and signals even without EGF", "It switches function and becomes a tumour suppressor", "It binds PD-L1 and suppresses nearby T cells"], "a": 1, "e": "Normally EGF binding to the extracellular domain drives dimerisation and phosphorylation of the intracellular kinase domain, which then signals (a receptor tyrosine kinase, Module 6). Truncating the extracellular domain removes autoinhibition, so the receptor becomes ligand-independent and constitutively active, a classic oncogenic activation (EGFRvIII in glioblastoma). It matches the course's description of cancer cells receiving continuous division signals without growth factors. Other activating mutations occur in different cancers."}, {"id": "p142", "m": 12, "q": "A RAS mutation abolishes its GTPase activity. What is the consequence, and what parallel exists elsewhere in the course?", "o": ["RAS stays GDP-bound and inactive, like a G protein that cannot exchange GDP", "RAS stays GTP-bound and active, like Gsα locked on by cholera toxin", "RAS degrades p53", "RAS becomes a death receptor"], "a": 1, "e": "RAS (HRAS, NRAS, KRAS) is a small GTPase switch: GTP-bound means on, GDP-bound means off, and switching off needs GTP hydrolysis. Mutations such as G12V, G12D and Q61H impair that hydrolysis, so RAS stays on and sends continuous growth signals. RAS mutations occur in about 30% of human cancers. The logic is identical to the trimeric Gα timer in Module 6 and to cholera toxin locking Gsα in the GTP state (Module 10): when GTP isn't hydrolysed, the signal never stops."}, {"id": "p143", "m": 12, "q": "After DNA damage, a cell arrests in G1. Which chain explains this?", "o": ["Damage → p53 ↑ → p21 ↑ → cyclin–CDK inhibited → arrest", "Damage → MDM2 ↑ → p53 activated → CDK activated → arrest", "Damage → RAS ↑ → cyclin B ↑ → premature mitosis → arrest", "Damage → HIF ↑ → VEGF ↑ → angiogenesis → arrest"], "a": 0, "e": "p53 is a tumour-suppressor transcription factor. Damage stabilises it, and it induces p21, a CDK inhibitor. p21 blocks cyclin–CDK (e.g. cyclin E–CDK2), so pRb stays unphosphorylated, E2F stays bound, and the cell can't enter S phase until repair is done (linking to Module 7's RB question). If damage is severe, p53 can also induce apoptosis. Most cancers inactivate p53, either by mutating its DNA-binding domain or by overexpressing its inhibitors MDM2/MDMX."}, {"id": "p144", "m": 12, "q": "A tumour has wild-type p53 but overexpresses MDM2. Why is p53 activity low, and what drug strategy follows?", "o": ["MDM2 activates p53, so the strategy is to inhibit p53 itself", "MDM2 blocks and degrades p53; block the MDM2–p53 interaction", "MDM2 is a kinase that phosphorylates p53 to activate it", "MDM2 stabilises p53, so no further treatment is needed"], "a": 1, "e": "MDM2 is an E3 ubiquitin ligase. It binds p53's transactivation region (blocking transcription), exports it from the nucleus, and ubiquitinates it for proteasomal degradation. MDMX also binds and inhibits p53, and as an MDM2–MDMX heterodimer it boosts MDM2's E3 activity. The two also regulate each other's stability. If p53 itself is intact, freeing it with MDM2–p53 interaction inhibitors (nutlin-type drugs) can reactivate tumour suppression. That strategy fails if p53 is mutated."}, {"id": "p145", "m": 12, "q": "What role do carcinoma-associated fibroblasts (CAFs) play?", "o": ["They are the malignant tumour cells themselves", "Stromal cells that remodel ECM and aid growth and invasion", "Immune cells that kill tumour cells via perforin", "Endothelial cells whose only role is supplying oxygen to the tumour"], "a": 1, "e": "A tumour is an ecosystem. The stroma contains non-malignant fibroblasts, immune cells, endothelial cells and others. Activated fibroblasts (CAFs) remodel the extracellular matrix and secrete growth factors, cytokines and matrix components that help cancer cells grow, invade, stay inflamed, and build new vessels. This is why therapies increasingly target the microenvironment, such as anti-angiogenics or checkpoint blockade, and not just the cancer cells."}, {"id": "p146", "m": 13, "q": "On the plasma concentration–time curve, what are P, Q and R?", "o": ["P = Cmax, Q = tmax, R = AUC", "P = AUC, Q = Cmax, R = t½", "P = tmax, Q = Cmax, R = clearance", "P = t½, Q = AUC, R = Cmax"], "a": 0, "e": "Cmax (P) is the peak plasma concentration; tmax (Q) is when it occurs. Absorption dominates before tmax and elimination after. AUC (R), the area under the curve, is total drug exposure over time, and doses are chosen to give an optimum AUC. Half-life (t½) is the time for concentration to fall by 50% in the elimination phase; it sets dosing interval, with about 4–5 half-lives to clear a drug. The trap: ‘highest concentration’ is Cmax; ‘total exposure’ is AUC.", "f": "<svg viewBox='0 0 300 180'><line x1='40' y1='150' x2='290' y2='150' stroke='currentColor'/><line x1='40' y1='150' x2='40' y2='10' stroke='currentColor'/><path d='M40.0,150.0 L40.0,150.0 L41.0,142.2 L42.0,135.0 L43.0,128.3 L44.0,122.0 L45.0,116.2 L46.0,110.9 L47.0,105.9 L48.0,101.4 L49.0,97.2 L50.0,93.3 L51.0,89.7 L52.0,86.4 L53.0,83.4 L54.0,80.7 L55.0,78.2 L56.0,75.9 L57.0,73.8 L58.0,72.0 L59.0,70.3 L60.0,68.8 L61.0,67.5 L62.0,66.3 L63.0,65.2 L64.0,64.3 L65.0,63.6 {"id": "p147", "m": 13, "q": "A drug has a half-life of 4 h. Starting from 80 mg/L after absorption is complete, what is the concentration 12 h later (ignoring further absorption)?", "o": ["40 mg/L", "20 mg/L", "10 mg/L", "0 mg/L"], "a": 2, "e": "12 h equals 3 half-lives: 80 → 40 → 20 → 10 mg/L, so (½)³ = ⅛ remains. First-order elimination never reaches exactly zero; it falls by the same fraction per unit time. This is why about 5 half-lives (roughly 97% gone) is the usual estimate for washout, and also for reaching steady state with repeated dosing. A longer half-life allows less frequent dosing but slower clearance if toxicity appears."}, {"id": "p148", "m": 13, "q": "Which is a Phase II (conjugation) reaction?", "o": ["Hydroxylation by cytochrome P450", "Ester hydrolysis", "Glucuronidation", "Nitro-reduction"], "a": 2, "e": "Phase I reactions expose or add functional groups and make lipophilic drugs somewhat more polar: hydroxylation, epoxidation, nitro- and azo-reduction, oxidative deamination, hydrolysis of esters and amides, dealkylation, N/S-oxidation, dehalogenation. Phase II attaches highly polar endogenous groups for excretion in bile or urine: glucuronidation, sulfonation, amino-acid conjugation, glutathionylation, methylation, acetylation. Phase III, in the course, is further processing of glutathione conjugates (the mercapturic acid pathway) on the way to excretion."}, {"id": "p149", "m": 13, "q": "In paracetamol overdose, liver glutathione is depleted. Why is that dangerous?", "o": ["Glutathione is needed for paracetamol to be absorbed", "Unconjugated NAPQI builds up and damages liver proteins", "Glutathione is what normally turns paracetamol into its active form", "Low GSH boosts glucuronidation to toxic levels"], "a": 1, "e": "Most paracetamol is safely glucuronidated or sulfated. A fraction is oxidised (CYP-mediated) to the reactive electrophile NAPQI, which glutathione normally neutralises by conjugation. In overdose the main routes saturate, more NAPQI forms, GSH runs out, and NAPQI binds cellular proteins, causing hepatocyte necrosis. The antidote N-acetylcysteine replenishes GSH. The general lesson: metabolism isn't always detoxification, and some routes produce toxic species. In the mercapturic pathway, cysteine conjugates can be cleaved by β-lyase into nephrotoxic reactive thiols."}, {"id": "p150", "m": 13, "q": "Describe the mercapturic acid pathway (Phase III).", "o": ["GSH conjugate → Glu and Gly removed → Cys conjugate → N-acetylated → urine", "Drug → CYP hydroxylation → glucuronide conjugate → excretion in bile and faeces", "Cysteine conjugate → ATP synthase → CO₂ released via the lungs", "GSH → oxidised by GPX4 → lipid peroxides → ferroptosis"], "a": 0, "e": "Stepwise trimming of the glutathione tripeptide (γ-Glu-Cys-Gly) removes glutamate (γ-glutamyl transpeptidase), then glycine (cysteinyl-glycinase), leaving a cysteine S-conjugate. N-acetylation gives a mercapturic acid, which is excreted in urine. The alternative branch is the toxic one: renal β-lyase cleaves some cysteine conjugates into reactive thiols, causing nephrotoxicity."}, {"id": "p151", "m": 13, "q": "Drug discovery starts with ~10,000 candidates and ends with ~1 approved drug. Why is attrition so high?", "o": ["Only potency is tested, and most compounds are too weak", "A candidate must pass many filters beyond potency", "Regulators approve only one new drug per decade", "Computational filters reject most compounds at random"], "a": 1, "e": "Potency alone is never enough. The course funnel runs about 10,000 discovery compounds → about 250 preclinical → about 5 clinical → 1 approved. Stages: discovery (target ID and validation, hit finding, lead optimisation) → preclinical (safety and toxicity, PK in animals) → clinical trials (efficacy and safety in humans) → regulatory review, followed by large-scale manufacture. Most failures come from toxicity, poor pharmacokinetics, or lack of efficacy in humans."}, {"id": "p152", "m": 13, "q": "Which is correct about hits and leads?", "o": ["A hit is a compound already approved as a drug", "HTS yields hits; confirmed hits become leads to optimise", "Leads are found first; hits come after optimisation", "In-silico screening yields approved drugs without assays"], "a": 1, "e": "Virtual (in-silico) screening ranks compounds computationally. Structure-based methods dock compounds into a target's 3D structure; ligand-based methods use similarity, pharmacophores, or QSAR built from known actives. Predicted hits still need a biological assay. High-throughput screening (HTS) uses automation to test huge libraries. Primary hits are re-tested, confirmed with dose–response curves, then promoted to leads, which medicinal chemists optimise for potency, selectivity and PK. Only after many more stages does a compound become a drug."}, {"id": "p153", "m": 13, "q": "An ACE inhibitor lowers blood pressure because it:", "o": ["Blocks renin release from the kidney", "Cuts angiotensin II formation from angiotensin I", "Increases angiotensin II production", "Blocks the aldosterone receptor in the kidney directly"], "a": 1, "e": "In the RAAS pathway, low blood pressure or low Na⁺ triggers renin release from the kidney. Renin cleaves angiotensinogen to angiotensin I, and ACE cleaves angiotensin I to angiotensin II. Angiotensin II constricts vessels and stimulates aldosterone, which makes the kidney retain Na⁺ and water. Blocking ACE removes this signal downstream of renin. Trace the arrows: inhibiting an upstream enzyme lowers everything downstream (angiotensin II, aldosterone) and can raise what sits upstream (angiotensin I, renin activity, through loss of feedback)."}, {"id": "p154", "m": 13, "q": "What is the correct origin story of captopril?", "o": ["Captopril is the venom peptide itself, purified and given orally", "Venom → teprotide lead → oral small-molecule captopril", "Captopril came from random HTS of plant extracts", "Captopril was engineered from the insulin sequence"], "a": 1, "e": "Venom of the Brazilian pit viper Bothrops jararaca causes hypotension. Teprotide, a nonapeptide from the venom, inhibits ACE but, being a peptide, isn't orally usable (proteases and poor absorption). Squibb designed small-molecule analogues, producing captopril (patent filed 1976, granted 1977, approved 1980). Sir John Vane (Nobel 1982) was involved in the venom work. It is a textbook natural product → lead → rational design story."}, {"id": "p155", "m": 13, "q": "Which interaction is ESSENTIAL for captopril's binding to ACE?", "o": ["Its thiol coordinating the active-site Zn²⁺", "A disulfide bond to an ACE cysteine", "π-stacking of its ring with bound DNA", "A covalent ester formed with an active-site serine"], "a": 0, "e": "ACE is a zinc metalloprotease. Captopril's thiol (–SH) coordinates Zn²⁺, which is essential. Its carboxylate forms ionic and H-bond interactions, and hydrophobic groups (the methyl and the N-ring) fill pockets and can be enlarged. SAR (structure–activity relationship) rules: the N-ring must carry a carboxylic acid; larger hydrophobic rings improve potency and PK; for Zn²⁺ binding, thiol beats carboxylate or phosphate; esterifying the carboxylate or phosphate gives prodrugs (enalapril → enalaprilat; fosinopril). Lisinopril uses X = (CH₂)₄NH₂."}, {"id": "p156", "m": 13, "q": "Enalapril is an ester that is inactive until hydrolysed to enalaprilat in the body. Why design it this way?", "o": ["To make the drug more toxic to the liver", "As a prodrug that absorbs better, then is unmasked", "To stop the drug from reaching the bloodstream", "Because esters bind Zn²⁺ more strongly than free acids do"], "a": 1, "e": "Prodrugs are inactive derivatives converted to the active drug in vivo, used to fix poor physicochemical or biological properties: absorption, taste, route, dosage form. Conversion can be enzymatic (esterases, phosphatases, peptidases), chemical (hydrolysis, decarboxylation, light), or both. A free carboxylate is charged at gut pH and crosses membranes poorly; the ethyl ester is more lipophilic, absorbs, then liver esterases unmask it. Prodrugs are also used to mask bad taste."}, {"id": "p157", "m": 13, "q": "Insulin and monoclonal antibodies are usually given subcutaneously or IV rather than orally. Why?", "o": ["They are lipids that dissolve easily through the skin", "Gut acid and proteases would destroy these proteins", "Oral tablets cannot hold more than 1 mg of any drug", "They act only locally on the skin where injected"], "a": 1, "e": "Route depends on the molecule. Proteins (insulin, mAbs, many vaccines) go by injection: IV, IM (fast absorption through muscle's rich blood supply), or SC. Sublingual delivery enters venous circulation directly, bypassing first-pass liver metabolism (cardiovascular drugs like nitroglycerin). Inhalation suits lung disease (COPD). Transdermal patches give controlled release (nicotine). Topical, ocular, otic and epidural routes are local. Oral tablets are only about 5–10% API; the rest is fillers, lubricants, glidants and disintegrants. Hard capsules hold powders or pellets; soft capsules hold oils."}, {"id": "p158", "m": 14, "q": "Thermal shift assay: protein alone vs protein + compound X. What can you conclude?", "o": ["X destabilises the protein (Tm falls by ~6 °C)", "X binds and stabilises the protein (Tm rises ~6 °C)", "X binds with a Kd of exactly 6 nM", "X makes the protein aggregate already at 40 °C, before unfolding"], "a": 1, "e": "SYPRO Orange fluoresces when bound to exposed hydrophobic surfaces. As a protein unfolds with heating, fluorescence rises; the midpoint of the transition is Tm. At higher temperature unfolded protein aggregates, the dye dissociates, and fluorescence falls (the downturn). A ligand that binds the native state stabilises it and shifts the curve right (higher Tm), which is supporting evidence of binding. TSA does not directly give Kd, stoichiometry or binding site; ITC gives thermodynamics. TSA is also used to screen buffers, pH, salt and mutants (e.g. the course's RecA pH study).", "f": "<svg viewBox='0 0 300 180'><line x1='40' y1='150' x2='290' y2='150' stroke='currentColor'/><line x1='40' y1='150' x2='40' y2='10' stroke='currentColor'/><polyline points='40.0,150.0 41.2,150.0 42.5,150.0 43.8,150.0 45.0,150.0 46.2,150.0 47.5,150.0 48.8,150.0 50.0,150.0 51.2,150.0 52.5,150.0 53.8,150.0 55.0,150.0 56.2,150.0 57.5,150.0 58.8,150.0 60.0,150.0 61.2,150.0 62.5,149.9 63.8,149.9 65.0,149.9 66.2,149.9 67.5,149.9 68.8,149.9 70.0,149.9 71.2,149.9 72.5,149.9 73.8,149.8 75.0,149.8 76.2,149.8 77.5,149.8 78.8,149.7 80.0,149.7 81.2,149.6 82.5,149.6 83.8,149.6 85.0,149.5 86.2,149.4 87.5,149.3 88.8,149.3 90.0,149.2 91.2,149.1 92.5,148.9 93.8,148.8 95.0,148.6 96.2,148.4 97.5,148.2 98.8,148.0 100.0,147.8 101.2,147.5 102.5,147.1 103.8,146.8 105.0,146.3 106.2,145.9 107.5,145.3 108.8,144.7 110.0,144.1 111.2,143.3 112.5,142.5 113.8,141.6 115.0,140.5 116.2,139.4 117.5,138.1 118.8,136.7 120.0,135.1 121.2,133.4 122.5,131.5 123.8,129.4 125.0,127.2 126.2,124.8 127.5,122.2 128.8,119.4 130.0,116.4 131.2,113.2 132.5,109.9 133.8,106.4 135.0,102.8 136.2,99.1 137.5,95.3 138.8,91.4 140.0,87.5 141.2,83.6 142.5,79.7 143.8,75.9 145.0,72.2 146.2,68.6 147.5,65.1 148.8,61.8 150.0,58.6 151.2,55.6 152.5,52.8 153.8,50.2 155.0,47.8 156.2,45.6 157.5,43.5 158.8,41.6 160.0,39.9 161.2,38.3 162.5,36.9 163.8,35.6 165.0,34.5 166.2,33.4 167.5,32.5 168.8,31.7 170.0,30.9 171.2,30.3 172.5,29.7 173.8,29.1 175.0,28.7 176.2,28.2 177.5,27.9 178.8,27.5 180.0,27.2 181.2,32.0 182.5,36.6 183.8,41.1 185.0,45.4 186.2,49.5 187.5,53.5 188.8,57.3 190.0,61.0 191.2,64.6 192.5,68.0 193.8,71.3 195.0,74.5 196.2,77.5 197.5,80.5 198.8,83.3 200.0,86.0 201.2,88.6 202.5,91.1 203.8,93.5 205.0,95.8 206.2,98.0 207.5,100.1 208.8,102.1 210.0,104.1 211.2,105.9 212.5,107.7 213.8,109.4 215.0,111.1 216.2,112.7 217.5,114.2 218.8,115.7 220.0,117.1 221.2,118.4 222.5,119.7 223.8,120.9 225.0,122.1 226.2,123.3 227.5,124.3 228.8,125.4 230.0,126.4 231.2,127.4 232.5,128.3 0.0,39.9 191.2,38.3 192.5,36.9 193.8,35.6 195.0,34.5 196.2,33.4 197.5,32.5 198.8,31.7 200.0,30.9 201.2,30.3 202.5,29.7 203.8,29.1 205.0,28.7 206.2,28.2 207.5,27.9 208.8,27.5 210.0,27.2 211.2,32.0 212.5,36.6 213.8,41.1 215.0,45.4 216.2,49.5 217.5,53.5 218.8,57.3 220.0,61.0 221.2,64.6 222.5,68.0 223.8,71.3 225.0,74.5 226.2,77.5 227.5,80.5 228.8,83.3 230.0,86.0 231.2,88.6 232.5,91.1 233.8,93.5 235.0,95.8 236.2,98.0 237.5,100.1 238.8,102.1 240.0,104.1 241.2,105.9 242.5,107.7 243.8,109.4 245.0,111.1 246.2,112.7 247.5,114.2 248.8,115.7 250.0,117.1 251.2,118.4 252.5,119.7 253.8,120.9 255.0,122.1 256.2,123.3 257.5,124.3 258.8,125.4 260.0,126.4 261.2,127.4 262.5,128.3 263.8,129.2 265.0,130.0 266.2,130.8 267.5,131.6 268.8,132.4 270.0,133.1 271.2,133.8 272.5,134.4 273.8,135.1 275.0,135.7 276.2,136.3 277.5,136.8 278.8,137.4 280.0,137.9 281.2,138.4 282.5,138.8 283.8,139.3 285.0,139.7 286.2,140.2 287.5,140.6 288.8,140.9 290.0,141.3' fill='none' stroke='var(--acc)' stroke-width='2.2'/><text x='84' y='164' font-size='10' fill='currentColor'>40</text><text x='134' y='164' font-size='10' fill='currentColor'>50</text><text x='184' y='164' font-size='10' fill='currentColor'>60</text><text x='234' y='164' font-size='10' fill='currentColor'>70</text><text x='284' y='164' font-size='10' fill='currentColor'>80</text><text x='150' y='178' font-size='10' fill='currentColor'>Temperature (°C)</text><text x='44' y='10' font-size='10' fill='currentColor'>SYPRO fluorescence</text><text x='70' y='40' font-size='10' fill='currentColor'>— protein alone</text><text x='70' y='54' font-size='10' fill='var(--acc)'>— + compound X</text></svg>"}, {"id": "p159", "m": 14, "q": "In the RAS phenotypic screen, compound A had EC₅₀ = 25 nM in HRAS-G12V cells and 578 nM in wild-type cells. What does this indicate?", "o": ["More potent on mutant cells; ~23-fold selective", "Less potent on mutant cells; ~23-fold weaker", "Equally potent on mutant and wild-type cells", "EC₅₀ directly gives its binding affinity (Kd) for RAS"], "a": 0, "e": "EC₅₀ is the concentration giving half-maximal effect: a lower EC₅₀ means higher potency. 578/25 ≈ 23-fold selectivity for the RAS-mutant cells, which is the goal (kill cancer cells, spare normal ones). The second compound in the course (71 vs 272 nM) is only about 4-fold selective. Phenotypic screening starts from an observable cell phenotype (here, death of RAS-mutant cells) without first knowing the target. Stockwell's screens later revealed that these hits (e.g. erastin, RSL3) act by triggering ferroptosis. Keep EC₅₀ (functional potency) separate from Kd (binding) and AUC (exposure)."}, {"id": "p160", "m": 14, "q": "In an ITC experiment, protein is in the sample cell and an exothermic binding reaction occurs. How does the instrument respond?", "o": ["Feedback power to the sample cell decreases", "Feedback power to the sample cell increases", "The reference cell is cooled to compensate", "Sample temperature rises and is recorded"], "a": 0, "e": "ITC keeps both cells isothermal. The reference cell (buffer) gets a constant small power (<1 mW), and a feedback heater on the sample cell matches temperatures. When binding releases heat (ΔH < 0), the sample warms by itself, so less feedback power is needed: a downward peak in µcal/s versus time. Endothermic binding needs more power. The raw thermogram is power over time; each peak's area equals the heat of that injection. Both cells sit inside an adiabatic jacket, and thermocouples detect temperature differences."}, {"id": "p161", "m": 14, "q": "Integrated ITC data (heat per injection vs molar ratio) form this sigmoid. What do the plateau, the inflection point, and the slope at the inflection give?", "o": ["ΔH from plateau, n from inflection, Ka from slope", "Tm from plateau, EC₅₀ from slope, AUC from inflection", "Kd from plateau, ΔH from slope, n from the baseline", "Only qualitative yes/no binding, no parameters"], "a": 0, "e": "Early injections: excess protein binds all added ligand, giving maximal heat per mole, and the plateau height ≈ ΔH (here about −10 kcal/mol). As sites fill, the heat per injection falls. The midpoint along the molar-ratio axis gives stoichiometry (n ≈ 1 here). The steepness at the inflection reflects affinity Ka (Kd = 1/Ka); steeper means tighter. At saturation only heat of dilution remains, so subtract a ligand-into-buffer control. For a well-defined sigmoid the c-value (c = n·[P]·Ka) must be in a suitable range. With ΔH and Ka, you get ΔG = −RT ln Ka and TΔS = ΔH − ΔG, a full thermodynamic profile from one experiment.", "f": "<svg viewBox='0 0 300 160'><line x1='40' y1='30' x2='290' y2='30' stroke='currentColor' opacity='.5'/><line x1='40' y1='15' x2='40' y2='140' stroke='currentColor'/><circle cx='40.0' cy='130.0' r='2.5' fill='var(--acc)'/><circle cx='46.0' cy='130.0' r='2.5' fill='var(--acc)'/><circle cx='52.0' cy='129.9' r='2.5' fill='var(--acc)'/><circle cx='58.0' cy='129.9' r='2.5' fill='var(--acc)'/><circle cx='64.0' cy='129.8' r='2.5' fill='var(--acc)'/><circle cx='70.0' cy='129.7' r='2.5' fill='var(--acc)'/><circle cx='76.0' cy='129.5' r='2.5' fill='var(--acc)'/><circle cx='82.0' cy='129.2' r='2.5' fill='var(--acc)'/><circle cx='88.0' cy='128.7' r='2.5' fill='var(--acc)'/><circle cx='94.0' cy='127.9' r='2.5' fill='var(--acc)'/><circle cx='100.0' cy='126.6' r='2.5' fill='var(--acc)'/><circle cx='106.0' cy='124.4' r='2.5' fill='var(--acc)'/><circle cx='112.0' cy='121.2' r='2.5' fill='var(--acc)'/><circle cx='118.0' cy='116.2' r='2.5' fill='var(--acc)'/><circle cx='124.0' cy='109.1' r='2.5' fill='var(--acc)'/><circle cx='130.0' cy='99.7' r='2.5' fill='var(--acc)'/><circle cx='136.0' cy='88.3' r='2.5' fill='var(--acc)'/><circle cx='142.0' cy='75.8' r='2.5' fill='var(--acc)'/><circle cx='148.0' cy='63.9' r='2.5' fill='var(--acc)'/><circle cx='154.0' cy='53.7' r='2.5' fill='var(--acc)'/><circle cx='160.0' cy='45.9' r='2.5' fill='var(--acc)'/><circle cx='166.0' cy='40.3' r='2.5' fill='var(--acc)'/><circle cx='172.0' cy='36.5' r='2.5' fill='var(--acc)'/><circle cx='178.0' cy='34.0' r='2.5' fill='var(--acc)'/><circle cx='184.0' cy='32.5' r='2.5' fill='var(--acc)'/><circle cx='190.0' cy='31.5' r='2.5' fill='var(--acc)'/><circle cx='196.0' cy='30.9' r='2.5' fill='var(--acc)'/><circle cx='202.0' cy='30.6' r='2.5' fill='var(--acc)'/><circle cx='208.0' cy='30.3' r='2.5' fill='var(--acc)'/><circle cx='214.0' cy='30.2' r='2.5' fill='var(--acc)'/><circle cx='220.0' cy='30.1' r='2.5' fill='var(--acc)'/><circle cx='226.0' cy='30.1' r='2.5' fill='var(--acc)'/><circle cx='232.0' cy='30.0' r='2.5' fill='var(--acc)'/><circle cx='238.0' cy='30.0' r='2.5' fill='var(--acc)'/><circle cx='244.0' cy='30.0' r='2.5' fill='var(--acc)'/><circle cx='250.0' cy='30.0' r='2.5' fill='var(--acc)'/><circle cx='256.0' cy='30.0' r='2.5' fill='var(--acc)'/><circle cx='262.0' cy='30.0' r='2.5' fill='var(--acc)'/><circle cx='268.0' cy='30.0' r='2.5' fill='var(--acc)'/><circle cx='274.0' cy='30.0' r='2.5' fill='var(--acc)'/><circle cx='280.0' cy='30.0' r='2.5' fill='var(--acc)'/><line x1='140' y1='20' x2='140' y2='140' stroke='currentColor' stroke-dasharray='3 3'/><text x='128' y='155' font-size='10' fill='currentColor'>1.0</text><text x='200' y='155' font-size='10' fill='currentColor'>molar ratio L/P</text><text x='0' y='134' font-size='10' fill='currentColor'>−10</text><text x='12' y='34' font-size='10' fill='currentColor'>0</text><text x='44' y='12' font-size='10' fill='currentColor'>kcal/mol of injectant</text></svg>"}, {"id": "p162", "m": 14, "q": "In an ITC run, late injections still show small constant peaks after the protein is saturated. What are they, and what should you do?", "o": ["A second binding site; report n = 2 for the complex", "Heat of dilution; subtract a ligand-into-buffer control", "Instrument failure; discard the run and recalibrate", "Slow protein unfolding during the titration; confirm it with TSA"], "a": 1, "e": "Injecting ligand solution into buffer releases or absorbs some heat just from dilution and mixing, unrelated to binding. Once all sites are occupied, that residual heat is all you see. Standard practice is to run a control titration of ligand into buffer and subtract it point by point before fitting the binding isotherm. Mismatched buffers between syringe and cell make dilution heats large, so samples are carefully dialysed into identical buffer."}, {"id": "p163", "m": 14, "q": "FRET efficiency E = 1/(1 + (r/R₀)⁶). If donor–acceptor distance r equals R₀, what is E, and what happens if r doubles?", "o": ["E = 50%; at 2R₀, E ≈ 1.5%", "E = 100%; at 2R₀, E = 50%", "E = 50%; at 2R₀, E = 25%", "E = 0%; at 2R₀, E = 50%"], "a": 0, "e": "At r = R₀ (the Förster radius, by definition the 50% distance), E = 1/(1+1) = 0.5. At r = 2R₀, E = 1/(1+2⁶) = 1/65 ≈ 1.5%. The sixth-power dependence is why FRET acts as a ‘molecular ruler’ that is extremely sensitive around R₀ (typically a few nm) and effectively zero beyond about 10 nm. FRET also needs good overlap between the donor's emission spectrum and the acceptor's absorption spectrum. Expressing donor and acceptor alone proves nothing; what matters is proximity."}, {"id": "p164", "m": 14, "q": "A cameleon Ca²⁺ sensor (CFP–calmodulin–M13–YFP) is expressed in neurons. On stimulation, cyan emission falls and yellow rises (exciting CFP). What happened?", "o": ["Ca²⁺ fell, so CaM released M13 and FRET dropped", "Ca²⁺ rose, so CaM bound M13 and FRET increased", "YFP was photobleached by the excitation light", "CFP was degraded, so only YFP emission remained"], "a": 1, "e": "Without Ca²⁺, calmodulin doesn't bind the M13 peptide, CFP and YFP are far apart, and you see cyan emission. When Ca²⁺ rises, Ca²⁺–CaM wraps around M13, folding the sensor so CFP and YFP come within FRET range. CFP's energy then transfers to YFP, so yellow rises as cyan falls. The ratio of yellow to cyan reports [Ca²⁺] in living cells in real time. The same design principle (an interaction-driven conformational change between a FRET pair) underlies many biosensors, e.g. for cAMP or kinase activity."}, {"id": "p165", "m": 14, "q": "Match each deciding clue to its method: (i) ‘heat per injection’ (ii) ‘Tm shift with SYPRO Orange’ (iii) ‘distance-dependent donor→acceptor transfer’ (iv) ‘mutant cells die at lower EC₅₀’.", "o": ["i ITC, ii TSA, iii FRET, iv phenotypic screening", "i TSA, ii ITC, iii FRET, iv HTS of enzymes", "i FRET, ii TSA, iii ITC, iv phenotypic screening", "i ITC, ii FRET, iii TSA, iv computational docking"], "a": 0, "e": "Each method reports one kind of property. ITC gives binding thermodynamics (Ka, n, ΔH) from heat. TSA gives thermal stability (Tm); a shift supports ligand binding. FRET gives nanometre-scale proximity (interaction or conformational change). Phenotypic screening gives a functional effect in cells, potentially before the target is known. Interpret each claim at the right level: a TSA shift supports stabilisation, FRET supports proximity, and a phenotype supports activity. None alone proves mechanism."}, {"id": "p166", "m": 15, "q": "A drug candidate shifts its target protein's Tm by +8 °C in TSA, but has no effect on cells. Which conclusion is best justified?", "o": ["It definitely binds and inhibits the target inside cells as well as in vitro", "It likely binds purified protein; cell activity is a separate question", "A TSA shift this large proves efficacy in cells", "The compound must be a prodrug needing activation"], "a": 1, "e": "This is an integration question: separate what each method measures. TSA (Module 14) supports binding to purified protein; it doesn't show the compound reaches the target in cells (permeability, efflux, metabolism; Module 13) or that binding changes function. Next steps would be a functional assay, ITC for affinity, and cell-based target engagement. Being a prodrug is one possible explanation, but not the justified conclusion."}, {"id": "p167", "m": 15, "q": "Which pair shares the same underlying molecular logic: a GTPase switch that stays ON if GTP is not hydrolysed?", "o": ["Oncogenic RAS G12V and toxin-locked Gsα", "p53 and BCL-2 acting at mitochondria", "Actin treadmilling and PCR cycling", "Lac repressor and bacterial coagulase enzyme"], "a": 0, "e": "Small GTPases (RAS) and trimeric Gα are timers: GTP-bound means active, and intrinsic GTPase activity turns them off. Oncogenic RAS mutations (Module 12) and cholera toxin's ADP-ribosylation of Gsα (Module 10) both block hydrolysis, giving permanent signalling (constant growth signals, or a cAMP surge and diarrhoea). Recognising shared mechanisms across modules is a high-yield exam skill, and examiners love cross-module links like this."}, {"id": "p168", "m": 15, "q": "A cell is exposed to TNF while caspase-8 is pharmacologically inhibited. Which outcome is most likely, and what would you observe?", "o": ["Normal apoptosis with annexin V⁺ cells, intact membranes", "Necroptosis: rupture, swelling, DAMPs and inflammation", "Ferroptosis, triggered by activation of GPX4", "Cell-cycle arrest in G1 through p53 and p21"], "a": 1, "e": "TNF–TNFR1 normally activates caspase-8 through TRADD/FADD (Modules 7 and 11). With caspase-8 blocked, the necroptosis branch (RIPK1/RIPK3/MLKL) takes over: a lytic, inflammatory, caspase-independent death. Caspase-8 normally cleaves RIPK1 and RIPK3 to suppress necroptosis, which is why its loss unleashes it. Ferroptosis requires GPX4 inhibition, not activation."}, {"id": "p169", "m": 15, "q": "Which statement correctly links energy and information?", "o": ["Since ribosomes use GTP, translation is an energy pathway, not information transfer", "NTPs power information processes, but templates and the code carry the information", "Information flows from protein back to DNA whenever ATP levels are high", "ATP itself stores genetic information that is copied during replication"], "a": 1, "e": "The course's integration point: energy and information are different questions. Nucleotide triphosphates supply energy, and are themselves the building blocks for nucleic acids. Templates and codes carry the information: replication, transcription, translation (Module 2); ligase adenylylation (Module 3); motors and helicases (Module 5). Don't answer an information question with an energy mechanism just because ATP is consumed, and vice versa."}, {"id": "p170", "m": 15, "q": "Recombinant EPO, the HIF pathway, and kidney disease are linked how?", "o": ["HIF drives EPO; failing kidneys make too little, so EPO is given", "EPO inhibits HIF, so kidney disease causes too much EPO", "Recombinant EPO is made in E. coli, since it carries no sugar groups at all", "Kidneys make complement, and EPO is one complement protein"], "a": 0, "e": "EPO is a classic HIF target gene (Module 12): low O₂ stabilises HIF, which drives EPO production by the kidney, which in turn stimulates red-cell production (erythropoiesis). Chronic kidney disease cuts EPO output and causes anaemia, so recombinant EPO is given (Module 4). EPO is a glycoprotein, and therapeutic EPO is produced in mammalian (CHO) cells for proper glycosylation, the same logic as for monoclonal antibodies."}]};
const KEY="sbl-speedrun-v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=i=>String.fromCharCode(65+i);
let S={set:"speed",mod:"all",shuffle:false,ans:{},pos:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch{}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
let list=[],i=0,missOnly=false,t0=Date.now();
$("nSpeed").textContent=D.speed.length;$("nWorked").textContent=D.worked.length;
function buildList(){
  let l=D[S.set].filter(q=>S.mod==="all"||String(q.m)===S.mod);
  if(missOnly)l=l.filter(q=>S.ans[q.id]!=null&&S.ans[q.id]!==q.a);
  if(S.shuffle){l=[...l];for(let k=l.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[l[k],l[j]]=[l[j],l[k]]}}
  list=l;i=missOnly||S.shuffle?0:Math.min(S.pos[S.set+S.mod]||0,Math.max(0,l.length-1));
}
function renderTop(){
  document.querySelectorAll("[data-set]").forEach(b=>b.classList.toggle("on",b.dataset.set===S.set));
  const mods=[...new Set(D[S.set].map(q=>q.m))].sort((a,b)=>a-b);
  $("mod").innerHTML=`<option value="all">All modules</option>`+mods.map(m=>`<option value="${m}">${m}. ${esc(D.modules[m]||"Module "+m)} (${D[S.set].filter(q=>q.m===m).length})</option>`).join("");
  if(S.mod!=="all"&&!mods.includes(+S.mod))S.mod="all";
  $("mod").value=S.mod;$("shuffle").checked=S.shuffle;
}
function stats(){
  const all=D[S.set].filter(q=>S.mod==="all"||String(q.m)===S.mod);
  const done=all.filter(q=>S.ans[q.id]!=null),ok=done.filter(q=>S.ans[q.id]===q.a);
  $("score").textContent=`${ok.length}/${done.length} right · ${done.length}/${all.length} done`;
  $("bar").style.width=`${all.length?done.length/all.length*100:0}%`;
  return {all,done,ok};
}
function render(){
  stats();
  if(!list.length){$("card").innerHTML=`<div class="done"><h2>${missOnly?"No misses left 🎉":"Nothing here"}</h2><div class="nav" style="justify-content:center"><button class="btn" id="back">Back to all</button></div></div>`;$("back").onclick=()=>{missOnly=false;buildList();render()};return}
  if(i>=list.length)return renderDone();
  const q=list[i],a=S.ans[q.id],answered=a!=null;
  S.pos[S.set+S.mod]=i;save();
  $("card").innerHTML=`<div class="qmeta"><span>${missOnly?"Retrying misses · ":""}Q ${i+1} / ${list.length}</span><span>${esc(D.modules[q.m]||"")}</span></div>
    <div class="qtext">${esc(q.q)}</div>
    ${q.f?`<div class="fig"><img alt="figure" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(q.f)}"></div>`:""}
    <div class="choices">${q.o.map((o,k)=>`<button class="choice${answered&&k===q.a?" correct":""}${answered&&k===a&&a!==q.a?" wrong":""}" data-k="${k}" ${answered?"disabled":""}><kbd>${L(k)}</kbd><span>${esc(o)}</span></button>`).join("")}</div>
    ${answered?`<div class="fb ${a===q.a?"":"badfb"}"><b>${a===q.a?"Correct.":"Answer: "+L(q.a)+"."}</b> ${esc(q.e)}</div>`:""}
    <div class="nav"><button class="btn" id="prev" ${i===0?"disabled":""}>← Prev</button>${answered?`<button class="btn" id="redo">Try again</button>`:""}<span class="grow"></span><button class="btn ${answered?"on":""}" id="next">${answered?"Next →":"Skip →"}</button></div>`;
  $("card").querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
  if($("redo"))$("redo").onclick=()=>{delete S.ans[q.id];save();render()};
}
function renderDone(){
  const ids=new Set(list.map(q=>q.id));const done=list.filter(q=>S.ans[q.id]!=null),ok=done.filter(q=>S.ans[q.id]===q.a);
  const misses=done.length-ok.length;
  $("card").innerHTML=`<div class="done"><h2>Set complete</h2><div class="big">${ok.length} / ${list.length}</div><p class="meta">${done.length?Math.round(ok.length/done.length*100):0}% of answered · ${misses} missed · ${list.length-done.length} skipped</p>
  <div class="nav" style="justify-content:center;flex-wrap:wrap"><button class="btn on" id="miss" ${misses?"":"disabled"}>Retry my misses (${misses})</button><button class="btn" id="again">Restart this set</button></div></div>`;
  $("miss").onclick=()=>{missOnly=true;buildList();render()};
  $("again").onclick=()=>{list.forEach(q=>{if(ids.has(q.id))delete S.ans[q.id]});missOnly=false;S.pos[S.set+S.mod]=0;save();buildList();i=0;t0=Date.now();render()};
}
function pick(k){const q=list[i];if(!q||S.ans[q.id]!=null)return;S.ans[q.id]=k;save();render()}
function go(d){i=Math.max(0,Math.min(list.length,i+d));render();window.scrollTo(0,0)}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT"||e.metaKey||e.ctrlKey)return;
  const k=e.key.toLowerCase();
  if("1234".includes(k)&&k.length===1)pick(+k-1);else if("abcd".includes(k)&&k.length===1)pick(k.charCodeAt(0)-97);
  else if(k==="enter"||k==="arrowright"||k===" "){e.preventDefault();go(1)}else if(k==="arrowleft")go(-1);
});
document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{S.set=b.dataset.set;S.mod="all";missOnly=false;save();renderTop();buildList();t0=Date.now();render()});
$("mod").onchange=e=>{S.mod=e.target.value;missOnly=false;save();buildList();render()};
$("shuffle").onchange=e=>{S.shuffle=e.target.checked;save();buildList();render()};
setInterval(()=>{const s=(Date.now()-t0)/1000|0;$("timer").textContent=`⏱ ${s/60|0}:${String(s%60).padStart(2,"0")}`},1000);
renderTop();buildList();render();
</script>
</body>
</html>
