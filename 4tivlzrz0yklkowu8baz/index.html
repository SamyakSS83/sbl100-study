<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBL100 Speedrun</title>
<style>
:root{color-scheme:light dark;--bg:#eef1ed;--panel:#fff;--ink:#15201a;--muted:#647069;--line:#cbd2cd;--accent:#176b48;--accent2:#dff1e7;--bad:#a33b2b;--bad2:#fbe4df;--good:#147044}
@media(prefers-color-scheme:dark){:root{--bg:#0e1511;--panel:#18211c;--ink:#edf5ef;--muted:#a8b5ad;--line:#34443a;--accent:#77d6a3;--accent2:#203d2e;--bad:#ff9d8e;--bad2:#3d211c;--good:#78dda4}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}
button,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0 8px 0 0}.grow{flex:1}.meta{color:var(--muted);font-size:13.5px}
.btn{border:1px solid var(--line);border-radius:9px;background:transparent;padding:7px 12px;cursor:pointer;color:var(--ink)}.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}.btn:disabled{opacity:.4;cursor:default}
.bar{height:6px;background:var(--line)}.bar i{display:block;height:100%;background:var(--accent);transition:width .15s}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.qmeta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:8px}
.qtext{font-size:19px;font-weight:650;line-height:1.4;margin-bottom:14px}
.fig{display:flex;justify-content:center;margin:0 0 14px}.fig img{max-width:100%;max-height:320px;background:#fff;border-radius:8px;padding:6px}
.choices{display:grid;gap:8px}.choice{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;background:transparent;padding:11px 13px;text-align:left;cursor:pointer}
.choice kbd{font:600 12px ui-monospace,monospace;border:1px solid var(--line);border-radius:5px;padding:1px 6px;height:fit-content;color:var(--muted)}
.choice:hover:not(:disabled){border-color:var(--accent)}.choice:disabled{cursor:default}
.choice.correct{border-color:var(--good);background:var(--accent2)}.choice.wrong{border-color:var(--bad);background:var(--bad2)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--accent2)}.fb.badfb{background:var(--bad2)}
.nav{display:flex;gap:8px;margin-top:16px;align-items:center}
.score{font-variant-numeric:tabular-nums;font-weight:650}
.done{text-align:center}.done h2{margin:0 0 6px;font-size:28px}.big{font-size:44px;font-weight:700;color:var(--accent)}
.hint{margin-top:18px;text-align:center}
</style>
</head>
<body>
<header class="top">
  <h1>SBL100 Speedrun</h1>
  <button class="btn" data-set="speed">⚡ Speedrun (<span id="nSpeed"></span>)</button>
  <button class="btn" data-set="worked">🧮 Worked problems (<span id="nWorked"></span>)</button>
  <select id="mod" class="btn"></select>
  <label class="meta"><input type="checkbox" id="shuffle"> Shuffle</label>
  <span class="grow"></span>
  <span id="score" class="score meta"></span>
  <span id="timer" class="score meta"></span>
</header>
<div class="bar"><i id="bar"></i></div>
<main><div id="card" class="card"></div><p class="hint meta">Keys: <b>1–4</b> or <b>A–D</b> to answer · <b>Enter</b>/<b>→</b> next · <b>←</b> previous</p></main>
<script>
const D={"modules": {"1": "Bioenergetics & ATP", "2": "Gene expression & lac operon", "3": "Genetic engineering toolkit", "4": "Genetic engineering applications", "5": "Biological motors", "6": "Cellular signaling", "7": "Apoptosis & the cell cycle", "8": "Stem cells & differentiation", "9": "Innate immunity", "10": "Host–pathogen interaction", "11": "Cell death pathways", "12": "Cancer biology", "13": "Drug development", "14": "Biophysical methods", "15": "Cross-module integration"}, "speed": [{"id": "d6", "m": 1, "q": "Which relationship between ΔG°′ and K′eq is correct?", "o": ["ΔG°′ = RT ln K′eq", "ΔG°′ = −RT ln K′eq", "ΔG°′ = K′eq/RT", "ΔG°′ = RT/K′eq"], "a": 1, "e": "The standard transformed free-energy change is related to equilibrium by ΔG°′ = −RT ln K′eq."}, {"id": "d24", "m": 1, "q": "Which sign indicates that products are more disordered than reactants?", "o": ["ΔS < 0", "ΔS > 0", "ΔH < 0", "ΔG = 0"], "a": 1, "e": "A positive entropy change means disorder is greater in the products."}, {"id": "d28", "m": 1, "q": "What hydrogen-ion concentration defines pH 7 in the biochemical standard state?", "o": ["10^−14 M", "10^−7 M", "1 M", "55.5 M"], "a": 1, "e": "The biochemical standard state fixes [H+] at 10^−7 M, corresponding to pH 7."}, {"id": "d42", "m": 1, "q": "Which ATP cleavage products result when pyrophosphate is removed?", "o": ["ADP + Pi", "AMP + PPi", "Adenosine + three Pi", "AMP + ADP"], "a": 1, "e": "Cleavage between the alpha and beta phosphates yields AMP and pyrophosphate."}, {"id": "d49", "m": 1, "q": "Nucleophilic attack at ATP's gamma phosphate leaves which nucleotide product?", "o": ["AMP", "ADP", "Adenosine", "cAMP"], "a": 1, "e": "Gamma-phosphate attack transfers a phosphoryl group and leaves ADP."}, {"id": "d51", "m": 1, "q": "Which molecule is the enzyme in the firefly light-producing system?", "o": ["Luciferin", "Luciferase", "Luciferyl adenylate", "Oxyluciferin"], "a": 1, "e": "Luciferase catalyzes activation and oxidation steps involving the substrate luciferin."}, {"id": "d52", "m": 1, "q": "When [S] equals KM, the reaction rate is:", "o": ["Zero", "Vmax/4", "Vmax/2", "2Vmax"], "a": 2, "e": "KM is numerically equal to the substrate concentration at which the rate is half of Vmax."}, {"id": "d55", "m": 1, "q": "If K′eq is greater than 1, ΔG°′ is:", "o": ["Negative", "Positive", "Always zero", "Undefined"], "a": 0, "e": "Because ΔG°′ = −RT ln K′eq, K′eq greater than 1 gives a negative value."}, {"id": "d56", "m": 1, "q": "1 kcal is equal to:", "o": ["0.184 kJ", "1 kJ", "4.184 kJ", "41.84 kJ"], "a": 2, "e": "The conversion displayed is 1 kcal = 4.184 kJ."}, {"id": "d57", "m": 1, "q": "If A → B has ΔG°′1 and B → C has ΔG°′2, the ΔG°′ for A → C is:", "o": ["ΔG°′1 − ΔG°′2", "ΔG°′1 + ΔG°′2", "ΔG°′1 × ΔG°′2", "Always zero"], "a": 1, "e": "Standard free-energy changes are additive for consecutive reactions."}, {"id": "d82", "m": 2, "q": "Which product is made directly by transcription?", "o": ["DNA", "RNA", "Protein", "Lipid"], "a": 1, "e": "RNA polymerase uses a DNA template to synthesize RNA."}, {"id": "d83", "m": 2, "q": "A newly made eukaryotic pre-mRNA contains:", "o": ["Only exons", "Only introns", "Exons and introns", "Protein and RNA"], "a": 2, "e": "Splicing removes introns from an exon-plus-intron precursor to form mature mRNA."}, {"id": "d85", "m": 2, "q": "Which process transfers residue-by-residue information from DNA to RNA?", "o": ["Replication", "Transcription", "Translation", "Protein folding"], "a": 1, "e": "Transcription copies genetic information from DNA into RNA."}, {"id": "d86", "m": 2, "q": "Which information transfer is represented by reverse transcription?", "o": ["DNA to RNA", "RNA to DNA", "RNA to protein", "Protein to RNA"], "a": 1, "e": "Reverse transcription uses RNA information to synthesize DNA."}, {"id": "d106", "m": 2, "q": "What is removed from pre-mRNA during splicing?", "o": ["Exons", "Introns", "Promoters", "Ribosomes"], "a": 1, "e": "RNA processing removes noncoding introns and joins the coding exons."}, {"id": "d108", "m": 2, "q": "Which molecule carries amino acids to the ribosome?", "o": ["DNA", "mRNA", "tRNA", "RNA polymerase"], "a": 2, "e": "Transfer RNA carries amino acids to the ribosome-mRNA complex."}, {"id": "d109", "m": 2, "q": "A regulatory protein increases transcription. It is acting as a:", "o": ["Repressor", "Activator", "Terminator", "Template strand"], "a": 1, "e": "An activator produces positive regulation by increasing gene expression."}, {"id": "d112", "m": 2, "q": "Which gene-product match is correct?", "o": ["lacZ — permease", "lacY — β-galactosidase", "lacA — transacetylase", "lacA — CAP"], "a": 2, "e": "lacA encodes transacetylase; lacZ encodes β-galactosidase and lacY encodes permease."}, {"id": "d123", "m": 2, "q": "Which sequences are removed when eukaryotic pre-mRNA becomes mature mRNA?", "o": ["The 5′ cap", "The poly(A) tail", "Introns", "Exons"], "a": 2, "e": "RNA splicing removes non-coding introns and joins exons."}, {"id": "d135", "m": 2, "q": "Which paired default states are correct?", "o": ["lac ON; trp OFF", "lac OFF; trp ON", "lac ON; trp ON", "lac OFF; trp OFF"], "a": 1, "e": "The inducible lac operon is usually OFF; the repressible trp operon is usually ON."}, {"id": "d139", "m": 3, "q": "Which PCR step separates double-stranded DNA into single strands?", "o": ["Annealing", "Extension", "Denaturation", "Ligation"], "a": 2, "e": "High temperature disrupts hydrogen bonding and separates the two DNA strands during denaturation."}, {"id": "d140", "m": 3, "q": "Under ideal amplification, how many copies arise from one starting DNA molecule after 10 PCR cycles?", "o": ["20", "100", "512", "1,024"], "a": 3, "e": "Ideal PCR doubles the target each cycle, giving 2^10 = 1,024 copies."}, {"id": "d154", "m": 3, "q": "Which energy source is specifically required by T4 DNA ligase?", "o": ["GTP", "NADPH", "CTP", "ATP"], "a": 3, "e": "T4 DNA ligase uses ATP to generate the ligase–AMP intermediate."}, {"id": "d172", "m": 3, "q": "Which enzyme joins the cut gene of interest to the vector?", "o": ["RNA polymerase", "DNA ligase", "β-galactosidase", "Cas9 only"], "a": 1, "e": "DNA ligase seals the DNA backbone to create the recombinant molecule."}, {"id": "d179", "m": 3, "q": "Which component determines the target sequence in CRISPR-Cas9?", "o": ["DNA ligase", "Guide RNA", "Selectable marker", "Agarose"], "a": 1, "e": "The guide RNA base-pairs with the selected DNA sequence and brings Cas9 to that target."}, {"id": "d180", "m": 3, "q": "Which repair pathway uses a donor DNA template for precise editing?", "o": ["NHEJ", "HDR", "Translation", "Gel electrophoresis"], "a": 1, "e": "Homology-directed repair uses a donor template to introduce a defined DNA change."}, {"id": "d181", "m": 3, "q": "Which feature provides sites for inserting a gene into a vector?", "o": ["MCS", "Ribosome", "cAMP", "ddNTP"], "a": 0, "e": "The multiple cloning site contains restriction sites used to insert foreign DNA."}, {"id": "d183", "m": 3, "q": "Which choice is a reporter gene rather than a selectable antibiotic-resistance marker?", "o": ["AmpR", "KanR", "GFP", "TetR"], "a": 2, "e": "GFP produces a fluorescent signal, while AmpR, KanR, and TetR provide antibiotic resistance."}, {"id": "d189", "m": 3, "q": "A bacterial population derived from one transformed progenitor is a:", "o": ["Vector", "Clone", "Marker", "Restriction site"], "a": 1, "e": "A clone is a genetically identical descendant population."}, {"id": "d194", "m": 3, "q": "Which temperature-stage match is correct?", "o": ["94–95°C—annealing", "50–65°C—extension", "72°C—extension", "72°C—denaturation"], "a": 2, "e": "Typical PCR uses high heat for denaturation, lower temperature for annealing, and 72°C for polymerase extension."}, {"id": "d215", "m": 4, "q": "Spider-silk-producing goats are engineered so that silk protein is secreted into:", "o": ["Blood plasma", "Saliva", "Urine", "Milk"], "a": 3, "e": "Mammary-gland expression enables recombinant spider-silk protein to be collected from goat milk."}, {"id": "d225", "m": 4, "q": "Hemophilia B is treated with recombinant:", "o": ["Factor VIII", "Human growth hormone", "Erythropoietin", "Factor IX"], "a": 3, "e": "Factor IX deficiency causes hemophilia B; factor VIII deficiency causes hemophilia A."}, {"id": "d245", "m": 4, "q": "What is produced directly by transcription of the recombinant gene?", "o": ["Protein", "mRNA", "Plasmid", "ATP"], "a": 1, "e": "Transcription makes mRNA; translation then uses that mRNA to make protein."}, {"id": "d249", "m": 4, "q": "Which recombinant protein is used to stimulate red blood cell production?", "o": ["EPO", "Factor VIII", "hGH", "Insulin"], "a": 0, "e": "Erythropoietin stimulates red blood cell production and is used for some forms of anemia."}, {"id": "d250", "m": 4, "q": "What antigen is used in the recombinant hepatitis B vaccine?", "o": ["EPO", "HBsAg", "Factor VIII", "Cry toxin"], "a": 1, "e": "The vaccine is based on hepatitis B surface antigen, HBsAg, produced in yeast."}, {"id": "d252", "m": 4, "q": "Which example uses engineered immune cells?", "o": ["SMA gene addition", "CAR-T therapy", "Golden rice", "Bt crops"], "a": 1, "e": "CAR-T therapy genetically engineers T cells to recognize selected targets."}, {"id": "d253", "m": 4, "q": "Which is an abiotic stress?", "o": ["Fungal infection", "Insect feeding", "Drought", "Bacterial disease"], "a": 2, "e": "Drought is a nonliving environmental condition, so it is an abiotic stress."}, {"id": "d254", "m": 4, "q": "What molecule gives Bt crops their insect-resistant property?", "o": ["HBsAg", "Cry protein", "EPO", "Imidazole"], "a": 1, "e": "Bt crops express Cry insecticidal proteins derived from Bacillus thuringiensis."}, {"id": "d255", "m": 4, "q": "Which nutrient precursor accumulates in Golden Rice?", "o": ["Beta-carotene", "Factor IX", "Methane", "Imidazole"], "a": 0, "e": "Golden Rice endosperm accumulates beta-carotene, which is a precursor of vitamin A."}, {"id": "d258", "m": 4, "q": "Where is spider-silk protein produced in the example?", "o": ["Goat milk", "Rice grain", "Bacterial agar", "Human blood"], "a": 0, "e": "The introduced spider genes direct production of spider-silk protein in goat milk."}, {"id": "d298", "m": 5, "q": "Which sarcomere region contains thick filament but no thin-filament overlap?", "o": ["H zone", "I band", "Z line", "Entire A band"], "a": 0, "e": "The H zone is the central thick-filament-only region around the M line."}, {"id": "d301", "m": 5, "q": "To approximately what tension was the suspended actin filament pulled?", "o": ["0.2 pN", "2 pN", "20 pN", "200 pN"], "a": 1, "e": "The second bead was moved until the actin filament experienced about 2 pN of tension."}, {"id": "d304", "m": 5, "q": "What maintains the acidic pH of lysosomes in the example?", "o": ["Proton pumps", "DNA sequencing", "Bt toxins", "Antibiotic markers"], "a": 0, "e": "Proton pumps use energy to maintain a nonequilibrium H+ concentration across the lysosomal membrane."}, {"id": "d306", "m": 5, "q": "Which pairing is correct?", "o": ["Microfilament—actin", "Microtubule—collagen", "Intermediate filament—DNA", "Microfilament—tubulin"], "a": 0, "e": "Actin forms microfilaments, while tubulin forms microtubules."}, {"id": "d311", "m": 5, "q": "In the ATP structure, which phosphate group is terminal and released as Pi during hydrolysis?", "o": ["Alpha", "Beta", "Gamma", "Ribose"], "a": 2, "e": "The gamma phosphate is the terminal phosphate."}, {"id": "d314", "m": 5, "q": "Which cytoskeletal polymer is assembled from tubulin?", "o": ["Microfilament", "Intermediate filament", "Microtubule", "Myosin thick filament"], "a": 2, "e": "Microtubules are tubulin polymers; microfilaments are actin polymers."}, {"id": "d315", "m": 5, "q": "The repeating light-dark pattern in skeletal muscle is called what?", "o": ["Treadmilling", "Striation", "Chemotaxis", "Birefringence"], "a": 1, "e": "Ordered sarcomeres generate visible striations."}, {"id": "d316", "m": 5, "q": "Which filament serves as the track for a myosin motor?", "o": ["Microtubule", "Actin filament", "Intermediate filament", "Collagen fibril"], "a": 1, "e": "Myosin moves relative to actin."}, {"id": "d322", "m": 5, "q": "Which myosin domain contains both ATP- and actin-binding sites?", "o": ["Head", "Neck", "Tail", "Regulatory light chain alone"], "a": 0, "e": "Both binding sites are in the globular head domain."}, {"id": "d328", "m": 5, "q": "For trap stiffness k, a bead displaced by x experiences which restoring-force relation?", "o": ["F = k/x", "F = −kx", "F = x/k", "F = −k/x²"], "a": 1, "e": "The trap is approximated as a Hookean spring."}, {"id": "d335", "m": 6, "q": "Which pancreatic cell type secretes insulin?", "o": ["Alpha cell", "Acinar cell", "Delta neuron", "Beta cell"], "a": 3, "e": "Pancreatic beta cells secrete insulin, whereas pancreatic alpha cells secrete glucagon."}, {"id": "d336", "m": 6, "q": "Which hormone is secreted by pancreatic alpha cells?", "o": ["Insulin", "Glucagon", "Cortisol", "Thyroxine"], "a": 1, "e": "Pancreatic alpha cells release glucagon, a hormone that supports an increase in blood glucose."}, {"id": "d337", "m": 6, "q": "Which local mediator is especially associated with increased vascular permeability during inflammation?", "o": ["GABA", "Histamine", "Thyroxine", "Insulin"], "a": 1, "e": "Histamine promotes inflammatory vascular changes, including vasodilation and increased permeability."}, {"id": "d341", "m": 6, "q": "How many membrane-spanning alpha helices are characteristic of a classical GPCR?", "o": ["One", "Three", "Twelve", "Seven"], "a": 3, "e": "Classical GPCRs contain a bundle of seven transmembrane alpha helices."}, {"id": "d345", "m": 6, "q": "Which enzyme synthesizes cyclic AMP from ATP?", "o": ["Adenylyl cyclase", "Protein kinase A", "Phosphodiesterase", "G protein-coupled receptor kinase"], "a": 0, "e": "Adenylyl cyclase is an effector enzyme that converts ATP into the second messenger cAMP."}, {"id": "d349", "m": 6, "q": "Which local mediator causes blood vessels to dilate and become leaky during inflammation?", "o": ["EGF", "TGF-beta", "Delta", "Histamine"], "a": 3, "e": "The histamine row lists vasodilation and increased leakiness during inflammation."}, {"id": "d350", "m": 6, "q": "Which pathway feature combines information from multiple signaling inputs?", "o": ["Specificity", "Integration", "Amplification", "Cascade"], "a": 1, "e": "Integration is the feature that combines multiple inputs into a coordinated output."}, {"id": "d359", "m": 6, "q": "Which receptor-modifying enzyme acts before arrestin binds?", "o": ["GRK", "Adenylyl cyclase", "PKA", "Phosphodiesterase"], "a": 0, "e": "A GPCR kinase, or GRK, first phosphorylates the active receptor."}, {"id": "d363", "m": 6, "q": "PDGF released from platelets at a wound acts mainly by which signaling mode?", "o": ["Autocrine", "Paracrine", "Endocrine", "Juxtacrine"], "a": 1, "e": "PDGF travels locally to nearby target cells during repair."}, {"id": "d367", "m": 6, "q": "Which component directly exchanges GDP for GTP after ligand-bound GPCR activation?", "o": ["G-beta", "Adenylyl cyclase", "Arrestin", "G-alpha"], "a": 3, "e": "The nucleotide-binding alpha subunit is activated by GDP release and GTP binding."}, {"id": "d378", "m": 7, "q": "Which protein is anti-apoptotic?", "o": ["BAX", "BAK", "BID", "BCL-XL"], "a": 3, "e": "BCL-XL belongs to the anti-apoptotic subgroup of the BCL-2 family."}, {"id": "d382", "m": 7, "q": "During which cell-cycle phase is nuclear DNA replicated?", "o": ["S", "G1", "G2", "M"], "a": 0, "e": "DNA synthesis occurs during S phase, producing sister chromatids."}, {"id": "d392", "m": 7, "q": "Chromosomes are accurately aligned on the spindle midplane during:", "o": ["Prophase", "Metaphase", "Anaphase", "Telophase"], "a": 1, "e": "Metaphase is defined by alignment at the cell equator or spindle midplane."}, {"id": "d394", "m": 7, "q": "Active, hypophosphorylated pRb prevents premature S-phase entry mainly by binding:", "o": ["BAX", "E2F", "Apaf-1", "Annexin V"], "a": 1, "e": "pRb restrains the G1-to-S transition by binding and inactivating E2F transcription factors."}, {"id": "d395", "m": 7, "q": "Where are engulfed apoptotic bodies degraded inside macrophages?", "o": ["Nucleoli", "Peroxisomes", "Phagolysosomes", "Centrosomes"], "a": 2, "e": "Macrophages phagocytose apoptotic bodies and degrade them within phagolysosomes."}, {"id": "d403", "m": 7, "q": "Which phase is described as a quiescent state outside active cycling?", "o": ["G0", "G1", "S", "G2"], "a": 0, "e": "Cells that temporarily or permanently stop dividing enter G0."}, {"id": "d404", "m": 7, "q": "During which phase are sister chromatids generated?", "o": ["G1", "S", "G2", "M"], "a": 1, "e": "Chromosome replication in S phase creates sister chromatids."}, {"id": "d417", "m": 7, "q": "At which structure do spindle microtubules attach to a chromosome?", "o": ["Kinetochore", "Nucleolus", "Phagolysosome", "Operator"], "a": 0, "e": "Kinetochores are the chromosome-associated attachment sites for spindle microtubules."}, {"id": "d426", "m": 7, "q": "Which complex component provides protease activity first in the extrinsic pathway?", "o": ["Caspase-8", "TRADD", "FADD", "TNFR1"], "a": 0, "e": "TRADD and FADD are adaptors; procaspase-8 becomes the initiator protease caspase-8."}, {"id": "d433", "m": 7, "q": "Which stage should follow the prophase frame before anaphase begins?", "o": ["Metaphase", "G1", "Cytokinesis", "G0"], "a": 0, "e": "Chromosomes next attach and align during prometaphase/metaphase before separating."}, {"id": "d439", "m": 8, "q": "Which potency category is restricted to only a few cell types?", "o": ["Totipotent", "Oligopotent", "Pluripotent", "Omnipotent"], "a": 1, "e": "Oligopotent progenitors can differentiate into a small number of related cell types."}, {"id": "d442", "m": 8, "q": "Which tissue is primarily derived from endoderm?", "o": ["Brain", "Bone", "Dermis", "Liver"], "a": 3, "e": "Endoderm gives rise to the digestive tract and organs such as the liver and pancreas."}, {"id": "d454", "m": 8, "q": "Which term describes the range of cell types that a cell can potentially become?", "o": ["Fate", "Potency", "Morphology", "Clonality"], "a": 1, "e": "Developmental potential, or potency, is the range of cell types a cell can become."}, {"id": "d456", "m": 8, "q": "Which potency class has the broadest developmental potential?", "o": ["Unipotent", "Oligopotent", "Multipotent", "Totipotent"], "a": 3, "e": "Totipotent cells can generate all cell types required for an organism."}, {"id": "d457", "m": 8, "q": "Which potency class is restricted to producing one specific cell type?", "o": ["Pluripotent", "Multipotent", "Oligopotent", "Unipotent"], "a": 3, "e": "A unipotent cell produces only its own specific cell type."}, {"id": "d476", "m": 8, "q": "Which germ layer gives rise to the brain and spinal cord?", "o": ["Ectoderm", "Mesoderm", "Endoderm", "Trophoblast only"], "a": 0, "e": "The nervous system, including brain and spinal cord, is an ectodermal derivative."}, {"id": "d481", "m": 8, "q": "In this experiment, GFP-positive regions identify cells expressing which early eye-development gene?", "o": ["Rx/Rax", "Klf4", "c-Myc", "TLR4"], "a": 0, "e": "The reporter marks Rx-positive cells, allowing early retinal tissue to be tracked."}, {"id": "d488", "m": 8, "q": "Which structure gives rise to embryonic stem-cell cultures?", "o": ["Trophoblast", "Blastocoel", "Zona pellucida only", "Inner cell mass"], "a": 3, "e": "Embryonic stem cells are derived from the blastocyst's inner cell mass."}, {"id": "d496", "m": 8, "q": "At what approximate time does the Rx-positive structure display the characteristic optic-cup shape?", "o": ["Day 9", "Day 1", "Day 5", "Day 16"], "a": 0, "e": "The Day 9 panels show the cup-shaped morphology."}, {"id": "d497", "m": 8, "q": "Which topic is the cited Karp reference intended to expand?", "o": ["Hematopoiesis", "Clonal selection", "Apoptosis", "Optic-cup morphogenesis"], "a": 2, "e": "The reference text explicitly says it is for details on apoptosis."}, {"id": "d514", "m": 9, "q": "Which organ is specifically important for T-cell maturation?", "o": ["Thymus", "Spleen", "Bone marrow", "Tonsil"], "a": 0, "e": "T-cell precursors mature in the thymus."}, {"id": "d516", "m": 9, "q": "Which structure filters lymph and provides a site for immune-cell encounters?", "o": ["Renal glomerulus", "Lymph node", "Artery", "Bone marrow sinusoid"], "a": 1, "e": "Lymph nodes filter lymph and organize interactions among antigens and immune cells."}, {"id": "d534", "m": 9, "q": "What is the main site of blood-cell formation in an adult?", "o": ["Bone marrow", "Skin", "Stomach", "Kidney tubules"], "a": 0, "e": "Adult hematopoiesis occurs predominantly in bone marrow."}, {"id": "d535", "m": 9, "q": "Which organ produces many circulating complement proteins?", "o": ["Liver", "Thymus", "Skin", "Bladder"], "a": 0, "e": "The liver synthesizes many of the complement proteins found in blood."}, {"id": "d539", "m": 9, "q": "Which component belongs to adaptive humoral immunity?", "o": ["Antibodies", "Skin", "Neutrophils", "Stomach acid"], "a": 0, "e": "Humoral adaptive immunity is mediated by antibodies produced by B-cell-derived plasma cells."}, {"id": "d541", "m": 9, "q": "Which antimicrobial enzyme is found in tears and saliva?", "o": ["Lysozyme", "Perforin", "Klf4", "Fibronectin"], "a": 0, "e": "Lysozyme helps damage bacterial cell walls at exposed surfaces."}, {"id": "d543", "m": 9, "q": "Which blood component is a soluble signaling molecule rather than a cell?", "o": ["Cytokine", "Neutrophil", "Monocyte", "Lymphocyte"], "a": 0, "e": "Cytokines are secreted proteins; neutrophils, monocytes and lymphocytes are cells."}, {"id": "d546", "m": 9, "q": "What is produced when a phagosome fuses with a lysosome?", "o": ["Phagolysosome", "Karyotype", "Antibody", "Lymph node"], "a": 0, "e": "The fused digestive compartment is called a phagolysosome."}, {"id": "d548", "m": 9, "q": "What forms the scaffold of a neutrophil extracellular trap?", "o": ["Decondensed DNA", "Cellulose", "Bone mineral", "Antibody RNA"], "a": 0, "e": "NETs are web-like structures built primarily from expelled, decondensed DNA decorated with antimicrobial proteins."}, {"id": "d549", "m": 9, "q": "What can a monocyte become after entering a tissue?", "o": ["Macrophage", "Erythrocyte", "Platelet", "Bacterium"], "a": 0, "e": "Tissue entry can drive monocyte differentiation into a macrophage."}, {"id": "d568", "m": 10, "q": "Which term means the presence of microbial toxin in the bloodstream?", "o": ["Toxigenicity", "Toxemia", "Virulence", "Opsonization"], "a": 1, "e": "Toxemia is toxin circulating in blood; toxigenicity is the capacity of an organism to produce toxin."}, {"id": "d571", "m": 10, "q": "Which NK-cell granule protein promotes entry of granzymes into the target cell?", "o": ["Lysozyme", "Coagulase", "Caspase-9", "Perforin"], "a": 3, "e": "Perforin facilitates delivery of granzymes, which initiate apoptotic death."}, {"id": "d579", "m": 10, "q": "Where is a bacterial capsule located?", "o": ["Inside the nucleoid", "Between DNA strands", "Within the ribosome", "Outside the cell wall"], "a": 3, "e": "A capsule is an external layer surrounding the bacterial cell wall."}, {"id": "d584", "m": 10, "q": "Which bacterial enzyme directly targets a mucosal antibody?", "o": ["Coagulase", "Hyaluronidase", "IgA protease", "Collagenase"], "a": 2, "e": "IgA protease cleaves secretory IgA and helps pathogens evade mucosal immunity."}, {"id": "d592", "m": 10, "q": "Diphtheria toxin fragment A halts translation by ADP-ribosylating:", "o": ["TLR4", "Caspase-8", "eEF-2", "Gsα"], "a": 2, "e": "Modification of the diphthamide residue of eEF-2 prevents protein elongation."}, {"id": "d594", "m": 10, "q": "How many transmembrane helices characterize a typical GPCR?", "o": ["One", "Three", "Twelve", "Seven"], "a": 3, "e": "GPCRs contain seven membrane-spanning alpha helices."}, {"id": "d597", "m": 10, "q": "The toxic portion of Gram-negative lipopolysaccharide is:", "o": ["Peptidoglycan", "M protein", "Mycolic acid", "Lipid A"], "a": 3, "e": "Endotoxin activity resides in the lipid A component of LPS."}, {"id": "d600", "m": 10, "q": "A substance that induces fever is termed a:", "o": ["Adhesin", "Invasin", "Pyrogen", "Opsonin"], "a": 2, "e": "Endotoxins are pyrogens because they can induce fever."}, {"id": "d603", "m": 10, "q": "Which microbial molecule is recognized by TLR4?", "o": ["Lipopolysaccharide", "Host fibronectin", "Perforin", "Oct3/4"], "a": 0, "e": "TLR4 is the classic innate receptor associated with detection of bacterial LPS."}, {"id": "d609", "m": 10, "q": "Which wall component is explicitly composed of sugars and amino acids?", "o": ["Lipid A", "Cholesterol", "Peptidoglycan", "Mycolic acid"], "a": 2, "e": "Peptidoglycan is identified as the sugar-and-amino-acid wall polymer."}, {"id": "d626", "m": 11, "q": "Which proteins are abundant lysosomal proteases?", "o": ["Cathepsins L, B, and D", "Caspases 8, 9, and 3", "BAX, BAK, and BCL-2", "GPX4, FSP1, and DHFR"], "a": 0, "e": "Cathepsins L, B, and D are major proteolytic enzymes within lysosomes."}, {"id": "d633", "m": 11, "q": "Cleavage of phospholipid-transfer proteins during apoptosis causes surface exposure of:", "o": ["Phosphatidylserine", "Lipid A", "Mycolic acid", "Peptidoglycan"], "a": 0, "e": "Disrupted phospholipid asymmetry exposes phosphatidylserine on the cell surface."}, {"id": "d635", "m": 11, "q": "Cytochrome c release promotes assembly of which caspase-activating complex?", "o": ["Phagolysosome", "Inflammasome", "Apoptosome", "DISC"], "a": 2, "e": "Cytosolic cytochrome c drives apoptosome assembly and activation of initiator caspase-9."}, {"id": "d637", "m": 11, "q": "Which adaptor protein is recruited to activated Fas receptors?", "o": ["Apaf-1", "RIPK3", "GPX4", "FADD"], "a": 3, "e": "FADD links clustered Fas death receptors to procaspase-8 within the DISC."}, {"id": "d638", "m": 11, "q": "Which initiator caspase is activated in the Fas-associated DISC?", "o": ["Caspase-3", "Caspase-7", "Caspase-8", "Caspase-9"], "a": 2, "e": "The extrinsic pathway activates initiator caspase-8 at the DISC."}, {"id": "d641", "m": 11, "q": "Which molecules released by necroptotic cells alert immune cells to tissue damage?", "o": ["AB5 holotoxins", "DAMPs", "BH domains", "MHC peptides"], "a": 1, "e": "Lytic membrane rupture releases damage-associated molecular patterns, or DAMPs."}, {"id": "d642", "m": 11, "q": "What activates many lysosomal degradative enzymes?", "o": ["High cytosolic pH", "MHC class I loss", "Extracellular ATP depletion", "Low luminal pH"], "a": 3, "e": "The acidic lysosomal lumen turns on multiple degradative hydrolases."}, {"id": "d644", "m": 11, "q": "Which enzyme is a major defense against phospholipid hydroperoxide accumulation?", "o": ["GPX4", "Caspase-8", "Coagulase", "TLR4"], "a": 0, "e": "GPX4 reduces phospholipid hydroperoxides and suppresses ferroptotic membrane damage."}, {"id": "d646", "m": 11, "q": "Which initiator caspase is recruited in the Fas extrinsic pathway?", "o": ["Caspase-8", "Caspase-9", "Caspase-3", "Caspase-6"], "a": 0, "e": "FADD recruits caspase-8 into the DISC, where caspase-8 is activated."}, {"id": "d651", "m": 11, "q": "Which protein is the downstream membrane-disrupting effector of the RIPK1-RIPK3 necroptosis axis?", "o": ["LC3", "MLKL", "BCL-2", "Caspase-9"], "a": 1, "e": "Activated RIPK3 phosphorylates MLKL, which oligomerizes and damages the plasma membrane."}, {"id": "d655", "m": 12, "q": "Which term describes penetration of malignant cells into surrounding tissue?", "o": ["Invasion", "Metastasis", "Apoptosis", "Senescence"], "a": 0, "e": "Invasion is local penetration into adjacent tissue; metastasis is spread to a distant site."}, {"id": "d663", "m": 12, "q": "Loss of MHC class I most directly helps a tumor evade which immune cell?", "o": ["CD8 T cell", "B cell", "Neutrophil", "Eosinophil"], "a": 0, "e": "CD8 T cells recognize peptide antigens presented by MHC class I."}, {"id": "d668", "m": 12, "q": "Which nucleotide-bound form of RAS is active?", "o": ["RAS-AMP", "RAS-GDP", "RAS-GTP", "RAS-CMP"], "a": 2, "e": "RAS is active when bound to GTP and inactive when bound to GDP."}, {"id": "d676", "m": 12, "q": "Spread of cancer cells from a primary tumor to a distant organ is called:", "o": ["Apoptosis", "Senescence", "Metastasis", "Hyperplasia"], "a": 2, "e": "Metastasis is spread from the original primary tumor to another site."}, {"id": "d681", "m": 12, "q": "Under normal oxygen, hydroxylated HIF-alpha is recognized by which protein before degradation?", "o": ["PD-L1", "VHL", "HIF-beta", "VEGF"], "a": 1, "e": "VHL recognizes hydroxylated HIF-alpha and directs its ubiquitination and degradation."}, {"id": "d682", "m": 12, "q": "In hypoxia, stabilized HIF-alpha enters the nucleus and pairs with:", "o": ["HIF-beta", "VHL", "Ubiquitin", "Lactate dehydrogenase"], "a": 0, "e": "HIF-alpha dimerizes with HIF-beta to activate hypoxia-response genes."}, {"id": "d691", "m": 12, "q": "Which protein is transcriptionally upregulated by p53 to arrest the cell cycle?", "o": ["RAS", "EGFR", "p21", "MDM2 only"], "a": 2, "e": "p53 induces p21, which inhibits cyclin-CDK complexes."}, {"id": "d693", "m": 12, "q": "Which negative regulator promotes both nuclear export and proteasomal degradation of p53?", "o": ["MDMX", "MDM2", "p21", "BCL-2"], "a": 1, "e": "MDM2 promotes p53 nuclear export, ubiquitination, and proteasomal degradation."}, {"id": "d699", "m": 12, "q": "Which ADME stage moves drug from blood into tissues?", "o": ["Distribution", "Metabolism", "Excretion", "Absorption"], "a": 0, "e": "Distribution is movement of drug from the circulation into tissues."}, {"id": "d702", "m": 12, "q": "Which ADME stage mainly describes chemical alteration of a drug?", "o": ["Absorption", "Distribution", "Metabolism", "Excretion"], "a": 2, "e": "Metabolism chemically changes a drug, commonly through enzymes such as CYP450."}, {"id": "d712", "m": 13, "q": "Which pharmacokinetic quantity represents the maximum measured plasma concentration?", "o": ["AUC", "Cmax", "tmax", "t1/2"], "a": 1, "e": "Cmax is the highest plasma concentration reached after a dose."}, {"id": "d714", "m": 13, "q": "Which reaction is a conjugation reaction?", "o": ["Hydroxylation", "Dealkylation", "Glucuronidation", "Hydrolysis"], "a": 2, "e": "Glucuronidation attaches glucuronic acid to a molecule, generally increasing hydrophilicity."}, {"id": "d717", "m": 13, "q": "Which molecule normally detoxifies NAPQI?", "o": ["Glutathione", "Glycogen", "Cholesterol", "Creatinine"], "a": 0, "e": "Glutathione conjugates NAPQI and limits its covalent damage to cellular proteins."}, {"id": "d728", "m": 13, "q": "Which functional group of captopril directly coordinates the catalytic Zn2+ of ACE?", "o": ["Thiol", "Methyl", "Amide", "Ether"], "a": 0, "e": "Captopril's thiol group binds the catalytic zinc ion strongly, contributing substantially to ACE inhibition."}, {"id": "d731", "m": 13, "q": "Which pharmacokinetic quantity is the time coordinate of the concentration peak?", "o": ["tmax", "AUC", "t1/2", "Cmax"], "a": 0, "e": "tmax is the time at which Cmax is reached."}, {"id": "d743", "m": 13, "q": "Renin acts upstream of ACE in the RAAS pathway to generate:", "o": ["Aldosterone", "Bradykinin", "Angiotensin I", "Angiotensin II"], "a": 2, "e": "Renin produces angiotensin I, which ACE then converts to angiotensin II."}, {"id": "d744", "m": 13, "q": "Angiotensin II promotes release of which hormone in the RAAS pathway?", "o": ["Melatonin", "Aldosterone", "Insulin", "Thyroxine"], "a": 1, "e": "Angiotensin II stimulates aldosterone release as part of blood-pressure regulation."}, {"id": "d745", "m": 13, "q": "ACE converts angiotensin I into:", "o": ["Angiotensinogen", "Angiotensin II", "Renin", "Aldosterone"], "a": 1, "e": "Angiotensin-converting enzyme generates angiotensin II from angiotensin I."}, {"id": "d749", "m": 13, "q": "Which quantity represents total drug exposure across time?", "o": ["Cmax", "tmax", "AUC", "Onset"], "a": 2, "e": "The area under the concentration-time curve is the total measured exposure."}, {"id": "d751", "m": 13, "q": "Which venom-derived peptide guided the development of captopril?", "o": ["Teprotide", "Insulin", "Angiotensinogen", "Glutathione"], "a": 0, "e": "Teprotide from Bothrops jararaca venom inhibited ACE and inspired synthetic analogs."}, {"id": "d790", "m": 14, "q": "Dose-response analysis is performed after:", "o": ["Phase III completion", "Commercial packaging", "Hit confirmation", "Regulatory approval"], "a": 2, "e": "Confirmed hits are characterized by dose-response before lead selection and optimization."}, {"id": "d794", "m": 14, "q": "System Xc- supports ferroptosis resistance by supplying cystine for synthesis of:", "o": ["Heme", "Glutathione", "Cholesterol", "Glycogen"], "a": 1, "e": "Imported cystine supports glutathione synthesis, which GPX4 uses to detoxify lipid hydroperoxides."}, {"id": "d795", "m": 14, "q": "A prodrug is converted in the body into:", "o": ["A placebo", "A receptor", "A dietary nutrient", "An active drug"], "a": 3, "e": "A prodrug is an inactive or less active derivative designed to release the active drug in vivo."}, {"id": "d801", "m": 14, "q": "What is placed in the ITC reference cell?", "o": ["Buffer", "Protein plus ligand", "Ligand crystal", "Fluorescent dye"], "a": 0, "e": "The sample cell contains protein, while the reference cell contains buffer."}, {"id": "d803", "m": 14, "q": "For the exothermic ITC example, the sign of binding enthalpy is:", "o": ["Zero", "Undefined", "Positive", "Negative"], "a": 3, "e": "Heat release corresponds to a negative enthalpy change."}, {"id": "d804", "m": 14, "q": "Before the next ITC injection, the heat signal should:", "o": ["Remain permanently displaced", "Return to baseline", "Reach its maximum", "Change sign"], "a": 1, "e": "Baseline recovery separates successive peaks and allows clean integration."}, {"id": "d809", "m": 14, "q": "Ubiquitinated p53 is directed to which degradation machinery?", "o": ["Spliceosome", "Centrosome", "Proteasome", "Ribosome"], "a": 2, "e": "MDM2-mediated ubiquitination directs p53 to proteasomal degradation."}, {"id": "d811", "m": 14, "q": "Mitochondrial cytochrome c release promotes formation of the:", "o": ["Proteasome", "Replisome", "Inflammasome only", "Apoptosome"], "a": 3, "e": "Cytochrome c supports apoptosome assembly, leading to caspase activation."}, {"id": "d812", "m": 14, "q": "At donor-acceptor distance r = R0, FRET efficiency is:", "o": ["50%", "100%", "0%", "25%"], "a": 0, "e": "R0 is defined as the Förster radius at which transfer efficiency is 50%."}, {"id": "d815", "m": 14, "q": "In Cameleon, calcium binding causes calmodulin to interact with:", "o": ["VHL", "MDM2", "GPX4", "M13"], "a": 3, "e": "Ca2+-bound calmodulin binds M13, bringing CFP and YFP into a FRET-active arrangement."}], "worked": [{"id": "p0", "m": 1, "q": "A reaction A ⇌ B has K′eq = 10 at 25 °C (RT ≈ 2.48 kJ/mol, so RT·ln10 ≈ 5.7 kJ/mol). What is ΔG°′?", "o": ["−5.7 kJ/mol", "+5.7 kJ/mol", "−2.5 kJ/mol", "−24.8 kJ/mol"], "a": 0, "e": "ΔG°′ = −RT ln K′eq = −(2.48)(ln 10) = −5.7 kJ/mol. A K′eq above 1 always gives a negative ΔG°′, and every 10-fold change in K′eq shifts ΔG°′ by about 5.7 kJ/mol at 25 °C. That rule of thumb lets you solve most free-energy MCQs without a calculator: K′eq = 1000 → about −17 kJ/mol; K′eq = 0.01 → about +11.4 kJ/mol. −24.8 kJ/mol comes from forgetting the logarithm."}, {"id": "p1", "m": 1, "q": "A reaction has ΔG°′ = +5.7 kJ/mol, but the cell keeps [product]/[reactant] = 10⁻³. Which way does it run in the cell?", "o": ["Reverse, because ΔG°′ is positive", "Forward, because actual ΔG ≈ −11.4 kJ/mol", "It is at equilibrium, because ΔG = 0", "Neither way until an enzyme lowers ΔG°′ below zero"], "a": 1, "e": "Actual ΔG = ΔG°′ + RT ln([P]/[R]) = 5.7 + 5.7·log₁₀(10⁻³) = 5.7 − 17.1 = −11.4 kJ/mol, so the reaction runs forward. Cells do this all the time: a later step consumes the product and keeps the ratio low. ΔG°′ describes only standard conditions (1 M of everything, pH 7). Direction in a real cell is set by ΔG. Enzymes never change ΔG°′ or ΔG; they change only the rate."}, {"id": "p2", "m": 1, "q": "Glucose + Pi → glucose-6-phosphate has ΔG°′ = +13.8 kJ/mol. ATP → ADP + Pi has ΔG°′ = −30.5 kJ/mol. What is ΔG°′ for glucose + ATP → G6P + ADP?", "o": ["+44.3 kJ/mol", "−44.3 kJ/mol", "−16.7 kJ/mol", "+16.7 kJ/mol"], "a": 2, "e": "Free-energy changes are additive when reactions share intermediates: +13.8 + (−30.5) = −16.7 kJ/mol. This is energy coupling, the reason ATP can drive unfavourable steps. In the cell it happens through group transfer: hexokinase moves the phosphoryl group directly from ATP onto glucose. ATP is not first hydrolysed to release free energy that is then caught somehow. ΔG is a state function, so the sum is the same whatever the actual mechanism."}, {"id": "p3", "m": 1, "q": "A reaction has ΔG = −40 kJ/mol but shows no measurable product after a day. Which conclusion is correct?", "o": ["ΔG must have been calculated with the wrong sign", "The reaction is favourable but kinetically slow", "The reaction is at equilibrium and cannot proceed", "Adding enzyme would make ΔG more negative"], "a": 1, "e": "Thermodynamics (ΔG) tells you direction and how much energy is available. Kinetics (activation energy) tells you speed. A large negative ΔG with no product means a high activation barrier. Example: glucose oxidation is hugely favourable, yet sugar sits in air for years. Enzymes lower the activation energy and speed both directions equally, so they leave ΔG and K′eq unchanged."}, {"id": "p4", "m": 1, "q": "An enzyme follows Michaelis–Menten kinetics with Km = 2 mM. At [S] = 6 mM, what fraction of Vmax is the rate?", "o": ["0.25", "0.50", "0.75", "1.00"], "a": 2, "e": "v = Vmax·[S]/(Km + [S]) = Vmax·6/(2 + 6) = 0.75 Vmax. Useful checkpoints: [S] = Km gives exactly ½Vmax; [S] = 3Km gives ¾; [S] = 9Km gives 90%. Vmax is approached only asymptotically, so 1.00 is never actually reached. At [S] ≪ Km the rate is nearly proportional to [S] (first-order); at [S] ≫ Km it is nearly independent of [S] (zero-order, saturated)."}, {"id": "p5", "m": 1, "q": "Read the curve. What is Km?", "o": ["80 µmol/min", "40 µmol/min", "4 mM", "20 mM"], "a": 2, "e": "Km is a substrate concentration, not a rate. Find ½Vmax on the y-axis (40, since Vmax = 80) and read across to the x-axis: 4 mM. The usual traps are giving Vmax (80) or ½Vmax (40), which are rates in µmol/min. A lower Km means the enzyme reaches half-saturation at lower [S], which is loosely called higher apparent affinity.", "f": "<svg viewBox='0 0 300 190'><line x1='40' y1='160' x2='295' y2='160' stroke='currentColor'/><line x1='40' y1='160' x2='40' y2='12' stroke='currentColor'/><polyline points='40.0,160.0 42.5,152.5 45.0,145.8 47.5,139.8 50.0,134.4 52.5,129.5 55.0,125.1 57.5,121.0 60.0,117.3 62.5,113.9 65.0,110.8 67.5,107.9 70.0,105.1 72.5,102.6 75.0,100.3 77.5,98.1 80.0,96.0 82.5,94.1 85.0,92.2 87.5,90.5 90.0,88.9 92.5,87.4 95.0,85.9 97.5,84.5 100.0,83.2 102.5,82.0 105.0,80.8 107.5,79.6 110.0,78.5 112.5,77.5 115.0,76.5 117.5,75.6 120.0,74.7 122.5,73.8 125.0,73.0 127.5,72.2 130.0,71.4 132.5,70.6 135.0,69.9 137.5,69.2 140.0,68.6 142.5,67.9 145.0,67.3 147.5,66.7 150.0,66.1 152.5,65.6 155.0,65.0 157.5,64.5 160.0,64.0 162.5,63.5 165.0,63.0 167.5,62.6 170.0,62.1 172.5,61.7 175.0,61.3 177.5,60.8 180.0,60.4 182.5,60.1 185.0,59.7 187.5,59.3 190.0,58.9 192.5,58.6 195.0,58.3 197.5,57.9 200.0,57.6 202.5,57.3 205.0,57.0 207.5,56.7 210.0,56.4 212.5,56.1 215.0,55.8 217.5,55.5 220.0,55.3 222.5,55.0 225.0,54.8 227.5,54.5 230.0,54.3 232.5,54.0 235.0,53.8 237.5,53.6 240.0,53.3 242.5,53.1 245.0,52.9 247.5,52.7 250.0,52.5 252.5,52.3 255.0,52.1 257.5,51.9 260.0,51.7 262.5,51.5 265.0,51.3 267.5,51.1 270.0,51.0 272.5,50.8 275.0,50.6 277.5,50.5 280.0,50.3 282.5,50.1 285.0,50.0 287.5,49.8 290.0,49.7' fill='none' stroke='var(--acc)' stroke-width='2.5'/><line x1='40' y1='32.0' x2='295' y2='32.0' stroke='currentColor' stroke-dasharray='4 4' opacity='.6'/><line x1='40' y1='96.0' x2='80' y2='96.0' stroke='currentColor' stroke-dasharray='4 4' opacity='.6'/><line x1='80' y1='96.0' x2='80' y2='160' stroke='currentColor' stroke-dasharray='4 4' opacity='.6'/><text x='14' y='36' font-size='10' fill='currentColor'>80</text><text x='14' y='100' font-size='10' fill='currentColor'>40</text><text x='77' y='174' font-size='10' fill='currentColor'>4</text><text x='136' y='174' font-size='10' fill='currentColor'>10</text><text x='236' y='174' font-size='10' fill='currentColor'>20</text><text x='150' y='188' font-size='10' fill='currentColor'>[S] (mM)</text><text x='44' y='10' font-size='10' fill='currentColor'>v (µmol/min)</text></svg>"}, {"id": "p6", "m": 1, "q": "Enzyme X has Km = 0.1 mM and enzyme Y has Km = 10 mM for the same substrate. Cellular [S] is 0.1 mM. Which statement is correct?", "o": ["X runs near ½ its Vmax; Y runs near 1% of its Vmax", "Y runs faster because its larger Km means faster turnover", "Both run at ½ Vmax because Km is the same idea", "X is saturated, so its rate does not depend on [S]"], "a": 0, "e": "For X, [S] = Km, so v = ½Vmax. For Y, v = Vmax·0.1/(10 + 0.1) ≈ 0.01 Vmax. Km tells you the [S] range where an enzyme is responsive, and says nothing about the maximum speed (that is Vmax, or kcat per enzyme). Low-Km enzymes work well at scarce substrate; high-Km enzymes respond roughly linearly over a wide [S] range. Being saturated would need [S] ≫ Km, which is not the case for either."}, {"id": "p7", "m": 1, "q": "A process has ΔH = −20 kJ/mol and ΔS = −100 J/(mol·K). At 310 K, which is true?", "o": ["ΔG ≈ −51 kJ/mol; strongly favourable", "ΔG ≈ +11 kJ/mol; unfavourable as written", "ΔG ≈ −20 kJ/mol; entropy does not matter", "ΔG ≈ +31 kJ/mol; enthalpy is ignored"], "a": 1, "e": "ΔG = ΔH − TΔS = −20 − (310)(−0.100) = −20 + 31 = +11 kJ/mol. Convert J to kJ before combining the terms; that unit slip is the commonest error. Favourable bonding (negative ΔH) can be outweighed by a loss of disorder (negative ΔS) at high temperature. This reaction would become favourable below about 200 K, where TΔS falls under 20 kJ/mol. Living cells stay ordered by exporting entropy and heat to their surroundings."}, {"id": "p8", "m": 1, "q": "Inside a cell, a reaction is exactly at equilibrium. What can you say about ΔG and ΔG°′?", "o": ["Both are zero", "ΔG = 0, but ΔG°′ can be any value", "ΔG°′ = 0, but ΔG can be any value", "Both must be negative"], "a": 1, "e": "At equilibrium the actual ΔG is zero: there is no net driving force. ΔG°′ is a constant fixed by K′eq (ΔG°′ = −RT ln K′eq), so it is zero only if K′eq happens to equal 1. Keep the two straight: ΔG°′ is a property of the reaction; ΔG is a property of the reaction under the current concentrations. Many MCQ traps assume equilibrium implies ΔG°′ = 0."}, {"id": "p9", "m": 1, "q": "Why does biochemistry use a ‘transformed’ standard state (ΔG°′) instead of the chemist's ΔG°?", "o": ["Because enzymes in cells alter the true free energy of the reactions they catalyse", "Because real cells are at pH 7 with water ~55.5 M, not 1 M H⁺", "Because biological reactions never reach equilibrium", "Because ATP is only stable at 1 M concentration"], "a": 1, "e": "The chemist's standard state uses 1 M H⁺ (pH 0), which is meaningless for cells. The biochemical convention sets [H⁺] = 10⁻⁷ M (pH 7), treats water as constant at 55.5 M (folded into K′eq), and sets Mg²⁺ at 1 mM where it matters. The prime mark (′) flags this convention. Reactions that release or consume H⁺ have quite different ΔG° and ΔG°′ values, so the two are not interchangeable."}, {"id": "p10", "m": 1, "q": "Pathway: A → B (ΔG°′ = +4 kJ/mol), then B → C (ΔG°′ = −12 kJ/mol). A different enzyme converts A → C directly. What is ΔG°′ for the direct route?", "o": ["−12 kJ/mol", "−8 kJ/mol", "+16 kJ/mol", "Cannot be known without the direct enzyme's Km"], "a": 1, "e": "ΔG is a state function: it depends only on the start (A) and end (C), not the route or the catalyst. Overall ΔG°′ = +4 + (−12) = −8 kJ/mol by either path. The same principle explains why an unfavourable step can be pulled forward by a strongly favourable next step that shares its intermediate (B). Km is a kinetic parameter and has no bearing on ΔG°′."}, {"id": "p11", "m": 1, "q": "Fatty-acid synthesis happens in the cytosol, while fatty-acid breakdown happens in mitochondria using different enzymes. What is the main benefit?", "o": ["It lets both pathways run at full speed simultaneously", "It prevents a futile cycle and allows independent regulation", "It makes the synthesis pathway thermodynamically favourable", "It lets one enzyme catalyse both directions efficiently"], "a": 1, "e": "If one set of enzymes ran a pathway both ways, the cell could not turn synthesis on and breakdown off independently. It would cycle molecules back and forth, burning ATP for nothing (a futile cycle). Using separate enzymes, and often separate compartments, gives independent control points. Related point: catabolic pathways converge (many fuels → a few common intermediates like acetyl-CoA), while anabolic pathways diverge (a few precursors → many products)."}, {"id": "p12", "m": 1, "q": "In a cell, [ATP] = 8 mM, [ADP] = 1 mM, [Pi] = 8 mM, T = 310 K (RT ≈ 2.58 kJ/mol). With ΔG°′ = −30.5 kJ/mol, the actual ΔG for ATP hydrolysis is approximately:", "o": ["−30.5 kJ/mol", "−12.7 kJ/mol", "−48 kJ/mol", "+17.8 kJ/mol"], "a": 2, "e": "Q = [ADP][Pi]/[ATP] = (10⁻³)(8×10⁻³)/(8×10⁻³) = 10⁻³. ΔG = −30.5 + 2.58·ln(10⁻³) = −30.5 + 2.58(−6.91) ≈ −30.5 − 17.8 ≈ −48 kJ/mol. Cells keep ATP far above equilibrium with ADP, so ATP is a much stronger driver in vivo than its standard value suggests (typically −50 to −65 kJ/mol). Mg²⁺ binding also shifts the value; the real substrate of most kinases is MgATP²⁻."}, {"id": "p13", "m": 1, "q": "Standard free energies of hydrolysis (kJ/mol): PEP −61.9, 1,3-bisphosphoglycerate −49.3, phosphocreatine −43.0, ATP −30.5, glucose-6-phosphate −13.8. Under standard conditions, which transfer is favourable?", "o": ["Glucose-6-phosphate phosphorylating ADP to make ATP", "ATP phosphorylating creatine to make phosphocreatine", "PEP phosphorylating ADP to make ATP", "ATP phosphorylating pyruvate to make PEP"], "a": 2, "e": "A phosphoryl group flows ‘downhill’ from a compound with a more negative hydrolysis ΔG°′ to an acceptor whose phosphorylated form sits higher (less negative). PEP → ATP: −61.9 + 30.5 = −31.4 kJ/mol, which is favourable; this is pyruvate kinase in glycolysis. G6P → ATP would be +16.7, and ATP → phosphocreatine would be +12.5 (that direction runs in muscle only when [ATP] is high). ATP sits in the middle of the scale, so it can accept phosphoryls from ‘high-energy’ compounds and donate them to ‘low-energy’ acceptors. That intermediate position is exactly why it works as the energy currency."}, {"id": "p14", "m": 1, "q": "Most kinases do not use free ATP⁴⁻ directly. What is their true substrate, and why does it matter?", "o": ["ADP, because the β-phosphate is transferred first", "MgATP²⁻; Mg²⁺ binding changes ΔG°′ and orients the phosphates", "cAMP, because it is the activated form of ATP", "ATP bound to water at 55.5 M, which defines the standard state"], "a": 1, "e": "Cytosolic Mg²⁺ chelates ATP and ADP, so the species enzymes actually bind is MgATP²⁻. Mg²⁺ shields the negative charges and holds the phosphate chain in a defined geometry for nucleophilic attack. This also shifts the hydrolysis free energy. That is one reason the course stresses that the ‘relevant ΔG°′’ is the one for MgATP²⁻, and that ΔG in cells differs from −30.5 kJ/mol."}, {"id": "p15", "m": 1, "q": "Glutamine synthesis from glutamate + NH₃ is unfavourable on its own. ATP drives it by first making glutamyl-phosphate. This shows that ATP usually works by:", "o": ["Releasing heat that the enzyme absorbs to do work", "Group transfer that creates a reactive covalent intermediate", "Being hydrolysed in solution first, with the heat captured by the enzyme", "Lowering the activation energy of the reverse reaction"], "a": 1, "e": "ATP donates a phosphoryl (or pyrophosphoryl/adenylyl) group to the substrate or enzyme, forming a high-energy intermediate. That intermediate then reacts in a favourable second step. The coupling is chemical and stepwise; free energy released as heat cannot drive chemistry. Direct ATP hydrolysis does occur, mainly in motors, helicases, RecA, topoisomerases and replication ATPases, where it cycles a protein between conformations."}, {"id": "p16", "m": 1, "q": "In firefly luciferase, ATP first reacts with luciferin to form luciferyl adenylate. What is released, and what does that tell you?", "o": ["Pi, showing ATP is cleaved to ADP + Pi", "PPi, showing ATP is cleaved to AMP + PPi", "AMP, showing the γ-phosphate is transferred", "CO₂, showing luciferin is decarboxylated first"], "a": 1, "e": "Luciferin attacks the α-phosphate of ATP, attaching AMP (an adenylyl group) and releasing pyrophosphate (PPi). Hydrolysis of PPi by pyrophosphatase then makes the activation effectively irreversible. The adenylate is oxidised with O₂ to oxyluciferin plus light. Light output scales with ATP, so luciferase assays are used to measure ATP (for example cell viability or contamination tests). Light colour varies with luciferase structure between species."}, {"id": "p17", "m": 1, "q": "Which example uses ATP hydrolysis directly to cycle a protein between conformations, rather than group transfer to a substrate?", "o": ["Hexokinase phosphorylating glucose", "Glutamine synthetase making glutamyl-phosphate", "Myosin moving along actin in muscle", "Luciferase making luciferyl adenylate"], "a": 2, "e": "Motor proteins (myosin, kinesin), helicases, RecA, some topoisomerases and ribosomes moving on mRNA use ATP or GTP binding and hydrolysis to switch shape. Each switch makes a mechanical step. The other three options transfer part of ATP onto a substrate. This links Module 1 to Module 5: the motor's ATP-bound and ADP-bound states are different conformations."}, {"id": "p18", "m": 1, "q": "Metabolism constantly converts free energy into heat and entropy. How is this consistent with cells staying highly ordered?", "o": ["Cells are closed systems exempt from the second law", "Cells take in free energy and export heat and entropy", "Order inside cells is maintained at chemical equilibrium", "Enzymes lower total entropy without any energy cost"], "a": 1, "e": "Cells are open systems. They take in free energy (food or light) and export heat and more disordered products (CO₂, H₂O). The total entropy of cell plus surroundings rises, satisfying the second law, while local order inside is maintained. An ordered cell is far from equilibrium; at equilibrium disorder would be maximal and the cell would be dead. Molecular machines such as pumps and motors maintain these non-equilibrium gradients, the theme that opens Module 5."}, {"id": "p19", "m": 1, "q": "An enzyme is added to a reaction mixture with actual ΔG = +10 kJ/mol. What happens?", "o": ["Net conversion proceeds forward faster", "Net conversion proceeds in reverse faster, toward equilibrium", "ΔG becomes negative and the reaction proceeds", "Nothing happens, because enzymes act only on favourable reactions"], "a": 1, "e": "A positive ΔG means the system is past equilibrium in the forward sense, so net flux runs backward (products → reactants). An enzyme speeds the approach to equilibrium in whichever direction that lies, and it does not change ΔG. To push this reaction forward you would have to change concentrations (remove product, add reactant) or couple it to a favourable reaction such as ATP hydrolysis."}, {"id": "p20", "m": 2, "q": "A DNA template strand reads 3′-TACGGATTC-5′. What is the mRNA?", "o": ["5′-AUGCCUAAG-3′", "5′-UACGGAUUC-3′", "3′-AUGCCUAAG-5′ written 5′→3′ as 5′-GAAUCCGUA-3′", "5′-ATGCCTAAG-3′"], "a": 0, "e": "RNA polymerase reads the template (antisense) strand 3′→5′ and builds RNA 5′→3′ that is complementary to it: T→A, A→U, C→G, G→C. Result: 5′-AUGCCUAAG-3′, which starts with the AUG start codon. The coding (sense) strand has the same sequence as the mRNA with T instead of U (5′-ATGCCTAAG-3′), but that option is DNA, not mRNA. Always check that the polarity is antiparallel."}, {"id": "p21", "m": 2, "q": "A coding strand reads 5′-ATGGCATGA-3′. Which statement is correct?", "o": ["mRNA = 5′-UACCGUACU-3′, encoding Tyr-Arg-Thr", "mRNA = 5′-AUGGCAUGA-3′, encoding Met-Ala-stop", "Template = 5′-ATGGCATGA-3′, identical to coding strand", "mRNA = 3′-AUGGCAUGA-5′, read from its 3′ end"], "a": 1, "e": "The coding strand matches the mRNA except T→U, so mRNA = 5′-AUG GCA UGA-3′: Met, Ala, then UGA (a stop codon). The template strand is the complement, 3′-TACCGTACT-5′. Exams love giving one strand and asking for the other or for the mRNA; decide first which strand you were given."}, {"id": "p22", "m": 2, "q": "E. coli grown for many generations in ¹⁵N medium is moved to ¹⁴N. After two rounds of replication, what fraction of DNA molecules is hybrid (¹⁵N/¹⁴N)?", "o": ["100%", "50%", "25%", "0%"], "a": 1, "e": "Replication is semiconservative: each daughter duplex keeps one parental strand. After round 1, every molecule is hybrid. In round 2, each hybrid makes one hybrid (the old ¹⁵N strand plus a new ¹⁴N strand) and one fully light molecule. Result: 50% hybrid, 50% light, 0% heavy. This is the Meselson–Stahl result that ruled out conservative replication, which would give 25% heavy and 75% light after two rounds."}, {"id": "p23", "m": 2, "q": "A liver cell and a neuron of the same person contain identical DNA, yet make different proteins. Which statement best explains this?", "o": ["Replication copies different genes in each cell type", "Different genes are transcribed in each cell type", "Neurons discard unneeded genes during S phase", "Neurons translate their mRNA in the 3′→5′ direction"], "a": 1, "e": "Replication copies the whole genome the same way in every dividing cell, in S phase. Cell identity comes from regulated gene expression: different genes are transcribed and processed in different cells. Eukaryotes add more control layers (RNA processing, nuclear export, translation). This idea returns in stem-cell differentiation (Module 8)."}, {"id": "p24", "m": 2, "q": "A human gene is copied directly from genomic DNA into E. coli. The protein made is wrong or truncated. The most likely reason is:", "o": ["E. coli lacks ribosomes able to read human codons", "The gene contains introns that E. coli cannot splice out", "E. coli transcribes the coding strand instead of the template", "Human genes must be replicated in S phase"], "a": 1, "e": "Eukaryotic genes contain introns that are transcribed into pre-mRNA and removed by the spliceosome to make mature mRNA. Bacteria have no splicing machinery, so the introns get translated as if they were coding sequence, usually hitting a premature stop codon. The fix is cDNA, made by reverse transcription of mature mRNA, which carries only exons. This is why recombinant insulin production starts from cDNA (Module 4)."}, {"id": "p25", "m": 2, "q": "Why can a bacterial ribosome start translating an mRNA before transcription of that mRNA is finished?", "o": ["Bacterial mRNA is synthesised in the 3′→5′ direction", "No nucleus separates the two processes", "Bacterial pre-mRNA is spliced before it is finished", "Bacterial ribosomes translate the DNA template directly"], "a": 1, "e": "Prokaryotes have no nuclear envelope. mRNA is made 5′→3′ and its 5′ end is free in the cytoplasm immediately, so ribosomes can load while RNA polymerase is still elongating (coupled transcription–translation). In eukaryotes, transcription and processing happen in the nucleus, and mRNA must be exported before translation. That separation adds regulation points: processing, transport, translation. It is also why prokaryotic control is mostly at transcription initiation."}, {"id": "p26", "m": 2, "q": "An mRNA codes for a 100-amino-acid protein. The codon nearest the 5′ end (after AUG) encodes the amino acid that ends up at the protein's:", "o": ["C-terminus", "N-terminus", "Middle, because translation starts centrally", "Either end, depending on the tRNA"], "a": 1, "e": "Ribosomes read mRNA 5′→3′, and the protein grows from the N-terminus (amino end) to the C-terminus (carboxyl end). So the 5′ region of the coding sequence specifies the N-terminal residues. Two direction facts to keep apart: nucleic acids are made 5′→3′; proteins are made N→C."}, {"id": "p27", "m": 2, "q": "Fill in the condition: glucose ABSENT, lactose PRESENT. What happens at the lac operon?", "o": ["No transcription: repressor bound, CAP inactive", "Low, leaky transcription: repressor off, CAP inactive", "No transcription: repressor bound, CAP active", "Strong transcription: repressor off, cAMP–CAP bound"], "a": 3, "e": "No lactose → no allolactose → repressor stays on the operator → no transcription (whatever CAP does). Lactose present → allolactose binds the repressor → it leaves the operator. Glucose absent → cAMP high → cAMP–CAP binds the CAP site and recruits RNA polymerase. Repressor off plus CAP on gives strong transcription. The full table: Glc+ Lac− none; Glc+ Lac+ low; Glc− Lac− none; Glc− Lac+ strong. Note the operator overlaps the promoter, which is why a bound repressor physically blocks RNA polymerase.", "f": "<svg viewBox='0 0 320 90'><rect x='5' y='35' width='45' height='22' fill='none' stroke='currentColor'/><text x='10' y='50' font-size='10' fill='currentColor'>CAP site</text><rect x='50' y='35' width='55' height='22' fill='none' stroke='currentColor'/><text x='57' y='50' font-size='10' fill='currentColor'>Promoter</text><rect x='92' y='35' width='45' height='22' fill='var(--acc)' fill-opacity='.18' stroke='currentColor'/><text x='96' y='50' font-size='10' fill='currentColor'>Operator</text><rect x='140' y='35' width='60' height='22' fill='none' stroke='currentColor'/><text x='157' y='50' font-size='10' fill='currentColor'>lacZ</text><rect x='200' y='35' width='55' height='22' fill='none' stroke='currentColor'/><text x='215' y='50' font-size='10' fill='currentColor'>lacY</text><rect x='255' y='35' width='55' height='22' fill='none' stroke='currentColor'/><text x='270' y='50' font-size='10' fill='currentColor'>lacA</text><text x='5' y='80' font-size='10' fill='currentColor'>One promoter → one mRNA (lacZ-lacY-lacA)</text></svg>"}, {"id": "p28", "m": 2, "q": "Glucose and lactose are both present. What is the lac operon's state?", "o": ["Strong transcription, because the inducer is present", "Low-level transcription: repressor off, CAP inactive", "No transcription, because glucose binds the repressor", "No transcription, because cAMP–CAP blocks the promoter"], "a": 1, "e": "Allolactose removes the repressor, so the operator is clear. But glucose keeps cAMP low, so CAP cannot bind DNA. RNA polymerase binds the lac promoter poorly by itself, so you get only a low, leaky transcription rate. This is catabolite repression: the cell prefers glucose and uses lactose only when glucose runs out. Glucose does not bind the repressor; its effect runs through cAMP and CAP."}, {"id": "p29", "m": 2, "q": "A mutant makes no functional lac repressor (lacI⁻). Glucose is absent and lactose is absent. What happens?", "o": ["No transcription, since no inducer is present to act", "Strong transcription: operator free and CAP active", "Low transcription, because CAP itself needs lactose", "No transcription, because CAP requires the repressor"], "a": 1, "e": "Without a repressor there is no negative control, so the operator is always clear; the operon becomes constitutive. With glucose absent, cAMP–CAP is active, so transcription is strong even with no lactose at all. If glucose were present, you would see low-level constitutive expression. An operator-constitutive mutation (Oᶜ, operator cannot bind repressor) gives the same phenotype for genes on that DNA."}, {"id": "p30", "m": 2, "q": "A mutant CAP cannot bind cAMP. Glucose is absent and lactose is present. Expected lac expression?", "o": ["Strong, because the repressor has been released", "Low/leaky: repressor off but no activator help", "Zero, because the repressor stays on the operator", "Strong, because cAMP binds RNA polymerase directly"], "a": 1, "e": "Lactose (via allolactose) removes the repressor, but CAP cannot be activated without cAMP, so it cannot bind its site. RNA polymerase alone gives only weak transcription. A mutant lacking adenylate cyclase (no cAMP) gives the same result. These mutants show that the two controls are separate: the repressor is negative control by the lactose sensor; CAP is positive control by the glucose sensor via cAMP."}, {"id": "p31", "m": 2, "q": "A ‘super-repressor’ mutant binds the operator normally but cannot bind allolactose. With lactose present and glucose absent, the operon is:", "o": ["Strongly expressed", "Expressed at low level", "Not expressed (uninducible)", "Expressed only if IPTG is removed"], "a": 2, "e": "Induction works by allolactose binding the repressor and changing its shape so it lets go of the operator. If the repressor can't bind the inducer, it stays locked on the operator; even maximal CAP activation can't get RNA polymerase past it. The operon is uninducible. Compare: no repressor at all = always on; repressor deaf to inducer = always off."}, {"id": "p32", "m": 2, "q": "In the trp operon, tryptophan is abundant. Which description is correct?", "o": ["Trp inactivates the repressor, so the genes turn ON", "Trp is a co-repressor that activates the repressor: genes OFF", "Trp acts as an inducer, exactly as allolactose does in the lac operon", "Trp binds CAP, which then recruits RNA polymerase"], "a": 1, "e": "The trp operon is repressible. Its genes are ON by default, and the repressor is made in an inactive form. When tryptophan, the pathway's end product, accumulates, it binds the repressor as a co-repressor. The repressor then binds the operator and switches synthesis off. The lac operon is inducible: OFF by default, the repressor is made active, and the inducer inactivates it. Both are negative control (a repressor), but the logic is opposite: biosynthetic pathways shut down when the product is plentiful."}, {"id": "p33", "m": 2, "q": "The CAP gene is expressed constitutively. Why does that make sense?", "o": ["CAP must always be present to report cAMP levels", "CAP is encoded inside the lac operon, sharing its promoter", "CAP is only needed when lactose is present in the medium", "CAP's gene is switched on by allolactose binding"], "a": 0, "e": "CAP is a general glucose sensor that controls many catabolic operons (lac, ara, gal and others). Its activity, not its amount, is regulated: cAMP binding switches it on. So the protein must always be present, ready to respond. Its gene lies elsewhere on the chromosome, not in the lac operon. Other constitutive (‘housekeeping’) genes, like those for glycolysis enzymes, are needed all the time and are not switched by signals."}, {"id": "p34", "m": 2, "q": "A regulatory protein binds DNA and increases transcription only when bound to a small molecule. This is:", "o": ["Negative regulation by a repressor", "Positive regulation by an activator", "Constitutive expression", "Post-translational regulation"], "a": 1, "e": "Positive regulation means a regulator increases expression (an activator; CAP is the course example). Negative regulation means a regulator decreases it (a repressor, such as LacI or TrpR). Whether a small molecule is needed is a separate question: CAP needs cAMP, and the trp repressor needs Trp. Classify by what the protein does to transcription when it is bound to DNA."}, {"id": "p35", "m": 2, "q": "Which information transfer is considered impossible by the central dogma?", "o": ["RNA → DNA (reverse transcription)", "DNA → DNA (replication)", "Protein → nucleic acid", "RNA → protein (translation)"], "a": 2, "e": "Information can flow between nucleic acids (DNA→DNA, DNA→RNA, and even RNA→DNA by reverse transcriptase, which retroviruses use and lab cDNA synthesis relies on) and from nucleic acid to protein. It cannot flow from protein back to nucleic acid, or from protein to protein (no mechanism reads an amino-acid sequence to template another). Reverse transcription is the classic ‘exception’ people think breaks the dogma; it doesn't, because it is still nucleic acid → nucleic acid."}, {"id": "p36", "m": 2, "q": "Which control point exists in eukaryotes but not in prokaryotes?", "o": ["Initiation of transcription at the promoter", "Export of mRNA from the nucleus to the cytoplasm", "Binding of a repressor protein to an operator", "Initiation of translation by ribosomes on the mRNA"], "a": 1, "e": "Only eukaryotes have a nucleus, so only they can regulate RNA processing (capping, splicing, polyadenylation) and nuclear export. Both domains can regulate transcription and translation. Operators and operons are prokaryotic features. The course frames prokaryotic regulation as mostly at transcription initiation, and eukaryotic as layered: transcription, post-transcription/processing, transport, and translation."}, {"id": "p37", "m": 3, "q": "PCR starts with 100 copies of a target sequence and runs 10 ideal cycles. About how many copies result?", "o": ["1,000", "2,000", "102,400", "1,024"], "a": 2, "e": "Ideal PCR doubles the target each cycle: N = N₀·2ⁿ = 100 × 2¹⁰ = 100 × 1,024 = 102,400. 1,024 is the answer for a single starting copy, and 1,000 or 2,000 come from adding instead of multiplying. Real reactions fall short of 2ⁿ as primers and dNTPs run out and efficiency drops, giving the plateau seen in later cycles. Each cycle is denaturation (~94–95 °C) → primer annealing (~50–65 °C) → extension by a heat-stable polymerase (~72 °C)."}, {"id": "p38", "m": 3, "q": "Which PCR step separates the two DNA strands, and what breaks?", "o": ["Annealing; phosphodiester bonds break", "Denaturation; hydrogen bonds between base pairs break", "Extension; the 3′-OH is removed", "Denaturation; the sugar–phosphate backbone is cut by heat"], "a": 1, "e": "Heating to ~95 °C disrupts the hydrogen bonds and base stacking that hold the duplex together, leaving the covalent backbone intact. Cooling lets primers anneal to complementary sites flanking the target; then the polymerase extends from each primer's 3′-OH. Cutting the backbone is what restriction enzymes do, not heat. Because the cycle repeatedly hits ~95 °C, PCR needs a thermostable polymerase (Taq, from a hot-spring bacterium)."}, {"id": "p39", "m": 3, "q": "Read the gel. A 6-kb circular plasmid with two EcoRI sites 2 kb apart is fully digested with EcoRI. Which lane matches?", "o": ["Lane 1", "Lane 2", "Lane 3", "None; a circle gives no bands when cut"], "a": 1, "e": "Two cuts in a circle give two fragments that sum to the plasmid size: 2 kb + 4 kb, which is lane 2. One cut in a circle gives one linear 6-kb fragment (lane 1); one cut in a linear molecule would give two pieces. Read sizes against the ladder: DNA runs toward the + electrode (bottom), and smaller fragments travel farther. Distance travelled falls roughly with log(size), so equal size ratios (10→5, 2→1 kb) give roughly equal spacing.", "f": "<svg viewBox='0 -6 260 206'><rect x='10' y='10' width='240' height='185' fill='currentColor' fill-opacity='.05' stroke='currentColor' stroke-opacity='.4'/><rect x='40' y='18' width='36' height='6' fill='currentColor' opacity='.5'/><text x='54' y='4' font-size='10' fill='currentColor'>L</text><rect x='95' y='18' width='36' height='6' fill='currentColor' opacity='.5'/><text x='109' y='4' font-size='10' fill='currentColor'>1</text><rect x='150' y='18' width='36' height='6' fill='currentColor' opacity='.5'/><text x='164' y='4' font-size='10' fill='currentColor'>2</text><rect x='205' y='18' width='36' height='6' fill='currentColor' opacity='.5'/><text x='219' y='4' font-size='10' fill='currentColor'>3</text><rect x='40' y='30' width='36' height='3' fill='currentColor'/><text x='13' y='34' font-size='9' fill='currentColor'>10</text><rect x='40' y='66' width='36' height='3' fill='currentColor'/><text x='13' y='70' font-size='9' fill='currentColor'>5</text><rect x='40' y='93' width='36' height='3' fill='currentColor'/><text x='13' y='97' font-size='9' fill='currentColor'>3</text><rect x='40' y='114' width='36' height='3' fill='currentColor'/><text x='13' y='118' font-size='9' fill='currentColor'>2</text><rect x='40' y='150' width='36' height='3' fill='currentColor'/><text x='13' y='154' font-size='9' fill='currentColor'>1</text><rect x='40' y='186' width='36' height='3' fill='currentColor'/><text x='13' y='190' font-size='9' fill='currentColor'>0.5</text><rect x='95' y='57' width='36' height='3' fill='var(--acc)'/><rect x='150' y='78' width='36' height='3' fill='var(--acc)'/><rect x='150' y='114' width='36' height='3' fill='var(--acc)'/><rect x='205' y='93' width='36' height='5' fill='var(--acc)'/></svg>"}, {"id": "p40", "m": 3, "q": "Same gel. A 6-kb plasmid gives only lane 3: one bright band at 3 kb. Best explanation?", "o": ["The enzyme cut once, releasing a smaller 3-kb circle", "Two sites 3 kb apart give equal fragments that co-migrate", "DNA ran backward toward the negative electrode instead", "The plasmid is really 3 kb, so the digest simply failed"], "a": 1, "e": "Two fragments of the same size travel to the same spot and appear as one band, about twice as bright as a single band of that size. Fragment sizes must add up to the plasmid size (3 + 3 = 6 kb), and checking that sum is the standard way to interpret restriction maps. One cut can't produce a smaller circle; linearising a circle keeps its full length. Gels separate by size, not sequence, so identical-length fragments are indistinguishable without other tools.", "f": "<svg viewBox='0 -6 260 206'><rect x='10' y='10' width='240' height='185' fill='currentColor' fill-opacity='.05' stroke='currentColor' stroke-opacity='.4'/><rect x='40' y='18' width='36' height='6' fill='currentColor' opacity='.5'/><text x='54' y='4' font-size='10' fill='currentColor'>L</text><rect x='95' y='18' width='36' height='6' fill='currentColor' opacity='.5'/><text x='109' y='4' font-size='10' fill='currentColor'>1</text><rect x='150' y='18' width='36' height='6' fill='currentColor' opacity='.5'/><text x='164' y='4' font-size='10' fill='currentColor'>2</text><rect x='205' y='18' width='36' height='6' fill='currentColor' opacity='.5'/><text x='219' y='4' font-size='10' fill='currentColor'>3</text><rect x='40' y='30' width='36' height='3' fill='currentColor'/><text x='13' y='34' font-size='9' fill='currentColor'>10</text><rect x='40' y='66' width='36' height='3' fill='currentColor'/><text x='13' y='70' font-size='9' fill='currentColor'>5</text><rect x='40' y='93' width='36' height='3' fill='currentColor'/><text x='13' y='97' font-size='9' fill='currentColor'>3</text><rect x='40' y='114' width='36' height='3' fill='currentColor'/><text x='13' y='118' font-size='9' fill='currentColor'>2</text><rect x='40' y='150' width='36' height='3' fill='currentColor'/><text x='13' y='154' font-size='9' fill='currentColor'>1</text><rect x='40' y='186' width='36' height='3' fill='currentColor'/><text x='13' y='190' font-size='9' fill='currentColor'>0.5</text><rect x='95' y='57' width='36' height='3' fill='var(--acc)'/><rect x='150' y='78' width='36' height='3' fill='var(--acc)'/><rect x='150' y='114' width='36' height='3' fill='var(--acc)'/><rect x='205' y='93' width='36' height='5' fill='var(--acc)'/></svg>"}, {"id": "p41", "m": 3, "q": "Why does DNA move toward the positive electrode in agarose gel electrophoresis, and why do small fragments go farther?", "o": ["DNA is positive; small pieces carry more charge per base", "Backbone is negative; the gel sieve slows big fragments", "DNA is neutral and is simply carried by buffer flow", "Small fragments lack phosphate, so agarose binds them less"], "a": 1, "e": "Each nucleotide carries one negative phosphate, so DNA's charge-to-mass ratio is nearly constant whatever its length. Separation therefore depends on how easily molecules snake through the agarose pores: the gel acts as a sieve. Small fragments slip through faster and travel farther. Uses: checking PCR products, verifying restriction digests and insert size, judging DNA quality. SDS-PAGE uses the same idea for proteins, after SDS gives them uniform negative charge (Module 4)."}, {"id": "p42", "m": 3, "q": "Which sequence is a palindromic restriction site (reads the same 5′→3′ on both strands)?", "o": ["5′-GAATTC-3′", "5′-GAATCC-3′", "5′-GATTAC-3′", "5′-AAGGTT-3′"], "a": 0, "e": "Write the complementary strand and read it 5′→3′. For GAATTC, the complement read 5′→3′ is also GAATTC, so it is palindromic (this is the EcoRI site). For GAATCC, the other strand reads GGATTC: different. Many type II restriction enzymes act as homodimers, which is why they recognise symmetric 4–8 bp sites. Bacteria use them to cut invading phage DNA and protect their own DNA by methylating those sites."}, {"id": "p43", "m": 3, "q": "Assuming random sequence, how often would a 6-bp recognition site occur, on average?", "o": ["Once every 24 bp", "Once every 256 bp", "Once every 4,096 bp", "Once every 1,000,000 bp"], "a": 2, "e": "Each position has a ¼ chance of matching, so a 6-bp site appears with probability (¼)⁶ = 1/4,096. A 4-bp cutter hits every 4⁴ = 256 bp on average and an 8-bp cutter every 4⁸ = 65,536 bp. So longer recognition sites cut less often and give bigger fragments. You can pick enzymes to cut a plasmid once (ideal for inserting a gene) or to chop genomic DNA into manageable pieces."}, {"id": "p44", "m": 3, "q": "You cut a vector with EcoRI (sticky ends) and your insert with SmaI (blunt ends). What problem do you expect at ligation?", "o": ["No problem: ligase joins any two ends equally well", "The ends are incompatible, so ligation will be inefficient", "Ligase will first convert the sticky ends into blunt ones, then join them", "EcoRI carried over will destroy the SmaI-cut insert"], "a": 1, "e": "EcoRI leaves 5′-AATT overhangs; SmaI leaves flush ends. For efficient cloning, vector and insert should be cut with the same enzyme or with enzymes that make compatible overhangs, so the ends base-pair before ligase seals them. Sticky ends ligate more efficiently because base pairing holds the pieces together, raising their effective local concentration. Blunt-end ligation works but is far less efficient. Cutting with two different enzymes on each side (directional cloning) also controls insert orientation."}, {"id": "p45", "m": 3, "q": "DNA ligase forms a phosphodiester bond between which groups?", "o": ["A 5′-OH and a 3′-phosphate", "A 3′-OH and a 5′-phosphate", "Two 3′-OH groups", "A base and a sugar"], "a": 1, "e": "Ligase joins the 3′-hydroxyl of one nucleotide to the 5′-phosphate of the next, the same polarity as the backbone polymerases build. Practical consequence: if a vector's 5′ phosphates are removed (for example with phosphatase), it can't re-close on itself, so only inserts supplying 5′ phosphates get ligated in. This trick reduces empty-vector background. Ligase also seals nicks during normal replication (joining Okazaki fragments) and repair."}, {"id": "p46", "m": 3, "q": "In the T4 DNA ligase mechanism, what is the order of events?", "o": ["3′-OH attacks ATP → AMP moves to DNA → ligase releases PPi", "Ligase–AMP + PPi forms → AMP to 5′-P → 3′-OH attacks", "ATP → ADP + Pi; the released heat fuses the DNA ends", "Ligase–NAD⁺ forms → 3′-OH removed → blunt end created"], "a": 1, "e": "Step 1: a lysine on ligase attacks ATP, forming a covalent ligase–AMP intermediate and releasing pyrop
