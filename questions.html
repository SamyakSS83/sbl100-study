fter they leave the bloodstream and enter tissues?","options":["They become macrophages","They become erythrocytes","They become platelets","They become epithelial cells"],"answer":0,"explanation":"Tissue entry is followed by differentiation of monocytes into macrophages."},{"id":"s610","kind":"mcq","topics":["Host Pathogen Interaction"],"page":285,"q":"After ingesting a microbe, which macrophage activity most directly connects innate detection to an adaptive T-cell response?","options":["Synthesis of peptidoglycan","Release of gastric HCl","Formation of a bacterial capsule","Presentation of microbial antigen"],"answer":3,"explanation":"Antigen presentation enables macrophages to communicate microbial information to T cells."},{"id":"s611","kind":"mcq","topics":["Host Pathogen Interaction"],"page":285,"q":"Which macrophage function directly helps activate antigen-specific T-cell responses?","options":["Hemoglobin synthesis","Antibody secretion","Platelet release","Antigen presentation"],"answer":3,"explanation":"Macrophages can display processed antigen to T cells, linking innate uptake to adaptive activation."},{"id":"s612","kind":"mcq","topics":["Host Pathogen Interaction"],"page":286,"q":"Which target profile is most consistent with the NK-cell panel?","options":["Free bacterial endotoxin molecule","Normal erythrocyte with intact self markers","Virus-infected host cell","Extracellular collagen fiber"],"answer":2,"explanation":"NK cells kill infected and malignant host cells rather than free molecules or matrix."},{"id":"s613","kind":"mcq","topics":["Host Pathogen Interaction"],"page":286,"q":"Which statement correctly classifies natural killer cells?","options":["Antibody-producing granulocytes","Tissue-resident erythrocytes","Adaptive myeloid cells","Innate lymphoid cells"],"answer":3,"explanation":"NK cells are lymphoid in lineage but function as innate immune cells and are neither B nor T cells."},{"id":"s614","kind":"mcq","topics":["Host Pathogen Interaction"],"page":287,"q":"An infected cell loses a surface protein that normally delivers an inhibitory signal to NK cells. What is the predicted result?","options":["Complement synthesis by the target","NK-cell activation and target killing","Guaranteed protection from NK cells","Bacterial spore formation"],"answer":1,"explanation":"Loss of normal self-surface inhibition is the missing-self cue for NK killing."},{"id":"s615","kind":"mcq","topics":["Host Pathogen Interaction"],"page":287,"q":"Which surface molecule on a normal host cell commonly supplies an inhibitory signal to NK cells?","options":["Peptidoglycan","MHC class I","Secreted IgA","Lipid A"],"answer":1,"explanation":"Normal expression of MHC class I engages inhibitory NK receptors and restrains killing."},{"id":"s616","kind":"mcq","topics":["Host Pathogen Interaction"],"page":287,"q":"The term “missing self” refers most directly to reduced expression of:","options":["MHC class I on a target cell","Antibody on a B cell","Complement in plasma","Collagen in connective tissue"],"answer":0,"explanation":"Virus-infected and transformed cells may lose MHC class I, removing an inhibitory NK-cell signal."},{"id":"s617","kind":"mcq","topics":["Host Pathogen Interaction"],"page":288,"q":"Which molecule-function pairing fits granule-mediated NK killing?","options":["Perforin - enables pore/entry; granzyme - proteolytic death signal","Perforin - antibody; granzyme - complement receptor","Perforin - adhesin; granzyme - capsule enzyme","Perforin - cytokine receptor; granzyme - MHC molecule"],"answer":0,"explanation":"Perforin facilitates access and granzyme proteases activate death pathways in the target."},{"id":"s618","kind":"mcq","topics":["Host Pathogen Interaction"],"page":288,"q":"Which NK-cell granule protein promotes entry of granzymes into the target cell?","options":["Lysozyme","Coagulase","Caspase-9","Perforin"],"answer":3,"explanation":"Perforin facilitates delivery of granzymes, which initiate apoptotic death."},{"id":"s619","kind":"mcq","topics":["Host Pathogen Interaction"],"page":288,"q":"Granzyme entry into an NK-cell target most directly triggers:","options":["Cell-wall synthesis","Complement secretion","Apoptosis","Antibody production"],"answer":2,"explanation":"Granzymes activate intracellular death pathways that cause apoptosis of the target cell."},{"id":"s620","kind":"mcq","topics":["Host Pathogen Interaction"],"page":289,"q":"Before polarized cytotoxic granule release, which event must occur at the target-cell interface?","options":["Phagosome-lysosome fusion","Bacterial binary fission","Complement synthesis in the liver","Stable recognition/contact synapse"],"answer":3,"explanation":"Cytotoxic killing requires target recognition and close contact before directed granule release."},{"id":"s621","kind":"mcq","topics":["Host Pathogen Interaction"],"page":290,"q":"Which sequence best represents granule-mediated lymphocyte cytotoxicity?","options":["Chemotaxis, antibody secretion, capsule formation, lysis","Endotoxin release, receptor loss, DNA replication, memory","Target recognition, synapse formation, granule release, target-cell death","Granule release, target recognition, mitosis, phagocytosis"],"answer":2,"explanation":"Recognition and synapse formation precede polarized cytotoxic granule release and death."},{"id":"s622","kind":"mcq","topics":["Host Pathogen Interaction"],"page":290,"q":"In granule-mediated cytotoxicity, what occurs immediately before polarized granule release?","options":["Bacterial binary fission","Target recognition and immune-synapse formation","Antibody class switching","Phagolysosome exocytosis"],"answer":1,"explanation":"The cytotoxic lymphocyte first recognizes and binds its target, then directs granules toward the contact site."},{"id":"s623","kind":"mcq","topics":["Host Pathogen Interaction"],"page":291,"q":"What gives a cytotoxic T cell greater antigen specificity than the missing-self mechanism of an NK cell?","options":["Sensing any extracellular ATP","Recognition of a particular peptide-MHC complex","Recognition of any low-pH compartment","Binding directly to peptidoglycan"],"answer":1,"explanation":"Cytotoxic T cells use antigen receptors to recognize specific peptide-MHC complexes."},{"id":"s624","kind":"mcq","topics":["Host Pathogen Interaction"],"page":291,"q":"Cytotoxic T cells recognize target cells through specific binding to:","options":["Peptide–MHC class I complexes","Free circulating LPS","Peptidoglycan–TLR4 complexes","Complement-coated erythrocytes"],"answer":0,"explanation":"A cytotoxic T-cell receptor recognizes a specific peptide displayed by MHC class I."},{"id":"s625","kind":"mcq","topics":["Host Pathogen Interaction"],"page":292,"q":"Which ordering follows the pathogenicity flowchart from entry to transmission?","options":["Portal of entry -> defense evasion -> host damage -> portal of exit","Host damage -> portal of exit -> adherence -> portal of entry","Portal of exit -> colonization -> entry -> inoculum","Adherence -> portal of exit -> entry -> no host damage"],"answer":0,"explanation":"The chart runs from entry through penetration/evasion and damage to exit."},{"id":"s626","kind":"mcq","topics":["Host Pathogen Interaction"],"page":292,"q":"What does virulence describe?","options":["The host's capacity to make antibodies","The rate of leukocyte production","The ability of a drug to dissolve clots","A pathogen's capacity to harm its host"],"answer":3,"explanation":"Virulence is the degree or capacity of a pathogen to cause host damage."},{"id":"s627","kind":"mcq","topics":["Host Pathogen Interaction"],"page":292,"q":"Which combination best captures the slide's distinction between a microbe and a pathogen?","options":["Host cell + capsule = pathogen","Toxin + erythrocyte = pathogen","Microbe + virulence factors = pathogen","Microbe + antibody = pathogen"],"answer":2,"explanation":"Virulence factors equip a microbe to enter, persist, evade defenses, damage the host, or spread."},{"id":"s628","kind":"mcq","topics":["Host Pathogen Interaction"],"page":293,"q":"Which stage immediately precedes invasion in the illustrated pathogenesis sequence?","options":["Toxicity","Tissue damage","Portal of exit","Adhesion"],"answer":3,"explanation":"The panel order is exposure, adhesion, invasion, colonization/growth, toxicity, and damage."},{"id":"s629","kind":"mcq","topics":["Host Pathogen Interaction"],"page":293,"q":"Which process enables a bacterium to persist despite active host defenses?","options":["Blood coagulation","Immune evasion","Translation termination","Erythropoiesis"],"answer":1,"explanation":"Immune-evasion mechanisms allow bacteria to avoid recognition, killing, or clearance."},{"id":"s630","kind":"mcq","topics":["Host Pathogen Interaction"],"page":293,"q":"Which event is most directly responsible for the clinical manifestations of bacterial disease?","options":["Tissue damage by toxins or direct microbial effects","Initial exposure alone","Receptor absence from a non-target tissue","Formation of normal flora"],"answer":0,"explanation":"Disease signs and symptoms arise when toxins or direct microbial activities damage host tissue."},{"id":"s631","kind":"mcq","topics":["Host Pathogen Interaction"],"page":294,"q":"In a bacterial attachment pair, which component is expected on the microbe?","options":["MHC class I","Complement C3 made by the bacterium","Adhesin ligand","Host receptor"],"answer":2,"explanation":"The microbial ligand/adhesin binds a receptor that is a host-cell component."},{"id":"s632","kind":"mcq","topics":["Host Pathogen Interaction"],"page":294,"q":"During bacterial adherence, the receptor is generally located on the _____ and the ligand on the _____.","options":["microbe; host cell","antibody; erythrocyte","capsule; lysosome","host cell; microbe"],"answer":3,"explanation":"Adherence commonly involves a microbial ligand or adhesin binding a receptor on the host cell."},{"id":"s633","kind":"mcq","topics":["Host Pathogen Interaction"],"page":295,"q":"Which host-protein recruitment would most directly create the M-protein cloak shown for GAS?","options":["Caspase coating an epithelial receptor","Fibronectin/fibrinogen coating the bacterial surface","Peptidoglycan coating the host nucleus","LPS coating a Gram-positive cell"],"answer":1,"explanation":"M protein recruits host proteins including fibronectin and fibrinogen, masking bacterial epitopes."},{"id":"s634","kind":"mcq","topics":["Host Pathogen Interaction"],"page":295,"q":"M protein is a virulence factor associated with:","options":["Mycobacterium leprae","Clostridium perfringens","Group A Streptococcus","Vibrio cholerae"],"answer":2,"explanation":"M protein is a major surface virulence factor of Group A Streptococcus."},{"id":"s635","kind":"mcq","topics":["Host Pathogen Interaction"],"page":295,"q":"Which host extracellular-matrix protein is specifically linked to M-protein-mediated adherence and invasion?","options":["Tubulin","Fibronectin","Keratin","Elastin"],"answer":1,"explanation":"Binding to fibronectin promotes attachment to and invasion of epithelial and endothelial cells."},{"id":"s636","kind":"mcq","topics":["Host Pathogen Interaction"],"page":296,"q":"Why can the same bacterial adhesin colonize one tissue but not another?","options":["Its matching host receptor is tissue-restricted","All tissues have identical receptors","Adherence occurs without molecular binding","The capsule determines blood group"],"answer":0,"explanation":"Tissue distribution of the matching host receptor helps determine tropism and host specificity."},{"id":"s637","kind":"mcq","topics":["Host Pathogen Interaction"],"page":296,"q":"Host specificity of an adherent pathogen is strongly influenced by:","options":["Distribution of the matching host receptor","The host's erythrocyte count","Lysosomal pH in every tissue","The pathogen's ATP concentration"],"answer":0,"explanation":"A pathogen can efficiently attach only where its adhesin's matching receptor is available."},{"id":"s638","kind":"mcq","topics":["Host Pathogen Interaction"],"page":297,"q":"Which structural description identifies a capsule?","options":["Lipid bilayer inside the cytoplasm","Protein shell surrounding the nucleus","Peptidoglycan located inside ribosomes","Polysaccharide layer external to the cell wall"],"answer":3,"explanation":"The capsule is shown as an outer polysaccharide layer outside the bacterial cell wall."},{"id":"s639","kind":"mcq","topics":["Host Pathogen Interaction"],"page":297,"q":"Where is a bacterial capsule located?","options":["Inside the nucleoid","Between DNA strands","Within the ribosome","Outside the cell wall"],"answer":3,"explanation":"A capsule is an external layer surrounding the bacterial cell wall."},{"id":"s640","kind":"mcq","topics":["Host Pathogen Interaction"],"page":297,"q":"Which organism is listed as an encapsulated bacterial example?","options":["Mycobacterium leprae","Clostridium perfringens","Streptococcus pneumoniae","Vibrio cholerae"],"answer":2,"explanation":"The slide lists S. pneumoniae, H. influenzae, and B. anthracis as capsule-bearing examples."},{"id":"s641","kind":"mcq","topics":["Host Pathogen Interaction"],"page":298,"q":"If a capsule masks an LPS-containing surface from the pathway shown, which recognition event is reduced?","options":["Fas binding to Fas ligand","GPCR binding to epinephrine","TLR4 detection of a PAMP","T-cell receptor binding to peptide-MHC"],"answer":2,"explanation":"The slide specifically identifies LPS as a PAMP recognized by TLR4."},{"id":"s642","kind":"mcq","topics":["Host Pathogen Interaction"],"page":298,"q":"TLR4 is shown recognizing which bacterial PAMP?","options":["Collagen","Lipopolysaccharide","Fibronectin","M protein"],"answer":1,"explanation":"TLR4 is a pattern-recognition receptor for bacterial LPS."},{"id":"s643","kind":"mcq","topics":["Host Pathogen Interaction"],"page":298,"q":"How can a capsule reduce innate immune recognition?","options":["By masking underlying PAMPs","By producing host MHC class I","By activating caspase-9","By converting T cells into macrophages"],"answer":0,"explanation":"The capsule can physically conceal microbial patterns from host pattern-recognition receptors."},{"id":"s644","kind":"mcq","topics":["Host Pathogen Interaction"],"page":299,"q":"In the opsonization diagram, loss of surface C3b deposition would first reduce:","options":["Lysosomal acidification","Binding of the bacterium to the phagocyte","Bacterial DNA replication","Host collagen synthesis"],"answer":1,"explanation":"Opsonin deposition promotes phagocyte binding, so blocking it impairs attachment before engulfment."},{"id":"s645","kind":"mcq","topics":["Host Pathogen Interaction"],"page":299,"q":"What is the main effect of a capsule on phagocytosis?","options":["It increases lysosomal enzyme activity","It exposes more PAMPs","It converts complement into antibody","It reduces phagocyte attachment and engulfment"],"answer":3,"explanation":"Capsules hinder effective contact between a phagocyte and the bacterial surface."},{"id":"s646","kind":"mcq","topics":["Host Pathogen Interaction"],"page":299,"q":"Which surface coating can restore efficient recognition of an encapsulated bacterium by phagocytes?","options":["Gsα","Lipid A","C3b","eEF-2"],"answer":2,"explanation":"C3b is an opsonin; phagocytes bind it through complement receptors to improve engulfment."},{"id":"s647","kind":"mcq","topics":["Host Pathogen Interaction"],"page":300,"q":"A bacterium is visible inside a phagosome but remains viable. Which capsule-associated step has most likely failed?","options":["Effective lysosomal digestion","Initial exposure to a host receptor","Release through a portal of exit","Synthesis of cytokines by the liver"],"answer":0,"explanation":"The diagram shows capsule-mediated resistance to lysosomal digestion after uptake."},{"id":"s648","kind":"mcq","topics":["Host Pathogen Interaction"],"page":300,"q":"A capsule can promote intracellular survival after engulfment by increasing resistance to:","options":["Mitochondrial ATP synthesis","Lysosomal enzymes","Host ribosomes","Plasma antibodies only"],"answer":1,"explanation":"Some capsules protect engulfed bacteria from digestion by lysosomal enzymes."},{"id":"s649","kind":"mcq","topics":["Host Pathogen Interaction"],"page":301,"q":"Which biofilm stage supplies cells that can colonize a new site?","options":["Initial attachment","Irreversible attachment","Maturation only","Dispersal"],"answer":3,"explanation":"The last panel shows cells leaving the mature community during dispersal."},{"id":"s650","kind":"mcq","topics":["Host Pathogen Interaction"],"page":301,"q":"Quorum sensing allows bacteria to alter gene expression in response to:","options":["Population density","Host blood group","Atmospheric pressure","Chromosome number"],"answer":0,"explanation":"Accumulating signaling molecules let bacteria estimate local cell density and coordinate gene expression."},{"id":"s651","kind":"mcq","topics":["Host Pathogen Interaction"],"page":301,"q":"What best defines a biofilm?","options":["A single bacterium in plasma","A host-cell apoptotic body","A soluble bacterial exotoxin","An organized surface-associated microbial community"],"answer":3,"explanation":"Biofilms are structured microbial communities, usually attached to a surface and embedded in a matrix."},{"id":"s652","kind":"mcq","topics":["Host Pathogen Interaction"],"page":302,"q":"After crossing the mucus layer, which structure does a pathogen encounter next in the displayed tissue arrangement?","options":["Lymph-node germinal center","Mitochondrial matrix","Epithelial cell surface","Bone marrow"],"answer":2,"explanation":"The diagram places the epithelial surface directly beneath mucus."},{"id":"s653","kind":"mcq","topics":["Host Pathogen Interaction"],"page":303,"q":"Which enzyme is best matched to escape from a mucosal IgA defense rather than connective-tissue spread?","options":["Coagulase","IgA protease","Collagenase","Hyaluronidase"],"answer":1,"explanation":"IgA protease targets mucosal antibody; collagenase and hyaluronidase target matrix."},{"id":"s654","kind":"mcq","topics":["Host Pathogen Interaction"],"page":303,"q":"Which bacterial enzyme directly targets a mucosal antibody?","options":["Coagulase","Hyaluronidase","IgA protease","Collagenase"],"answer":2,"explanation":"IgA protease cleaves secretory IgA and helps pathogens evade mucosal immunity."},{"id":"s655","kind":"mcq","topics":["Host Pathogen Interaction"],"page":303,"q":"Which pair of enzymes primarily promotes spread through connective tissue?","options":["Caspase-8 and caspase-9","Hyaluronidase and collagenase","Coagulase and IgA protease","Lysozyme and perforin"],"answer":1,"explanation":"Hyaluronidase and collagenase digest connective-tissue components and facilitate invasion."},{"id":"s656","kind":"mcq","topics":["Host Pathogen Interaction"],"page":304,"q":"A pathogen spreads through collagen-rich deep tissue. Which listed enzyme is the closest mechanistic match?","options":["Collagenase","Coagulase","IgA protease","Streptokinase"],"answer":0,"explanation":"Collagenase digests collagen and is linked on the slide to tissue invasion."},{"id":"s657","kind":"mcq","topics":["Host Pathogen Interaction"],"page":304,"q":"Which enzyme-organism association is correct?","options":["Collagenase—Clostridium perfringens","Collagenase—Vibrio cholerae","Hyaluronidase—Mycobacterium leprae","Hyaluronidase—Bacillus anthracis only"],"answer":0,"explanation":"C. perfringens produces collagenase, supporting deep-tissue spread in gas gangrene."},{"id":"s658","kind":"mcq","topics":["Host Pathogen Interaction"],"page":304,"q":"Hyaluronidase is listed for both Staphylococcus aureus and:","options":["Vibrio cholerae","Mycobacterium tuberculosis","Haemophilus influenzae","Streptococcus pyogenes"],"answer":3,"explanation":"The slide associates hyaluronidase with S. aureus and S. pyogenes."},{"id":"s659","kind":"mcq","topics":["Host Pathogen Interaction"],"page":305,"q":"Which contrast between the two enzyme types is correct?","options":["Both enzymes exclusively form clots","Coagulase dissolves clots; streptokinase makes capsules","Both enzymes digest IgA","Coagulase forms a protective clot; streptokinase dissolves clots"],"answer":3,"explanation":"The figure contrasts coagulase-driven clot formation with kinase-mediated clot dissolution."},{"id":"s660","kind":"mcq","topics":["Host Pathogen Interaction"],"page":305,"q":"How does coagulase help Staphylococcus aureus evade host defenses?","options":["It digests collagen","It blocks eEF-2","It promotes a clot-like protective barrier","It cleaves secretory IgA"],"answer":2,"explanation":"Coagulase-driven clot formation can shield bacteria from phagocytes, immune factors, and antibiotics."},{"id":"s661","kind":"mcq","topics":["Host Pathogen Interaction"],"page":305,"q":"What is the clinical use of streptokinase stated on the slide?","options":["Inducing antibody class switching","Dissolving blood clots during heart attacks","Blocking bacterial translation","Treating gastric acidity"],"answer":1,"explanation":"Streptokinase is a thrombolytic enzyme used to dissolve clots."},{"id":"s662","kind":"mcq","topics":["Host Pathogen Interaction"],"page":306,"q":"Which wall component is explicitly composed of sugars and amino acids?","options":["Lipid A","Cholesterol","Peptidoglycan","Mycolic acid"],"answer":2,"explanation":"Peptidoglycan is identified as the sugar-and-amino-acid wall polymer."},{"id":"s663","kind":"mcq","topics":["Host Pathogen Interaction"],"page":306,"q":"Peptidoglycan is composed principally of:","options":["Sugars and amino acids","Lipids and RNA","DNA and cholesterol","Cellulose and glycogen"],"answer":0,"explanation":"Peptidoglycan is a mesh-like polymer containing sugar chains cross-linked by short peptides."},{"id":"s664","kind":"mcq","topics":["Host Pathogen Interaction"],"page":307,"q":"Which organisms on the slide gain lysosomal resistance from a mycolic-acid-rich wall?","options":["Clostridium perfringens and Bacillus anthracis","Mycobacterium tuberculosis and M. leprae","Vibrio cholerae and E. coli","Streptococcus pyogenes and S. pneumoniae"],"answer":1,"explanation":"The two listed examples are M. tuberculosis and M. leprae."},{"id":"s665","kind":"mcq","topics":["Host Pathogen Interaction"],"page":307,"q":"Mycolic acid contributes to virulence chiefly by increasing resistance to:","options":["Host-cell attachment","Antibody synthesis","Blood coagulation","Lysosomal digestion"],"answer":3,"explanation":"The mycolic-acid-rich wall helps mycobacteria withstand lysosomal degradation."},{"id":"s666","kind":"mcq","topics":["Host Pathogen Interaction"],"page":308,"q":"In the membrane-ruffling sequence, which host component is rearranged directly by invasin-triggered signaling?","options":["Actin cytoskeleton","Peptidoglycan wall","Nuclear DNA polymerase","Lysosomal cathepsin"],"answer":0,"explanation":"Invasins alter host actin filaments, driving membrane ruffles around the microbe."},{"id":"s667","kind":"mcq","topics":["Host Pathogen Interaction"],"page":308,"q":"Invasin-triggered membrane ruffling allows microbial entry by rearranging:","options":["Host collagen fibers","Microbial ribosomes","Host actin filaments","Bacterial peptidoglycan"],"answer":2,"explanation":"Invasins trigger signaling that reorganizes the host actin cytoskeleton and drives membrane engulfment."},{"id":"s668","kind":"mcq","topics":["Host Pathogen Interaction"],"page":309,"q":"Which statement distinguishes exotoxin from endotoxin in the lower diagrams?","options":["Both are host antibodies","Endotoxin is secreted only by living Gram-positive cells","Exotoxin is the lipid A portion of LPS","Exotoxin is secreted protein; endotoxin is part of the bacterial outer envelope"],"answer":3,"explanation":"The slide contrasts secreted exotoxin with envelope-associated endotoxin."},{"id":"s669","kind":"mcq","topics":["Host Pathogen Interaction"],"page":309,"q":"What is toxigenicity?","options":["The capacity of a phagocyte to ingest bacteria","The ability of a microorganism to produce toxins","The presence of toxin in blood","The host response to a capsule"],"answer":1,"explanation":"Toxigenicity denotes toxin-producing ability."},{"id":"s670","kind":"mcq","topics":["Host Pathogen Interaction"],"page":309,"q":"What does toxemia mean?","options":["Presence of toxins in the blood","Presence of bacteria in a biofilm","Loss of MHC class I","Release of antibodies into mucus"],"answer":0,"explanation":"Toxemia specifically refers to circulating toxin in blood."},{"id":"s671","kind":"mcq","topics":["Host Pathogen Interaction"],"page":310,"q":"Diphtheria toxin fragment A reaches the cytosol. Which substrate modification causes translation arrest?","options":["Cleavage of GM1 ganglioside","Acetylation of peptidoglycan","ADP-ribosylation of eEF-2","Phosphorylation of actin"],"answer":2,"explanation":"Fragment A ADP-ribosylates eEF-2, preventing protein synthesis."},{"id":"s672","kind":"mcq","topics":["Host Pathogen Interaction"],"page":310,"q":"How does diphtheria toxin enter a host cell?","options":["Passive diffusion through the nucleus","Complement-mediated lysis","Phagocytosis by an erythrocyte","Receptor-mediated endocytosis"],"answer":3,"explanation":"After receptor binding, the toxin is internalized by receptor-mediated endocytosis."},{"id":"s673","kind":"mcq","topics":["Host Pathogen Interaction"],"page":310,"q":"Diphtheria toxin fragment A halts translation by ADP-ribosylating:","options":["TLR4","Caspase-8","eEF-2","Gsα"],"answer":2,"explanation":"Modification of the diphthamide residue of eEF-2 prevents protein elongation."},{"id":"s674","kind":"mcq","topics":["Host Pathogen Interaction"],"page":311,"q":"Which molecular event lies directly between cholera-toxin entry and the cAMP surge?","options":["Polymerization of peptidoglycan","Persistent activation of Gs alpha","Inactivation of all adenylyl cyclase","Cleavage of eEF-2"],"answer":1,"explanation":"A1 locks Gs alpha active, which persistently stimulates adenylyl cyclase."},{"id":"s675","kind":"mcq","topics":["Host Pathogen Interaction"],"page":311,"q":"Which receptor is bound by the B pentamer of cholera toxin?","options":["TLR4","GM1 ganglioside","TNFR1","Fas"],"answer":1,"explanation":"The five B subunits bind GM1 receptors and promote toxin internalization."},{"id":"s676","kind":"mcq","topics":["Host Pathogen Interaction"],"page":311,"q":"Cholera toxin causes persistent activation of adenylyl cyclase by locking which protein in its active GTP-bound state?","options":["Gsα","BAX","eEF-2","FADD"],"answer":0,"explanation":"The A1 fragment modifies Gsα, causing persistent adenylyl cyclase activity and high cAMP."},{"id":"s677","kind":"mcq","topics":["Host Pathogen Interaction"],"page":312,"q":"A receptor has seven transmembrane helices and activates a trimeric G protein. Which effector shown may be activated next?","options":["Adenylyl cyclase","Peptidoglycan synthase","Caspase-9 apoptosome","Lysosomal collagenase"],"answer":0,"explanation":"The GPCR diagram shows activated G protein regulating an effector such as adenylyl cyclase."},{"id":"s678","kind":"mcq","topics":["Host Pathogen Interaction"],"page":312,"q":"How many transmembrane helices characterize a typical GPCR?","options":["One","Three","Twelve","Seven"],"answer":3,"explanation":"GPCRs contain seven membrane-spanning alpha helices."},{"id":"s679","kind":"mcq","topics":["Host Pathogen Interaction"],"page":312,"q":"A ligand-bound GPCR directly activates which intracellular signaling component?","options":["A B-cell antibody","A bacterial capsule","A trimeric G protein","A lysosomal cathepsin"],"answer":2,"explanation":"The activated receptor promotes nucleotide exchange and activation of a heterotrimeric G protein."},{"id":"s680","kind":"mcq","topics":["Host Pathogen Interaction"],"page":313,"q":"Which event terminates the active alpha-subunit state in the GPCR cycle?","options":["Exchange of GDP for GTP","Ligand binding to the receptor","Activation of adenylyl cyclase","Hydrolysis of bound GTP to GDP"],"answer":3,"explanation":"GTP hydrolysis returns the alpha subunit to the inactive GDP-bound state and attenuates signaling."},{"id":"s681","kind":"mcq","topics":["Host Pathogen Interaction"],"page":313,"q":"Which intrinsic activity of Gα helps terminate GPCR signaling?","options":["Protein glycosylation","GTP hydrolysis","ATP synthesis","DNA cleavage"],"answer":1,"explanation":"Gα hydrolyzes bound GTP to GDP and returns to its inactive state."},{"id":"s682","kind":"mcq","topics":["Host Pathogen Interaction"],"page":313,"q":"Which combination produces receptor-level attenuation after prolonged GPCR activation?","options":["Receptor phosphorylation and arrestin binding","Perforin release and granzyme entry","BAX activation and cytochrome c release","C3b deposition and phagocytosis"],"answer":0,"explanation":"Phosphorylation enables arrestin binding, which uncouples the receptor from further G-protein activation."},{"id":"s683","kind":"mcq","topics":["Host Pathogen Interaction"],"page":314,"q":"Which nested identification is correct?","options":["Endotoxin = secreted A subunit of cholera toxin","Endotoxin = bacterial capsule polysaccharide","Endotoxin = lipid A portion of LPS in Gram-negative outer membrane","Endotoxin = peptidoglycan of Gram-positive cytoplasm"],"answer":2,"explanation":"The slide identifies lipid A within LPS as Gram-negative endotoxin."},{"id":"s684","kind":"mcq","topics":["Host Pathogen Interaction"],"page":314,"q":"The toxic portion of Gram-negative lipopolysaccharide is:","options":["Peptidoglycan","M protein","Mycolic acid","Lipid A"],"answer":3,"explanation":"Endotoxin activity resides in the lipid A component of LPS."},{"id":"s685","kind":"mcq","topics":["Host Pathogen Interaction"],"page":315,"q":"Why can antibiotic treatment transiently increase exposure to endotoxin?","options":["Host cells begin producing LPS","Bacterial damage/lysis releases LPS-associated lipid A","Antibiotics convert exotoxin into antibody","Antibiotics synthesize new capsules"],"answer":1,"explanation":"Breakdown of Gram-negative bacteria can release envelope-associated endotoxin."},{"id":"s686","kind":"mcq","topics":["Host Pathogen Interaction"],"page":315,"q":"Which process can release endotoxin from Gram-negative bacteria?","options":["T-cell receptor rearrangement","Host collagen synthesis","Complement-mediated bacterial lysis","Antibody class switching"],"answer":2,"explanation":"Bacterial breakdown by complement, phagocytes, or antibiotics can release LPS/endotoxin."},{"id":"s687","kind":"mcq","topics":["Host Pathogen Interaction"],"page":316,"q":"Which mediator most directly links endotoxin sensing to the multiple branches shown?","options":["Cytokine secretion","Bacterial collagen synthesis","Antibody gene rearrangement","Erythrocyte enucleation"],"answer":0,"explanation":"The diagram places cytokine secretion downstream of endotoxin and upstream of systemic effects."},{"id":"s688","kind":"mcq","topics":["Host Pathogen Interaction"],"page":316,"q":"Which host molecules mediate many systemic effects after endotoxin recognition?","options":["Immunoglobulin light chains only","Cytokines","Histones","Collagens"],"answer":1,"explanation":"Endotoxin induces inflammatory cytokine secretion, which contributes to fever and systemic inflammation."},{"id":"s689","kind":"mcq","topics":["Host Pathogen Interaction"],"page":316,"q":"Which response is most directly associated with endotoxin exposure on the slide?","options":["Fever","Reduced cAMP","Antibody-independent memory","Suppressed inflammation"],"answer":0,"explanation":"Endotoxin is pyrogenic and promotes inflammatory cytokine-driven fever."},{"id":"s690","kind":"mcq","topics":["Host Pathogen Interaction"],"page":317,"q":"In the pyrogen pathway, cytokines raise temperature by acting through which intermediate site/process?","options":["Bone-marrow peptidoglycan synthesis","Renal capsule formation","Mitochondrial cytochrome-c retention","Hypothalamic prostaglandin production"],"answer":3,"explanation":"The diagram routes cytokine signals to hypothalamic prostaglandins that alter the temperature set point."},{"id":"s691","kind":"mcq","topics":["Host Pathogen Interaction"],"page":317,"q":"Why may killing Gram-negative bacteria fail to make a preparation endotoxin-free?","options":["Dead bacteria synthesize new antibodies","Lipid A is converted into peptidoglycan","Sterilization creates living spores in all cases","Endotoxin can remain after bacterial death"],"answer":3,"explanation":"Endotoxin is a heat-stable bacterial component that may persist even when bacteria have been killed."},{"id":"s692","kind":"mcq","topics":["Host Pathogen Interaction"],"page":317,"q":"A substance that induces fever is termed a:","options":["Adhesin","Invasin","Pyrogen","Opsonin"],"answer":2,"explanation":"Endotoxins are pyrogens because they can induce fever."},{"id":"s693","kind":"mcq","topics":["Cell Death Pathways"],"page":318,"q":"Which topic begins with this divider and is developed in the following slides?","options":["Blood-cell hematopoiesis","Mucociliary clearance","Regulated cell-death pathways","Bacterial adherence"],"answer":2,"explanation":"The divider explicitly introduces Lecture 31 on cell-death pathways."},{"id":"s694","kind":"mcq","topics":["Cell Death Pathways"],"page":319,"q":"Which scenario is a physiological use of programmed cell death rather than accidental injury?","options":["Mechanical tearing of a membrane","Removal of self-reactive lymphocytes","Immediate rupture after extreme trauma","Random protein denaturation by heat"],"answer":1,"explanation":"Immune regulation, including deletion of inappropriate lymphocytes, is a normal role of programmed death."},{"id":"s695","kind":"mcq","topics":["Cell Death Pathways"],"page":319,"q":"Which is a homeostatic function of programmed cell death?","options":["Synthesis of bacterial capsules","Removal of damaged or infected cells","Permanent inhibition of all cell turnover","Conversion of pathogens into antibodies"],"answer":1,"explanation":"Programmed death removes unwanted, damaged, stressed, or infected cells and helps maintain tissue balance."},{"id":"s696","kind":"mcq","topics":["Cell Death Pathways"],"page":320,"q":"Which sequence preserves the morphology shown for apoptosis?","options":["Cell shrinkage -> blebbing -> apoptotic bodies -> phagocytosis","Cell swelling -> rupture -> DAMP release -> inflammation","Ruffling -> invasion -> biofilm -> dispersal","Adhesion -> clotting -> collagen digestion -> exit"],"answer":0,"explanation":"The top row shows shrinkage, blebbing, fragmentation into apoptotic bodies, then clearance."},{"id":"s697","kind":"mcq","topics":["Cell Death Pathways"],"page":320,"q":"Which feature is biochemical rather than morphological evidence of apoptosis?","options":["Caspase activation","Membrane blebbing","Cell shrinkage","Nuclear fragmentation"],"answer":0,"explanation":"Caspase activation is a biochemical hallmark; the other options are visible morphological changes."},{"id":"s698","kind":"mcq","topics":["Cell Death Pathways"],"page":320,"q":"Which membrane change marks an apoptotic cell for phagocytic clearance?","options":["Insertion of bacterial lipid A","Loss of all membrane phospholipids","Synthesis of peptidoglycan","Externalization of phosphatidylserine"],"answer":3,"explanation":"Phosphatidylserine exposure on the outer leaflet acts as an engulfment signal."},{"id":"s699","kind":"mcq","topics":["Cell Death Pathways"],"page":321,"q":"Which pairing correctly assigns cascade level?","options":["Caspase-3 initiator; caspase-9 executioner","Caspase-6 initiator; caspase-8 executioner","Caspase-7 initiator; caspase-9 executioner","Caspase-9 initiator; caspase-3 executioner"],"answer":3,"explanation":"Caspases 8/9 are initiators; caspases 3/6/7 are executioners."},{"id":"s700","kind":"mcq","topics":["Cell Death Pathways"],"page":321,"q":"Which pair contains only executioner caspases?","options":["Caspase-7 and caspase-9","Caspase-3 and caspase-8","Caspase-3 and caspase-7","Caspase-8 and caspase-9"],"answer":2,"explanation":"Caspases 3, 6, and 7 are executioners; caspases 8 and 9 are initiators."},{"id":"s701","kind":"mcq","topics":["Cell Death Pathways"],"page":322,"q":"ICAD cleavage releases CAD. Which experimental pattern in the slide is the expected consequence?","options":["LPS band formation","Collagen cross-linking","Internucleosomal DNA laddering","Increased intact genomic DNA only"],"answer":2,"explanation":"Released CAD fragments DNA at regular intervals, producing the ladder pattern."},{"id":"s702","kind":"mcq","topics":["Cell Death Pathways"],"page":322,"q":"Caspase cleavage of cytoskeletal regulatory proteins contributes directly to:","options":["MHC class I expression","Membrane blebbing","LPS synthesis","Antibody secretion"],"answer":1,"explanation":"Caspase-dependent reorganization of cortical actin contributes to apoptotic surface blebs."},{"id":"s703","kind":"mcq","topics":["Cell Death Pathways"],"page":322,"q":"Cleavage of phospholipid-transfer proteins during apoptosis causes surface exposure of:","options":["Phosphatidylserine","Lipid A","Mycolic acid","Peptidoglycan"],"answer":0,"explanation":"Disrupted phospholipid asymmetry exposes phosphatidylserine on the cell surface."},{"id":"s704","kind":"mcq","topics":["Cell Death Pathways"],"page":323,"q":"Which ordering correctly follows intrinsic apoptosis after cellular stress?","options":["LPS release -> TLR4 -> caspase-9","BAX/BAK activation -> cytochrome c release -> apoptosome -> caspase-9","Fas ligation -> DISC -> caspase-8 -> BAX synthesis only","MLKL activation -> membrane rupture -> apoptosome"],"answer":1,"explanation":"The mitochondrial pathway proceeds through BAX/BAK permeabilization, cytochrome c, apoptosome, and caspase-9."},{"id":"s705","kind":"mcq","topics":["Cell Death Pathways"],"page":323,"q":"Which proteins directly permeabilize the mitochondrial outer membrane during intrinsic apoptosis?","options":["Fas and FADD","RIPK1 and RIPK3","GPX4 and FSP1","BAX and BAK"],"answer":3,"explanation":"Activated BAX and BAK oligomerize in the outer mitochondrial membrane and permit cytochrome c release."},{"id":"s706","kind":"mcq","topics":["Cell Death Pathways"],"page":323,"q":"Cytochrome c release promotes assembly of which caspase-activating complex?","options":["Phagolysosome","Inflammasome","Apoptosome","DISC"],"answer":2,"explanation":"Cytosolic cytochrome c drives apoptosome assembly and activation of initiator caspase-9."},{"id":"s707","kind":"mcq","topics":["Cell Death Pathways"],"page":324,"q":"Which pair belongs to the multi-domain pro-apoptotic effector class rather than the BH3-only class?","options":["BAX and BAK","BID and BIM","BAD and BIK","BMF and NOXA"],"answer":0,"explanation":"BAX and BAK contain BH1-BH4 and act as effectors; the other pairs are BH3-only."},{"id":"s708","kind":"mcq","topics":["Cell Death Pathways"],"page":324,"q":"Which BCL-2 family classes are BH3-only proteins?","options":["Receptors and adaptors","Activators and sensitizers","Effectors and anti-apoptotic members","Initiator and executioner caspases"],"answer":1,"explanation":"BH3-only activators and sensitizers contain only the BH3 homology domain."},{"id":"s709","kind":"mcq","topics":["Cell Death Pathways"],"page":324,"q":"Which BCL-2 family groups possess BH1–BH4 domains?","options":["Pro-apoptotic effectors and anti-apoptotic members","Activators and sensitizers only","Caspases 8 and 9","Fas ligand and FADD"],"answer":0,"explanation":"Multi-domain effectors and anti-apoptotic BCL-2 proteins contain all four BH domains."},{"id":"s710","kind":"mcq","topics":["Cell Death Pathways"],"page":325,"q":"Which complex forms at clustered Fas receptors before initiator-caspase activation?","options":["Apoptosome containing cytochrome c and caspase-9","Necrosome containing RIPK3 and MLKL","Autolysosome containing LC3 and cathepsin","DISC containing FADD and procaspase-8"],"answer":3,"explanation":"Fas recruits FADD and procaspase-8 into the death-inducing signaling complex."},{"id":"s711","kind":"mcq","topics":["Cell Death Pathways"],"page":325,"q":"Which adaptor protein is recruited to activated Fas receptors?","options":["Apaf-1","RIPK3","GPX4","FADD"],"answer":3,"explanation":"FADD links clustered Fas death receptors to procaspase-8 within the DISC."},{"id":"s712","kind":"mcq","topics":["Cell Death Pathways"],"page":325,"q":"Which initiator caspase is activated in the Fas-associated DISC?","options":["Caspase-3","Caspase-7","Caspase-8","Caspase-9"],"answer":2,"explanation":"The extrinsic pathway activates initiator caspase-8 at the DISC."},{"id":"s713","kind":"mcq","topics":["Cell Death Pathways"],"page":326,"q":"Electron microscopy shows swollen mitochondria, cytoplasmic vacuoles, and ruptured plasma membrane without condensed fragmented chromatin. Which death mode fits?","options":["Autophagic recycling alone","Adaptive immunity","Necroptosis","Apoptosis"],"answer":2,"explanation":"The feature set matches the necroptotic micrograph rather than apoptotic condensation and intact blebbing membrane."},{"id":"s714","kind":"mcq","topics":["Cell Death Pathways"],"page":326,"q":"Which condition commonly favors necroptosis over extrinsic apoptosis?","options":["Strong GPX4 activity","Absence or inhibition of caspase-8","High executioner-caspase activity","Intact apoptotic-body clearance"],"answer":1,"explanation":"Necroptosis is often engaged when death-receptor signaling occurs but caspase-8-dependent apoptosis is blocked."},{"id":"s715","kind":"mcq","topics":["Cell Death Pathways"],"page":326,"q":"Which morphology distinguishes necroptosis from apoptosis?","options":["Cell swelling with plasma-membrane rupture","Cell shrinkage with intact blebbing membrane","Chromatin condensation with apoptotic bodies","Phosphatidylserine exposure without lysis"],"answer":0,"explanation":"Necroptosis is lytic, with cytoplasmic swelling, swollen mitochondria, and membrane rupture."},{"id":"s716","kind":"mcq","topics":["Cell Death Pathways"],"page":327,"q":"Which protein is the downstream membrane-disrupting effector of the RIPK1-RIPK3 necroptosis axis?","options":["LC3","MLKL","BCL-2","Caspase-9"],"answer":1,"explanation":"Activated RIPK3 phosphorylates MLKL, which oligomerizes and damages the plasma membrane."},{"id":"s717","kind":"mcq","topics":["Cell Death Pathways"],"page":327,"q":"Which receptors can serve as extrinsic triggers of necroptosis?","options":["GPCR, GM1, and MHC I","Fas only","BCR and TCR only","TNFR1, TLR3, and TLR4"],"answer":3,"explanation":"The slide lists TNFR1 and the pattern-recognition receptors TLR3 and TLR4 as extrinsic triggers."},{"id":"s718","kind":"mcq","topics":["Cell Death Pathways"],"page":327,"q":"Intrinsic necroptosis can begin when ZBP1 recognizes:","options":["Secretory IgA","Extracellular collagen","Z-form nucleic acids","MHC class I"],"answer":2,"explanation":"ZBP1-dependent recognition of Z-nucleic acids is shown as an intracellular trigger."},{"id":"s719","kind":"mcq","topics":["Cell Death Pathways"],"page":328,"q":"Why does the diagram predict stronger inflammation after necroptosis than after orderly apoptotic-body clearance?","options":["Lytic rupture releases DAMPs that activate immune receptors","Caspase-3 prevents all cytokine signaling","The nucleus produces bacterial LPS","Phosphatidylserine blocks phagocytosis"],"answer":0,"explanation":"Necroptotic rupture releases intracellular DAMPs that stimulate immune cells and inflammatory mediators."},{"id":"s720","kind":"mcq","topics":["Cell Death Pathways"],"page":328,"q":"Which molecules released by necroptotic cells alert immune cells to tissue damage?","options":["AB5 holotoxins","DAMPs","BH domains","MHC peptides"],"answer":1,"explanation":"Lytic membrane rupture releases damage-associated molecular patterns, or DAMPs."},{"id":"s721","kind":"mcq","topics":["Cell Death Pathways"],"page":328,"q":"Which cells are specifically listed as detecting necroptosis-derived DAMPs?","options":["T cells, dendritic cells, and macrophages","Erythrocytes, platelets, and fibroblasts","Only B cells","Only neutrophils"],"answer":0,"explanation":"The slide names T cells, dendritic cells, and macrophages as DAMP-responsive immune cells."},{"id":"s722","kind":"mcq","topics":["Cell Death Pathways"],"page":329,"q":"Which step converts a cargo-containing autophagosome into a degradative compartment?","options":["Binding of Fas ligand","Activation of TLR4","Release of cytochrome c","Fusion with a lysosome"],"answer":3,"explanation":"Lysosome fusion creates an autolysosome where acidic hydrolases degrade cargo."},{"id":"s723","kind":"mcq","topics":["Cell Death Pathways"],"page":329,"q":"What activates many lysosomal degradative enzymes?","options":["High cytosolic pH","MHC class I loss","Extracellular ATP depletion","Low luminal pH"],"answer":3,"explanation":"The acidic lysosomal lumen turns on multiple degradative hydrolases."},{"id":"s724","kind":"mcq","topics":["Cell Death Pathways"],"page":329,"q":"Which cathepsins are stated to be abundant in lysosomes?","options":["8, 9, and 10","A, E, and F","L, B, and D","3, 6, and 7"],"answer":2,"explanation":"Cathepsins L, B, and D are listed at high lysosomal abundance."},{"id":"s725","kind":"mcq","topics":["Cell Death Pathways"],"page":330,"q":"Loss of which defense would most directly permit phospholipid hydroperoxides to accumulate in the central ferroptosis pathway?","options":["Caspase-8-FLIP complex","LC3-autophagosome system","GPX4-glutathione system","Fas-FADD complex"],"answer":2,"explanation":"GPX4 uses glutathione to reduce phospholipid hydroperoxides and suppress ferroptosis."},{"id":"s726","kind":"mcq","topics":["Cell Death Pathways"],"page":330,"q":"What type of molecular damage defines ferroptosis?","options":["MHC-dependent collagen cleavage","Iron-dependent phospholipid peroxidation","Caspase-dependent DNA ligation","Antibody-dependent peptidoglycan synthesis"],"answer":1,"explanation":"Ferroptosis results from iron-dependent accumulation of phospholipid hydroperoxides."},{"id":"s727","kind":"mcq","topics":["Cell Death Pathways"],"page":330,"q":"Which enzyme is a major defense against phospholipid hydroperoxide accumulation?","options":["GPX4","Caspase-8","Coagulase","TLR4"],"answer":0,"explanation":"GPX4 reduces phospholipid hydroperoxides and suppresses ferroptotic membrane damage."},{"id":"s728","kind":"mcq","topics":["Cancer Biology 1"],"page":331,"q":"Which topic is introduced by Lecture 32?","options":["Genetic engineering","Cancer biology","Drug metabolism","Biophysical techniques"],"answer":1,"explanation":"The title slide labels Lecture 32 as Cancer Biology."},{"id":"s729","kind":"mcq","topics":["Cancer Biology 1"],"page":332,"q":"Why did Hippocrates use the term karkinos for some tumors?","options":["Their cut surface had radiating veins like crab legs","They arose only in aquatic animals","They contained a hard calcium shell","They moved laterally through tissue"],"answer":0,"explanation":"Karkinos means crab or crayfish; the radiating veins resembled a crab's legs and claws."},{"id":"s730","kind":"mcq","topics":["Cancer Biology 1"],"page":333,"q":"Which category in the chart combines high incidence with a particularly large annual death count?","options":["Skin melanoma","Endocrine-system cancers","Bone and soft-tissue cancers","Respiratory-system cancers"],"answer":3,"explanation":"The respiratory-system row has one of the largest blue death bars and a high green incidence bar."},{"id":"s731","kind":"mcq","topics":["Cancer Biology 1"],"page":333,"q":"In the cancer chart, what does incidence measure?","options":["Deaths per year","New cases per year","Five-year survival","Metastatic cases only"],"answer":1,"explanation":"Incidence is the number of new cases, whereas mortality is the number of deaths."},{"id":"s732","kind":"mcq","topics":["Cancer Biology 1"],"page":334,"q":"Which event distinguishes the malignant duct in the diagram from the benign tumor?","options":["Cells stop proliferating","Cells restore contact inhibition","Cells breach the basal lamina","Cells remain confined to the lumen"],"answer":2,"explanation":"The malignant-stage cells cross the tissue boundary, which is invasion."},{"id":"s733","kind":"mcq","topics":["Cancer Biology 1"],"page":334,"q":"Which term specifically describes cancer cells penetrating the extracellular matrix and basement membrane?","options":["Differentiation","Invasion","Angiogenesis","Proliferation"],"answer":1,"explanation":"Invasion is local penetration through extracellular matrix and basement membranes."},{"id":"s734","kind":"mcq","topics":["Cancer Biology 1"],"page":334,"q":"Spread of cancer cells from a primary tumor to a distant organ is called:","options":["Apoptosis","Senescence","Metastasis","Hyperplasia"],"answer":2,"explanation":"Metastasis is spread from the original primary tumor to another site."},{"id":"s735","kind":"mcq","topics":["Cancer Biology 1"],"page":335,"q":"Which culture phenotype most directly indicates loss of contact inhibition?","options":["Cells maintain equal division and apoptosis","Cells form dense multilayered foci","Cells stop at a confluent monolayer","Cells undergo anoikis after detachment"],"answer":1,"explanation":"Transformed cells continue growing after contact and pile into foci."},{"id":"s736","kind":"mcq","topics":["Cancer Biology 1"],"page":335,"q":"Which pair of changes can independently increase tumor cell number?","options":["Increased repair and reduced mutation","Reduced division and increased apoptosis","Increased division and reduced apoptosis","Reduced adhesion and increased differentiation"],"answer":2,"explanation":"Either increased cell division or decreased apoptosis shifts tissue homeostasis toward cell accumulation."},{"id":"s737","kind":"mcq","topics":["Cancer Biology 1"],"page":335,"q":"Piling up of transformed cells in culture most directly demonstrates loss of:","options":["Anchorage dependence","Contact inhibition","DNA replication","Growth-factor receptors"],"answer":1,"explanation":"Normal cells stop dividing when they contact neighbors; transformed cells can lose this contact inhibition and form foci."},{"id":"s738","kind":"mcq","topics":["Cancer Biology 1"],"page":336,"q":"Which labeled stromal cell is specifically activated into a tumor-supporting CAF?","options":["Fibroblast","Pericyte","Endothelial cell","Tumor-associated lymphocyte"],"answer":0,"explanation":"Carcinoma-associated fibroblasts arise from activated fibroblasts."},{"id":"s739","kind":"mcq","topics":["Cancer Biology 1"],"page":336,"q":"Which cell type is part of tumor stroma rather than the malignant population?","options":["Metastatic clone","Tumor-initiating cell","Mutant epithelial cancer cell","Cancer-associated fibroblast"],"answer":3,"explanation":"Fibroblasts, immune cells, and endothelial cells are nonmalignant stromal components."},{"id":"s740","kind":"mcq","topics":["Cancer Biology 1"],"page":336,"q":"Cancer-associated fibroblasts directly promote tumor progression by remodeling the:","options":["Ribosomal subunit","Mitotic spindle","Nuclear envelope","Extracellular matrix"],"answer":3,"explanation":"CAFs remodel extracellular matrix and secrete factors affecting growth, invasion, inflammation, and angiogenesis."},{"id":"s741","kind":"mcq","topics":["Cancer Biology 1"],"page":337,"q":"Loss of which step allows HIF-alpha to accumulate during hypoxia?","options":["Binding to HIF-beta","DNA binding in the nucleus","Transcription of angiogenic genes","Oxygen-dependent hydroxylation"],"answer":3,"explanation":"Hydroxylation is the oxygen-dependent mark that enables VHL recognition and degradation."},{"id":"s742","kind":"mcq","topics":["Cancer Biology 1"],"page":337,"q":"Under normal oxygen, hydroxylated HIF-alpha is recognized by which protein before degradation?","options":["PD-L1","VHL","HIF-beta","VEGF"],"answer":1,"explanation":"VHL recognizes hydroxylated HIF-alpha and directs its ubiquitination and degradation."},{"id":"s743","kind":"mcq","topics":["Cancer Biology 1"],"page":337,"q":"In hypoxia, stabilized HIF-alpha enters the nucleus and pairs with:","options":["HIF-beta","VHL","Ubiquitin","Lactate dehydrogenase"],"answer":0,"explanation":"HIF-alpha dimerizes with HIF-beta to activate hypoxia-response genes."},{"id":"s744","kind":"mcq","topics":["Cancer Biology 1"],"page":338,"q":"Which product is formed from pyruvate in vigorously contracting muscle under low oxygen?","options":["Ethanol plus carbon dioxide","Oxaloacetate","Lactate","Acetyl-CoA"],"answer":2,"explanation":"The diagram assigns lactate fermentation to muscle and erythrocytes."},{"id":"s745","kind":"mcq","topics":["Cancer Biology 1"],"page":338,"q":"Which anaerobic pyruvate product is accompanied by carbon dioxide release in yeast?","options":["Acetyl-CoA","Ethanol","Oxaloacetate","Lactate"],"answer":1,"explanation":"Yeast fermentation converts pyruvate to ethanol and carbon dioxide."},{"id":"s746","kind":"mcq","topics":["Cancer Biology 1"],"page":339,"q":"What is the immediate redox benefit of pyruvate-to-lactate conversion in a tumor cell?","options":["Formation of acetyl-CoA","Regeneration of NAD+","Production of FADH2","Consumption of ATP"],"answer":1,"explanation":"Lactate dehydrogenase oxidizes NADH to NAD+, sustaining glycolysis."},{"id":"s747","kind":"mcq","topics":["Cancer Biology 1"],"page":339,"q":"The Warburg effect describes high lactate production by cancer cells even when what is available?","options":["NADH","Pyruvate","Glucose","Oxygen"],"answer":3,"explanation":"Cancer cells can favor lactate-producing glycolysis despite oxygen availability."},{"id":"s748","kind":"mcq","topics":["Cancer Biology 1"],"page":339,"q":"Which transporter class is shown importing glucose into the tumor cell?","options":["SGLT-only","MCT","GLUT","ABC"],"answer":2,"explanation":"GLUT transporters import glucose, whereas MCT is shown exporting lactate."},{"id":"s749","kind":"mcq","topics":["Cancer Biology 1"],"page":340,"q":"A tumor retains antigen presentation but expresses an inhibitory ligand that suppresses the CD8 T cell. Which evasion class is shown?","options":["T-cell inhibition","Loss of tumor antigen","Loss of MHC expression","Recruitment failure of fibroblasts"],"answer":0,"explanation":"An inhibitory ligand-receptor interaction belongs to the T-cell-inhibition mechanism in panel C."},{"id":"s750","kind":"mcq","topics":["Cancer Biology 1"],"page":340,"q":"Loss of which surface molecule can prevent a CD8 T cell from recognizing a tumor antigen?","options":["MHC","Integrin","Cadherin","Collagen"],"answer":0,"explanation":"Tumor antigen must be presented by MHC for recognition by the T-cell receptor."},{"id":"s751","kind":"mcq","topics":["Cancer Biology 1"],"page":340,"q":"Which two cell types are specifically associated with an immunosuppressive tumor microenvironment?","options":["Treg and MDSC","B cells and platelets","Fibroblasts and osteoclasts","Neutrophils and erythrocytes"],"answer":0,"explanation":"The slide places regulatory T cells and myeloid-derived suppressor cells in the suppressive microenvironment."},{"id":"s752","kind":"mcq","topics":["Cancer Biology 1"],"page":341,"q":"Which pairing is directly disrupted by checkpoint-blocking antibodies in the figure?","options":["TCR-MHC","CD8-MHC I","EGF-EGFR","PD-1-PD-L1"],"answer":3,"explanation":"The therapeutic antibodies block the PD-1:PD-L1 inhibitory interaction."},{"id":"s753","kind":"mcq","topics":["Cancer Biology 1"],"page":341,"q":"PD-1 is displayed on which cell in the checkpoint diagram?","options":["Fibroblast","Endothelial cell","Tumor cell","T cell"],"answer":3,"explanation":"PD-1 is the inhibitory receptor on the T cell; PD-L1 is its ligand on tumor or immune cells."},{"id":"s754","kind":"mcq","topics":["Cancer Biology 1"],"page":341,"q":"Checkpoint-blocking antibodies restore antitumor activity primarily by removing:","options":["T-cell receptor specificity","MHC presentation","An inhibitory T-cell signal","Tumor antigen expression"],"answer":2,"explanation":"Anti-PD-1 or anti-PD-L1 blocks an inhibitory interaction; it does not replace antigen recognition."},{"id":"s755","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":342,"q":"Which two subject areas are joined in Lecture 33?","options":["Genetic engineering and motors","Stem cells and host defense","Cancer biology and drug development","Immunology and bioenergetics"],"answer":2,"explanation":"Both subjects are printed on the title slide."},{"id":"s756","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":343,"q":"Which carcinogen-effect pairing matches the slide?","options":["X-rays - specific thymine dimers only","X-rays - chromosome breaks and translocations","UV light - whole-genome duplication","Chemical carcinogens - spindle assembly only"],"answer":1,"explanation":"The slide assigns chromosome breaks and translocations to radiation such as X-rays."},{"id":"s757","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":343,"q":"Which carcinogen is associated with chromosome breaks and translocations?","options":["Ultraviolet light","X-rays","Chemical carcinogens only","Visible light"],"answer":1,"explanation":"The slide associates X-rays with chromosome breaks and translocations."},{"id":"s758","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":343,"q":"Cancer development typically requires the accumulation of:","options":["Multiple rare genetic and epigenetic changes in one lineage","Only epigenetic changes in stromal cells","A single chromosome duplication","One common mutation in many unrelated cells"],"answer":0,"explanation":"A substantial number of independent rare genetic and epigenetic accidents accumulate in descendants of one cell."},{"id":"s759","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":344,"q":"Which alteration can activate a proto-oncogene without changing its coding sequence?","options":["Gene amplification","Loss of both alleles","Promoter deletion that abolishes expression","Nonsense mutation causing truncation and decay"],"answer":0,"explanation":"Amplification increases production of a normal proto-oncogene product."},{"id":"s760","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":344,"q":"At the cellular level, activation of an oncogene is generally:","options":["A dominant loss of function","A recessive gain of function","A recessive loss of function","A dominant gain of function"],"answer":3,"explanation":"One activating copy of a proto-oncogene can be sufficient to promote transformation."},{"id":"s761","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":344,"q":"Why are two inactivating events generally required for a tumor-suppressor gene?","options":["Only amplified genes are expressed","Both copies usually must lose function","Tumor suppressors are mitochondrial","Each copy encodes a different protein"],"answer":1,"explanation":"One functional tumor-suppressor copy can remain protective, so both copies generally must be inactivated."},{"id":"s762","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":345,"q":"Which molecular state represents active RAS in the diagram?","options":["GDP-bound RAS","RAS bound only to GAP","Unphosphorylated EGFR","GTP-bound RAS"],"answer":3,"explanation":"The figure marks RAS-GTP as ON and RAS-GDP as OFF."},{"id":"s763","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":345,"q":"Normal EGFR signaling begins when EGF binds the receptor's:","options":["Intracellular kinase domain","Extracellular domain","Nuclear localization signal","Cytoskeletal tail"],"answer":1,"explanation":"EGF binds extracellularly and induces phosphorylation of the intracellular domain."},{"id":"s764","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":345,"q":"Which protein accelerates conversion of active GTP-bound RAS to inactive GDP-bound RAS?","options":["EGFR","p21","MDM2","RAS GAP"],"answer":3,"explanation":"RAS GAP accelerates GTP hydrolysis and returns RAS to its GDP-bound OFF state."},{"id":"s765","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":346,"q":"Which change would most directly defeat p53-mediated cell-cycle arrest after DNA damage?","options":["Reduced cyclin-CDK activity","Activation of a checkpoint kinase","Loss of p21 induction","Increased DNA repair"],"answer":2,"explanation":"p21 is the p53-induced inhibitor that shuts down cyclin-CDK activity."},{"id":"s766","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":346,"q":"Which protein is transcriptionally upregulated by p53 to arrest the cell cycle?","options":["RAS","EGFR","p21","MDM2 only"],"answer":2,"explanation":"p53 induces p21, which inhibits cyclin-CDK complexes."},{"id":"s767","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":346,"q":"p21 arrests the cell cycle by inhibiting:","options":["BAX-BAK complexes","HIF-VHL complexes","Cyclin-CDK complexes","PD-1-PD-L1 complexes"],"answer":2,"explanation":"p21 inhibits cyclin-dependent kinase/cyclin activity after DNA damage."},{"id":"s768","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":347,"q":"Which MDM2 action is not shown as the principal action of MDMX in this diagram?","options":["Reducing p53 target-gene expression","Promoting p53 ubiquitination and proteasomal degradation","Binding p53","Inhibiting p53 transcriptional activity"],"answer":1,"explanation":"The slide assigns the ubiquitination/export/degradation route specifically to MDM2."},{"id":"s769","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":347,"q":"Which negative regulator promotes both nuclear export and proteasomal degradation of p53?","options":["MDMX","MDM2","p21","BCL-2"],"answer":1,"explanation":"MDM2 promotes p53 nuclear export, ubiquitination, and proteasomal degradation."},{"id":"s770","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":347,"q":"A shared effect of MDM2 and MDMX on p53 is inhibition of its:","options":["DNA sequence","Translation by ribosomes","Mitochondrial import","Transcriptional activity"],"answer":3,"explanation":"Both regulators can bind p53 and suppress its transcriptional activity."},{"id":"s771","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":348,"q":"What is the consequence of forming the MDM2-MDMX heterodimer shown in the central branch?","options":["Enhanced E3 activity toward p53","Loss of all p53 binding","Activation of p53 transcription","Conversion of MDM2 into a kinase"],"answer":0,"explanation":"The heterodimer is labeled as having stronger E3 activity than MDM2 alone."},{"id":"s772","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":348,"q":"Formation of an MDM2-MDMX heterodimer strengthens which activity toward p53?","options":["DNA-polymerase activity","Phosphatase activity","Kinase activity","E3 ubiquitin-ligase activity"],"answer":3,"explanation":"The heterodimer enhances E3 activity and p53 ubiquitination."},{"id":"s773","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":349,"q":"Which dosage-form pairing is correct?","options":["Hard capsule - exclusively volatile liquid","Tablet - approximately 90% API","Soft capsule - dry miniature pellets only","Soft capsule - API dissolved or suspended in oil"],"answer":3,"explanation":"The slide assigns oils and oil-based formulations to soft-shelled capsules."},{"id":"s774","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":349,"q":"Approximately what fraction of an oral tablet may be active pharmaceutical ingredient?","options":["90-95%","5-10%","25-35%","50-60%"],"answer":1,"explanation":"The slide states that API may comprise only about 5-10% of the formulation."},{"id":"s775","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":349,"q":"Which capsule type is best matched with oils or drug dissolved in oil?","options":["Hard-shelled capsule","Soft-shelled capsule","Enteric tablet","Compressed lozenge"],"answer":1,"explanation":"Soft-shelled capsules are used for oils and oil-based solutions or suspensions."},{"id":"s776","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":350,"q":"Which route exposes an absorbed oral drug to hepatic metabolism before systemic circulation?","options":["Lymphatic vessel to kidney","Aorta to stomach","Portal vein to liver","Hepatic vein to intestine"],"answer":2,"explanation":"GI absorption drains into the portal vein and then the liver."},{"id":"s777","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":350,"q":"Which sequence correctly orders early events after swallowing a tablet?","options":["Disintegration -> dissolution -> absorption","Dissolution -> hepatic metabolism -> disintegration","Portal entry -> disintegration -> dissolution","Absorption -> dissolution -> disintegration"],"answer":0,"explanation":"The dosage form first disintegrates, the drug dissolves, and dissolved drug is then absorbed."},{"id":"s778","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":350,"q":"Which two sites can remove orally absorbed drug before it reaches systemic circulation?","options":["Kidney and bladder","Muscle and bone","Lung and skin","Gut wall and liver"],"answer":3,"explanation":"Pre-systemic loss can occur through gut-wall metabolism and hepatic first-pass metabolism."},{"id":"s779","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":351,"q":"Which route is paired with direct entry into venous circulation through oral mucosa?","options":["Otic","Sublingual","Topical","Intramuscular"],"answer":1,"explanation":"The slide states that sublingual drugs cross the mucous membrane and enter venous circulation."},{"id":"s780","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":351,"q":"Which route is commonly used for insulin because intestinal absorption is difficult?","options":["Rectal","Subcutaneous","Otic","Topical"],"answer":1,"explanation":"The slide lists insulin and monoclonal antibodies as examples of subcutaneous delivery."},{"id":"s781","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":351,"q":"A nicotine patch is an example of which administration route?","options":["Topical local delivery","Transdermal controlled delivery","Intramuscular delivery","Sublingual delivery"],"answer":1,"explanation":"A transdermal patch provides controlled drug delivery through skin into the bloodstream."},{"id":"s782","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":352,"q":"Which property is listed as a determinant of distribution rather than absorption?","options":["Plasma-protein interaction","Dosage form","Route of administration","Food interaction at administration"],"answer":0,"explanation":"Plasma-protein binding appears in the distribution box."},{"id":"s783","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":352,"q":"Which ADME stage moves drug from blood into tissues?","options":["Distribution","Metabolism","Excretion","Absorption"],"answer":0,"explanation":"Distribution is movement of drug from the circulation into tissues."},{"id":"s784","kind":"mcq","topics":["Cancer Biology 2 and Drug Development"],"page":352,"q":"Which organ system is shown as the principal route of drug excretion?","options":["Endocrine system","Lymphatic system","Renal system","Skeletal system"],"answer":2,"explanation":"Renal elimination is the main excretion route shown, although bile and other routes also contribute."},{"id":"s785","kind":"mcq","topics":["Drug Development 1"],"page":353,"q":"Which lecture number introduces the pharmacokinetics and metabolism section?","options":["Lecture 32","Lecture 35","Lecture 37","Lecture 34"],"answer":3,"explanation":"The title slide identifies this as Lecture 34."},{"id":"s786","kind":"mcq","topics":["Drug Development 1"],"page":354,"q":"A compound becomes pharmacologically active only after CYP450 conversion. Which ADME statement fits it?","options":["It is distributed only in plasma","It bypasses chemical alteration","It is a prodrug activated during metabolism","It is excreted before absorption"],"answer":2,"explanation":"The metabolism box explicitly includes conversion of a prodrug to its active form."},{"id":"s787","kind":"mcq","topics":["Drug Development 1"],"page":354,"q":"Plasma-protein binding is primarily a determinant of which ADME stage?","options":["Excretion","Absorption","Distribution","Metabolism"],"answer":2,"explanation":"Distribution depends on blood flow, size, lipophilicity, and plasma-protein interactions."},{"id":"s788","kind":"mcq","topics":["Drug Development 1"],"page":354,"q":"Conversion of an inactive prodrug into an active compound belongs to:","options":["Absorption only","Distribution only","Metabolism","Renal filtration"],"answer":2,"explanation":"Metabolic enzymes can activate a prodrug as well as detoxify or create toxicity."},{"id":"s789","kind":"mcq","topics":["Drug Development 1"],"page":355,"q":"Two formulations have the same Cmax, but formulation X has a larger AUC. What differs most directly?","options":["Minimum effective concentration","Total drug exposure","Peak concentration","Time of peak by definition"],"answer":1,"explanation":"AUC, not Cmax, measures total exposure over time."},{"id":"s790","kind":"mcq","topics":["Drug Development 1"],"page":355,"q":"Which pharmacokinetic quantity is the time coordinate of the concentration peak?","options":["tmax","AUC","t1/2","Cmax"],"answer":0,"explanation":"tmax is the time at which Cmax is reached."},{"id":"s791","kind":"mcq","topics":["Drug Development 1"],"page":355,"q":"The area under a plasma concentration-time curve represents:","options":["Time to first effect","Rate of renal filtration","Maximum safe concentration","Total drug exposure"],"answer":3,"explanation":"AUC integrates concentration across time and represents total exposure."},{"id":"s792","kind":"mcq","topics":["Drug Development 1"],"page":356,"q":"Which reaction is a conjugation rather than a Phase I functionalization?","options":["Glucuronidation","Epoxidation","Oxidative deamination","Dealkylation"],"answer":0,"explanation":"Glucuronidation is listed among conjugation reactions."},{"id":"s793","kind":"mcq","topics":["Drug Development 1"],"page":356,"q":"Which reaction is listed as a Phase I-style transformation rather than conjugation?","options":["Acetylation","Glucuronidation","Sulphonation","Dealkylation"],"answer":3,"explanation":"Dealkylation is an oxidative functionalization reaction; the other choices are conjugations."},{"id":"s794","kind":"mcq","topics":["Drug Development 1"],"page":356,"q":"The general physicochemical result of drug metabolism is conversion of lipophilic molecules into more:","options":["Hydrophobic molecules","Hydrophilic molecules","Volatile molecules","Polymeric molecules"],"answer":1,"explanation":"Increasing hydrophilicity generally facilitates elimination in bile or urine."},{"id":"s795","kind":"mcq","topics":["Drug Development 1"],"page":357,"q":"Which metabolite is directly neutralized by glutathione in the pathway?","options":["Paracetamol glucuronide","Paracetamol sulfate","p-Aminophenol","NAPQI"],"answer":3,"explanation":"The diagram connects NAPQI to glutathione and the APAP-GSH conjugate."},{"id":"s796","kind":"mcq","topics":["Drug Development 1"],"page":357,"q":"Which reactive paracetamol metabolite is detoxified by glutathione?","options":["Paracetamol glucuronide","Paracetamol sulfate","Acetyl-CoA","NAPQI"],"answer":3,"explanation":"The CYP-dependent route forms NAPQI, which can be conjugated to glutathione."},{"id":"s797","kind":"mcq","topics":["Drug Development 1"],"page":357,"q":"Depletion of glutathione increases toxicity because NAPQI can form:","options":["Phospholipid bilayers","Glucose polymers","Protein adducts","DNA primers"],"answer":2,"explanation":"Without sufficient glutathione, reactive NAPQI can covalently modify proteins."},{"id":"s798","kind":"mcq","topics":["Drug Development 1"],"page":358,"q":"Which enzyme-dependent branch is associated with formation of a nephrotoxic reactive thiol?","options":["Gamma-glutamyl transpeptidase cleavage alone","Cysteinyl glycinase cleavage alone","Beta-lyase cleavage","N-acetyltransferase conjugation"],"answer":2,"explanation":"The lower pathway labels beta-lyase and ends in a reactive thiol."},{"id":"s799","kind":"mcq","topics":["Drug Development 1"],"page":358,"q":"Which enzymes sequentially shorten a glutathione conjugate toward a cysteine conjugate?","options":["Kinase and phosphatase","Gamma-glutamyl transpeptidase and cysteinyl glycinase","CYP450 and glucuronyl transferase","Beta-lyase and catalase"],"answer":1,"explanation":"The mercapturic acid pathway removes glutamate and then glycine using these enzymes."},{"id":"s800","kind":"mcq","topics":["Drug Development 1"],"page":358,"q":"N-acetylation of a cysteine conjugate favors formation of a product excreted through:","options":["Exhaled air","Urine","Sweat only","Saliva only"],"answer":1,"explanation":"Mercapturic-acid derivatives are excreted in urine."},{"id":"s801","kind":"mcq","topics":["Drug Development 1"],"page":359,"q":"At which stage are selected side effects first studied in healthy volunteers?","options":["Regulatory approval","Clinical development Step 1","Lead finding","Preclinical formulation"],"answer":1,"explanation":"Step 1 lists selected side effects in healthy volunteers."},{"id":"s802","kind":"mcq","topics":["Drug Development 1"],"page":359,"q":"Which drug-development stage occurs immediately before testing in humans?","options":["Preclinical development","Regulatory review","Phase IV surveillance","Discovery"],"answer":0,"explanation":"Preclinical testing evaluates a candidate before clinical development begins."},{"id":"s803","kind":"mcq","topics":["Drug Development 1"],"page":359,"q":"Target identification, target validation, lead finding, and lead optimization belong to:","options":["Regulatory review","Post-marketing surveillance","Drug discovery","Phase III trials"],"answer":2,"explanation":"These are the major activities in the discovery stage."},{"id":"s804","kind":"mcq","topics":["Drug Development 1"],"page":360,"q":"Which criterion appears latest on the staircase, closest to the surviving drug?","options":["Manufacturability","Target engagement","Potency","Selectivity"],"answer":0,"explanation":"Manufacturability is printed at the top of the final steps."},{"id":"s805","kind":"mcq","topics":["Drug Development 1"],"page":360,"q":"The development staircase begins with approximately how many drug candidates?","options":["10,000","10","100","1,000"],"answer":0,"explanation":"The slide illustrates attrition from about 10,000 candidates to one drug molecule."},{"id":"s806","kind":"mcq","topics":["Drug Development 1"],"page":361,"q":"Approximately what fraction of the original 10,000 compounds reaches clinical development in the illustrated funnel?","options":["250 of 10,000","1 of 250","5 of 250","5 of 10,000"],"answer":3,"explanation":"The funnel labels five compounds at clinical development from an initial 10,000."},{"id":"s807","kind":"mcq","topics":["Drug Development 1"],"page":361,"q":"The narrowing drug-development funnel primarily illustrates:","options":["Increasing compound diversity","Progressive candidate attrition","Decreasing manufacturing scale","Increasing mutation rate"],"answer":1,"explanation":"Most candidates fail as requirements become more stringent through development."},{"id":"s808","kind":"mcq","topics":["Drug Development 2"],"page":362,"q":"Which topic begins immediately after this divider?","options":["FRET microscopy","Apoptotic caspases","Biomolecules as drug targets","Cancer incidence"],"answer":2,"explanation":"The next slide introduces biomolecule classes relevant to drug development."},{"id":"s809","kind":"mcq","topics":["Drug Development 2"],"page":363,"q":"Which listed target is classified as a structural protein?","options":["Cell-surface antigen","Tubulin","DNA","Phospholipid"],"answer":1,"explanation":"Tubulin appears under structural proteins."},{"id":"s810","kind":"mcq","topics":["Drug Development 2"],"page":363,"q":"Which class of biomolecule is built directly from amino-acid monomers?","options":["Nucleic acids","Polysaccharides","Steroids","Proteins"],"answer":3,"explanation":"Proteins are polymers of amino acids."},{"id":"s811","kind":"mcq","topics":["Drug Development 2"],"page":364,"q":"Which method belongs to ligand-based virtual screening?","options":["Pharmacophore mapping","Protein-ligand docking","Structure-based scoring","Active-site geometry ranking"],"answer":0,"explanation":"Pharmacophore mapping is listed in the ligand-based branch."},{"id":"s812","kind":"mcq","topics":["Drug Development 2"],"page":364,"q":"Structure-based virtual screening requires information about the:","options":["Compound's brand name","Clinical trial phase","Three-dimensional target structure","Patient's blood group"],"answer":2,"explanation":"Structure-based screening evaluates compounds against a target structure."},{"id":"s813","kind":"mcq","topics":["Drug Development 2"],"page":364,"q":"Ligand-based screening is most directly guided by:","options":["Drug packaging","Known active molecules","An adiabatic calorimeter","Tumor histology alone"],"answer":1,"explanation":"Ligand-based methods use features or similarities derived from known active ligands."},{"id":"s814","kind":"mcq","topics":["Drug Development 2"],"page":365,"q":"What is the main purpose of a counter screen after the primary HTS?","options":["Increase the library size","Replace the biological assay with docking","Begin Phase III clinical trials","Eliminate nonspecific or artifactual hits"],"answer":3,"explanation":"Secondary and counter screens test whether primary activity is genuine and specific."},{"id":"s815","kind":"mcq","topics":["Drug Development 2"],"page":365,"q":"In high-throughput screening, the primary screen is used to identify:","options":["Possible hits","Approved drugs","Clinical endpoints","Patent dates"],"answer":0,"explanation":"The primary screen finds compounds with apparent activity for later confirmation."},{"id":"s816","kind":"mcq","topics":["Drug Development 2"],"page":365,"q":"Which technology most directly enables high-throughput testing of large compound libraries?","options":["Manual microscopy only","Surgical imaging","DNA sequencing alone","Automated liquid handling and plate readers"],"answer":3,"explanation":"Robotic liquid handling and automated detection provide the required throughput."},{"id":"s817","kind":"mcq","topics":["Drug Development 2"],"page":366,"q":"Which intervention would most directly reduce formation of angiotensin II from angiotensin I?","options":["Renin stimulation","Increased sodium reabsorption","ACE inhibition","Aldosterone agonism"],"answer":2,"explanation":"ACE is the enzyme shown between angiotensin I and angiotensin II."},{"id":"s818","kind":"mcq","topics":["Drug Development 2"],"page":366,"q":"Renin acts upstream of ACE in the RAAS pathway to generate:","options":["Aldosterone","Bradykinin","Angiotensin I","Angiotensin II"],"answer":2,"explanation":"Renin produces angiotensin I, which ACE then converts to angiotensin II."},{"id":"s819","kind":"mcq","topics":["Drug Development 2"],"page":366,"q":"Angiotensin II promotes release of which hormone in the RAAS pathway?","options":["Melatonin","Aldosterone","Insulin","Thyroxine"],"answer":1,"explanation":"Angiotensin II stimulates aldosterone release as part of blood-pressure regula
