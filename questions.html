oration of a ddNTP because the ddNTP lacks:","options":["A 5′ phosphate","A nitrogenous base","A 3′-OH","A sugar"],"answer":2,"explanation":"Without a 3′-OH, the next nucleotide cannot be joined."},{"id":"s192","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":91,"q":"What is produced by occasional ddNTP incorporation during Sanger sequencing?","options":["Fragments of identical length","Fragments of different lengths ending at specific bases","Only full-length double-stranded DNA","RNA fragments lacking a 5′ cap"],"answer":1,"explanation":"Random chain termination generates a nested set of DNA fragments ending at each possible nucleotide position."},{"id":"s193","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":92,"q":"Which division of labor in CRISPR-Cas9 is correct?","options":["Cas9 supplies sequence specificity; gRNA repairs DNA","gRNA supplies sequence specificity; Cas9 cuts DNA","gRNA cuts DNA; Cas9 supplies donor template","Cas9 makes cAMP; gRNA binds CAP"],"answer":1,"explanation":"Guide RNA targets the sequence; Cas9 is the nuclease."},{"id":"s194","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":92,"q":"CRISPR-Cas9 originated from a natural bacterial system that functions in defense against:","options":["Fungi","Protozoa","Viruses","Antibiotics"],"answer":2,"explanation":"CRISPR-Cas systems evolved as bacterial adaptive defense mechanisms against invading viral genetic material."},{"id":"s195","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":93,"q":"After a Cas9 double-strand break, which outcome most strongly indicates NHEJ rather than HDR?","options":["Precise donor-directed correction","A small insertion or deletion causing knockout","Insertion copied from a supplied template","No DNA-end joining"],"answer":1,"explanation":"Error-prone NHEJ commonly creates indels; HDR uses a homologous donor."},{"id":"s196","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":93,"q":"Which repair pathway commonly creates small insertions or deletions after Cas9 cutting?","options":["Homology-directed repair","Base-excision repair","Mismatch repair","Non-homologous end joining"],"answer":3,"explanation":"Error-prone non-homologous end joining frequently creates indels that can disrupt a gene."},{"id":"s197","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":93,"q":"Precise insertion or correction at a Cas9 break requires which combination?","options":["HDR with a donor DNA template","NHEJ without a template","Translation with a guide protein","Ligase with no homologous sequence"],"answer":0,"explanation":"Homology-directed repair can copy a designed change from a supplied donor template."},{"id":"s198","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":94,"q":"A useful cloning vector must contain all of the following core features except:","options":["Origin of replication","Selectable marker","Insertion site/MCS","A pre-existing copy of every target gene"],"answer":3,"explanation":"The target gene is inserted; it is not a universal built-in vector feature."},{"id":"s199","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":94,"q":"Which vector feature provides a defined region containing sites for insertion of foreign DNA?","options":["Origin of replication","Multiple cloning site","Selectable marker","Centromere"],"answer":1,"explanation":"The MCS or cloning site contains restriction sites used to insert the gene of interest."},{"id":"s200","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":94,"q":"Which factor most directly determines whether a plasmid, BAC, or YAC is suitable for a project?","options":["Number of introns in the host","Color of the host colony","Insert size and intended application","Charge of the encoded protein"],"answer":2,"explanation":"Vector choice depends chiefly on the size of DNA to be carried and whether cloning or expression is required."},{"id":"s201","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":95,"q":"Which vector-feature match is correct?","options":["pBR322—Ampᴿ and Tetᴿ","pUC—low copy number only","MCS—determines host-cell metabolism","ori—blue-white reporter enzyme"],"answer":0,"explanation":"The slide lists pBR322 with ampicillin- and tetracycline-resistance markers."},{"id":"s202","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":95,"q":"Which plasmid-vector feature primarily determines how many vector molecules accumulate per cell?","options":["Selectable marker","Transcription terminator","Reporter gene","Origin of replication"],"answer":3,"explanation":"The origin of replication controls autonomous replication and influences plasmid copy number."},{"id":"s203","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":95,"q":"Which feature is characteristic of the pUC vector series?","options":["High copy number and lacZα","Low copy number and no reporter","A YAC centromere","Only tetracycline resistance"],"answer":0,"explanation":"pUC plasmids are high-copy vectors that use lacZα for blue–white screening."},{"id":"s204","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":96,"q":"Which element most clearly distinguishes an expression vector from a simple DNA-maintenance vector?","options":["A promoter positioned to drive the insert","An origin of replication","Circular DNA","A selectable marker"],"answer":0,"explanation":"Expression requires transcriptional control of the cloned gene."},{"id":"s205","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":96,"q":"In a bacterial expression vector, the ribosome-binding site is required primarily for:","options":["Plasmid replication","Translation initiation","Antibiotic selection","Transcription termination"],"answer":1,"explanation":"The ribosome-binding site recruits the bacterial ribosome to initiate translation of the cloned gene."},{"id":"s206","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":96,"q":"In the pET system, transcription of the cloned gene is driven by a:","options":["KanR promoter","lacZα reporter","T7 promoter","Eukaryotic enhancer"],"answer":2,"explanation":"pET expression vectors place the insert downstream of a T7 promoter."},{"id":"s207","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":97,"q":"Which pair contains one selectable marker followed by one reporter?","options":["Ampᴿ, GFP","GFP, Kanᴿ","lacZ, Ampᴿ","Luciferase, Tetᴿ"],"answer":0,"explanation":"Ampicillin resistance enables survival selection; GFP provides a detectable signal."},{"id":"s208","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":97,"q":"Which reporter–signal pairing is correct?","options":["AmpR–luminescence","lacZ–antibiotic resistance","Luciferase–blue colonies only","GFP–fluorescence"],"answer":3,"explanation":"GFP produces fluorescence; lacZ gives a colorimetric signal and luciferase gives luminescence."},{"id":"s209","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":98,"q":"A protein requires native complex glycosylation and assembly. Which host is the best match from the table?","options":["E. coli","Mammalian cells","Cell-free agarose","Bacteriophage alone"],"answer":1,"explanation":"Mammalian cells best support complex mammalian folding and post-translational modification."},{"id":"s210","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":98,"q":"Which host is typically favored for rapid, inexpensive expression when complex post-translational processing is unnecessary?","options":["E. coli","Mammalian cells","Plant cells","Insect larvae only"],"answer":0,"explanation":"E. coli grows quickly, is inexpensive, and can produce high protein yields, but lacks eukaryotic processing."},{"id":"s211","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":98,"q":"Which host-system limitation is correctly matched?","options":["Yeast–cannot perform any protein folding","E. coli–no eukaryotic post-translational modifications","Mammalian cells–cannot secrete proteins","Plant cells–cannot express recombinant DNA"],"answer":1,"explanation":"Bacteria generally cannot perform complex eukaryotic modifications such as authentic glycosylation."},{"id":"s212","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":99,"q":"Which checkpoint occurs after selection/screening but before gene expression in the displayed workflow?","options":["Gene isolation","Clone confirmation","Vector insertion","Protein purification"],"answer":1,"explanation":"Putative transformants are confirmed before induction and product formation."},{"id":"s213","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":99,"q":"In the displayed recombinant-DNA workflow, what follows confirmation of recombinant clones?","options":["Restriction digestion of the original donor","Initial isolation of the gene","Gene-expression induction","Transformation into competent cells"],"answer":2,"explanation":"After clones are confirmed, expression is induced before protein production and purification."},{"id":"s214","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":100,"q":"Which source gives an intron-free coding sequence suitable for bacterial expression?","options":["Unprocessed genomic DNA","cDNA made from mature mRNA","Promoter-only DNA","Bacterial rRNA"],"answer":1,"explanation":"Reverse-transcribed mature mRNA yields cDNA lacking eukaryotic introns."},{"id":"s215","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":100,"q":"Which starting material contains introns and native regulatory regions?","options":["cDNA","Purified recombinant protein","Mature mRNA","Genomic DNA"],"answer":3,"explanation":"Genomic DNA contains introns and genomic regulatory sequences, unlike cDNA copied from mature mRNA."},{"id":"s216","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":100,"q":"Which enzyme is used to convert mature mRNA into cDNA?","options":["Reverse transcriptase","DNA ligase","Restriction endonuclease","T7 RNA polymerase"],"answer":0,"explanation":"Reverse transcriptase synthesizes complementary DNA using RNA as the template."},{"id":"s217","kind":"mcq","topics":["Genetic Engineering Applications 2"],"page":101,"q":"Which material should be depleted by PCR-product purification while the target fragment is retained?","options":["Target double-stranded DNA","Residual primers and free nucleotides","The cloned host genome","The vector origin"],"answer":1,"explanation":"Purification removes reaction components from the amplified DNA."},{"id":"s218","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":102,"q":"Which transformation description is correct?","options":["Heat shock uses a 1–2.5 kV pulse","Electroporation uses transient pores produced by high voltage","Competent cells are impermeable by design","Selection occurs before recovery"],"answer":1,"explanation":"Electroporation uses an electric pulse; heat shock uses rapid temperature change."},{"id":"s219","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":102,"q":"During chemical transformation, plasmid DNA is first mixed with competent bacterial cells under which condition?","options":["At 95°C","On ice","In boiling SDS","Under ultraviolet light"],"answer":1,"explanation":"The plasmid and competent cells are incubated on ice before the brief heat shock."},{"id":"s220","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":102,"q":"Which transformation method uses a short high-voltage pulse to create transient membrane pores?","options":["Heat shock","Centrifugation","Electroporation","Affinity chromatography"],"answer":2,"explanation":"Electroporation transiently permeabilizes the membrane with an electric pulse and generally gives high efficiency."},{"id":"s221","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":103,"q":"A colony grows on ampicillin but is blue in blue-white screening. What can be concluded from the slide's logic?","options":["It lacks all plasmid DNA","It carries a plasmid but is likely non-recombinant","It is definitively the desired recombinant","It cannot express antibiotic resistance"],"answer":1,"explanation":"Selection confirms plasmid carriage; screening distinguishes likely insert-containing clones."},{"id":"s222","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":103,"q":"After antibiotic selection, why is a separate screening step still required?","options":["Screening supplies antibiotic resistance","Selection destroys all recombinant plasmids","Screening makes cells competent","Selection cannot show whether surviving plasmids contain the insert"],"answer":3,"explanation":"Antibiotic growth establishes vector uptake, but screening distinguishes empty vector from likely recombinant plasmids."},{"id":"s223","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":104,"q":"Which method can simultaneously confirm exact insert sequence and orientation?","options":["Colony growth alone","DNA sequencing","Antibiotic selection","Cell lysis"],"answer":1,"explanation":"Sequencing reads the nucleotide order and reveals orientation."},{"id":"s224","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":104,"q":"Which confirmation method is most directly used to check insert size by the pattern of DNA bands?","options":["Restriction digestion","Protein staining","Affinity chromatography","Flow cytometry"],"answer":0,"explanation":"Diagnostic restriction digestion produces fragments whose gel-band sizes can reveal whether the expected insert is present."},{"id":"s225","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":105,"q":"After induction, which molecular step immediately produces mRNA from the recombinant gene?","options":["Translation","Transcription","Ligation","Transformation"],"answer":1,"explanation":"The host transcribes DNA to mRNA before translation."},{"id":"s226","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":105,"q":"Which vector element allows recombinant-gene expression to be switched on at a chosen time?","options":["Origin of replication","Inducible promoter","Selectable marker","Multiple cloning site"],"answer":1,"explanation":"An inducible promoter permits controlled transcription after addition of an inducer."},{"id":"s227","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":106,"q":"In the inducible systems shown, IPTG is used primarily to:","options":["Digest the plasmid","Relieve repression and switch on expression","Bind the His tag","Terminate transcription"],"answer":1,"explanation":"IPTG inactivates lac repression, enabling controlled expression."},{"id":"s228","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":106,"q":"A promoter directly determines which property of recombinant-gene expression?","options":["The plasmid's antibiotic target","The amino-acid sequence of the tag","When and how strongly transcription occurs","The pore size of the host membrane"],"answer":2,"explanation":"Promoters regulate the timing, location, and level of transcription."},{"id":"s229","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":106,"q":"Which expression system shown uses T7 RNA polymerase to transcribe the target gene?","options":["Blue–white system","Ni-NTA system","SDS-PAGE system","pET/T7 system"],"answer":3,"explanation":"The pET system uses a T7 promoter recognized by T7 RNA polymerase."},{"id":"s230","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":107,"q":"Which ordering is correct for intracellular recombinant-protein production?","options":["Induce → transform → lyse → grow","Transform → grow → induce → harvest → lyse → purify","Grow → purify → transform → induce","Lyse → induce → harvest → purify"],"answer":1,"explanation":"That is the numbered workflow on the slide."},{"id":"s231","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":107,"q":"Which operation releases an intracellular recombinant protein before purification?","options":["Cell lysis","Culture induction","Transformation","Antibiotic selection"],"answer":0,"explanation":"Cells are lysed after harvesting so the intracellular recombinant protein enters the lysate."},{"id":"s232","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":108,"q":"During Ni-NTA purification, which condition should release a His-tagged target after contaminants have been washed away?","options":["No imidazole and no nickel","High imidazole","Low imidazole only","SDS before column binding"],"answer":1,"explanation":"High imidazole competes with histidines for Ni²⁺ binding."},{"id":"s233","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":108,"q":"What is the direct basis of His-tagged protein capture on Ni-NTA resin?","options":["The tag binds agarose by base pairing","Histidines coordinate immobilized Ni²⁺","Imidazole covalently links the protein","SDS binds the nickel ions"],"answer":1,"explanation":"Histidine side chains in the tag coordinate Ni²⁺ immobilized on the NTA resin."},{"id":"s234","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":108,"q":"Why is low imidazole used during the wash step?","options":["To denature all proteins into peptides","To elute the His-tagged protein immediately","To remove weak nonspecific binders while retaining the His-tagged protein","To polymerize the chromatography resin"],"answer":2,"explanation":"Low imidazole competes weakly and removes nonspecific proteins; high imidazole is used for target elution."},{"id":"s235","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":109,"q":"An elution lane shows one intense band at the expected mass and few other bands. This most directly indicates:","options":["Efficient DNA transformation","Enrichment and high purity of the target protein","Failure of SDS denaturation","A larger-than-expected plasmid"],"answer":1,"explanation":"SDS-PAGE band position estimates mass and band complexity reflects purity."},{"id":"s236","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":109,"q":"What is the principal effect of SDS on proteins before PAGE?","options":["It preserves native quaternary structure","It gives larger proteins a positive charge","It attaches a fluorescent antibody","It gives proteins a broadly uniform negative charge"],"answer":3,"explanation":"SDS denatures proteins and masks their native charge, making migration depend mainly on molecular size."},{"id":"s237","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":110,"q":"Which application-category match is correct?","options":["Bioremediation—environment and sustainability","Golden Rice—industrial enzyme production","Recombinant insulin—crop improvement","Biofuel enzymes—monoclonal-antibody therapy"],"answer":0,"explanation":"Bioremediation uses organisms or engineered systems to address environmental contamination."},{"id":"s238","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":111,"q":"In the insulin case study, what occurs after separate bacterial production and purification of A and B chains?","options":["They are reverse-transcribed","They are combined and refolded with disulfide bonds","They are inserted into rice endosperm","They are separated by CRISPR"],"answer":1,"explanation":"The mature active product requires correct A/B-chain assembly."},{"id":"s239","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":111,"q":"In the two-chain insulin strategy shown, which chains are produced separately in bacteria?","options":["A and B insulin chains","α and β globin chains","Heavy and light antibody chains","Factor VIII and IX chains"],"answer":0,"explanation":"The insulin A and B chains are expressed and purified separately, then combined and folded."},{"id":"s240","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":111,"q":"What stabilizes the final association of insulin's A and B chains?","options":["Hydrogen bonds to DNA","Disulfide bonds","Phosphodiester bonds","Peptide bonds formed by DNA ligase"],"answer":1,"explanation":"Correct folding creates disulfide bonds between the insulin chains."},{"id":"s241","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":112,"q":"Which therapeutic-protein/clinical-use pairing is incorrect?","options":["EPO—anemia","Factor VIII—hemophilia A","hGH—growth hormone deficiency","Factor IX—hemophilia A"],"answer":3,"explanation":"Factor IX treats hemophilia B; Factor VIII treats hemophilia A."},{"id":"s242","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":112,"q":"Which recombinant protein is used to stimulate red-blood-cell production in chronic kidney disease?","options":["Human growth hormone","Interferon-α","Erythropoietin","Factor IX"],"answer":2,"explanation":"Recombinant EPO treats anemia by stimulating erythropoiesis."},{"id":"s243","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":112,"q":"Hemophilia B is treated with recombinant:","options":["Factor VIII","Human growth hormone","Erythropoietin","Factor IX"],"answer":3,"explanation":"Factor IX deficiency causes hemophilia B; factor VIII deficiency causes hemophilia A."},{"id":"s244","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":113,"q":"Which set correctly describes the recombinant hepatitis B vaccine?","options":["Live HBV; produced in bacteria; approved 1973","HBsAg subunit; produced in yeast; non-infectious","Whole inactivated HBV; produced in rice","Cas9 protein; produced in mammalian cells"],"answer":1,"explanation":"The vaccine uses recombinant hepatitis B surface antigen made in yeast."},{"id":"s245","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":113,"q":"The antigen used in the recombinant hepatitis B vaccine is:","options":["HBsAg","HIV gp120","Influenza hemagglutinin","Tetanus toxin"],"answer":0,"explanation":"The vaccine contains recombinant hepatitis B surface antigen, HBsAg."},{"id":"s246","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":113,"q":"Which production host is used for the recombinant hepatitis B surface antigen shown?","options":["E. coli","Yeast","Human erythrocytes","Tobacco mosaic virus"],"answer":1,"explanation":"HBsAg is expressed in yeast and purified to make a noninfectious vaccine."},{"id":"s247","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":114,"q":"Why are mammalian production cells preferred for many therapeutic monoclonal antibodies?","options":["They remove all disulfide bonds","They support folding, assembly, and post-translational modification","They prevent antibody-gene transcription","They eliminate purification requirements"],"answer":1,"explanation":"Complex antibodies require eukaryotic processing and assembly."},{"id":"s248","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":114,"q":"A monoclonal antibody is defined by its ability to:","options":["Cut DNA at a palindromic site","Replicate independently as a plasmid","Bind specifically to one target antigen","Transport lactose into bacteria"],"answer":2,"explanation":"Monoclonal antibodies are identical antibodies selected for specificity to one antigenic target."},{"id":"s249","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":114,"q":"Which therapeutic-antibody application shown targets HER2-positive breast cancer?","options":["Interferon-β","Palivizumab","Erythropoietin","Trastuzumab"],"answer":3,"explanation":"Trastuzumab binds HER2 and is used in HER2-positive breast cancer."},{"id":"s250","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":115,"q":"Which intervention is gene silencing rather than gene replacement or editing?","options":["Adding a functional copy of a missing gene","Using siRNA to reduce harmful-gene expression","Correcting a point mutation with CRISPR","Replacing a defective coding sequence"],"answer":1,"explanation":"Silencing lowers expression without necessarily changing the genomic sequence."},{"id":"s251","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":115,"q":"Which gene-therapy strategy aims to reduce expression of a harmful gene using siRNA or antisense molecules?","options":["Gene silencing","Gene replacement","Gene addition","Gene amplification"],"answer":0,"explanation":"Gene silencing lowers or stops production from a harmful gene without necessarily changing its DNA sequence."},{"id":"s252","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":115,"q":"Which strategy directly corrects a mutation at the DNA level?","options":["Gene addition","Gene editing","Protein replacement","RNA translation"],"answer":1,"explanation":"Gene editing, for example with CRISPR, changes the genomic DNA sequence itself."},{"id":"s253","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":116,"q":"Which example is correctly paired with its strategy?","options":["SMA—in vivo SMN1 gene addition","Sickle-cell disease—unmodified cell transfusion only","CAR-T—direct addition of insulin to T cells","SMA—Bt toxin expression"],"answer":0,"explanation":"The slide presents SMA as in vivo delivery of a functional SMN1 gene."},{"id":"s254","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":116,"q":"In the sickle-cell example, editing the BCL11A enhancer is intended to increase production of:","options":["Adult hemoglobin A only","Myoglobin","Fetal hemoglobin","Erythropoietin"],"answer":2,"explanation":"Reducing BCL11A repression reactivates fetal hemoglobin, which helps prevent sickling."},{"id":"s255","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":116,"q":"CAR-T therapy is best classified as:","options":["In vivo replacement of a liver gene","Silencing of all T-cell genes","Direct injection of recombinant insulin","Ex vivo engineering of a patient's immune cells"],"answer":3,"explanation":"T cells are removed, genetically engineered to express a chimeric antigen receptor, and returned to the patient."},{"id":"s256","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":117,"q":"Which pair contains one biotic and one abiotic target, respectively?","options":["Drought; salinity","Insect pest; drought","Heat; cold","Vitamin content; yield"],"answer":1,"explanation":"Pests are biological; drought is non-biological environmental stress."},{"id":"s257","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":117,"q":"Which example is an abiotic rather than biotic stress target in crop engineering?","options":["Drought","Fungal disease","Insect infestation","Viral infection"],"answer":0,"explanation":"Drought is a nonliving environmental stress; insects and pathogens are biotic stresses."},{"id":"s258","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":117,"q":"Engineering higher vitamin or essential-amino-acid content primarily targets:","options":["Herbicide tolerance","Nutritional quality","Pathogen resistance","Delayed flowering only"],"answer":1,"explanation":"Increasing vitamins, minerals, or essential amino acids is nutritional biofortification."},{"id":"s259","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":118,"q":"What is the immediate lethal action of activated Bt Cry toxin in a susceptible insect?","options":["Inhibition of plant photosynthesis","Pore formation in the insect gut membrane","Conversion of β-carotene to vitamin A","Blocking bacterial CAP binding"],"answer":1,"explanation":"Activated Cry toxin damages gut cells by forming pores."},{"id":"s260","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":118,"q":"Bt Cry toxins are derived from which organism?","options":["Agrobacterium tumefaciens","Escherichia coli","Bacillus thuringiensis","Saccharomyces cerevisiae"],"answer":2,"explanation":"Bt crops express Cry proteins originally produced by the bacterium Bacillus thuringiensis."},{"id":"s261","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":118,"q":"Which practice is most directly needed to address a major long-term limitation of Bt crops?","options":["Preventing beta-carotene synthesis","Increasing chemical insecticide residues","Removing the Cry gene from all seeds","Insect-resistance management"],"answer":3,"explanation":"Target insects can evolve resistance to Cry toxins, so resistance-management strategies are required."},{"id":"s262","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":119,"q":"Golden Rice is engineered so that which compound accumulates in the endosperm?","options":["Erythropoietin","β-carotene","Factor VIII","Allolactose"],"answer":1,"explanation":"β-carotene is provitamin A and gives the grain its golden color."},{"id":"s263","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":119,"q":"In Golden Rice, beta-carotene accumulates specifically in the:","options":["Grain endosperm","Leaf cuticle","Root cortex","Pollen wall"],"answer":0,"explanation":"The carotenoid pathway is engineered in the edible rice endosperm."},{"id":"s264","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":119,"q":"Golden Rice is an example of which crop-improvement approach?","options":["Herbicide detoxification","Nutritional biofortification","Insecticidal-protein production","Delayed fruit softening"],"answer":1,"explanation":"It increases provitamin A in a staple crop to improve micronutrient intake."},{"id":"s265","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":120,"q":"Which engineered outcome is matched to the correct trait category?","options":["Longer fruit shelf life—delayed ripening","Survival after pathogen attack—abiotic tolerance","Higher vitamin level—herbicide tolerance","Drought survival—disease resistance"],"answer":0,"explanation":"Delayed ripening slows softening and extends storage life."},{"id":"s266","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":120,"q":"Which engineered trait most directly reduces post-harvest losses by keeping fruit firm longer?","options":["Disease resistance","Herbicide tolerance","Delayed ripening","Cold sensitivity"],"answer":2,"explanation":"Delayed ripening extends shelf life and reduces spoilage after harvest."},{"id":"s267","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":120,"q":"A transgenic crop that survives salinity has been engineered primarily for:","options":["Biotic-stress resistance","Insecticidal activity","Nutritional biofortification","Abiotic-stress tolerance"],"answer":3,"explanation":"Salinity is a nonliving environmental condition and therefore an abiotic stress."},{"id":"s268","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":121,"q":"Which set contains only industrial enzymes listed on the slide?","options":["Amylase, protease, lipase","Chymosin, lactase, ethanol","Amino acids, vitamins, organic acids","Ethanol, butanol, bioplastics"],"answer":0,"explanation":"Amylase, protease, and lipase form the slide's industrial-enzyme group."},{"id":"s269","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":121,"q":"Which product group is classified on the slide as bio-based chemicals?","options":["Amino acids, vitamins, and organic acids","Chymosin and lactase","Amylase, protease, and lipase","Ethanol and bioplastics"],"answer":0,"explanation":"The slide groups amino acids, vitamins, and organic acids under bio-based chemicals."},{"id":"s270","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":122,"q":"Which environmental application couples target binding to a measurable output such as color or fluorescence?","options":["Bioremediation","Wastewater treatment","Biosensor","Biomass conversion"],"answer":2,"explanation":"The biosensor panel shows recognition of a target producing a visible signal."},{"id":"s271","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":122,"q":"Which environmental application uses engineered microbes to break down organic waste and remove toxins from water?","options":["Bioremediation","Wastewater treatment","Biosensing","Sustainable bioprocessing"],"answer":1,"explanation":"The wastewater-treatment panel specifically shows engineered microbes breaking down organic waste and removing toxins."},{"id":"s272","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":123,"q":"In the wheat example, bacterial treatment was used primarily to increase resistance to which type of pathogen?","options":["Fungal","Viral","Protozoan","Helminth"],"answer":0,"explanation":"The slide caption identifies wheat take-all as a fungal disease."},{"id":"s273","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":124,"q":"Which modification explains the phenotype of the hairless mouse?","options":["Insertion of an enhanced-GFP gene","Knockout of a hair-growth gene","Overexpression of a Bt gene","Deletion of a fluorescent-protein gene"],"answer":1,"explanation":"The hairless mouse is the knockout example; GFP expression belongs to the separate fluorescent-mouse image."},{"id":"s274","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":124,"q":"In the GFP mouse group, which mouse is identified as normal?","options":["The left mouse","The right mouse","The middle mouse","All three mice"],"answer":2,"explanation":"The caption identifies the middle mouse as normal and the two outer mice as expressing enhanced GFP."},{"id":"s275","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":125,"q":"Which engineered microbe-product pairing is shown on the slide?","options":["Cyanobacteria—diesel fuel","E. coli—diesel fuel","E. coli—polyethylene only","Cyanobacteria—chymosin"],"answer":1,"explanation":"The slide pairs engineered E. coli with diesel production and cyanobacteria with polyethylene or butanol."},{"id":"s276","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":125,"q":"Which fuel is shown as a photosynthetic byproduct of engineered cyanobacteria?","options":["Diesel","Methane","Ethanol","Butanol"],"answer":3,"explanation":"The slide states that engineered cyanobacteria can produce polyethylene and butanol as byproducts of photosynthesis."},{"id":"s277","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":126,"q":"Which proposed plant-engineering goal most directly addresses insecticide pollution?","options":["Increasing pesticide application frequency","Introducing insect resistance into the crop","Reducing seed germination","Eliminating drought tolerance"],"answer":1,"explanation":"Insect-resistant crops can reduce reliance on externally applied insecticides."},{"id":"s278","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":127,"q":"Which crop had the lowest GM adoption percentage among the four US values shown for 2010?","options":["Soybean","Cotton","Corn","Sugar beet"],"answer":2,"explanation":"The slide lists corn at 86%, below soybean and cotton at 93% and sugar beet at 95%."},{"id":"s279","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":127,"q":"Which crop had the highest GM adoption percentage in the displayed 2010 US data?","options":["Sugar beets","Soybeans","Cotton","Corn"],"answer":0,"explanation":"Sugar beets are listed at 95%, higher than soybeans and cotton at 93% and corn at 86%."},{"id":"s280","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":128,"q":"Which pairing correctly matches the introduced biological material with the intended plant outcome?","options":["Modified virus—viral proteins in banana fruit","Scorpion gene—vitamin A in cabbage","Bt gene—viral proteins in banana fruit","Modified virus—insect deterrence in cabbage"],"answer":0,"explanation":"The banana example uses modified viral material to produce viral proteins; the cabbage example uses a scorpion gene for insect deterrence."},{"id":"s281","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":128,"q":"What introduced genetic material is associated with the insect-resistant cabbage example?","options":["A Bt bacterial gene","A scorpion gene","A modified viral genome","A spider gene"],"answer":1,"explanation":"The cabbage example states that scorpion genes were added to prevent insects from eating the plant."},{"id":"s282","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":129,"q":"Golden Rice is engineered to accumulate a precursor of which vitamin?","options":["Vitamin A","Vitamin B12","Vitamin C","Vitamin K"],"answer":0,"explanation":"Beta-carotene is a precursor of vitamin A."},{"id":"s283","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":129,"q":"Which modification on the slide is aimed most directly at reducing post-harvest food loss?","options":["Higher yield","Faster growth","Longer shelf life","Herbicide resistance"],"answer":2,"explanation":"Longer shelf life directly delays spoilage after harvesting."},{"id":"s284","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":130,"q":"Which upcoming example uses an animal as a production host for a non-animal structural protein?","options":["Fast-growing salmon","Lower-methane cattle","GFP mouse","Spider-silk goat"],"answer":3,"explanation":"The goat example produces spider-silk protein in milk."},{"id":"s285","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":131,"q":"Which listed use depends on locating labeled cells inside an animal?","options":["Novelty coloration","Bioluminescent imaging","Selective breeding","Methane reduction"],"answer":1,"explanation":"Bioluminescent imaging uses emitted light to identify labeled cell populations."},{"id":"s286","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":131,"q":"Which named commercial example represents the novelty-pet use of fluorescence?","options":["Bt corn","Golden Rice","AquAdvantage salmon","GloFish"],"answer":3,"explanation":"The slide names GloFish as fluorescent novelty pets."},{"id":"s287","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":132,"q":"What is altered in the lower-methane cattle example?","options":["Growth-hormone genes from fish","Methane-producing bacteria","The bovine GFP gene","Milk spider-silk expression"],"answer":1,"explanation":"The cattle example targets bacteria responsible for methane production."},{"id":"s288","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":132,"q":"What stated physiological change makes the engineered salmon grow faster?","options":["Continuous growth-hormone production","Reduced methane production","Enhanced GFP expression","Increased insulin secretion"],"answer":0,"explanation":"Genes from two other fish cause the salmon to produce growth hormone continually."},{"id":"s289","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":133,"q":"In the transgenic-goat example, spider-silk protein is recovered from which secretion?","options":["Saliva","Milk","Sweat","Bile"],"answer":1,"explanation":"The introduced spider genes enable spider-silk protein production in goat milk."},{"id":"s290","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":134,"q":"Which concern specifically describes movement of a transgene beyond the cultivated field?","options":["Pollen drift","Off-target editing","Informed consent","Protein misfolding"],"answer":0,"explanation":"Seed and pollen drift can move engineered genetic material to other populations."},{"id":"s291","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":134,"q":"Which listed GMO concern describes selection for weeds that survive herbicide treatment?","options":["Farmer health","Herbicide-resistant super weeds","Pollen drift","Food labeling"],"answer":1,"explanation":"The slide explicitly lists creation of herbicide-resistant super weeds as a concern."},{"id":"s292","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":135,"q":"Which issue belongs to the ethical category rather than biosafety or environmental risk?","options":["Off-target changes","Effects on non-target organisms","Informed consent","Post-release monitoring"],"answer":2,"explanation":"Informed consent is listed under ethical issues."},{"id":"s293","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":135,"q":"Which measure belongs to regulation rather than biosafety, ethics, or environmental concerns?","options":["Preventing gene flow to wild relatives","Ensuring equitable access","Monitoring after commercialization","Detecting off-target changes"],"answer":2,"explanation":"Post-release or post-commercialization monitoring is listed under regulation."},{"id":"s294","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":135,"q":"Which concern is specifically environmental?","options":["Heritable germline changes","Laboratory-use risks","Informed consent","Effects on non-target organisms"],"answer":3,"explanation":"Effects on non-target organisms are grouped with ecosystem and biodiversity impacts under environmental concerns."},{"id":"s295","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":136,"q":"Which challenge most directly limits whether an engineered construct reaches the intended cells?","options":["Delivery of genetic material","Scalable production","Precise gene modification","Recombinant-product formation"],"answer":0,"explanation":"Difficult delivery is listed as a limitation, whereas the other options are advantages or outcomes."},{"id":"s296","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":136,"q":"Which listed advantage is the basis of producing enzymes, vaccines, and therapeutic proteins by genetic engineering?","options":["Recombinant-product production","Precise trait modification","Continued environmental monitoring","Reduced regulatory oversight"],"answer":0,"explanation":"The advantages column explicitly lists production of useful recombinant proteins, enzymes, and vaccines."},{"id":"s297","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":137,"q":"Base editing and prime editing are presented as routes toward what future goal?","options":["More precise genome editing","Higher pesticide use","Less individualized treatment","Replacement of all regulation"],"answer":0,"explanation":"Both technologies appear under more precise genome editing."},{"id":"s298","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":137,"q":"Which future direction involves constructing new biological systems and circuits?","options":["Personalized medicine","Synthetic biology and engineered cells","Sustainable biotechnology","Prime editing"],"answer":1,"explanation":"New biological systems and circuits are listed under synthetic biology and engineered cells."},{"id":"s299","kind":"mcq","topics":["Genetic Engineering Applications 3"],"page":137,"q":"Therapies selected using an individual's genetic information belong to which future direction?","options":["Sustainable biotechnology","Industrial fermentation","Personalized medicine","Environmental release monitoring"],"answer":2,"explanation":"The personalized-medicine section describes therapies based on individual genetics and targeted disease treatment."},{"id":"s300","kind":"mcq","topics":["Biological Motors"],"page":138,"q":"Which lecture begins on this slide?","options":["Cellular signaling","Biological motors","Cell death pathways","Host-pathogen interaction"],"answer":1,"explanation":"The title slide begins the Biological Motors lecture."},{"id":"s301","kind":"mcq","topics":["Biological Motors"],"page":139,"q":"A molecular motor is defined by conversion of chemical energy primarily into what output?","options":["Electrical potential only","Directed mechanical motion","Random thermal equilibrium","Permanent covalent crosslinks"],"answer":1,"explanation":"The lecture extends the motor concept to chemical-to-mechanical energy conversion."},{"id":"s302","kind":"mcq","topics":["Biological Motors"],"page":140,"q":"At the minimum of the Gibbs-free-energy curve, what is the value of ΔG for an infinitesimal forward reaction?","options":["ΔG < 0","ΔG = 0","ΔG > 0","ΔG = −7.3 kcal/mol in every reaction"],"answer":1,"explanation":"The curve minimum is chemical equilibrium, where ΔG is zero."},{"id":"s303","kind":"mcq","topics":["Biological Motors"],"page":140,"q":"On the Gibbs-free-energy graph, which region represents an energetically favorable forward reaction?","options":["The region labeled ΔG > 0","The minimum only","Every point after equilibrium","The region labeled ΔG < 0"],"answer":3,"explanation":"A negative Gibbs free-energy change indicates that forward progress is energetically favorable."},{"id":"s304","kind":"mcq","topics":["Biological Motors"],"page":141,"q":"Which cellular feature is used as an example of a maintained nonequilibrium condition?","options":["Uniform cytosolic pH everywhere","Acidic lysosomal pH","Complete absence of ion gradients","Maximum molecular disorder"],"answer":1,"explanation":"Proton pumps maintain the lysosome at an acidic pH away from equilibrium."},{"id":"s305","kind":"mcq","topics":["Biological Motors"],"page":141,"q":"According to the slide, why can the ordered state of living systems not persist at equilibrium?","options":["The second law requires maximum disorder at equilibrium","Equilibrium prevents ATP binding","Equilibrium eliminates all molecular motion","The first law prohibits energy conversion"],"answer":0,"explanation":"The slide links equilibrium with maximum disorder under the second law, so living order requires a nonequilibrium state."},{"id":"s306","kind":"mcq","topics":["Biological Motors"],"page":141,"q":"What do molecular machines interconvert or transduce to maintain cellular nonequilibrium?","options":["Only electrical voltage","Stores of nonequilibrium free energy","Covalent bonds into atoms","Genetic information into equilibrium"],"answer":1,"explanation":"They are described as macromolecular complexes that interconvert or transduce different reservoirs of nonequilibrium free energy."},{"id":"s307","kind":"mcq","topics":["Biological Motors"],"page":142,"q":"Which combination best characterizes a molecular motor's operating environment?","options":["High Reynolds number and negligible noise","Low Reynolds number and Brownian noise","Vacuum and rigid covalent gears","Temperature-independent dry conditions"],"answer":1,"explanation":"Molecular motors work in aqueous, low-Reynolds-number environments dominated by Brownian motion."},{"id":"s308","kind":"mcq","topics":["Biological Motors"],"page":142,"q":"Which interaction type is emphasized as governing molecular motors?","options":["Only covalent bonds","Nuclear fusion","Non-covalent interactions","Metallic bonding"],"answer":2,"explanation":"The slide explicitly states that biological motors are governed by non-covalent interactions."},{"id":"s309","kind":"mcq","topics":["Biological Motors"],"page":142,"q":"Which property distinguishes molecular motors from the macroscopic motors contrasted on the slide?","options":["They operate independently of temperature and pH","They are made only of rigid parts","They require a high-Reynolds-number gas","They rely on motion within the motor molecule"],"answer":3,"explanation":"Molecular motors rely on molecular dynamics and operate under restricted aqueous, temperature, and pH conditions."},{"id":"s310","kind":"mcq","topics":["Biological Motors"],"page":143,"q":"Which chemical reaction is shown as the common energy source for directed motor motion?","options":["ATP → ADP + Pi","ADP → ATP + glucose","GTP → DNA + Pi","Protein → amino acid + ATP"],"answer":0,"explanation":"ATP hydrolysis supplies chemical free energy that can be coupled to motion."},{"id":"s311","kind":"mcq","topics":["Biological Motors"],"page":143,"q":"What kind of biological structure is defined as a molecular motor on this slide?","options":["A complex of biological macromolecules","A lipid monolayer","A single inorganic ion","A DNA base pair"],"answer":0,"explanation":"The slide defines molecular motors as complexes of biological macromolecules."},{"id":"s312","kind":"mcq","topics":["Biological Motors"],"page":144,"q":"In the ATP structure, which phosphate group is terminal and released as Pi during hydrolysis?","options":["Alpha","Beta","Gamma","Ribose"],"answer":2,"explanation":"The gamma phosphate is the terminal phosphate."},{"id":"s313","kind":"mcq","topics":["Biological Motors"],"page":144,"q":"What standard free-energy change for ATP hydrolysis is displayed on the slide?","options":["+7.3 kcal/mol","-7.3 kcal/mol","-73 kcal/mol","+0.73 kcal/mol"],"answer":1,"explanation":"The displayed value is ΔG = -7.3 kcal/mol."},{"id":"s314","kind":"mcq","topics":["Biological Motors"],"page":145,"q":"Which nucleotide transition returns the model motor protein from state B to state A?","options":["ATP hydrolysis with ATP retained","ADP-to-ATP exchange","Binding of a second ADP","Loss of the protein tail"],"answer":1,"explanation":"Exchange of ADP for ATP restores the ATP-bound state A."},{"id":"s315","kind":"mcq","topics":["Biological Motors"],"page":145,"q":"Which nucleotide-bound state is assigned to conformation B in the simplified motor cycle?","options":["ATP-bound","GTP-bound","ADP- and Pi-bound","Nucleotide-free only"],"answer":2,"explanation":"ATP hydrolysis converts state A into the ADP/Pi-bound state B."},{"id":"s316","kind":"mcq","topics":["Biological Motors"],"page":145,"q":"What directly links nucleotide chemistry to mechanical output in the model?","options":["A change in DNA sequence","Permanent cleavage of the motor","Diffusion of the entire cell","A change in protein conformation"],"answer":3,"explanation":"ATP binding, hydrolysis, and exchange drive alternating protein conformations, which can produce motion."},{"id":"s317","kind":"mcq","topics":["Biological Motors"],"page":146,"q":"Which nucleotide-bound conformation is labeled inactive?","options":["ATP-bound","GTP-bound","ADP/GDP-bound","ATP/GTP-bound"],"answer":2,"explanation":"The slide contrasts active ATP/GTP-bound with inactive ADP/GDP-bound conformations."},{"id":"s318","kind":"mcq","topics":["Biological Motors"],"page":147,"q":"Which category includes kinesin, dynein, and myosin?","options":["Polymerization motors","Cytoskeletal motors","Rotary motors","Nucleic-acid motors"],"answer":1,"explanation":"These motors move on cytoskeletal tracks."},{"id":"s319","kind":"mcq","topics":["Biological Motors"],"page":148,"q":"Which cytoskeletal polymer is assembled from tubulin?","options":["Microfilament","Intermediate filament","Microtubule","Myosin thick filament"],"answer":2,"explanation":"Microtubules are tubulin polymers; microfilaments are actin polymers."},{"id":"s320","kind":"mcq","topics":["Biological Motors"],"page":148,"q":"Which function is NOT listed for the cytoskeleton on the slide?","options":["DNA replication","Cell shape","Intracellular transport","Organization of organelles"],"answer":0,"explanation":"The slide lists shape, protection, motility, cytokinesis, transport, division, and organelle organization, but not DNA replication."},{"id":"s321","kind":"mcq","topics":["Biological Motors"],"page":149,"q":"The repeating light-dark pattern in skeletal muscle is called what?","options":["Treadmilling","Striation","Chemotaxis","Birefringence"],"answer":1,"explanation":"Ordered sarcomeres generate visible striations."},{"id":"s322","kind":"mcq","topics":["Biological Motors"],"page":150,"q":"Which protein pair is central to the muscle-motor mechanism introduced here?","options":["Actin and myosin","Tubulin and dynein","Collagen and elastin","Keratin and lamin"],"answer":0,"explanation":"The following slides develop actin filaments and myosin motors."},{"id":"s323","kind":"mcq","topics":["Biological Motors"],"page":151,"q":"Which filament serves as the track for a myosin motor?","options":["Microtubule","Actin filament","Intermediate filament","Collagen fibril"],"answer":1,"explanation":"Myosin moves relative to actin."},{"id":"s324","kind":"mcq","topics":["Biological Motors"],"page":152,"q":"Which statement correctly distinguishes the two actin forms?","options":["G-actin is polymeric and F-actin monomeric","G-actin is globular monomer and F-actin filamentous polymer","Both are myosin light chains","F-actin lacks repeating actin subunits"],"answer":1,"explanation":"G-actin monomers polymerize into F-actin filaments."},{"id":"s325","kind":"mcq","topics":["Biological Motors"],"page":152,"q":"What approximate molecular mass is given for one G-actin subunit?","options":["5 kDa","43 kDa","11 kDa","130 kDa"],"answer":1,"explanation":"The slide gives a G-actin subunit mass of 43 kDa."},{"id":"s326","kind":"mcq","topics":["Biological Motors"],"page":152,"q":"Which factors are stated to have major roles in actin polymerization and depolymerization?","options":["DNA polymerase and sodium ions","Ribosomes and chloride ions","Actin-binding proteins and calcium ions","Histones and iron ions"],"answer":2,"explanation":"The slide specifically identifies actin-binding proteins and calcium ions."},{"id":"s327","kind":"mcq","topics":["Biological Motors"],"page":153,"q":"What higher-order arrangement is visible in the F-actin molecular model?","options":["Single straight chain","Right-handed double helix","Closed lipid bilayer","Triple collagen helix"],"answer":1,"explanation":"F-actin consists of two intertwined actin strands forming a right-handed double helix."},{"id":"s328","kind":"mcq","topics":["Biological Motors"],"page":154,"q":"Which step precedes rapid elongation during actin polymerization?","options":["Nucleation","Translation","Myosin cleavage","Sarcomere contraction"],"answer":0,"explanation":"A small actin nucleus must form before efficient filament elongation."},{"id":"s329","kind":"mcq","topics":["Biological Motors"],"page":154,"q":"During actin elongation, which filament end grows faster?","options":["The minus end","Both ends at identical rates","Neither end","The plus end"],"answer":3,"explanation":"The source diagram and companion identify elongation at both ends, with faster growth at the plus end."},{"id":"s330","kind":"mcq","topics":["Biological Motors"],"page":155,"q":"What is the immediate repeating subunit of the filament shown?","options":["G-actin","Myosin heavy chain","Tubulin dimer","Keratin tetramer"],"answer":0,"explanation":"The figure expands one actin subunit and shows many copies in the filament."},{"id":"s331","kind":"mcq","topics":["Biological Motors"],"page":156,"q":"Which monomeric actin species is preferentially incorporated into a growing filament?","options":["ATP-G-actin","ADP-G-actin","Nucleotide-free myosin","GDP-tubulin"],"answer":0,"explanation":"ATP-bound G-actin is the assembly-competent form emphasized in the polymerization scheme."},{"id":"s332","kind":"mcq","topics":["Biological Motors"],"page":156,"q":"What happens to ATP after ATP-G-actin is incorporated into the filament?","options":["It is hydrolyzed to ADP","It is converted to GTP","It remains permanently unmodified","It is released before incorporation"],"answer":0,"explanation":"Filament-incorporated actin hydrolyzes its bound ATP, producing ADP-actin."},{"id":"s333","kind":"mcq","topics":["Biological Motors"],"page":156,"q":"Which actin species dissociates more readily from a filament?","options":["ATP-actin","ADP-actin","GTP-actin","Calcium-free actin only"],"answer":1,"explanation":"The slide's nucleotide-state comparison indicates that ADP-actin is less stably retained and dissociates more readily."},{"id":"s334","kind":"mcq","topics":["Biological Motors"],"page":157,"q":"Which flux pattern defines actin treadmilling?","options":["Addition at both ends equally","Addition at plus end and loss at minus end","Loss at plus end and addition at neither end","Permanent retention of every subunit"],"answer":1,"explanation":"Treadmilling maintains flux through the filament by opposite net behavior at its two ends."},{"id":"s335","kind":"mcq","topics":["Biological Motors"],"page":157,"q":"What does the critical concentration separate in actin dynamics?","options":["ATP synthesis from glycolysis","Myosin from kinesin motion","Net polymerization from net depolymerization","Thin filaments from thick filaments"],"answer":2,"explanation":"Above or below the critical concentration, the balance shifts between net subunit addition and net subunit loss."},{"id":"s336","kind":"mcq","topics":["Biological Motors"],"page":157,"q":"Why can an actin filament at steady state still be dynamic?","options":["Every actin subunit stops exchanging","The filament is covalently fixed","ATP hydrolysis ceases completely","Subunit addition and loss can continue at equal overall rates"],"answer":3,"explanation":"Steady length can coexist with ongoing addition at one end and loss at the other."},{"id":"s337","kind":"mcq","topics":["Biological Motors"],"page":158,"q":"Which landmarks delimit one complete sarcomere?","options":["Two adjacent Z lines","Two adjacent M lines","One Z line and one H zone","Two A-band centers"],"answer":0,"explanation":"A sarcomere extends from Z line to Z line."},{"id":"s338","kind":"mcq","topics":["Biological Motors"],"page":158,"q":"Which sarcomere region contains thick filament but no thin-filament overlap?","options":["H zone","I band","Z line","Entire A band"],"answer":0,"explanation":"The H zone is the central thick-filament-only region around the M line."},{"id":"s339","kind":"mcq","topics":["Biological Motors"],"page":158,"q":"Where are thin actin filaments anchored in the sarcomere diagram?","options":["At the M line","At the Z lines","Only within the H zone","At the center of each thick filament"],"answer":1,"explanation":"Thin filaments extend inward from the Z lines toward the center of the sarcomere."},{"id":"s340","kind":"mcq","topics":["Biological Motors"],"page":159,"q":"Which myosin domain contains both ATP- and actin-binding sites?","options":["Head","Neck","Tail","Regulatory light chain alone"],"answer":0,"explanation":"Both binding sites are in the globular head domain."},{"id":"s341","kind":"mcq","topics":["Biological Motors"],"page":159,"q":"What is the composition of the myosin molecule shown?","options":["One heavy chain and four actin chains","Two tubulin chains and two regulatory chains","Two heavy chains, two essential light chains, and two regulatory light chains","One heavy chain, one essential light chain, and no regulatory chains"],"answer":2,"explanation":"The slide lists two heavy chains plus two essential and two regulatory light chains."},{"id":"s342","kind":"mcq","topics":["Biological Motors"],"page":159,"q":"Which structural region of myosin carries the essential and regulatory light chains?","options":["Head","Coiled-coil tail tip","Actin filament","Neck"],"answer":3,"explanation":"The diagram places both classes of light chain around the neck region."},{"id":"s343","kind":"mcq","topics":["Biological Motors"],"page":160,"q":"Which event directly produces the myosin working stroke?","options":["Myosin-head conformational change","Actin conversion into tubulin","Permanent tail depolymerization","DNA transcription in the bead"],"answer":0,"explanation":"A nucleotide-linked conformational change in the head generates the working stroke."},{"id":"s344","kind":"mcq","topics":["Biological Motors"],"page":161,"q":"Why are actin and myosin assigned different fluorophores in the image?","options":["To separate their spatial distributions","To change their nucleotide specificity","To increase ATP hydrolysis stoichiometry","To convert force into fluorescence"],"answer":0,"explanation":"Distinct labels allow the two proteins to be localized independently."},{"id":"s345","kind":"mcq","topics":["Biological Motors"],"page":162,"q":"Arthur Ashkin's single-beam trap uses what physical input?","options":["A tightly focused laser beam","A uniform magnetic field","A chemical ATP gradient","A rotating glass needle"],"answer":0,"explanation":"Radiation pressure and the intensity gradient of a focused laser trap a dielectric particle."},{"id":"s346","kind":"mcq","topics":["Biological Motors"],"page":162,"q":"In what year did Arthur Ashkin observe three-dimensional trapping with one focused beam, according to the slide?","options":["1985","1829","1955","2005"],"answer":0,"explanation":"The slide dates Ashkin's observation of single-beam three-dimensional trapping to 1985."},{"id":"s347","kind":"mcq","topics":["Biological Motors"],"page":163,"q":"In the Gaussian beam profile, where is optical intensity greatest?","options":["At the central focus","At both outer edges","Uniformly across the beam","Only behind the bead"],"answer":0,"explanation":"A Gaussian profile is brightest at the center."},{"id":"s348","kind":"mcq","topics":["Biological Motors"],"page":163,"q":"What happens to light rays when the focused beam interacts with the bead?","options":["They lose all momentum","They are bent by reflection and refraction","They become chemically bound to the bead","They pass through without changing direction"],"answer":1,"explanation":"The slide describes bending of the rays according to reflection and refraction."},{"id":"s349","kind":"mcq","topics":["Biological Motors"],"page":163,"q":"Which beam property creates the lateral intensity gradient used for trapping?","options":["Uniform intensity across the beam","Random polarization only","A Gaussian profile brighter at the center","A hollow center with bright edges"],"answer":2,"explanation":"A Gaussian beam is brightest centrally and dimmer toward the edges, creating the required gradient."},{"id":"s350","kind":"mcq","topics":["Biological Motors"],"page":164,"q":"The force on the bead follows from conservation of which quantity when light is refracted?","options":["Charge","Momentum","Mass number","ATP concentration"],"answer":1,"explanation":"Changing light momentum requires an equal and opposite momentum change of the bead."},{"id":"s351","kind":"mcq","topics":["Biological Motors"],"page":164,"q":"Light momentum is described as proportional to which physical quantity?","options":["Its wavelength only","The bead diameter only","The fluid viscosity only","Its energy"],"answer":3,"explanation":"The slide states that light carries momentum proportional to its energy and directed along propagation."},{"id":"s352","kind":"mcq","topics":["Biological Motors"],"page":165,"q":"Which force component acts as the inward restoring force in an optical trap?","options":["Scattering force","Gradient force","Buoyant force","Centrifugal force"],"answer":1,"explanation":"The gradient force points toward the high-intensity beam center."},{"id":"s353","kind":"mcq","topics":["Biological Motors"],"page":165,"q":"In which direction does the scattering-force component point?","options":["Primarily along the direction of incident light","Toward the beam center in the xy plane","Opposite every incident ray","Randomly because of Brownian motion"],"answer":0,"explanation":"The slide separates scattering force along incident-light propagation from the inward gradient force."},{"id":"s354","kind":"mcq","topics":["Biological Motors"],"page":165,"q":"What measurement ranges are emphasized for biological optical-tweezer experiments?","options":["Forces in newtons and displacements in metres","Forces in piconewtons and displacements in nanometres","Forces in joules and displacements in seconds","Forces in pascals and displacements in litres"],"answer":1,"explanation":"The application is described as applying pN-range forces and measuring nm-range displacements."},{"id":"s355","kind":"mcq","topics":["Biological Motors"],"page":166,"q":"For trap stiffness k, a bead displaced by x experiences which restoring-force relation?","options":["F = k/x","F = −kx","F = x/k","F = −k/x²"],"answer":1,"explanation":"The trap is approximated as a Hookean spring."},{"id":"s356","kind":"mcq","topics":["Biological Motors"],"page":166,"q":"At constant trap stiffness, what happens to restoring-force magnitude when displacement doubles?","options":["It halves","It is unchanged","It doubles","It becomes zero"],"answer":2,"explanation":"From |F| = kx, doubling x at fixed k doubles the restoring-force magnitude."},{"id":"s357","kind":"mcq","topics":["Biological Motors"],"page":167,"q":"The cited single-myosin experiment resolves forces and steps on which scales?","options":["Newton and metre","Piconewton and nanometre","Millinewton and centimetre","Pascal and litre"],"answer":1,"explanation":"Single-molecule optical trapping operates at pN force and nm displacement scales."},{"id":"s358","kind":"mcq","topics":["Biological Motors"],"page":168,"q":"What directly displaces the optically trapped end beads?","options":["Myosin interacting with the suspended actin filament","Laser-induced DNA replication","Polymerization of the silica support","Diffusion of cortisol into the bead"],"answer":0,"explanation":"A myosin working event moves actin and therefore the attached trapped beads."},{"id":"s359","kind":"mcq","topics":["Biological Motors"],"page":168,"q":"What is the role of the two optically trapped beads in the dual-beam setup?","options":["They synthesize ATP","They coat the support with myosin","They directly fluoresce when ATP is hydrolyzed","They suspend and tension an actin filament"],"answer":3,"explanation":"The actin filament is attached between the two trapped beads and held under tension."},{"id":"s360","kind":"mcq","topics":["Biological Motors"],"page":168,"q":"Which motor properties can be extracted from bead displacements in this setup?","options":["Working stroke, attachment lifetime, and force magnitude","DNA sequence, mutation rate, and chromosome number","Only ATP concentration","Only filament diameter"],"answer":0,"explanation":"The slide explicitly lists working stroke, attachment lifetime, and magnitude of force generation."},{"id":"s361","kind":"mcq","topics":["Biological Motors"],"page":169,"q":"Why is heavy meromyosin kept at low density on the support?","options":["To isolate events from one or a few motors","To eliminate all actin binding","To increase bead diameter","To make the photodiode fluorescent"],"answer":0,"explanation":"Sparse coating reduces simultaneous interactions by many motors."},{"id":"s362","kind":"mcq","topics":["Biological Motors"],"page":169,"q":"To approximately what tension was the suspended actin filament pulled?","options":["0.2 pN","2 pN","20 pN","200 pN"],"answer":1,"explanation":"The second bead was moved until the actin filament experienced about 2 pN of tension."},{"id":"s363","kind":"mcq","topics":["Biological Motors"],"page":169,"q":"Which detector provided high-resolution bead-position measurements?","options":["Geiger counter","Mass spectrometer","Quadrant photodiode","Patch-clamp electrode"],"answer":2,"explanation":"A brightfield image of a bead was projected onto a quadrant photodiode detector."},{"id":"s364","kind":"mcq","topics":["Biological Motors"],"page":170,"q":"What step size is observed at both low and high ATP concentrations?","options":["Approximately 2 nm","Approximately 5 nm","Approximately 11 nm","Approximately 110 nm"],"answer":2,"explanation":"The displacement traces identify a step close to 11 nm."},{"id":"s365","kind":"mcq","topics":["Biological Motors"],"page":170,"q":"Which trace acts as the perpendicular-motion control in the displayed recordings?","options":["The upper trace","Both traces are parallel motion","Neither trace records bead motion","The lower trace"],"answer":3,"explanation":"The upper trace records motion along the actin filament; the lower trace records motion perpendicular to it."},{"id":"s366","kind":"mcq","topics":["Biological Motors"],"page":171,"q":"Where is the main cluster of displacement events in the histogram?","options":["0–2 nm","10–13 nm","20–25 nm","35–40 nm"],"answer":1,"explanation":"The tallest bars lie around 10–13 nm."},{"id":"s367","kind":"mcq","topics":["Biological Motors"],"page":171,"q":"What quantity is plotted on the vertical axis of the displacement histogram?","options":["Number of events","ATP concentration","Force in pN","Time in seconds"],"answer":0,"explanation":"The histogram plots displacement on the horizontal axis and number of events on the vertical axis."},{"id":"s368","kind":"mcq","topics":["Biological Motors"],"page":172,"q":"At approximately what force is the single-myosin distribution maximal?","options":["0.3 pN","3 pN","30 pN","300 pN"],"answer":1,"explanation":"The tallest histogram bin is centered near 3 pN."},{"id":"s369","kind":"mcq","topics":["Biological Motors"],"page":172,"q":"What quantity is plotted on the horizontal axis of the single-myosin histogram?","options":["Displacement in nm","Force in pN","ATP concentration in mM","Number of events"],"answer":1,"explanation":"The horizontal axis is force in piconewtons, while the vertical axis is number of events."},{"id":"s370","kind":"mcq","topics":["Biological Motors"],"page":173,"q":"What provides propulsion in the light-controlled 3D micromotors?","options":["Bacteria","Myosin-coated actin","Steroid receptors","Silica diffusion"],"answer":0,"explanation":"The paper title and image identify bacteria-powered micromotors."},{"id":"s371","kind":"mcq","topics":["Biological Motors"],"page":174,"q":"What repeated structure is shown in the micrograph?","options":["Four-gear micromotor assemblies","Actin sarcomeres","Nuclear receptor dimers","Bacterial chromosomes"],"answer":0,"explanation":"The field contains repeated groups of four gear-like micromotor units."},{"id":"s372","kind":"mcq","topics":["Biological Motors"],"page":175,"q":"The bacterial flagellar motor belongs to which motor class?","options":["Polymerization motor","Linear cytoskeletal motor","Rotary motor","Nucleic-acid motor"],"answer":2,"explanation":"It rotates the flagellum to propel the bacterium."},{"id":"s373","kind":"mcq","topics":["Biological Motors"],"page":176,"q":"Which reference text is cited for the Biological Motors lecture?","options":["Molecular Biology of the Cell, 5th edition","Lehninger Principles, 1st edition","Gray's Anatomy, 2nd edition","The Origin of Species, 5th edition"],"answer":0,"explanation":"The reference slide names Molecular Biology of the Cell, 5th edition, by Bruce Alberts."},{"id":"s374","kind":"mcq","topics":["Cellular Signaling"],"page":177,"q":"What is the topic of the lecture beginning on this slide?","options":["Biological motors","Cellular signaling","Genetic engineering","Cancer drug development"],"answer":1,"explanation":"This is the Cellular Signaling title slide."},{"id":"s375","kind":"mcq","topics":["Cellular Signaling"],"page":178,"q":"In the neutrophil example, directed movement toward a chemical cue is followed by what process?","options":["Phagocytosis","Transcription","Treadmilling","Endocrine secretion"],"answer":0,"explanation":"The caption describes chemotactic and phagocytic responses."},{"id":"s376","kind":"mcq","topics":["Cellular Signaling"],"page":179,"q":"Why must a cell process multiple received signals?","options":["To produce one coordinated action plan","To ensure every receptor gives an identical response","To prevent all environmental sensing","To keep every pathway independent"],"answer":0,"explanation":"Cells integrate concurrent information into a unified response."},{"id":"s377","kind":"mcq","topics":["Cellular Signaling"],"page":180,"q":"Which signal is most likely to use an intracellular receptor?","options":["A membrane-impermeant peptide","A lipid-soluble steroid hormone","A large extracellular-matrix protein","A surface-bound juxtacrine ligand"],"answer":1,"explanation":"Some lipid-soluble hormones cross the plasma membrane and bind intracellular receptors."},{"id":"s378","kind":"mcq","topics":["Cellular Signaling"],"page":180,"q":"What determines the limited set of signals to which a particular cell responds?","options":["Only the signal's molecular mass","Only distance from the bloodstream","The cell's history and current state","The total number of neighboring cells"],"answer":2,"explanation":"The slide states that responsiveness depends on a cell's history and current state."},{"id":"s379","kind":"mcq","topics":["Cellular Signaling"],"page":181,"q":"Which pair consists entirely of gaseous signaling molecules listed on the slide?","options":["NO and CO","NO and cortisol","CO and dopamine","Epinephrine and acetylcholine"],"answer":0,"explanation":"Nitric oxide and carbon monoxide are the two gases listed."},{"id":"s380","kind":"mcq","topics":["Cellular Signaling"],"page":181,"q":"Steroid signaling molecules are derived from which precursor?","options":["Glucose","Glycogen","RNA","Cholesterol"],"answer":3,"explanation":"The slide states that steroids are derived from cholesterol."},{"id":"s381","kind":"mcq","topics":["Cellular Signaling"],"page":181,"q":"Which signal class includes glutamate, glycine, acetylcholine, epinephrine, dopamine, and thyroid hormone on this slide?","options":["Amino acids and amino-acid derivatives","Gases","Steroids only","Extracellular-matrix proteins only"],"answer":0,"explanation":"All of these examples are placed in the amino-acid and amino-acid-derivative category."},{"id":"s382","kind":"mcq","topics":["Cellular Signaling"],"page":182,"q":"PDGF released from platelets at a wound acts mainly by which signaling mode?","options":["Autocrine","Paracrine","Endocrine","Juxtacrine"],"answer":1,"explanation":"PDGF travels locally to nearby target cells during repair."},{"id":"s383","kind":"mcq","topics":["Cellular Signaling"],"page":182,"q":"Which feature defines autocrine signaling?","options":["The signal must enter the bloodstream","The producing cell also expresses receptors for its messenger","The ligand must remain membrane-bound on another cell","The signal acts only through an intracellular steroid receptor"],"answer":1,"explanation":"In autocrine signaling, a cell releases a messenger to which that same cell can respond."},{"id":"s384","kind":"mcq","topics":["Cellular Signaling"],"page":182,"q":"Why do paracrine messengers generally remain local?","options":["They are always covalently attached to DNA","They can travel only inside red blood cells","They are commonly unstable, degraded, or trapped by extracellular matrix","They cannot bind receptors"],"answer":2,"explanation":"The slide lists instability, enzymatic degradation, and extracellular-matrix binding as limits on long-distance travel."},{"id":"s385","kind":"mcq","topics":["Cellular Signaling"],"page":183,"q":"Which feature uniquely identifies juxtacrine signaling?","options":["Transport through blood","Direct contact between membrane-bound ligand and receptor","Diffusion to nearby cells","A cell responding to its own secretion"],"answer":1,"explanation":"Juxtacrine signaling requires direct cell-cell contact."},{"id":"s386","kind":"mcq","topics":["Cellular Signaling"],"page":183,"q":"Which molecules are given as juxtacrine regulators of contact inhibition?","options":["Insulin and glucagon","NO and CO","Cortisol and estradiol","Integrins and cadherins"],"answer":3,"explanation":"The slide cites the cell-adhesion molecules integrins and cadherins in contact-dependent signaling."},{"id":"s387","kind":"mcq","topics":["Cellular Signaling"],"page":183,"q":"What response to insulin is used as the endocrine example?","options":["Glucose uptake in liver cells","Contact inhibition in epithelial cells","Histamine release from mast cells","Phagocytosis by neutrophils"],"answer":0,"explanation":"Insulin from pancreatic beta cells is stated to stimulate glucose uptake in liver cells."},{"id":"s388","kind":"mcq","topics":["Cellular Signaling"],"page":184,"q":"Which source-cell pairing is correct according to the table?","options":["Glucagon—pancreatic alpha cells","Insulin—pancreatic alpha cells","Cortisol—thyroid gland","Thyroxine—adrenal gland"],"answer":0,"explanation":"Glucagon is produced by pancreatic alpha cells; insulin is produced by beta cells."},{"id":"s389","kind":"mcq","topics":["Cellular Signaling"],"page":184,"q":"Which hormone in the table is a protein secreted by pancreatic beta cells?","options":["Glucagon","Insulin","Cortisol","Thyroxine"],"answer":1,"explanation":"The table identifies insulin as a protein produced by pancreatic beta cells."},{"id":"s390","kind":"mcq","topics":["Cellular Signaling"],"page":184,"q":"Which listed hormone stimulates metabolism in many cell types?","options":["Estradiol","Glucagon","Thyroid hormone","Testosterone"],"answer":2,"explanation":"The thyroxine row lists stimulation of metabolism in many cell types."},{"id":"s391","kind":"mcq","topics":["Cellular Signaling"],"page":185,"q":"Which listed signal inhibits proliferation of several cell types?","options":["EGF","PDGF","TGF-β","Histamine"],"answer":2,"explanation":"The table assigns an antiproliferative action to transforming growth factor beta."},{"id":"s392","kind":"mcq","topics":["Cellular Signaling"],"page":185,"q":"Which local mediator causes blood vessels to dilate and become leaky during inflammation?","options":["EGF","TGF-beta","Delta","Histamine"],"answer":3,"explanation":"The histamine row lists vasodilation and increased leakiness during inflammation."},{"id":"s393","kind":"mcq","topics":["Cellular Signaling"],"page":185,"q":"Which contact-dependent signal inhibits neighboring cells from adopting the same specialized fate as the signaling cell?","options":["Delta","PDGF","Nitric oxide","Acetylcholine"],"answer":0,"explanation":"The table describes Delta as a transmembrane signal that inhibits neighboring-cell specialization."},{"id":"s394","kind":"mcq","topics":["Cellular Signaling"],"page":186,"q":"Which feature allows one activated receptor to generate many downstream molecules?","options":["Specificity","Amplification","Integration","Contact inhibition"],"answer":1,"explanation":"Amplification increases output at successive signaling steps."},{"id":"s395","kind":"mcq","topics":["Cellular Signaling"],"page":186,"q":"Which pathway feature combines information from multiple signaling inputs?","options":["Specificity","Integration","Amplification","Cascade"],"answer":1,"explanation":"Integration is the feature that combines multiple inputs into a coordinated output."},{"id":"s396","kind":"mcq","topics":["Cellular Signaling"],"page":187,"q":"When several receptor pathways feed into one shared intracellular component, the network shows what property?","options":["Divergence","Convergence","Treadmilling","Endocrine transport"],"answer":1,"explanation":"Convergence is the merging of distinct upstream inputs."},{"id":"s397","kind":"mcq","topics":["Cellular Signaling"],"page":187,"q":"When one receptor pathway produces several distinct downstream outputs, what network property is illustrated?","options":["Convergence","Equilibrium","Divergence","Contact inhibition"],"answer":2,"explanation":"Branching from one input toward multiple outputs is divergence."},{"id":"s398","kind":"mcq","topics":["Cellular Signaling"],"page":188,"q":"After cortisol binds the glucocorticoid receptor, which event occurs before target-protein synthesis?","options":["Receptor translocation to the nucleus and transcriptional activation","Opening of a ligand-gated sodium channel","Flagellar rotation","Extracellular ATP polymerization"],"answer":0,"explanation":"The activated receptor enters the nucleus and regulates transcription before translation produces protein."},{"id":"s399","kind":"mcq","topics":["Cellular Signaling"],"page":188,"q":"How does cortisol first enter its target cell in the depicted pathway?","options":["Through a ligand-gated ion channel","By receptor-mediated endocytosis","Through a gap junction","By diffusion through
