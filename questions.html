<style>
:root{color-scheme:light dark;--bg:#eef1ed;--panel:#fff;--ink:#15201a;--muted:#647069;--line:#cbd2cd;--accent:#176b48;--accent2:#dff1e7;--bad:#a33b2b;--bad2:#fbe4df;--good:#147044}
@media(prefers-color-scheme:dark){:root{--bg:#0e1511;--panel:#18211c;--ink:#edf5ef;--muted:#a8b5ad;--line:#34443a;--accent:#77d6a3;--accent2:#203d2e;--bad:#ff9d8e;--bad2:#3d211c;--good:#78dda4}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}
a{color:var(--accent)}button,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0}.grow{flex:1}.meta{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);border-radius:9px;background:transparent;padding:7px 12px;cursor:pointer;text-decoration:none;color:var(--ink)}.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent2);border-color:var(--accent)}
.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 54px)}
nav{position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:10px}
.trow{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:9px;cursor:pointer}.trow:hover{background:var(--accent2)}
.trow input{margin-top:4px}.trow small{display:block;color:var(--muted)}
.minibar{height:4px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}.minibar i{display:block;height:100%;background:var(--accent)}
.navtools{display:flex;gap:6px;margin-bottom:8px}
main{padding:16px;max-width:1000px;width:100%;margin:0 auto}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.q.right{border-left:5px solid var(--good)}.q.wrongq{border-left:5px solid var(--bad)}
.qhead{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-bottom:6px}
.qtext{font-weight:650;font-size:16px;margin-bottom:10px}
.choices{display:grid;gap:7px}.choice{border:1px solid var(--line);border-radius:9px;background:transparent;padding:9px 12px;text-align:left;cursor:pointer}.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}.choice.correct{border-color:var(--good);background:var(--accent2)}.choice.wrong{border-color:var(--bad);background:var(--bad2)}
.fb{margin-top:10px;padding:10px 12px;background:var(--accent2);border-radius:9px}
.answer{margin-top:10px;padding:10px 12px;background:var(--accent2);border-radius:9px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.stats{font-variant-numeric:tabular-nums}
.empty{padding:40px;text-align:center;color:var(--muted)}
body.collapsed .layout{grid-template-columns:1fr}body.collapsed nav{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}nav{display:none;position:fixed;inset:54px 0 0 0;height:auto;z-index:10}nav.open{display:block!important}main{padding:10px}}
</style>

<script>
const D={"topics":["Bioenergetics","Gene Expression and Regulation","Genetic Engineering Applications 1","Genetic Engineering Applications 2","Genetic Engineering Applications 3","Biological Motors","Cellular Signaling","Cell Death and Cell Division","Stem Cells and Differentiation","Host Pathogen Interaction","Cell Death Pathways","Cancer Biology 1","Cancer Biology 2 and Drug Development","Drug Development 1","Drug Development 2","Drug Development and Techniques","Techniques in Biochemistry and Biophysics","Mixed Review (all topics)"],"questions":[{"id":"s0","kind":"mcq","topics":["Bioenergetics"],"page":3,"q":"Which sequence correctly matches the four metabolic functions numbered on the slide?","options":["Obtain energy → replicate DNA → translate proteins → excrete all lipids","Obtain energy → make cellular precursors → polymerize macromolecules → make/degrade specialized biomolecules","Make cellular precursors → obtain energy → degrade all macromolecules → store pigments","Polymerize macromolecules → obtain nitrogen → make ATP only → stop degradation"],"answer":1,"explanation":"The slide numbers those four functions in that order."},{"id":"s1","kind":"mcq","topics":["Bioenergetics"],"page":3,"q":"Which metabolic function directly converts small precursor units into proteins, nucleic acids, and polysaccharides?","options":["Capturing environmental energy","Polymerizing monomeric precursors","Degrading specialized pigments","Converting heat into free energy"],"answer":1,"explanation":"The slide identifies polymerization of monomeric precursors as the step that produces cellular macromolecules."},{"id":"s2","kind":"mcq","topics":["Bioenergetics"],"page":3,"q":"Which set consists entirely of specialized biomolecules explicitly listed on the slide?","options":["Membrane lipids, intracellular messengers, and pigments","DNA, ribosomes, and chromosomes","Glucose, oxygen, and carbon dioxide","ATP, ADP, and inorganic phosphate"],"answer":0,"explanation":"Membrane lipids, intracellular messengers, and pigments are the slide's examples of biomolecules needed for specialized cellular functions."},{"id":"s3","kind":"mcq","topics":["Bioenergetics"],"page":4,"q":"Which conversion in the nitrogen-cycle diagram is labeled as nitrogen fixation?","options":["Atmospheric N₂ → NH₄⁺/ammonia","NH₄⁺/ammonia → NO₂⁻/nitrite","NO₂⁻/nitrite → NO₃⁻/nitrate","NO₃⁻/nitrate → atmospheric N₂"],"answer":0,"explanation":"Nitrogen-fixing bacteria and archaea convert atmospheric N₂ to ammonia/ammonium."},{"id":"s4","kind":"mcq","topics":["Bioenergetics"],"page":4,"q":"Which nitrogen-cycle conversion is nitrification rather than nitrogen fixation or denitrification?","options":["N2 to NH4+","NH4+ to NO2−","NO3− to N2","Amino acids to proteins"],"answer":1,"explanation":"The diagram associates oxidation of ammonium to nitrite with nitrification."},{"id":"s5","kind":"mcq","topics":["Bioenergetics"],"page":4,"q":"What happens to useful energy during metabolic energy conversion?","options":["All of it is conserved as free energy","Some is converted to heat while entropy increases","It is converted completely into nitrogen","It increases as entropy decreases"],"answer":1,"explanation":"The slide states that useful free energy is unavoidably lost as heat and that entropy increases."},{"id":"s6","kind":"mcq","topics":["Bioenergetics"],"page":5,"q":"Which carrier set is shown linking catabolism to anabolism in the central part of the diagram?","options":["AMP, DNA, RNA, and CoA","Glucose, glycogen, starch, and sucrose","CO₂, H₂O, NH₃, and O₂","ATP, NADH, NADPH, and FADH₂"],"answer":3,"explanation":"The center lists ATP and reduced electron carriers NADH, NADPH, and FADH₂."},{"id":"s7","kind":"mcq","topics":["Bioenergetics"],"page":5,"q":"Which process is represented by the downward catabolic side of the diagram?","options":["Precursors plus energy forming macromolecules","Energy-rich nutrients forming energy-depleted products","ADP and NAD+ forming glucose directly","Macromolecules forming solar energy"],"answer":1,"explanation":"Catabolism breaks down energy-containing nutrients and yields energy-depleted products while capturing usable energy."},{"id":"s8","kind":"mcq","topics":["Bioenergetics"],"page":5,"q":"Which pair links energy-producing catabolism to energy-requiring anabolism in the diagram?","options":["DNA and RNA","CO2 and O2 only","ATP and reduced electron carriers","Glucose and amino acids only"],"answer":2,"explanation":"ATP and reduced carriers such as NADH, NADPH, and FADH2 transfer captured energy and reducing power."},{"id":"s9","kind":"mcq","topics":["Bioenergetics"],"page":6,"q":"Which pathway pattern is paired correctly on the slide?","options":["Cyclic catabolism only; linear anabolism only","Branched catabolism only; cyclic anabolism only","Converging catabolism; diverging anabolism","Diverging catabolism; converging anabolism"],"answer":2,"explanation":"The figure explicitly labels catabolism as converging and anabolism as diverging."},{"id":"s10","kind":"mcq","topics":["Bioenergetics"],"page":6,"q":"Why are separate enzyme sets commonly used for opposing anabolic and catabolic pathways?","options":["To prevent futile cycling and energy waste","To force both pathways to run simultaneously","To eliminate all pathway regulation","To make every pathway linear"],"answer":0,"explanation":"Different enzymes permit reciprocal control and prevent energy-wasting simultaneous forward and reverse flux."},{"id":"s11","kind":"mcq","topics":["Bioenergetics"],"page":6,"q":"A pathway that converts several starting materials into one common product is best described as:","options":["Divergent","Convergent","Cyclic only","Unregulated"],"answer":1,"explanation":"Convergent pathways funnel multiple inputs toward fewer common products, a typical catabolic pattern."},{"id":"s12","kind":"mcq","topics":["Bioenergetics"],"page":7,"q":"Which paired pathways are given as the compartmentation example?","options":["Protein synthesis in mitochondria; protein degradation in Golgi","Fatty-acid synthesis in cytosol; fatty-acid degradation in mitochondria","Fatty-acid synthesis in mitochondria; fatty-acid degradation in cytosol","Glycolysis in nucleus; gluconeogenesis in lysosome"],"answer":1,"explanation":"The slide uses cytosolic fatty-acid synthesis and mitochondrial fatty-acid degradation."},{"id":"s13","kind":"mcq","topics":["Bioenergetics"],"page":7,"q":"Which compartment pairing is used to illustrate separation of opposing pathways?","options":["Fatty-acid synthesis in cytosol; degradation in mitochondria","Fatty-acid synthesis in nucleus; degradation in Golgi","Fatty-acid synthesis in mitochondria; degradation in cytosol","Fatty-acid synthesis in lysosome; degradation in nucleus"],"answer":0,"explanation":"The slide separates cytosolic fatty-acid synthesis from mitochondrial fatty-acid degradation."},{"id":"s14","kind":"mcq","topics":["Bioenergetics"],"page":8,"q":"On the Michaelis–Menten graph, the x-coordinate corresponding to ½Vmax is:","options":["KM","Vmax","kcat","ΔG"],"answer":0,"explanation":"KM is the substrate concentration at which v = ½Vmax."},{"id":"s15","kind":"mcq","topics":["Bioenergetics"],"page":8,"q":"What causes the Michaelis–Menten curve to approach Vmax at high substrate concentration?","options":["The enzyme becomes saturated with substrate","The substrate concentration falls to zero","The enzyme concentration becomes infinite","The reaction reaches ΔG = 0"],"answer":0,"explanation":"At high substrate concentration, available enzyme active sites are occupied, so the rate approaches its maximum."},{"id":"s16","kind":"mcq","topics":["Bioenergetics"],"page":9,"q":"Which mechanism changes enzyme abundance in response to an external signal such as a hormone or growth factor?","options":["Substrate availability","Competitive inhibition","Product diffusion","Hormonal regulation"],"answer":3,"explanation":"The slide says hormonal regulation alters the synthesis or degradation rate of an enzyme."},{"id":"s17","kind":"mcq","topics":["Bioenergetics"],"page":9,"q":"Which regulatory mechanism changes enzyme activity through binding at a site distinct from the catalytic site?","options":["Substrate depletion","Allosteric regulation","Hormonal control of enzyme synthesis","Product diffusion"],"answer":1,"explanation":"Allosteric regulators bind an enzyme and alter its activity without acting as the substrate at the catalytic site."},{"id":"s18","kind":"mcq","topics":["Bioenergetics"],"page":10,"q":"Which sign-description pairing is correct?","options":["ΔS > 0: products less disordered","ΔG < 0: endergonic","ΔH < 0: exothermic","ΔH < 0: endothermic"],"answer":2,"explanation":"Negative ΔH denotes heat release and therefore an exothermic reaction."},{"id":"s19","kind":"mcq","topics":["Bioenergetics"],"page":10,"q":"Which sign indicates that products are more disordered than reactants?","options":["ΔS < 0","ΔS > 0","ΔH < 0","ΔG = 0"],"answer":1,"explanation":"A positive entropy change means disorder is greater in the products."},{"id":"s20","kind":"mcq","topics":["Bioenergetics"],"page":10,"q":"Which thermodynamic quantity most directly predicts whether a reaction is energetically favorable under stated conditions?","options":["ΔG","ΔH alone","ΔS alone","Vmax"],"answer":0,"explanation":"Free-energy change, ΔG, combines enthalpy and entropy effects and predicts energetic favorability."},{"id":"s21","kind":"mcq","topics":["Bioenergetics"],"page":11,"q":"According to ΔG = ΔH − TΔS, which combination most strongly favors a negative ΔG?","options":["ΔH zero and ΔS negative","ΔH negative and ΔS positive","ΔH positive and ΔS negative","ΔH positive and ΔS zero"],"answer":1,"explanation":"Heat release and increased entropy both make ΔG more negative."},{"id":"s22","kind":"mcq","topics":["Bioenergetics"],"page":11,"q":"At a fixed positive temperature, what is the effect of increasing a positive ΔS in ΔG = ΔH − TΔS?","options":["It makes ΔG more positive","It makes ΔG more negative","It makes ΔH positive","It removes temperature dependence"],"answer":1,"explanation":"A larger positive TΔS term is subtracted from ΔH, lowering ΔG."},{"id":"s23","kind":"mcq","topics":["Bioenergetics"],"page":12,"q":"What distinguishes the biochemical standard transformed state used for ΔG′°?","options":["pH 7 with [H₂O] treated as 55.5 M","pH 0 with [H₂O] treated as 1 M","pH 14 with [H₂O] omitted","pH 7 with every solute fixed at 55.5 M"],"answer":0,"explanation":"The slide specifies [H⁺] = 10⁻⁷ M and water at 55.5 M."},{"id":"s24","kind":"mcq","topics":["Bioenergetics"],"page":12,"q":"For aA + bB ⇌ cC + dD, which expression is the equilibrium constant?","options":["[A]^a[B]^b/[C]^c[D]^d","[C]^c[D]^d/[A]^a[B]^b","[A+B]/[C+D]","[C][D]/[A+B]"],"answer":1,"explanation":"Product concentrations are placed over reactant concentrations, with stoichiometric coefficients used as exponents."},{"id":"s25","kind":"mcq","topics":["Bioenergetics"],"page":12,"q":"What hydrogen-ion concentration defines pH 7 in the biochemical standard state?","options":["10^−14 M","10^−7 M","1 M","55.5 M"],"answer":1,"explanation":"The biochemical standard state fixes [H+] at 10^−7 M, corresponding to pH 7."},{"id":"s26","kind":"mcq","topics":["Bioenergetics"],"page":13,"q":"In the exergonic energy profile, how are product and reactant free energies related?","options":["Products are higher; ΔG < 0","Products are lower; ΔG > 0","Products are equal; ΔG > 0","Products are lower; ΔG < 0"],"answer":3,"explanation":"The profile ends below the reactant level, giving negative ΔG."},{"id":"s27","kind":"mcq","topics":["Bioenergetics"],"page":13,"q":"What does the activation-energy peak in an exergonic reaction profile show?","options":["Exergonic reactions have no energy barrier","Reactants must first cross an energy barrier despite negative ΔG","Products always contain more free energy","Negative ΔG determines reaction speed"],"answer":1,"explanation":"A reaction can be thermodynamically favorable yet still require activation energy, so exergonic does not mean instantaneous."},{"id":"s28","kind":"mcq","topics":["Bioenergetics"],"page":14,"q":"Which statement identifies an endergonic reaction on the slide?","options":["It has ΔG < 0 and lower-energy products","It proceeds without coupling or energy input","It is non-spontaneous and requires free-energy input","It is spontaneous and releases free energy"],"answer":2,"explanation":"Endergonic reactions have positive ΔG and require energy input."},{"id":"s29","kind":"mcq","topics":["Bioenergetics"],"page":14,"q":"If the forward direction of a reaction is endergonic, what is true of the reverse direction under the same conditions?","options":["It is also endergonic","It is exergonic","It has no free-energy change","It cannot occur"],"answer":1,"explanation":"Reversing a reaction reverses the sign of ΔG, making the reverse of an endergonic reaction exergonic."},{"id":"s30","kind":"mcq","topics":["Bioenergetics"],"page":15,"q":"Starting with all components at 1 M, what is predicted when K′eq < 1?","options":["ΔG′° is negative and the reaction proceeds in reverse","ΔG′° is positive and the reaction proceeds in reverse","ΔG′° is negative and the reaction proceeds forward","ΔG′° is zero and the system is at equilibrium"],"answer":1,"explanation":"The table pairs K′eq below 1 with positive ΔG′° and reverse direction."},{"id":"s31","kind":"mcq","topics":["Bioenergetics"],"page":15,"q":"What standard transformed free-energy change corresponds to K′eq = 1?","options":["A large negative value","A large positive value","Zero","−RT"],"answer":2,"explanation":"Because ln 1 = 0, ΔG°′ = −RT ln K′eq equals zero."},{"id":"s32","kind":"mcq","topics":["Bioenergetics"],"page":15,"q":"Which K′eq value indicates that products are favored under standard biochemical conditions?","options":["K′eq > 1","K′eq = 0","K′eq < 1","K′eq must be negative"],"answer":0,"explanation":"A K′eq greater than 1 gives a negative ΔG°′ and favors products."},{"id":"s33","kind":"mcq","topics":["Bioenergetics"],"page":16,"q":"What ΔG′° value does the table associate with K′eq = 10³?","options":["−17.1 kJ/mol","−5.7 kJ/mol","+17.1 kJ/mol","+34.2 kJ/mol"],"answer":0,"explanation":"The 10³ row gives −17.1 kJ/mol (−4.1 kcal/mol)."},{"id":"s34","kind":"mcq","topics":["Bioenergetics"],"page":16,"q":"Approximately how much does ΔG°′ change at 25°C for each tenfold change in K′eq?","options":["0.57 kJ/mol","5.7 kJ/mol","17.1 kJ/mol","30.5 kJ/mol"],"answer":1,"explanation":"The table changes by about 5.7 kJ/mol for each factor-of-ten change in K′eq."},{"id":"s35","kind":"mcq","topics":["Bioenergetics"],"page":17,"q":"For A ⇌ B with K′eq = 12 at 298 K, the calculated ΔG′° is approximately:","options":["+6.16 kJ/mol","−30.5 kJ/mol","+12.0 kJ/mol","−6.16 kJ/mol"],"answer":3,"explanation":"Substitution into −RT ln K′eq gives about −6.16 kJ/mol."},{"id":"s36","kind":"mcq","topics":["Bioenergetics"],"page":17,"q":"For A ⇌ B with K′eq = 12, which side is favored under standard biochemical conditions?","options":["A, because ΔG°′ is positive","B, because ΔG°′ is negative","Neither, because ΔG°′ is zero","A, because K′eq is greater than 1"],"answer":1,"explanation":"K′eq greater than 1 gives negative ΔG°′, so the forward reaction toward B is favored."},{"id":"s37","kind":"mcq","topics":["Bioenergetics"],"page":18,"q":"For A + B ⇌ C + D, which expression is the reaction quotient used on the slide?","options":["[A][C]/[B][D]","[B][C]/[A][D]","[C][D]/[A][B]","[A][B]/[C][D]"],"answer":2,"explanation":"Products appear in the numerator and reactants in the denominator."},{"id":"s38","kind":"mcq","topics":["Bioenergetics"],"page":18,"q":"For A + B ⇌ C + D, what effect does increasing product concentrations have on actual ΔG?","options":["It lowers Q and makes ΔG more negative","It raises Q and makes ΔG more positive","It changes ΔG°′ itself","It forces ΔG to remain zero"],"answer":1,"explanation":"Increasing [C][D] raises the reaction quotient Q, increasing the RT ln Q contribution to ΔG."},{"id":"s39","kind":"mcq","topics":["Bioenergetics"],"page":19,"q":"Which glycolytic enzyme is shown producing NADH?","options":["Pyruvate kinase","Glyceraldehyde-3-phosphate dehydrogenase","Hexokinase","Phosphofructokinase"],"answer":1,"explanation":"NAD⁺ + Pi is converted to NADH + H⁺ at the glyceraldehyde-3-phosphate dehydrogenase step."},{"id":"s40","kind":"mcq","topics":["Bioenergetics"],"page":19,"q":"Which two enzymes catalyze the ATP-producing steps shown in glycolysis?","options":["Hexokinase and phosphofructokinase","Phosphoglycerate kinase and pyruvate kinase","Aldolase and enolase","Phosphoglucose isomerase and triose phosphate isomerase"],"answer":1,"explanation":"ATP is generated at the phosphoglycerate kinase and pyruvate kinase steps."},{"id":"s41","kind":"mcq","topics":["Bioenergetics"],"page":19,"q":"Which intermediate is directly converted to pyruvate in the final glycolytic step?","options":["3-Phosphoglycerate","1,3-Bisphosphoglycerate","Phosphoenolpyruvate","Glyceraldehyde 3-phosphate"],"answer":2,"explanation":"Pyruvate kinase transfers phosphate from phosphoenolpyruvate to ADP, producing pyruvate and ATP."},{"id":"s42","kind":"mcq","topics":["Bioenergetics"],"page":20,"q":"For successive reactions A→B and B→C, the overall standard free-energy change is:","options":["ΔG′°₁ + ΔG′°₂","ΔG′°₁ − ΔG′°₂","ΔG′°₁ × ΔG′°₂","ΔG′°₁ / ΔG′°₂"],"answer":0,"explanation":"Free-energy changes are additive when the reactions are summed."},{"id":"s43","kind":"mcq","topics":["Bioenergetics"],"page":21,"q":"What is the net ΔG′° after coupling glucose phosphorylation to ATP hydrolysis?","options":["+16.7 kJ/mol","−30.5 kJ/mol","+13.8 kJ/mol","−16.7 kJ/mol"],"answer":3,"explanation":"+13.8 plus −30.5 equals −16.7 kJ/mol."},{"id":"s44","kind":"mcq","topics":["Bioenergetics"],"page":21,"q":"What is the ΔG°′ of glucose phosphorylation before it is coupled to ATP hydrolysis?","options":["+13.8 kJ/mol","−13.8 kJ/mol","+30.5 kJ/mol","−16.7 kJ/mol"],"answer":0,"explanation":"The uncoupled phosphorylation of glucose is endergonic with ΔG°′ = +13.8 kJ/mol."},{"id":"s45","kind":"mcq","topics":["Bioenergetics"],"page":21,"q":"Which species cancels when glucose phosphorylation is added to ATP hydrolysis?","options":["ATP","ADP","Inorganic phosphate","Glucose 6-phosphate"],"answer":2,"explanation":"Pi is produced by ATP hydrolysis and consumed in the uncoupled phosphorylation equation, so it cancels in the summed reaction."},{"id":"s46","kind":"mcq","topics":["Bioenergetics"],"page":22,"q":"Which quantity is a reaction-specific physical constant calculable from K′eq?","options":["Reactant concentration","Product concentration","ΔG′°","ΔG"],"answer":2,"explanation":"The summary identifies standard transformed ΔG′° as the constant related to K′eq."},{"id":"s47","kind":"mcq","topics":["Bioenergetics"],"page":22,"q":"Which quantity varies with the current concentrations of reactants and products?","options":["ΔG","ΔG°′","The gas constant R","Absolute temperature units"],"answer":0,"explanation":"Actual ΔG contains the concentration-dependent RT ln Q term, whereas ΔG°′ is reaction-specific."},{"id":"s48","kind":"mcq","topics":["Bioenergetics"],"page":22,"q":"Which two tendencies are combined in the net driving force ΔG?","options":["Enthalpy and entropy","Pressure and volume only","Vmax and KM","Oxidation and hydrolysis only"],"answer":0,"explanation":"The summary describes ΔG as the net effect of the tendency toward stable bonding states and the tendency toward greater randomness."},{"id":"s49","kind":"mcq","topics":["Bioenergetics"],"page":23,"q":"What condition corresponds to equilibrium?","options":["ΔG′° must equal −30.5 kJ/mol","ΔG = 0","ΔG is large and negative","ΔG is large and positive"],"answer":1,"explanation":"The slide states that the system is at equilibrium when ΔG equals zero."},{"id":"s50","kind":"mcq","topics":["Bioenergetics"],"page":23,"q":"A large positive actual ΔG favors which direction?","options":["Forward","Reverse","Neither direction because the system is at equilibrium","Both directions irreversibly"],"answer":1,"explanation":"A large positive ΔG for the written reaction means the reverse direction is energetically favored."},{"id":"s51","kind":"mcq","topics":["Bioenergetics"],"page":23,"q":"What does path independence of ΔG mean?","options":["ΔG depends only on initial and final states","ΔG depends on the number of enzymes used","Every intermediate must have ΔG = 0","Only one pathway can connect two states"],"answer":0,"explanation":"The overall free-energy change is fixed by the initial and final states, regardless of the route taken."},{"id":"s52","kind":"mcq","topics":["Bioenergetics"],"page":24,"q":"What does the slide call the cellular ratio of ATP to ADP concentrations?","options":["Energy charge","Redox potential","Equilibrium constant","Phosphorylation index"],"answer":0,"explanation":"The ATP-to-ADP ratio is labeled the cell's energy charge."},{"id":"s53","kind":"mcq","topics":["Bioenergetics"],"page":24,"q":"What cellular response is promoted when ATP is low relative to ADP?","options":["ATP synthesis by oxidative phosphorylation","Permanent inhibition of ATP synthesis","Conversion of all ATP to AMP","Complete shutdown of catabolism"],"answer":0,"explanation":"A low ATP-to-ADP ratio signals low energy status and promotes ATP production."},{"id":"s54","kind":"mcq","topics":["Bioenergetics"],"page":25,"q":"Which pairing of cell type and free-energy source is correct?","options":["Photosynthetic cells—nutrient molecules only","Heterotrophic cells—absorbed solar radiation","Heterotrophic cells—atmospheric nitrogen","Photosynthetic cells—absorbed solar radiation"],"answer":3,"explanation":"Photosynthetic cells use solar radiation; heterotrophic cells use nutrient molecules."},{"id":"s55","kind":"mcq","topics":["Bioenergetics"],"page":25,"q":"After capturing free energy, cells commonly convert it into which usable forms?","options":["ATP and other energy-rich compounds","Heat and entropy only","Nitrogen gas and nitrate","DNA and RNA only"],"answer":0,"explanation":"Cells conserve captured free energy in ATP and other energy-rich compounds."},{"id":"s56","kind":"mcq","topics":["Bioenergetics"],"page":26,"q":"Which redox pair is specifically used on the slide to describe bioenergetic redox status?","options":["FAD / ATP + Pi","O₂ / CO₂ + H₂O","NAD⁺ / NADH + H⁺","ATP / AMP + PPi"],"answer":2,"explanation":"The slide names the ratio of NAD⁺ to NADH + H⁺."},{"id":"s57","kind":"mcq","topics":["Bioenergetics"],"page":26,"q":"Redox potential depends directly on the concentration ratio of:","options":["Reducing agent to oxidizing agent","ATP to total protein","Products to enzymes","Water to hydrogen ions only"],"answer":0,"explanation":"The slide's Nernst-style expression relates redox potential to the ratio of reducing and oxidizing forms."},{"id":"s58","kind":"mcq","topics":["Bioenergetics"],"page":27,"q":"What threshold does the slide use for a high-energy compound at pH 7.0?","options":["Oxidation liberates at least 70 kJ/mol","Hydrolysis liberates at least 7 Cal/mol","Hydrolysis liberates less than 7 Cal/mol","Synthesis absorbs exactly 7 J/mol"],"answer":1,"explanation":"The slide defines high-energy compounds using at least 7 Cal/mol on hydrolysis."},{"id":"s59","kind":"mcq","topics":["Bioenergetics"],"page":27,"q":"Which statement about the slide's high-energy compounds is correct?","options":["Every high-energy compound is a phosphate","No phosphate compound can be high energy","High-energy compounds are defined by a large energy release on hydrolysis","They release less energy than low-energy compounds"],"answer":2,"explanation":"The classification is based on the magnitude of free energy released during hydrolysis; high-energy examples need not all be phosphates."},{"id":"s60","kind":"mcq","topics":["Bioenergetics"],"page":28,"q":"Which class–example pairing is shown in the table?","options":["Enol phosphate—phosphoenolpyruvate","Acyl phosphate—phosphocreatine","Thioester—1,3-bisphosphoglycerate","Guanidino phosphate—acetyl-CoA"],"answer":0,"explanation":"Phosphoenolpyruvate is the listed enol phosphate."},{"id":"s61","kind":"mcq","topics":["Bioenergetics"],"page":28,"q":"Which compound is listed as an acyl phosphate?","options":["1,3-Bisphosphoglycerate","Phosphoenolpyruvate","Acetyl-CoA","Phosphocreatine"],"answer":0,"explanation":"The table lists 1,3-bisphosphoglycerate among the acyl phosphates."},{"id":"s62","kind":"mcq","topics":["Bioenergetics"],"page":28,"q":"Which class includes acetyl-CoA and other acyl-CoA compounds?","options":["Pyrophosphates","Enol phosphates","Thioesters","Guanidino phosphates"],"answer":2,"explanation":"Acetyl-CoA and acyl-CoA are listed as thioester examples."},{"id":"s63","kind":"mcq","topics":["Bioenergetics"],"page":29,"q":"At which ribose carbon are ATP's three phosphate groups attached?","options":["1′ carbon","2′ carbon","3′ carbon","5′ carbon"],"answer":3,"explanation":"The slide places adenine at 1′ and the triphosphate group at 5′."},{"id":"s64","kind":"mcq","topics":["Bioenergetics"],"page":29,"q":"Which ATP cleavage products result when pyrophosphate is removed?","options":["ADP + Pi","AMP + PPi","Adenosine + three Pi","AMP + ADP"],"answer":1,"explanation":"Cleavage between the alpha and beta phosphates yields AMP and pyrophosphate."},{"id":"s65","kind":"mcq","topics":["Bioenergetics"],"page":29,"q":"Which components together form the nucleoside portion of ATP?","options":["Adenine and ribose","Ribose and three phosphates","Adenine and three phosphates","ADP and inorganic phosphate"],"answer":0,"explanation":"Adenosine consists of the nitrogenous base adenine attached to ribose."},{"id":"s66","kind":"mcq","topics":["Bioenergetics"],"page":30,"q":"What is ATP hydrolysis ΔG′° under standard conditions on the slide?","options":["−16.7 kJ/mol","+30.5 kJ/mol","−30.5 kJ/mol","−51.8 kJ/mol"],"answer":2,"explanation":"The standard transformed value shown is −30.5 kJ/mol."},{"id":"s67","kind":"mcq","topics":["Bioenergetics"],"page":30,"q":"Why can actual ATP-hydrolysis ΔG in a cell differ substantially from −30.5 kJ/mol?","options":["Cellular ATP, ADP, and Pi are not all at 1 M","The standard value contains no ATP","Living cells do not contain water","ΔG is independent of concentration"],"answer":0,"explanation":"Actual ΔG includes the cellular reaction quotient, and cellular metabolite concentrations differ from standard-state concentrations."},{"id":"s68","kind":"mcq","topics":["Bioenergetics"],"page":30,"q":"The metabolite concentrations in the displayed cellular table are primarily in which range?","options":["Millimolar","Exactly 1 molar","Kilomolar","Zero concentration"],"answer":0,"explanation":"The table reports cellular ATP-related metabolites at millimolar concentrations, far below the 1 M standard state."},{"id":"s69","kind":"mcq","topics":["Bioenergetics"],"page":31,"q":"For most ATP-dependent phosphoryl-transfer enzymes, what is the true substrate?","options":["Free AMP²⁻","MgATP²⁻","Free ATP⁴⁻","MgADP⁻"],"answer":1,"explanation":"The slide explicitly identifies MgATP²⁻ as the true substrate."},{"id":"s70","kind":"mcq","topics":["Bioenergetics"],"page":31,"q":"Which free-energy value is most relevant for an enzyme using ATP as a phosphoryl-group donor in the cytosol?","options":["Hydrolysis of free ATP4− only","Hydrolysis of MgATP2−","Hydrolysis of free AMP","Oxidation of MgADP−"],"answer":1,"explanation":"Because Mg2+ complexes ATP and MgATP2− is the true substrate, its hydrolysis free energy is the relevant value."},{"id":"s71","kind":"mcq","topics":["Bioenergetics"],"page":32,"q":"Using human erythrocyte concentrations, what actual ΔG of ATP hydrolysis is calculated?","options":["−51.8 kJ/mol","−30.5 kJ/mol","−21.3 kJ/mol","+51.8 kJ/mol"],"answer":0,"explanation":"The calculation ends at −51,820 J/mol, or −51.8 kJ/mol."},{"id":"s72","kind":"mcq","topics":["Bioenergetics"],"page":32,"q":"Which ratio appears in the concentration-dependent term for ATP hydrolysis?","options":["[ATP]/[ADP][Pi]","[ADP][Pi]/[ATP]","[ATP][ADP]/[Pi]","[Pi]/[ATP][ADP]"],"answer":1,"explanation":"For ATP + H2O → ADP + Pi, the reaction quotient is [ADP][Pi]/[ATP]."},{"id":"s73","kind":"mcq","topics":["Bioenergetics"],"page":33,"q":"Which two glycolytic enzymes are shown consuming ATP?","options":["Phosphoglycerate kinase and pyruvate kinase","Enolase and triose phosphate isomerase","Aldolase and phosphoglucose isomerase","Hexokinase and phosphofructokinase"],"answer":3,"explanation":"ATP→ADP is marked at hexokinase and phosphofructokinase."},{"id":"s74","kind":"mcq","topics":["Bioenergetics"],"page":33,"q":"Which glycolytic enzyme forms ATP while converting 1,3-bisphosphoglycerate to 3-phosphoglycerate?","options":["Phosphoglycerate kinase","Pyruvate kinase","Hexokinase","Phosphofructokinase"],"answer":0,"explanation":"Phosphoglycerate kinase transfers a phosphate from 1,3-bisphosphoglycerate to ADP."},{"id":"s75","kind":"mcq","topics":["Bioenergetics"],"page":33,"q":"At which glycolytic step is NAD+ reduced to NADH?","options":["Glucose to glucose 6-phosphate","Fructose 6-phosphate to fructose 1,6-bisphosphate","Glyceraldehyde 3-phosphate to 1,3-bisphosphoglycerate","Phosphoenolpyruvate to pyruvate"],"answer":2,"explanation":"Glyceraldehyde-3-phosphate dehydrogenase oxidizes glyceraldehyde 3-phosphate while reducing NAD+."},{"id":"s76","kind":"mcq","topics":["Bioenergetics"],"page":34,"q":"Which hydrolysis product relationship explains PEP's large negative ΔG′°?","options":["PEP is reduced directly to lactate","Phosphate converts pyruvate to oxaloacetate","Enol pyruvate tautomerizes to keto pyruvate","Pyruvate polymerizes to glycogen"],"answer":2,"explanation":"The diagram shows hydrolysis followed by enol-to-keto tautomerization."},{"id":"s77","kind":"mcq","topics":["Bioenergetics"],"page":34,"q":"Hydrolysis of 1,3-bisphosphoglycerate produces which phosphorylated glycolytic intermediate?","options":["2-Phosphoglycerate","3-Phosphoglycerate","Phosphoenolpyruvate","Glucose 6-phosphate"],"answer":1,"explanation":"The hydrolysis diagram shows formation of 3-phosphoglycerate plus inorganic phosphate."},{"id":"s78","kind":"mcq","topics":["Bioenergetics"],"page":34,"q":"Which product-stabilizing mechanism is shown for phosphocreatine hydrolysis?","options":["Tautomerization of pyruvate","Resonance stabilization of creatine","Polymerization of creatine","Reduction of NAD+"],"answer":1,"explanation":"The creatine product is resonance stabilized, helping make phosphocreatine hydrolysis strongly favorable."},{"id":"s79","kind":"mcq","topics":["Bioenergetics"],"page":35,"q":"Which compound has the most negative ΔG′° of hydrolysis in the displayed table?","options":["ATP → ADP + Pi","Phosphoenolpyruvate","1,3-bisphosphoglycerate","Phosphocreatine"],"answer":1,"explanation":"PEP is listed at −61.9 kJ/mol, the most negative value shown."},{"id":"s80","kind":"mcq","topics":["Bioenergetics"],"page":35,"q":"What is the standard free energy of hydrolysis shown for acetyl-CoA?","options":["−13.8 kJ/mol","−30.5 kJ/mol","−31.4 kJ/mol","−61.9 kJ/mol"],"answer":2,"explanation":"The acetyl-CoA hydrolysis reaction is labeled ΔG°′ = −31.4 kJ/mol."},{"id":"s81","kind":"mcq","topics":["Bioenergetics"],"page":35,"q":"Which ATP cleavage has the more negative standard free energy in the displayed table?","options":["ATP → ADP + Pi","ATP → AMP + PPi","They are identical","Neither releases free energy"],"answer":1,"explanation":"The table lists −45.6 kJ/mol for ATP → AMP + PPi versus −30.5 kJ/mol for ATP → ADP + Pi."},{"id":"s82","kind":"mcq","topics":["Bioenergetics"],"page":36,"q":"What activated intermediate is formed before NH₃ attacks in glutamine synthesis?","options":["Enzyme-bound glutamyl phosphate","Enzyme-bound glutamyl adenylate","Free phosphocreatine","Free carbamoyl phosphate"],"answer":0,"explanation":"ATP first phosphorylates glutamate to enzyme-bound glutamyl phosphate."},{"id":"s83","kind":"mcq","topics":["Bioenergetics"],"page":36,"q":"After ATP activates glutamate in glutamine synthesis, which molecule attacks the enzyme-bound intermediate?","options":["NH3","CO2","NADH","O2"],"answer":0,"explanation":"Ammonia attacks enzyme-bound glutamyl phosphate, displacing phosphate and forming glutamine."},{"id":"s84","kind":"mcq","topics":["Bioenergetics"],"page":36,"q":"Which group of proteins is explicitly associated with ATP-dependent cycling during DNA-related processes?","options":["Helicases, RecA, and some topoisomerases","Hemoglobin, collagen, and keratin","Actin, tubulin, and insulin only","Luciferin, luciferase, and oxyluciferin"],"answer":0,"explanation":"The slide lists helicases, RecA, some topoisomerases, and replication ATPases as ATP-dependent examples."},{"id":"s85","kind":"mcq","topics":["Bioenergetics"],"page":37,"q":"Which compound lies below ATP in phosphoryl-transfer potential on the graph?","options":["Phosphoenolpyruvate","1,3-bisphosphoglycerate","Phosphocreatine","Glucose 6-phosphate"],"answer":3,"explanation":"Glucose 6-phosphate has a less negative hydrolysis ΔG′° than ATP."},{"id":"s86","kind":"mcq","topics":["Bioenergetics"],"page":37,"q":"Which compound shown can transfer phosphate to ADP because it lies above ATP in phosphoryl-transfer potential?","options":["Glucose 6-phosphate","Glycerol phosphate","Phosphocreatine","Inorganic phosphate"],"answer":2,"explanation":"Phosphocreatine has a more negative hydrolysis ΔG°′ than ATP and can donate phosphate to ADP."},{"id":"s87","kind":"mcq","topics":["Bioenergetics"],"page":37,"q":"Why is ATP well positioned as an energy currency in the ranking diagram?","options":["It has the highest transfer potential of every compound","It can accept phosphate from compounds above it and donate to compounds below it","It cannot participate in group transfer","Its hydrolysis has ΔG°′ = 0"],"answer":1,"explanation":"ATP's intermediate transfer potential allows it to receive phosphoryl groups from stronger donors and give them to weaker acceptors."},{"id":"s88","kind":"mcq","topics":["Bioenergetics"],"page":38,"q":"Nucleophilic attack at ATP's α phosphate produces which transfer?","options":["Pyrophosphoryl transfer with AMP release","Phosphoryl transfer with AMP release","Adenylyl transfer with PPi release","Phosphoryl transfer with ADP release"],"answer":2,"explanation":"The α position gives adenylyl transfer and PPi as the leaving group."},{"id":"s89","kind":"mcq","topics":["Bioenergetics"],"page":38,"q":"Nucleophilic attack at ATP's gamma phosphate leaves which nucleotide product?","options":["AMP","ADP","Adenosine","cAMP"],"answer":1,"explanation":"Gamma-phosphate attack transfers a phosphoryl group and leaves ADP."},{"id":"s90","kind":"mcq","topics":["Bioenergetics"],"page":38,"q":"Which attack-transfer-product combination is correct?","options":["Beta attack—pyrophosphoryl transfer—AMP remains","Beta attack—adenylyl transfer—ADP remains","Gamma attack—adenylyl transfer—PPi remains","Alpha attack—phosphoryl transfer—AMP remains"],"answer":0,"explanation":"Attack at beta transfers the beta-gamma pyrophosphoryl group and leaves AMP."},{"id":"s91","kind":"mcq","topics":["Bioenergetics"],"page":39,"q":"Which ATP cleavage activates luciferin to luciferyl adenylate?","options":["ATP → ADP + PPi","ATP → AMP + PPi","ATP → ADP + Pi","ATP → adenosine + triphosphate"],"answer":1,"explanation":"The slide states that pyrophosphate cleavage forms luciferyl adenylate."},{"id":"s92","kind":"mcq","topics":["Bioenergetics"],"page":39,"q":"Which molecule is the enzyme in the firefly light-producing system?","options":["Luciferin","Luciferase","Luciferyl adenylate","Oxyluciferin"],"answer":1,"explanation":"Luciferase catalyzes activation and oxidation steps involving the substrate luciferin."},{"id":"s93","kind":"mcq","topics":["Bioenergetics"],"page":40,"q":"Which products accompany light emission during luciferin oxidation in the cycle?","options":["Oxyluciferin, CO₂, and AMP","Luciferyl adenylate, PPi, and ATP","Luciferin, O₂, and ADP","Oxyluciferin, Pi, and NADH"],"answer":0,"explanation":"The figure shows formation of oxyluciferin with CO₂ and AMP release while light is emitted."},{"id":"s94","kind":"mcq","topics":["Bioenergetics"],"page":40,"q":"Which factor is proposed to account for differences in flash color among firefly species?","options":["Differences in luciferase structure","Differences in ATP's phosphate number","Absence of molecular oxygen","Replacement of luciferin by glucose"],"answer":0,"explanation":"The slide attributes species-specific light color to structural differences in luciferase."},{"id":"s95","kind":"mcq","topics":["Bioenergetics"],"page":40,"q":"What happens to oxyluciferin after the light-producing reaction?","options":["It is permanently discarded","It is regenerated to luciferin through subsequent reactions","It directly becomes ATP","It is converted into molecular oxygen"],"answer":1,"explanation":"The cycle includes regenerating reactions that return oxyluciferin to luciferin."},{"id":"s96","kind":"mcq","topics":["Gene Expression and Regulation"],"page":42,"q":"Which prokaryotic example is specifically listed under regulation of gene expression?","options":["Michaelis–Menten system","Nitrogen cycle","Lac operon","TCA cycle"],"answer":2,"explanation":"The contents list operons and specifically the lac operon."},{"id":"s97","kind":"mcq","topics":["Gene Expression and Regulation"],"page":43,"q":"In the diagram, which nesting order runs from largest structure to DNA segment?","options":["Gene → DNA → chromosome → nucleus → cell","Cell → nucleus → chromosome → DNA → gene","Cell → chromosome → nucleus → gene → DNA","Nucleus → cell → DNA → chromosome → gene"],"answer":1,"explanation":"The illustration nests the gene within DNA, DNA within a chromosome, chromosome in the nucleus, and nucleus in the cell."},{"id":"s98","kind":"mcq","topics":["Gene Expression and Regulation"],"page":43,"q":"Which statement best describes a gene in the slide's structural diagram?","options":["A segment of DNA within a chromosome","An entire cell surrounding the nucleus","A protein located outside DNA","A complete chromosome pair only"],"answer":0,"explanation":"The diagram marks a gene as a defined segment of the DNA molecule packaged in a chromosome."},{"id":"s99","kind":"mcq","topics":["Gene Expression and Regulation"],"page":44,"q":"Which information transfer is stated to be impossible?","options":["Protein → nucleic acid","DNA → RNA","RNA → protein","RNA → DNA"],"answer":0,"explanation":"The slide permits nucleic-acid transfers and nucleic acid to protein, but not protein back to nucleic acid."},{"id":"s100","kind":"mcq","topics":["Gene Expression and Regulation"],"page":44,"q":"Which process transfers residue-by-residue information from DNA to RNA?","options":["Replication","Transcription","Translation","Protein folding"],"answer":1,"explanation":"Transcription copies genetic information from DNA into RNA."},{"id":"s101","kind":"mcq","topics":["Gene Expression and Regulation"],"page":44,"q":"Which information transfer is represented by reverse transcription?","options":["DNA to RNA","RNA to DNA","RNA to protein","Protein to RNA"],"answer":1,"explanation":"Reverse transcription uses RNA information to synthesize DNA."},{"id":"s102","kind":"mcq","topics":["Gene Expression and Regulation"],"page":45,"q":"Which description defines semiconservative DNA replication?","options":["One daughter duplex contains both old strands and the other both new strands","Both daughter duplexes contain only newly synthesized strands","Parental DNA remains intact while an unrelated duplex is synthesized","Each daughter duplex contains one old strand and one new strand"],"answer":3,"explanation":"Semiconservative replication preserves one parental strand in each daughter molecule."},{"id":"s103","kind":"mcq","topics":["Gene Expression and Regulation"],"page":45,"q":"During which cell-cycle phase does DNA replication occur?","options":["G1 phase","S phase","G2 phase","M phase only"],"answer":1,"explanation":"The slide states that DNA duplication occurs during S phase."},{"id":"s104","kind":"mcq","topics":["Gene Expression and Regulation"],"page":46,"q":"Which replication-fork pairing is correct?","options":["Leading strand—3′→5′ synthesis; lagging strand—5′→3′ synthesis","Leading strand—requires no primer; lagging strand—requires no primer","Leading strand—continuous; lagging strand—Okazaki fragments","Leading strand—Okazaki fragments; lagging strand—continuous"],"answer":2,"explanation":"The diagram labels continuous leading synthesis and discontinuous lagging synthesis as Okazaki fragments."},{"id":"s105","kind":"mcq","topics":["Gene Expression and Regulation"],"page":46,"q":"Which protein acts ahead of helicase to relieve torsional strain in the parental DNA?","options":["Topoisomerase","Single-strand binding protein","DNA ligase","RNA polymerase"],"answer":0,"explanation":"The diagram places topoisomerase ahead of helicase on the still-double-stranded DNA."},{"id":"s106","kind":"mcq","topics":["Gene Expression and Regulation"],"page":46,"q":"What is the role of single-strand binding proteins at the replication fork?","options":["They synthesize RNA primers","They stabilize the separated parental strands","They join Okazaki fragments","They unwind DNA ahead of the fork"],"answer":1,"explanation":"SSB proteins coat and stabilize exposed single-stranded DNA after helicase separates the strands."},{"id":"s107","kind":"mcq","topics":["Gene Expression and Regulation"],"page":48,"q":"What is the sequence of transcription stages listed on the slide?","options":["Initiation → promoter escape → elongation → termination","Promoter escape → initiation → termination → elongation","Elongation → initiation → promoter escape → termination","Initiation → elongation → promoter escape → termination"],"answer":0,"explanation":"The slide numbers those four stages in that order."},{"id":"s108","kind":"mcq","topics":["Gene Expression and Regulation"],"page":48,"q":"Where does transcription occur in eukaryotic cells according to the slide?","options":["Cytoplasm","Nucleus","Golgi apparatus","Lysosome"],"answer":1,"explanation":"The slide contrasts prokaryotic transcription in the cytoplasm with eukaryotic transcription in the nucleus."},{"id":"s109","kind":"mcq","topics":["Gene Expression and Regulation"],"page":48,"q":"What event defines promoter escape during transcription?","options":["RNA polymerase leaves the promoter and enters productive elongation","The completed RNA is released","Introns are removed from pre-mRNA","DNA replication begins at an origin"],"answer":0,"explanation":"Promoter escape is the transition after initiation in which RNA polymerase clears the promoter and proceeds into elongation."},{"id":"s110","kind":"mcq","topics":["Gene Expression and Regulation"],"page":49,"q":"How does mRNA sequence compare with the coding (sense) strand?","options":["It is complementary and uses T instead of U","It is identical including T","It is unrelated because RNA polymerase reads the coding strand","It is the same except U replaces T"],"answer":3,"explanation":"mRNA is complementary to the template strand and matches the coding strand except U replaces T."},{"id":"s111","kind":"mcq","topics":["Gene Expression and Regulation"],"page":49,"q":"Which DNA strand is directly read by RNA polymerase during transcription?","options":["Coding or sense strand","Template or antisense strand","Both strands simultaneously","Neither DNA strand"],"answer":1,"explanation":"RNA polymerase uses the template, noncoding, or antisense strand to synthesize complementary RNA."},{"id":"s112","kind":"mcq","topics":["Gene Expression and Regulation"],"page":49,"q":"If the coding DNA strand contains 5′-ATGC-3′, what is the corresponding mRNA sequence?","options":["5′-ATGC-3′","5′-UACG-3′","5′-AUGC-3′","5′-TACG-3′"],"answer":2,"explanation":"The mRNA matches the coding strand in the 5′→3′ direction except that U replaces T."},{"id":"s113","kind":"mcq","topics":["Gene Expression and Regulation"],"page":50,"q":"Which sequences are removed when eukaryotic pre-mRNA becomes mature mRNA?","options":["The 5′ cap","The poly(A) tail","Introns","Exons"],"answer":2,"explanation":"RNA splicing removes non-coding introns and joins exons."},{"id":"s114","kind":"mcq","topics":["Gene Expression and Regulation"],"page":50,"q":"Which features remain at the ends of the mature mRNA shown after splicing?","options":["5′ cap and poly(A) tail","Two introns","Promoter and terminator DNA","RNA primers and Okazaki fragments"],"answer":0,"explanation":"The mature mRNA diagram retains the 5′ cap and 3′ poly(A) tail while introns are removed."},{"id":"s115","kind":"mcq","topics":["Gene Expression and Regulation"],"page":50,"q":"Which region of the processed mRNA is formed by joining the retained coding segments?","options":["The intron-only region","The exon-derived protein-coding sequence","The promoter","The replication origin"],"answer":1,"explanation":"Splicing removes introns and joins exons, producing the continuous protein-coding sequence in mature mRNA."},{"id":"s116","kind":"mcq","topics":["Gene Expression and Regulation"],"page":52,"q":"A ribosome is moving toward the 3′ end of an mRNA. Where is the next amino acid added?","options":["To the protein's N-terminus","To the protein's C-terminus","To the mRNA's 5′ end","To the mRNA's 3′ end"],"answer":1,"explanation":"Translation reads mRNA 5′→3′ while extending the polypeptide at its C-terminal end."},{"id":"s117","kind":"mcq","topics":["Gene Expression and Regulation"],"page":53,"q":"Which pairing correctly separates template, adaptor, and synthesis site?","options":["mRNA—adaptor; tRNA—template; ribosome—site","mRNA—template; tRNA—adaptor; ribosome—site","mRNA—site; tRNA—template; ribosome—adaptor","mRNA—template; tRNA—site; ribosome—adaptor"],"answer":1,"explanation":"mRNA carries codons, tRNA links codons to amino acids, and the ribosome catalyzes peptide synthesis."},{"id":"s118","kind":"mcq","topics":["Gene Expression and Regulation"],"page":54,"q":"A newly transcribed eukaryotic RNA is not yet ready for cytosolic translation. Which event must occur next in the slide's sequence?","options":["Golgi transport","RNA processing","Protein folding","DNA replication"],"answer":1,"explanation":"RNA processing produces mature mRNA before translation."},{"id":"s119","kind":"mcq","topics":["Gene Expression and Regulation"],"page":54,"q":"Which event belongs to protein maturation after translation rather than RNA processing?","options":["Chaperone-assisted folding","Addition of a 5′ cap","Removal of introns","Poly(A) tail addition"],"answer":0,"explanation":"Chaperones assist the newly synthesized polypeptide in acquiring its three-dimensional structure."},{"id":"s120","kind":"mcq","topics":["Gene Expression and Regulation"],"page":55,"q":"The slide contrasts bacterial and eukaryotic regulation. Which statement matches it?","options":["Bacteria regulate mainly at translation termination","Bacteria regulate mainly at transcription; eukaryotes use additional levels","Eukaryotes regulate only at transcription initiation","Neither cell type regulates metabolic genes"],"answer":1,"explanation":"Bacterial control is mainly transcriptional, while eukaryotic control is multilayered."},{"id":"s121","kind":"mcq","topics":["Gene Expression and Regulation"],"page":56,"q":"Which feature most directly permits bacterial transcription and translation to occur simultaneously?","options":["Presence of introns","Absence of nuclear compartmentalization","Use of several RNA polymerases","Presence of a Golgi apparatus"],"answer":1,"explanation":"Without a nucleus, ribosomes can engage an mRNA while it is being transcribed."},{"id":"s122","kind":"mcq","topics":["Gene Expression and Regulation"],"page":56,"q":"Which regulatory level is specifically associated with movement of a eukaryotic transcript between compartments?","options":["Transcription initiation","RNA transport from nucleus to cytosol","Ribosome assembly","DNA replication"],"answer":1,"explanation":"Eukaryotic gene expression can be regulated during transport of processed RNA from the nucleus to the cytosol."},{"id":"s123","kind":"mcq","topics":["Gene Expression and Regulation"],"page":57,"q":"A DNA-bound regulator lowers transcription of its target gene. In the slide's terminology it is a:","options":["Positive activator","Negative repressor","Positive inducer","Constitutive marker"],"answer":1,"explanation":"A repressor or inhibitor mediates negative regulation."},{"id":"s124","kind":"mcq","topics":["Gene Expression and Regulation"],"page":58,"q":"Which arrangement is diagnostic of the prokaryotic operon shown?","options":["Several genes, each with an independent promoter","A gene cluster controlled by one promoter and operator","One gene controlled by several origins of replication","A eukaryotic exon cluster under one enhancer"],"answer":1,"explanation":"An operon is a gene cluster transcribed from shared regulatory DNA."},{"id":"s125","kind":"mcq","topics":["Gene Expression and Regulation"],"page":58,"q":"Which feature allows several prokaryotic genes in one operon to be transcribed together?","options":["Each gene has a separate enhancer","Each gene is on a different chromosome","The gene cluster is controlled by one promoter","The genes use separate RNA polymerases"],"answer":2,"explanation":"An operon is a cluster of functionally related genes controlled by a single promoter and transcribed as one unit."},{"id":"s126","kind":"mcq","topics":["Gene Expression and Regulation"],"page":59,"q":"Why is lac-operon expression normally favored only after glucose becomes unavailable?","options":["Lactose cannot enter cells containing glucose","Glucose is the preferred carbon source","Glucose directly destroys lacZ mRNA","Lactose represses CAP"],"answer":1,"explanation":"The system prioritizes glucose and switches strongly to lactose use when glucose is scarce."},{"id":"s127","kind":"mcq","topics":["Gene Expression and Regulation"],"page":60,"q":"In the diagram, which sequence correctly describes lactose utilization?","options":["LacZ imports lactose; LacY cleaves it","LacY imports lactose; LacZ cleaves it","LacA imports lactose; CAP cleaves it","CAP imports lactose; LacA cleaves it"],"answer":1,"explanation":"LacY is permease; LacZ is β-galactosidase."},{"id":"s128","kind":"mcq","topics":["Gene Expression and Regulation"],"page":60,"q":"Which lac-operon product directly transports lactose across the bacterial membrane?","options":["β-galactosidase","Lac repressor","Transacetylase","Lactose permease"],"answer":3,"explanation":"LacY encodes lactose permease, the membrane protein that imports lactose."},{"id":"s129","kind":"mcq","topics":["Gene Expression and Regulation"],"page":61,"q":"Which two indirect signals are correctly matched to their sensors?","options":["Allolactose—CAP; cAMP—lac repressor","Allolactose—lac repressor; cAMP—CAP","Glucose—lac repressor; lactose—CAP","cAMP—operator; allolactose—promoter"],"answer":1,"explanation":"Allolactose relieves repression, while cAMP activates CAP under low glucose."},{"id":"s130","kind":"mcq","topics":["Gene Expression and Regulation"],"page":61,"q":"Which molecule is the indirect signal through which the lac repressor detects lactose availability?","options":["Allolactose","cAMP","Glucose","ATP"],"answer":0,"explanation":"Allolactose binds the lac repressor and signals that lactose is available."},{"id":"s131","kind":"mcq","topics":["Gene Expression and Regulation"],"page":61,"q":"Which regulator–signal relationship is correct in the lac operon?","options":["CAP–allolactose","CAP–cAMP","Repressor–cAMP","RNA polymerase–allolactose"],"answer":1,"explanation":"CAP senses low glucose indirectly through cAMP, whereas the repressor senses lactose through allolactose."},{"id":"s132","kind":"mcq","topics":["Gene Expression and Regulation"],"page":62,"q":"Which complete lac-gene mapping is correct?","options":["lacZ—permease; lacY—transacetylase; lacA—β-galactosidase","lacZ—β-galactosidase; lacY—permease; lacA—transacetylase","lacZ—repressor; lacY—CAP; lacA—polymerase","lacZ—transacetylase; lacY—β-galactosidase; lacA—permease"],"answer":1,"explanation":"The three structural genes encode β-galactosidase, permease, and transacetylase respectively."},{"id":"s133","kind":"mcq","topics":["Gene Expression and Regulation"],"page":62,"q":"Which lac gene–product pairing is correct?","options":["lacZ–lactose permease","lacY–β-galactosidase","lacA–transacetylase","lacA–lac repressor"],"answer":2,"explanation":"lacA encodes transacetylase; lacZ encodes β-galactosidase and lacY encodes lactose permease."},{"id":"s134","kind":"mcq","topics":["Gene Expression and Regulation"],"page":63,"q":"A mutation prevents repressor binding but leaves the CAP site intact. Which regulatory barrier is specifically lost?","options":["CAP-assisted recruitment","Operator-mediated blockage of RNA polymerase","cAMP production","Promoter recognition by RNA polymerase"],"answer":1,"explanation":"The operator-bound repressor is the negative roadblock."},{"id":"s135","kind":"mcq","topics":["Gene Expression and Regulation"],"page":63,"q":"Binding of CAP to its regulatory DNA site primarily promotes transcription by:","options":["Cleaving the operator","Converting lactose to allolactose","Destroying the lac repressor","Helping RNA polymerase bind the promoter"],"answer":3,"explanation":"DNA-bound CAP positively regulates the operon by improving RNA-polymerase recruitment to the promoter."},{"id":"s136","kind":"mcq","topics":["Gene Expression and Regulation"],"page":64,"q":"Which event directly changes the lac repressor so it no longer occupies the operator?","options":["CAP binds cAMP","Allolactose binds the repressor","Glucose binds RNA polymerase","Lactose binds the promoter"],"answer":1,"explanation":"Allolactose is the inducer that changes repressor conformation."},{"id":"s137","kind":"mcq","topics":["Gene Expression and Regulation"],"page":64,"q":"In the absence of lactose, which DNA element is occupied by the lac repressor?","options":["Operator","CAP site","lacZ coding region","Transcription terminator"],"answer":0,"explanation":"Without allolactose, the repressor binds the operator and obstructs transcription."},{"id":"s138","kind":"mcq","topics":["Gene Expression and Regulation"],"page":65,"q":"Which description makes the lac operon inducible?","options":["It is normally ON and tryptophan switches it OFF","It is normally OFF and an inducer switches it ON","It is permanently ON","It is activated directly by glucose"],"answer":1,"explanation":"An inducible operon has a default repressed state relieved by inducer."},{"id":"s139","kind":"mcq","topics":["Gene Expression and Regulation"],"page":66,"q":"Which statement about CAP production and action is correct?","options":["CAP is encoded within lacZ and made only with lactose","CAP is constitutively available but stimulates lac transcription after activation","CAP blocks the operator when glucose is low","CAP cleaves lactose into monosaccharides"],"answer":1,"explanation":"CAP is encoded elsewhere and is constitutively produced; activated CAP improves polymerase binding."},{"id":"s140","kind":"mcq","topics":["Gene Expression and Regulation"],"page":66,"q":"The gene encoding CAP is best described as:","options":["Part of the lac structural-gene cluster","Constitutively expressed elsewhere on the chromosome","Induced only by lactose","Located within the lac operator"],"answer":1,"explanation":"The CAP gene is separate from the lac operon and is constitutively expressed."},{"id":"s141","kind":"mcq","topics":["Gene Expression and Regulation"],"page":66,"q":"Why does RNA polymerase produce only a few lac transcripts when CAP assistance is absent but repression has been removed?","options":["lacZ inhibits transcription","The operator cleaves the mRNA","The promoter binds RNA polymerase weakly","cAMP degrades RNA polymerase"],"answer":2,"explanation":"RNA polymerase alone binds the lac promoter poorly, producing only basal or leaky transcription."},{"id":"s142","kind":"mcq","topics":["Gene Expression and Regulation"],"page":67,"q":"A cell has high glucose. Which CAP state is expected?","options":["High cAMP; CAP bound to DNA","Low cAMP; CAP unable to bind DNA","High allolactose; CAP on operator","Low allolactose; CAP on promoter"],"answer":1,"explanation":"Glucose and cAMP are inversely related; without cAMP, CAP is inactive."},{"id":"s143","kind":"mcq","topics":["Gene Expression and Regulation"],"page":67,"q":"What molecular event converts CAP into its DNA-binding form?","options":["Binding of lactose","Cleavage by β-galactosidase","Phosphorylation by LacY","Binding of cAMP"],"answer":3,"explanation":"When glucose is low, cAMP binds CAP and changes its conformation so that it can bind DNA."},{"id":"s144","kind":"mcq","topics":["Gene Expression and Regulation"],"page":68,"q":"Which molecular occupancy pattern produces maximal lac transcription?","options":["CAP absent, repressor present","CAP absent, repressor absent","CAP present, repressor present","CAP present, repressor absent"],"answer":3,"explanation":"Strong expression requires positive activation plus removal of the negative block."},{"id":"s145","kind":"mcq","topics":["Gene Expression and Regulation"],"page":68,"q":"Which condition supplies the positive-regulatory input required for strong lac-operon expression?","options":["Low glucose and high cAMP","High glucose and low cAMP","High glucose and high allolactose only","Low lactose and inactive CAP"],"answer":0,"explanation":"Low glucose raises cAMP, activating CAP and allowing it to bind DNA."},{"id":"s146","kind":"mcq","topics":["Gene Expression and Regulation"],"page":68,"q":"For strong lac transcription, allolactose and cAMP respectively cause:","options":["CAP release and repressor binding","Repressor release and CAP activation","Repressor activation and CAP degradation","RNA polymerase release and operator activation"],"answer":1,"explanation":"Allolactose removes the repressor, while cAMP activates CAP; both conditions are required for strong transcription."},{"id":"s147","kind":"mcq","topics":["Gene Expression and Regulation"],"page":69,"q":"Glucose and lactose are both present. Which combination explains the expected low-level lac transcription?","options":["CAP active; repressor bound","CAP inactive; repressor released","CAP active; repressor released","CAP inactive; repressor bound"],"answer":1,"explanation":"Lactose releases repressor, but glucose keeps cAMP low and CAP inactive."},{"id":"s148","kind":"mcq","topics":["Gene Expression and Regulation"],"page":69,"q":"When both glucose and lactose are present, which regulator is inactive because cAMP is low?","options":["Lac repressor","RNA polymerase","CAP","β-galactosidase"],"answer":2,"explanation":"Glucose keeps cAMP low, so CAP remains inactive even though lactose removes the repressor."},{"id":"s149","kind":"mcq","topics":["Gene Expression and Regulation"],"page":70,"q":"Glucose and lactose are both absent. CAP is DNA-bound, yet transcription remains off because:","options":["RNA polymerase lacks ATP","The repressor remains on the operator","lacZ degrades cAMP","The promoter is deleted"],"answer":1,"explanation":"No allolactose is present to remove the repressor."},{"id":"s150","kind":"mcq","topics":["Gene Expression and Regulation"],"page":70,"q":"When neither glucose nor lactose is present, which pair is simultaneously DNA-bound?","options":["Inactive CAP and free repressor","LacY and β-galactosidase","Allolactose and RNA polymerase","Active CAP and lac repressor"],"answer":3,"explanation":"Low glucose activates CAP, but absent lactose leaves the repressor bound to the operator."},{"id":"s151","kind":"mcq","topics":["Gene Expression and Regulation"],"page":71,"q":"Which input row corresponds to CAP bound, repressor unbound, and strong transcription?","options":["Glucose +, lactose −","Glucose +, lactose +","Glucose −, lactose −","Glucose −, lactose +"],"answer":3,"explanation":"Low glucose activates CAP; lactose removes the repressor."},{"id":"s152","kind":"mcq","topics":["Gene Expression and Regulation"],"page":71,"q":"Which condition gives low-level rather than strong lac-operon transcription?","options":["Glucose present, lactose present","Glucose absent, lactose present","Glucose absent, lactose absent","Glucose present, lactose absent"],"answer":0,"explanation":"With both sugars present, the repressor is removed but CAP is inactive, so only basal transcription occurs."},{"id":"s153","kind":"mcq","topics":["Gene Expression and Regulation"],"page":72,"q":"What is the direct output of transcribing and translating the trp structural genes shown?","options":["Lactose permeases","Enzymes for tryptophan biosynthesis","Tryptophan repressor only","cAMP-producing enzymes"],"answer":1,"explanation":"The clustered trp genes encode enzymes that synthesize tryptophan."},{"id":"s154","kind":"mcq","topics":["Gene Expression and Regulation"],"page":72,"q":"The structural genes of the trp operon encode proteins primarily required for:","options":["Lactose import","Tryptophan biosynthesis","Glucose phosphorylation","DNA replication"],"answer":1,"explanation":"The trp structural genes encode enzymes in the tryptophan-biosynthetic pathway."},{"id":"s155","kind":"mcq","topics":["Gene Expression and Regulation"],"page":73,"q":"When tryptophan is abundant, it switches the trp operon off by acting as a:","options":["CAP activator","Corepressor that activates repressor binding","Competitive RNA-polymerase inhibitor","DNA-cutting nuclease"],"answer":1,"explanation":"Tryptophan binds the inactive repressor, enabling operator binding."},{"id":"s156","kind":"mcq","topics":["Gene Expression and Regulation"],"page":73,"q":"In the presence of abundant tryptophan, the trp repressor becomes able to bind the operator because tryptophan acts as a:","options":["Substrate","Inducer","Co-repressor","Competitive inhibitor"],"answer":2,"explanation":"Tryptophan binds the inactive repressor as a co-repressor, activating operator binding."},{"id":"s157","kind":"mcq","topics":["Gene Expression and Regulation"],"page":74,"q":"Which paired default states are correct?","options":["lac ON; trp OFF","lac OFF; trp ON","lac ON; trp ON","lac OFF; trp OFF"],"answer":1,"explanation":"The inducible lac operon is usually OFF; the repressible trp operon is usually ON."},{"id":"s158","kind":"mcq","topics":["Gene Expression and Regulation"],"page":74,"q":"How do the newly synthesized repressors of the lac and trp operons differ?","options":["Both are initially active","Both are initially inactive","Lac repressor is inactive; trp repressor is active","Lac repressor is active; trp repressor is inactive"],"answer":3,"explanation":"The lac repressor is made active, whereas the trp repressor requires its co-repressor to become active."},{"id":"s159","kind":"mcq","topics":["Gene Expression and Regulation"],"page":74,"q":"Which example on the slide is classified as constitutively expressed rather than a regulated luxury gene?","options":["A glycolysis gene","trpE","lacZ","A lactose-permease gene"],"answer":0,"explanation":"The slide cites glycolysis genes as housekeeping genes that are constitutively expressed."},{"id":"s160","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":76,"q":"On the recombinant-DNA map, which feature is required for autonomous copying in the host but does not itself select transformants?","options":["Selectable marker","Origin of replication","Promoter","Terminator"],"answer":1,"explanation":"The ori enables replication; the marker enables selection."},{"id":"s161","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":77,"q":"Which chronology is correct according to the slide?","options":["GM mice 1973 → GM bacteria 1974 → insulin bacteria 1994","GM bacteria 1973 → GM mice 1974 → insulin bacteria 1982","GM food 1982 → insulin bacteria 1994 → GloFish 2003","GloFish 1994 → GM food 2003 → GM mice 1974"],"answer":1,"explanation":"The listed milestones are bacteria 1973, mice 1974, insulin-producing bacteria 1982, GM food 1994, GloFish 2003."},{"id":"s162","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":78,"q":"Which process is paired with the correct information flow?","options":["Replication: RNA→DNA","Transcription: protein→RNA","Translation: RNA→protein","Translation: DNA→DNA"],"answer":2,"explanation":"Translation uses RNA information to synthesize protein."},{"id":"s163","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":79,"q":"Which sequence best captures the engineering logic shown?","options":["Host → vector → gene → product","Gene of interest → vector → recombinant DNA → host → product","Vector → product → host → gene","Gene → host → vector → recombinant DNA"],"answer":1,"explanation":"The gene is inserted into a vector, introduced into a host, then replicated and/or expressed."},{"id":"s164","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":79,"q":"After a gene of interest is introduced into a suitable host, which two outcomes may occur according to the definition of genetic engineering?","options":["Splicing and/or mutation","Replication and/or expression","Translation and/or secretion only","Deletion and/or chromosome loss"],"answer":1,"explanation":"An introduced gene may be replicated, expressed, or both in the host."},{"id":"s165","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":80,"q":"After compatible vector and insert ends have been generated, what is the next construction step?","options":["Selection","Ligation","Protein purification","Sequencing"],"answer":1,"explanation":"DNA ligase joins the insert and vector before host introduction."},{"id":"s166","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":80,"q":"Which step immediately precedes introduction of recombinant DNA into a host cell?","options":["Isolation of genomic DNA","Protein purification","Ligation of insert and vector","Screening of colonies"],"answer":2,"explanation":"The insert is ligated into the vector before the recombinant vector is transferred into a host."},{"id":"s167","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":80,"q":"What is the primary role of a selectable marker during the workflow?","options":["Cut the insert DNA","Determine the insert sequence","Induce protein folding","Identify cells that received the vector"],"answer":3,"explanation":"A selectable marker allows vector-containing cells to survive or otherwise be selected."},{"id":"s168","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":81,"q":"A bacterial population derived from one transformed progenitor is a:","options":["Vector","Clone","Marker","Restriction site"],"answer":1,"explanation":"A clone is a genetically identical descendant population."},{"id":"s169","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":81,"q":"Which term denotes DNA formed by joining sequences originating from different sources?","options":["Recombinant DNA","Clone","Vector","Competent cell"],"answer":0,"explanation":"Recombinant DNA contains DNA sequences joined from different sources."},{"id":"s170","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":82,"q":"Which feature is typical of the restriction-enzyme recognition sites described?","options":["Usually 40–80 bp and non-specific","Usually 4–8 bp and often palindromic","Always RNA and asymmetric","Located only in eukaryotic promoters"],"answer":1,"explanation":"Restriction enzymes commonly recognize short palindromic DNA sequences."},{"id":"s171","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":82,"q":"Restriction endonucleases occur naturally in bacteria mainly as protection against:","options":["Misfolded bacterial proteins","Foreign bacteriophage DNA","Excess cellular RNA","Damaged phospholipids"],"answer":1,"explanation":"Bacterial restriction enzymes are part of a defense system against invading foreign DNA such as bacteriophage DNA."},{"id":"s172","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":82,"q":"A typical restriction-enzyme recognition sequence is approximately:","options":["1–2 base pairs","20–30 base pairs","4–8 base pairs","Hundreds of base pairs"],"answer":2,"explanation":"The slide states that restriction enzymes usually recognize short sequences 4–8 base pairs long."},{"id":"s173","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":83,"q":"Why can two DNA fragments cut with the same sticky-end-producing enzyme align before ligase acts?","options":["Their phosphates repel each other","Their complementary overhangs base-pair","Ligase first synthesizes missing genes","Their blunt ends contain primers"],"answer":1,"explanation":"Complementary single-stranded overhangs anneal."},{"id":"s174","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":83,"q":"Which enzyme shown produces blunt ends rather than staggered cohesive ends?","options":["EcoRI","HindIII","BamHI","SmaI"],"answer":3,"explanation":"SmaI cuts straight across both DNA strands, producing blunt ends."},{"id":"s175","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":84,"q":"DNA ligase seals a nick by forming a phosphodiester bond between:","options":["Two 5′ phosphates","A 3′-OH and an adjacent 5′-phosphate","Two nitrogenous bases","A primer and RNA polymerase"],"answer":1,"explanation":"Those are the reactive backbone groups at a DNA nick."},{"id":"s176","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":84,"q":"DNA ligase forms a covalent bond between which adjacent groups?","options":["3′-OH and 5′-phosphate","5′-OH and 3′-phosphate","Two nitrogenous bases","Two 3′-phosphate groups"],"answer":0,"explanation":"Ligase seals the backbone by joining a 3′ hydroxyl to an adjacent 5′ phosphate."},{"id":"s177","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":84,"q":"Compared with blunt-end ligation, sticky-end ligation is generally more efficient because:","options":["Sticky ends do not require ligase","Overhangs base-pair and align the fragments","Blunt ends repel DNA polymerase","Sticky ends contain ATP"],"answer":1,"explanation":"Complementary overhangs transiently base-pair, holding the fragments in the correct alignment for ligase."},{"id":"s178","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":85,"q":"Which ordering matches the T4 ligase mechanism shown?","options":["DNA–AMP → ligase–AMP → ATP binding → bond formation","Ligase–AMP → DNA–AMP → 3′-OH attack → phosphodiester bond","3′-OH attack → ATP synthesis → DNA–AMP → ligase binding","PPi binding → blunt-end melting → AMP removal"],"answer":1,"explanation":"ATP first adenylates ligase, AMP is transferred to DNA, then 3′-OH attack seals the backbone."},{"id":"s179","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":85,"q":"During T4 DNA-ligase catalysis, AMP is transferred directly to the:","options":["3′-OH at the DNA end","Nitrogenous base at the nick","5′-phosphate at the DNA end","2′-OH of deoxyribose"],"answer":2,"explanation":"AMP activates the 5′ phosphate, forming a DNA–AMP intermediate before phosphodiester-bond formation."},{"id":"s180","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":86,"q":"What mainly gives sticky-end ligation an efficiency advantage over blunt-end ligation?","options":["Sticky ends eliminate the need for ligase","Complementary pairing holds partners together","Sticky ends carry selectable markers","Blunt ends cannot form phosphodiester bonds"],"answer":1,"explanation":"Annealing raises the effective local concentration of correctly aligned ends."},{"id":"s181","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":86,"q":"Which energy source is specifically required by T4 DNA ligase?","options":["GTP","NADPH","CTP","ATP"],"answer":3,"explanation":"T4 DNA ligase uses ATP to generate the ligase–AMP intermediate."},{"id":"s182","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":87,"q":"Which PCR component pair defines the boundaries of the amplified target?","options":["Mg²⁺ and dNTPs","Forward and reverse primers","Template and thermal cycler","Buffer and polymerase"],"answer":1,"explanation":"The two primers anneal on opposite strands flanking the target."},{"id":"s183","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":87,"q":"Which PCR component synthesizes new DNA while tolerating repeated heating?","options":["Thermostable DNA polymerase","RNA polymerase","DNA ligase","Reverse transcriptase"],"answer":0,"explanation":"A heat-stable polymerase such as Taq synthesizes DNA through repeated thermal cycles."},{"id":"s184","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":88,"q":"Which use of PCR depends most directly on producing enough copies for a downstream readout?","options":["Protein folding","Sequencing-template preparation","Cell lysis","Affinity chromatography"],"answer":1,"explanation":"PCR can generate sufficient target DNA for sequencing."},{"id":"s185","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":88,"q":"Using PCR to detect a pathogen depends on amplification of:","options":["All host genomic DNA equally","A pathogen-specific nucleic-acid target","Only bacterial proteins","Only membrane lipids"],"answer":1,"explanation":"Diagnostic PCR detects a pathogen by amplifying a nucleic-acid sequence specific to it."},{"id":"s186","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":89,"q":"Which temperature-stage match is correct?","options":["94–95°C—annealing","50–65°C—extension","72°C—extension","72°C—denaturation"],"answer":2,"explanation":"Typical PCR uses high heat for denaturation, lower temperature for annealing, and 72°C for polymerase extension."},{"id":"s187","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":89,"q":"Under ideal conditions, how many target copies are expected after 10 PCR cycles from one starting copy?","options":["20","100","1,024","512"],"answer":2,"explanation":"Ideal PCR amplification follows 2^n; 2^10 equals 1,024."},{"id":"s188","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":90,"q":"Two DNA bands start at the same well. Band X migrates farther toward the anode than band Y. What follows?","options":["X is larger","X is smaller","X is less negatively charged because of sequence","Y contains no phosphate"],"answer":1,"explanation":"In agarose, smaller DNA fragments move faster and farther."},{"id":"s189","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":90,"q":"Why does DNA migrate toward the anode during agarose-gel electrophoresis?","options":["Its bases are positively charged","DNA binds positively charged SDS","Agarose carries DNA by osmosis","Its phosphate backbone is negatively charged"],"answer":3,"explanation":"The negatively charged phosphate backbone drives DNA toward the positive electrode."},{"id":"s190","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":90,"q":"A DNA band remaining closest to the loading well most likely contains fragments that are:","options":["Larger than bands that migrated farther","Smaller than all other fragments","More negatively charged per nucleotide","Single-stranded rather than double-stranded"],"answer":0,"explanation":"The agarose matrix slows large fragments more strongly, so they remain nearer the wells."},{"id":"s191","kind":"mcq","topics":["Genetic Engineering Applications 1"],"page":91,"q":"A Sanger reaction fragment terminates immediately after incorp
