the lipid bilayer"],"answer":3,"explanation":"As a steroid hormone, cortisol diffuses across the plasma membrane's lipid bilayer."},{"id":"s400","kind":"mcq","topics":["Cellular Signaling"],"page":188,"q":"What is the direct nuclear effect of the activated glucocorticoid receptor?","options":["It binds target DNA and activates transcription","It hydrolyzes extracellular ATP","It opens a plasma-membrane ion channel","It degrades newly formed mRNA"],"answer":0,"explanation":"After nuclear translocation, the hormone-receptor complex regulates target DNA transcription."},{"id":"s401","kind":"mcq","topics":["Cellular Signaling"],"page":189,"q":"Which receptor class has intrinsic or associated tyrosine-phosphorylation activity?","options":["GPCR","Receptor tyrosine kinase","Ligand-gated ion channel","Nuclear steroid receptor"],"answer":1,"explanation":"Receptor tyrosine kinases transmit signals through regulated tyrosine phosphorylation."},{"id":"s402","kind":"mcq","topics":["Cellular Signaling"],"page":189,"q":"Which membrane-receptor class directly controls ion movement across the membrane?","options":["GPCRs","Ligand-gated ion channels","Receptor tyrosine kinases","Nuclear receptors"],"answer":1,"explanation":"Ion-channel receptors regulate ion flow through the plasma membrane."},{"id":"s403","kind":"mcq","topics":["Cellular Signaling"],"page":190,"q":"Which stimulus-receptor pairing is shown in the GPCR table?","options":["Light—rhodopsin","Insulin—glucocorticoid receptor","Cortisol—nicotinic receptor","PDGF—GABA receptor"],"answer":0,"explanation":"The table pairs light with rhodopsin for visual excitation."},{"id":"s404","kind":"mcq","topics":["Cellular Signaling"],"page":190,"q":"Which GPCR-table pathway links epinephrine to glycogen breakdown?","options":["Rhodopsin to phospholipase C","Muscarinic receptor to cGMP phosphodiesterase","Beta-adrenergic receptor to adenylyl cyclase","Chemotactic receptor to potassium channel"],"answer":2,"explanation":"The epinephrine row pairs the beta-adrenergic receptor with adenylyl cyclase and glycogen breakdown."},{"id":"s405","kind":"mcq","topics":["Cellular Signaling"],"page":190,"q":"Which stimulus uses a muscarinic receptor and a potassium-channel effector in the table?","options":["Serotonin","Light","fMet peptide","Acetylcholine"],"answer":3,"explanation":"The acetylcholine row lists a muscarinic receptor, potassium channel, and slowing of pacemaker activity."},{"id":"s406","kind":"mcq","topics":["Cellular Signaling"],"page":191,"q":"Which component directly exchanges GDP for GTP after ligand-bound GPCR activation?","options":["G-beta","Adenylyl cyclase","Arrestin","G-alpha"],"answer":3,"explanation":"The nucleotide-binding alpha subunit is activated by GDP release and GTP binding."},{"id":"s407","kind":"mcq","topics":["Cellular Signaling"],"page":191,"q":"How many membrane-spanning helices characterize the GPCR family shown?","options":["Four","Seven","Nine","Twelve"],"answer":1,"explanation":"The slide identifies GPCRs as receptors containing seven transmembrane helices."},{"id":"s408","kind":"mcq","topics":["Cellular Signaling"],"page":192,"q":"A mutation that prevents movement of the cytoplasmic ends of the seven helices would most directly impair binding to which partner?","options":["Heterotrimeric G protein","Extracellular ligand","Membrane cholesterol","Nuclear CREB"],"answer":0,"explanation":"The intracellular face of an activated GPCR couples to the heterotrimeric G protein."},{"id":"s409","kind":"mcq","topics":["Cellular Signaling"],"page":193,"q":"Which event belongs to receptor attenuation rather than G-alpha's intrinsic shutoff?","options":["Conversion of ATP to cAMP","Arrestin binding to a GRK-phosphorylated receptor","Hydrolysis of GTP by G-alpha","Reassociation of G-alpha with beta-gamma"],"answer":1,"explanation":"GRK phosphorylation followed by arrestin binding desensitizes the receptor."},{"id":"s410","kind":"mcq","topics":["Cellular Signaling"],"page":193,"q":"What produces the amplification step highlighted in the GPCR diagram?","options":["One receptor activates multiple G proteins","One arrestin activates multiple receptors","One G protein creates multiple receptors","One ligand phosphorylates multiple GRKs"],"answer":0,"explanation":"An active ligand-bound receptor can successively activate multiple G proteins."},{"id":"s411","kind":"mcq","topics":["Cellular Signaling"],"page":193,"q":"Which event directly ends signaling by an individual G-alpha subunit?","options":["Receptor phosphorylation","Ligand binding","GTP hydrolysis","cAMP diffusion"],"answer":2,"explanation":"G-alpha's GTPase activity hydrolyzes bound GTP to GDP, returning the subunit to its inactive state."},{"id":"s412","kind":"mcq","topics":["Cellular Signaling"],"page":194,"q":"What is the correct order immediately after ligand binding?","options":["cAMP production -> receptor binding -> GTP loading","Arrestin binding -> GRK removal -> G-alpha activation","GDP release -> GTP binding -> G-alpha-effector interaction","GTP hydrolysis -> GDP release -> arrestin removal"],"answer":2,"explanation":"Ligand-bound receptor first promotes nucleotide exchange, then active G-alpha regulates the effector."},{"id":"s413","kind":"mcq","topics":["Cellular Signaling"],"page":194,"q":"Which enzyme is activated by G-alpha in the pathway described on the slide?","options":["Protein phosphatase 1","Adenylyl cyclase","Glycogen synthase","Caspase-9"],"answer":1,"explanation":"Activated G-alpha binds and activates adenylyl cyclase in the illustrated pathway."},{"id":"s414","kind":"mcq","topics":["Cellular Signaling"],"page":194,"q":"What happens after G-alpha hydrolyzes its bound GTP?","options":["It binds arrestin","It phosphorylates the receptor","It reassociates with beta-gamma","It converts cAMP to ATP"],"answer":2,"explanation":"GDP-bound G-alpha reassociates with beta-gamma, reforming the inactive trimeric G protein."},{"id":"s415","kind":"mcq","topics":["Cellular Signaling"],"page":195,"q":"Which atoms are joined by the phosphate to create the cyclic feature of cAMP?","options":["Two adenine bases","Ribose and a protein","Two separate AMP molecules","Two positions on the ribose"],"answer":3,"explanation":"The phosphate forms an intramolecular cyclic linkage on one ribose."},{"id":"s416","kind":"mcq","topics":["Cellular Signaling"],"page":196,"q":"Which time point in the image shows the strongest widespread cAMP signal?","options":["About 100 seconds after 5-HT","Before 5-HT","About 10 minutes after 5-HT","All four are equal"],"answer":0,"explanation":"Red/yellow signal is maximal around the 100-second image and declines by 10 minutes."},{"id":"s417","kind":"mcq","topics":["Cellular Signaling"],"page":196,"q":"In the Aplysia images, which color represents the highest intracellular cAMP concentration?","options":["Blue","Green","Yellow","Red"],"answer":3,"explanation":"The slide's color scale identifies blue as low, yellow as intermediate, and red as high cAMP."},{"id":"s418","kind":"mcq","topics":["Cellular Signaling"],"page":196,"q":"In this signaling example, serotonin is classified as which messenger?","options":["First messenger","Second messenger","Protein kinase","Transcription factor"],"answer":0,"explanation":"Serotonin binds the extracellular receptor and is therefore the first messenger; cAMP is the second messenger."},{"id":"s419","kind":"mcq","topics":["Cellular Signaling"],"page":197,"q":"Which pair is driven in opposite functional directions by PKA-dependent phosphorylation?","options":["Glucose-1-phosphate and glucose-6-phosphate","Glycogen phosphorylase and glycogen synthase","CREB and phosphorylase kinase","Adenylyl cyclase and cAMP"],"answer":1,"explanation":"The cascade promotes glycogen breakdown while inhibiting glycogen synthesis."},{"id":"s420","kind":"mcq","topics":["Cellular Signaling"],"page":197,"q":"Which kinase is directly activated by cAMP in the illustrated liver-cell cascade?","options":["Protein kinase A","Protein kinase C","Cyclin-dependent kinase 1","Receptor tyrosine kinase"],"answer":0,"explanation":"cAMP activates protein kinase A in the glucagon/epinephrine cascade."},{"id":"s421","kind":"mcq","topics":["Cellular Signaling"],"page":197,"q":"What is the immediate metabolic purpose of activating glycogen phosphorylase in this pathway?","options":["Glycogen synthesis","Glycogen breakdown","Fatty-acid synthesis","DNA replication"],"answer":1,"explanation":"Glycogen phosphorylase promotes glycogen breakdown, helping mobilize glucose."},{"id":"s422","kind":"mcq","topics":["Cellular Signaling"],"page":198,"q":"Which modification creates the receptor state preferentially recognized by arrestin?","options":["cAMP binding to the receptor","Dephosphorylation by a phosphatase","GRK-mediated phosphorylation of an active GPCR","GTP loading of G-alpha"],"answer":2,"explanation":"Arrestin preferentially binds the active receptor after GRK phosphorylation."},{"id":"s423","kind":"mcq","topics":["Cellular Signaling"],"page":198,"q":"Why are G proteins and arrestins mutually exclusive at an activated GPCR?","options":["They hydrolyze one another","They bind the same cytoplasmic receptor cavity","They require different ligands","They occupy opposite membrane leaflets"],"answer":1,"explanation":"Both engage the same inter-helical cavity on the receptor's cytoplasmic side, so binding of one prevents binding of the other."},{"id":"s424","kind":"mcq","topics":["Cellular Signaling"],"page":198,"q":"Which receptor-modifying enzyme acts before arrestin binds?","options":["GRK","Adenylyl cyclase","PKA","Phosphodiesterase"],"answer":0,"explanation":"A GPCR kinase, or GRK, first phosphorylates the active receptor."},{"id":"s425","kind":"mcq","topics":["Cell Death and Cell Division"],"page":199,"q":"Which topic immediately follows cellular signaling in the compiled material?","options":["Genetic engineering","Biological motors","Host-pathogen interaction","Cell survival and cell death"],"answer":3,"explanation":"Page 199 opens the cell survival and cell death lecture."},{"id":"s426","kind":"mcq","topics":["Cell Death and Cell Division"],"page":200,"q":"Which microscopic feature most strongly supports an apoptotic interpretation of the arrowed cells?","options":["Small intensely condensed nuclei","Uniform enlargement of every cell","Loss of all nuclear staining","Formation of a metaphase plate"],"answer":0,"explanation":"Apoptotic cells commonly become shrunken with condensed nuclear material."},{"id":"s427","kind":"mcq","topics":["Cell Death and Cell Division"],"page":201,"q":"Which combination is most characteristic of early apoptosis?","options":["Cell fusion, migration, and secretion","Cell shrinkage, loss of adhesion, and membrane blebbing","Cell swelling, membrane rupture, and inflammation","DNA replication, spindle assembly, and cytokinesis"],"answer":1,"explanation":"The slide's images and list emphasize shrinkage, detachment, and blebbing."},{"id":"s428","kind":"mcq","topics":["Cell Death and Cell Division"],"page":201,"q":"What happens to the overall volume of a cell and its nucleus during apoptosis?","options":["Both increase","The cell increases while the nucleus shrinks","Both shrink","Neither changes"],"answer":2,"explanation":"Shrinkage of both the cell and nucleus is listed as a characteristic feature of apoptosis."},{"id":"s429","kind":"mcq","topics":["Cell Death and Cell Division"],"page":201,"q":"Which cell-surface change is characteristic of apoptosis on this slide?","options":["Flagellum formation","Membrane blebbing","Cell-wall synthesis","Tight-junction expansion"],"answer":1,"explanation":"Apoptotic cells lose adhesion and form blebs at the cell surface."},{"id":"s430","kind":"mcq","topics":["Cell Death and Cell Division"],"page":202,"q":"The small pieces surrounding the dying cell are best identified as what?","options":["Secretory vesicles","Bacterial endospores","Membrane-bound apoptotic bodies","Replicated chromosomes"],"answer":2,"explanation":"Late apoptosis packages cellular material into membrane-bound fragments for clearance."},{"id":"s431","kind":"mcq","topics":["Cell Death and Cell Division"],"page":203,"q":"Which event occurs immediately before apoptotic-body formation in the depicted sequence?","options":["DNA synthesis","Metaphase alignment","Cell-wall formation","Nuclear collapse with membrane blebbing"],"answer":3,"explanation":"The diagram places blebbing/nuclear collapse just before fragmentation into apoptotic bodies."},{"id":"s432","kind":"mcq","topics":["Cell Death and Cell Division"],"page":203,"q":"Which event appears first in the illustrated apoptotic sequence?","options":["Apoptotic-body formation","Membrane blebbing","Chromatin condensation","Phagolysosome formation"],"answer":2,"explanation":"The diagram begins with chromatin condensation, followed by blebbing, nuclear collapse, and apoptotic-body formation."},{"id":"s433","kind":"mcq","topics":["Cell Death and Cell Division"],"page":203,"q":"What is the final labeled morphological product of the sequence?","options":["A multinucleated cell","Apoptotic bodies","A metaphase plate","A bacterial spore"],"answer":1,"explanation":"The dying cell fragments into membrane-bound apoptotic bodies."},{"id":"s434","kind":"mcq","topics":["Cell Death and Cell Division"],"page":204,"q":"Failure of rapid macrophage clearance would most directly increase the risk of what?","options":["Secondary necrosis and inflammatory leakage","Re-entry into S phase","Reassembly of the apoptotic nucleus","Conversion into a stem cell"],"answer":0,"explanation":"Uncleared apoptotic bodies can lose membrane integrity and release contents."},{"id":"s435","kind":"mcq","topics":["Cell Death and Cell Division"],"page":204,"q":"Where are engulfed apoptotic bodies degraded inside macrophages?","options":["Nucleoli","Peroxisomes","Phagolysosomes","Centrosomes"],"answer":2,"explanation":"Macrophages phagocytose apoptotic bodies and degrade them within phagolysosomes."},{"id":"s436","kind":"mcq","topics":["Cell Death and Cell Division"],"page":204,"q":"Which property of apoptotic bodies helps prevent inflammation?","options":["They retain an intact enclosing plasma membrane","They release ATP into surrounding tissue","They immediately lyse neighboring cells","They secrete inflammatory cytokines"],"answer":0,"explanation":"Membrane enclosure prevents cellular contents from spilling into the surrounding tissue."},{"id":"s437","kind":"mcq","topics":["Cell Death and Cell Division"],"page":205,"q":"Which ordered morphology sequence should the linked apoptosis video reinforce?","options":["Gastrulation -> neurulation -> organogenesis -> birth","Shrinkage -> blebbing -> fragmentation -> phagocytic clearance","Swelling -> chromosome replication -> cytokinesis -> fusion","Adhesion -> growth -> mitosis -> secretion"],"answer":1,"explanation":"This is the core visible sequence established by the surrounding apoptosis slides."},{"id":"s438","kind":"mcq","topics":["Cell Death and Cell Division"],"page":206,"q":"Why can apoptosis remove one cell from an epithelial sheet with limited damage to neighbors?","options":["The apoptotic cell releases digestive enzymes extracellularly","The tissue stops expressing adhesion proteins permanently","The dying cell remains packaged into membrane-bound material","All neighboring cells undergo lysis simultaneously"],"answer":2,"explanation":"Orderly membrane-contained dismantling limits exposure of neighboring cells."},{"id":"s439","kind":"mcq","topics":["Cell Death and Cell Division"],"page":207,"q":"Which observation in live-cell imaging would best distinguish apoptosis from continued proliferation?","options":["Formation of two stable spindle poles","Increase in colony size without shape change","Sustained cell spreading and attachment","Progressive rounding and bleb formation"],"answer":3,"explanation":"Rounding and blebbing are visible apoptotic morphology, unlike mitotic progression alone."},{"id":"s440","kind":"mcq","topics":["Cell Death and Cell Division"],"page":208,"q":"Which complex component provides protease activity first in the extrinsic pathway?","options":["Caspase-8","TRADD","FADD","TNFR1"],"answer":0,"explanation":"TRADD and FADD are adaptors; procaspase-8 becomes the initiator protease caspase-8."},{"id":"s441","kind":"mcq","topics":["Cell Death and Cell Division"],"page":208,"q":"Which death receptor is named in the extrinsic apoptosis pathway?","options":["EGFR","TNFR1","GPCR","T-cell receptor"],"answer":1,"explanation":"The slide begins the pathway with TNF binding to TNFR1."},{"id":"s442","kind":"mcq","topics":["Cell Death and Cell Division"],"page":208,"q":"Which pair consists of adaptor proteins recruited in the TNFR1 complex?","options":["BAX and BAK","Apaf-1 and cytochrome c","TRADD and FADD","BCL-2 and BCL-XL"],"answer":2,"explanation":"Activated TNFR1 recruits the cytoplasmic adaptors TRADD and FADD."},{"id":"s443","kind":"mcq","topics":["Cell Death and Cell Division"],"page":209,"q":"Which set contains only BH3-only pro-apoptotic regulators?","options":["TRADD, FADD, Apaf-1, E2F","BID, BIM, NOXA, BAD","BAX, BAK, BOK, BCL-2","BCL-XL, MCL-1, BCL-w, A1"],"answer":1,"explanation":"The slide lists BID, BIM, NOXA, and BAD among BH3-only apoptosis inducers."},{"id":"s444","kind":"mcq","topics":["Cell Death and Cell Division"],"page":209,"q":"Which set contains only anti-apoptotic BCL-2 family members listed on the slide?","options":["BCL-2, BCL-XL, MCL-1","BAX, BAK, BOK","BID, BIM, BAD","BAX, BCL-2, NOXA"],"answer":0,"explanation":"BCL-2, BCL-XL, and MCL-1 are all listed as anti-apoptotic proteins."},{"id":"s445","kind":"mcq","topics":["Cell Death and Cell Division"],"page":209,"q":"What cellular event is caused by BAX and BAK oligomerization?","options":["Nuclear-envelope assembly","Mitochondrial outer-membrane permeabilization","DNA replication","GPCR desensitization"],"answer":1,"explanation":"BAX and BAK form pores that permeabilize the mitochondrial outer membrane, producing MOMP."},{"id":"s446","kind":"mcq","topics":["Cell Death and Cell Division"],"page":210,"q":"Which complex activates the intrinsic-pathway initiator caspase?","options":["BCL-2, BCL-XL, MCL-1, and A1","Cyclin B, CDK1, E2F, and pRb","Cytochrome c, Apaf-1, and procaspase-9","TNFR1, TRADD, FADD, and procaspase-8"],"answer":2,"explanation":"Cytochrome c released from mitochondria assembles with Apaf-1 and procaspase-9."},{"id":"s447","kind":"mcq","topics":["Cell Death and Cell Division"],"page":210,"q":"From which mitochondrial compartment is cytochrome c released during intrinsic apoptosis?","options":["Matrix","Intermembrane space","Inner-membrane matrix face","Mitochondrial nucleoid"],"answer":1,"explanation":"Cytochrome c resides in the intermembrane space before MOMP releases it into the cytosol."},{"id":"s448","kind":"mcq","topics":["Cell Death and Cell Division"],"page":210,"q":"Which initiator caspase is activated by the cytochrome c–Apaf-1 complex?","options":["Caspase-1","Caspase-3","Caspase-8","Caspase-9"],"answer":3,"explanation":"The intrinsic pathway recruits and activates procaspase-9."},{"id":"s449","kind":"mcq","topics":["Cell Death and Cell Division"],"page":211,"q":"An Annexin-V-positive cell most directly indicates which membrane change?","options":["Cytochrome c retention in mitochondria","Loss of all membrane phospholipids","DNA doubling during S phase","Phosphatidylserine exposure on the outer leaflet"],"answer":3,"explanation":"Annexin V recognizes phosphatidylserine after its apoptotic externalization."},{"id":"s450","kind":"mcq","topics":["Cell Death and Cell Division"],"page":211,"q":"Where is phosphatidylserine normally located in a healthy cell?","options":["Outer leaflet of the plasma membrane","Cytoplasmic leaflet of the plasma membrane","Mitochondrial matrix","Nuclear pore"],"answer":1,"explanation":"In healthy cells, phosphatidylserine is maintained on the cytoplasmic, inner leaflet."},{"id":"s451","kind":"mcq","topics":["Cell Death and Cell Division"],"page":211,"q":"What biological signal does exposed phosphatidylserine provide to macrophages?","options":["A proliferate signal","An eat-me signal","A secrete-cAMP signal","A DNA-repair signal"],"answer":1,"explanation":"Externalized phosphatidylserine marks the apoptotic cell for engulfment."},{"id":"s452","kind":"mcq","topics":["Cell Death and Cell Division"],"page":212,"q":"Which fluorescence pattern indicates mitochondrial outer-membrane permeabilization?","options":["Diffuse cytosolic cytochrome-c staining","Punctate mitochondrial cytochrome-c staining","Blue nuclear staining alone","Absence of any green signal in all cells"],"answer":0,"explanation":"Cytochrome c changes from mitochondrial puncta to a diffuse distribution after release."},{"id":"s453","kind":"mcq","topics":["Cell Death and Cell Division"],"page":212,"q":"Which treatment is used on the slide to induce apoptosis?","options":["Serotonin","Staurosporine","Activin","Propidium iodide"],"answer":1,"explanation":"The treated cells were exposed to staurosporine to induce apoptosis."},{"id":"s454","kind":"mcq","topics":["Cell Death and Cell Division"],"page":212,"q":"In untreated cells, cytochrome c fluorescence is expected to appear in which pattern?","options":["Diffuse throughout the cytosol","Punctate and mitochondrial","Restricted to the nucleus","Absent from the cell"],"answer":1,"explanation":"Before mitochondrial permeabilization, cytochrome c remains localized to mitochondria and appears punctate."},{"id":"s455","kind":"mcq","topics":["Cell Death and Cell Division"],"page":213,"q":"Which feature would be least consistent with apoptosis in the linked microscopy?","options":["Cellular fragmentation","Immediate rupture with widespread cellular swelling","Loss of attachment","Membrane blebbing"],"answer":1,"explanation":"Swelling and abrupt rupture are more typical of necrotic damage than orderly apoptosis."},{"id":"s456","kind":"mcq","topics":["Cell Death and Cell Division"],"page":214,"q":"Which event belongs to cytokinesis rather than mitosis?","options":["Separation of sister chromatids","Reformation of daughter nuclei","Physical division of the cytoplasm into two cells","Alignment of chromosomes at the spindle midplane"],"answer":2,"explanation":"Cytokinesis partitions the cell body after chromosome segregation."},{"id":"s457","kind":"mcq","topics":["Cell Death and Cell Division"],"page":214,"q":"Which phases together constitute interphase?","options":["G1, S, and G2","Prophase, metaphase, and anaphase","G0, M, and cytokinesis","S, M, and telophase"],"answer":0,"explanation":"Interphase consists of G1, S, and G2."},{"id":"s458","kind":"mcq","topics":["Cell Death and Cell Division"],"page":214,"q":"What structure performs the equipartition of chromosomes during mitosis?","options":["Lysosome","Mitotic spindle","Golgi apparatus","Phagolysosome"],"answer":1,"explanation":"The mitotic spindle organizes and separates chromosomes into the two daughter cells."},{"id":"s459","kind":"mcq","topics":["Cell Death and Cell Division"],"page":215,"q":"A propidium-iodide histogram peak at twice the G1 DNA content is most enriched for cells in which state?","options":["G0/G1","Early G1 only","Post-cytokinesis daughters only","G2/M"],"answer":3,"explanation":"Cells have doubled DNA after S phase and retain it through G2 until division."},{"id":"s460","kind":"mcq","topics":["Cell Death and Cell Division"],"page":215,"q":"Which fluorescent stain is identified as a DNA stain on this slide?","options":["Annexin V","Propidium iodide","SYPRO Orange","Calcein"],"answer":1,"explanation":"The slide explicitly states that propidium iodide is used to stain DNA."},{"id":"s461","kind":"mcq","topics":["Cell Death and Cell Division"],"page":215,"q":"Which listed purpose of mitosis is especially important in skin and gut lining?","options":["Nitrogen fixation","Cell replacement and repair","Antibody recombination","Gametogenesis only"],"answer":1,"explanation":"Mitosis replaces damaged, worn-out, or dead cells in rapidly renewed tissues such as skin and gut lining."},{"id":"s462","kind":"mcq","topics":["Cell Death and Cell Division"],"page":216,"q":"Which phase produces sister chromatids?","options":["S phase","G1 phase","G0 phase","Cytokinesis"],"answer":0,"explanation":"Nuclear DNA replication during S phase duplicates each chromosome."},{"id":"s463","kind":"mcq","topics":["Cell Death and Cell Division"],"page":216,"q":"Approximately what fraction of the cell cycle is spent in interphase according to the slide?","options":["10%","25%","50%","90%"],"answer":3,"explanation":"The slide labels interphase as approximately 90% of the cell cycle."},{"id":"s464","kind":"mcq","topics":["Cell Death and Cell Division"],"page":216,"q":"Which phase is described as a quiescent state outside active cycling?","options":["G0","G1","S","G2"],"answer":0,"explanation":"Cells that temporarily or permanently stop dividing enter G0."},{"id":"s465","kind":"mcq","topics":["Cell Death and Cell Division"],"page":217,"q":"What physically holds newly replicated sister chromatids together in G2?","options":["BCL-2 pores","Cohesin complexes","Arrestin proteins","Annexin V"],"answer":1,"explanation":"The slide identifies cohesins as the linkage between sister chromatids."},{"id":"s466","kind":"mcq","topics":["Cell Death and Cell Division"],"page":217,"q":"What is the DNA state of each decondensed chromosome in G1?","options":["Two sister chromatids","One linear double-stranded DNA molecule","Four homologous chromosomes","One single-stranded RNA molecule"],"answer":1,"explanation":"Before S phase, each G1 chromosome consists of one linear double-stranded DNA molecule."},{"id":"s467","kind":"mcq","topics":["Cell Death and Cell Division"],"page":217,"q":"During which phase are sister chromatids generated?","options":["G1","S","G2","M"],"answer":1,"explanation":"Chromosome replication in S phase creates sister chromatids."},{"id":"s468","kind":"mcq","topics":["Cell Death and Cell Division"],"page":218,"q":"During ordinary mitosis, which structures separate from one another?","options":["Germ layers","G-alpha and beta-gamma permanently","Sister chromatids","Homologous chromosome pairs"],"answer":2,"explanation":"Mitosis partitions replicated sister chromatids into daughter cells."},{"id":"s469","kind":"mcq","topics":["Cell Death and Cell Division"],"page":218,"q":"At which mitotic stage do spindle microtubules gain access to chromosomes and attach to kinetochores?","options":["Prophase","Prometaphase","Metaphase","Telophase"],"answer":1,"explanation":"The slide describes kinetochore attachment after nuclear-envelope breakdown in prometaphase."},{"id":"s470","kind":"mcq","topics":["Cell Death and Cell Division"],"page":218,"q":"At which stage are chromosomes aligned at the spindle midplane?","options":["Prometaphase","Metaphase","Anaphase","Telophase"],"answer":1,"explanation":"Chromosome alignment at the spindle midplane defines metaphase."},{"id":"s471","kind":"mcq","topics":["Cell Death and Cell Division"],"page":219,"q":"In the fluorescence image, the cyan structures radiating from poles are what?","options":["Condensed chromatin","Plasma membranes","Apoptotic bodies","Spindle microtubules"],"answer":3,"explanation":"The cyan arrays form the mitotic spindle around the yellow chromosomes."},{"id":"s472","kind":"mcq","topics":["Cell Death and Cell Division"],"page":220,"q":"Which event is associated with chromosome condensation during prophase?","options":["Displacement of transcription factors and reduced transcription","Activation of DNA replication origins","Externalization of phosphatidylserine","Formation of the blastocoel"],"answer":0,"explanation":"Condensation reduces DNA accessibility and transcriptional activity."},{"id":"s473","kind":"mcq","topics":["Cell Death and Cell Division"],"page":220,"q":"Why does transcription decrease as chromosomes compact in prophase?","options":["RNA is converted into DNA","Transcription factors become displaced","Ribosomes enter the nucleus","Kinetochores degrade promoters"],"answer":1,"explanation":"The slide states that transcription shuts down partly because compaction displaces transcription factors."},{"id":"s474","kind":"mcq","topics":["Cell Death and Cell Division"],"page":220,"q":"Toward where do the centrioles move as the mitotic spindle forms?","options":["The nuclear center","Opposite poles of the cell","The metaphase plate together","The nucleolus"],"answer":1,"explanation":"The centrioles move toward opposite cell poles while spindle microtubules extend between them."},{"id":"s475","kind":"mcq","topics":["Cell Death and Cell Division"],"page":221,"q":"What is the direct chromosome attachment site for spindle microtubules?","options":["Cleavage furrow","Kinetochore","Centrosome","Nucleolus"],"answer":1,"explanation":"Kinetochores are protein assemblies on centromeric chromatin that bind spindle microtubules."},{"id":"s476","kind":"mcq","topics":["Cell Death and Cell Division"],"page":221,"q":"Approximately how many different polypeptides are stated to assemble into the human kinetochore?","options":["About 10","About 25","About 100","About 1,000"],"answer":2,"explanation":"The slide states that approximately 100 different polypeptides assemble into kinetochore protein complexes."},{"id":"s477","kind":"mcq","topics":["Cell Death and Cell Division"],"page":221,"q":"Which motor protein is named as helping carry chromosomes along spindle microtubules?","options":["Kinesin-1","Dynein","Myosin II","Actin"],"answer":1,"explanation":"Dynein is named as a kinetochore-associated motor that moves chromosomes on the spindle."},{"id":"s478","kind":"mcq","topics":["Cell Death and Cell Division"],"page":222,"q":"Which chromosome arrangement identifies the stage shown?","options":["Diffuse chromatin in an intact nucleus","Random chromosomes after nuclear reformation","Alignment at the cell equator","Two groups at opposite poles"],"answer":2,"explanation":"A metaphase plate at the equator is diagnostic of metaphase."},{"id":"s479","kind":"mcq","topics":["Cell Death and Cell Division"],"page":223,"q":"Which event distinguishes telophase from anaphase?","options":["Initial separation of sister chromatids","Attachment of kinetochores to spindle fibers","DNA replication","Reformation of nuclear membranes around chromosome sets"],"answer":3,"explanation":"Nuclear envelopes re-form in telophase after chromosomes reach the poles."},{"id":"s480","kind":"mcq","topics":["Cell Death and Cell Division"],"page":223,"q":"During which stage are sister chromatids pulled toward opposite poles?","options":["Prophase","Metaphase","Anaphase","Telophase"],"answer":2,"explanation":"Separation and poleward movement of sister chromatids occur in anaphase."},{"id":"s481","kind":"mcq","topics":["Cell Death and Cell Division"],"page":223,"q":"What is the name of the process that physically pinches one cell into two daughter cells?","options":["Condensation","Cytokinesis","Replication","Gastrulation"],"answer":1,"explanation":"Cytokinesis divides the cytoplasm and completes physical cell separation."},{"id":"s482","kind":"mcq","topics":["Cell Death and Cell Division"],"page":224,"q":"Which stage should follow the prophase frame before anaphase begins?","options":["Metaphase","G1","Cytokinesis","G0"],"answer":0,"explanation":"Chromosomes next attach and align during prometaphase/metaphase before separating."},{"id":"s483","kind":"mcq","topics":["Cell Death and Cell Division"],"page":225,"q":"What conclusion follows when cytoplasm from a maturing Xenopus oocyte triggers germinal-vesicle breakdown in an immature oocyte?","options":["Membrane phosphatidylserine has externalized","A transferable cytoplasmic factor promotes meiotic maturation","The donor nucleus contains a unique chromosome","The recipient has undergone fertilization"],"answer":1,"explanation":"The activity is carried in transferred cytoplasm, demonstrating a cytoplasmic maturation-promoting factor."},{"id":"s484","kind":"mcq","topics":["Cell Death and Cell Division"],"page":225,"q":"Which material was transferred from a maturing Xenopus oocyte into an immature oocyte?","options":["Purified DNA","Cytoplasm","Plasma membrane","Isolated chromosomes"],"answer":1,"explanation":"Cytoplasm from a maturing oocyte was injected into an immature recipient."},{"id":"s485","kind":"mcq","topics":["Cell Death and Cell Division"],"page":225,"q":"What response in the recipient oocyte indicated induced maturation?","options":["Apoptotic-body formation","Germinal-vesicle breakdown","Phosphatidylserine exposure","Blastocoel formation"],"answer":1,"explanation":"The injected recipient underwent germinal-vesicle breakdown and prematurely entered meiosis."},{"id":"s486","kind":"mcq","topics":["Cell Death and Cell Division"],"page":226,"q":"Which cyclin-CDK complex peaks latest in the diagram?","options":["Cyclin A-CDK2","Cyclin A-CDK1/CDK2 before G2","Cyclin B-CDK1","Cyclin E-CDK2"],"answer":2,"explanation":"Cyclin B-CDK1 rises in G2 and peaks in M phase."},{"id":"s487","kind":"mcq","topics":["Cell Death and Cell Division"],"page":226,"q":"Which cyclin-CDK complex is most associated with the G1/S transition in the diagram?","options":["Cyclin E–CDK2","Cyclin A–CDK1","Cyclin B–CDK1","Cyclin D–CDK1"],"answer":0,"explanation":"Cyclin E–CDK2 activity peaks around the G1/S transition."},{"id":"s488","kind":"mcq","topics":["Cell Death and Cell Division"],"page":226,"q":"Which cyclin is shown rising through S and G2 before declining in mitosis?","options":["Cyclin E","Cyclin A","Cyclin B only after cytokinesis","Cyclin D only in G0"],"answer":1,"explanation":"The plotted Cyclin A activity spans S phase and G2."},{"id":"s489","kind":"mcq","topics":["Cell Death and Cell Division"],"page":227,"q":"Why does hypophosphorylated pRb suppress G1-to-S progression?","options":["It activates caspase-8","It degrades cyclin B directly","It externalizes phosphatidylserine","It binds and inhibits E2F transcription factors"],"answer":3,"explanation":"Active pRb restrains E2F-dependent transcription needed for S phase."},{"id":"s490","kind":"mcq","topics":["Cell Death and Cell Division"],"page":227,"q":"In which phosphorylation state is pRb active as an E2F inhibitor?","options":["Hyperphosphorylated","Hypophosphorylated","Ubiquitinated","Acetylated only"],"answer":1,"explanation":"Hypophosphorylated pRb binds and inactivates E2F transcription factors."},{"id":"s491","kind":"mcq","topics":["Cell Death and Cell Division"],"page":227,"q":"Loss of RB1 function also increases risk of which malignancy named on the slide?","options":["Osteosarcoma","Glioblastoma","Melanoma","Leukemia"],"answer":0,"explanation":"The slide specifically names osteosarcoma and soft-tissue sarcomas as additional risks."},{"id":"s492","kind":"mcq","topics":["Cell Death and Cell Division"],"page":228,"q":"Which author is cited for detailed apoptosis reading?","options":["Gerald Karp","John Gurdon","Shinya Yamanaka","Till McCulloch"],"answer":0,"explanation":"The reference slide cites Cell and Molecular Biology by Gerald Karp."},{"id":"s493","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":229,"q":"Which three themes are named in the lecture title?","options":["DNA replication, transcription, and translation","Stem cells, differentiation, and apoptosis","Immunity, infection, and vaccination","Motors, actin, and tubulin"],"answer":1,"explanation":"Those three topics appear directly in the section title."},{"id":"s494","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":230,"q":"Which lineage relationship is shown correctly?","options":["B lymphocyte -> erythrocyte","Common lymphoid progenitor -> platelet","Monocyte -> macrophage","Megakaryocyte -> neutrophil"],"answer":2,"explanation":"The diagram places macrophages downstream of monocytes in the myeloid branch."},{"id":"s495","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":230,"q":"Which progenitor gives rise to B lymphocytes, T lymphocytes, and natural killer cells in the diagram?","options":["Common myeloid progenitor","Common lymphoid progenitor","Megakaryocyte","Erythrocyte"],"answer":1,"explanation":"B, T, and natural killer cells branch from the common lymphoid progenitor."},{"id":"s496","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":230,"q":"Which mature blood cell is produced from a megakaryocyte?","options":["Platelets","Neutrophils","Plasma cells","Macrophages"],"answer":0,"explanation":"The diagram shows thrombocytes/platelets arising from megakaryocytes."},{"id":"s497","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":231,"q":"Which event converts a solid morula-like cell mass into a structure with a fluid-filled cavity?","options":["Apoptosis","Metaphase","Translation","Blastulation"],"answer":3,"explanation":"Blastulation produces the blastocyst/blastula and its cavity."},{"id":"s498","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":232,"q":"Spontaneous beating in cultured cells is functional evidence of differentiation into what cell type?","options":["Cardiomyocytes","Hepatocytes","Macrophages","Retinal pigment cells"],"answer":0,"explanation":"Contractile beating is a specialized function of heart muscle cells."},{"id":"s499","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":233,"q":"Which pairing of differentiated cell and principal function is correct?","options":["Macrophage - electrical conduction","Red blood cell - oxygen transport","Neuron - force generation","Muscle cell - antibody secretion"],"answer":1,"explanation":"The slide uses oxygen transport, conduction, and contraction as specialized examples."},{"id":"s500","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":233,"q":"Which specialized function is assigned to red blood cells on the slide?","options":["Electrical conduction","Force generation","Oxygen transport","Antibody secretion"],"answer":2,"explanation":"Red blood cells are given as the example specialized for O2 transportation."},{"id":"s501","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":233,"q":"What is differentiation?","options":["Replacement of a cell's entire genome","Specialization of an unspecialized cell","Fusion of all embryonic cells","Permanent arrest of every stem cell"],"answer":1,"explanation":"Differentiation is the process by which unspecialized cells acquire specialized morphology and function."},{"id":"s502","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":234,"q":"A cell has committed to a muscle fate but still resembles neighboring cells. Which term best describes it?","options":["Totipotent","Apoptotic","Determined","Differentiated"],"answer":2,"explanation":"Determination fixes developmental fate before the visible specialized phenotype appears."},{"id":"s503","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":234,"q":"Which term describes the range of cell types that a cell can potentially become?","options":["Fate","Potency","Morphology","Clonality"],"answer":1,"explanation":"Developmental potential, or potency, is the range of cell types a cell can become."},{"id":"s504","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":234,"q":"How does developmental potential generally change as development proceeds?","options":["It progressively decreases","It progressively increases","It alternates randomly","It remains identical in all cells"],"answer":0,"explanation":"Cell fates become progressively restricted, so developmental potential decreases."},{"id":"s505","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":235,"q":"Which potency class can produce several cell types within one lineage but not all body tissues?","options":["Totipotent","Pluripotent","Unipotent","Multipotent"],"answer":3,"explanation":"Multipotent cells have a lineage-restricted but multi-cell-type output."},{"id":"s506","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":235,"q":"Which potency class has the broadest developmental potential?","options":["Unipotent","Oligopotent","Multipotent","Totipotent"],"answer":3,"explanation":"Totipotent cells can generate all cell types required for an organism."},{"id":"s507","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":235,"q":"Which potency class is restricted to producing one specific cell type?","options":["Pluripotent","Multipotent","Oligopotent","Unipotent"],"answer":3,"explanation":"A unipotent cell produces only its own specific cell type."},{"id":"s508","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":236,"q":"After an antigen selects lymphocyte clone 2, what changes during clonal expansion?","options":["The number of clone-2 cells","The antigen specificity of each clone-2 receptor","The identity of the selecting antigen","The genome of every unrelated clone"],"answer":0,"explanation":"Expansion produces many descendants with the selected specificity."},{"id":"s509","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":236,"q":"What does clonality mean in the lineage diagram?","options":["Cells originate from one founder cell","Cells contain different genomes","Cells cannot proliferate","Cells arise from multiple unrelated founders"],"answer":0,"explanation":"A clone is a group of descendant cells derived from one founder."},{"id":"s510","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":236,"q":"What triggers expansion of the selected lymphocyte clone in the diagram?","options":["Antigen recognition","DNA loss","Mitochondrial rupture","Cyclin destruction"],"answer":0,"explanation":"Antigen selects the matching lymphocyte clone, which then proliferates."},{"id":"s511","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":237,"q":"Moving from the apex toward the base of the diagram represents what paired change?","options":["Decreasing gene expression in every lineage","Decreasing potency and increasing differentiation","Increasing potency and decreasing specialization","Increasing apoptosis and decreasing cell number only"],"answer":1,"explanation":"Development narrows potential as cells acquire specialized identities."},{"id":"s512","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":237,"q":"In the potency pyramid, in which direction does differentiation increase?","options":["From base to apex","From apex to base","Only from left to right","It does not change"],"answer":1,"explanation":"The diagram shows broad totipotency at the apex and increasingly differentiated cell types toward the base."},{"id":"s513","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":237,"q":"How does potency change as cells move toward differentiated cell types?","options":["It increases","It decreases","It becomes cyclic","It becomes unrelated to fate"],"answer":1,"explanation":"Developmental potency narrows as differentiation proceeds."},{"id":"s514","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":238,"q":"What does a difference in heat-map pattern between MEP and LMPP primarily represent?","options":["Different DNA genetic codes","Different numbers of plasma membranes","Different subsets of genes being expressed","Different chromosome numbers in every cell"],"answer":2,"explanation":"Differentiation changes transcriptional programs while generally retaining the genome."},{"id":"s515","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":238,"q":"What is the direct molecular cause of different behavior in differentiated cells according to the slide?","options":["Different subsets of genes are expressed","Each cell loses most chromosomes","All proteins are expressed equally","The genetic code changes"],"answer":0,"explanation":"Differential gene expression gives different cell types different protein complements."},{"id":"s516","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":238,"q":"What do the contrasting colors in the two heat maps primarily represent?","options":["Different gene-expression levels","Different chromosome numbers","Different cell sizes","Different membrane potentials only"],"answer":0,"explanation":"Heat-map color differences represent relative expression levels of gene sets in the compared progenitors."},{"id":"s517","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":239,"q":"Which structure gives rise to embryonic stem-cell cultures?","options":["Trophoblast","Blastocoel","Zona pellucida only","Inner cell mass"],"answer":3,"explanation":"Embryonic stem cells are derived from the blastocyst's inner cell mass."},{"id":"s518","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":239,"q":"What is the fluid-filled cavity in a blastocyst called?","options":["Blastocoel","Nucleolus","Phagosome","Centromere"],"answer":0,"explanation":"The hollow cavity shown inside the blastocyst is the blastocoel."},{"id":"s519","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":239,"q":"Which cell layer surrounds the mammalian blastocyst in the diagram?","options":["Trophoblast","Mesoderm","Neural crest","Endothelium"],"answer":0,"explanation":"The outer cell layer of the blastocyst is labeled trophoblast."},{"id":"s520","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":240,"q":"What is the stated purpose of the XYClone laser in this context?","options":["Excision of the inner cell mass","Induction of gastrulation","Counting apoptotic bodies","Injection of bone marrow"],"answer":0,"explanation":"The slide labels the device for inner-cell-mass excision."},{"id":"s521","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":241,"q":"Which process transforms the blastula organization toward distinct germ layers?","options":["Clonal expansion","Gastrulation","Blastulation","Cytokinesis alone"],"answer":1,"explanation":"Gastrulation reorganizes embryonic cells and establishes germ layers."},{"id":"s522","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":241,"q":"Which three primary germ layers are established during mammalian gastrulation?","options":["Ectoderm, mesoderm, and endoderm","Epidermis, dermis, and hypodermis","Trophoblast, blastocoel, and chorion","Myeloid, lymphoid, and erythroid"],"answer":0,"explanation":"Gastrulation establishes ectoderm, mesoderm, and endoderm."},{"id":"s523","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":242,"q":"Classic transplantation experiments in embryology primarily test which property?","options":["Whether pRb binds E2F","Whether Annexin V binds PS","Whether cell fate is autonomous or environment-dependent","Whether cAMP is cyclic"],"answer":2,"explanation":"Moving embryonic cells reveals whether their developmental behavior persists in a new environment."},{"id":"s524","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":243,"q":"If transplanted cells continue their original spreading behavior in a new embryo, what is the strongest inference?","options":["Their genome has been deleted","They have become totipotent","They are undergoing necrosis","Their developmental state is stably determined"],"answer":3,"explanation":"Persistence despite a changed environment supports stable determination."},{"id":"s525","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":244,"q":"Which derivative is matched to the correct germ layer?","options":["Pancreas - endoderm","Retina - mesoderm","Bone - ectoderm","Spinal cord - endoderm"],"answer":0,"explanation":"The slide assigns digestive tract, liver, and pancreas to endoderm."},{"id":"s526","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":244,"q":"Which germ layer gives rise to the digestive tract, liver, and pancreas?","options":["Ectoderm","Mesoderm","Endoderm","Trophoblast"],"answer":2,"explanation":"The slide lists the digestive tract, liver, and pancreas as endoderm derivatives."},{"id":"s527","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":244,"q":"Which germ layer gives rise to bone, kidney, and the circulatory system?","options":["Ectoderm","Mesoderm","Endoderm","Inner cell mass"],"answer":1,"explanation":"Bone, kidney, and circulatory and lymphatic systems are listed as mesoderm derivatives."},{"id":"s528","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":245,"q":"Which experimental result supports the existence of rare regenerative cells in marrow?","options":["Survival falls as marrow dose rises","Survival rises with the number of injected marrow cells","All irradiated mice survive without injection","Differentiated erythrocytes form every tissue"],"answer":1,"explanation":"A marrow-cell dose-response is consistent with transplantable regenerative units."},{"id":"s529","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":245,"q":"In what year was the Till and McCulloch experiment shown performed?","options":["1951","1961","1971","1981"],"answer":1,"explanation":"The slide title identifies the Till and McCulloch experiment as occurring in 1961."},{"id":"s530","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":245,"q":"How were bone-marrow cells delivered to the irradiated mice?","options":["Oral feeding","Intravenous injection","Intramuscular injection","Inhalation"],"answer":1,"explanation":"The experimental diagram specifies intravenous injection of bone-marrow cells."},{"id":"s531","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":246,"q":"Where was the satellite cell observed in Mauro's experiment?","options":["Within bone marrow sinusoids","On the mitochondrial outer membrane","Adjacent to frog muscle fibers","Inside the blastocoel"],"answer":2,"explanation":"Transmission electron microscopy identified the small cell beside muscle tissue."},{"id":"s532","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":247,"q":"Which property distinguishes self-renewal from ordinary differentiation?","options":["Production of only terminally specialized cells","Permanent exit into G0 in every division","Loss of proliferative potential after one cycle","Production of daughter cells that retain stem-cell identity"],"answer":3,"explanation":"Self-renewal maintains the stem-cell pool."},{"id":"s533","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":247,"q":"Which term means that a stem cell can produce more stem cells like itself?","options":["Determination","Self-renewal","Gastrulation","Attenuation"],"answer":1,"explanation":"Self-renewal is the ability to generate additional stem cells."},{"id":"s534","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":247,"q":"What metabolic and proliferative state is associated with many tissue stem cells?","options":["Quiescent with low metabolic activity","Continuously mitotic with maximal metabolism","Apoptotic with membrane rupture","Terminally differentiated with no renewal capacity"],"answer":0,"explanation":"The slide describes stem cells as capable of quiescence, with no division and low metabolic activity."},{"id":"s535","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":248,"q":"Which pairing of scientist and experimental strategy is correct?","options":["Gurdon - somatic-cell nuclear transfer; Yamanaka - transcription-factor reprogramming","Gurdon - Annexin V staining; Yamanaka - bone-marrow transplantation","Gurdon - GPCR crystallography; Yamanaka - cyclin discovery","Gurdon - teratoma removal; Yamanaka - gastrulation imaging"],"answer":0,"explanation":"The Nobel recognized two routes demonstrating nuclear/cellular reprogramming."},{"id":"s536","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":248,"q":"Which two scientists shared the 2012 Nobel Prize highlighted on the slide?","options":["Till and McCulloch","Gurdon and Yamanaka","Watson and Crick","Bax and Bak"],"answer":1,"explanation":"John Gurdon and Shinya Yamanaka shared the 2012 prize for discoveries concerning cellular reprogramming."},{"id":"s537","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":249,"q":"Why was the one-nucleolus mutation useful in Gurdon's experiment?","options":["It served as a pluripotency factor","It marked descendants of the donor nucleus","It induced egg enucleation","It increased the transplantation rate"],"answer":1,"explanation":"The nucleolus phenotype tracked the genetic origin of resulting tadpoles."},{"id":"s538","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":249,"q":"From which differentiated tissue were Gurdon's donor nuclei obtained?","options":["Adult muscle fibers","Tadpole intestinal epithelium","Mouse embryonic fibroblasts","Bone-marrow stem cells"],"answer":1,"explanation":"The donor nuclei came from intestinal epithelial cells of feeding tadpoles."},{"id":"s539","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":249,"q":"What fraction of differentiated-cell nuclear transplants produced normal tadpoles on the slide?","options":["1.5% (10 of 726)","10% (72 of 726)","25% (182 of 726)","50% (363 of 726)"],"answer":0,"explanation":"The slide reports 10 normal tadpoles from 726 transplants, approximately 1.5%."},{"id":"s540","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":250,"q":"Which cell component from the adult donor was transferred to generate Dolly?","options":["A retroviral vector carrying OSKM","A bone-marrow stem-cell colony","A somatic-cell nucleus","A complete adult mammary cell with its membrane"],"answer":2,"explanation":"Dolly was made by transferring an adult somatic nucleus into an enucleated egg."},{"id":"s541","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":251,"q":"Which factor set is sufficient in the slide's minimum reprogramming combination?","options":["Rx, Pax6, Chx10, Mitf","BAX, BAK, BID, BIM","Cyclin E, Cyclin A, Cyclin B, CDK1","Oct3/4, Sox2, c-Myc, Klf4"],"answer":3,"explanation":"These four transcription factors form the OSKM reprogramming set."},{"id":"s542","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":251,"q":"What differentiated starting cell type was used in Yamanaka's experiment shown here?","options":["Mouse embryonic fibroblasts","Human erythrocytes","Xenopus intestinal cells","Mouse oocytes"],"answer":0,"explanation":"The source cells shown are mouse embryonic fibroblasts."},{"id":"s543","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":251,"q":"How many candidate genes were initially screened using retroviral delivery?","options":["4","12","24","48"],"answer":2,"explanation":"The slide states that 24 candidate genes were initially used to search for reprogramming factors."},{"id":"s544","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":252,"q":"If removing candidate factor 14 leaves colony number unchanged, what does that result suggest under the tested conditions?","options":["Factor 14 is not essential in that mixture","Factor 14 alone is sufficient","Factor 14 destroys all colonies","The assay cannot measure reprogramming"],"answer":0,"explanation":"A factor whose removal does not reduce colonies is dispensable in that tested combination."},{"id":"s545","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":252,"q":"What assay readout was used to judge successful reprogramming combinations?","options":["Number of colonies","Number of chromosomes lost","Amount of cytochrome c released","Frequency of membrane blebs"],"answer":0,"explanation":"The graphs compare colony number after testing different factor combinations."},{"id":"s546","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":252,"q":"What general strategy narrowed the original candidate set to four factors?","options":["Systematic factor removal and reduced combinations","Random chromosome deletion","Protein purification from mitochondria","Selection by antibiotic resistance alone"],"answer":0,"explanation":"Factors were removed and smaller combinations tested to identify those required for colony formation."},{"id":"s547","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":253,"q":"Which test answers whether candidate iPSCs can generate derivatives of multiple germ layers?","options":["Propidium-iodide cell-cycle analysis","Teratoma formation","Karyotyping","Annexin-V staining"],"answer":1,"explanation":"A teratoma containing varied tissues is a functional multilineage differentiation assay."},{"id":"s548","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":253,"q":"What does a normal karyotype establish about candidate iPSCs?","options":["They have grossly normal chromosome number and structure","They can form every germ layer","They are free of all point mutations","They beat like cardiomyocytes"],"answer":0,"explanation":"Karyotyping checks chromosome number and major structural integrity."},{"id":"s549","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":253,"q":"Why is teratoma formation used alongside karyotyping?","options":["It tests multilineage differentiation rather than chromosome integrity","It measures GPCR activity","It counts apoptotic bodies","It proves the absence of all tumors"],"answer":0,"explanation":"The two assays answer different questions: karyotype checks chromosomes, while teratoma tissues demonstrate broad differentiation."},{"id":"s550","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":254,"q":"Which application specifically depends on retaining a patient's genetic background?","options":["Measurement of GPCR helix number","Detection of metaphase chromosomes only","Patient-specific disease modeling","Production of universal bacterial vaccines"],"answer":2,"explanation":"Patient-derived iPSCs carry the donor genotype for disease modeling and drug testing."},{"id":"s551","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":254,"q":"Which technology is proposed for correcting disease-causing mutations in patient-derived iPSCs?","options":["FRET","CRISPR/Cas9","Annexin V staining","Propidium iodide"],"answer":1,"explanation":"The slide proposes combining iPSCs with CRISPR/Cas9 for gene correction."},{"id":"s552","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":254,"q":"What enables drug screening directly on a disease-relevant target cell type?","options":["Directed differentiation of patient-derived iPSCs","Removal of all reprogramming factors","Whole-body irradiation","Blocking clonal expansion"],"answer":0,"explanation":"Patient iPSCs can be directed into the relevant cell type and used for large-scale drug screening."},{"id":"s553","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":255,"q":"Which treatment was used to promote expression of the retinal-field gene Rx?","options":["Annexin V","Staurosporine","TNF","Activin"],"answer":3,"explanation":"The slide states that Activin was used to induce Rx expression."},{"id":"s554","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":255,"q":"How were Rx-positive cells visualized in the optic-cup culture?","options":["Annexin V positivity","GFP fluorescence","Propidium iodide staining","Cytochrome c diffusion"],"answer":1,"explanation":"Rx-positive cells appear GFP-positive in the culture."},{"id":"s555","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":255,"q":"Which matrix proteins are named as an alternative to Matrigel in the culture conditions?","options":["Laminin and entactin","Actin and myosin","Collagen and keratin","BAX and BAK"],"answer":0,"explanation":"The slide names laminin plus entactin as matrix proteins used in the low-serum culture."},{"id":"s556","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":256,"q":"At what approximate time does the Rx-positive structure display the characteristic optic-cup shape?","options":["Day 9","Day 1","Day 5","Day 16"],"answer":0,"explanation":"The Day 9 panels show the cup-shaped morphology."},{"id":"s557","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":256,"q":"Which fluorescent marker identifies the developing vesicles in the time-course images?","options":["Rx-GFP","Annexin-V-PE","PI-DNA","BCL-2-YFP"],"answer":0,"explanation":"The green signal is labeled Rx-GFP and marks retinal-field identity."},{"id":"s558","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":257,"q":"Which marker most specifically identifies the neural-retina progenitor side in the slide?","options":["Connexin 43","Chx10","Mitf","Otx2"],"answer":1,"explanation":"Chx10 is listed with Rx and Pax6 in the distal neural-retina layer; Mitf/Otx2 characterize the RPE side."},{"id":"s559","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":257,"q":"Which region of the spherical vesicle invaginates to form neural-retina tissue?","options":["Distal portion","Proximal outer shell","Central lumen only","Entire vesicle uniformly"],"answer":0,"explanation":"The distal portion invaginates and expresses neural-retina markers."},{"id":"s560","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":257,"q":"Which marker pair supports retinal pigment epithelium identity in the outer epithelium?","options":["Mitf and Otx2","Chx10 and caspase-9","TRADD and FADD","Oct3/4 and c-Myc"],"answer":0,"explanation":"The outer epithelium expresses RPE-associated markers including Mitf and Otx2."},{"id":"s561","kind":"mcq","topics":["Stem Cells and Differentiation"],"page":258,"q":"Which topic is the cited Karp reference intended to expand?","options":["Hematopoiesis","Clonal selection","Apoptosis","Optic-cup morphogenesis"],"answer":2,"explanation":"The reference text explicitly says it is for details on apoptosis."},{"id":"s562","kind":"mcq","topics":["Host Pathogen Interaction"],"page":259,"q":"Which new lecture begins on page 259?","options":["Stem-cell reprogramming","Cellular signaling","Bioenergetics","Host-pathogen interaction"],"answer":3,"explanation":"The title slide marks the start of host-pathogen interaction."},{"id":"s563","kind":"mcq","topics":["Host Pathogen Interaction"],"page":260,"q":"Which organ shown is the principal adult site of hematopoiesis?","options":["Bone marrow","Thymus","Spleen","Tonsils"],"answer":0,"explanation":"Adult blood-cell production occurs mainly in bone marrow; the other labeled organs are lymphoid sites."},{"id":"s564","kind":"mcq","topics":["Host Pathogen Interaction"],"page":260,"q":"Which organ is specifically important for T-cell maturation?","options":["Thymus","Spleen","Bone marrow","Tonsil"],"answer":0,"explanation":"T-cell precursors mature in the thymus."},{"id":"s565","kind":"mcq","topics":["Host Pathogen Interaction"],"page":261,"q":"A marrow precursor gives rise to neutrophils, monocytes, erythrocytes, and megakaryocytes but not T cells. Which labeled progenitor matches it?","options":["Common lymphoid progenitor","Plasma cell","Natural killer cell","Common myeloid progenitor"],"answer":3,"explanation":"The lineage diagram places those four outputs under the common myeloid progenitor; T cells arise from the lymphoid branch."},{"id":"s566","kind":"mcq","topics":["Host Pathogen Interaction"],"page":261,"q":"Which mature cell is derived from the common lymphoid progenitor rather than the common myeloid progenitor?","options":["Megakaryocyte","Neutrophil","Natural killer cell","Monocyte"],"answer":2,"explanation":"Natural killer cells share the common lymphoid progenitor with B and T cells; megakaryocytes, neutrophils, and monocytes are myeloid."},{"id":"s567","kind":"mcq","topics":["Host Pathogen Interaction"],"page":261,"q":"Which precursor-product relationship is shown in the blood-cell lineage tree?","options":["B cell → neutrophil","Megakaryocyte → erythrocyte","T cell → mast cell","Monocyte → macrophage"],"answer":3,"explanation":"Circulating monocytes can enter tissues and differentiate into macrophages."},{"id":"s568","kind":"mcq","topics":["Host Pathogen Interaction"],"page":262,"q":"Which source-product pairing is shown for a soluble innate immune component?","options":["Skin - immunoglobulin synthesis","Lymphatic vessel - lysozyme synthesis","Liver - complement proteins","Bone marrow - gastric HCl"],"answer":2,"explanation":"The slide identifies the liver as a source of complement proteins."},{"id":"s569","kind":"mcq","topics":["Host Pathogen Interaction"],"page":262,"q":"Which organ is identified as a major source of complement proteins?","options":["Spleen","Bone marrow","Thymus","Liver"],"answer":3,"explanation":"The liver synthesizes many circulating complement proteins."},{"id":"s570","kind":"mcq","topics":["Host Pathogen Interaction"],"page":263,"q":"After excess interstitial fluid enters the green vessels in the diagram, what is it called?","options":["Cytosol","Lymph","Plasma","Serum"],"answer":1,"explanation":"Interstitial fluid becomes lymph after entering lymphatic capillaries."},{"id":"s571","kind":"mcq","topics":["Host Pathogen Interaction"],"page":263,"q":"Which structure filters lymph and provides a site for immune-cell encounters?","options":["Renal glomerulus","Lymph node","Artery","Bone marrow sinusoid"],"answer":1,"explanation":"Lymph nodes filter lymph and organize interactions among antigens and immune cells."},{"id":"s572","kind":"mcq","topics":["Host Pathogen Interaction"],"page":264,"q":"Which classification correctly matches the two branches in the overview?","options":["Innate: nonspecific; adaptive: specific","Innate: specific; adaptive: nonspecific","Innate: memory-forming only; adaptive: no memory","Innate: second line only; adaptive: first line only"],"answer":0,"explanation":"The overview labels innate immunity nonspecific and adaptive immunity specific."},{"id":"s573","kind":"mcq","topics":["Host Pathogen Interaction"],"page":265,"q":"A response begins slowly after first exposure but is faster on re-exposure to the same antigen. Which arm accounts for both properties?","options":["Innate immunity","Mechanical barrier defense","Normal flora","Adaptive immunity"],"answer":3,"explanation":"A lag and immunological memory are paired features of adaptive immunity."},{"id":"s574","kind":"mcq","topics":["Host Pathogen Interaction"],"page":265,"q":"Which property belongs to innate immunity rather than adaptive immunity?","options":["Antigen-specific memory","A lag during first exposure","Broad recognition with little time lag","Clonal expansion of specific lymphocytes"],"answer":2,"explanation":"Innate immunity responds rapidly and recognizes broad microbial patterns rather than specific antigens."},{"id":"s575","kind":"mcq","topics":["Host Pathogen Interaction"],"page":266,"q":"Which pair occupies the two adaptive branches at the right of the response map?","options":["Skin and mucous membranes","Inflammation and natural killer cells","Antibodies and cytotoxic lymphocytes","Complement and neutrophils"],"answer":2,"explanation":"The adaptive arm divides into humoral antibody and cell-mediated cytotoxic-lymphocyte responses."},{"id":"s576","kind":"mcq","topics":["Host Pathogen Interaction"],"page":266,"q":"Which component is classified as an internal innate defense on the response map?","options":["Mucous membrane","Natural killer cell","Cytotoxic T lymphocyte","Antibody"],"answer":1,"explanation":"Natural killer cells are internal innate effectors; antibodies and cytotoxic lymphocytes are adaptive."},{"id":"s577","kind":"mcq","topics":["Host Pathogen Interaction"],"page":266,"q":"Which pairing correctly matches an adaptive branch with its principal effector?","options":["Cell-mediated response—complement","Cell-mediated response—mucus","Humoral response—antibodies","Humoral response—NK cells"],"answer":2,"explanation":"The humoral adaptive response is mediated by antibodies, whereas the cell-mediated branch uses cytotoxic lymphocytes."},{"id":"s578","kind":"mcq","topics":["Host Pathogen Interaction"],"page":267,"q":"In the fortress analogy, what event must occur before internal innate defenses become relevant?","options":["Release of bacterial endotoxin","Breach of an external barrier","Class switching by B cells","Formation of memory cells"],"answer":1,"explanation":"The wall represents external innate defenses that must be breached before internal defenses confront the invader."},{"id":"s579","kind":"mcq","topics":["Host Pathogen Interaction"],"page":268,"q":"Failure of ciliary beating would most directly impair which barrier mechanism?","options":["Mucociliary clearance","Gastric acidification","Complement activation","Normal-flora antagonism"],"answer":0,"explanation":"Cilia propel mucus and trapped particles upward in the mucociliary escalator."},{"id":"s580","kind":"mcq","topics":["Host Pathogen Interaction"],"page":268,"q":"Which mechanical defense removes inhaled particles from the respiratory tract?","options":["Normal flora antagonism","Gastric acid","Mucociliary escalator","Complement cascade"],"answer":2,"explanation":"Coordinated ciliary movement transports mucus and trapped particles out of the airways."},{"id":"s581","kind":"mcq","topics":["Host Pathogen Interaction"],"page":269,"q":"Which pairing is inconsistent with the chemical-barrier slide?","options":["HCl - low gastric pH","Antimicrobial peptides - sweat","Lysozyme - tears","Lysozyme - stomach acidification"],"answer":3,"explanation":"HCl, not lysozyme, creates the low pH of the stomach."},{"id":"s582","kind":"mcq","topics":["Host Pathogen Interaction"],"page":269,"q":"Which antimicrobial enzyme is found in both tears and saliva?","options":["Collagenase","Coagulase","Lysozyme","Streptokinase"],"answer":2,"explanation":"Lysozyme in tears and saliva damages susceptible bacterial cell walls."},{"id":"s583","kind":"mcq","topics":["Host Pathogen Interaction"],"page":270,"q":"Resident bacteria prevent a pathogen from establishing by consuming the same nutrient. Which labeled barrier principle is this?","options":["Opsonization","Cytotoxicity","Antagonism by normal flora","Chemotaxis"],"answer":2,"explanation":"Competition for nutrients and space by normal flora is described as antagonism."},{"id":"s584","kind":"mcq","topics":["Host Pathogen Interaction"],"page":270,"q":"Normal flora protect a body surface primarily by competing with pathogens for:","options":["Nutrients and space","Caspases and cytokines","Oxygen and erythrocytes","Antibodies and complement"],"answer":0,"explanation":"Competition for nutrients and attachment space creates antagonism or colonization resistance."},{"id":"s585","kind":"mcq","topics":["Host Pathogen Interaction"],"page":271,"q":"A pathogen has crossed mucus but adaptive immunity has not yet developed. Which listed defense can act immediately inside tissue?","options":["Antigen-specific cytotoxic clones","Phagocytic cells","Memory B cells","High-affinity antibodies from recall"],"answer":1,"explanation":"Phagocytic cells are internal innate defenses and do not require clonal priming."},{"id":"s586","kind":"mcq","topics":["Host Pathogen Interaction"],"page":272,"q":"The breached-wall image marks the handoff from which defense category to which category?","options":["External innate to internal innate","Adaptive humoral to mechanical","Cell-mediated to normal flora","Memory to primary response"],"answer":0,"explanation":"Once external barriers fail, internal innate defenses engage the invader."},{"id":"s587","kind":"mcq","topics":["Host Pathogen Interaction"],"page":273,"q":"Which component belongs in the extracellular plasma bracket rather than the WBC fraction?","options":["Neutrophil","Monocyte","Natural killer cell","Complement protein"],"answer":3,"explanation":"Complement is soluble in plasma; the other options are leukocytes."},{"id":"s588","kind":"mcq","topics":["Host Pathogen Interaction"],"page":273,"q":"Which listed blood component functions mainly as an intercellular communication signal?","options":["Erythrocyte","Platelet","Coagulation protein","Cytokine"],"answer":3,"explanation":"Cytokines are secreted signals that coordinate immune-cell behavior."},{"id":"s589","kind":"mcq","topics":["Host Pathogen Interaction"],"page":274,"q":"Which labeled leukocyte is identified by a multilobed nucleus and fine cytoplasmic granules?","options":["Lymphocyte","Mast cell","Neutrophil","Monocyte"],"answer":2,"explanation":"The neutrophil drawing shows the characteristic multilobed nucleus."},{"id":"s590","kind":"mcq","topics":["Host Pathogen Interaction"],"page":274,"q":"Which pair consists mainly of adaptive immune lymphocytes?","options":["Mast cells and neutrophils","B cells and T cells","Macrophages and mast cells","NK cells and macrophages"],"answer":1,"explanation":"B and T lymphocytes are the principal cellular components of adaptive immunity."},{"id":"s591","kind":"mcq","topics":["Host Pathogen Interaction"],"page":274,"q":"Which white blood cell is strongly associated with release of mediators that promote inflammation?","options":["Erythrocyte","Mast cell","Platelet","Plasma cell"],"answer":1,"explanation":"Mast cells release inflammatory mediators and are important in immediate inflammatory responses."},{"id":"s592","kind":"mcq","topics":["Host Pathogen Interaction"],"page":275,"q":"A newly infected tissue recruits the most abundant circulating WBC as a primary responder. Which cell is expected?","options":["Natural killer cell","Neutrophil","Basophil","Monocyte"],"answer":1,"explanation":"Neutrophils are shown as roughly 50-60% of WBCs and rapid primary-response phagocytes."},{"id":"s593","kind":"mcq","topics":["Host Pathogen Interaction"],"page":275,"q":"Approximately what fraction of circulating white blood cells is made up of neutrophils according to the slide?","options":["15–25%","50–60%","80–90%","2–10%"],"answer":1,"explanation":"The slide identifies neutrophils as the most abundant WBC population at roughly 50–60%."},{"id":"s594","kind":"mcq","topics":["Host Pathogen Interaction"],"page":276,"q":"A neutrophil detects increasing chemoattractant concentrations toward a wound. Its net movement should be:","options":["Up the concentration gradient","Down the concentration gradient","Independent of the gradient","Restricted to the bloodstream"],"answer":0,"explanation":"Positive chemotaxis directs movement toward higher chemoattractant concentration."},{"id":"s595","kind":"mcq","topics":["Host Pathogen Interaction"],"page":277,"q":"Which observation best distinguishes the filmed behavior as chemotaxis rather than random motility?","options":["Repeated engulfment without displacement","Symmetric membrane blebbing in all directions","Loss of all cell polarity","Persistent movement toward a localized chemical source"],"answer":3,"explanation":"Chemotaxis is directional migration toward a chemical source."},{"id":"s596","kind":"mcq","topics":["Host Pathogen Interaction"],"page":278,"q":"Which sequence best operationalizes phagocytosis by a neutrophil?","options":["Adhesion, mitosis, memory formation","Lysis, antigen rearrangement, exocytosis","Recognition, engulfment, intracellular digestion","Secretion, diffusion, antibody synthesis"],"answer":2,"explanation":"Phagocytes find/recognize, engulf, and digest microbes."},{"id":"s597","kind":"mcq","topics":["Host Pathogen Interaction"],"page":279,"q":"In the micrograph, bacterial enclosure by the neutrophil must occur before formation of which compartment?","options":["Extracellular trap","Phagosome","Nucleus","Golgi cisterna"],"answer":1,"explanation":"Engulfment encloses the bacterium in a membrane-bound phagosome."},{"id":"s598","kind":"mcq","topics":["Host Pathogen Interaction"],"page":280,"q":"Which event immediately converts a microbe-containing phagosome into the main digestive compartment?","options":["Fusion with a lysosome","Binding to a B-cell receptor","Release through exocytosis","Division of the phagocyte"],"answer":0,"explanation":"Phagosome-lysosome fusion creates the phagolysosomal digestive compartment."},{"id":"s599","kind":"mcq","topics":["Host Pathogen Interaction"],"page":280,"q":"What is the membrane-bound compartment formed immediately after a phagocyte engulfs a microbe?","options":["Proteasome","Inflammasome","Apoptosome","Phagosome"],"answer":3,"explanation":"Engulfment encloses the microbe in a phagosome."},{"id":"s600","kind":"mcq","topics":["Host Pathogen Interaction"],"page":280,"q":"Where does most enzymatic killing and digestion of an engulfed bacterium occur?","options":["Extracellular matrix","Phagolysosome","Nucleus","Golgi cisterna"],"answer":1,"explanation":"Fusion of the phagosome with lysosomal/granule compartments creates the degradative phagolysosome."},{"id":"s601","kind":"mcq","topics":["Host Pathogen Interaction"],"page":281,"q":"A neutrophil forms phagosomes normally but cannot deliver granule contents. Which function is most directly lost?","options":["Chemotactic gradient detection","Production of erythrocytes","Antigen-specific memory","Intracellular microbial killing"],"answer":3,"explanation":"Granules supply digestive enzymes and antimicrobial proteins to the microbe-containing compartment."},{"id":"s602","kind":"mcq","topics":["Host Pathogen Interaction"],"page":281,"q":"Neutrophil granules principally store which class of effector molecules?","options":["Digestive enzymes and antimicrobial proteins","Steroid hormones and glycogen","Antibodies and MHC molecules","DNA polymerases and histones"],"answer":0,"explanation":"Granules provide rapidly deployable enzymes and antimicrobial proteins for microbial killing."},{"id":"s603","kind":"mcq","topics":["Host Pathogen Interaction"],"page":282,"q":"Which outcome shows that neutrophils do more than directly ingest bacteria?","options":["Production of gastric acid","Generation of antigen receptors by gene rearrangement","Recruitment/activation of other immune responses by inflammatory mediators","Differentiation into plasma cells"],"answer":2,"explanation":"The slide emphasizes inflammatory signaling and links to adaptive immunity."},{"id":"s604","kind":"mcq","topics":["Host Pathogen Interaction"],"page":283,"q":"Which step occurs after firm adhesion but before neutrophil effector release in the vessel diagram?","options":["Hematopoietic differentiation","Transmigration across endothelium","Rolling on selectins","Initial tethering"],"answer":1,"explanation":"The displayed recruitment order proceeds from rolling to adhesion to transmigration, then tissue effector actions."},{"id":"s605","kind":"mcq","topics":["Host Pathogen Interaction"],"page":283,"q":"The structural scaffold of a neutrophil extracellular trap is primarily:","options":["DNA","Peptidoglycan","Phospholipid","Collagen"],"answer":0,"explanation":"NETs are extracellular DNA-rich webs decorated with antimicrobial proteins."},{"id":"s606","kind":"mcq","topics":["Host Pathogen Interaction"],"page":283,"q":"What is the immediate defensive function of a NET?","options":["Activate erythrocyte production","Digest host collagen","Generate antigen-specific antibodies","Trap microbes extracellularly"],"answer":3,"explanation":"NETs immobilize microbes and concentrate antimicrobial molecules around them."},{"id":"s607","kind":"mcq","topics":["Host Pathogen Interaction"],"page":284,"q":"Which tissue-cell relationship is supported by the differentiation arrows?","options":["Circulating monocyte becomes tissue macrophage","Neutrophil becomes natural killer cell","B cell becomes monocyte","Macrophage becomes erythrocyte"],"answer":0,"explanation":"Monocytes migrate into tissues and differentiate into macrophages."},{"id":"s608","kind":"mcq","topics":["Host Pathogen Interaction"],"page":284,"q":"Approximately what percentage of circulating WBCs is represented by monocytes on the slide?","options":["70–80%","2–10%","20–30%","50–60%"],"answer":1,"explanation":"The slide gives monocytes as approximately 2–10% of WBCs."},{"id":"s609","kind":"mcq","topics":["Host Pathogen Interaction"],"page":284,"q":"What happens to many monocytes a
