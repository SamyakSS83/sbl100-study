tion."},{"id":"s820","kind":"mcq","topics":["Drug Development 2"],"page":367,"q":"Which product is generated directly from angiotensin I by ACE in the diagram?","options":["Angiotensin 1-5","Angiotensin II","Angiotensin 1-7","Angiotensin IV"],"answer":1,"explanation":"The left branch labels ACE conversion of angiotensin I to angiotensin II."},{"id":"s821","kind":"mcq","topics":["Drug Development 2"],"page":367,"q":"ACE converts angiotensin I into:","options":["Angiotensinogen","Angiotensin II","Renin","Aldosterone"],"answer":1,"explanation":"Angiotensin-converting enzyme generates angiotensin II from angiotensin I."},{"id":"s822","kind":"mcq","topics":["Drug Development 2"],"page":368,"q":"What property distinguished captopril from the venom peptide lead teprotide?","options":["Oral bioavailability","Nine-amino-acid length","Isolation directly from venom","Lack of ACE inhibition"],"answer":0,"explanation":"Captopril is identified as the first orally bioavailable ACE inhibitor."},{"id":"s823","kind":"mcq","topics":["Drug Development 2"],"page":368,"q":"Teprotide was originally isolated from the venom of:","options":["Naja naja","Dendroaspis polylepis","Crotalus atrox","Bothrops jararaca"],"answer":3,"explanation":"The slide identifies the Brazilian pit viper Bothrops jararaca as the source."},{"id":"s824","kind":"mcq","topics":["Drug Development 2"],"page":368,"q":"Teprotide is best described as a:","options":["Monoclonal antibody","Nucleoside analog","Nonapeptide ACE inhibitor","Steroid receptor agonist"],"answer":2,"explanation":"Teprotide is a nine-residue peptide that inhibits ACE."},{"id":"s825","kind":"mcq","topics":["Drug Development 2"],"page":369,"q":"Which captopril functional group coordinates the ACE Zn2+ most directly?","options":["Carboxylate","Amide carbonyl","Methyl group","Thiol"],"answer":3,"explanation":"The diagram draws the sulfur-containing thiol at the zinc-binding site."},{"id":"s826","kind":"mcq","topics":["Drug Development 2"],"page":369,"q":"Which interaction of captopril is stated to be essential for ACE-inhibitory activity?","options":["Hydrogen bonding to ATP","Coordination with Zn2+","Covalent binding to DNA","Chelation of Ca2+"],"answer":1,"explanation":"Coordination of the catalytic zinc ion is essential for activity."},{"id":"s827","kind":"mcq","topics":["Drug Development 2"],"page":369,"q":"Captopril's carboxylate interacts with ACE through:","options":["Ionic and hydrogen-bond interactions","Disulfide bonds only","Peptide bonds","Base pairing"],"answer":0,"explanation":"The carboxylate forms both ionic and hydrogen-bond contacts in the active site."},{"id":"s828","kind":"mcq","topics":["Drug Development 2"],"page":370,"q":"Which compound shown is the ester prodrug of enalaprilat?","options":["Quinaprilat","Captopril","Enalapril","Lisinopril"],"answer":2,"explanation":"Enalapril is the esterified prodrug paired with active enalaprilat."},{"id":"s829","kind":"mcq","topics":["Drug Development 2"],"page":370,"q":"Which zinc-binding group is stated to bind Zn2+ more strongly than carboxylate or phosphate?","options":["Amide","Methyl","Ether","Thiol"],"answer":3,"explanation":"The SAR slide identifies thiol as the strongest of the three zinc-binding groups shown."},{"id":"s830","kind":"mcq","topics":["Drug Development 2"],"page":370,"q":"Esterification of an acidic ACE-inhibitor group is used primarily to create a:","options":["Radiotracer","Metal complex","Prodrug","Protein conjugate"],"answer":2,"explanation":"Masking carboxylate or phosphate as an ester can improve delivery and create a prodrug."},{"id":"s831","kind":"mcq","topics":["Drug Development and Techniques"],"page":371,"q":"Which pair of themes is announced for Lecture 36?","options":["Stem cells and microbial pathogenesis","Drug development and biochemical/biophysical techniques","Cancer incidence and immunology","Bioenergetics and genetics"],"answer":1,"explanation":"Both themes are printed on the title slide."},{"id":"s832","kind":"mcq","topics":["Drug Development and Techniques"],"page":372,"q":"What should happen immediately after a computational final hit list is produced?","options":["Test hits in a biological assay","Declare regulatory approval","Begin Phase III trials","Discard molecular structures"],"answer":0,"explanation":"The flowchart sends the final hit list to a biological assay."},{"id":"s833","kind":"mcq","topics":["Drug Development and Techniques"],"page":372,"q":"Which step experimentally tests the final hit list from virtual screening?","options":["Tablet coating","Biological assay","File compression","Patent search"],"answer":1,"explanation":"Computational predictions must be validated in a biological assay."},{"id":"s834","kind":"mcq","topics":["Drug Development and Techniques"],"page":372,"q":"Which pair represents the two main virtual-screening routes shown?","options":["Structure-based and ligand-based","Clinical and preclinical","Oral and intravenous","Genetic and epigenetic"],"answer":0,"explanation":"Both structure-based and ligand-based workflows converge on a filtered hit list."},{"id":"s835","kind":"mcq","topics":["Drug Development and Techniques"],"page":373,"q":"Which step directly precedes structure-activity relationship analysis in the workflow?","options":["Primary screen","Clinical trials","Biological target selection","Confirmed hits"],"answer":3,"explanation":"The funnel places confirmed hits immediately before SAR and medicinal chemistry."},{"id":"s836","kind":"mcq","topics":["Drug Development and Techniques"],"page":373,"q":"Why are secondary assays performed after a primary HTS?","options":["To manufacture tablets","To recruit trial participants","To calculate drug price","To confirm hits and remove artifacts"],"answer":3,"explanation":"Secondary and counter screens test reproducibility and eliminate nonspecific or artifactual activity."},{"id":"s837","kind":"mcq","topics":["Drug Development and Techniques"],"page":373,"q":"Dose-response analysis is performed after:","options":["Phase III completion","Commercial packaging","Hit confirmation","Regulatory approval"],"answer":2,"explanation":"Confirmed hits are characterized by dose-response before lead selection and optimization."},{"id":"s838","kind":"mcq","topics":["Drug Development and Techniques"],"page":374,"q":"What is the characteristic follow-up problem after a phenotypic hit is found?","options":["Obtaining a target structure before screening","Avoiding all cell-based assays","Identifying the compound's molecular target","Measuring whether any phenotype occurred"],"answer":2,"explanation":"Phenotypic screening can find active compounds before their targets are known, requiring target deconvolution."},{"id":"s839","kind":"mcq","topics":["Drug Development and Techniques"],"page":374,"q":"Phenotypic screening starts by selecting compounds that produce:","options":["A specific patent classification","A desired observable biological effect","A predetermined docking score only","A known protein crystal structure"],"answer":1,"explanation":"The screen begins from a cellular or organismal phenotype rather than a predefined molecular target."},{"id":"s840","kind":"mcq","topics":["Drug Development and Techniques"],"page":374,"q":"Identifying the molecular target after finding a phenotypic hit is called:","options":["Target deconvolution","Lead formulation","Dose escalation","First-pass metabolism"],"answer":0,"explanation":"Target deconvolution is the later task of discovering what molecule caused the observed phenotype."},{"id":"s841","kind":"mcq","topics":["Drug Development and Techniques"],"page":375,"q":"Which compound in the slide shows the larger mutant-versus-wild-type selectivity ratio?","options":["The data do not include wild-type EC50 values","ML162","ML210","They are identical"],"answer":1,"explanation":"ML162 compares 25 nM with 578 nM, a larger fold difference than 71 nM versus 272 nM for ML210."},{"id":"s842","kind":"mcq","topics":["Drug Development and Techniques"],"page":375,"q":"RAS mutations are found in approximately what fraction of human cancers according to the slide?","options":["10%","30%","80%","3%"],"answer":1,"explanation":"The slide states that RAS oncogenic mutations occur in about 30% of human cancers."},{"id":"s843","kind":"mcq","topics":["Drug Development and Techniques"],"page":375,"q":"For the compound with EC50 values of 25 nM in HRASG12V and 578 nM in HRASWT, which cells are more sensitive?","options":["Both equally","Sensitivity cannot be inferred","HRASWT cells","HRASG12V cells"],"answer":3,"explanation":"A lower EC50 indicates higher potency, so the mutant cells are more sensitive."},{"id":"s844","kind":"mcq","topics":["Drug Development and Techniques"],"page":376,"q":"Inhibition of which protein by ML162 removes a glutathione-dependent defense against ferroptosis?","options":["GPX4","ACSL4","LPCAT3","TFRC1"],"answer":0,"explanation":"The structure panel labels ML162 at GPX4, which detoxifies lipid hydroperoxides using glutathione."},{"id":"s845","kind":"mcq","topics":["Drug Development and Techniques"],"page":376,"q":"System Xc- supports ferroptosis resistance by supplying cystine for synthesis of:","options":["Heme","Glutathione","Cholesterol","Glycogen"],"answer":1,"explanation":"Imported cystine supports glutathione synthesis, which GPX4 uses to detoxify lipid hydroperoxides."},{"id":"s846","kind":"mcq","topics":["Drug Development and Techniques"],"page":376,"q":"Which two pathways are shown as glutathione-independent antioxidant defenses against ferroptosis?","options":["FSP1-CoQ and DHFR-BH4","RAS-MAPK and PI3K-AKT","PD-1-PD-L1 and MHC-TCR","Renin-ACE and aldosterone"],"answer":0,"explanation":"The diagram shows FSP1-CoQ and DHFR-BH4 as parallel antioxidant systems."},{"id":"s847","kind":"mcq","topics":["Drug Development and Techniques"],"page":377,"q":"Which problem is most directly addressed by masking a polar group to improve membrane crossing?","options":["Short patent life","Target mutation","High receptor selectivity","Poor membrane permeability"],"answer":3,"explanation":"Poor membrane permeability is one of the explicit prodrug rationales."},{"id":"s848","kind":"mcq","topics":["Drug Development and Techniques"],"page":377,"q":"A prodrug is converted in the body into:","options":["A placebo","A receptor","A dietary nutrient","An active drug"],"answer":3,"explanation":"A prodrug is an inactive or less active derivative designed to release the active drug in vivo."},{"id":"s849","kind":"mcq","topics":["Drug Development and Techniques"],"page":377,"q":"Which undesirable property can prodrug design be used to reduce?","options":["Protein sequence length","Chromosome number","Poor solubility","Target specificity in every case"],"answer":2,"explanation":"Prodrugs can improve solubility, permeability, stability, toxicity, taste, or duration."},{"id":"s850","kind":"mcq","topics":["Drug Development and Techniques"],"page":378,"q":"Which activation mechanism does not require an enzyme?","options":["Peptidase cleavage","Phosphatase cleavage","Photochemical activation by light","Esterase cleavage"],"answer":2,"explanation":"Light is listed under chemical activation, whereas the other choices are enzymes."},{"id":"s851","kind":"mcq","topics":["Drug Development and Techniques"],"page":378,"q":"Which enzyme class can activate an ester prodrug?","options":["Topoisomerase","Esterase","Polymerase","Helicase"],"answer":1,"explanation":"Esterases are among the enzyme classes listed for prodrug activation."},{"id":"s852","kind":"mcq","topics":["Drug Development and Techniques"],"page":378,"q":"Which is a chemical trigger for prodrug activation rather than an enzyme?","options":["Peptidase","Phosphatase","Decarboxylation","Esterase"],"answer":2,"explanation":"Decarboxylation, hydrolysis, and light are listed as chemical activation mechanisms."},{"id":"s853","kind":"mcq","topics":["Drug Development and Techniques"],"page":379,"q":"Why does chloramphenicol palmitate taste less bitter than chloramphenicol?","options":["It permanently destroys the active drug","It dissolves less in the mouth","It binds taste receptors more strongly","It is more water soluble"],"answer":1,"explanation":"Reduced aqueous solubility limits oral dissolution and taste-receptor contact."},{"id":"s854","kind":"mcq","topics":["Drug Development and Techniques"],"page":380,"q":"Why can fluorescence fall after the TSA curve reaches its maximum?","options":["Aggregated protein releases or excludes the dye","The protein refolds completely at higher temperature","SYPRO Orange becomes a covalent ligand","All hydrophobic surfaces become more exposed indefinitely"],"answer":0,"explanation":"The slide links the post-peak decline to aggregation and dye dissociation."},{"id":"s855","kind":"mcq","topics":["Drug Development and Techniques"],"page":380,"q":"SYPRO Orange fluorescence rises during protein unfolding because the dye binds exposed:","options":["Phosphate groups","DNA bases","Metal ions","Hydrophobic surfaces"],"answer":3,"explanation":"Unfolding exposes hydrophobic regions that bind SYPRO Orange."},{"id":"s856","kind":"mcq","topics":["Drug Development and Techniques"],"page":380,"q":"In a thermal shift assay, Tm is the:","options":["Highest fluorescence value in every curve","Temperature of protein synthesis","Temperature of the unfolding-transition midpoint","Temperature at which heating begins"],"answer":2,"explanation":"Tm is obtained from the midpoint of the thermal unfolding transition."},{"id":"s857","kind":"mcq","topics":["Drug Development and Techniques"],"page":381,"q":"Which plotted feature should be used to identify the Tm most precisely?","options":["Initial fluorescence at 10 C","Maximum raw fluorescence amplitude only","Final fluorescence at 100 C","Peak of the derivative curve"],"answer":3,"explanation":"The derivative maximum marks the steepest transition and is used to locate Tm."},{"id":"s858","kind":"mcq","topics":["Drug Development and Techniques"],"page":381,"q":"When comparing RecA stability across pH conditions, a derivative peak farther to the right indicates:","options":["Greater fluorescence without unfolding","Lower Tm and lower stability","Higher Tm and greater stability","More protein but unchanged stability"],"answer":2,"explanation":"A transition at a higher temperature indicates a higher melting temperature and greater thermal stability."},{"id":"s859","kind":"mcq","topics":["Drug Development and Techniques"],"page":382,"q":"A ligand-bound sample curve shifts 4 C to the right of the unbound reference. What is the supported conclusion?","options":["The protein has no thermal transition","The dye is unnecessary for the assay","The ligand stabilizes the folded protein","The ligand lowers Tm"],"answer":2,"explanation":"A positive Tm shift indicates preferential binding to and stabilization of the native state."},{"id":"s860","kind":"mcq","topics":["Drug Development and Techniques"],"page":382,"q":"A positive thermal shift occurs when a ligand preferentially stabilizes which protein state?","options":["Native folded state","Aggregated state","Proteolyzed state","Covalently fragmented state"],"answer":0,"explanation":"Preferential binding to the native state raises the temperature required for unfolding."},{"id":"s861","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":383,"q":"Which measurement methods are developed in this lecture section?","options":["Chromatography only","TSA, ITC, and FRET","PCR, ELISA, and Western blotting","MRI, CT, and ultrasound"],"answer":1,"explanation":"The following slides cover thermal shift assays, isothermal titration calorimetry, and FRET."},{"id":"s862","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":384,"q":"What molecular feature of an unfolding protein creates the TSA fluorescence increase?","options":["Exposure of hydrophobic surfaces","Formation of new peptide bonds","Loss of all aromatic residues","Release of DNA"],"answer":0,"explanation":"SYPRO Orange binds exposed hydrophobic surfaces."},{"id":"s863","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":384,"q":"The approximate emission wavelength labeled for SYPRO Orange is:","options":["470 nm","570 nm","670 nm","370 nm"],"answer":1,"explanation":"The slide labels SYPRO Orange emission near 570 nm."},{"id":"s864","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":384,"q":"Why does TSA fluorescence often decline after reaching its peak?","options":["The temperature falls","The dye becomes a ligand","The protein refolds completely","Aggregation causes dye dissociation"],"answer":3,"explanation":"At high temperature, unfolded proteins aggregate and the dye dissociates, reducing fluorescence."},{"id":"s865","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":385,"q":"Which observation is evidence for a stabilizing protein-ligand interaction in TSA?","options":["A lower initial dye concentration","An unchanged Tm with a taller baseline","Loss of every fluorescence signal","A higher derivative-peak temperature"],"answer":3,"explanation":"The ligand-stabilized protein unfolds later, shifting Tm and the derivative peak rightward."},{"id":"s866","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":385,"q":"What limitation applies to a positive thermal shift observed in TSA?","options":["It proves irreversible covalent binding","It proves the exact binding site","It reports stabilization but not the exact binding site","It directly gives a complete crystal structure"],"answer":2,"explanation":"TSA can indicate a stabilizing interaction but does not by itself locate the binding site."},{"id":"s867","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":386,"q":"During an endothermic binding event, how does the instrument maintain equal cell temperatures?","options":["It removes buffer from the reference cell","It stops ligand injection permanently","It increases feedback power to the sample cell","It decreases feedback power to the sample cell"],"answer":2,"explanation":"The slide states that an endothermic reaction requires increased feedback power."},{"id":"s868","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":386,"q":"What is placed in the ITC reference cell?","options":["Buffer","Protein plus ligand","Ligand crystal","Fluorescent dye"],"answer":0,"explanation":"The sample cell contains protein, while the reference cell contains buffer."},{"id":"s869","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":386,"q":"During an exothermic ITC reaction, feedback power supplied to the sample cell:","options":["Increases","Remains fixed at zero","Alternates randomly","Decreases"],"answer":3,"explanation":"Released heat reduces the heater power required to maintain the sample cell at the reference temperature."},{"id":"s870","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":387,"q":"Why is the first exothermic ITC injection typically larger than a late injection?","options":["Ligand concentration is zero initially","More unoccupied protein sites are available","Only heat of dilution occurs initially","The protein is already saturated initially"],"answer":1,"explanation":"Early in the titration, most injected ligand binds because many sites are free."},{"id":"s871","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":387,"q":"For the exothermic ITC example, the sign of binding enthalpy is:","options":["Zero","Undefined","Positive","Negative"],"answer":3,"explanation":"Heat release corresponds to a negative enthalpy change."},{"id":"s872","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":387,"q":"Before the next ITC injection, the heat signal should:","options":["Remain permanently displaced","Return to baseline","Reach its maximum","Change sign"],"answer":1,"explanation":"Baseline recovery separates successive peaks and allows clean integration."},{"id":"s873","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":388,"q":"What does the residual signal represent after complete protein saturation?","options":["Heat of ligand dilution","Maximum binding enthalpy at empty sites","Protein synthesis","Covalent dye labeling"],"answer":0,"explanation":"Once no new specific binding occurs, the remaining heat is primarily dilution heat."},{"id":"s874","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":388,"q":"Why do successive ITC peaks become smaller during a binding titration?","options":["Fewer unoccupied protein sites remain","The ligand becomes more concentrated","The reference cell heats permanently","Protein concentration increases"],"answer":0,"explanation":"As binding sites fill, less newly injected ligand can bind and less binding heat is produced."},{"id":"s875","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":388,"q":"After complete saturation, the small residual ITC peaks mainly represent:","options":["Protein synthesis","Fluorescence quenching","DNA hybridization","Heat of dilution"],"answer":3,"explanation":"Once no additional binding occurs, the remaining signal is mainly dilution heat."},{"id":"s876","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":389,"q":"Which processing step converts the raw injection trace into points on the binding isotherm?","options":["Taking only the tallest peak height","Subtracting the protein concentration from time","Differentiating ligand molar ratio","Integrating the area of each heat peak"],"answer":3,"explanation":"The slide explicitly states that integrated peak areas generate the right-panel points."},{"id":"s877","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":389,"q":"The x-axis of the processed ITC binding isotherm is the molar ratio of:","options":["Heat to time","Sample to reference volume","Ligand to protein","Protein to buffer"],"answer":2,"explanation":"Integrated injection heats are plotted against the ligand-to-protein molar ratio."},{"id":"s878","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":389,"q":"Which relationship between association and dissociation constants is shown?","options":["Ka = -Kd","Ka = Kd","Ka = 1/Kd","Ka = Kd squared"],"answer":2,"explanation":"Association and dissociation constants are reciprocals: Ka equals 1 divided by Kd."},{"id":"s879","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":390,"q":"If protein concentration is doubled while n and Ka remain constant, what happens to c?","options":["It becomes zero","It is unchanged","It doubles","It halves"],"answer":2,"explanation":"Because c = n[P]Ka, c is directly proportional to protein concentration."},{"id":"s880","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":390,"q":"Which expression defines the ITC c-value?","options":["c = n[P]Ka","c = [L]/[P]","c = Ka/Kd","c = delta H/T"],"answer":0,"explanation":"The slide defines c as stoichiometry times protein concentration times association constant."},{"id":"s881","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":390,"q":"How should ligand dilution heat be corrected during ITC analysis?","options":["Subtract a ligand-into-buffer control","Ignore all late injections","Multiply all peaks by c","Add a protein-into-protein control"],"answer":0,"explanation":"Ligand is titrated into buffer separately, and that dilution signal is subtracted from the binding experiment."},{"id":"s882","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":391,"q":"Which intervention would most directly increase nuclear p53 abundance according to the diagram?","options":["Increasing MDMX binding to p53","Blocking MDM2-mediated ubiquitination","Increasing MDM2 nuclear export activity","Enhancing proteasomal recognition of p53"],"answer":1,"explanation":"Preventing MDM2-dependent ubiquitination interrupts the route to export and proteasomal degradation."},{"id":"s883","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":391,"q":"Ubiquitinated p53 is directed to which degradation machinery?","options":["Spliceosome","Centrosome","Proteasome","Ribosome"],"answer":2,"explanation":"MDM2-mediated ubiquitination directs p53 to proteasomal degradation."},{"id":"s884","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":391,"q":"Which regulator mainly blocks p53 transcriptional activity without being shown as the principal driver of its degradation?","options":["BAX","MDMX","MDM2","p21"],"answer":1,"explanation":"MDMX primarily inhibits p53 transcriptional activity, whereas MDM2 additionally promotes export and degradation."},{"id":"s885","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":392,"q":"Which event is prevented by BCL-2 overexpression in the right-hand pathway?","options":["BAX/BAK-driven cytochrome c release","Expression of all BCL-2-family proteins","Formation of mitochondria","Synthesis of procaspases"],"answer":0,"explanation":"Anti-apoptotic BCL-2 prevents BAX/BAK activation and mitochondrial cytochrome c release."},{"id":"s886","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":392,"q":"Which proteins oligomerize to promote mitochondrial outer-membrane permeabilization?","options":["BAX and BAK","MDM2 and MDMX","PD-1 and PD-L1","CFP and YFP"],"answer":0,"explanation":"Pro-apoptotic BAX and BAK oligomerize at the mitochondrial membrane."},{"id":"s887","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":392,"q":"Mitochondrial cytochrome c release promotes formation of the:","options":["Proteasome","Replisome","Inflammasome only","Apoptosome"],"answer":3,"explanation":"Cytochrome c supports apoptosome assembly, leading to caspase activation."},{"id":"s888","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":393,"q":"If donor-acceptor distance changes from R0 to 2R0, which efficiency is closest?","options":["25%","50%","About 98.5%","About 1.5%"],"answer":3,"explanation":"E = 1/(1 + 2^6) = 1/65, approximately 1.5%."},{"id":"s889","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":393,"q":"At donor-acceptor distance r = R0, FRET efficiency is:","options":["50%","100%","0%","25%"],"answer":0,"explanation":"R0 is defined as the Förster radius at which transfer efficiency is 50%."},{"id":"s890","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":393,"q":"Efficient FRET requires overlap between donor emission and acceptor:","options":["Melting curve","Absorption","Emission only","Mass spectrum"],"answer":1,"explanation":"Energy transfer requires spectral overlap between donor emission and acceptor absorption."},{"id":"s891","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":394,"q":"Which signal change reports an increase in intracellular Ca2+ for Cameleon?","options":["Increased CFP with no YFP emission","A shift from yellow to cyan","Increased YFP relative to CFP emission","Loss of both CFP and YFP fluorescence"],"answer":2,"explanation":"Ca2+ promotes CaM-M13 association, increasing CFP-to-YFP FRET and yellow output."},{"id":"s892","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":394,"q":"Which four components form the Cameleon calcium sensor?","options":["CaM, M13, CFP, and YFP","BAX, BAK, CFP, and YFP","PD-1, PD-L1, CFP, and YFP","HIF-alpha, VHL, CFP, and YFP"],"answer":0,"explanation":"Cameleon places calmodulin and its M13-binding segment between CFP and YFP."},{"id":"s893","kind":"mcq","topics":["Techniques in Biochemistry and Biophysics"],"page":394,"q":"In Cameleon, calcium binding causes calmodulin to interact with:","options":["VHL","MDM2","GPX4","M13"],"answer":3,"explanation":"Ca2+-bound calmodulin binds M13, bringing CFP and YFP into a FRET-active arrangement."},{"id":"m0-894","kind":"mcq","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"Which statement best describes the usual organization of metabolic pathways?","options":["Catabolic pathways diverge and anabolic pathways converge","Both catabolic and anabolic pathways are always linear","Catabolic pathways converge and anabolic pathways diverge","The same enzyme must catalyze both directions of every pathway"],"answer":2,"explanation":"Many nutrients feed into fewer catabolic products, while a smaller set of precursors supplies many anabolic products."},{"id":"m0-895","kind":"mcq","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"An enzyme-catalyzed reaction is running at half of Vmax. For a simple Michaelis-Menten enzyme, the substrate concentration equals:","options":["Km","Vmax","2Km","Zero"],"answer":0,"explanation":"Km is defined numerically as the substrate concentration at which velocity is half of Vmax."},{"id":"m0-896","kind":"mcq","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"A reaction has a large negative ΔG under the current cellular conditions. What is the best conclusion?","options":["The system is at equilibrium","The reverse direction is favored","The forward direction is favored","The reaction cannot be enzyme-catalyzed"],"answer":2,"explanation":"A negative actual ΔG supplies a thermodynamic driving force toward products."},{"id":"m0-897","kind":"mcq","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"Which condition defines equilibrium for a reaction?","options":["ΔG = 0","ΔG°′ must be negative","All reactant concentrations equal 1 M","The enzyme reaches Vmax"],"answer":0,"explanation":"At equilibrium there is no net driving force, so the actual free-energy change is zero."},{"id":"m0-898","kind":"mcq","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"Which expression includes the effect of cellular reactant and product concentrations?","options":["ΔG = ΔH + TΔS","ΔG = ΔG°′ + RT ln([products]/[reactants])","ΔG°′ = RT/K′eq","Vmax = Km/2"],"answer":1,"explanation":"The reaction quotient term adjusts the standard free energy for the concentrations that actually exist."},{"id":"m0-899","kind":"mcq","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"Reaction A has ΔG = +10 kJ/mol and a coupled reaction B has ΔG = -25 kJ/mol. What is the overall ΔG?","options":["+35 kJ/mol","+15 kJ/mol","-15 kJ/mol","-35 kJ/mol"],"answer":2,"explanation":"Free-energy changes are additive: +10 + (-25) = -15 kJ/mol, so the coupled process is favorable."},{"id":"m0-900","kind":"mcq","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"Why is the actual free energy of ATP hydrolysis in a living cell not necessarily -30.5 kJ/mol?","options":["ATP cannot be hydrolyzed inside cells","Cellular ATP, ADP, and Pi concentrations differ from standard-state concentrations","Enzymes reverse the sign of ΔG","ATP hydrolysis does not involve water"],"answer":1,"explanation":"The quoted value is a transformed standard value; actual ΔG depends on cellular concentrations and Mg2+ binding."},{"id":"m0-901","kind":"mcq","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"Which example best matches the slides' statement that ATP provides energy by group transfer?","options":["ATP remains unchanged while heating the cytosol","ATP transfers a group that drives a protein through different conformations","ATP removes all enzymes from a pathway","ATP changes ΔG°′ by changing temperature"],"answer":1,"explanation":"Transferred groups can create activated intermediates or alter protein conformation, coupling ATP use to chemical or mechanical work."},{"id":"r0-902","kind":"recall","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"What is the difference between catabolism and anabolism?","a":"Catabolism degrades molecules and releases usable energy; anabolism consumes energy to synthesize cellular molecules."},{"id":"r0-903","kind":"recall","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"Why do cells commonly use separate enzymes for opposing anabolic and catabolic pathways?","a":"Separate control prevents both directions from running strongly at once and wasting energy in a futile cycle."},{"id":"r0-904","kind":"recall","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"What do Vmax and Km mean in Michaelis-Menten kinetics?","a":"Vmax is the maximum rate at saturating substrate, and Km is the substrate concentration at which the rate is half of Vmax."},{"id":"r0-905","kind":"recall","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"What does the sign of ΔG tell you?","a":"Negative ΔG favors the forward reaction, positive ΔG favors the reverse reaction, and zero ΔG indicates equilibrium."},{"id":"r0-906","kind":"recall","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"How are ΔG°′ and the equilibrium constant related?","a":"ΔG°′ = -RT ln K′eq; a larger equilibrium constant therefore corresponds to a more negative ΔG°′."},{"id":"r0-907","kind":"recall","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"Why can the actual ΔG of a reaction differ from ΔG°′?","a":"Actual ΔG also depends on the current concentrations of products and reactants through RT ln([products]/[reactants])."},{"id":"r0-908","kind":"recall","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"What happens to free-energy changes when reactions are coupled?","a":"Their ΔG values add, so a sufficiently favorable reaction can make the overall coupled process favorable."},{"id":"r0-909","kind":"recall","topics":["Bioenergetics"],"module":"Module 1: Bioenergetics and ATP","q":"What is the true ATP-containing substrate for many ATP-dependent enzymes in the cytosol?","a":"MgATP2+, because Mg2+ binds ATP and participates in the form recognized by many enzymes."},{"id":"m1-910","kind":"mcq","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"Which product is made directly by transcription?","options":["DNA","RNA","Protein","Lipid"],"answer":1,"explanation":"RNA polymerase uses a DNA template to synthesize RNA."},{"id":"m1-911","kind":"mcq","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"Which statement about the coding DNA strand is correct?","options":["It is identical to mRNA, including uracil","It is complementary to mRNA at every base","It matches mRNA except that it contains thymine instead of uracil","It is removed during RNA splicing"],"answer":2,"explanation":"The coding strand and mRNA carry the same base sequence when T in DNA is treated as U in RNA."},{"id":"m1-912","kind":"mcq","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"A newly made eukaryotic pre-mRNA contains:","options":["Only exons","Only introns","Exons and introns","Protein and RNA"],"answer":2,"explanation":"Splicing removes introns from an exon-plus-intron precursor to form mature mRNA."},{"id":"m1-913","kind":"mcq","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"During translation, which pairing of directions is correct?","options":["mRNA 3′ to 5′; protein C terminus to N terminus","mRNA 5′ to 3′; protein N terminus to C terminus","mRNA 5′ to 3′; protein C terminus to N terminus","mRNA direction varies; protein always begins at the C terminus"],"answer":1,"explanation":"The ribosome moves along mRNA 5′ to 3′ and adds residues to the C end of a chain that began at its N terminus."},{"id":"m1-914","kind":"mcq","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"Why can transcription and translation occur at the same time in prokaryotes?","options":["Prokaryotes have no DNA","Prokaryotes lack compartmentalization by a nucleus","Their ribosomes enter the nucleus","Their mRNA contains no bases"],"answer":1,"explanation":"Without a nuclear barrier, ribosomes can begin translating an mRNA while RNA polymerase is still transcribing it."},{"id":"m1-915","kind":"mcq","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"Which lac-operon component is correctly matched with its product?","options":["lacZ: lactose permease","lacY: β-galactosidase","lacA: transacetylase","lacA: lac repressor"],"answer":2,"explanation":"The slide assigns lacZ to β-galactosidase, lacY to permease, and lacA to transacetylase."},{"id":"m1-916","kind":"mcq","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"Lactose is present and glucose is also present. What level of lac-operon transcription is expected?","options":["Strong transcription because CAP is active","Low, leaky transcription because the repressor is released but CAP is inactive","No transcription because allolactose strengthens repressor binding","Strong transcription because cAMP is high"],"answer":1,"explanation":"Allolactose removes the repressor, but high glucose keeps cAMP low and CAP inactive, so transcription remains low."},{"id":"m1-917","kind":"mcq","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"Glucose is absent, but lactose is also absent. What prevents lac-operon transcription?","options":["CAP cannot bind cAMP","RNA polymerase destroys the promoter","The lac repressor remains bound to the operator","lacZ removes CAP"],"answer":2,"explanation":"Low glucose activates CAP, but without lactose there is no allolactose to remove the repressor, which remains a roadblock."},{"id":"r1-918","kind":"recall","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"State the central dogma in one line.","a":"Genetic information normally flows from DNA to RNA to protein."},{"id":"r1-919","kind":"recall","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"What does semiconservative DNA replication produce?","a":"Each daughter DNA molecule contains one old parental strand and one newly synthesized strand."},{"id":"r1-920","kind":"recall","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"Which DNA strand serves as the template for mRNA, and how does the other strand compare with mRNA?","a":"RNA polymerase reads the template or antisense strand; the coding or sense strand has the mRNA sequence except T replaces U."},{"id":"r1-921","kind":"recall","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"What processing converts eukaryotic pre-mRNA into mature mRNA in these slides?","a":"Splicing removes noncoding introns and joins the coding exons."},{"id":"r1-922","kind":"recall","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"In which directions are mRNA read and protein synthesized?","a":"mRNA is read 5′ to 3′, and protein is synthesized from the N terminus to the C terminus."},{"id":"r1-923","kind":"recall","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"What is an operon?","a":"A cluster of prokaryotic genes controlled by one promoter and transcribed together as a single mRNA."},{"id":"r1-924","kind":"recall","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"What are the distinct jobs of the lac repressor and CAP?","a":"The repressor blocks transcription at the operator when lactose is absent; active CAP promotes RNA polymerase binding when glucose is low."},{"id":"r1-925","kind":"recall","topics":["Gene Expression and Regulation"],"module":"Module 2: Gene Expression and the Lac Operon","q":"What exact nutrient condition gives strong lac-operon transcription?","a":"Lactose must be present and glucose must be absent."},{"id":"m2-926","kind":"mcq","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"Which sequence gives the correct basic order for making recombinant DNA in a host?","options":["Ligate, isolate gene, cut DNA, select host","Isolate gene, cut insert and vector, ligate, introduce into host","Introduce into host, cut vector, amplify gene, ligate","Select clones, remove vector, isolate gene, translate"],"answer":1,"explanation":"The insert must first be obtained, compatible DNA ends created, and recombinant DNA assembled before host introduction."},{"id":"m2-927","kind":"mcq","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"What is the main role of a selectable marker in a vector?","options":["Cut the vector at a palindrome","Identify cells that contain the vector under selective conditions","Terminate every PCR cycle","Measure DNA fragment size directly"],"answer":1,"explanation":"A selectable marker, often an antibiotic-resistance gene, allows vector-containing cells to survive or otherwise be selected."},{"id":"m2-928","kind":"mcq","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"A restriction enzyme is most accurately described as an enzyme that:","options":["Joins any two proteins","Recognizes a specific DNA sequence and cuts at or near it","Copies RNA into protein","Separates DNA fragments by size"],"answer":1,"explanation":"Restriction endonucleases cut DNA at defined recognition sequences, many of which are palindromic."},{"id":"m2-929","kind":"mcq","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"Why is sticky-end ligation generally more efficient than blunt-end ligation?","options":["Sticky ends contain selectable markers","Complementary overhangs base-pair and hold fragments together","Blunt ends lack phosphate groups in every case","Sticky ends do not require DNA ligase"],"answer":1,"explanation":"Base pairing between complementary overhangs aligns the fragments and raises their effective local concentration; ligase is still required."},{"id":"m2-930","kind":"mcq","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"Which event occurs during the annealing step of PCR?","options":["The two template strands separate","Primers bind complementary target sequences","DNA fragments separate in agarose","Cas9 creates a double-strand break"],"answer":1,"explanation":"After heat separates the strands, cooling allows primers to hybridize to their complementary sites."},{"id":"m2-931","kind":"mcq","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"A DNA sample is placed in an agarose gel. In which direction does it migrate, and which fragments travel farther?","options":["Toward the negative electrode; larger fragments","Toward the positive electrode; smaller fragments","Toward the positive electrode; larger fragments","Toward the wells; all fragments equally"],"answer":1,"explanation":"DNA has a negatively charged phosphate backbone, and smaller fragments move more easily through the agarose network."},{"id":"m2-932","kind":"mcq","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"Which property makes a ddNTP a chain terminator in Sanger sequencing?","options":["It has no nitrogenous base","It lacks a 3′-OH group","It contains an extra phosphate backbone","It cuts the template strand"],"answer":1,"explanation":"Without a 3′-OH, the growing strand cannot form the next phosphodiester bond."},{"id":"m2-933","kind":"mcq","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"In CRISPR-Cas9 editing, what gives the system its target specificity?","options":["The agarose gel","The selectable marker alone","A guide RNA complementary to the target DNA","T4 DNA ligase"],"answer":2,"explanation":"The guide RNA directs Cas9 to the matching DNA sequence, where Cas9 introduces a double-strand break."},{"id":"r2-934","kind":"recall","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"Put the six basic genetic-engineering stages in order.","a":"Isolate or amplify the gene, cut gene and vector, ligate them, introduce the recombinant vector into a host, select and screen clones, then express or use the verified construct."},{"id":"r2-935","kind":"recall","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"What is the difference between a vector and a host cell?","a":"A vector is the DNA carrier for the foreign sequence; the host cell receives and maintains or expresses that recombinant DNA."},{"id":"r2-936","kind":"recall","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"Why are the same restriction enzymes often used on the insert and vector?","a":"They generate compatible DNA ends that can base-pair and be joined by ligase."},{"id":"r2-937","kind":"recall","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"What chemical bond does DNA ligase form, and between which groups?","a":"It forms a phosphodiester bond between an adjacent 3′-OH and 5′-phosphate."},{"id":"r2-938","kind":"recall","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"Name the three repeating PCR steps in order.","a":"Denaturation, annealing, and extension."},{"id":"r2-939","kind":"recall","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"Why do smaller DNA fragments move farther in an agarose gel?","a":"The gel acts as a molecular sieve, so smaller fragments pass through its pores more easily."},{"id":"r2-940","kind":"recall","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"Why does incorporation of a ddNTP terminate Sanger DNA synthesis?","a":"A ddNTP lacks the 3′-OH needed to form the next phosphodiester bond."},{"id":"r2-941","kind":"recall","topics":["Genetic Engineering Applications 1"],"module":"Module 3: Genetic Engineering Toolkit","q":"What are three general features expected in a useful cloning vector?","a":"An origin of replication, a selectable marker, and a site for insertion such as a multiple cloning site."},{"id":"m3-942","kind":"mcq","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"Which vector element most directly determines whether the plasmid can replicate autonomously inside the host?","options":["Origin of replication","Multiple cloning site","Reporter gene","His tag"],"answer":"Origin of replication","explanation":"The origin of replication is recognized by the host replication machinery and also influences plasmid copy number."},{"id":"m3-943","kind":"mcq","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"A human protein must be produced in E. coli. Which starting material is usually the best source of its coding sequence?","options":["Human genomic DNA containing the complete gene","cDNA made from the mature human mRNA","The human chromosome carrying the gene","Unprocessed nuclear RNA"],"answer":"cDNA made from the mature human mRNA","explanation":"Mature mRNA has already undergone intron removal. Its cDNA copy contains a continuous coding sequence that bacteria can translate."},{"id":"m3-944","kind":"mcq","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"Bacterial colonies grow on ampicillin, but some may contain empty plasmids. What has the antibiotic plate established?","options":["The colonies contain the correct insert in the correct orientation","The colonies contain a plasmid carrying ampicillin resistance","The inserted gene is being expressed at high level","The recombinant protein has the correct molecular weight"],"answer":"The colonies contain a plasmid carrying ampicillin resistance","explanation":"Antibiotic selection establishes vector uptake, not successful insertion. Recombinants still require screening and confirmation."},{"id":"m3-945","kind":"mcq","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"Which method gives the most exact confirmation of both insert identity and nucleotide order?","options":["Antibiotic selection","Blue-white screening","DNA sequencing","Cell lysis"],"answer":"DNA sequencing","explanation":"Sequencing reveals the exact nucleotide sequence and can confirm insert identity and orientation."},{"id":"m3-946","kind":"mcq","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"During Ni-NTA purification, why is a high concentration of imidazole used?","options":["To denature every host protein","To compete with the His tag and elute the target protein","To add a negative charge to the target protein","To cut the His tag away from the target protein"],"answer":"To compete with the His tag and elute the target protein","explanation":"Histidines bind nickel on the resin. High imidazole competes for those interactions and releases the His-tagged protein."},{"id":"m3-947","kind":"mcq","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"Which statement about the recombinant hepatitis B vaccine matches the slides?","options":["It contains live hepatitis B virus grown in bacteria","It uses hepatitis B surface antigen produced in yeast","It consists of purified human antibodies against HBV","It edits liver cells so they cannot be infected"],"answer":"It uses hepatitis B surface antigen produced in yeast","explanation":"The vaccine is a noninfectious recombinant vaccine based on HBsAg produced in yeast."},{"id":"m3-948","kind":"mcq","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"What is the engineered nutritional change in Golden Rice?","options":["Cry toxin accumulates in the leaves","Beta-carotene accumulates in the endosperm","Vitamin C accumulates in the roots","More starch is produced by bacterial fermentation"],"answer":"Beta-carotene accumulates in the endosperm","explanation":"Golden Rice activates the carotenoid pathway in the grain endosperm, producing beta-carotene, a provitamin A precursor."},{"id":"m3-949","kind":"mcq","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"Editing the BCL11A enhancer in the sickle-cell example is intended to produce which result?","options":["Reactivation of fetal hemoglobin","Expression of bacterial Cry toxin","Increased insulin secretion","Removal of all red blood cells"],"answer":"Reactivation of fetal hemoglobin","explanation":"Reducing BCL11A-mediated repression allows fetal hemoglobin production, which helps prevent sickling."},{"id":"r3-950","kind":"recall","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"What three core features let a plasmid function as a cloning vector, and what does each do?","a":"An origin of replication permits autonomous replication and influences copy number. A selectable marker, often an antibiotic-resistance gene, allows cells carrying the vector to survive selection. A multiple cloning site contains unique restriction sites for insertion of foreign DNA."},{"id":"r3-951","kind":"recall","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"How does an expression vector differ from a basic cloning vector?","a":"A cloning vector mainly carries and replicates inserted DNA. An expression vector also contains regulatory elements needed to transcribe and translate the inserted gene, allowing production of recombinant protein."},{"id":"r3-952","kind":"recall","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"Why is cDNA usually preferred over genomic DNA when a eukaryotic gene will be expressed in bacteria?","a":"cDNA is copied from mature mRNA and therefore lacks introns. Bacteria generally cannot splice eukaryotic introns out of a genomic gene."},{"id":"r3-953","kind":"recall","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"Distinguish transformation, selection, screening, and confirmation.","a":"Transformation introduces recombinant DNA into competent host cells. Selection identifies cells that received a vector by survival, such as growth on antibiotic. Screening distinguishes likely recombinant plasmids from empty vectors. Confirmation directly checks the insert using colony PCR, restriction digestion, or DNA sequencing."},{"id":"r3-954","kind":"recall","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"What happens during heat-shock transformation and electroporation?","a":"In heat shock, plasmid and competent cells are mixed on ice, a brief temperature shift to about 42 degrees Celsius creates transient permeability, and cooling helps reseal the membrane. Electroporation uses a short high-voltage pulse to create transient pores and usually gives high transformation efficiency."},{"id":"r3-955","kind":"recall","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"How does His-tag and Ni-NTA affinity purification work?","a":"The His-tagged protein binds nickel ions on the Ni-NTA resin. Low imidazole removes weak, nonspecific binders. High imidazole competes with the His tag and elutes the recombinant protein."},{"id":"r3-956","kind":"recall","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"What information does SDS-PAGE provide after protein purification?","a":"SDS denatures proteins and gives them a broadly uniform negative charge, so the gel separates them mainly by molecular weight. Smaller proteins migrate farther. A strong band at the expected size supports the presence and purity of the recombinant protein."},{"id":"r3-957","kind":"recall","topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"],"module":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","q":"Give one slide-based example each of genetic engineering in medicine, agriculture, industry, and the environment.","a":"Medicine: recombinant insulin, vaccines, monoclonal antibodies, or gene therapy. Agriculture: Bt crops or Golden Rice. Industry: recombinant chymosin, lactase, amylase, protease, lipase, biofuels, or bioplastics. Environment: bioremediation, wastewater treatment, biosensors, or sustainable bioprocesses."},{"id":"m4-958","kind":"mcq","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"Which statement best describes a molecular motor?","options":["A rigid structure that stores heat at equilibrium","A macromolecular complex that converts free energy into directed work","A membrane channel that permits passive diffusion only","A DNA sequence that controls transcription"],"answer":"A macromolecular complex that converts free energy into directed work","explanation":"The slides define molecular motors as macromolecular complexes that transduce nonequilibrium free energy into directed motion or other functions."},{"id":"m4-959","kind":"mcq","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"Which environmental feature is especially relevant to a motor working at molecular scale in water?","options":["High Reynolds number and negligible viscosity","Low Reynolds number and strong Brownian motion","Complete absence of thermal motion","Motion governed mainly by gravity"],"answer":"Low Reynolds number and strong Brownian motion","explanation":"At nanometer scale in an aqueous environment, viscous effects dominate and stochastic Brownian motion is unavoidable."},{"id":"m4-960","kind":"mcq","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"What directly links ATP hydrolysis to motor action?","options":["Permanent covalent attachment of ATP to the motor","A nucleotide-dependent change in protein conformation","Conversion of the protein into DNA","Elimination of all noncovalent interactions"],"answer":"A nucleotide-dependent change in protein conformation","explanation":"ATP- and ADP-bound states favor different protein conformations. Cycling between them provides the structural changes needed for work."},{"id":"m4-961","kind":"mcq","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"Which pairing is correct?","options":["G-actin: filamentous polymer; F-actin: globular monomer","G-actin: globular monomer; F-actin: filamentous polymer","G-actin: myosin heavy chain; F-actin: myosin light chain","G-actin: optical bead; F-actin: laser beam"],"answer":"G-actin: globular monomer; F-actin: filamentous polymer","explanation":"The letter G marks the globular monomeric form, while F marks filamentous polymerized actin."},{"id":"m4-962","kind":"mcq","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"Where are the actin-binding and ATP-binding sites located in myosin?","options":["Both are in the head domain","Both are in the coiled-coil tail","Actin binds the tail and ATP binds a light chain","Actin binds the neck and ATP binds the tail"],"answer":"Both are in the head domain","explanation":"The myosin head is the motor domain and contains both the actin-binding site and ATP-binding site."},{"id":"m4-963","kind":"mcq","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"In a single-beam optical trap, which force pulls a displaced bead back toward the center of the beam?","options":["Gradient force","Scattering force","Gravitational force","Centrifugal force"],"answer":"Gradient force","explanation":"The Gaussian beam is brightest at its center. The gradient force acts toward that center and supplies the restoring force."},{"id":"m4-964","kind":"mcq","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"Why can an optical trap be used to study a molecular motor?","options":["It chemically labels every ATP molecule","It converts the motor into a fluorescent protein","Bead displacement against a calibrated restoring force reveals nanometer motion and piconewton force","It stops Brownian motion completely"],"answer":"Bead displacement against a calibrated restoring force reveals nanometer motion and piconewton force","explanation":"Optical tweezers manipulate small beads and allow measurements in the nanometer and piconewton ranges relevant to single motors."},{"id":"m4-965","kind":"mcq","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"What approximate displacement did the slide report for a myosin event at both low and high ATP concentrations?","options":["0.11 nm","1.1 nm","11 nm","1100 nm"],"answer":"11 nm","explanation":"The experimental trace notes a displacement close to 11 nm at both ATP concentrations."},{"id":"r4-966","kind":"recall","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"What energy conversion defines a biological molecular motor in these slides?","a":"A molecular motor uses energy, commonly the chemical energy released by ATP or GTP hydrolysis, and converts it into directed mechanical motion or another cellular function."},{"id":"r4-967","kind":"recall","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"Why must living cells continually use energy rather than remain at equilibrium?","a":"Cellular order, concentration differences, charge distributions, and organized motion are nonequilibrium states. Molecular machines create and maintain these states, so cells must continually obtain and use free energy."},{"id":"r4-968","kind":"recall","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"Name the two fundamental principles of molecular motors emphasized in the slides.","a":"They use energy from ATP or GTP, and nucleotide binding and hydrolysis drive protein conformational changes."},{"id":"r4-969","kind":"recall","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"What features make molecular motors different from familiar macroscopic motors?","a":"They operate at nanometer scale in an aqueous, low-Reynolds-number environment. They experience Brownian motion, depend on temperature and pH, rely on noncovalent interactions, and work through molecular conformational dynamics."},{"id":"r4-970","kind":"recall","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"What are G-actin and F-actin?","a":"G-actin is the globular monomeric form. F-actin is the filamentous polymer made from repeating actin subunits arranged as a right-handed double helix."},{"id":"r4-971","kind":"recall","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"What are the main structural parts of myosin described in the slides?","a":"Myosin contains two heavy chains, two essential light chains, and two regulatory light chains. Each heavy chain has a head, neck, and tail. The head contains actin- and ATP-binding sites, while the tail forms a dimeric coiled-coil."},{"id":"r4-972","kind":"recall","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"How do gradient and scattering forces differ in an optical trap?","a":"Scattering force points in the direction of incident light and scales with optical intensity. Gradient force arises from the Gaussian intensity gradient and acts as a restoring force toward the beam center."},{"id":"r4-973","kind":"recall","topics":["Biological Motors"],"module":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","q":"What did the dual-beam actin-myosin experiment measure?","a":"An actin filament held between two trapped beads interacted with sparse myosin on a pedestal bead. Bead displacement revealed the myosin working stroke, attachment lifetime, and force. The slide reports a displacement close to 11 nm at both low and high ATP, with the filament initially tensed to about 2 pN."},{"id":"m5-974","kind":"mcq","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"A cell releases a growth signal and also carries the receptor for that same signal. Which mode is this?","options":["Autocrine","Paracrine","Juxtacrine","Endocrine"],"answer":"Autocrine","explanation":"In autocrine signaling, the producing cell can respond to its own messenger."},{"id":"m5-975","kind":"mcq","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"Platelet-derived growth factor released at a wound acts mainly on nearby cells. Which mode is this?","options":["Autocrine","Paracrine","Juxtacrine","Endocrine"],"answer":"Paracrine","explanation":"Paracrine messengers act locally and often have limited range because they are unstable, degraded, or retained by the extracellular matrix."},{"id":"m5-976","kind":"mcq","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"Which signaling mode requires a surface-bound messenger on one cell to bind a receptor on an adjacent cell?","options":["Autocrine","Paracrine","Juxtacrine","Endocrine"],"answer":"Juxtacrine","explanation":"Juxtacrine signaling depends on direct cell-to-cell contact."},{"id":"m5-977","kind":"mcq","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"Why can cortisol use an intracellular receptor?","options":["It is a steroid that can diffuse through the lipid bilayer","It is carried through a GPCR pore","It is converted into cAMP outside the cell","It binds directly to ribosomes"],"answer":"It is a steroid that can diffuse through the lipid bilayer","explanation":"Steroid hormones are lipid soluble, so they can cross the plasma membrane and bind cytoplasmic or nuclear receptors."},{"id":"m5-978","kind":"mcq","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"What happens immediately after activation of the G protein in the GPCR sequence shown?","options":["G alpha exchanges GDP for GTP","The receptor enters the nucleus and binds DNA","Arrestin removes cAMP from the cell","SDS gives the receptor a negative charge"],"answer":"G alpha exchanges GDP for GTP","explanation":"Ligand-bound GPCR promotes GDP release from G alpha, allowing GTP binding and activation."},{"id":"m5-979","kind":"mcq","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"Which enzyme produces cAMP in the pathway shown?","options":["Adenylyl cyclase","GPCR kinase","GTPase","DNA polymerase"],"answer":"Adenylyl cyclase","explanation":"Activated G alpha stimulates the effector adenylyl cyclase, which generates the second messenger cAMP."},{"id":"m5-980","kind":"mcq","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"Which event directly switches the activated G alpha subunit off?","options":["Hydrolysis of bound GTP to GDP","Exchange of GDP for GTP","Production of additional cAMP","Binding of cortisol to DNA"],"answer":"Hydrolysis of bound GTP to GDP","explanation":"The intrinsic GTPase activity of G alpha hydrolyzes GTP, returning the subunit to its inactive GDP-bound state."},{"id":"m5-981","kind":"mcq","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"What is the main effect of GRK phosphorylation followed by arrestin binding?","options":["The receptor activates more G proteins","The receptor is prevented from activating additional G proteins","The receptor becomes a nuclear steroid receptor","The G protein permanently loses GDP"],"answer":"The receptor is prevented from activating additional G proteins","explanation":"Arrestin selectively binds the active phosphorylated receptor and competes with G proteins for the receptor's cytoplasmic binding cavity."},{"id":"r5-982","kind":"recall","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"Why do cells need signaling systems?","a":"Cells must detect changes in their environment, receive and integrate multiple messages, and produce an appropriate response. The response can be rapid or slow depending on the signal and the state of the cell."},{"id":"r5-983","kind":"recall","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"Distinguish autocrine, paracrine, juxtacrine, and endocrine signaling.","a":"Autocrine signaling acts back on the cell that secreted the messenger. Paracrine signaling acts over a short local distance. Juxtacrine signaling requires direct contact between a surface-bound messenger and a receptor on a neighboring cell. Endocrine signaling uses the bloodstream to reach distant targets."},{"id":"r5-984","kind":"recall","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"Give the example paired with each signaling type in the slides.","a":"Autocrine: cancer cells release messages that sustain their own growth. Paracrine: platelet-derived growth factor acts near a wound. Juxtacrine: integrins and cadherins contribute to contact inhibition. Endocrine: pancreatic beta cells secrete insulin, which stimulates glucose uptake in liver cells."},{"id":"r5-985","kind":"recall","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"How does a steroid hormone such as cortisol activate gene expression?","a":"The hormone diffuses through the lipid bilayer, binds an intracellular glucocorticoid receptor, changes the receptor's conformation, and promotes its movement into the nucleus, where the receptor activates transcription of target genes."},{"id":"r5-986","kind":"recall","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"What structural feature characterizes GPCRs, and what protein do they activate?","a":"GPCRs contain seven transmembrane helices. Ligand binding allows the receptor to activate a trimeric GTP-binding protein."},{"id":"r5-987","kind":"recall","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"Describe the activation sequence from ligand-bound GPCR to cAMP production.","a":"Ligand changes the receptor conformation and increases its interaction with the G protein. G alpha releases GDP and binds GTP, separates from the other G-protein subunits, and activates an effector such as adenylyl cyclase. Adenylyl cyclase then produces cAMP."},{"id":"r5-988","kind":"recall","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"Why is cAMP called a second messenger, and how does it amplify signaling?","a":"The extracellular ligand is the first messenger, while cAMP is generated inside the cell after receptor activation. cAMP can diffuse to multiple intracellular targets, allowing one extracellular event to produce a broad, coordinated response."},{"id":"r5-989","kind":"recall","topics":["Cellular Signaling"],"module":"Module 6: Cellular Signaling - From Message to Response and Shutoff","q":"How is GPCR signaling attenuated or terminated?","a":"G alpha hydrolyzes GTP to GDP and becomes inactive, then reassociates with the other G-protein subunits. GRKs phosphorylate active receptors, and arrestin binds the phosphorylated receptor, preventing further G-protein activation."},{"id":"m6-990","kind":"mcq","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"Which finding most strongly favors apoptosis rather than uncontrolled membrane rupture?","options":["Intact membrane-bound bodies rapidly engulfed by phagocytes","Immediate release of all cytoplasmic contents","Persistent tissue inflammation caused by leaked organelles","Random swelling followed by cell lysis"],"answer":0,"explanation":"The slides emphasize intact apoptotic bodies, maintained organelle integrity, and rapid phagocytosis."},{"id":"m6-991","kind":"mcq","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"In the receptor-mediated pathway, which initiator caspase is activated at the TNFR1-associated complex?","options":["Caspase-3","Caspase-8","Caspase-9","Caspase-1"],"answer":1,"explanation":"TRADD, FADD, and procaspase-8 assemble at activated TNFR1; caspase-8 then activates executioner caspases."},{"id":"m6-992","kind":"mcq","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"Which event directly follows BAX/BAK-mediated mitochondrial outer membrane permeabilization?","options":["Externalization of E2F","Release of cytochrome c","Activation of TNFR1","Attachment of kinetochores"],"answer":1,"explanation":"BAX/BAK pores allow cytochrome c to leave the mitochondrial intermembrane space."},{"id":"m6-993","kind":"mcq","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"An Annexin V-positive cell most directly indicates exposure of which molecule?","options":["Phosphatidylserine","Cytochrome c","Cohesin","E2F"],"answer":0,"explanation":"Annexin V binds phosphatidylserine after it moves from the inner to the outer leaflet during apoptosis."},{"id":"m6-994","kind":"mcq","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"At the end of S phase, each replicated chromosome consists of:","options":["Two homologous chromosomes joined at their telomeres","Two sister chromatids held together by cohesins","One chromatid attached to two nuclei","Four unrelated DNA molecules"],"answer":1,"explanation":"DNA replication creates sister chromatids, which remain associated through cohesins before mitotic separation."},{"id":"m6-995","kind":"mcq","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"Chromosomes are accurately aligned on the spindle midplane during:","options":["Prophase","Metaphase","Anaphase","Telophase"],"answer":1,"explanation":"Metaphase is defined by alignment at the cell equator or spindle midplane."},{"id":"m6-996","kind":"mcq","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"Which structure provides the chromosome attachment site for spindle microtubules?","options":["Phagolysosome","Kinetochore","Apoptosome","Nucleolus"],"answer":1,"explanation":"Kinetochores are protein assemblies on specialized chromatin that bind spindle microtubules and motors."},{"id":"m6-997","kind":"mcq","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"Active, hypophosphorylated pRb prevents premature S-phase entry mainly by binding:","options":["BAX","E2F","Apaf-1","Annexin V"],"answer":1,"explanation":"pRb restrains the G1-to-S transition by binding and inactivating E2F transcription factors."},{"id":"r6-998","kind":"recall","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"Without looking, list four visible or structural features of apoptosis.","a":"Cell and nuclear shrinkage, loss of adhesion, surface blebbing, chromatin fragmentation, formation of membrane-bound apoptotic bodies, and rapid phagocytic removal are slide-listed features; any four earn full credit."},{"id":"r6-999","kind":"recall","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"Why does apoptosis usually avoid a strong inflammatory reaction?","a":"Cell contents remain enclosed by intact membranes, apoptotic bodies are rapidly phagocytosed, and this limits leakage and secondary necrosis."},{"id":"r6-1000","kind":"recall","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"Reconstruct the extrinsic apoptosis pathway from TNF binding to execution.","a":"TNF binds TNFR1; the receptor recruits TRADD, FADD, and procaspase-8; procaspase-8 activates by cleavage; caspase-8 activates downstream executioner caspases."},{"id":"r6-1001","kind":"recall","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"Reconstruct the intrinsic apoptosis pathway from cellular stress to execution.","a":"Stress activates pro-apoptotic BCL-2-family members such as BAX/BAK; mitochondrial outer membrane permeabilization releases cytochrome c; cytochrome c joins Apaf-1 and procaspase-9; caspase-9 activates executioner caspases."},{"id":"r6-1002","kind":"recall","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"What does Annexin V reveal, and why?","a":"It reveals phosphatidylserine exposed on the outer plasma-membrane leaflet because Annexin V binds PS with high affinity; external PS is an apoptotic eat-me signal."},{"id":"r6-1003","kind":"recall","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"State the defining event of G1, S, G2, and G0.","a":"G1: growth, protein synthesis, and organelle duplication; S: nuclear DNA replication; G2: final protein and energy preparation for division; G0: temporary or permanent quiescence outside active cycling."},{"id":"r6-1004","kind":"recall","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"For prophase, metaphase, anaphase, and telophase, give the chromosome headline.","a":"Prophase: chromosomes condense; metaphase: chromosomes align at the equator and attach to spindle microtubules through kinetochores; anaphase: sister chromatids separate to opposite poles; telophase: chromosome sets reach the poles and new nuclei form."},{"id":"r6-1005","kind":"recall","topics":["Cell Death and Cell Division"],"module":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","q":"How does active pRb restrain the cell cycle, and what follows loss of both RB1 copies?","a":"Hypophosphorylated pRb binds and inactivates E2F, blocking premature G1-to-S progression. Loss of functional pRb removes that control and permits uncontrolled proliferation, including retinoblastoma."},{"id":"m7-1006","kind":"mcq","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"A cell has committed to become muscle but does not yet look different from neighboring cells. It is best described as:","options":["Determined","Differentiated","Totipotent","Apoptotic"],"answer":0,"explanation":"Determination is commitment to a fate before the cell displays
