 the specialized phenotype."},{"id":"m7-1007","kind":"mcq","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"Which sequence correctly orders developmental potential from greatest to least?","options":["Unipotent -> oligopotent -> multipotent -> pluripotent -> totipotent","Totipotent -> pluripotent -> multipotent -> oligopotent -> unipotent","Pluripotent -> totipotent -> unipotent -> multipotent -> oligopotent","Multipotent -> totipotent -> oligopotent -> pluripotent -> unipotent"],"answer":1,"explanation":"Development progressively restricts the range of possible cell fates."},{"id":"m7-1008","kind":"mcq","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"The immediate basis of different behavior in two differentiated cell types is primarily:","options":["Different subsets of genes being expressed","Different genetic codes","Loss of all unused genes","Permanent absence of proteins"],"answer":0,"explanation":"The slides attribute differentiation to differential gene expression and thus different protein complements."},{"id":"m7-1009","kind":"mcq","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"Which is NOT a defining stem-cell capability in the slides?","options":["Self-renewal","Differentiation","Extended proliferative potential","Continuous high metabolic activity"],"answer":3,"explanation":"Adult stem cells are described as often quiescent, with low metabolic activity, rather than continuously highly active."},{"id":"m7-1010","kind":"mcq","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"Which germ-layer match is correct?","options":["Endoderm - liver and pancreas","Mesoderm - brain and retina","Ectoderm - circulatory system","Endoderm - cartilage and bone"],"answer":0,"explanation":"The slides place digestive tract, liver, and pancreas under endoderm."},{"id":"m7-1011","kind":"mcq","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"In Gurdon's experiment, differentiated donor nuclei were placed into:","options":["An enucleated Xenopus egg","A bone-marrow stem cell","A retroviral vector","An intact blastula nucleus"],"answer":0,"explanation":"The nucleus of the recipient egg was removed before receiving the differentiated intestinal-cell nucleus."},{"id":"m7-1012","kind":"mcq","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"Which set contains only the four factors shown as sufficient for iPSC generation?","options":["Oct3/4, Sox2, c-Myc, Klf4","Rx, Pax6, Chx10, Mitf","BAX, BAK, BID, BAD","TRADD, FADD, Apaf-1, E2F"],"answer":0,"explanation":"The Yamanaka combination in the slides is Oct3/4, Sox2, c-Myc, and Klf4."},{"id":"m7-1013","kind":"mcq","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"In the optic-cup culture example, Activin was used to induce expression of:","options":["Rx/Rax","RB1","TNFR1","Cytochrome c"],"answer":0,"explanation":"The slides describe Activin induction of Rx/Rax, with Rx-positive cells appearing GFP-positive."},{"id":"r7-1014","kind":"recall","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"Distinguish cell fate, potency, determination, and differentiation in one sentence each.","a":"Fate is what a cell normally becomes; potency is what it can become; determination is commitment to a fate before obvious visible change; differentiation is the later expression of the specialized program and phenotype."},{"id":"r7-1015","kind":"recall","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"Reconstruct the potency hierarchy from broadest to narrowest.","a":"Totipotent -> pluripotent -> multipotent -> oligopotent -> unipotent."},{"id":"r7-1016","kind":"recall","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"What molecular principle makes a differentiated cell behave differently from its progenitor?","a":"Differential gene expression: the cells express different gene subsets and therefore contain different protein subsets."},{"id":"r7-1017","kind":"recall","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"Name the three central functional properties of a stem cell.","a":"Long or unlimited proliferative potential, self-renewal, and the capacity to differentiate into appropriate specialized cells; adult stem cells may also remain quiescent in tissue niches."},{"id":"r7-1018","kind":"recall","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"What developmental rearrangement creates the germ layers, and what are the three mammalian layers?","a":"Gastrulation reorganizes the blastula and produces ectoderm, mesoderm, and endoderm."},{"id":"r7-1019","kind":"recall","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"Match each germ layer to at least three derivatives from the slides.","a":"Endoderm: digestive tract, liver, pancreas. Mesoderm: kidney, cartilage, bone, spleen, circulatory and lymphatic systems. Ectoderm: nail, hair, dermis, brain, spinal cord, retina."},{"id":"r7-1020","kind":"recall","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"What did Gurdon's somatic cell nuclear transfer result demonstrate?","a":"A nucleus from a differentiated tadpole intestinal epithelial cell, transferred into an enucleated Xenopus egg, could in some cases support development into a normal tadpole; differentiation had not irreversibly destroyed the genetic information needed for development."},{"id":"r7-1021","kind":"recall","topics":["Stem Cells and Differentiation"],"module":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","q":"Name the four Yamanaka factors shown and two uses of iPSCs.","a":"Oct3/4, Sox2, c-Myc, and Klf4. Uses include patient-specific disease models, drug screening in target cells, avoiding some ESC ethical concerns, gene correction with CRISPR/Cas9, and producing cells or tissues for future transplantation."},{"id":"m8-1022","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"Which combination correctly describes adaptive immunity in the slide comparison?","options":["Immediate, nonspecific, no memory","Lag period, antigen-specific, develops memory","Immediate, antigen-specific, no memory","Lag period, nonspecific, no memory"],"answer":1,"explanation":"Specificity and memory distinguish adaptive immunity, whose initial response develops after a lag."},{"id":"m8-1023","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"Which is a biological rather than mechanical or chemical barrier?","options":["Normal flora competing for nutrients and space","Mucociliary escalator","Stomach hydrochloric acid","Lysozyme in tears"],"answer":0,"explanation":"Resident normal flora provide colonization resistance through antagonistic competition."},{"id":"m8-1024","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"Which organ is identified as a source of complement proteins?","options":["Liver","Skin","Thymus","Spleen"],"answer":0,"explanation":"The immune-system overview specifically notes that the liver makes complement proteins."},{"id":"m8-1025","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"A WBC moves up a chemical gradient toward bacteria. This is:","options":["Chemotaxis","Clonal expansion","Differentiation","Cytokinesis"],"answer":0,"explanation":"The slides identify chemotaxis as the mechanism by which neutrophils find microbes."},{"id":"m8-1026","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"Which leukocyte is the most abundant WBC and a major rapid phagocytic responder?","options":["Neutrophil","Monocyte","B lymphocyte","Mast cell"],"answer":0,"explanation":"Neutrophils are listed at about 50-60% of WBCs and as primary response phagocytes."},{"id":"m8-1027","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"A circulating cell enters tissue and differentiates into a 'big eater.' The circulating cell is a:","options":["Monocyte","Natural killer cell","B lymphocyte","Neutrophil extracellular trap"],"answer":0,"explanation":"Monocytes migrate into tissues and become macrophages."},{"id":"m8-1028","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"Which function links macrophages most directly to adaptive immunity?","options":["Antigen presentation","Stomach acid secretion","Urine flushing","Chromosome segregation"],"answer":0,"explanation":"Besides tissue phagocytosis, the slides list antigen presentation as a macrophage function."},{"id":"m8-1029","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"NK-cell cytotoxic granules contain molecules described in the slides as:","options":["Perforins and proteases","Antibodies and HCl","Cohesins and kinetochores","Lysozyme and phosphatidylserine"],"answer":0,"explanation":"NK cells release perforins and proteases to kill infected or cancerous host cells."},{"id":"r8-1030","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"Why do the slides call the immune system a functional system rather than a single organ system?","a":"Defense is distributed across skin, mucous membranes, secretions, blood cells and vessels, bone marrow, liver-derived complement, lymphatics and lymphoid organs, plus resident immune cells in many tissues."},{"id":"r8-1031","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"Give the three headline differences between innate and adaptive immunity.","a":"Innate immunity has essentially no time lag, is not antigen-specific, and has no memory; adaptive immunity has a lag, is antigen-specific, and develops memory."},{"id":"r8-1032","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"Give two examples each of mechanical, chemical, and biological external defenses.","a":"Mechanical: skin, mucociliary escalator, flushing by saliva/tears/urine. Chemical: antimicrobial peptides in sweat, stomach HCl, lysozyme in tears/saliva. Biological: normal flora occupying space and competing with pathogens for nutrients."},{"id":"r8-1033","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"Name the internal innate defenses in the typical immune-response diagram.","a":"Phagocytic cells, antimicrobial proteins, inflammatory response, natural killer cells, and complement."},{"id":"r8-1034","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"Why are neutrophils called primary response cells in these slides?","a":"They are the most abundant WBCs at about 50-60%, are efficient phagocytes, and rapidly rush to infection sites by chemotaxis."},{"id":"r8-1035","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"Describe neutrophil action as a five-step chain.","a":"Detect chemical cues -> move by chemotaxis -> contact and engulf the microbe -> form an intracellular compartment around it -> use granule digestive enzymes and antimicrobial proteins to kill and digest it; neutrophils can also form NETs and promote inflammation/adaptive responses."},{"id":"r8-1036","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"Relate monocytes to macrophages and distinguish macrophages from neutrophils.","a":"Monocytes circulate at about 2-10% of WBCs, enter tissues, and become macrophages. Macrophages are tissue 'big eaters' that phagocytose microbes and present antigen, whereas neutrophils normally circulate in blood and arrive rapidly."},{"id":"r8-1037","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","q":"How do NK cells identify and kill target cells according to the slides?","a":"Infected or cancer cells may lack normal surface proteins. NK cells recognize this altered or missing-self pattern and release granules containing perforins and proteases, killing the host target and its intracellular microbes."},{"id":"m9-1038","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"A bacterial mutation prevents binding of its surface adhesin to fibronectin. Which early pathogenic event is most directly impaired?","options":["Adherence to host tissue","Endotoxin release","Caspase activation","Antibody production"],"answer":"Adherence to host tissue","explanation":"The slides use fibronectin binding by Group A Streptococcus M protein as an example of attachment and invasion."},{"id":"m9-1039","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"Which bacterial structure can simultaneously reduce TLR recognition and inhibit phagocytosis?","options":["Capsule","Ribosome","Flagellar motor","Nucleoid"],"answer":"Capsule","explanation":"The capsule can hide PAMPs from pattern-recognition receptors and physically impede phagocytosis."},{"id":"m9-1040","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"Quorum sensing is best described as:","options":["Population-density sensing that alters bacterial gene expression","Antibody-mediated coating of bacteria","Random mutation during antibiotic treatment","Host-cell recognition of lipid A"],"answer":"Population-density sensing that alters bacterial gene expression","explanation":"The biofilm slide defines quorum sensing as sensing population density and changing gene expression."},{"id":"m9-1041","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"Which enzyme-factor pair is correctly matched?","options":["Collagenase - digestion of connective tissue","Coagulase - dissolution of blood clots","Streptokinase - formation of a protective clot","IgA protease - synthesis of mucosal IgA"],"answer":"Collagenase - digestion of connective tissue","explanation":"Collagenase supports tissue invasion. Coagulase promotes clotting, whereas streptokinase dissolves clots."},{"id":"m9-1042","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"Why can mycolic acid increase survival of Mycobacterium tuberculosis inside a host cell?","options":["It resists digestion by lysosomal enzymes","It permanently activates host Gs-alpha","It cleaves host fibronectin","It converts NADH to NAD+"],"answer":"It resists digestion by lysosomal enzymes","explanation":"The slides identify mycolic acid in the mycobacterial cell wall as a barrier to lysosomal digestion."},{"id":"m9-1043","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"Diphtheria toxin kills a host cell primarily by:","options":["ADP-ribosylating eEF-2 and blocking translation","Increasing cAMP through persistent Gs-alpha activation","Digesting collagen in the extracellular matrix","Activating TLR4 with lipid A"],"answer":"ADP-ribosylating eEF-2 and blocking translation","explanation":"Fragment A targets eEF-2, halting protein synthesis."},{"id":"m9-1044","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"The severe fluid loss in cholera follows directly from:","options":["A sustained rise in host-cell cAMP","Inhibition of host-cell ribosomes by eEF-2 modification","Suppression of all ion channels","Degradation of the intestinal collagen matrix"],"answer":"A sustained rise in host-cell cAMP","explanation":"Cholera toxin keeps Gs-alpha active, maintaining adenylyl cyclase activity and causing ion and water efflux into the intestine."},{"id":"m9-1045","kind":"mcq","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"Which statement about endotoxin is supported by the slides?","options":["It is heat-stable lipid A associated with Gram-negative LPS","It is an AB5 protein secreted by Vibrio cholerae","It is destroyed whenever bacteria are killed","It acts by ADP-ribosylating eEF-2"],"answer":"It is heat-stable lipid A associated with Gram-negative LPS","explanation":"The slides identify lipid A as endotoxin and warn that sterilization that kills bacteria may not eliminate this heat-stable material."},{"id":"r9-1046","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"Without looking, write the five-stage pathogenesis pipeline used in this module.","a":"Entry/adherence, colonization or biofilm formation, penetration or immune evasion, damage to host cells, and exit."},{"id":"r9-1047","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"What two interacting components are required for bacterial adherence?","a":"A microbial ligand or adhesin and a receptor on the host cell."},{"id":"r9-1048","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"Give three distinct ways a capsule can increase bacterial survival.","a":"It can aid attachment, mask PAMP recognition by receptors such as TLRs, inhibit phagocytosis, and resist lysosomal digestion. Any three earn full credit."},{"id":"r9-1049","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"Match the enzyme to its main action: hyaluronidase, collagenase, coagulase, streptokinase.","a":"Hyaluronidase digests hyaluronic-acid-rich connective material; collagenase digests collagen; coagulase promotes clot formation that can shield bacteria; streptokinase dissolves clots."},{"id":"r9-1050","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"What is quorum sensing, and why is it useful in a biofilm?","a":"It is the ability to sense population density and change gene expression, allowing a bacterial population to coordinate behaviors such as biofilm development."},{"id":"r9-1051","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"Trace diphtheria toxin from cell entry to cell death in four steps.","a":"Receptor-mediated endocytosis -> endosomal acidification and translocation of fragment A -> ADP-ribosylation of eEF-2 -> translation stops and the host cell dies."},{"id":"r9-1052","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"Trace cholera toxin from receptor binding to diarrhea.","a":"The B pentamer binds GM1 -> toxin enters the cell -> A1 reaches the cytosol and locks Gs-alpha in its active GTP-bound form -> adenylyl cyclase remains active -> cAMP rises -> ions and water move into the intestine, causing diarrhea."},{"id":"r9-1053","kind":"recall","topics":["Host Pathogen Interaction"],"module":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","q":"State two contrasts between exotoxin and endotoxin from these slides.","a":"Exotoxins are microbial protein toxins with specific intracellular targets; endotoxin is lipid A in Gram-negative LPS. Endotoxin is heat stable and is released during lysis, phagocytic digestion, or antibiotic killing, producing cytokines, inflammation, and fever."},{"id":"m10-1054","kind":"mcq","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"Which combination most strongly identifies apoptosis?","options":["Cell shrinkage, membrane blebbing, and apoptotic bodies","Cell swelling, membrane rupture, and DAMP release","PUFA phospholipid peroxidation and iron dependence","Lysosomal acidification and bulk degradation"],"answer":"Cell shrinkage, membrane blebbing, and apoptotic bodies","explanation":"These are classic morphological features listed for apoptosis."},{"id":"m10-1055","kind":"mcq","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"Which caspase pairing is correct?","options":["Caspase-8 initiator; caspase-3 executioner","Caspase-3 initiator; caspase-9 executioner","Caspase-6 initiator; caspase-8 executioner","Caspase-7 initiator; caspase-9 executioner"],"answer":"Caspase-8 initiator; caspase-3 executioner","explanation":"Caspases 8 and 9 are initiators; caspases 3, 6, and 7 are executioners."},{"id":"m10-1056","kind":"mcq","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"The most direct consequence of BAX and BAK oligomerization is:","options":["Mitochondrial outer-membrane permeabilization","Fas-ligand secretion","Plasma-membrane rupture by necroptosis","Lysosomal pH neutralization"],"answer":"Mitochondrial outer-membrane permeabilization","explanation":"BAX/BAK create the mitochondrial event that permits cytochrome c release."},{"id":"m10-1057","kind":"mcq","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"Which event belongs to the extrinsic apoptosis pathway?","options":["FADD-dependent DISC assembly and caspase-8 activation","Cytochrome c release followed by apoptosome formation","Ferritinophagy followed by lipid peroxidation","ZBP1 recognition of Z-nucleic acids"],"answer":"FADD-dependent DISC assembly and caspase-8 activation","explanation":"Fas receptor signaling uses FADD and the DISC to activate caspase-8."},{"id":"m10-1058","kind":"mcq","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"A dying cell has a ruptured membrane, swollen cytoplasm, swollen mitochondria, and releases DAMPs. The best diagnosis is:","options":["Necroptosis","Apoptosis","Autophagy","Cell-cycle arrest"],"answer":"Necroptosis","explanation":"The lytic morphology and inflammatory DAMP release match necroptosis."},{"id":"m10-1059","kind":"mcq","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"Necroptosis is especially likely when:","options":["Caspase-8 or apoptosis is inhibited","BAX and BAK are strongly activated","Executioner caspases are fully active","Phosphatidylserine exposure causes silent phagocytosis"],"answer":"Caspase-8 or apoptosis is inhibited","explanation":"The slides define necroptosis as commonly activated when apoptosis is blocked, often through loss or inhibition of caspase-8."},{"id":"m10-1060","kind":"mcq","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"Why are lysosomal enzymes effective inside lysosomes?","options":["Their activity is turned on by the low luminal pH","They require high cytosolic cAMP","They are activated by Fas ligand","They require mitochondrial cytochrome c"],"answer":"Their activity is turned on by the low luminal pH","explanation":"The autophagy slide emphasizes the acidic lysosomal lumen and its degradative enzymes."},{"id":"m10-1061","kind":"mcq","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"Loss of which protective enzyme would most directly increase ferroptotic lipid damage?","options":["GPX4","Caspase-8","FADD","BCL-2"],"answer":"GPX4","explanation":"GPX4 uses glutathione to reduce lipid hydroperoxides and counter PUFA-phospholipid oxidation."},{"id":"r10-1062","kind":"recall","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"List four morphological and three biochemical features of apoptosis.","a":"Morphological: cell shrinkage, chromatin condensation, nuclear fragmentation, membrane blebbing, apoptotic bodies, and phagocytosis; any four. Biochemical: caspase activation, DNA fragmentation, and phosphatidylserine inversion or exposure."},{"id":"r10-1063","kind":"recall","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"Sort these caspases into initiators and executioners: 3, 6, 7, 8, 9.","a":"Initiators: caspase-8 and caspase-9. Executioners: caspase-3, caspase-6, and caspase-7."},{"id":"r10-1064","kind":"recall","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"Recite the intrinsic apoptosis sequence from BAX/BAK to cell death.","a":"BAX/BAK activation and oligomerization -> mitochondrial outer-membrane permeabilization -> cytochrome c release -> apoptosome formation -> initiator caspase activation, especially caspase-9 -> executioner caspases -> apoptosis."},{"id":"r10-1065","kind":"recall","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"How does overexpressed BCL-2 favor cancer-cell survival?","a":"BCL-2 sequesters pro-apoptotic proteins, prevents BAX/BAK activation and mitochondrial permeabilization, and therefore blocks the downstream apoptotic cascade."},{"id":"r10-1066","kind":"recall","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"Recite the extrinsic Fas pathway from ligand binding to executioner caspases.","a":"Fas ligand binds Fas death receptor -> receptor death domains recruit FADD -> DISC assembles -> caspase-8 molecules dimerize and activate -> caspases 3 and 7 are activated -> apoptosis."},{"id":"r10-1067","kind":"recall","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"Give four clues that favor necroptosis over apoptosis.","a":"Caspase independence, plasma-membrane rupture, inflammatory DAMP release, cytoplasmic swelling or vacuolization, swollen mitochondria, and absence of strongly condensed fragmented nuclei; any four."},{"id":"r10-1068","kind":"recall","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"What activates extrinsic versus intrinsic necroptosis in the slides?","a":"Extrinsic necroptosis can be triggered by death receptors such as TNFR1 or pattern-recognition receptors such as TLR3 and TLR4. Intrinsic necroptosis is initiated by ZBP1 recognition of Z-nucleic acids."},{"id":"r10-1069","kind":"recall","topics":["Cell Death Pathways"],"module":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","q":"State the damaging chemistry of ferroptosis and name three protective systems shown.","a":"Iron promotes peroxidation of PUFA-containing phospholipids, causing membrane disruption. Protective systems include GPX4 with glutathione, FSP1 with reduced CoQ, DHFR with BH4, and alpha-tocopherol; any three."},{"id":"m11-1070","kind":"mcq","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"A cell line grows as piled-up foci rather than an orderly monolayer. Which cancer-associated property does this demonstrate?","options":["Loss of contact inhibition","Restored anchorage dependence","Increased apoptotic clearance","Loss of glucose uptake"],"answer":"Loss of contact inhibition","explanation":"The slide shows transformed cells continuing to divide and forming foci after losing contact inhibition."},{"id":"m11-1071","kind":"mcq","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"Which component belongs to tumor stroma rather than the malignant cell population itself?","options":["Carcinoma-associated fibroblast","Activated KRAS inside a cancer cell","Mutant p53 in a cancer cell","Truncated EGFR in a cancer cell"],"answer":"Carcinoma-associated fibroblast","explanation":"Stroma includes nonmalignant fibroblasts, immune cells, endothelial cells, and related support cells."},{"id":"m11-1072","kind":"mcq","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"Under normal oxygen conditions, HIF-alpha is usually:","options":["Hydroxylated, recognized by VHL, ubiquitinated, and degraded","Stabilized and used to activate angiogenesis genes","Converted into lactate by LDH","Bound to PD-1 on T cells"],"answer":"Hydroxylated, recognized by VHL, ubiquitinated, and degraded","explanation":"The hypoxia slide contrasts normoxic HIF-alpha destruction with hypoxic stabilization."},{"id":"m11-1073","kind":"mcq","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"Why does pyruvate-to-lactate conversion support high glycolytic activity in cancer cells?","options":["It regenerates NAD+ from NADH","It directly generates oxygen","It activates p53 transcription","It prevents glucose entry through GLUTs"],"answer":"It regenerates NAD+ from NADH","explanation":"Regenerated NAD+ can be reused in glucose-to-pyruvate metabolism."},{"id":"m11-1074","kind":"mcq","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"Blocking the PD-1:PD-L1 interaction is expected to:","options":["Increase T-cell activity against tumor cells","Suppress all T-cell receptor signaling","Increase HIF-alpha degradation in hypoxia","Convert a tumor suppressor into an oncogene"],"answer":"Increase T-cell activity against tumor cells","explanation":"PD-1:PD-L1 is inhibitory; anti-PD-1 or anti-PD-L1 antibodies release this brake."},{"id":"m11-1075","kind":"mcq","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"Which genetic change most closely fits activation of a proto-oncogene?","options":["A gain-of-function mutation in one EGFR allele","Loss-of-function mutations in both copies of a tumor suppressor","Deletion of both p53 alleles only","Inactivation of p21 by normal p53 signaling"],"answer":"A gain-of-function mutation in one EGFR allele","explanation":"Proto-oncogenes become oncogenes through activating gain-of-function events, and one altered copy can be enough."},{"id":"m11-1076","kind":"mcq","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"A truncation removes the extracellular ligand-binding region of EGFR but leaves the intracellular signaling region hyperphosphorylated. The likely result is:","options":["Ligand-independent growth signaling","Permanent shutdown of all receptor signaling","Immediate activation of p21 by p53","Loss of tumor-cell glucose uptake"],"answer":"Ligand-independent growth signaling","explanation":"The slide shows truncated EGFR triggering intracellular signaling even without growth factor."},{"id":"m11-1077","kind":"mcq","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"Which sequence correctly describes the p53 checkpoint?","options":["DNA damage -> p53 -> p21 -> cyclin-CDK inhibition -> cell-cycle arrest","DNA damage -> MDM2 -> p21 degradation -> faster cell division","PD-L1 -> p53 -> HIF-alpha degradation -> apoptosis","EGFR truncation -> p21 activation -> contact inhibition"],"answer":"DNA damage -> p53 -> p21 -> cyclin-CDK inhibition -> cell-cycle arrest","explanation":"p53 acts as a tumor-suppressor transcription factor by inducing p21 and pausing the cycle for repair."},{"id":"r11-1078","kind":"recall","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"Distinguish proliferation, invasion, and metastasis in one sentence each.","a":"Proliferation is continued cell division; invasion is penetration into surrounding tissue through extracellular matrix or basement membrane; metastasis is spread from the primary tumor to nearby or distant sites."},{"id":"r11-1079","kind":"recall","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"How can either increased division or decreased apoptosis produce a tumor?","a":"Both create a net accumulation of cells: faster production raises cell number, while reduced removal lets cells persist and accumulate."},{"id":"r11-1080","kind":"recall","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"What is the stroma, and what do carcinoma-associated fibroblasts do?","a":"Stroma is the nonmalignant supportive cellular environment around a tumor. Carcinoma-associated fibroblasts remodel extracellular matrix and secrete factors that influence tumor growth, invasion, inflammation, and angiogenesis."},{"id":"r11-1081","kind":"recall","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"Contrast the fate of HIF-alpha in normoxia and hypoxia.","a":"In normoxia HIF-alpha is hydroxylated, bound by VHL, ubiquitinated, and degraded by the proteasome. In hypoxia it is stabilized, partners with HIF-beta, enters or acts in the nucleus, and activates hypoxia-response genes."},{"id":"r11-1082","kind":"recall","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"What is the metabolic logic of converting pyruvate to lactate in the Warburg-effect slide?","a":"The reaction consumes NADH and regenerates NAD+, which supports continued conversion of glucose to pyruvate during high glycolytic flux."},{"id":"r11-1083","kind":"recall","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"Name four immune-evasion strategies shown in the cancer slides.","a":"Loss of tumor antigen or MHC, expression of non-classical HLA, inhibitory ligand-receptor signaling to T cells, immunosuppressive cytokines, and recruitment of suppressive cells such as Tregs or MDSCs; any four."},{"id":"r11-1084","kind":"recall","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"State the oncogene versus tumor-suppressor rule, including gain or loss of function and the typical number of mutational hits.","a":"An oncogene results from gain-of-function activation of a proto-oncogene and one altered copy may be sufficient. A tumor suppressor promotes cancer when function is lost, commonly after both gene copies are inactivated."},{"id":"r11-1085","kind":"recall","topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"],"module":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","q":"Trace the p53 checkpoint and then explain how MDM2 or MDMX oppose it.","a":"DNA damage raises p53 -> p53 induces p21 -> p21 inhibits cyclin-CDK -> the cell cycle pauses for repair. MDM2 and MDMX bind and inhibit p53; MDM2 also supports nuclear export, ubiquitination, and proteasomal degradation of p53, while MDMX can strengthen MDM2 activity."},{"id":"m12-1086","kind":"mcq","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"Which pharmacokinetic quantity most directly represents total drug exposure over time?","options":["Cmax","tmax","AUC","Half-life only"],"answer":"AUC","explanation":"AUC is the area under the plasma concentration-time curve and represents total exposure."},{"id":"m12-1087","kind":"mcq","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"Which reaction is best classified as a conjugation reaction in the Lecture 34 scheme?","options":["Hydrolysis","Dealkylation","Glucuronidation","Epoxidation"],"answer":"Glucuronidation","explanation":"Glucuronidation attaches a polar group and is a classic conjugation reaction."},{"id":"m12-1088","kind":"mcq","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"A cysteine conjugate is processed by beta-lyase. What slide-specific risk was highlighted?","options":["Reactive thiol formation and nephrotoxicity","Loss of all renal filtration","Irreversible ACE activation","Conversion into glutathione"],"answer":"Reactive thiol formation and nephrotoxicity","explanation":"Lecture 34 notes that beta-lyase can generate reactive thiols from cysteine conjugates, causing nephrotoxicity."},{"id":"m12-1089","kind":"mcq","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"What is the main purpose of high-throughput screening in early drug discovery?","options":["To determine the final clinical dose","To identify hits from large compound libraries","To replace all medicinal chemistry","To measure only drug metabolism"],"answer":"To identify hits from large compound libraries","explanation":"HTS experimentally tests many compounds to identify initial active hits for later validation and optimization."},{"id":"m12-1090","kind":"mcq","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"ACE normally acts directly on which substrate in the RAAS pathway?","options":["Angiotensinogen","Angiotensin I","Aldosterone","Renin"],"answer":"Angiotensin I","explanation":"ACE converts angiotensin I toward angiotensin II; blocking ACE reduces angiotensin II formation."},{"id":"m12-1091","kind":"mcq","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"Which statement about the captopril development story is correct?","options":["Captopril was isolated unchanged from snake venom","Teprotide was a venom-derived ACE-inhibiting peptide lead","Captopril activates ACE to lower blood pressure","Teprotide was developed as a glucuronidation reagent"],"answer":"Teprotide was a venom-derived ACE-inhibiting peptide lead","explanation":"The venom peptide teprotide inspired synthetic ACE-inhibitor development; captopril itself was a designed small molecule."},{"id":"m12-1092","kind":"mcq","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"Which captopril feature is especially important for interaction with the ACE active-site metal?","options":["Thiol coordination to Zn2+","A phosphate on the N-ring","A fluorescent dye","A peptide bond cleaved by renin"],"answer":"Thiol coordination to Zn2+","explanation":"The thiol is a strong Zn2+-binding group, and the slides emphasize metal coordination as essential for activity."},{"id":"m12-1093","kind":"mcq","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"Why can esterification of a carboxylate or phosphate group be useful in an ACE-inhibitor series?","options":["It can create a prodrug with improved delivery properties","It permanently prevents conversion to the active drug","It guarantees stronger Zn2+ binding than a thiol","It converts the inhibitor into an antibody"],"answer":"It can create a prodrug with improved delivery properties","explanation":"The SAR slide identifies esterification as a way to produce prodrugs, often improving absorption before the ester is removed in the body."},{"id":"r12-1094","kind":"recall","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"On a plasma concentration-time graph, what do Cmax and tmax represent?","a":"Cmax is the maximum plasma concentration reached; tmax is the time at which Cmax occurs."},{"id":"r12-1095","kind":"recall","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"What does AUC measure, and why does it matter?","a":"AUC measures total drug exposure over time; dosage is adjusted to obtain an appropriate exposure."},{"id":"r12-1096","kind":"recall","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"Give three Phase I-type reactions listed in Lecture 34.","a":"Any three of hydroxylation, epoxidation followed by hydroxylation, reduction, oxidative deamination, hydrolysis, dealkylation, nitrogen/sulfur oxidation, or dehalogenation."},{"id":"r12-1097","kind":"recall","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"What is the broad purpose of conjugation reactions such as glucuronidation or sulfation?","a":"They generally increase polarity and facilitate excretion through urine or bile."},{"id":"r12-1098","kind":"recall","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"What happens to glutathione conjugates in the mercapturic acid pathway?","a":"They are degraded to cysteine conjugates, often N-acetylated, and then excreted in urine."},{"id":"r12-1099","kind":"recall","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"In drug discovery, distinguish a hit from a lead.","a":"A hit shows activity in a screen; a lead is a selected hit or series that has undergone enough validation and optimization to justify further development."},{"id":"r12-1100","kind":"recall","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"What biological observation led to captopril development?","a":"Brazilian pit viper Bothrops jararaca venom showed hypotensive activity, and the venom peptide teprotide inhibited ACE."},{"id":"r12-1101","kind":"recall","topics":["Drug Development 1","Drug Development 2"],"module":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","q":"Name the three high-yield captopril-ACE interaction features shown in the slides.","a":"Coordination to catalytic Zn2+, carboxylate ionic and hydrogen-bond interactions, and hydrophobic interactions involving the methyl/N-ring region."},{"id":"m13-1102","kind":"mcq","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"A screen measures whether compounds selectively kill KRAS-mutant cells, without first requiring one purified protein target. This is best described as:","options":["Phenotypic screening","ITC","TSA","Phase II metabolism"],"answer":"Phenotypic screening","explanation":"The readout is a cellular phenotype and selectivity between cell states, which is the defining logic of phenotypic screening."},{"id":"m13-1103","kind":"mcq","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"In otherwise identical assays, which compound is most potent?","options":["EC50 = 10 nM","EC50 = 100 nM","EC50 = 1 micromolar","EC50 = 10 micromolar"],"answer":"EC50 = 10 nM","explanation":"Lower EC50 indicates that less compound is needed for the half-maximal effect."},{"id":"m13-1104","kind":"mcq","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"During a TSA experiment, the initial increase in SYPRO Orange fluorescence most directly indicates:","options":["Exposure of hydrophobic surfaces as protein unfolds","Formation of a covalent ligand-protein bond","Direct measurement of binding enthalpy","Energy transfer from CFP to YFP"],"answer":"Exposure of hydrophobic surfaces as protein unfolds","explanation":"SYPRO Orange binds exposed hydrophobic regions that become accessible during unfolding."},{"id":"m13-1105","kind":"mcq","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"A ligand shifts a protein's Tm from 48 C to 55 C in TSA. The most appropriate interpretation is:","options":["The ligand likely stabilizes the folded protein","The ligand certainly binds covalently","The ligand has no interaction with the protein","The protein has become less thermally stable"],"answer":"The ligand likely stabilizes the folded protein","explanation":"A positive thermal shift is consistent with preferential binding to and stabilization of the native state."},{"id":"m13-1106","kind":"mcq","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"For an exothermic binding event in the ITC setup described, what happens to feedback power supplied to the sample cell?","options":["It decreases","It increases without limit","It is replaced by fluorescence","It becomes identical to heat of dilution by definition"],"answer":"It decreases","explanation":"The reaction releases heat, so less compensating power is needed to keep the sample cell at the reference temperature."},{"id":"m13-1107","kind":"mcq","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"At the end of an ITC titration, the protein is saturated. Subsequent injections mainly show:","options":["Heat of dilution","Increasing numbers of unoccupied binding sites","A new protein melting temperature","FRET efficiency at R0"],"answer":"Heat of dilution","explanation":"Once binding sites are saturated, little additional binding occurs, leaving mainly dilution-related heat."},{"id":"m13-1108","kind":"mcq","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"Which relationship between association and dissociation constants is shown in the ITC slides?","options":["Ka = 1/Kd","Ka = Kd","Ka = Kd squared","Ka is unrelated to Kd"],"answer":"Ka = 1/Kd","explanation":"Association and dissociation constants are reciprocals; stronger binding corresponds to larger Ka and smaller Kd."},{"id":"m13-1109","kind":"mcq","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"In the cameleon Ca2+ sensor, addition of Ca2+ promotes CaM-M13 interaction. What readout is expected?","options":["Increased FRET and a shift toward yellow emission","Loss of both fluorophores by hydrolysis","A direct ITC heat-of-dilution peak","A lower AUC"],"answer":"Increased FRET and a shift toward yellow emission","explanation":"Ca2+-dependent CaM-M13 association brings CFP and YFP into a FRET-compatible arrangement."},{"id":"r13-1110","kind":"recall","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"What is the defining starting point of phenotypic screening?","a":"An observable biological phenotype or functional effect, rather than necessarily beginning with one predefined molecular target."},{"id":"r13-1111","kind":"recall","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"If compound A has EC50 25 nM and compound B has EC50 578 nM in the same assay, which is more potent?","a":"Compound A, because a lower concentration produces half-maximal effect."},{"id":"r13-1112","kind":"recall","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"What physical change does SYPRO Orange report in TSA?","a":"Exposure of hydrophobic protein surfaces during thermal unfolding."},{"id":"r13-1113","kind":"recall","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"What does a positive Tm shift after adding a ligand usually suggest?","a":"The ligand preferentially binds and stabilizes the native protein."},{"id":"r13-1114","kind":"recall","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"In ITC, why does the heat signal decrease over successive injections?","a":"The protein becomes progressively saturated, so less newly injected ligand binds; after saturation, mainly heat of dilution remains."},{"id":"r13-1115","kind":"recall","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"What three binding quantities can be obtained from a well-shaped ITC binding isotherm?","a":"Binding affinity, stoichiometry, and enthalpy."},{"id":"r13-1116","kind":"recall","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"Why must ligand-into-buffer control data be collected for ITC?","a":"To measure heat of dilution so it can be subtracted from the binding experiment."},{"id":"r13-1117","kind":"recall","topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"module":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","q":"What two conditions are especially important for efficient FRET?","a":"Strong overlap between donor emission and acceptor absorption spectra, and very small donor-acceptor separation, usually below about 10 nm."},{"id":"m14-1118","kind":"mcq","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"A mutation changes a promoter so that much less mRNA is produced, but the protein sequence would be unchanged if translation occurred. The primary defect is in:","options":["Transcriptional regulation","Protein folding measured by TSA","Motor-protein stepping","Phase II drug metabolism"],"answer":"Transcriptional regulation","explanation":"A promoter controls initiation and level of transcription; reduced mRNA with an unchanged coding sequence points to regulation of RNA production."},{"id":"m14-1119","kind":"mcq","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"Which pairing correctly matches a cellular component with its main role?","options":["Molecular motor - converts chemical energy into directed movement","Receptor - synthesizes DNA primers during PCR","Ribosome - generates an ion gradient across every membrane","Restriction enzyme - measures binding enthalpy"],"answer":"Molecular motor - converts chemical energy into directed movement","explanation":"Motors use chemical energy, commonly from ATP, to perform mechanical work on cytoskeletal tracks."},{"id":"m14-1120","kind":"mcq","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"A cell activates an organized protease cascade, fragments its contents, and is cleared with limited inflammation. This most strongly indicates:","options":["Apoptosis","Uncontrolled necrotic damage","Stem-cell self-renewal","Transcription"],"answer":"Apoptosis","explanation":"An organized death program with controlled dismantling and limited inflammation is characteristic of apoptosis."},{"id":"m14-1121","kind":"mcq","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"Which feature best distinguishes adaptive immunity from an immediate innate response?","options":["Antigen-specific receptor selection and memory","Recognition of broad danger patterns","Rapid barrier defense","Presence in multicellular organisms"],"answer":"Antigen-specific receptor selection and memory","explanation":"Specificity and memory are the decisive adaptive-immune clues."},{"id":"m14-1122","kind":"mcq","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"A compound causes the desired cellular phenotype at 20 nM but its molecular target is initially unknown. Which early strategy most directly produced this observation?","options":["Phenotypic screening","ITC against a purified known target","AUC measurement in plasma","DNA ligation"],"answer":"Phenotypic screening","explanation":"Phenotypic screening can identify useful cellular effects before the exact target is established."},{"id":"m14-1123","kind":"mcq","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"A researcher wants affinity, binding stoichiometry, and enthalpy for a purified protein-ligand interaction. Which method is most suitable?","options":["ITC","TSA alone","FRET imaging alone","Plasma AUC"],"answer":"ITC","explanation":"A fitted ITC isotherm can provide affinity, stoichiometry, and enthalpy directly from binding heat."},{"id":"m14-1124","kind":"mcq","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"A drug candidate has a high peak concentration but very small total exposure. Which pair of measurements captures that statement?","options":["High Cmax and low AUC","Low Cmax and high AUC","High Tm and low FRET","Low Ka and high EC50 only"],"answer":"High Cmax and low AUC","explanation":"Cmax is the peak concentration, while AUC is total exposure over time."},{"id":"m14-1125","kind":"mcq","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"Which sequence best represents a rational cross-course workflow?","options":["Identify disease mechanism or phenotype, find hits, validate target/activity, optimize leads, test exposure and safety","Approve a drug, discover its target, then begin screening","Measure AUC, create a disease mutation, then identify a phenotype","Run FRET, assume clinical efficacy, and skip optimization"],"answer":"Identify disease mechanism or phenotype, find hits, validate target/activity, optimize leads, test exposure and safety","explanation":"The sequence connects biology, screening, mechanistic assays, medicinal chemistry, and pharmacokinetic/safety evaluation in the correct direction."},{"id":"r14-1126","kind":"recall","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"Give one example each of energy coupling, information transfer, and mechanical work in a cell.","a":"Examples: ATP hydrolysis or an ion gradient for energy coupling; DNA transcription and RNA translation for information transfer; motor-protein movement on actin or microtubules for mechanical work."},{"id":"r14-1127","kind":"recall","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"What single distinction separates transcriptional regulation from post-transcriptional regulation?","a":"Transcriptional regulation changes RNA production from DNA; post-transcriptional regulation acts after RNA is made, for example through processing, stability, localization, or translation."},{"id":"r14-1128","kind":"recall","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"Why are a receptor and a molecular motor not interchangeable descriptions?","a":"A receptor primarily detects and transduces a signal, whereas a motor converts chemical energy into directed mechanical movement."},{"id":"r14-1129","kind":"recall","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"Distinguish apoptosis, necrotic damage, and ferroptosis using one clue for each.","a":"Apoptosis is an organized programmed-death pathway; necrotic damage involves loss of membrane integrity and inflammatory release; ferroptosis is associated with iron-dependent lipid peroxidation."},{"id":"r14-1130","kind":"recall","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"How can a stem cell divide without losing the stem-cell pool?","a":"Through self-renewal, often including asymmetric outcomes in which one daughter retains stem identity while another begins differentiation."},{"id":"r14-1131","kind":"recall","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"Give the fastest exam distinction between innate and adaptive immunity.","a":"Innate immunity is rapid and pattern-based without classical antigen-specific memory; adaptive immunity is receptor-specific and develops memory."},{"id":"r14-1132","kind":"recall","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"Connect a cancer mutation, a screening strategy, and a drug-development measurement in one chain.","a":"A mutation such as oncogenic RAS creates a disease phenotype; phenotypic or high-throughput screening identifies active compounds; assays such as TSA, ITC, or functional dose-response measurements characterize interaction or activity before optimization."},{"id":"r14-1133","kind":"recall","topics":["Mixed Review (all topics)"],"module":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","q":"For TSA, ITC, and FRET, state the deciding signal in one phrase each.","a":"TSA: change in melting temperature; ITC: heat released or absorbed during binding; FRET: distance-dependent donor-to-acceptor energy transfer."}]};
const KEY="sbl-question-bank-v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=i=>String.fromCharCode(65+i);
let S={sel:[],filter:"all",kind:"all",shuffle:false,ans:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch{}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const h=new URLSearchParams(location.hash.slice(1));
if(h.get("topic")&&D.topics.includes(h.get("topic")))S.sel=[h.get("topic")];
if(!S.sel.length)S.sel=[D.topics[0]];
const PAGE=40;let shown=PAGE,order=[];
// status: "right" | "wrong" | undefined ; recall stores "right"/"wrong" via self-grade
const status=q=>{const a=S.ans[q.id];return a==null?undefined:(q.kind==="mcq"?(a===q.answer?"right":"wrong"):a)};
function renderNav(){
  const box=$("nav");
  box.innerHTML=`<div class="navtools"><button class="btn" id="selAll">Select all</button><button class="btn" id="selNone">Clear</button></div>`+
    D.topics.map((t,i)=>{
      const qs=D.questions.filter(q=>q.topics.includes(t));const done=qs.filter(q=>status(q)).length;const ok=qs.filter(q=>status(q)==="right").length;
      return `<label class="trow"><input type="checkbox" data-t="${esc(t)}" ${S.sel.includes(t)?"checked":""}><span style="flex:1">${i+1}. ${esc(t)}<small>${qs.length} Qs · ${done} done · ${ok} right</small><div class="minibar"><i style="width:${qs.length?done/qs.length*100:0}%"></i></div></span></label>`;
    }).join("");
  box.querySelectorAll("input[data-t]").forEach(c=>c.onchange=()=>{const t=c.dataset.t;S.sel=c.checked?[...S.sel,t]:S.sel.filter(x=>x!==t);save();rebuild()});
  $("selAll").onclick=()=>{S.sel=[...D.topics];save();rebuild()};
  $("selNone").onclick=()=>{S.sel=[];save();rebuild()};
}
function pool(){
  return D.questions.filter(q=>q.topics.some(t=>S.sel.includes(t))&&(S.kind==="all"||q.kind===S.kind));
}
function visible(){
  const st=q=>status(q);
  return order.filter(q=>S.filter==="all"||(S.filter==="new"?!st(q):st(q)===S.filter));
}
function rebuild(){
  order=pool();
  if(S.shuffle){for(let i=order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[order[i],order[j]]=[order[j],order[i]]}}
  shown=PAGE;renderNav();renderList();
}
function qHtml(q,n){
  const st=status(q),a=S.ans[q.id];
  const src=q.page?`<a href="slides.html#page=${q.page}" target="_blank">Slide ${q.page}</a>`:`<span>${esc(q.module)}</span>`;
  const head=`<div class="qhead"><span>#${n}</span><span>${esc(q.topics.join(" / "))}</span>${src}<span>${q.kind==="mcq"?"MCQ":"Recall"}</span></div>`;
  let body;
  if(q.kind==="mcq"){
    const answered=a!=null;
    body=`<div class="choices">${q.options.map((o,i)=>`<button class="choice${answered&&i===q.answer?" correct":""}${answered&&i===a&&a!==q.answer?" wrong":""}" data-i="${i}" ${answered?"disabled":""}>${L(i)}. ${esc(o)}</button>`).join("")}</div>
      ${answered?`<div class="fb"><strong>${a===q.answer?"Correct.":"Answer: "+L(q.answer)+"."}</strong> ${esc(q.explanation)}</div><div class="row"><button class="btn retry">Try again</button></div>`:""}`;
  }else{
    body=st?`<div class="answer">${esc(q.a)}</div><div class="row"><span class="meta">You marked: ${st==="right"?"knew it":"didn't know"}</span><button class="btn retry">Try again</button></div>`
      :`<div class="row"><button class="btn reveal">Show answer</button></div><div class="answer" hidden>${esc(q.a)}</div><div class="row grade" hidden><span class="meta">Did you know it?</span><button class="btn" data-g="right">Yes</button><button class="btn" data-g="wrong">No</button></div>`;
  }
  return `<article class="q ${st==="right"?"right":st==="wrong"?"wrongq":""}" data-id="${q.id}">${head}<div class="qtext">${esc(q.q)}</div>${body}</article>`;
}
function bind(el,q,n){
  const redo=()=>{const t=document.createElement("div");t.innerHTML=qHtml(q,n);const ne=t.firstElementChild;el.replaceWith(ne);bind(ne,q,n);renderStats();renderNav()};
  el.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{S.ans[q.id]=+b.dataset.i;save();redo()});
  const r=el.querySelector(".retry");if(r)r.onclick=()=>{delete S.ans[q.id];save();redo()};
  const rv=el.querySelector(".reveal");if(rv)rv.onclick=()=>{rv.hidden=true;el.querySelector(".answer").hidden=false;el.querySelector(".grade").hidden=false};
  el.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.ans[q.id]=b.dataset.g;save();redo()});
}
function renderStats(){
  const p=order,done=p.filter(q=>status(q)).length,ok=p.filter(q=>status(q)==="right").length;
  $("stats").textContent=`Selected: ${done}/${p.length} attempted · ${ok} right${done?` (${Math.round(ok/done*100)}%)`:""}`;
}
function renderList(){
  document.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("on",b.dataset.f===S.filter));
  $("kind").value=S.kind;$("shuffle").checked=S.shuffle;
  const v=visible();
  $("summary").textContent=S.sel.length?`${v.length} question${v.length===1?"":"s"} in: ${S.sel.join(", ")}`:"";
  if(!S.sel.length){$("list").innerHTML=`<div class="empty">Pick one or more topics on the left.</div>`;$("more").hidden=true;renderStats();return}
  if(!v.length){$("list").innerHTML=`<div class="empty">No questions match this filter.</div>`;$("more").hidden=true;renderStats();return}
  $("list").innerHTML=v.slice(0,shown).map((q,i)=>qHtml(q,i+1)).join("");
  $("list").querySelectorAll(".q").forEach((el,i)=>bind(el,v[i],i+1));
  $("more").hidden=shown>=v.length;$("more").textContent=`Load more (${v.length-shown} left)`;
  renderStats();
}
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;save();shown=PAGE;renderList()});
$("kind").onchange=e=>{S.kind=e.target.value;save();rebuild()};
$("shuffle").onchange=e=>{S.shuffle=e.target.checked;save();rebuild()};
$("more").onclick=()=>{shown+=PAGE;renderList()};
$("reset").onclick=()=>{pool().forEach(q=>delete S.ans[q.id]);save();rebuild()};
$("menuBtn").onclick=()=>{if(matchMedia("(max-width:900px)").matches)$("nav").classList.toggle("open");else{const c=document.body.classList.toggle("collapsed");try{localStorage.setItem("sbl-nav-collapsed",c?"1":"")}catch{}}};
try{if(localStorage.getItem("sbl-nav-collapsed"))document.body.classList.add("collapsed")}catch{}
rebuild();
</script>
</body>
</html>
