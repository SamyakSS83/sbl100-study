<style>
:root{color-scheme:light dark;--bg:#eef1ed;--panel:#fff;--ink:#15201a;--muted:#647069;--line:#cbd2cd;--accent:#176b48;--accent2:#dff1e7;--warn:#8a5a00;--warn2:#fff3d6;--blue:#1f4f8a;--blue2:#e3ecf8}
@media(prefers-color-scheme:dark){:root{--bg:#0e1511;--panel:#18211c;--ink:#edf5ef;--muted:#a8b5ad;--line:#34443a;--accent:#77d6a3;--accent2:#203d2e;--warn:#ffcf70;--warn2:#3a2f14;--blue:#9cc3ff;--blue2:#1c2a3d}}
*{box-sizing:border-box}html{scroll-padding-top:64px}body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 ui-sans-serif,system-ui,-apple-system,sans-serif}
a{color:var(--accent)}button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0}.grow{flex:1}.meta{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);border-radius:9px;background:transparent;padding:7px 12px;cursor:pointer;text-decoration:none;color:var(--ink)}.btn:hover{border-color:var(--accent)}.btn.on{background:var(--accent2);border-color:var(--accent)}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 54px)}
nav{position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:10px}
.topic{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:9px;padding:8px 10px;cursor:pointer}
.topic:hover{border-color:var(--line)}.topic.on{background:var(--accent2);border-color:var(--accent);font-weight:650}
body.collapsed .layout{grid-template-columns:1fr}body.collapsed nav{display:none}
main{padding:18px;max-width:1000px;width:100%;margin:0 auto}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin-bottom:22px}
.sum>h2{margin:0;font-size:24px}.gist{font-size:17px;margin:8px 0 4px;color:var(--muted)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.sec h3{font-size:17px;margin:20px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec h3 .meta{font-weight:400}
ul{padding-left:20px;margin:0}li{margin:5px 0}
.box{border-radius:11px;padding:12px 16px;margin-top:18px}.box h3{margin:0 0 6px;font-size:15px;border:0}
.remember{background:var(--accent2)}.remember h3{color:var(--accent)}
.traps{background:var(--warn2)}.traps h3{color:var(--warn)}
.dist{background:var(--blue2)}.dist h3{color:var(--blue)}
.dist table{width:100%;border-collapse:collapse}.dist td{padding:6px 8px;vertical-align:top;border-top:1px solid var(--line)}.dist tr:first-child td{border-top:0}.dist td:first-child{font-weight:650;width:34%}
@media(max-width:900px){.layout{grid-template-columns:1fr}nav{display:none;position:fixed;inset:54px 0 0 0;height:auto;z-index:10}nav.open{display:block!important}main{padding:10px}.sum{padding:16px}.dist td:first-child{width:40%}}
@media print{.top,nav{display:none}.layout{display:block}.sum{break-inside:auto;border:0}body{background:#fff;color:#000}}
</style>

<script>
const D=[{"topic":"Bioenergetics","oneLiner":"Cells obey thermodynamics: ΔG (= ΔH − TΔS) sets reaction direction, actual ΔG depends on concentrations, and ATP couples favorable to unfavorable reactions mainly through group transfer.","sections":[{"heading":"Metabolism: catabolism vs anabolism","points":["Metabolism = sum of all enzyme-catalyzed chemical transformations, organized as ordered metabolic pathways (linear, branched or cyclic).","Catabolism breaks down nutrients, releases energy; generally convergent (many inputs → few common products).","Anabolism builds molecules using energy; generally divergent (few precursors → many products); many anabolic reactions are endergonic.","Opposing pathways use separate enzyme sets, are reciprocally regulated, may use different reaction sequences and different compartments → prevents futile cycling.","Nitrogen needed for amino acids and nucleic acids; energy conversion always loses some free energy as heat (entropy increases)."],"pages":[3,4,5,6,7]},{"heading":"Enzyme kinetics and regulation","points":["Michaelis–Menten: rate rises with [S] and plateaus at Vmax as enzyme saturates (Vmax is for a given enzyme concentration).","Km = substrate concentration at which rate = Vmax/2.","Three regulation modes: substrate availability ([S] low relative to Km limits rate), allosteric regulation (binding away from active site), hormonal regulation (changes enzyme synthesis/degradation)."],"pages":[8,9]},{"heading":"Thermodynamics: ΔG, ΔH, ΔS","points":["ΔG = ΔH − TΔS; −ΔH (heat release) and +ΔS (more disorder) both push ΔG negative.","ΔG < 0: exergonic, spontaneous, can do work (many catabolic reactions); ΔG > 0: endergonic, needs input; reverse of endergonic is exergonic.","ΔG < 0 favors forward, > 0 favors reverse, = 0 at equilibrium; spontaneous ≠ fast.","ΔG is a state function: path-independent and additive across sequential reactions."],"pages":[10,11,13,14,23]},{"heading":"Standard state, K′eq and actual ΔG","points":["Keq = [C]^c[D]^d/[A]^a[B]^b; biochemical standard state: pH 7 ([H⁺] = 10⁻⁷ M), water = 55.5 M, solutes 1 M.","ΔG°′ = −RT ln K′eq: K′eq > 1 → ΔG°′ < 0; K′eq = 1 → 0; K′eq < 1 → ΔG°′ > 0.","Worked example: A ⇌ B, K′eq = 12 → ΔG°′ ≈ −6.15 kJ/mol (favors B).","Actual ΔG = ΔG°′ + RT ln([products]/[reactants]); concentrations can reverse the favored direction in the cell.","1 kcal = 4.184 kJ."],"pages":[12,15,16,17,18,22]},{"heading":"Reaction coupling","points":["Sequential reactions A→B, B→C: shared intermediate cancels; ΔG°′(A→C) = ΔG°′1 + ΔG°′2.","Glucose + Pi → glucose 6-phosphate (+13.8 kJ/mol) coupled with ATP hydrolysis (−30.5) gives net −16.7 kJ/mol.","Glycolysis: glucose → pyruvate; ATP invested in early phosphorylation steps, ATP (substrate-level phosphorylation) and NADH produced later."],"pages":[19,20,21,33]},{"heading":"ATP as energy currency","points":["ATP = adenine + ribose + 3 phosphates; ATP → ADP + Pi or ATP → AMP + PPi, both release energy.","ΔG°′ of ATP hydrolysis = −30.5 kJ/mol; cellular ΔG differs since [ATP], [ADP], [Pi] are unequal and ≪ 1 M (erythrocyte ≈ −51.82 kJ/mol).","Mg²⁺ binds ATP/ADP in cytosol; MgATP²⁻ is the true substrate for most phosphoryl transfers.","ATP/ADP ratio = energy charge signal; low ATP/ADP promotes ATP synthesis by oxidative phosphorylation.","Cells are isothermal: photosynthetic cells capture sunlight, heterotrophs oxidize nutrients; both store energy as ATP.","Redox potential = tendency to donate/accept electrons; depends on reduced:oxidized ratio; NAD⁺/NADH key pair."],"pages":[24,25,26,29,30,31,32]},{"heading":"High-energy compounds and phosphoryl-transfer potential","points":["High-energy compound: releases > 7.0 kcal/mol on hydrolysis (slide's cutoff); many but not all are phosphates.","Classes: acyl phosphates (ATP, PPi, 1,3-BPG), enol phosphates (PEP), thiol esters (acetyl-CoA), guanidino phosphates (phosphocreatine).","Ranking by −ΔG°′ of hydrolysis: PEP > 1,3-BPG > phosphocreatine > ATP > glucose 6-phosphate, glycerol phosphate; ATP is intermediate.","Compounds above ATP can phosphorylate ADP; ATP phosphorylates those below it.","1,3-BPG + ADP → ATP + 3-phosphoglycerate (substrate-level phosphorylation).","PEP's high potential: hydrolysis gives enol pyruvate, which tautomerizes to stable keto pyruvate (product stabilization)."],"pages":[27,28,34,35,37]},{"heading":"How ATP does work: group transfer and firefly light","points":["ATP usually acts by group transfer, not isolated hydrolysis: phosphoryl transfer → ADP left; pyrophosphoryl → AMP left; adenylyl (AMP) transfer → PPi left.","Hydrolysis-driven conformational cycles power muscle motion and proteins moving along DNA/mRNA (helicases, RecA, topoisomerases, replication ATPases).","Firefly: luciferase uses ATP to activate luciferin → luciferyl adenylate (adenylyl transfer).","With O₂ + luciferase, oxidative decarboxylation → oxyluciferin + light; luciferase structure sets light colour; luciferin regenerated."],"pages":[36,38,39,40]}],"mustRemember":["ΔG = ΔH − TΔS","ΔG°′ = −RT ln K′eq","ΔG = ΔG°′ + RT ln([products]/[reactants])","Biochemical standard state: pH 7, [H₂O] = 55.5 M, 1 M solutes","ATP hydrolysis ΔG°′ = −30.5 kJ/mol; erythrocyte actual ΔG ≈ −51.82 kJ/mol","Glucose → G6P +13.8 kJ/mol; coupled with ATP → −16.7 kJ/mol","K′eq = 12 → ΔG°′ ≈ −6.15 kJ/mol","1 kcal = 4.184 kJ","Km = [S] at Vmax/2","High-energy compound cutoff: > 7.0 kcal/mol hydrolysis","PEP (enol phosphate), 1,3-BPG (acyl phosphate), phosphocreatine (guanidino phosphate), acetyl-CoA (thiol ester)","MgATP²⁻ is the true enzyme substrate","Firefly: luciferin + ATP → luciferyl adenylate → (O₂) oxyluciferin + light"],"distinguish":[{"pair":"Catabolism vs anabolism","difference":"Catabolism: breakdown, energy-releasing, convergent; anabolism: biosynthesis, energy-requiring, divergent."},{"pair":"Exergonic vs endergonic","difference":"Exergonic ΔG < 0, releases energy, spontaneous; endergonic ΔG > 0, needs energy input."},{"pair":"ΔG°′ vs ΔG","difference":"ΔG°′ is a fixed constant at standard conditions (from K′eq); ΔG is actual, includes current concentration ratio."},{"pair":"Km vs Vmax","difference":"Vmax is maximal rate at saturation; Km is the [S] giving half Vmax."},{"pair":"Phosphoryl vs pyrophosphoryl vs adenylyl transfer","difference":"Leaves ADP, AMP and PPi respectively."},{"pair":"ATP → ADP + Pi vs ATP → AMP + PPi","difference":"Terminal phosphate removal vs pyrophosphate cleavage; both exergonic."},{"pair":"Substrate-level vs oxidative phosphorylation","difference":"Substrate-level: direct phosphate transfer from an intermediate (1,3-BPG, PEP) to ADP; oxidative: ATP synthesis activated when energy is low."}],"traps":["ΔG°′ is not actual ΔG; only actual ΔG includes concentrations.","Negative ΔG predicts direction, not speed; enzymes change rate, never ΔG.","Km is a substrate concentration, not a rate.","ATP usually works by group transfer (as MgATP²⁻), not by releasing heat from isolated hydrolysis.","ATP is intermediate, not highest, in phosphoryl-transfer potential (PEP, 1,3-BPG, phosphocreatine are higher).","Not all high-energy compounds are phosphates (e.g. acetyl-CoA thioester)."]},{"topic":"Gene Expression and Regulation","oneLiner":"Genetic information flows DNA → RNA → protein via replication, transcription and translation; prokaryotes regulate mainly at transcription initiation, exemplified by the inducible lac operon (repressor + CAP/cAMP) and the repressible trp operon.","sections":[{"heading":"Genes and the central dogma","points":["Gene = segment of DNA carrying inherited information; contributes to traits and inherited disease.","Central dogma: DNA → RNA → protein (residue-by-residue information flow).","Replication: DNA → DNA; transcription: DNA → RNA; translation: mRNA → protein.","Genes may be constitutive (always on) or inducible (switched on by a signal)."],"pages":[42,43,44]},{"heading":"DNA replication","points":["Occurs in S phase; semiconservative — each daughter duplex has one parental + one new strand.","Helicase opens DNA at the Y-shaped replication fork.","Leading strand made continuously toward fork movement; lagging strand discontinuously as Okazaki fragments.","RNA primers provide starting points for DNA synthesis."],"pages":[45,46]},{"heading":"Transcription and RNA processing","points":["RNA polymerase stages: initiation (binds promoter, opens transcription bubble) → promoter escape → elongation → termination.","Location: prokaryotic cytoplasm; eukaryotic nucleus.","Template = antisense/noncoding strand; mRNA is complementary to it.","Coding/sense strand = same sequence as mRNA, with T instead of U.","Eukaryotic pre-mRNA has exons (coding) + introns (noncoding); splicing removes introns and joins exons → mature mRNA."],"pages":[48,49,50]},{"heading":"Translation and protein maturation","points":["Occurs on ribosomes in cytoplasm; mRNA = message, tRNA = carries amino acids, ribosome = joins them.","mRNA read 5′ → 3′; protein grows N-terminus → C-terminus.","Protein then folds (chaperones help) and may be transported via ER and Golgi."],"pages":[52,53,54]},{"heading":"Principles of gene regulation","points":["Regulation matches gene activity to metabolism, growth, development and differentiation.","Prokaryotes: mainly transcription initiation; no nucleus → transcription and translation simultaneous.","Eukaryotes: regulate transcription, RNA processing, RNA export to cytosol and translation.","Positive regulation ↑ expression (activator/inducer); negative ↓ expression (repressor/inhibitor).","Operon = prokaryotic cluster of related genes under one promoter, transcribed as one mRNA (lac, ara, gal for sugars); not in eukaryotes."],"pages":[55,56,57,58]},{"heading":"Lac operon: components","points":["Lets E. coli use lactose when preferred sugar glucose is unavailable.","lacZ → β-galactosidase (lactose → glucose + galactose; also forms allolactose); lacY → permease (imports lactose); lacA → transacetylase.","Promoter binds RNA polymerase; operator (overlaps promoter) binds lac repressor; CAP site upstream binds CAP.","CAP encoded by a separate gene, made constitutively, but active only when bound to cAMP."],"pages":[59,60,62,63,66]},{"heading":"Lac operon: two controls","points":["Negative control (lactose arm): no lactose → repressor binds operator, blocks RNA pol; lactose → allolactose binds repressor, releases it.","Inducible operon: default off; allolactose = inducer.","Positive control (glucose arm): low glucose → high cAMP ('hunger signal') → cAMP–CAP binds DNA → helps RNA pol bind → high transcription.","Glucose+/lactose−: none; glucose+/lactose+: low (leaky); glucose−/lactose−: none; glucose−/lactose+: strong."],"pages":[61,64,65,67,68,69,70,71]},{"heading":"Trp operon: repressible control","points":["Structural genes trpE, trpD, trpC, trpB, trpA on one transcript encode tryptophan-biosynthesis enzymes.","Tryptophan absent: repressor inactive → operon on (default).","Tryptophan present: binds repressor as co-repressor → active complex binds operator → off.","Lac (inducible) and trp (repressible) are both negatively regulated by repressors."],"pages":[72,73,74]}],"mustRemember":["Central dogma: DNA → RNA → protein","Replication: S phase, semiconservative; leading continuous, lagging = Okazaki fragments; RNA primers","Template = antisense; coding strand = mRNA with T for U","Translation: mRNA 5′→3′, protein N→C","lacZ = β-galactosidase, lacY = permease, lacA = transacetylase","Allolactose = lac inducer; tryptophan = trp co-repressor","Low glucose → high cAMP → active CAP → strong transcription","Strong lac transcription only with lactose present AND glucose absent","Glucose + lactose present → low/leaky transcription","Repressor binds operator; RNA pol binds promoter; CAP binds CAP site","Trp genes: trpE, D, C, B, A"],"distinguish":[{"pair":"Template vs coding strand","difference":"Template (antisense) is read and is complementary to mRNA; coding (sense) matches mRNA except T vs U."},{"pair":"Leading vs lagging strand","difference":"Leading synthesized continuously toward fork; lagging discontinuously as Okazaki fragments."},{"pair":"Exon vs intron","difference":"Exons coding, retained in mature mRNA; introns noncoding, spliced out."},{"pair":"Lac repressor vs CAP","difference":"Repressor: negative control at operator, responds to lactose; CAP: positive control at CAP site, responds to glucose via cAMP."},{"pair":"Inducible (lac) vs repressible (trp)","difference":"Lac default off, inducer inactivates repressor; trp default on, co-repressor activates repressor."},{"pair":"Inducer vs co-repressor","difference":"Inducer (allolactose) removes repressor from DNA; co-repressor (Trp) enables repressor to bind DNA."},{"pair":"Prokaryotic vs eukaryotic regulation","difference":"Prokaryotes mainly at transcription initiation with coupled translation; eukaryotes at transcription, processing, export, translation."}],"traps":["Replication/transcription/translation swaps in options: copy DNA / make RNA / make protein.","Template strand = antisense; coding strand resembles mRNA (T vs U).","Lactose alone only removes repression; strong expression also needs low glucose (cAMP–CAP).","CAP is positive, repressor negative — they bind different sites (CAP site vs operator).","Low glucose cannot overcome a bound repressor (glucose−/lactose− = no transcription).","Trp operon is also negatively regulated — 'repressible' does not mean positive control."]},{"topic":"Genetic Engineering Applications 1","oneLiner":"Genetic engineering isolates a gene, cuts and ligates it into a vector, transfers it into a host and selects/screens clones; core tools are restriction enzymes, DNA ligase, PCR, gel electrophoresis, Sanger sequencing and CRISPR-Cas9.","sections":[{"heading":"Definitions and milestones","points":["Genetic engineering = deliberate isolation, modification and transfer of DNA; underlies recombinant DNA technology.","Recombinant DNA = sequences from different sources joined; vector carries it into a host cell.","Clone = genetically identical population from one progenitor cell; transformation = introducing foreign DNA into a host.","Milestones: 1973 first GM bacteria; 1974 GM mice; 1982 commercial insulin-producing bacteria; 1994 GM food sold; 2003 GM pets (GloFish)."],"pages":[76,77,79,81]},{"heading":"Cloning workflow","points":["Isolate/PCR-amplify gene → cut insert + vector with compatible restriction enzymes → ligate with DNA ligase → transform host → select & screen → express.","Selection finds cells carrying vector (selectable marker); screening verifies correct recombinant insert.","Construct elements: promoter + terminator (transcription), selectable marker, origin of replication."],"pages":[76,80,81]},{"heading":"Restriction enzymes","points":["Restriction endonucleases: bacterial defense enzymes cutting DNA at specific 4–8 bp recognition sites, often palindromic.","Same enzyme on vector and insert → compatible ends.","Sticky (cohesive) ends have single-stranded overhangs that base-pair; blunt ends have none.","Enzyme choice depends on location of recognition sites and needed compatibility."],"pages":[82,83]},{"heading":"DNA ligase","points":["Seals sugar-phosphate backbone: phosphodiester bond between 3′-OH and 5′-phosphate (seals nicks).","T4 DNA ligase is ATP-dependent: forms ligase–AMP (releasing PPi) → AMP transferred to DNA 5′-phosphate → 3′-OH attacks → bond formed.","Sticky ends ligate more efficiently than blunt (overhang pairing aligns ends, raising effective concentration)."],"pages":[84,85,86]},{"heading":"PCR","points":["In vitro selective amplification of a DNA region in a thermal cycler; primers define target boundaries.","Components: template DNA, primers, dNTPs, (heat-stable) DNA polymerase, buffer.","Cycle order: denaturation (strand separation by heat) → annealing (primers bind) → extension (polymerase synthesis).","Ideal copies ≈ 2ⁿ after n cycles.","Uses: cloning, pathogen detection, mutation/SNP analysis, sequencing template prep."],"pages":[87,88,89]},{"heading":"Gel electrophoresis and Sanger sequencing","points":["DNA's negative phosphate backbone → migrates to positive anode.","Agarose acts as molecular sieve: separation by size; smaller fragments move faster/farther (distance inversely related to size).","Sanger: normal dNTPs + small amount of ddNTPs; ddNTP lacks 3′-OH → chain termination.","Fragments of varying length, each ending at a specific base, reveal sequence."],"pages":[90,91]},{"heading":"CRISPR-Cas9","points":["Adapted from bacterial antiviral defense; guide RNA gives specificity, Cas9 = nuclease.","gRNA pairs with ~20-nt target adjacent to a PAM; Cas9 makes a double-strand break.","NHEJ: error-prone → indels → gene knockout.","HDR: uses donor DNA template → precise insertion/correction."],"pages":[92,93]},{"heading":"Vectors","points":["Vector = DNA vehicle carrying foreign DNA into host for replication, sometimes expression.","Needs ori (replication), selectable marker, insertion site (MCS = multiple restriction sites), ability to enter host.","Choice depends on insert size and purpose; expression needs added promoter/expression elements."],"pages":[94]}],"mustRemember":["PCR copies ≈ 2ⁿ after n cycles","PCR order: denaturation → annealing → extension","Ligase: 3′-OH + 5′-phosphate → phosphodiester bond; T4 ligase uses ATP (ligase–AMP intermediate)","Restriction sites 4–8 bp, often palindromic","DNA migrates to + anode; smaller = farther","ddNTP lacks 3′-OH → chain termination","CRISPR: ~20-nt guide + PAM; Cas9 double-strand break; NHEJ → knockout, HDR → precise edit","Vector essentials: ori, selectable marker, MCS","1973 GM bacteria, 1974 GM mice, 1982 insulin bacteria, 1994 GM food, 2003 GloFish"],"distinguish":[{"pair":"Restriction enzyme vs DNA ligase","difference":"Restriction enzyme cuts at specific sites; ligase joins fragments by phosphodiester bonds."},{"pair":"Sticky vs blunt ends","difference":"Sticky have complementary overhangs (more efficient ligation); blunt have none."},{"pair":"Selection vs screening","difference":"Selection retains cells carrying vector (marker); screening identifies clones with desired insert."},{"pair":"dNTP vs ddNTP","difference":"dNTP has 3′-OH and extends chain; ddNTP lacks 3′-OH and terminates."},{"pair":"NHEJ vs HDR","difference":"NHEJ error-prone, indels, knockout; HDR template-guided, precise insertion/correction."},{"pair":"PCR vs Sanger vs CRISPR","difference":"PCR amplifies DNA; Sanger reads sequence; CRISPR edits a targeted site."}],"traps":["Restriction enzymes cut, ligase joins — roles often swapped.","Selection ≠ screening.","DNA moves toward the positive electrode; smaller fragments migrate farther (not larger).","Cas9 needs both guide match and an adjacent PAM to cut.","Ligase links 3′-OH to 5′-phosphate (not 5′-OH to 3′-phosphate)."]},{"topic":"Genetic Engineering Applications 2","oneLiner":"Moving from DNA insert to product: choose cloning vs expression vector, marker/reporter, host and cDNA insert, then run the ordered pipeline (isolate → insert → transform → select → screen → confirm → express → purify) and apply it in medicine, agriculture, industry and environment.","sections":[{"heading":"Cloning vectors and plasmids","points":["Cloning vector mainly carries/replicates DNA, not necessarily expresses it.","Good plasmid: small, easy to introduce, often high-copy; has ori (sets copy number), selectable marker, MCS.","pBR322: early plasmid with ampicillin- and tetracycline-resistance markers.","pUC: high-copy series used for cloning and blue-white screening."],"pages":[95]},{"heading":"Expression vectors","points":["Contain promoter, translation-initiation signal (RBS) and terminator to make RNA/protein.","pET system: vector in E. coli, IPTG induces T7 promoter → transcription → translation.","IPTG = chemical inducer of lac-controlled expression systems.","A cloning vector is not automatically an expression vector."],"pages":[96]},{"heading":"Selectable markers vs reporters","points":["Selectable marker: survival under selective condition (AmpR → grows on ampicillin; KanR).","Reporter: visible/measurable signal — GFP (fluorescence), lacZ (blue-white screening), luciferase (light)."],"pages":[97]},{"heading":"Host systems","points":["E. coli: fast, cheap, high yield, but lacks eukaryotic post-translational modifications (e.g. glycosylation).","Yeast (S. cerevisiae): some PTMs.","Plant cells: scalable but slower.","Mammalian (CHO) cells: most appropriate complex PTMs/quality for therapeutic proteins; slower, costlier."],"pages":[98]},{"heading":"Recombinant DNA pipeline","points":["Isolate gene → insert into vector → transform host → select → screen → confirm → express (induce) → purify.","Transformation: DNA into competent cells; selection: keeps marker-carrying cells; screening: likely recombinants.","Confirmation tests insert directly: colony PCR, restriction digestion or sequencing.","Expression induced only after a correct clone is confirmed."],"pages":[99]},{"heading":"Gene isolation: genomic DNA vs cDNA","points":["Genomic DNA contains introns + regulatory regions.","cDNA made from mature mRNA by reverse transcription → no introns.","Use cDNA to express human/eukaryotic genes in E. coli — bacteria cannot splice introns.","PCR (gene-specific primers) amplifies gene; product purified to remove primers, free nucleotides, enzymes before cloning."],"pages":[100,101]},{"heading":"Protein production and purification","points":["Induce expression → harvest cells → lyse → bind His-tagged protein to Ni-NTA.","Wash with low imidazole; elute with high imidazole.","Check purity/result by SDS-PAGE."],"pages":[]},{"heading":"Applications","points":["Four buckets: medicine, agriculture, industry, environment.","Recombinant insulin: expressed and purified from recombinant host.","Hepatitis B vaccine: recombinant HBsAg made in yeast.","Bt crops: express bacterial Cry toxin → insect resistance.","Golden Rice: β-carotene (provitamin A) in endosperm.","Gene therapy: add, replace, silence or edit genetic material."],"pages":[]}],"mustRemember":["8-step pipeline: isolate, insert, transform, select, screen, confirm, express, purify","Vector checklist: ori, selectable marker, MCS (+ promoter, RBS, terminator for expression)","pBR322 = AmpR + TetR; pUC = high-copy, blue-white screening","pET: IPTG induces T7 promoter in E. coli","Markers: AmpR, KanR; reporters: GFP, lacZ, luciferase","cDNA (no introns) for eukaryotic gene expression in bacteria","His-tag → Ni-NTA; low imidazole wash, high imidazole elute; SDS-PAGE check","E. coli lacks PTMs; CHO cells for complex therapeutics","HBV vaccine = HBsAg in yeast; Bt = Cry toxin; Golden Rice = β-carotene in endosperm"],"distinguish":[{"pair":"Cloning vs expression vector","difference":"Cloning vector replicates DNA; expression vector adds promoter, RBS, terminator to produce protein."},{"pair":"Selectable marker vs reporter gene","difference":"Marker confers survival (AmpR); reporter gives detectable signal (GFP, lacZ, luciferase)."},{"pair":"Genomic DNA vs cDNA","difference":"Genomic has introns + regulatory DNA; cDNA is reverse-transcribed from mRNA, intron-free."},{"pair":"Selection vs screening vs confirmation","difference":"Selection = carries marker; screening = likely recombinant; confirmation = insert verified by colony PCR/digest/sequencing."},{"pair":"E. coli vs mammalian host","difference":"E. coli fast, cheap, no eukaryotic PTMs; mammalian slow, costly, proper complex PTMs."},{"pair":"Bt crops vs Golden Rice","difference":"Bt: insect resistance via Cry toxin; Golden Rice: provitamin A via β-carotene."},{"pair":"Low vs high imidazole","difference":"Low imidazole washes away contaminants; high imidazole elutes His-tagged protein."}],"traps":["Survival on antibiotic proves marker presence, not the desired insert.","A cloning vector is not automatically an expression vector.","Low imidazole washes, high imidazole elutes — not the reverse.","Don't use genomic DNA to express human genes in E. coli — introns can't be removed.","Bt and Golden Rice solve different problems (insects vs vitamin A deficiency)."]},{"topic":"Genetic Engineering Applications 3","oneLiner":"Completes the cloning pipeline (transform → select → screen → confirm → express → purify) and surveys applications of genetic engineering in medicine, agriculture, industry and environment, plus biosafety and ethics.","sections":[{"heading":"Transformation, selection, screening, confirmation","points":["Pipeline: isolate gene → insert into vector → transform host → select → screen → confirm → express → purify.","Transformation: recombinant plasmid into competent cells by heat shock (~42°C) or electroporation (high-voltage pulse); both open temporary membrane pores.","Cells recover before plating on selective (antibiotic) medium; plasmid needs origin of replication + selectable marker (e.g., AmpR).","Selection = survival on antibiotic → cell has plasmid; does NOT prove insert present.","Screening identifies likely recombinants (white colonies in the shown scheme); still needs confirmation.","Confirmation: colony PCR (insert from colony), restriction digestion (fragment pattern), DNA sequencing (exact sequence + insert orientation)."],"pages":[102,103,104]},{"heading":"Expression of recombinant protein","points":["Inserted gene transcribed to mRNA, translated to protein inside host.","Promoter controls when, where and how strongly a gene is transcribed; expression vector needs promoter + translation-control elements.","Inducible systems: lac, T7, ara; IPTG induces lac-based expression; T7 = high-expression E. coli system.","Induction separates cell growth from strong protein production.","Workflow order: transform → grow culture → induce → harvest → lyse → purify."],"pages":[105,106,107]},{"heading":"Purification and analysis (Ni-NTA, SDS-PAGE)","points":["His-tag (short histidine stretch) binds Ni²⁺ on Ni-NTA affinity resin.","Wash with LOW imidazole removes weak/nonspecific binders; HIGH imidazole competes with His-tag → elutes target.","SDS denatures proteins and gives similar charge-to-mass ratio → separation mainly by molecular weight (kDa).","Smaller proteins migrate farther (lower on gel); strong band at expected size supports expression and purity."],"pages":[108,109]},{"heading":"Medical applications","points":["Recombinant human insulin: human gene cloned, expressed in E. coli, purified and processed — classic recombinant protein.","hGH → growth hormone deficiency; EPO → RBC production in anemia; interferons → antiviral, some cancers; Factor VIII → hemophilia A, Factor IX → hemophilia B.","Recombinant vaccines (subunit, VLP, recombinant vector) avoid whole infectious pathogen; hepatitis B vaccine = HBsAg made in yeast, non-infectious, approved 1986.","Monoclonal antibodies bind one specific target (e.g., HER2, RSV); made in mammalian cells for proper folding/processing.","Gene therapy strategies: replacement, addition, silencing (siRNA), editing (CRISPR).","Examples: SMA = in vivo gene addition; sickle cell = ex vivo editing of BCL11A enhancer → fetal hemoglobin restored; CAR-T = engineered T cells."],"pages":[111,112,113,114,115,116]},{"heading":"Agricultural applications","points":["Targets: biotic stress (pests, pathogens), abiotic stress (drought, salinity, heat, cold), nutrition, yield, shelf life.","Bt crops express Cry insecticidal proteins from Bacillus thuringiensis against specific pests; reduce insecticide use.","Bt concerns: insect resistance (needs resistance management), non-target effects, gene flow, biosafety.","Golden Rice: genes activate carotenoid pathway → β-carotene (provitamin A) in endosperm; biofortification vs vitamin A deficiency.","Other traits: herbicide tolerance, disease resistance, delayed ripening (shelf life); edible vaccine banana (viral proteins), scorpion-gene cabbage (deters insects).","High US adoption (2010) of GM soybean, cotton, corn, sugar beet; Bt corn protein toxic to certain insects, stated not poisonous to humans."],"pages":[117,118,119,120,123,127,128,129]},{"heading":"Industrial, environmental and animal applications","points":["Industry: chymosin (cheese), lactase (lactose breakdown), amylase, protease, lipase, amino acids, vitamins, ethanol, bioplastics; advantages: yield, consistency, scalability, lower cost.","Environment: bioremediation, wastewater treatment, biosensors, sustainable bioprocesses.","Bacteria are common GMOs (easy to manipulate): cyanobacteria → polyethylene/butanol; E. coli → diesel.","Knockout mouse (hair-growth gene → hairless) removes function; GFP mice/GloFish add expression; fluorescence/BLI for protein tracking and disease detection.","Fast-growing salmon: genes from two other fish → continual growth hormone; modified methane-producing gut bacteria → ~25% less cattle methane.","Transgenic goats with spider genes produce spider-silk protein in milk (animal as production host)."],"pages":[121,122,124,125,131,132,133]},{"heading":"Concerns, biosafety, ethics and future","points":["GMO concerns: food safety, environmental/wildlife harm, pesticide/herbicide use, farmer health, seed/pollen drift, herbicide-resistant weeds (superweeds); varied labeling/bans.","Biosafety: unintended/off-target changes, lab and release risks, gene flow, ecosystem and non-target effects.","Ethics: germline editing (heritable), consent, fairness, misuse; regulation = safety testing, approval, post-release monitoring.","Challenges: delivery, cost, regulation, uncertain long-term effects.","Future: base editing (no standard double-strand break), prime editing, improved CRISPR, personalized medicine, synthetic biology, therapeutic cells, greener fuels/materials."],"pages":[134,135,136,137]}],"mustRemember":["Vector essentials: ori + selectable marker + MCS; expression vector adds promoter + translation controls","Use cDNA (no introns) to express human gene in E. coli","Heat shock ≈ 42°C; electroporation = high-voltage pulse","IPTG induces lac system; lac, T7, ara = inducible systems","His-tag binds Ni²⁺ (Ni-NTA); low imidazole wash, high imidazole elute","SDS-PAGE separates by size; small proteins run lower","Sequencing confirms identity AND orientation of insert","Factor VIII → hemophilia A; Factor IX → hemophilia B; EPO → anemia","Hep B vaccine = recombinant HBsAg in yeast, approved 1986","Sickle cell: ex vivo edit of BCL11A enhancer → fetal Hb ↑; SMA: in vivo gene addition","Bt = Bacillus thuringiensis Cry toxin; Golden Rice = β-carotene in endosperm","Cattle methane ↓ ~25%; salmon genes from two other fish; goat milk spider silk","Chymosin → cheese; lactase → lactose breakdown"],"distinguish":[{"pair":"Selection vs Screening","difference":"Selection keeps cells carrying the marker plasmid; screening identifies colonies likely carrying the insert."},{"pair":"Screening vs Confirmation","difference":"Screening flags likely recombinants; confirmation (colony PCR, digest, sequencing) tests the insert directly."},{"pair":"Cloning vector vs Expression vector","difference":"Cloning vector only propagates DNA; expression vector also has promoter/translation elements for protein production."},{"pair":"Genomic DNA vs cDNA","difference":"Genomic DNA has introns bacteria cannot splice; cDNA from processed mRNA lacks introns."},{"pair":"Low vs High imidazole","difference":"Low imidazole washes off contaminants; high imidazole competes off and elutes the His-tagged protein."},{"pair":"Bt crops vs Golden Rice","difference":"Bt = insect resistance via Cry toxin; Golden Rice = provitamin A (β-carotene) biofortification."},{"pair":"In vivo vs Ex vivo gene therapy","difference":"In vivo modifies cells inside the body (SMA); ex vivo modifies cells outside then returns them (sickle cell)."},{"pair":"Biotic vs Abiotic stress","difference":"Biotic = living agents (pests, pathogens); abiotic = drought, salinity, heat, cold."}],"traps":["Antibiotic survival proves the marker plasmid is present, not the desired insert.","A cloning vector is not automatically an expression vector.","Low imidazole washes; high imidazole elutes — don't swap them.","Bt and Golden Rice solve different problems (insects vs vitamin A).","Monoclonal antibodies need mammalian cells, not E. coli, for proper folding/processing.","Germline editing is heritable; somatic gene therapy is not passed on."]},{"topic":"Biological Motors","oneLiner":"Molecular motors convert chemical energy (ATP/GTP hydrolysis) into directed motion via nucleotide-driven conformational cycles; actin–myosin is the key example, and optical tweezers measure single-myosin steps (~11 nm) and forces (~3 pN).","sections":[{"heading":"Energy and nonequilibrium basis","points":["Conventional motor: electrical → mechanical energy; biological motor: chemical → mechanical energy (or other directed work).","Many required cellular reactions are unfavorable; cells need continuous energy input.","Life is nonequilibrium: ordered structures, concentration and charge gradients (e.g., proton pumps keep lysosomes acidic).","Molecular machines transduce one store of free energy into another."],"pages":[139,140,141]},{"heading":"Why molecular motors are different","points":["Nanometer scale, in water, low Reynolds number (viscous forces dominate inertia).","Brownian motion makes environment stochastic.","Rely on noncovalent interactions and internal protein dynamics, not rigid parts; sensitive to temperature and pH."],"pages":[142]},{"heading":"Fundamental principles: ATP/GTP and conformational change","points":["Molecular motor = macromolecular complex converting energy into directed motion/function.","Principle 1: energy from ATP or GTP; ATP → ADP + Pi, standard ΔG ≈ −7.3 kcal/mol; ATPases hydrolyze, ATP synthase makes ATP.","Principle 2: ATP binding, hydrolysis, Pi release and ADP→ATP exchange switch protein between conformations (State A/B).","ATP/GTP-bound = active; ADP/GDP-bound = inactive; only selected regions change shape.","Repeated mechanochemical cycle converts chemical events into movement."],"pages":[143,144,145,146]},{"heading":"Motor categories and cytoskeleton","points":["Four categories: polymerization, cytoskeletal (actin–myosin), rotary (bacterial flagella), nucleic-acid motors.","Cytoskeleton: dynamic 3D network for shape, motility, cytokinesis, transport, division, organelle organization.","Three filament systems: actin microfilaments, intermediate filaments, tubulin microtubules.","Myosin moves on actin tracks (fluorescence: myosin-II green, actin blue)."],"pages":[147,148,151,161]},{"heading":"Actin structure and polymerization","points":["G-actin = globular soluble monomer; F-actin = filamentous polymer (right-handed, two-stranded helix, polar).","Assembly: slow nucleation (unstable seed) → elongation at both ends, faster at plus (barbed) than minus (pointed) end.","Actin binds ATP and is an ATPase; polymerization promotes hydrolysis; ATP-actin adds more readily, ADP-actin dissociates more readily.","Steady state: constant F-actin mass; treadmilling = plus-end addition + minus-end loss.","Critical concentration separates net polymerization from net depolymerization; actin-binding proteins and Ca²⁺ regulate assembly."],"pages":[152,153,154,155,156,157]},{"heading":"Muscle: sarcomere and myosin","points":["Striations reflect ordered repeating organization of muscle fibers.","Sarcomere = Z line to Z line; thin actin filaments anchored at Z lines; thick myosin filaments centered at M line; overlap gives banding.","Myosin: two heavy chains + essential and regulatory light chains.","Head (motor domain) binds actin and ATP; neck carries light chains; tail = dimeric coiled-coil (dimerization, cargo/filament).","Cross-bridge cycle: attach → force generation → detach → reset, controlled by ATP."],"pages":[149,158,159,160]},{"heading":"Optical tweezers physics","points":["Arthur Ashkin: tightly focused laser traps a dielectric particle in 3D.","Light carries momentum; bead refracts/reflects light → equal and opposite momentum change = force.","Gaussian beam brightest at center; scattering force ∝ intensity, along beam propagation.","Gradient force pulls bead toward high-intensity center = restoring force.","Near center trap acts as spring: F = −kx (k = trap stiffness); displacement → force."],"pages":[162,163,164,165,166]},{"heading":"Single-myosin measurements and applications","points":["Dual-beam trap: actin held taut (~2 pN) between two trapped beads, lowered onto pedestal bead sparsely coated with myosin (isolates single motors).","Quadrant photodiode tracks bead position; bead displacement reports stroke size, attachment lifetime, force.","Working stroke ≈ 11 nm (cluster ~10–13 nm), similar at low and high ATP; measured along actin.","Single myosin force ~2–5 pN, peak near 3 pN.","Biohybrids: bacteria-powered, light-controlled 3D micromotors; bacterial flagellar motor = rotary motor turning helical flagellum."],"pages":[167,168,169,170,171,172,173,174,175]}],"mustRemember":["ATP → ADP + Pi, ΔG°′ ≈ −7.3 kcal/mol","Cycle: bind → hydrolyze → release → exchange","Four motor classes: polymerization, cytoskeletal, rotary, nucleic-acid","Microfilament = actin; microtubule = tubulin; + intermediate filaments","Plus (barbed) end grows faster than minus (pointed) end","Treadmilling: add at plus, lose at minus, constant mass","Sarcomere: Z line to Z line; M line at centre; actin thin, myosin thick","Myosin: head (actin + ATP), neck (light chains), tail (coiled-coil dimer)","Hooke's law F = −kx for optical trap","pN = 10⁻¹² N; nm = 10⁻⁹ m","Myosin step ≈ 11 nm; force peak ≈ 3 pN (2–5 pN); actin tension ≈ 2 pN","Arthur Ashkin = optical tweezers; quadrant photodiode detects bead position"],"distinguish":[{"pair":"G-actin vs F-actin","difference":"G-actin is the globular monomer; F-actin is the polar helical filament polymer of the same protein."},{"pair":"Plus (barbed) vs Minus (pointed) end","difference":"Plus end adds subunits faster; minus end grows slower and loses subunits in treadmilling."},{"pair":"ATP-actin vs ADP-actin","difference":"ATP-actin preferentially adds to filaments; ADP-actin dissociates more readily."},{"pair":"Scattering force vs Gradient force","difference":"Scattering pushes along beam direction; gradient pulls toward bright beam center (restoring)."},{"pair":"Macroscopic vs Molecular motors","difference":"Macroscopic use rigid parts and inertia; molecular work at low Reynolds number, Brownian, noncovalent, protein dynamics."},{"pair":"Z line vs M line","difference":"Z line bounds the sarcomere and anchors thin actin; M line is the center with thick myosin."},{"pair":"Active vs Inactive conformation","difference":"ATP/GTP-bound = active; ADP/GDP-bound = inactive."}],"traps":["ATP is not just stored fuel: binding, hydrolysis, release and exchange each change motor conformation.","G-actin and F-actin are two assembly states of one protein, not different proteins.","Scattering force follows the beam; gradient force is the centering/restoring force.","Optical tweezers read bead displacement; force is inferred via F = −kx.","Steady state ≠ inactive: subunits still flux through via treadmilling.","Myosin step size (~11 nm) does not change with ATP concentration in the shown traces."]},{"topic":"Cellular Signaling","oneLiner":"Cells sense signals via receptors, process them through cascades with amplification and integration, and respond; the GPCR–G protein–cAMP–PKA pathway is the core example, with GTP hydrolysis, GRK and arrestin providing shutoff.","sections":[{"heading":"Signaling as a control system","points":["Sensor → information processing → response.","Properties: specificity, cascade, amplification, feedback, integration.","Cells receive multiple signals simultaneously and integrate them into one response.","Pathways form networks: convergence (different receptors → shared component) and divergence (one signal → multiple outputs).","Only target cells with suitable receptor and state respond; responses rapid or slow."],"pages":[178,179,180,186,187]},{"heading":"Signal chemistry and modes of signaling","points":["Chemical types: amino-acid derivatives, gases (NO, CO), steroids (from cholesterol), peptides/proteins, surface-bound molecules.","Autocrine: cell responds to its own signal.","Paracrine: short-range to nearby cells (PDGF in wound repair).","Juxtacrine: direct contact between surface molecules (Delta).","Endocrine: via bloodstream to distant targets (insulin from pancreatic β cells)."],"pages":[181,182,183]},{"heading":"Examples of hormones and local mediators","points":["Adrenal: epinephrine, cortisol (steroid); pancreas α cells: glucagon (fuel mobilization); β cells: insulin (glucose uptake); thyroid: thyroxine.","Steroids: cortisol, estradiol, testosterone.","EGF, PDGF → proliferation; NGF supports neurons; TGF-β inhibits proliferation.","Histamine (mast cells) → vessel dilation and leakiness in inflammation; GABA = inhibitory CNS neurotransmitter."],"pages":[184,185]},{"heading":"Intracellular (nuclear) receptor signaling","points":["Lipid-soluble steroids cross plasma membrane, bind intracellular receptors.","Cortisol → glucocorticoid receptor → complex to nucleus → binds DNA → alters transcription.","Response requires new protein synthesis (slower).","Non-crossing signals use cell-surface receptors and intracellular relays."],"pages":[180,188]},{"heading":"Cell-surface receptors and GPCR structure","points":["Three classes: GPCRs, receptor tyrosine kinases (phosphorylate tyrosines), ligand-gated ion channels.","GPCR = seven transmembrane α-helix bundle; ligand binding changes conformation transmitted to intracellular side.","Activates heterotrimeric G protein (α, β, γ) → effector (e.g., adenylyl cyclase).","GPCR ligands: epinephrine, serotonin, light (rhodopsin), odorants, fMet peptides, acetylcholine; specificity from receptor, G protein, effector, cell context."],"pages":[189,190,191,192]},{"heading":"GPCR–G protein cycle and cAMP","points":["Ligand binds GPCR → GDP released, GTP binds Gα → Gα-GTP activates effector → adenylyl cyclase makes cAMP from ATP.","Gα hydrolyzes GTP (GTPase) → off → reassociates with βγ (trimer reforms).","Amplification: one active receptor activates multiple G proteins; diffusible cAMP reaches many targets.","cAMP = cyclic AMP: phosphate forms cyclic linkage with ribose; second messenger (ligand = first messenger), e.g., serotonin in Aplysia neuron.","Phosphodiesterase converts cAMP → AMP, terminating signal."],"pages":[193,194,195,196,197]},{"heading":"Liver cAMP cascade","points":["Glucagon/epinephrine → GPCR → G protein → adenylyl cyclase → cAMP → protein kinase A (PKA).","PKA activates glycogen phosphorylase and inhibits glycogen synthase → glycogen breakdown, glucose release.","Nuclear branch: PKA phosphorylates/activates CREB → altered gene transcription."],"pages":[197]},{"heading":"Attenuation / desensitization","points":["GRK phosphorylates the active GPCR → high-affinity arrestin site.","Arrestin and G protein compete for same cytoplasmic receptor cavity → arrestin blocks further G-protein activation.","Arrestin can promote receptor internalization (coated pit → vesicle → recycling).","Desensitization = reduced signaling despite continued ligand presence."],"pages":[193,194,198]}],"mustRemember":["Sensor → processing → response; cascade, amplification, feedback, integration, specificity","Autocrine (self), paracrine (local, PDGF), juxtacrine (contact, Delta), endocrine (blood, insulin)","Gaseous signals: NO, CO; steroids derived from cholesterol","Glucagon = pancreatic α cells; insulin = β cells; epinephrine, cortisol = adrenal; thyroxine = thyroid","TGF-β inhibits proliferation; EGF/PDGF stimulate; GABA inhibitory CNS","Cortisol → intracellular glucocorticoid receptor → transcription","Three surface receptor classes: GPCR, RTK, ion channel","GPCR = 7 transmembrane helices; G protein = αβγ heterotrimer","Gα: GDP→GTP exchange = ON; GTP hydrolysis = OFF","Adenylyl cyclase: ATP → cAMP; phosphodiesterase: cAMP → AMP","cAMP → PKA → glycogen phosphorylase ↑, glycogen synthase ↓, CREB ↑","GRK phosphorylates receptor → arrestin binds → blocks G protein, internalization","Rhodopsin = light-detecting GPCR"],"distinguish":[{"pair":"Paracrine vs Endocrine","difference":"Paracrine acts locally on nearby cells; endocrine travels in blood to distant targets."},{"pair":"Autocrine vs Juxtacrine","difference":"Autocrine: cell responds to its own secreted signal; juxtacrine: requires direct cell-surface contact."},{"pair":"Intracellular vs Cell-surface receptor","difference":"Lipid-soluble steroids bind intracellular receptors and change transcription; others bind surface receptors and use relays."},{"pair":"GPCR vs G protein","difference":"GPCR is the seven-transmembrane receptor; G protein is the separate trimeric GTP-binding switch."},{"pair":"First vs Second messenger","difference":"First = extracellular ligand binding receptor; second = intracellular small molecule like cAMP."},{"pair":"AMP vs cAMP","difference":"Both adenine + ribose + phosphate; in cAMP the phosphate forms a cyclic bond with ribose."},{"pair":"Amplification vs Attenuation","difference":"Amplification: one receptor → many G proteins, cAMP; attenuation: GTP hydrolysis, GRK, arrestin, PDE."},{"pair":"Convergence vs Divergence","difference":"Convergence: many inputs meet at a shared component; divergence: one input branches to several outputs."}],"traps":["Signaling types are classified by route and distance, not chemical identity of the messenger.","Endocrine = bloodstream to distant targets; paracrine = short-range local.","GPCR (receptor) ≠ G protein (separate αβγ switch).","cAMP amplifies; GTP hydrolysis plus GRK and arrestin shut off — don't confuse activation with attenuation.","Arrestin binds only the active phosphorylated receptor, competing with the G protein for the same site.","Steroid (cortisol) responses need new protein synthesis via transcription, not a second messenger."]},{"topic":"Cell Death and Cell Division","oneLiner":"Apoptosis is orderly, regulated cell suicide triggered by death receptors (caspase-8) or mitochondria (BCL-2 family → cytochrome c → caspase-9). The cell cycle (G1→S→G2→M) copies DNA in S phase, splits sister chromatids by mitosis, and is driven by cyclin-CDKs and gated by pRb/E2F.","sections":[{"heading":"Apoptosis: morphology and clearance","points":["Apoptosis is programmed, tightly regulated, orderly self-destruction that removes individual cells.","Order of events: cell and nucleus shrink → lose contact with neighbours → chromatin condenses → membrane blebs → nucleus collapses and chromatin fragments → membrane-bound apoptotic bodies.","Apoptotic bodies keep an intact membrane around tightly packed organelles and nuclear fragments.","Macrophages engulf them by phagocytosis and degrade them in phagolysosomes, so contents don't spill and there is little inflammation.","If corpses are not cleared quickly, the membrane fails: this is secondary necrosis.","The cell is taken apart into fragments; it does not simply burst."],"pages":[200,201,202,203,204,206,207]},{"heading":"Extrinsic (death-receptor) pathway","points":["TNF binds the death receptor TNFR1.","TNFR1 recruits the death-domain adaptors TRADD and FADD plus procaspase-8 into a complex at the membrane.","Procaspase-8 is activated to caspase-8, the initiator caspase of this pathway.","Caspase-8 activates executioner caspases, which take the cell apart."],"pages":[208]},{"heading":"BCL-2 family and the intrinsic (mitochondrial) pathway","points":["Anti-apoptotic: BCL-2, BCL-XL, MCL-1, BCL-w, A1. They oppose BAX/BAK.","Pro-apoptotic multidomain: BAX, BAK, BOK. BH3-only inducers (BID, BIM, NOXA, BAD) promote BAX/BAK activation.","Cellular stress activates BAX/BAK, which oligomerize in the mitochondrial outer membrane → pores → MOMP.","MOMP releases cytochrome c into the cytosol. Cytochrome c + Apaf-1 + procaspase-9 form the activation complex (apoptosome).","Caspase-9 (the intrinsic initiator) activates executioner caspases."],"pages":[209,210]},{"heading":"Detecting apoptosis","points":["Phosphatidylserine (PS) normally sits on the inner (cytoplasmic) leaflet. In apoptosis it flips to the outer leaflet and acts as an 'eat-me' signal.","Annexin V binds exposed PS, so it marks apoptotic cells.","Cytochrome c staining: punctate/reticular (inside mitochondria) in healthy cells, diffuse through the cytosol after release.","Staurosporine is used experimentally to induce apoptosis."],"pages":[211,212,213]},{"heading":"Cell cycle phases and DNA state","points":["Cycle: G1 → S → G2 → M → cytokinesis. Interphase (G1+S+G2) is about 90% of the cycle.","G1: growth and organelle production. S: nuclear DNA replication, forming sister chromatids. G2: proteins and energy prepared for division.","G0: quiescent, non-dividing exit from the cycle; can be temporary or permanent.","In G1 each chromosome is one linear dsDNA molecule. In G2 each has two sister chromatids held together by cohesin.","Mitosis + cytokinesis give two genetically identical diploid daughters. Uses: growth, repair/replacement, asexual reproduction (e.g., yeast).","Propidium iodide stains DNA, so DNA content per cell can be measured (histogram)."],"pages":[214,215,216,217]},{"heading":"Mitosis stages (PMAT)","points":["Prophase: chromosomes condense (shorter, thicker, visible as paired sister chromatids), transcription largely shuts down, centrosomes separate, spindle forms. Nuclear envelope breaks down at the end.","Prometaphase: spindle microtubules reach chromosomes and attach to them at the kinetochores.","Metaphase: chromosomes line up at the equator (metaphase plate). Kinetochore motors such as dynein help move them.","Anaphase: sister chromatids separate and move to opposite poles.","Telophase: a nuclear membrane re-forms around each chromosome set. Cytokinesis then pinches the cytoplasm into two cells.","Mitosis separates sister chromatids, not homologous pairs."],"pages":[218,219,220,221,223,224]},{"heading":"Cell-cycle control: MPF, cyclin-CDKs, pRb","points":["Xenopus experiment: cytoplasm from a meiotic oocyte, injected into an immature oocyte, caused premature germinal-vesicle breakdown and entry into meiosis. A soluble cytoplasmic factor (MPF) drives entry into M phase.","Cyclin E–CDK2 drives G1→S. Cyclin A–CDK1/CDK2 acts through S and G2. Cyclin B–CDK1 drives entry into M.","Checkpoints: G1–S, G2–M, metaphase–anaphase.","Active (hypophosphorylated) pRb binds and inhibits E2F, keeping S-phase genes off and guarding the G1→S checkpoint.","Losing both RB1 copies frees E2F → uncontrolled proliferation → retinoblastoma and other cancers."],"pages":[225,226,227]}],"mustRemember":["Extrinsic: TNF → TNFR1 → TRADD/FADD + procaspase-8 → caspase-8 → executioner caspases","Intrinsic: stress → BAX/BAK pore (MOMP) → cytochrome c → Apaf-1 + procaspase-9 → caspase-9 → executioner caspases","Anti-apoptotic: BCL-2, BCL-XL, MCL-1, BCL-w, A1. Pro-apoptotic: BAX, BAK, BOK. BH3-only: BID, BIM, NOXA, BAD","Annexin V binds outward-flipped phosphatidylserine ('eat-me' signal)","Diffuse cytosolic cytochrome c staining = released from mitochondria. Staurosporine induces apoptosis","Apoptosis order: shrinkage → chromatin condensation → blebbing → nuclear collapse/fragmentation → apoptotic bodies → macrophage phagocytosis","Interphase ≈ 90% of the cycle. G1 grow, S copy, G2 prepare, M divide. G0 = quiescent","Cohesin holds sister chromatids together. Kinetochores bind spindle microtubules","Mitosis order: prophase → prometaphase → metaphase → anaphase → telophase → cytokinesis","Cyclin E–CDK2 (G1/S), Cyclin A–CDK1/2 (S, G2), Cyclin B–CDK1 (M)","Hypophosphorylated pRb inhibits E2F. Loss of both RB1 copies → retinoblastoma","MPF discovered by Xenopus oocyte cytoplasm transfer","Propidium iodide = fluorescent DNA stain"],"distinguish":[{"pair":"Extrinsic vs intrinsic apoptosis","difference":"Extrinsic starts at a death receptor (TNFR1) and uses caspase-8. Intrinsic starts at mitochondria (cytochrome c/Apaf-1) and uses caspase-9."},{"pair":"BCL-2/BCL-XL vs BAX/BAK","difference":"BCL-2/BCL-XL are anti-apoptotic. BAX/BAK are pro-apoptotic and oligomerize to cause MOMP."},{"pair":"Initiator vs executioner caspases","difference":"Initiators (caspase-8 or -9) are activated first in their complexes. Executioners carry out the dismantling."},{"pair":"Apoptosis vs secondary necrosis","difference":"In apoptosis the membrane stays intact and corpses are cleared with minimal inflammation. Secondary necrosis is membrane failure when clearance is too slow."},{"pair":"Metaphase vs anaphase","difference":"Metaphase means alignment at the equator. Anaphase means sister chromatids separate to the poles."},{"pair":"Telophase vs cytokinesis","difference":"Telophase re-forms the nuclei. Cytokinesis divides the cytoplasm into two cells."},{"pair":"G0 vs G1","difference":"G0 is a quiescent exit from the cycle. G1 is an active growth phase before S."},{"pair":"Hypophosphorylated vs lost pRb","difference":"Active pRb holds E2F and blocks S entry. Loss of both RB1 copies frees E2F and causes proliferation."}],"traps":["Don't swap the initiators: extrinsic = caspase-8, intrinsic = caspase-9.","BCL-2 is ANTI-apoptotic. BAX/BAK promote mitochondrial permeabilization.","DNA replication happens in S phase, not mitosis. Mitosis only distributes chromatids that are already replicated.","If a question says 'equator', the answer is metaphase. Separation is anaphase.","Mitosis separates sister chromatids, not homologous chromosomes.","PS normally faces inward. Annexin V detects it only once it is exposed on the outside."]},{"topic":"Stem Cells and Differentiation","oneLiner":"Stem cells self-renew and differentiate. Potency narrows from totipotent to unipotent as development goes on, and identity comes from differential gene expression. Gurdon's nuclear transfer, Dolly and Yamanaka's OSKM factors proved that differentiated cells can be reprogrammed to pluripotency, and ES cells can self-organize into optic cups.","sections":[{"heading":"Core concepts: fate, potency, determination, differentiation","points":["Fate = what a cell normally becomes. Potency = the range of cell types it could become.","Determination = commitment to a fate before any visible specialization. Differentiation = carrying out the specialized morphology and physiology.","Development progressively restricts potency (lineage restriction).","All cell types descend from the zygote, e.g. neurons conduct, muscle generates force, RBCs carry O₂.","Differentiation is driven by differential gene expression: same genome, different active gene subsets → different proteomes → different structures and functions."],"pages":[233,234,237,238]},{"heading":"Potency hierarchy and clonality","points":["Totipotent → pluripotent → multipotent → oligopotent → unipotent (decreasing potential).","Totipotent: all embryonic and extraembryonic cells, so a complete organism; the earliest embryonic cells.","Pluripotent: cells of all major body lineages, but cannot form a whole organism alone (e.g., ES cells).","Multipotent/oligopotent: restricted to a lineage. Unipotent: one mature cell type.","A clone is all cells descended from one founder. Clonal expansion is repeated division, e.g. an antigen-matched lymphocyte clone is selected and then expands."],"pages":[235,236,237]},{"heading":"Hematopoietic tree","points":["The multipotent hematopoietic stem cell splits into common myeloid and common lymphoid progenitors.","Myeloid: erythrocytes, megakaryocytes/platelets, granulocytes, mast cells, monocytes/macrophages.","Lymphoid: B cells, T cells, NK cells."],"pages":[230]},{"heading":"Early development: blastulation, gastrulation, germ layers","points":["Cleavage → morula → blastocyst (blastula) with a fluid-filled blastocoel.","Mammalian blastocyst = inner cell mass (gives the embryo proper and the pluripotent ES cell lines) + outer trophoblast.","Gastrulation uses coordinated morphogenetic cell movements to set up ectoderm, mesoderm and endoderm (triploblasts). Diploblasts have two layers.","Endoderm → digestive tract, liver, pancreas.","Mesoderm → kidney, cartilage, bone, spleen, circulatory and lymphatic systems, muscle, blood.","Ectoderm → hair, nails, dermis, brain, spinal cord, retina (nervous system)."],"pages":[239,240,241,242,243,244]},{"heading":"Discovery of adult stem cells and their properties","points":["Till & McCulloch: mice given whole-body irradiation were rescued by IV bone marrow. Survival rose with the number of marrow cells injected, pointing to rare regenerative marrow cells.","Mauro: TEM of frog muscle showed satellite cells beside fibres, proposed as precursors. They were later shown to be muscle stem cells.","Defining properties: self-renewal + differentiation + long-term proliferation.","Adult (tissue-specific) stem cells give a restricted output, and many are quiescent (reversible low-activity state). ES cells can generate all body cell types."],"pages":[245,246,247]},{"heading":"Reprogramming: SCNT, Dolly, iPSCs","points":["2012 Nobel (Physiology or Medicine): John Gurdon and Shinya Yamanaka. Mature cells can be reprogrammed to pluripotency.","Gurdon: tadpole intestinal-cell nucleus put into an enucleated Xenopus egg gave some normal tadpoles. Differentiation does not delete the needed genome.","Dolly (1997): SCNT of an adult mammary-cell nucleus into an enucleated egg; the first mammal cloned from an adult somatic nucleus.","Yamanaka: retroviral vectors delivered transcription-factor genes into mouse embryonic fibroblasts → iPSC colonies.","Factor elimination: 24 candidates narrowed to 10 by dropping one at a time (colony loss = required), then to four (OSKM). Two- or three-factor sets were much weaker.","Validation: normal karyotype (genetic stability) and teratoma formation with tissues from all three germ layers (pluripotency). Both are needed."],"pages":[248,249,250,251,252,253]},{"heading":"iPSC applications and optic-cup self-organization","points":["iPSCs avoid the ethical issues of ES cells and can be patient-specific. Uses: disease models, drug screening on differentiated cells, CRISPR gene correction plus cell replacement, tissue engineering.","Mouse ES cells grown as a 3D embryoid body in Matrigel; Activin induced the retinal gene Rx, shown by Rx-GFP.","Timeline: Day 5 Rx+ neuroepithelium → Day 7 spherical evagination (optic vesicle) → Day 9 invagination into an optic cup. Self-organizing morphogenesis.","Distal invaginated layer → neural retina (Chx10 + Rx + Pax6). Proximal outer layer → RPE (Mitf, Otx2), pigmented by about day 12."],"pages":[254,255,256,257]}],"mustRemember":["Fate = normal outcome. Potency = possible range","Determination (commitment, not visible) precedes differentiation (visible phenotype)","Totipotent > pluripotent > multipotent > oligopotent > unipotent","Endoderm: gut, liver, pancreas. Mesoderm: kidney, bone, cartilage, spleen, blood/lymph systems. Ectoderm: brain, spinal cord, retina, hair, nails","Inner cell mass → embryo proper and ES cells (pluripotent). Trophoblast = outer layer","Till & McCulloch: irradiated mice + bone marrow → survival proportional to dose","Mauro: satellite cells (muscle stem cells), seen by TEM of frog muscle","Gurdon: tadpole intestinal nucleus → enucleated Xenopus egg → tadpoles","Dolly 1997: adult mammary nucleus, SCNT","Yamanaka factors (OSKM): Oct3/4, Sox2, Klf4, c-Myc; retroviral delivery into mouse embryonic fibroblasts; 24 → 10 → 4 candidates","2012 Nobel: Gurdon + Yamanaka","iPSC tests: karyotype (stability) + teratoma (three germ layers = pluripotency)","Optic cup: Activin → Rx (GFP). Day 7 vesicle, Day 9 cup. Neural retina = Chx10/Rx/Pax6. RPE = Mitf/Otx2, pigmented by about day 12","Stem cell = self-renewal + differentiation + long-term proliferation. Adult stem cells are often quiescent"],"distinguish":[{"pair":"Fate vs potency","difference":"Fate is the normal destination. Potency is the full range a cell could produce."},{"pair":"Determination vs differentiation","difference":"Determination is an invisible commitment that comes first. Differentiation is the later, visible specialized phenotype."},{"pair":"Totipotent vs pluripotent","difference":"Totipotent cells can form a whole organism, including extraembryonic tissue. Pluripotent cells form all body lineages but not a whole organism."},{"pair":"Self-renewal vs differentiation","difference":"Self-renewal makes more stem cells. Differentiation makes specialized descendants."},{"pair":"ES cells vs adult stem cells","difference":"ES cells come from the inner cell mass, are pluripotent and make all body cell types. Adult stem cells are tissue-resident, restricted and often quiescent."},{"pair":"SCNT vs iPSC","difference":"SCNT resets a somatic nucleus with egg cytoplasm (Gurdon, Dolly). iPSCs are reprogrammed by defined factors (OSKM)."},{"pair":"Karyotype vs teratoma test","difference":"Karyotype checks chromosome number and structure (stability). Teratoma checks the ability to form tissues from all three germ layers (pluripotency)."},{"pair":"Neural retina vs RPE","difference":"Neural retina is the distal invaginated layer (Chx10, Rx, Pax6). RPE is the proximal outer layer (Mitf, Otx2) and becomes pigmented."}],"traps":["Fate and potency are not synonyms.","Determination comes before visible differentiation. A committed cell can still look like its neighbours.","Don't swap the arrows: self-renewal → stem cell, differentiation → specialized cell.","Don't mix the gene sets: Oct3/4, Sox2, c-Myc and Klf4 are reprogramming factors. Rx, Pax6, Chx10, Mitf and Otx2 are optic-cup markers.","Pluripotent cells cannot form a complete organism alone; only totipotent cells can.","Differentiation changes which genes are expressed, not the genome. Reprogramming shows it is reversible."]},{"topic":"Host Pathogen Interaction","oneLiner":"Innate immunity (barriers, phagocytes, complement, inflammation, NK cells) responds fast and broadly, and adaptive immunity (antibodies, cytotoxic T cells) follows with specificity and memory. Pathogens counter with virulence factors for adherence, invasion and evasion, plus toxins that damage the host (diphtheria, cholera, endotoxin).","sections":[{"heading":"Immune system organisation and blood-cell lineages","points":["Hematopoiesis happens mainly in adult bone marrow. The thymus matures T cells. The spleen, lymph nodes and tonsils are lymphoid organs.","Myeloid: erythrocytes, platelets (from megakaryocytes), mast cells, granulocytes (neutrophils), monocytes/macrophages. Lymphoid: B, T, NK cells.","The immune system is a distributed network: barriers, secretions, WBCs, bone marrow, liver-made complement, lymphatics, tissue-resident immune cells.","Tissue fluid enters lymphatic vessels as lymph, is filtered through lymph nodes, and returns to the blood.","Blood defences: cellular (WBCs) and extracellular (complement, coagulation proteins, cytokines as cell-to-cell signals)."],"pages":[260,261,262,263,273]},{"heading":"Innate vs adaptive and the response map","points":["Innate: rapid with no major lag, recognizes broad patterns, no classical memory. Adaptive: initial lag, antigen-specific, forms memory (later responses are faster and stronger).","The two arms interact continuously.","Route: external barriers → if breached, internal innate (phagocytes, antimicrobial proteins, inflammation, complement, NK cells) → adaptive.","Humoral adaptive response = antibodies (B cells → plasma cells). Cell-mediated = cytotoxic T lymphocytes.","WBC roles: macrophages engulf and present antigen, T cells coordinate or kill, NK cells kill without antigen-specific receptors, mast cells release inflammatory mediators."],"pages":[264,265,266,271,272,274]},{"heading":"External innate barriers","points":["Mechanical: intact skin; flushing by saliva, tears and urine; the mucociliary escalator clears airways.","Chemical: antimicrobial peptides in sweat, lysozyme in tears and saliva (breaks peptidoglycan), stomach HCl (low pH).","Biological: normal flora compete for nutrients and attachment sites and can make inhibitory substances. This is microbial antagonism, or colonization resistance."],"pages":[267,268,269,270]},{"heading":"Phagocytes: neutrophils, monocytes, macrophages","points":["Neutrophils are the most abundant WBC (about 50–60%). They are short-lived granulocytes, efficient phagocytes and the first responders.","Chemotaxis: the cell senses a chemoattractant and becomes polarized with its leading edge toward the source, then moves up the gradient.","Phagocytosis: recognition/attachment → pseudopods engulf the microbe → phagosome → fuses with lysosomes/granules → phagolysosome → digestion → residue expelled.","Granules store digestive enzymes and antimicrobial proteins for rapid use. Neutrophils also release inflammatory mediators that influence adaptive immunity.","NETs (released by NETosis) are webs of decondensed DNA plus antimicrobial proteins that trap microbes outside cells.","Monocytes (about 2–10% of WBCs) circulate, then enter tissues and become macrophages (lung, liver, brain, bone, gut). Macrophages are long-lived tissue phagocytes that present antigen on MHC to T cells."],"pages":[275,276,277,278,279,280,281,282,283,284,285]},{"heading":"NK cells and cytotoxic killing","points":["NK cells are innate lymphoid cells, not B or T cells. They kill virus-infected, intracellularly infected and cancerous host cells without antigen-specific priming.","Missing-self recognition: normal MHC class I gives an inhibitory 'do not kill' signal. Loss of MHC-I tips the activating/inhibitory balance toward killing.","Killing: stable contact (immune synapse) → directed release of cytotoxic granules → perforin lets granzymes in → granzymes (proteases) trigger apoptosis.","Killing the host cell removes the pathogen's intracellular niche. Directed secretion spares neighbouring cells.","Cytotoxic T cells (adaptive) use the same perforin/granzyme machinery but recognize a specific peptide–MHC I complex through the TCR."],"pages":[286,287,288,289,290,291]},{"heading":"Pathogenicity, adherence and capsules","points":["Virulence is the capacity to harm the host. Sequence: portal of entry (with enough microbes) → adherence → penetration/evasion → damage → portal of exit. Virulence factors improve success at these steps.","Adherence: a microbial adhesin (ligand) binds a host receptor and resists wash-out. It sets host specificity and tissue tropism and is a drug target.","Group A Streptococcus M protein binds fibronectin (attachment, invasion) and recruits fibrinogen, albumin and plasminogen into a cloak that hides epitopes from antibodies.","Capsule: polysaccharide layer outside the cell wall (S. pneumoniae, H. influenzae, B. anthracis). It aids attachment and masks PAMPs from TLRs (TLR4 senses LPS).","Capsules also inhibit phagocytosis (opsonization by antibody or complement counters this) and can resist lysosomal digestion after uptake.","Biofilm: a surface-attached community. Quorum sensing detects population density and switches gene expression to coordinate the biofilm."],"pages":[292,293,294,295,296,297,298,299,300,301]},{"heading":"Invasion tools: enzymes, mycolic acid, invasins","points":["A pathogen may first need to breach the mucus barrier to reach host cells.","Hyaluronidase (S. aureus, S. pyogenes) and collagenase (C. perfringens, gas gangrene) digest connective tissue, which helps invasion.","Coagulase (pathogenic S. aureus) forms a clot that shields the bacteria from phagocytes, immune factors and antibiotics. Streptokinase dissolves clots and is used clinically.","IgA protease cleaves the mucosal antibody IgA.","Mycolic acid (a waxy wall lipid in M. tuberculosis and M. leprae) resists lysosomal digestion. The cell wall is peptidoglycan (sugars + amino acids).","Invasins are surface proteins that rearrange host actin → membrane ruffling → microbe enters the cell."],"pages":[302,303,304,305,306,307,308]},{"heading":"Toxins: exotoxins and endotoxin","points":["Toxin = poisonous microbial product. Toxigenicity = ability to make toxin. Toxemia = toxin in the blood.","Diphtheria toxin (A-B): receptor-mediated endocytosis → acid-triggered translocation → fragment A ADP-ribosylates eEF-2 → translation stops → cell death.","Cholera toxin (AB5): five B subunits bind GM1 → A1 locks Gsα in its active GTP state → adenylyl cyclase stays on → cAMP rises → ion and water efflux → diarrhoea.","GPCR background: 7-TM receptor → trimeric G protein → effector (adenylyl cyclase) amplifies the signal. Shut-off by Gα GTP hydrolysis and by receptor phosphorylation plus arrestin.","Endotoxin is lipid A of Gram-negative LPS. It is released by complement lysis, phagocytic digestion or antibiotics.","Endotoxin triggers cytokine secretion and inflammation, causes fever (pyrogen) and affects the blood-brain barrier. It is heat-stable."],"pages":[309,310,311,312,313,314,315,316,317]}],"mustRemember":["Neutrophils about 50–60% of WBCs. Monocytes about 2–10%","Phagocytosis: chemotaxis → attach → phagosome → phagolysosome → digest → expel","NETs = decondensed DNA + antimicrobial proteins (NETosis)","NK missing-self: MHC class I inhibits; loss of MHC-I → kill via perforin + granzymes → apoptosis","CTLs: specific peptide–MHC I via TCR, same perforin/granzyme killing","Barriers: mechanical (skin, flushing, mucociliary escalator), chemical (lysozyme, HCl, antimicrobial peptides), biological (normal flora, colonization resistance)","Liver makes complement. Bone marrow = main adult hematopoiesis. Thymus = T-cell maturation","M protein (Group A Strep): fibronectin binding + host-protein cloak (fibrinogen, albumin, plasminogen)","Capsule examples: S. pneumoniae, H. influenzae, B. anthracis. TLR4 senses LPS","Hyaluronidase: S. aureus, S. pyogenes. Collagenase: C. perfringens (gas gangrene). Coagulase: S. aureus","Mycolic acid: M. tuberculosis, M. leprae","Diphtheria toxin (A-B): ADP-ribosylates eEF-2 → blocks translation","Cholera toxin (AB5, binds GM1): Gsα locked active → ↑cAMP → diarrhoea","Endotoxin = lipid A of Gram-negative LPS; heat-stable pyrogen; released on lysis or antibiotic treatment"],"distinguish":[{"pair":"Innate vs adaptive immunity","difference":"Innate is rapid, broad and has no memory. Adaptive has a lag but is antigen-specific and builds memory."},{"pair":"Humoral vs cell-mediated","difference":"Humoral uses antibodies from B/plasma cells. Cell-mediated uses cytotoxic T lymphocytes."},{"pair":"Neutrophil vs macrophage","difference":"Neutrophils are abundant, short-lived first responders in the blood. Macrophages are long-lived tissue phagocytes derived from monocytes that present antigen."},{"pair":"NK cell vs cytotoxic T cell","difference":"NK cells are innate and kill on missing MHC-I. CTLs are adaptive and need a specific peptide–MHC I. Both use perforin/granzyme."},{"pair":"Coagulase vs streptokinase","difference":"Coagulase forms a protective clot around the bacteria. Streptokinase dissolves clots."},{"pair":"Hyaluronidase vs collagenase","difference":"Both digest connective tissue. Hyaluronidase comes from S. aureus and S. pyogenes; collagenase from C. perfringens."},{"pair":"Diphtheria vs cholera toxin","difference":"Diphtheria (A-B) ADP-ribosylates eEF-2 and stops translation. Cholera (AB5) locks Gsα active and raises cAMP."},{"pair":"Exotoxin vs endotoxin","difference":"Exotoxins are secreted proteins with specific targets. Endotoxin is the heat-stable lipid A of Gram-negative LPS, released on lysis, and drives cytokines and fever."}],"traps":["Innate immunity is not just barriers: phagocytes, complement, inflammation and NK cells are innate too.","NK cells are lymphoid but are neither B nor T cells, and in this course they count as innate.","Antibodies belong to humoral adaptive immunity, not to neutrophils or NK cells.","Don't swap coagulase (makes a clot) with streptokinase (dissolves clots).","A capsule is not only for attachment: it also masks PAMPs, inhibits phagocytosis and resists lysosomal digestion.","Killing bacteria doesn't remove endotoxin: lipid A is heat-stable and is released during lysis or antibiotic treatment."]},{"topic":"Cell Death Pathways","oneLiner":"Regulated cell death comes in distinct forms — apoptosis (intrinsic/extrinsic, caspase-driven, non-inflammatory), necroptosis (caspase-independent, lytic, inflammatory), lysosomal/autophagic degradation, and ferroptosis (iron-dependent lipid peroxidation) — distinguished by morphology, machinery and inflammatory outcome.","sections":[{"heading":"Why programmed cell death & hallmarks of apoptosis","points":["Needed for development/morphogenesis, tissue and immune homeostasis, removal of infected/damaged cells, and response to cellular stress.","Apoptotic morphology: cell shrinkage, chromatin condensation, nuclear fragmentation, membrane blebbing (membrane stays intact), apoptotic bodies → phagocytosis.","Biochemical hallmarks: caspase activation, DNA fragmentation, phosphatidylserine (PS) exposure on the outer leaflet.","Caspases cleave cytoskeletal regulators → cortical actin changes → blebbing.","Caspases cleave plasma-membrane phospholipid-transfer proteins → PS flipped to cell surface (eat-me signal for phagocytes)."],"pages":[319,320,322]},{"heading":"Caspase cascade","points":["Caspases = proteases cleaving selected proteins in regulated death.","Initiator caspases: caspase-8 (extrinsic) and caspase-9 (intrinsic) start the cascade.","Executioner caspases: caspase-3, -6, -7 cleave cellular targets and dismantle the cell."],"pages":[321]},{"heading":"Intrinsic (mitochondrial) apoptosis & BCL-2 family","points":["Internal stimulus induces pro-apoptotic proteins → BAX/BAK activate and oligomerize in mitochondrial outer membrane → MOMP.","Cytochrome c released to cytosol → apoptosome forms → activates initiator caspase-9 → executioners → apoptosis.","Anti-apoptotic BCL-2 (in excess) sequesters pro-apoptotic proteins, blocks BAX/BAK, preserves survival.","BCL-2 family: 3 pro-apoptotic classes (activators, effectors, derepressors/sensitizers) + 1 anti-apoptotic class.","Effectors (BAX/BAK) and anti-apoptotic members have BH1–BH4 domains; activators and sensitizers are BH3-only."],"pages":[323,324]},{"heading":"Extrinsic (Fas-mediated) apoptosis","points":["Fas ligand binds and clusters Fas death receptor on cell surface.","Adaptor FADD links activated Fas to caspase-8 → DISC (death-inducing signaling complex).","Caspase-8 dimerizes/activates at DISC → cleaves executioner caspases 3 and 7 → apoptosis."],"pages":[325]},{"heading":"Necroptosis","points":["Regulated but caspase-independent, lytic and inflammatory; favored when caspase-8/apoptosis is absent or inhibited.","Morphology: plasma-membrane rupture, cytoplasmic swelling and vacuolization, swollen mitochondria; no condensed, fragmented apoptotic nucleus.","Extrinsic triggers: TNFR1, pattern-recognition receptors TLR3 and TLR4.","Intrinsic trigger: ZBP1 sensing Z-form nucleic acids.","Rupture releases DAMPs → detected by T cells, dendritic cells, macrophages → inflammatory mediators and cytokines."],"pages":[326,327,328]},{"heading":"Autophagy/lysosomes & ferroptosis","points":["Lysosomes hold enzymes degrading proteins, nucleic acids, carbohydrates, lipids; acidic lumen (low pH) activates them.","Cathepsins L, B and D = abundant lysosomal proteases.","Ferroptosis: iron-dependent oxidation of PUFA-containing phospholipids → lipid peroxides → membrane disruption.","Protective systems: GPX4/glutathione (GSH), FSP1/coenzyme Q, DHFR/BH4; GPX4 reduces phospholipid hydroperoxides.","Some therapy-resistant cancer cells remain sensitive to ferroptosis induction."],"pages":[329,330]}],"mustRemember":["Initiators: caspase-8 (extrinsic), caspase-9 (intrinsic); executioners: caspase-3, -6, -7","Intrinsic: stimulus → BAX/BAK → MOMP → cytochrome c → apoptosome → caspase-9 → caspase-3/7","Extrinsic: FasL → Fas → FADD
