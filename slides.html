nds of the target region."]},{"page":88,"topic":"Genetic Engineering Applications 1","slideInLecture":13,"title":"Uses of PCR","explain":"PCR supplies many copies of a selected sequence. Those copies can be used for cloning, pathogen detection, mutation analysis, sequencing, and other downstream tests.","mustKnow":["PCR supports gene amplification and cloning.","PCR can detect pathogen nucleic acid.","PCR can help detect mutations.","PCR can prepare DNA for sequencing."],"terms":[{"term":"SNP","meaning":"Single-nucleotide polymorphism, a one-base genetic variation."},{"term":"Template preparation","meaning":"Producing enough DNA for a later method such as sequencing."}],"diagramGuide":["The primer arrows face inward and define the DNA segment copied; the lower product stack represents amplification of that bounded region.","PCR enriches a selected interval rather than copying the entire genome equally."]},{"page":89,"topic":"Genetic Engineering Applications 1","slideInLecture":14,"title":"PCR cycle and exponential amplification","explain":"Each PCR cycle has three ordered steps: denaturation separates DNA strands, annealing lets primers bind, and extension allows polymerase to synthesize new DNA. Under ideal conditions, the target approximately doubles each cycle, giving about 2ⁿ copies after n cycles.","mustKnow":["Order: denaturation, annealing, extension.","Denaturation separates strands.","Annealing binds primers.","Ideal amplification is approximately 2ⁿ."],"terms":[{"term":"Denaturation","meaning":"Heat separation of the two DNA strands."},{"term":"Annealing","meaning":"Binding of primers to complementary target sequences."},{"term":"Extension","meaning":"DNA synthesis from the primers by polymerase."}],"diagramGuide":["Read each cycle left to right: strand separation at 94–95°C, primer binding at 50–65°C, extension at 72°C.","The staircase graph represents ideal doubling, approximately 2ⁿ products after n cycles."]},{"page":90,"topic":"Genetic Engineering Applications 1","slideInLecture":15,"title":"Agarose gel electrophoresis","explain":"DNA has a negatively charged phosphate backbone, so it moves toward the positive electrode in an electric field. The agarose gel acts as a sieve: smaller fragments pass through more easily and therefore travel faster and farther than larger fragments.","mustKnow":["DNA moves toward the positive anode.","Agarose separates DNA mainly by size.","Smaller fragments travel farther.","Migration distance is inversely related to fragment size."],"terms":[{"term":"Agarose gel","meaning":"Porous matrix used to separate DNA fragments."},{"term":"Anode","meaning":"Positive electrode toward which DNA migrates."},{"term":"Molecular sieve","meaning":"Matrix that slows large molecules more than small ones."}],"diagramGuide":["DNA starts at wells near the negative side and migrates toward the positive anode because of its phosphate backbone.","Use distance from the wells to infer size: lower/farther bands are smaller."]},{"page":91,"topic":"Genetic Engineering Applications 1","slideInLecture":16,"title":"Sanger DNA sequencing","explain":"Sanger sequencing mixes normal dNTPs with a small amount of ddNTPs. A ddNTP lacks the 3′-OH needed to add the next nucleotide, so its incorporation stops DNA synthesis. The resulting fragments of different lengths reveal the DNA sequence.","mustKnow":["dNTPs support DNA extension.","ddNTPs terminate DNA synthesis.","ddNTPs lack a 3′-OH.","Fragments ending at each base are used to determine sequence."],"terms":[{"term":"dNTP","meaning":"Normal deoxynucleotide used to extend DNA."},{"term":"ddNTP","meaning":"Chain-terminating nucleotide lacking a 3′-OH."},{"term":"Chain termination","meaning":"Stopping DNA synthesis after incorporation of a ddNTP."}],"diagramGuide":["Compare nucleotide structures: dNTP has a 3′-OH; ddNTP has 3′-H, so no next phosphodiester bond can form.","The chromatogram color peaks are read in order to recover the newly synthesized sequence."]},{"page":92,"topic":"Genetic Engineering Applications 1","slideInLecture":17,"title":"CRISPR-Cas9 overview","explain":"CRISPR-Cas9 is a genome-editing system adapted from bacterial antiviral defense. A guide RNA directs the Cas9 nuclease to a matching DNA sequence, where Cas9 creates a double-strand break. Cellular repair of the break can knock out, insert, or correct genes.","mustKnow":["Guide RNA provides target specificity.","Cas9 is the DNA-cutting nuclease.","Cas9 creates a double-strand break.","Repair can create a knockout or a precise change."],"terms":[{"term":"Guide RNA","meaning":"RNA that base-pairs with the chosen DNA target and directs Cas9."},{"term":"Cas9","meaning":"RNA-guided nuclease that cuts target DNA."},{"term":"Double-strand break","meaning":"Cut through both strands of a DNA duplex."},{"term":"Gene knockout","meaning":"Disruption that removes or strongly reduces gene function."}],"diagramGuide":["The two-part diagram assigns specificity to guide RNA and cutting activity to Cas9.","Editing begins only after the guide–Cas9 complex reaches complementary target DNA."]},{"page":93,"topic":"Genetic Engineering Applications 1","slideInLecture":18,"title":"CRISPR targeting, cutting, and repair","explain":"The guide RNA pairs with a roughly 20-nucleotide target next to a PAM sequence, allowing Cas9 to bind and cut both DNA strands. The cell then repairs the break. Error-prone NHEJ often creates small insertions or deletions and gene knockout, while HDR uses donor DNA for precise insertion or correction.","mustKnow":["Cas9 targeting requires guide matching plus a PAM.","Cas9 makes a double-strand break.","NHEJ often creates indels and knockout.","HDR uses donor DNA for precise editing."],"terms":[{"term":"PAM","meaning":"Short DNA motif next to the target that Cas9 requires for cutting."},{"term":"NHEJ","meaning":"Error-prone end joining that often creates small insertions or deletions."},{"term":"HDR","meaning":"Template-guided repair used for precise sequence insertion or correction."},{"term":"Indel","meaning":"Small insertion or deletion in DNA."}],"diagramGuide":["Follow the numbered panels: guide targeting near PAM → Cas9 double-strand break → cellular repair.","NHEJ often creates indels and knockout; HDR uses a donor template for precise insertion or correction."]},{"page":94,"topic":"Genetic Engineering Applications 1","slideInLecture":19,"title":"Vectors in genetic engineering","explain":"A vector is a DNA vehicle that carries foreign DNA into a host for replication and sometimes expression. A useful vector needs an origin of replication, a selectable marker, an insertion site such as an MCS, and the ability to enter a suitable host. Vector choice depends partly on insert size and purpose.","mustKnow":["Vectors deliver and maintain foreign DNA.","ori permits replication.","A selectable marker supports selection.","An MCS provides insertion sites."],"terms":[{"term":"MCS","meaning":"Multiple cloning site containing several useful restriction sites."},{"term":"ori","meaning":"Origin of replication."},{"term":"Vector","meaning":"DNA molecule used to carry foreign DNA into a host."}],"diagramGuide":["The vector icons increase in carrying capacity from plasmid/phage-type vectors toward BAC and YAC.","On the feature list, ori supports replication, marker supports selection, and MCS supports insertion."]},{"page":95,"topic":"Genetic Engineering Applications 2","slideInLecture":1,"title":"Cloning vectors and plasmids","explain":"A cloning vector is designed mainly to carry and replicate foreign DNA, not necessarily to express it. Good plasmid vectors are small, easy to introduce, often high-copy, and contain an ori, selectable marker, and MCS. Examples include pBR322 and the pUC series.","mustKnow":["Cloning vectors primarily replicate inserted DNA.","ori influences replication and copy number.","Antibiotic-resistance genes are common selectable markers.","pBR322 and pUC are plasmid-vector examples."],"terms":[{"term":"Copy number","meaning":"Number of vector molecules maintained in one host cell."},{"term":"pBR322","meaning":"Early plasmid vector carrying ampicillin- and tetracycline-resistance markers."},{"term":"pUC","meaning":"High-copy plasmid-vector series used for cloning and blue-white screening."}],"diagramGuide":["On the plasmid map, separate ori, antibiotic-resistance marker, and MCS; each has a distinct job.","The pBR322/pUC examples below illustrate selectable markers and high-copy/blue-white-screening designs."]},{"page":96,"topic":"Genetic Engineering Applications 2","slideInLecture":2,"title":"Expression vectors","explain":"An expression vector contains the regulatory elements needed to produce RNA and protein from an inserted gene. In a pET system, the vector enters E. coli, IPTG induces the T7 promoter, the gene is transcribed to mRNA, and the mRNA is translated. Unlike a basic cloning vector, it includes a promoter, translation-initiation signal, and terminator.","mustKnow":["Expression vectors are designed to produce RNA or protein.","They require promoter and translation-control sequences.","IPTG can induce the pET/T7 system.","A cloning vector may maintain DNA without expressing it."],"terms":[{"term":"Expression vector","meaning":"Vector designed to express an inserted gene in a host."},{"term":"RBS","meaning":"Ribosome-binding site used to initiate bacterial translation."},{"term":"IPTG","meaning":"Chemical inducer commonly used to activate lac-controlled expression systems."},{"term":"pET","meaning":"Common E. coli expression-vector system using a T7 promoter."}],"diagramGuide":["The expression-vector map adds promoter, RBS/Kozak sequence, and terminator around the insert.","In the pET map, the T7 promoter drives transcription and the His tag can aid purification."]},{"page":97,"topic":"Genetic Engineering Applications 2","slideInLecture":3,"title":"Selectable markers and reporter genes","explain":"A selectable marker gives vector-containing cells a survival advantage under a selective condition, such as antibiotic resistance. A reporter gene produces a visible or measurable signal. AmpR and KanR are selectable markers; GFP, lacZ, and luciferase are reporters.","mustKnow":["Selection identifies cells that carry the vector by survival.","Reporters produce a detectable signal.","AmpR permits growth on ampicillin.","GFP, lacZ, and luciferase are reporter examples."],"terms":[{"term":"AmpR","meaning":"Ampicillin-resistance selectable marker."},{"term":"GFP","meaning":"Green fluorescent protein used as a reporter."},{"term":"lacZ reporter","meaning":"Reporter used in blue-white colony screening."},{"term":"Luciferase","meaning":"Reporter enzyme that produces light."}],"diagramGuide":["The left half shows survival-based selection on antibiotic; the right half shows visible or measurable reporters.","Growth identifies vector-bearing cells, whereas GFP/lacZ/luciferase reports gene activity or clone status."]},{"page":98,"topic":"Genetic Engineering Applications 2","slideInLecture":4,"title":"Host systems for recombinant expression","explain":"Host choice depends on the protein and purpose. E. coli is fast, cheap, and high-yield but lacks eukaryotic post-translational modifications. Yeast performs some modifications. Plant cells are scalable but slower. Mammalian cells provide the most appropriate complex modifications and protein quality but are slower and more expensive.","mustKnow":["E. coli is fast and inexpensive but lacks eukaryotic modifications.","Yeast can perform some post-translational modifications.","Plant cells can support scalable production.","Mammalian cells suit complex therapeutic proteins."],"terms":[{"term":"Post-translational modification","meaning":"Chemical processing of a protein after translation, such as glycosylation."},{"term":"CHO cells","meaning":"Mammalian host cells commonly used to produce therapeutic proteins."},{"term":"S. cerevisiae","meaning":"Yeast host used for eukaryotic recombinant expression."}],"diagramGuide":["Read the table by trade-off: E. coli is fast but lacks complex modifications; yeast adds some processing; plant/insect and mammalian cells support increasingly complex proteins.","Host choice follows protein requirements, not simply maximum growth rate."]},{"page":99,"topic":"Genetic Engineering Applications 2","slideInLecture":5,"title":"Recombinant DNA workflow","explain":"The complete workflow is ordered: isolate the target gene, insert it into a vector, transform host cells, select and screen transformants, confirm recombinant clones, induce gene expression, and finally produce and purify the recombinant protein.","mustKnow":["Insertion into a vector comes before transformation.","Selection and screening come before clone confirmation.","Expression is induced only after a correct clone is found.","Protein purification is the final stage shown."],"terms":[{"term":"Transformant","meaning":"Host cell that has received introduced DNA."},{"term":"Recombinant clone","meaning":"Verified clone carrying the intended recombinant DNA."},{"term":"Induction","meaning":"Triggering expression of the inserted gene."}],"diagramGuide":["The seven icons form the complete workflow from gene isolation to purified recombinant product.","Selection/screening and clone confirmation are distinct checkpoints before expression."]},{"page":100,"topic":"Genetic Engineering Applications 2","slideInLecture":6,"title":"Isolating the gene of interest","explain":"A target gene can be obtained from genomic DNA or from cDNA. Genomic DNA contains introns and regulatory regions. cDNA is copied from mature mRNA by reverse transcription and therefore lacks introns. cDNA is preferred for expressing a eukaryotic coding sequence in bacteria because bacteria cannot remove introns.","mustKnow":["Genomic DNA contains introns and regulatory DNA.","cDNA is made from mRNA by reverse transcription.","cDNA contains the processed coding sequence without introns.","Bacterial expression usually uses eukaryotic cDNA."],"terms":[{"term":"Genomic DNA","meaning":"DNA taken from the genome, including introns and surrounding regulatory regions."},{"term":"cDNA","meaning":"DNA copy of processed mRNA, usually lacking introns."},{"term":"Reverse transcription","meaning":"Synthesis of DNA using RNA as the template."},{"term":"Gene-specific primer","meaning":"Primer designed to amplify one selected gene sequence."}],"diagramGuide":["The source comparison distinguishes genomic DNA containing introns from cDNA copied from processed mRNA.","Primer arrows flank the gene, showing the segment PCR will amplify."]},{"page":101,"topic":"Genetic Engineering Applications 2","slideInLecture":7,"title":"Purifying the Gene After PCR","explain":"PCR makes many copies of the target gene. The amplified DNA is then purified to remove primers, free nucleotides, enzymes, and other reaction components. The result is a clean DNA fragment ready to be inserted into a vector.","mustKnow":["PCR amplifies the target gene.","Purification removes PCR reaction contaminants.","The purified gene fragment is ready for cloning."],"terms":[{"term":"PCR product","meaning":"The DNA fragment amplified during PCR."},{"term":"Purification","meaning":"Separation of the desired DNA from unwanted reaction components."},{"term":"Vector","meaning":"A DNA carrier used to introduce a gene into a host."}],"diagramGuide":["The left-to-right diagram shows PCR mixture → amplified target plus contaminants → gel/kit purification → clean DNA fragment.","Purification does not amplify DNA; it removes primers, nucleotides, and enzymes."]},{"page":102,"topic":"Genetic Engineering Applications 3","slideInLecture":1,"title":"Transformation of Host Cells","explain":"Transformation introduces a recombinant plasmid into competent bacterial cells. In heat shock, a rapid rise to about 42°C briefly opens membrane pores; electroporation uses a high-voltage pulse. Cells then recover before being placed on selective medium.","mustKnow":["Competence increases membrane permeability to DNA.","Heat shock and electroporation create temporary membrane pores.","Recovery occurs before antibiotic selection.","The plasmid needs an origin of replication and selectable marker."],"terms":[{"term":"Transformation","meaning":"Introduction of external DNA into a host cell."},{"term":"Competent cell","meaning":"A cell treated so that it can take up DNA."},{"term":"Heat shock","meaning":"Rapid temperature change used to promote DNA entry."},{"term":"Electroporation","meaning":"An electric pulse used to create temporary membrane pores."}],"diagramGuide":["Compare transformation routes: heat shock uses rapid temperature change; electroporation uses a high-voltage pulse.","After uptake, recovery precedes plating on selective medium."]},{"page":103,"topic":"Genetic Engineering Applications 3","slideInLecture":2,"title":"Selection Versus Screening","explain":"Antibiotic selection identifies cells that received a plasmid carrying the resistance marker. It does not prove that the desired insert is present. Screening then identifies colonies likely to contain the recombinant plasmid, followed by molecular confirmation.","mustKnow":["Selection detects plasmid-containing cells.","Screening distinguishes likely recombinant colonies.","A positive screened colony still needs confirmation.","White colonies are commonly treated as likely recombinants in the shown scheme."],"terms":[{"term":"Selection","meaning":"Growth condition that allows cells with a selectable marker to survive."},{"term":"Screening","meaning":"Testing selected colonies for the desired recombinant plasmid."},{"term":"Transformant","meaning":"A cell that has taken up introduced DNA."},{"term":"AmpR","meaning":"Ampicillin-resistance marker carried by a plasmid."}],"diagramGuide":["In the selection panel, only plasmid-bearing cells grow on antibiotic; in screening, colony color separates likely recombinant from non-recombinant plasmids.","White colonies are candidates, not final proof; confirmation still follows."]},{"page":104,"topic":"Genetic Engineering Applications 3","slideInLecture":3,"title":"Confirming Recombinant Clones","explain":"Candidate colonies can be checked by colony PCR, restriction digestion, or DNA sequencing. Sequencing gives the exact nucleotide sequence and can confirm both the identity and orientation of the inserted gene.","mustKnow":["Colony PCR checks for an insert directly from a colony.","Restriction digestion checks fragment patterns.","DNA sequencing gives exact base information and orientation."],"terms":[{"term":"Colony PCR","meaning":"PCR performed using cells from a colony to test for an insert."},{"term":"Restriction digestion","meaning":"Cutting DNA at specific sites to produce diagnostic fragments."},{"term":"DNA sequencing","meaning":"Determining the exact order of nucleotides."},{"term":"Orientation","meaning":"The direction in which an insert lies in the vector."}],"diagramGuide":["The three panels provide increasing specificity: colony PCR checks size, restriction digestion checks fragment pattern, and sequencing checks exact bases and orientation.","Read gel bands against the ladder and expected insert/vector sizes."]},{"page":105,"topic":"Genetic Engineering Applications 3","slideInLecture":4,"title":"From Recombinant DNA to Protein","explain":"Inside the host, the inserted gene is transcribed into mRNA and the mRNA is translated into protein. An inducible promoter allows the experimenter to decide when expression begins.","mustKnow":["DNA is transcribed into mRNA.","mRNA is translated into protein.","An inducible promoter provides control over expression."],"terms":[{"term":"Transcription","meaning":"Synthesis of RNA from a DNA template."},{"term":"Translation","meaning":"Synthesis of protein from an mRNA template."},{"term":"Inducible promoter","meaning":"A promoter activated by a chosen signal or inducer."}],"diagramGuide":["The upper sequence shows transform → grow → induce; the lower sequence shows recombinant DNA → mRNA → protein.","The promoter controls transcription; the ribosome acts later during translation."]},{"page":106,"topic":"Genetic Engineering Applications 3","slideInLecture":5,"title":"Controlling Recombinant Gene Expression","explain":"A promoter determines when, where, and how strongly a gene is transcribed. In inducible systems such as lac or T7, adding an inducer such as IPTG switches expression on, allowing controlled high-level protein production.","mustKnow":["Promoters regulate transcription.","IPTG can induce lac-based expression.","lac, T7, and ara are common expression systems.","Induction separates cell growth from strong protein production."],"terms":[{"term":"Promoter","meaning":"DNA region that controls initiation of transcription."},{"term":"Inducer","meaning":"A molecule that activates an inducible expression system."},{"term":"IPTG","meaning":"A commonly used inducer of lac-based expression."},{"term":"T7 system","meaning":"A high-expression system commonly used in E. coli."}],"diagramGuide":["Without inducer, repressor blocks transcription; IPTG inactivates the repressor and exposes the promoter.","The T7 panel separates IPTG-controlled T7 RNA-polymerase production from T7-promoter-driven target expression."]},{"page":107,"topic":"Genetic Engineering Applications 3","slideInLecture":6,"title":"Recombinant Protein Workflow","explain":"The workflow proceeds in order: transform the plasmid, grow the culture, induce expression, harvest cells, lyse them, and purify the recombinant protein. Each step prepares the material for the next.","mustKnow":["Transformation comes before culture growth.","Expression is induced before harvesting.","Cell lysis releases intracellular protein.","Purification follows lysis."],"terms":[{"term":"Induction","meaning":"Activation of recombinant gene expression."},{"term":"Harvest","meaning":"Collection of cells from the culture."},{"term":"Cell lysis","meaning":"Breaking cells open to release their contents."},{"term":"Purification","meaning":"Isolation of the target protein from other cell components."}],"diagramGuide":["Follow the production line exactly: transform → culture → induce → harvest → lyse → purify → product.","Centrifugation harvests cells before lysis releases intracellular protein."]},{"page":108,"topic":"Genetic Engineering Applications 3","slideInLecture":7,"title":"His-Tag Purification with Ni-NTA","explain":"A His-tagged protein binds nickel ions on Ni-NTA resin. Low imidazole washes away weakly or nonspecifically bound proteins. High imidazole competes with the His tag and releases the target protein, which can then be checked by SDS-PAGE.","mustKnow":["His tags bind Ni2+ on Ni-NTA resin.","Low imidazole is used during washing.","High imidazole elutes the target protein.","SDS-PAGE checks purity and molecular weight."],"terms":[{"term":"His tag","meaning":"A short histidine sequence added to aid protein purification."},{"term":"Ni-NTA resin","meaning":"Nickel-containing affinity resin that binds His-tagged proteins."},{"term":"Elution","meaning":"Release of a bound molecule from a purification column."},{"term":"Imidazole","meaning":"A competitor used to wash or elute His-tagged protein."}],"diagramGuide":["The column sequence is bind, wash, elute: His tag binds Ni²⁺, low imidazole removes weak contaminants, high imidazole competes off the target.","SDS-PAGE is an analysis step after elution, not the affinity-separation mechanism itself."]},{"page":109,"topic":"Genetic Engineering Applications 3","slideInLecture":8,"title":"Reading an SDS-PAGE Gel","explain":"SDS denatures proteins and gives them a similar negative charge-to-mass relationship. The gel therefore separates proteins mainly by size: smaller proteins move faster and appear lower. A strong band at the expected size supports successful expression and purity.","mustKnow":["SDS denatures proteins.","Separation depends mainly on molecular weight.","Smaller proteins migrate farther down the gel.","A band at the expected size indicates the target protein may be present."],"terms":[{"term":"SDS-PAGE","meaning":"Gel electrophoresis used to separate denatured proteins mainly by size."},{"term":"Molecular weight","meaning":"Protein size, commonly estimated in kilodaltons."},{"term":"Band","meaning":"A visible group of proteins at a particular gel position."},{"term":"Denaturation","meaning":"Loss of a protein's folded structure."}],"diagramGuide":["In the gel, wells are at the top; smaller proteins migrate farther downward.","Compare crude, wash, and eluted lanes: enrichment is shown by one strong band at the expected molecular weight in the elution."]},{"page":110,"topic":"Genetic Engineering Applications 3","slideInLecture":9,"title":"Major Uses of Genetic Engineering","explain":"The applications are grouped into four broad areas: medicine and healthcare, agriculture and food production, industrial biotechnology, and environmental sustainability.","mustKnow":["Medicine is a major application area.","Agriculture uses engineered traits.","Industry uses engineered organisms to make products.","Environmental uses include sustainable processes."],"terms":[{"term":"Industrial biotechnology","meaning":"Use of biological systems to manufacture useful products."},{"term":"Sustainability","meaning":"Meeting needs while reducing long-term environmental cost."}],"diagramGuide":["The four quadrants organize applications: medicine, agriculture, industrial biotechnology, and environment/sustainability.","Use the icons as category cues—insulin/vaccines, GM crops, enzymes/biofuels, and bioremediation."]},{"page":111,"topic":"Genetic Engineering Applications 3","slideInLecture":10,"title":"Recombinant Human Insulin","explain":"The human insulin gene is cloned into a vector, expressed in E. coli, and the product is purified and processed to make therapeutic insulin. It is a classic example of recombinant protein production.","mustKnow":["The insulin gene is human DNA.","E. coli can serve as the expression host.","The expressed product must be purified and processed.","The final product is therapeutic insulin."],"terms":[{"term":"Recombinant insulin","meaning":"Human insulin produced using genetically engineered cells."},{"term":"Expression host","meaning":"The cell used to produce a recombinant product."},{"term":"Processing","meaning":"Steps that convert the expressed product into its usable form."}],"diagramGuide":["The diagram separates insulin A- and B-chain DNA, bacterial expression, purification, chain combination/refolding, and therapeutic product.","The final disulfide-linked A/B-chain structure is assembled after expression and purification."]},{"page":112,"topic":"Genetic Engineering Applications 3","slideInLecture":11,"title":"Other Recombinant Therapeutic Proteins","explain":"Different recombinant proteins treat different conditions: growth hormone treats growth hormone deficiency, EPO stimulates red blood cell production in anemia, interferons have antiviral and some anticancer uses, and Factors VIII and IX treat hemophilia.","mustKnow":["hGH treats growth hormone deficiency.","EPO stimulates red blood cell production.","Factor VIII treats hemophilia A; Factor IX treats hemophilia B.","Interferons can be used in antiviral therapy and some cancers."],"terms":[{"term":"hGH","meaning":"Human growth hormone used to treat growth hormone deficiency."},{"term":"EPO","meaning":"Erythropoietin, which stimulates red blood cell production."},{"term":"Interferon","meaning":"A signaling protein used in some antiviral and cancer treatments."},{"term":"Clotting factor","meaning":"A blood protein required for normal coagulation."}],"diagramGuide":["Read each protein together with its indication: hGH—growth deficiency; EPO—anemia; interferons—antiviral/some cancers; factors VIII/IX—hemophilia.","Factor number distinguishes hemophilia A (VIII) from hemophilia B (IX)."]},{"page":113,"topic":"Genetic Engineering Applications 3","slideInLecture":12,"title":"Recombinant Vaccines","explain":"Recombinant vaccines present selected pathogen material without using the complete infectious pathogen. Types shown include subunit, virus-like particle, and recombinant vector vaccines. The hepatitis B vaccine uses HBsAg produced in yeast.","mustKnow":["Recombinant vaccine types include subunit, VLP, and vector vaccines.","The hepatitis B vaccine is based on HBsAg.","HBsAg is produced in yeast and is non-infectious.","The recombinant hepatitis B vaccine was approved in 1986."],"terms":[{"term":"Subunit vaccine","meaning":"A vaccine containing selected pathogen components."},{"term":"VLP","meaning":"Virus-like particle that resembles a virus but lacks infectious genetic material."},{"term":"HBsAg","meaning":"Hepatitis B surface antigen used in the vaccine."},{"term":"Recombinant vector vaccine","meaning":"A vaccine using an engineered carrier to deliver antigen information."}],"diagramGuide":["The upper sequence is gene → expression host → purified antigen → immune uptake → antibodies; no infectious whole virus is required.","The hepatitis B panel identifies HBsAg made in yeast as the antigen."]},{"page":114,"topic":"Genetic Engineering Applications 3","slideInLecture":13,"title":"Monoclonal Antibodies and Biologics","explain":"Monoclonal antibodies are engineered biologic molecules designed to bind specific targets. Their production commonly uses mammalian cells because complex antibody proteins require cellular processing and folding. The slide points to therapeutic applications involving targets such as HER2 and diseases such as RSV infection.","mustKnow":["Monoclonal antibodies bind specific targets.","They are produced using genetic engineering.","Mammalian cells are commonly required for proper production of complex antibodies.","Therapeutic antibodies have applications against disease-associated targets."],"terms":[{"term":"Monoclonal antibody","meaning":"A uniform antibody population directed against one target."},{"term":"Biologic","meaning":"A therapeutic product made using living systems."},{"term":"HER2","meaning":"Human epidermal growth factor receptor 2, a therapeutic target."},{"term":"RSV","meaning":"Respiratory syncytial virus."}],"diagramGuide":["The production pipeline is antibody gene → mammalian cell → culture → purification → therapeutic mAb.","The mammalian-cell inset emphasizes folding, post-translational modification, and assembly."]},{"page":115,"topic":"Genetic Engineering Applications 3","slideInLecture":14,"title":"Gene Therapy Strategies","explain":"Gene therapy introduces functional genetic material into a person's cells to restore function or reduce disease. It can replace a defective gene, add a useful gene, silence a harmful gene, or directly edit a mutation.","mustKnow":["Gene replacement supplies a functional version of a defective gene.","Gene addition provides a new useful function.","Gene silencing reduces harmful expression.","Gene editing corrects DNA at the mutation level."],"terms":[{"term":"Gene therapy","meaning":"Treatment based on changing or supplying genetic material in a patient's cells."},{"term":"Gene silencing","meaning":"Reduction or prevention of expression of a harmful gene."},{"term":"siRNA","meaning":"Small RNA that can reduce expression of a target gene."},{"term":"CRISPR","meaning":"A genome-editing system that can make targeted DNA changes."}],"diagramGuide":["The left branch distinguishes ex vivo from in vivo delivery; the right branch distinguishes replacement, addition, silencing, and editing.","Editing changes DNA sequence, whereas silencing reduces expression without necessarily correcting DNA."]},{"page":116,"topic":"Genetic Engineering Applications 3","slideInLecture":15,"title":"Examples of Gene Therapy","explain":"The slide contrasts three applications: in vivo gene addition for spinal muscular atrophy, ex vivo gene editing for sickle cell disease, and engineered immune cells in CAR-T therapy. Editing the BCL11A enhancer can restore fetal hemoglobin and reduce sickling.","mustKnow":["SMA is shown as in vivo gene addition.","Sickle cell treatment is shown as ex vivo gene editing.","CAR-T therapy uses engineered immune cells.","BCL11A enhancer editing can increase fetal hemoglobin."],"terms":[{"term":"In vivo","meaning":"Treatment performed directly inside the body."},{"term":"Ex vivo","meaning":"Cells are modified outside the body and then returned."},{"term":"CAR-T","meaning":"T cells engineered to express a chimeric antigen receptor."},{"term":"BCL11A","meaning":"A regulator whose enhancer can be edited to reactivate fetal hemoglobin."}],"diagramGuide":["Match each picture to delivery strategy: SMA uses in vivo gene addition, sickle-cell treatment edits cells ex vivo, and CAR-T engineers immune cells.","The BCL11A-enhancer route raises fetal hemoglobin rather than directly repairing every sickle mutation."]},{"page":117,"topic":"Genetic Engineering Applications 3","slideInLecture":16,"title":"Genetic Engineering in Agriculture","explain":"Crop genomes can be modified for pest and disease resistance, tolerance to drought or salinity, improved nutrition, higher yield, and better quality. The intended benefits include food production, reduced chemical inputs, and improved stress tolerance.","mustKnow":["Biotic stress includes pests and pathogens.","Abiotic stress includes drought, salinity, heat, and cold.","Nutritional traits can increase vitamins, amino acids, or minerals.","Crop engineering can target yield and shelf life."],"terms":[{"term":"Biotic stress","meaning":"Stress caused by living agents such as pests or pathogens."},{"term":"Abiotic stress","meaning":"Stress caused by nonliving factors such as drought or heat."},{"term":"Trait","meaning":"A measurable characteristic of an organism."},{"term":"Sustainable agriculture","meaning":"Food production designed for long-term resource and environmental viability."}],"diagramGuide":["The pipeline runs gene identification → transformation → selection/regeneration → engineered plant.","Keep biotic stress (pests/pathogens) separate from abiotic stress (drought, salt, heat, cold)."]},{"page":118,"topic":"Genetic Engineering Applications 3","slideInLecture":17,"title":"Bt Crops","explain":"Bt crops express Cry insecticidal proteins from Bacillus thuringiensis. These proteins protect against specific insect pests, potentially reducing chemical insecticide use. Concerns include insect resistance, non-target effects, gene flow, and biosafety.","mustKnow":["Bt refers to Bacillus thuringiensis.","Cry proteins provide insect resistance.","The protection is directed against specific target pests.","Resistance management is needed to slow evolution of resistant insects."],"terms":[{"term":"Bt crop","meaning":"A crop engineered to express an insecticidal Bt protein."},{"term":"Cry toxin","meaning":"An insecticidal protein produced by Bacillus thuringiensis."},{"term":"Non-target organism","meaning":"An organism not intended to be affected by the engineered trait."},{"term":"Gene flow","meaning":"Movement of genes between populations, such as through pollen."}],"diagramGuide":["Follow the Bt mechanism: plant expresses Cry protein → insect ingests it → toxin is activated in the gut → membrane pores form → insect dies.","The crop protects against specified target insects; the diagram does not imply universal toxicity."]},{"page":119,"topic":"Genetic Engineering Applications 3","slideInLecture":18,"title":"Golden Rice","explain":"Golden rice is engineered so that its endosperm produces beta-carotene, a provitamin A compound. Introducing genes activates the carotenoid pathway in the grain, producing the golden color and aiming to reduce vitamin A deficiency.","mustKnow":["Golden rice accumulates beta-carotene.","Beta-carotene is provitamin A.","Production occurs in the rice endosperm.","This is nutritional biofortification."],"terms":[{"term":"Beta-carotene","meaning":"A carotenoid that the body can convert to vitamin A."},{"term":"Endosperm","meaning":"The nutrient-rich storage tissue of a seed."},{"term":"Biofortification","meaning":"Increasing the nutritional content of a food crop."},{"term":"Carotenoid pathway","meaning":"A biochemical pathway that produces carotenoid pigments."}],"diagramGuide":["The pathway diagram adds psy and crtI activity in rice endosperm, allowing carotenoid intermediates to reach β-carotene.","The yellow grain is a visual marker of β-carotene accumulation, not vitamin A itself."]},{"page":120,"topic":"Genetic Engineering Applications 3","slideInLecture":19,"title":"Crop Improvement Traits","explain":"The slide compares ordinary and engineered crops across six traits: herbicide tolerance, disease resistance, improved nutrition, abiotic-stress tolerance, delayed ripening, and improved yield or quality.","mustKnow":["Herbicide-tolerant plants survive the relevant herbicide.","Disease resistance targets pathogens.","Delayed ripening can extend shelf life.","Abiotic-stress tolerance can cover drought, heat, cold, or salinity."],"terms":[{"term":"Herbicide tolerance","meaning":"Ability of a crop to survive application of a herbicide."},{"term":"Delayed ripening","meaning":"Slower maturation that can extend storage life."},{"term":"Nutritional quality","meaning":"Content of useful nutrients such as vitamins or amino acids."}],"diagramGuide":["Read the six paired comparisons as trait outcomes: herbicide survival, pathogen resistance, nutrient enhancement, abiotic tolerance, delayed ripening, and yield/quality.","Each pair contrasts a conventional/sensitive phenotype with the engineered phenotype."]},{"page":121,"topic":"Genetic Engineering Applications 3","slideInLecture":20,"title":"Industrial Genetic Engineering","explain":"Engineered organisms can manufacture food-processing proteins, industrial enzymes, bio-based chemicals, fuels, and materials. Examples include chymosin, lactase, amylase, protease, lipase, amino acids, vitamins, ethanol, and bioplastics.","mustKnow":["Chymosin and lactase are food-biotechnology examples.","Amylase, protease, and lipase are industrial enzymes.","Ethanol and bioplastics are bioproducts.","Advantages include yield, consistency, scalability, and lower cost."],"terms":[{"term":"Chymosin","meaning":"An enzyme used in cheese production."},{"term":"Lactase","meaning":"An enzyme that breaks down lactose."},{"term":"Bioplastic","meaning":"Plastic made partly or fully from biological resources."},{"term":"Scalable","meaning":"Capable of being expanded to larger production volumes."}],"diagramGuide":["Read the four numbered application groups from top to bottom; the right column lists the shared production advantages, not additional products."]},{"page":122,"topic":"Genetic Engineering Applications 3","slideInLecture":21,"title":"Environmental Applications","explain":"Environmental genetic engineering applications include bioremediation, wastewater treatment, biosensors, and sustainable bioprocesses. The shared aim is to use biological systems to detect, remove, or reduce environmental burdens.","mustKnow":["Bioremediation uses organisms or biological activity to address pollutants.","Wastewater treatment removes contaminants from water.","Biosensors detect selected substances.","Sustainable bioprocesses aim to reduce environmental cost."],"terms":[{"term":"Bioremediation","meaning":"Use of biological systems to remove or transform pollutants."},{"term":"Biosensor","meaning":"A device using a biological component to detect a target."},{"term":"Bioprocess","meaning":"A production or treatment process based on cells, enzymes, or other biological systems."}],"diagramGuide":["Follow each panel left to right: pollutant breakdown (bioremediation), toxin removal (wastewater), target detection producing a signal (biosensor), and biomass conversion into products (sustainable bioprocess)."]},{"page":123,"topic":"Genetic Engineering Applications 3","slideInLecture":22,"title":"Engineered Plants and Disease Protection","explain":"The slide shows genetically modified peach and apple trees growing in laboratory culture and wheat seeds treated with bacteria to make them nearly immune to a fungal disease. Both images illustrate agricultural biotechnology.","mustKnow":["Plant material can be grown under laboratory conditions.","Biotechnology can be used to improve resistance to fungal disease.","The examples involve fruit trees and wheat."],"terms":[{"term":"Plant tissue culture","meaning":"Growth of plant cells or tissues under controlled laboratory conditions."},{"term":"Fungal disease","meaning":"Plant disease caused by a fungus."},{"term":"Disease resistance","meaning":"Ability to prevent or limit disease caused by a pathogen."}],"diagramGuide":["The left photograph is laboratory-grown fruit-tree material; the right photograph shows wheat seed treatment. The two images represent propagation and disease protection, respectively."]},{"page":124,"topic":"Genetic Engineering Applications 3","slideInLecture":23,"title":"Knockout and Fluorescent Mice","explain":"One comparison shows a normal mouse and a mouse in which a hair-growth gene was knocked out, producing a hairless phenotype. The other shows mice engineered to express enhanced green fluorescent protein, causing fluorescence.","mustKnow":["A gene knockout disables a selected gene.","Knocking out a hair-growth gene changes the mouse phenotype.","GFP expression makes engineered mice fluorescent.","Genetic modification can remove function or add expression."],"terms":[{"term":"Gene knockout","meaning":"Targeted disabling of a gene."},{"term":"Phenotype","meaning":"An observable characteristic produced by genotype and environment."},{"term":"GFP","meaning":"Green fluorescent protein used as a visible marker."},{"term":"Expression","meaning":"Use of gene information to produce an RNA or protein product."}],"diagramGuide":["Left pair: compare normal fur with the hairless knockout phenotype. Right group: fluorescence marks mice expressing enhanced GFP; the central nonfluorescent mouse is normal."]},{"page":125,"topic":"Genetic Engineering Applications 3","slideInLecture":24,"title":"Genetically Modified Bacteria","explain":"Bacteria are common GMOs because their DNA is relatively easy to manipulate. The slide gives engineered fuel and material examples: cyanobacteria producing polyethylene or butanol and E. coli producing diesel fuel.","mustKnow":["Bacteria are widely used because they are comparatively easy to engineer.","Engineered microbes can produce hydrocarbons.","Cyanobacteria are shown producing plastic or butanol.","E. coli is shown producing diesel fuel."],"terms":[{"term":"GMO","meaning":"An organism whose genetic material has been deliberately modified."},{"term":"Cyanobacteria","meaning":"Photosynthetic bacteria."},{"term":"Hydrocarbon","meaning":"A compound made only of hydrogen and carbon, common in fuels and plastics."},{"term":"Butanol","meaning":"An alcohol that can be used as a fuel."}],"diagramGuide":["The bottom arrow represents engineered microbial production: photosynthetic cyanobacteria or E. coli are used as factories for plastic or fuel products."]},{"page":126,"topic":"Genetic Engineering Applications 3","slideInLecture":25,"title":"Why Engineer Plants?","explain":"This transition slide asks how plant engineering could address practical problems such as hunger, harsh weather, and insecticide pollution. It introduces the following crop examples rather than presenting a detailed mechanism.","mustKnow":["Plant engineering can target food supply.","It can target weather-related stress.","It can reduce dependence on insecticides."],"terms":[{"term":"Crop engineering","meaning":"Genetic modification of crop plants to introduce useful traits."},{"term":"Insecticide pollution","meaning":"Environmental contamination caused by chemicals used to kill insects."}],"diagramGuide":["The crop photographs cue two target problems: food production and resistance to environmental or insect stress."]},{"page":127,"topic":"Genetic Engineering Applications 3","slideInLecture":26,"title":"GM Crop Adoption and Bt Corn","explain":"The slide reports high US adoption percentages for GM soybean, cotton, corn, and sugar beet in 2010. Bt corn contains a bacterial gene that makes an insecticidal protein active against certain insects.","mustKnow":["Bt corn carries a gene from Bt bacteria.","The resulting protein is toxic to certain insects.","The slide states that the protein is not poisonous to humans.","The displayed adoption figures refer to the US in 2010."],"terms":[{"term":"Bt corn","meaning":"Corn engineered to produce a Bacillus thuringiensis insecticidal protein."},{"term":"Adoption rate","meaning":"The proportion of crop production using a technology or trait."},{"term":"Specificity","meaning":"Activity directed toward particular targets rather than all organisms."}],"diagramGuide":["The percentages are crop-adoption data from the US in 2010. The corn image illustrates the Bt-corn example discussed below the percentages."]},{"page":128,"topic":"Genetic Engineering Applications 3","slideInLecture":27,"title":"Edible Vaccines and Insect-Resistant Cabbage","explain":"Two proposed plant applications are shown. A modified virus introduced into a banana sapling causes bananas to contain viral proteins, while adding scorpion genes to cabbage is presented as a way to deter insect feeding.","mustKnow":["The banana example aims to produce viral proteins in fruit.","The cabbage example aims to prevent insect feeding.","Both examples add a new biological function to a plant."],"terms":[{"term":"Edible vaccine","meaning":"A vaccine antigen produced in an edible plant tissue."},{"term":"Viral protein","meaning":"A protein encoded by a virus that can serve as an antigen."},{"term":"Transgene","meaning":"A gene introduced into an organism by genetic engineering."}],"diagramGuide":["Top: modified viral material is introduced into a banana sapling so fruit contains viral proteins. Bottom: an introduced scorpion gene is linked to insect deterrence in cabbage."]},{"page":129,"topic":"Genetic Engineering Applications 3","slideInLecture":28,"title":"Reasons to Modify Crops","explain":"Crop modification can aim for insect, herbicide, drought, freeze, or disease resistance; higher yield; faster growth; improved nutrition; or longer shelf life. Golden rice is repeated as an example of beta-carotene enrichment.","mustKnow":["Resistance traits can target organisms, chemicals, or weather.","Yield and growth rate can be modified.","Nutrition and shelf life are also targets.","Golden rice produces beta-carotene."],"terms":[{"term":"Herbicide resistance","meaning":"Ability to survive a herbicide that would kill a sensitive plant."},{"term":"Shelf life","meaning":"Time a product remains usable or acceptable during storage."},{"term":"Fortified food","meaning":"Food with increased nutritional value."}],"diagramGuide":["The rice image connects beta-carotene production to vitamin-A fortification; the remaining crop images illustrate other engineered agricultural traits."]},{"page":130,"topic":"Genetic Engineering Applications 3","slideInLecture":29,"title":"Engineering Animals","explain":"This transition slide introduces the idea that animals can be genetically modified to solve practical problems. The following slides provide examples involving imaging, growth, emissions, and material production.","mustKnow":["Animals can be genetically engineered.","Engineered traits can serve research or practical applications.","The slide introduces examples rather than a specific mechanism."],"terms":[{"term":"Transgenic animal","meaning":"An animal carrying introduced genetic material."},{"term":"Animal biotechnology","meaning":"Use of biological engineering methods in animals."}],"diagramGuide":[]},{"page":131,"topic":"Genetic Engineering Applications 3","slideInLecture":30,"title":"Bioluminescent and Fluorescent Animals","explain":"Light-producing or fluorescent markers can be used for protein tracking and disease detection by imaging particular cells. The slide also notes novelty pets such as GloFish and shows mice expressing enhanced GFP.","mustKnow":["Fluorescent markers can track proteins or cells.","Bioluminescent imaging can help detect disease-related cells.","GFP is a visible biological marker.","GloFish are a novelty-pet application."],"terms":[{"term":"Bioluminescence","meaning":"Light production by a living system through a chemical reaction."},{"term":"BLI","meaning":"Bioluminescent imaging used to visualize labeled biological activity."},{"term":"GFP","meaning":"Green fluorescent protein used to label cells or proteins."},{"term":"Protein tracking","meaning":"Following the location or movement of a protein using a detectable marker."}],"diagramGuide":["Read the visual equation as bioluminescent source plus mouse produces a fluorescently traceable mouse. The emitted signal is used to locate labeled cells or proteins."]},{"page":132,"topic":"Genetic Engineering Applications 3","slideInLecture":31,"title":"Fast-Growing Salmon and Lower-Methane Cattle","explain":"The salmon example uses genes from two other fish to maintain growth-hormone production and accelerate growth. The cattle example proposes modifying methane-producing bacteria to reduce methane output by about 25%.","mustKnow":["The salmon carries genes from two other fish.","The engineered salmon continually produces growth hormone.","The cattle example targets methane-producing bacteria.","The stated reduction in methane is 25%."],"terms":[{"term":"Growth hormone","meaning":"A hormone that promotes body growth."},{"term":"Methane","meaning":"A greenhouse gas produced during microbial digestion in cattle."},{"term":"Microbiome","meaning":"The community of microorganisms living in a particular environment."}],"diagramGuide":["Top comparison: the GM salmon reaches greater size over the same 18-month period. Bottom: the cow image represents reduced methane after altering methane-producing bacteria."]},{"page":133,"topic":"Genetic Engineering Applications 3","slideInLecture":32,"title":"Spider-Silk-Producing Goats","explain":"The slide presents goats carrying spider genes so that spider-silk protein can be produced in goat milk. This uses an animal as a biological production system for a useful material.","mustKnow":["Spider genes are introduced into goats.","The target product is spider silk.","The silk protein is produced in goat milk.","The animal acts as a production host."],"terms":[{"term":"Spider silk","meaning":"A strong protein-based fiber naturally produced by spiders."},{"term":"Production host","meaning":"An organism used to manufacture a desired biological product."},{"term":"Transgenic goat","meaning":"A goat carrying an introduced gene."}],"diagramGuide":["The pictogram proposes transferring a spider gene into another host; the goat below is the actual production host, and milk is the collection material for spider-silk protein."]},{"page":134,"topic":"Genetic Engineering Applications 3","slideInLecture":33,"title":"Concerns About GMOs","explain":"The slide lists possible concerns involving food safety, environmental and wildlife harm, pesticide or herbicide use, farmer health, seed and pollen drift, and herbicide-resistant weeds. It also notes regulation, bans, and labeling requirements in many countries.","mustKnow":["Health and environmental safety are major concern categories.","Seed and pollen drift can move engineered genes.","Herbicide-resistant weeds are a stated concern.","Countries differ in restrictions and labeling rules."],"terms":[{"term":"Pollen drift","meaning":"Movement of pollen away from the intended crop area."},{"term":"Superweed","meaning":"Informal term for a weed with strong herbicide resistance."},{"term":"GMO labeling","meaning":"Identification of products containing genetically modified ingredients."},{"term":"Risk assessment","meaning":"Systematic evaluation of possible hazards and their likelihood."}],"diagramGuide":["The laboratory image represents controlled production, while the bullet list identifies risks that arise after consumption, cultivation, or environmental spread."]},{"page":135,"topic":"Genetic Engineering Applications 3","slideInLecture":34,"title":"Biosafety, Ethics, and Regulation","explain":"Genetic engineering must be evaluated for unintended effects, off-target changes, laboratory and release risks, germline editing, consent, fairness, misuse, gene flow, and ecosystem effects. Regulation involves safety testing, approval, and monitoring.","mustKnow":["Off-target changes are a biosafety issue.","Germline editing creates heritable changes.","Environmental review includes non-target organisms and biodiversity.","Regulation includes pre-use testing and post-release monitoring."],"terms":[{"term":"Off-target change","meaning":"An unintended genetic alteration outside the intended site."},{"term":"Germline editing","meaning":"Editing reproductive-line DNA so a change can be inherited."},{"term":"Informed consent","meaning":"Voluntary agreement based on adequate understanding."},{"term":"Post-release monitoring","meaning":"Continued observation after environmental or commercial release."}],"diagramGuide":["The slide is organized into four risk domains: biosafety, ethics, environment, and regulation. Pair each example with its domain rather than memorizing one undifferentiated list."]},{"page":136,"topic":"Genetic Engineering Applications 3","slideInLecture":35,"title":"Advantages and Challenges","explain":"Genetic engineering can precisely modify traits, produce recombinant products, improve crops, and support treatment of genetic disease. Its challenges include unintended effects, difficult delivery, cost, regulation, ethics, and uncertain long-term effects.","mustKnow":["Precision and useful-product production are key advantages.","Delivery of genetic material can be difficult.","Development and production can be costly.","Long-term health and environmental effects may require monitoring."],"terms":[{"term":"Delivery","meaning":"Getting genetic material into the required cells or tissues."},{"term":"Unintended effect","meaning":"A result that was not the goal of the modification."},{"term":"Monitoring","meaning":"Repeated observation to detect effects over time."}],"diagramGuide":["Compare the two columns: benefits are on the left and technical, economic, regulatory, or long-term limitations are on the right."]},{"page":137,"topic":"Genetic Engineering Applications 3","slideInLecture":36,"title":"Future of Genetic Engineering","explain":"Future directions include more precise base and prime editing, improved CRISPR systems, personalized medicine, synthetic biology, engineered therapeutic cells, and organisms that make greener fuels, chemicals, and materials.","mustKnow":["Base and prime editing aim for greater precision.","Personalized medicine uses individual genetic information.","Synthetic biology designs biological systems and circuits.","Sustainable biotechnology targets greener products and crops."],"terms":[{"term":"Base editing","meaning":"Targeted conversion of one DNA base into another without a standard double-strand break."},{"term":"Prime editing","meaning":"A targeted editing method capable of writing selected DNA changes."},{"term":"Personalized medicine","meaning":"Treatment adapted to an individual's biological or genetic features."},{"term":"Synthetic biology","meaning":"Design and construction of new biological systems or functions."}],"diagramGuide":["Each numbered future direction is paired with an icon: genome editing, individual-specific therapy, engineered cellular systems, and sustainable production."]},{"page":138,"topic":"Biological Motors","slideInLecture":1,"title":"Biological Motors","explain":"This title slide begins the lecture on biological motors. The topic is how molecular systems convert energy into directed motion or other cellular work.","mustKnow":["The new lecture topic is biological motors.","The course is SBL100.","The lecture is presented by Prof. Anita Roy."],"terms":[{"term":"Biological motor","meaning":"A biological system that converts energy into motion or other work."}],"diagramGuide":[]},{"page":139,"topic":"Biological Motors","slideInLecture":2,"title":"What Is a Motor?","explain":"A conventional motor converts electrical energy into mechanical energy. The lecture broadens the definition to include devices that convert chemical energy into mechanical energy, which is the relevant idea for molecular motors.","mustKnow":["Conventional motors convert electrical to mechanical energy.","Biological motors can convert chemical to mechanical energy.","Faraday and Tesla are mentioned in the historical introduction."],"terms":[{"term":"Mechanical energy","meaning":"Energy associated with motion or force."},{"term":"Chemical energy","meaning":"Energy stored in chemical bonds and concentration differences."},{"term":"Induction motor","meaning":"An electric motor design associated on the slide with Nikola Tesla."}],"diagramGuide":["The historical motor photograph is an example of a macroscopic machine; the key relationship is energy input being converted into mechanical output."]},{"page":140,"topic":"Biological Motors","slideInLecture":3,"title":"Cells Need Continuous Energy Input","explain":"Thermodynamics determines whether reactions are energetically favorable. Many necessary cellular reactions are unfavorable on their own, so cells must supply additional energy obtained from the environment. Energy generation and use are therefore fundamental to cell biology.","mustKnow":["Thermodynamics governs chemical equilibrium.","Some required cellular reactions are energetically unfavorable.","Unfavorable processes require energy input.","Cells continually obtain and use metabolic energy."],"terms":[{"term":"Chemical equilibrium","meaning":"A state with no net change in reactant and product concentrations."},{"term":"Energetically favorable","meaning":"Able to proceed in the favored direction under the stated conditions."},{"term":"Metabolic energy","meaning":"Energy captured and used through cellular chemical reactions."}],"diagramGuide":["Graph axes: Gibbs free energy G is vertical and extent of reaction ξ is horizontal. The curve falls when ΔG<0, reaches equilibrium at its minimum where ΔG=0, and rises in the region where forward progress has ΔG>0."]},{"page":141,"topic":"Biological Motors","slideInLecture":4,"title":"Life Operates Out of Equilibrium","explain":"Living cells maintain ordered structures, unequal chemical concentrations, and spatial charge differences. These conditions are not equilibrium states and require continuous energy use. Molecular machines create and maintain them by converting one store of free energy into another.","mustKnow":["Living order requires a nonequilibrium state.","Cells maintain concentration and charge differences.","Proton pumps help maintain acidic lysosomal pH.","Molecular machines transduce nonequilibrium free energy."],"terms":[{"term":"Nonequilibrium","meaning":"A state maintained away from thermodynamic equilibrium."},{"term":"Free energy","meaning":"Energy available to perform work under given conditions."},{"term":"Proton pump","meaning":"A protein that moves H+ across a membrane."},{"term":"Energy transduction","meaning":"Conversion of energy from one form or reservoir to another."}],"diagramGuide":["No formal diagram is shown; the lysosomal proton-pump example links an energy-consuming machine to maintenance of a nonequilibrium pH gradient."]},{"page":142,"topic":"Biological Motors","slideInLecture":5,"title":"Why Molecular Motors Are Different","explain":"Molecular motors work at nanometer scale in water, where viscosity, Brownian motion, and stochastic behavior matter. Their activity depends strongly on temperature and pH, relies on noncovalent interactions, and uses internal molecular dynamics rather than rigid macroscopic parts.","mustKnow":["Molecular motors operate at nanometer scale.","They work in aqueous, low-Reynolds-number conditions.","Brownian motion makes their environment stochastic.","Their operation depends on noncovalent interactions, temperature, and pH."],"terms":[{"term":"Brownian motion","meaning":"Random movement caused by collisions with surrounding molecules."},{"term":"Low Reynolds number","meaning":"A regime where viscous forces dominate over inertia."},{"term":"Noncovalent interaction","meaning":"A reversible interaction such as hydrogen bonding or electrostatic attraction."},{"term":"Stochastic","meaning":"Involving random variation or probability."}],"diagramGuide":["Treat the bullet list as a contrast with macroscopic motors: nanometre scale, aqueous low-Reynolds-number conditions, Brownian noise, narrow pH/temperature range, and noncovalent interactions."]},{"page":143,"topic":"Biological Motors","slideInLecture":6,"title":"Molecular Motors Convert Energy","explain":"A molecular motor is a complex of biological macromolecules that converts one form of energy into directed motion or another function. A major energy source is ATP hydrolysis to ADP and inorganic phosphate.","mustKnow":["Molecular motors are macromolecular complexes.","They convert energy into directed motion or function.","ATP is a major energy source.","ATP hydrolysis produces ADP and Pi."],"terms":[{"term":"Macromolecule","meaning":"A large biological molecule such as a protein or nucleic acid."},{"term":"ATP","meaning":"A cellular energy-carrying nucleotide."},{"term":"Hydrolysis","meaning":"Chemical bond cleavage involving water."},{"term":"Pi","meaning":"Inorganic phosphate released during ATP hydrolysis."}],"diagramGuide":["The reaction arrow ATP → ADP + Pi represents chemical-bond energy being coupled to directed mechanical work."]},{"page":144,"topic":"Biological Motors","slideInLecture":7,"title":"Principle 1: ATP or GTP Energy","explain":"The first fundamental principle is that molecular motors use energy from ATP or GTP. ATPases catalyze ATP hydrolysis, while ATP synthase can make ATP. The slide gives a standard ATP-hydrolysis free-energy change of about -7.3 kcal/mol.","mustKnow":["ATP and GTP can power molecular motors.","ATPase catalyzes ATP hydrolysis.","ATP synthase produces ATP.","The displayed standard ΔG for ATP hydrolysis is negative."],"terms":[{"term":"ATPase","meaning":"An enzyme that catalyzes ATP hydrolysis."},{"term":"ATP synthase","meaning":"A molecular machine that synthesizes ATP."},{"term":"ΔG","meaning":"Change in Gibbs free energy for a process."},{"term":"GTP","meaning":"A guanine nucleotide that can provide energy similarly to ATP."}],"diagramGuide":["The opposing arrows distinguish ATPase-driven hydrolysis from ATP-synthase-driven ATP formation. In the ATP structure, the alpha phosphate is nearest ribose, beta is central, and gamma is terminal."]},{"page":145,"topic":"Biological Motors","slideInLecture":8,"title":"Principle 2: Conformational Change","explain":"Binding ATP, hydrolyzing it, and exchanging ADP for ATP can shift a protein between different three-dimensional states. Repeating this nucleotide-controlled cycle lets molecular motors convert chemical events into mechanical movement.","mustKnow":["ATP- and ADP-bound forms can have different conformations.","ATP hydrolysis changes the nucleotide state.","ADP-to-ATP exchange resets the cycle.","Repeated conformational changes can generate movement."],"terms":[{"term":"Conformation","meaning":"The three-dimensional shape of a protein."},{"term":"Nucleotide exchange","meaning":"Replacement of one bound nucleotide by another."},{"term":"State A/State B","meaning":"Simplified labels for two protein conformations."},{"term":"Mechanochemical cycle","meaning":"A repeating cycle coupling chemical changes to mechanical action."}],"diagramGuide":["Follow the nucleotide cycle: ATP-bound state A → hydrolysis → ADP/Pi-bound state B → nucleotide exchange → ATP-bound state A. The conformational switch, not the nucleotide alone, produces motion."]},{"page":146,"topic":"Biological Motors","slideInLecture":9,"title":"Active and Inactive Conformations","explain":"The slide asks how strongly the active ATP/GTP-bound conformation differs from the inactive ADP/GDP-bound conformation and shows an overlaid protein structure. The highlighted regions indicate that nucleotide state can alter selected parts of a protein rather than rebuilding the whole protein.","mustKnow":["ATP/GTP-bound states are labeled active.","ADP/GDP-bound states are labeled inactive.","Different nucleotide states can produce different protein conformations.","The structural comparison is the focus of the linked animation."],"terms":[{"term":"Active conformation","meaning":"A protein shape associated here with ATP or GTP binding."},{"term":"Inactive conformation","meaning":"A protein shape associated here with ADP or GDP binding."},{"term":"Structural overlay","meaning":"Superposition of structures to reveal conformational differences."}],"diagramGuide":["The overlaid protein structures show that the same protein can occupy different three-dimensional conformations depending on whether ATP/GTP or ADP/GDP is bound."]},{"page":147,"topic":"Biological Motors","slideInLecture":10,"title":"Categories of Biological Motors","explain":"The lecture divides biological motors into four categories: polymerization motors, cytoskeletal motors, rotary motors, and nucleic-acid motors.","mustKnow":["Polymerization motors are one category.","Cytoskeletal motors are one category.","Rotary motors are one category.","Nucleic-acid motors are one category."],"terms":[{"term":"Polymerization motor","meaning":"A system in which polymer growth or shrinkage produces force or movement."},{"term":"Cytoskeletal motor","meaning":"A motor protein that acts with cytoskeletal filaments."},{"term":"Rotary motor","meaning":"A molecular machine that generates rotation."},{"term":"Nucleic-acid motor","meaning":"A motor that moves along or acts on DNA or RNA."}],"diagramGuide":[]},{"page":148,"topic":"Biological Motors","slideInLecture":11,"title":"The Cytoskeleton","explain":"The cytoskeleton is a dynamic three-dimensional network throughout the cytoplasm. It supports cell shape and protection, motility, cytokinesis, intracellular transport, cell division, and organelle organization. Its three major filament systems are actin microfilaments, intermediate filaments, and tubulin microtubules.","mustKnow":["Microfilaments are made of actin.","Microtubules are made of tubulin.","Intermediate filaments are the third major system.","The cytoskeleton supports shape, movement, division, and transport."],"terms":[{"term":"Cytoskeleton","meaning":"A dynamic network of protein filaments inside cells."},{"term":"Microfilament","meaning":"A thin cytoskeletal filament built from actin."},{"term":"Microtubule","meaning":"A hollow cytoskeletal polymer built from tubulin."},{"term":"Cytokinesis","meaning":"Physical division of one cell into two daughter cells."}],"diagramGuide":["In the fluorescence image, differently colored filament networks occupy the same cell. Relate actin to microfilaments, tubulin to microtubules, and the blue ovals to nuclei."]},{"page":149,"topic":"Biological Motors","slideInLecture":12,"title":"Muscle Fibers and Striations","explain":"The slide introduces skeletal muscle structure by pairing a visible muscle with microscopic images of repeating striations. The regular banding reflects an ordered, repeating internal organization within muscle fibers.","mustKnow":["Muscle fibers show repeated striations.","Striations are visible as regular microscopic bands.","The pattern indicates ordered internal organization."],"terms":[{"term":"Muscle fiber","meaning":"An elongated muscle cell specialized for contraction."},{"term":"Striation","meaning":"A repeating light-and-dark banding pattern in striated muscle."},{"term":"Microscopy","meaning":"Use of magnification to observe structures too small for the unaided eye."}],"diagramGuide":["The sculpture provides a macroscopic analogy for muscle form; the microscopy panels show repeating light-dark bands, i.e. striations, along muscle fibers."]},{"page":150,"topic":"Biological Motors","slideInLecture":13,"title":"Muscle Movement Animation","explain":"This slide contains a linked video following the introduction to muscle fibers and striations. Its role is to provide an animated view of the muscle-movement topic introduced on the previous slide.","mustKnow":["The slide is a video resource.","It follows the muscle fiber and striation introduction.","The linked topic is muscle movement."],"terms":[{"term":"Animation","meaning":"A moving visual sequence used to demonstrate a process."},{"term":"Muscle movement","meaning":"Mechanical action produced by muscle contraction."}],"diagramGuide":["This page is a video still; use it only as a transition from whole-muscle striation to molecular actin-myosin motion."]},{"page":151,"topic":"Biological Motors","slideInLecture":14,"title":"Myosin Moving on Actin","explain":"The fluorescence image shows myosin-II motor regions in green associated with actin filaments in blue. It is visual evidence that motor proteins work on cytoskeletal tracks rather than moving freely through the cell.","mustKnow":["Actin forms the track used by myosin motors.","Myosin converts chemical energy into movement or force."],"terms":[{"term":"Myosin","meaning":"An ATP-powered motor protein that interacts with actin."},{"term":"Actin filament","meaning":"A cytoskeletal polymer that serves as a structural element and myosin track."}],"diagramGuide":["The arrowhead identifies a localized event on a fluorescent filament. The long filament is the track; punctate colored signals mark associated motor molecules or labeled components."]},{"page":152,"topic":"Biological Motors","slideInLecture":15,"title":"G-Actin and F-Actin","explain":"Actin exists as globular G-actin monomers and filamentous F-actin polymers. ATP or ADP can bind each actin subunit, and ATP affects how readily subunits join the dynamic filament.","mustKnow":["G-actin is the monomer; F-actin is the polymer.","Actin filaments form a right-handed double helix.","Actin filaments can grow and shrink."],"terms":[{"term":"G-actin","meaning":"The globular, soluble actin monomer."},{"term":"F-actin","meaning":"The filament made by polymerized actin monomers."},{"term":"Microfilament","meaning":"Another name for an actin filament."}],"diagramGuide":["G-actin is the globular monomer and F-actin is the polymer. The filament is a right-handed double helix of repeating actin subunits."]},{"page":153,"topic":"Biological Motors","slideInLecture":16,"title":"Helical Arrangement of Actin Subunits","explain":"The molecular model shows repeated actin subunits packed into a two-stranded helical filament. Repetition and directional packing give the filament structural polarity.","mustKnow":["F-actin is assembled from many repeating actin subunits.","The filament has a helical, polar organization."],"terms":[{"term":"Polarity","meaning":"Structural difference between the two ends of a filament."},{"term":"Subunit","meaning":"A repeating molecular building block in a polymer."}],"diagramGuide":["The molecular model shows two intertwined rows of actin subunits, explaining the double-helical appearance of F-actin."]},{"page":154,"topic":"Biological Motors","slideInLecture":17,"title":"Actin Polymerization: Nucleation and Elongation","explain":"Actin assembly begins with slow nucleation, when a few G-actin monomers form an unstable starter cluster. Elongation then adds monomers at both ends, but addition is faster at the plus or barbed end than at the minus or pointed end.","mustKnow":["Nucleation creates the initial actin seed.","Elongation occurs at both ends.","The plus end grows faster than the minus end."],"terms":[{"term":"Nucleation","meaning":"Formation of the small initial cluster that can seed a filament."},{"term":"Barbed end","meaning":"The faster-growing plus end of an actin filament."},{"term":"Pointed end","meaning":"The slower-growing minus end of an actin filament."}],"diagramGuide":["Read the hand-drawn sequence as nucleation before elongation: a small unstable oligomer forms first, then additional monomers extend the filament."]},{"page":155,"topic":"Biological Motors","slideInLecture":18,"title":"From One Actin Subunit to a Filament","explain":"The slide contrasts one actin subunit with a long filament containing many subunits. Polymerization changes the scale and function of actin without changing the identity of the repeating building block.","mustKnow":["A filament is a polymer of many actin subunits.","The monomer-to-polymer change is G-actin to F-actin."],"terms":[{"term":"Polymerization","meaning":"Joining many small subunits into a larger polymer."}],"diagramGuide":["The small blue object is one actin subunit; the enlarged multicolored structure below is the filament assembled from repeated copies."]},{"page":156,"topic":"Biological Motors","slideInLecture":19,"title":"ATP Hydrolysis in Actin","explain":"Actin binds ATP and has ATPase activity. Polymerization changes actin's conformation and promotes ATP hydrolysis; ATP-actin adds to filaments more readily than ADP-actin, while ADP-actin is more likely to dissociate.","mustKnow":["Actin can hydrolyze ATP after entering a filament.","ATP-actin is favored for addition.","ADP-actin dissociates more readily than ATP-actin."],"terms":[{"term":"ATPase","meaning":"An activity that hydrolyzes ATP to ADP and inorganic phosphate."},{"term":"Inorganic phosphate","meaning":"The phosphate released after ATP hydrolysis, written Pi."}],"diagramGuide":["The upper sketch shows nucleotide-bearing actin monomers; the lower sketch shows their incorporation into a polarized filament with distinct ends."]},{"page":157,"topic":"Biological Motors","slideInLecture":20,"title":"Steady State and Treadmilling","explain":"At steady state, total F-actin mass can remain constant even while subunits move through the filament. Addition at the plus end and loss at the minus end create treadmilling, a directional flux of actin subunits.","mustKnow":["Steady state does not mean the filament is inactive.","Treadmilling combines plus-end addition with minus-end loss.","Critical concentration separates net polymerization from net depolymerization."],"terms":[{"term":"Treadmilling","meaning":"Subunit addition at one end and loss at the other with little net mass change."},{"term":"Critical concentration","meaning":"The free actin concentration at which addition and loss balance."},{"term":"Steady state","meaning":"A state with no net change in total filament mass despite ongoing exchange."}],"diagramGuide":["The filament sketch marks different behavior at its two ends. Treadmilling means net addition at the plus/barbed end while subunits are lost from the minus/pointed end."]},{"page":158,"topic":"Biological Motors","slideInLecture":21,"title":"Sarcomere Organization","explain":"A sarcomere runs from one Z line to the next. Thin actin filaments extend inward from the Z lines, while thick myosin filaments are centered around the M line; their overlap produces the banded appearance of muscle.","mustKnow":["A sarcomere is bounded by two Z lines.","Actin is the thin filament; myosin is the thick filament.","The M line lies at the center of the sarcomere."],"terms":[{"term":"Sarcomere","meaning":"The repeating contractile unit of striated muscle."},{"term":"Z line","meaning":"The boundary where thin filaments are anchored."},{"term":"M line","meaning":"The central region associated with thick filaments."}],"diagramGuide":["A sarcomere runs from one Z line to the next. Thin actin filaments anchor at Z lines; thick myosin filaments center on the M line; the H zone contains thick filament without thin-filament overlap."]},{"page":159,"topic":"Biological Motors","slideInLecture":22,"title":"Myosin Structure","explain":"Myosin contains two heavy chains plus essential and regulatory light chains. Each heavy chain has a head that binds actin and ATP, a neck associated with light chains, and a coiled-coil tail that supports dimerization and cargo or filament interactions.","mustKnow":["The myosin head binds both actin and ATP.","The neck carries light chains.","The tail is a dimeric coiled-coil."],"terms":[{"term":"Motor domain","meaning":"The myosin head region that binds actin and hydrolyzes ATP."},{"term":"Light chain","meaning":"A smaller protein associated with the myosin neck."},{"term":"Coiled-coil","meaning":"A rope-like structure formed by intertwined alpha helices."}],"diagramGuide":["From left to right: globular heads, neck with essential and regulatory light chains, then the long coiled-coil tail. The bracket indicates an approximately 130-nm tail region."]},{"page":160,"topic":"Biological Motors","slideInLecture":23,"title":"Myosin Movement Video Resource","explain":"This slide points to an animation of myosin action. The exam-relevant idea is that repeated ATP-linked changes in the myosin head produce attachment, force generation, release, and resetting on actin.","mustKnow":["Myosin movement is cyclic rather than a single permanent pull.","ATP controls changes in actin-myosin binding and motor conformation."],"terms":[{"term":"Cross-bridge cycle","meaning":"The repeating sequence of myosin attachment, force generation, detachment, and reset."}],"diagramGuide":["This page is a myosin-animation still; use it as a transition to experiments that measure individual motor steps."]},{"page":161,"topic":"Biological Motors","slideInLecture":24,"title":"Fluorescent Tracking of Myosin and Actin","explain":"The microscopy frame labels myosin-II in green and actin in blue. Fluorescent tags let researchers distinguish two molecular components and follow where they are over time inside a sample.","mustKnow":["Different fluorescent colors can label different proteins.","The image links myosin distribution with the actin network."],"terms":[{"term":"Fluorescent tag","meaning":"A light-emitting label used to locate a molecule in an image."},{"term":"HaloTag","meaning":"A protein-tagging system that can be linked to fluorescent dyes."}],"diagramGuide":["The color key labels myosin and actin separately. Track the differently colored puncta along the filament network rather than treating color as structural evidence by itself."]},{"page":162,"topic":"Biological Motors","slideInLecture":25,"title":"Arthur Ashkin and Optical Tweezers","explain":"Arthur Ashkin showed that one tightly focused laser beam can trap a dielectric particle in three dimensions. The method uses light-generated forces to hold and manipulate microscopic objects.","mustKnow":["Arthur Ashkin is associated with optical tweezers.","A tightly focused laser can trap a dielectric particle in 3D."],"terms":[{"term":"Optical tweezers","meaning":"A focused-laser method for trapping and moving microscopic particles."},{"term":"Dielectric particle","meaning":"A nonconducting particle that can be polarized by an electric field."}],"diagramGuide":["The photograph identifies Arthur Ashkin; the relevant apparatus relationship is one tightly focused laser creating a three-dimensional trap for a dielectric sphere."]},{"page":163,"topic":"Biological Motors","slideInLecture":26,"title":"Gaussian Beam and Scattering Force","explain":"The laser is brightest at the center and weaker toward the edges, giving a Gaussian intensity profile. A bead refracts and scatters the light, and the scattering force increases with optical intensity.","mustKnow":["A Gaussian beam has maximum intensity at its center.","The bead changes the direction of incident light.","Scattering force is proportional to optical intensity."],"terms":[{"term":"Gaussian intensity profile","meaning":"A beam profile that is brightest
