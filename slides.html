 delta H.","After binding reaches equilibrium, the signal returns to baseline.","The next injection is made after baseline recovery."],"terms":[{"term":"Delta H","meaning":"Enthalpy change of the binding reaction."},{"term":"Baseline","meaning":"The stable instrument signal before or between injection peaks."},{"term":"Equilibrium","meaning":"A state with no net change in binding populations."}],"diagramGuide":["At the first injections, protein is in excess and many sites are free, so binding heat is large.","For the exothermic example, delta H is negative and feedback power decreases.","Each signal must return to baseline before the next injection for clean peak integration."]},{"page":388,"topic":"Techniques in Biochemistry and Biophysics","slideInLecture":6,"title":"ITC Saturation","explain":"As repeated ligand injections fill more protein binding sites, less newly injected ligand can bind and each heat peak becomes smaller. Once the protein is saturated, the remaining signal is mainly the heat of dilution rather than binding.","mustKnow":["Peak size decreases as protein binding sites become occupied.","Complete occupancy is called saturation.","After saturation, the observed signal is mainly heat of dilution."],"terms":[{"term":"Saturation","meaning":"The state in which essentially all available binding sites are occupied."},{"term":"Heat of dilution","meaning":"Heat produced or absorbed when a solution is diluted, independent of specific binding."}],"diagramGuide":["The peak train shrinks from left to right as binding sites become occupied.","At the end, small nearly constant peaks represent mainly heat of dilution.","Saturation changes peak area, not merely the time between injections."]},{"page":389,"topic":"Techniques in Biochemistry and Biophysics","slideInLecture":7,"title":"Reading ITC Results","explain":"The raw ITC trace contains one heat peak per ligand injection. Integrating each peak gives the heat per injection, which is plotted against the ligand-to-protein molar ratio to form a binding isotherm. Its plateau, inflection point, and slope provide enthalpy, stoichiometry, and binding affinity.","mustKnow":["Each raw peak corresponds to one ligand injection.","Peak areas are integrated to obtain heat values.","Integrated heat is plotted against ligand-to-protein molar ratio.","ITC can provide enthalpy, stoichiometry, and affinity."],"terms":[{"term":"Binding isotherm","meaning":"A binding-response curve measured at constant temperature."},{"term":"Stoichiometry","meaning":"The number of ligand molecules bound per protein molecule or binding unit."},{"term":"Ka","meaning":"Association constant; larger values indicate stronger association."},{"term":"Kd","meaning":"Dissociation constant; Ka equals 1 divided by Kd in the relation shown."}],"diagramGuide":["Left: raw power-versus-time peaks, one per injection.","Right: integrated peak areas plotted against ligand:protein molar ratio form a binding isotherm.","The isotherm yields delta H, stoichiometry n, and affinity; Ka equals 1/Kd."]},{"page":390,"topic":"Techniques in Biochemistry and Biophysics","slideInLecture":8,"title":"ITC c-Value and Dilution Control","explain":"A useful ITC binding curve must have enough sigmoid shape to estimate binding parameters accurately. The c-value, c = n[P]Ka, controls this shape through stoichiometry, protein concentration, and association strength. Heat from ligand dilution must be measured separately and subtracted.","mustKnow":["A sigmoidal isotherm is needed for accurate binding-affinity analysis.","The c-value is given as n times protein concentration times Ka.","Ligand dilution itself can release or absorb heat.","A ligand-into-buffer control is subtracted from the binding experiment."],"terms":[{"term":"c-value","meaning":"The ITC parameter n[P]Ka that influences binding-isotherm sigmoidicity."},{"term":"Sigmoidicity","meaning":"The degree to which a curve has an S shape."},{"term":"Dilution control","meaning":"Ligand titrated into buffer to measure nonbinding heat effects."}],"diagramGuide":["The family of curves shows that very low or very high c values give poorly informative shapes; an intermediate sigmoidal curve is preferred.","c combines stoichiometry, protein concentration, and association constant: c = n[P]Ka.","Ligand-into-buffer controls measure dilution heat for subtraction."]},{"page":391,"topic":"Techniques in Biochemistry and Biophysics","slideInLecture":9,"title":"MDM2 and MDMX Control p53","explain":"The diagram shows MDM2 and MDMX as negative regulators of the tumor suppressor p53. MDM2 binds p53, promotes its ubiquitination, nuclear export, and proteasomal degradation, reducing p53-driven tumor-suppressor gene activity.","mustKnow":["MDM2 and MDMX negatively regulate p53.","MDM2 can promote p53 ubiquitination.","Ubiquitinated p53 can be degraded by the proteasome.","Reducing p53 lowers expression of p53 target genes."],"terms":[{"term":"p53","meaning":"A tumor-suppressor transcription factor activated by cellular stress and DNA damage."},{"term":"MDM2","meaning":"A negative regulator that binds p53 and promotes its ubiquitination and degradation."},{"term":"Ubiquitination","meaning":"Attachment of ubiquitin that can mark a protein for degradation."},{"term":"Proteasome","meaning":"A cellular complex that degrades selected proteins."}],"diagramGuide":["Nuclear p53 activates tumor-suppressor target genes.","MDMX mainly blocks p53 transcriptional activity; MDM2 blocks activity and promotes export, ubiquitination, and degradation.","The top route ends at the proteasome after ubiquitin addition."]},{"page":392,"topic":"Techniques in Biochemistry and Biophysics","slideInLecture":10,"title":"Bcl-2 Family Regulation of Apoptosis","explain":"The Bcl-2 protein family controls the mitochondrial decision to undergo apoptosis. Pro-apoptotic and anti-apoptotic family members interact at the mitochondrial membrane; their balance determines whether mitochondrial permeabilization and downstream caspase activation occur.","mustKnow":["Bcl-2 family proteins regulate the mitochondrial apoptosis pathway.","The family contains both pro-apoptotic and anti-apoptotic members.","Their interactions control mitochondrial membrane permeabilization.","Mitochondrial permeabilization promotes downstream caspase activation."],"terms":[{"term":"Bcl-2 family","meaning":"A group of proteins that promote or block mitochondrial apoptosis."},{"term":"Apoptosis","meaning":"A regulated program of cell death."},{"term":"Mitochondrial permeabilization","meaning":"Formation of openings that allow apoptotic factors to leave mitochondria."},{"term":"Caspase","meaning":"A protease that executes or regulates apoptosis."}],"diagramGuide":["Left pathway: apoptotic stimulus -> pro-apoptotic proteins -> BAX/BAK oligomerization -> cytochrome c release -> apoptosome -> caspases -> apoptosis.","Right pathway: BCL-2 overexpression restrains BAX/BAK, blocks cytochrome c release, and favors survival.","The key decision point is mitochondrial outer-membrane permeabilization."]},{"page":393,"topic":"Techniques in Biochemistry and Biophysics","slideInLecture":11,"title":"Förster Resonance Energy Transfer","explain":"FRET transfers excitation energy from a donor fluorophore to a nearby acceptor without photon emission between them. Efficient transfer requires overlap between donor emission and acceptor absorption spectra and a very short distance. Efficiency follows E = 1/[1 + (r/R0)^6], so it falls steeply as distance increases.","mustKnow":["FRET requires a donor and an acceptor fluorophore.","Donor emission must overlap acceptor absorption.","FRET is strongly distance dependent and usually occurs within about 10 nm.","R0 is the distance at which transfer efficiency is 50%."],"terms":[{"term":"FRET","meaning":"Distance-dependent nonradiative energy transfer from a donor to an acceptor fluorophore."},{"term":"Donor","meaning":"The fluorophore that supplies excitation energy."},{"term":"Acceptor","meaning":"The nearby fluorophore that receives energy from the donor."},{"term":"Förster radius","meaning":"R0, the donor-acceptor distance giving 50% transfer efficiency."}],"diagramGuide":["The spectral plot requires donor emission to overlap acceptor absorption; the yellow overlap region visualizes this condition.","The energy-level scheme depicts nonradiative resonance transfer from excited donor to acceptor.","The equation shows sixth-power distance dependence; at r = R0, efficiency is 50%."]},{"page":394,"topic":"Techniques in Biochemistry and Biophysics","slideInLecture":12,"title":"Cameleon FRET Sensor for Calcium","explain":"Cameleon is a genetically encoded calcium sensor containing calmodulin and the M13 calmodulin-binding segment between CFP and YFP. Without Ca2+, the fluorophores remain arranged for weak FRET and cyan emission. Ca2+ makes calmodulin bind M13, bringing CFP and YFP into a FRET-active arrangement and producing yellow emission.","mustKnow":["Cameleon monitors Ca2+ concentration in living cells.","It contains calmodulin, M13, CFP, and YFP.","Without Ca2+, the signal is mainly cyan.","With Ca2+, calmodulin binds M13, FRET increases, and the signal becomes yellow."],"terms":[{"term":"Cameleon","meaning":"A FRET-based genetically encoded sensor for cellular Ca2+."},{"term":"Calmodulin","meaning":"A Ca2+-binding protein that changes conformation when calcium binds."},{"term":"M13","meaning":"A calmodulin-binding peptide module used in the sensor."},{"term":"CFP/YFP","meaning":"Cyan and yellow fluorescent proteins serving as the FRET donor and acceptor."}],"diagramGuide":["Top cartoon: excitation of CFP gives no FRET when proteins A and B are apart, but YFP emission when interaction brings them together.","Bottom: Cameleon places CaM and M13 between CFP and YFP.","Without Ca2+ the output is cyan; Ca2+-dependent CaM-M13 binding increases FRET and yellow emission."]}],"overviews":[{"title":"Module 1: Bioenergetics and ATP","source":"Bioenergetics.pptx, slides 1-40","mission":"Build a working map of metabolism, free energy, enzyme kinetics, and ATP so you can predict reaction direction and recognize how cells couple energy.","primer":["Metabolism is the complete set of enzyme-catalyzed chemical reactions in a cell; catabolism breaks molecules down and releases usable energy, while anabolism uses energy to build cellular molecules.","Catabolic pathways usually converge from many nutrients toward fewer common products, while anabolic pathways usually diverge from a few precursors toward many products; separate enzymes help prevent wasteful cycling.","For an enzyme following Michaelis-Menten behavior, Vmax is the rate reached at saturating substrate, and Km is the substrate concentration at which the rate equals half of Vmax.","Free-energy change combines bonding stability and disorder: ΔG = ΔH - TΔS. A negative ΔG favors the forward direction, a positive ΔG favors the reverse direction, and ΔG = 0 means equilibrium.","The biochemical standard state uses pH 7 and treats water as 55.5 M. The transformed standard free-energy change is written ΔG°′ and relates to equilibrium by ΔG°′ = -RT ln K′eq.","Actual cellular reaction direction depends on both the standard value and concentrations: ΔG = ΔG°′ + RT ln([products]/[reactants]). ΔG values add when reactions are coupled through shared intermediates.","ATP hydrolysis has ΔG°′ about -30.5 kJ/mol, but its actual ΔG in a cell differs because ATP, ADP, phosphate, and Mg2+ concentrations are not at standard conditions.","ATP often powers work by transferring a phosphoryl or adenylyl group and changing a substrate or protein, rather than by releasing energy through isolated hydrolysis; examples include molecular motion, DNA-associated enzymes, and firefly light production."],"traps":["Do not treat ΔG°′ as the same as actual ΔG; only actual ΔG includes the current concentration ratio.","A favorable negative ΔG predicts direction, not speed; an enzyme changes rate but does not change the reaction's ΔG.","Km is a substrate concentration at half Vmax, not the maximum rate itself.","ATP does not merely release free energy as heat; useful coupling commonly involves group transfer and MgATP2+."],"checkpoint":["Without notes, write the three ΔG cases and the direction each predicts.","Explain in two sentences how a +ΔG reaction can proceed when coupled to ATP use.","Sketch a Michaelis-Menten curve and label Vmax, half Vmax, and Km."],"topics":["Bioenergetics"]},{"title":"Module 2: Gene Expression and the Lac Operon","source":"Gene Expression and Regulation ppt.pptx, slides 1-35","mission":"Follow information from DNA to protein and use lactose and glucose levels to predict lac-operon transcription.","primer":["The central dogma describes residue-by-residue information flow from DNA to RNA to protein. Replication copies DNA, transcription makes RNA from DNA, and translation uses mRNA to make protein.","DNA replication occurs during S phase and is semiconservative, so each daughter DNA molecule contains one parental strand and one newly synthesized strand.","RNA polymerase binds a promoter, opens a transcription bubble, escapes the promoter, elongates the RNA, and terminates transcription. It reads the template or antisense strand.","The coding or sense DNA strand matches the mRNA sequence except that DNA has thymine where RNA has uracil. Eukaryotic pre-mRNA contains exons and introns, and splicing removes introns to produce mature mRNA.","Translation occurs on ribosomes in the cytoplasm. The ribosome reads mRNA 5′ to 3′, tRNAs deliver amino acids, and the protein grows from its N terminus toward its C terminus.","Prokaryotes regulate gene expression mainly at transcription initiation, and transcription can occur alongside translation because there is no nucleus. Eukaryotes can regulate transcription, RNA processing, RNA transport, and translation.","An operon is a prokaryotic cluster of genes transcribed from one promoter as a single mRNA. In the lac operon, lacZ encodes β-galactosidase, lacY encodes lactose permease, and lacA encodes transacetylase.","Strong lac-operon transcription requires lactose present and glucose absent: allolactose removes the repressor from the operator, while low glucose raises cAMP, activates CAP, and helps RNA polymerase bind."],"traps":["Replication copies DNA; transcription makes RNA; translation makes protein. Similar wording in options often hides a process swap.","The template strand is the antisense strand; the coding strand resembles mRNA except for T versus U.","Lactose removes negative control, but strong expression also needs low glucose to activate CAP through cAMP.","CAP is a positive regulator and the lac repressor is a negative regulator; both act at different DNA sites."],"checkpoint":["Close the slides and draw DNA to RNA to protein, adding location, enzyme or machine, and direction.","Make a four-row lactose/glucose table and predict none, low, or strong transcription.","Recite lacZ, lacY, and lacA with one function each."],"topics":["Gene Expression and Regulation"]},{"title":"Module 3: Genetic Engineering Toolkit","source":"genetic engg  applications 1.pptx, slides 1-19","mission":"Trace a gene from isolation to a verified recombinant clone and identify the tool responsible for each step.","primer":["Genetic engineering deliberately modifies genetic material by isolating, changing, and transferring DNA. A gene of interest can be placed in a vector, introduced into a host, replicated, and sometimes expressed as a product.","The core cloning workflow is gene isolation or PCR, cutting insert and vector with compatible restriction enzymes, ligation, transfer into a host, selection and screening, then expression or other downstream use.","Restriction endonucleases recognize specific short DNA sequences, often palindromic, and cut DNA to create sticky or blunt ends. Using the same enzyme on vector and insert can create compatible ends.","DNA ligase seals the sugar-phosphate backbone by forming a phosphodiester bond between a 3′-OH and a 5′-phosphate. T4 DNA ligase uses ATP, and sticky ends usually ligate more efficiently than blunt ends.","PCR amplifies a chosen DNA region through repeated denaturation, primer annealing, and extension. Ideal amplification after n cycles is approximately 2^n copies.","Agarose gel electrophoresis separates negatively charged DNA by size. DNA moves toward the positive electrode, and smaller fragments travel faster and farther through the gel.","Sanger sequencing mixes normal dNTPs with chain-terminating ddNTPs. A ddNTP lacks a 3′-OH, so its incorporation stops synthesis and produces fragments that reveal the sequence.","CRISPR-Cas9 uses a guide RNA to direct Cas9 to a target sequence and make a double-strand break. A useful vector typically contains an origin of replication, selectable marker, and cloning site, with expression elements added when protein production is required."],"traps":["Restriction enzymes cut DNA; DNA ligase joins DNA. Questions often swap these two roles.","Selection finds cells carrying the vector, while screening verifies which selected clones contain the desired insert.","DNA moves toward the positive electrode because its phosphate backbone is negative; smaller fragments migrate farther.","PCR amplifies DNA, Sanger sequencing reads DNA, and CRISPR-Cas9 edits a targeted DNA site."],"checkpoint":["On blank paper, draw the cloning workflow and write one tool beside every step.","Explain sticky ends versus blunt ends and why one usually ligates more efficiently.","Compare PCR, gel electrophoresis, Sanger sequencing, and CRISPR-Cas9 in one sentence each."],"topics":["Genetic Engineering Applications 1"]},{"title":"Module 4: Genetic Engineering II - From DNA Insert to Real-World Application","source":"genetic engg and applicatins 2.pptx, slides 1-7; genetic engg applications 3.pptx, slides 1-36","mission":"Act as the engineer of a recombinant-DNA pipeline. By the end, you must be able to reconstruct the route from gene isolation to purified protein, choose the correct tool at each stage, and classify major medical, agricultural, industrial, and environmental applications without looking at the slides.","primer":["Draw eight empty boxes. Fill them from memory as you work: isolate gene, insert into vector, transform host, select, screen, confirm, express, purify. Keep correcting this pipeline until you can reproduce it in under 45 seconds.","Build a vector checklist: origin of replication for replication, selectable marker for survival-based selection, and multiple cloning site for DNA insertion. Add promoter and translation-control elements when the goal changes from cloning DNA to expressing protein.","Make one forced choice: genomic DNA or cDNA for expressing a human gene in E. coli. Choose cDNA because it comes from processed mRNA and lacks introns that bacteria cannot remove.","Keep four verbs separate. Transformation puts DNA into competent cells. Selection retains cells carrying a selectable marker. Screening identifies likely recombinant colonies. Confirmation tests the insert directly by colony PCR, restriction digestion, or sequencing.","Rehearse protein production as a physical process: induce expression, harvest cells, lyse them, bind a His-tagged protein to Ni-NTA, wash with low imidazole, elute with high imidazole, then inspect the result by SDS-PAGE.","Sort every application into a bucket before memorizing details: medicine, agriculture, industry, or environment. Then attach one anchor example to each bucket.","Use case anchors for MCQs: recombinant insulin is expressed and purified; hepatitis B vaccine uses recombinant HBsAg made in yeast; Bt crops express bacterial Cry toxin; Golden Rice accumulates beta-carotene in the endosperm; gene therapy can add, replace, silence, or edit genetic material."],"traps":["Selection is not screening: survival on antibiotic proves selectable-marker function, not the presence of the desired insert.","A cloning vector is not automatically an expression vector: protein production requires suitable transcriptional and translational control elements.","Low imidazole is used during washing, while high imidazole elutes the His-tagged protein.","Bt and Golden Rice solve different problems: Bt supplies insect resistance through Cry toxin, while Golden Rice supplies provitamin A through beta-carotene."],"checkpoint":["Close the slides and draw the complete recombinant-protein workflow in under 60 seconds. Your chain must include transformation, selection, screening, confirmation, induction, lysis, purification, and SDS-PAGE.","Diagnose this result aloud: colonies grow on ampicillin, half are white, and one white colony gives the wrong PCR band. State what each observation does and does not prove.","On blank paper, make four columns labelled medicine, agriculture, industry, and environment. Place at least three slide examples into each column, then circle the five anchors: insulin, hepatitis B vaccine, Bt crop, Golden Rice, and bioremediation."],"topics":["Genetic Engineering Applications 2","Genetic Engineering Applications 3"]},{"title":"Module 5: Biological Motors - Chemical Energy, Motion, and Measurement","source":"Biological Motors.pdf, pages 1-39","mission":"Build a mechanical model of a molecular motor. You must explain how ATP or GTP and protein conformational changes generate directed work, distinguish molecular motors from macroscopic motors, connect actin and myosin structure to movement, and interpret what an optical-tweezer experiment measures.","primer":["Start with the energy statement: a biological motor converts chemical bond energy into mechanical work or another directed function. Say this once before learning any names.","Run the two-state model with your hands. Make one hand shape for the ATP-bound state and another for the ADP-bound state. Alternate them while saying bind, hydrolyze, release, exchange.","Contrast scales: macroscopic motors use rigid parts, while molecular motors work at nanometer scale in water, at low Reynolds number, amid Brownian motion, and through noncovalent interactions and protein dynamics.","Sort the motor families named in the slides: polymerization motors, cytoskeletal motors, rotary motors, and nucleic-acid motors. Use actin-myosin as the cytoskeletal anchor and bacterial flagella as the rotary anchor.","Construct actin from units: G-actin is the globular monomer; F-actin is the filamentous polymer. ATP influences polymerization, while actin-binding proteins and calcium ions regulate assembly and disassembly.","Label a myosin sketch from memory: head, neck, and tail. Put the actin-binding and ATP-binding sites on the head, and mark the tail as a dimeric coiled-coil.","Turn the optical trap into a force diagram. Scattering force points with the incident beam. Gradient force pulls the bead toward the bright center of the Gaussian beam. A motor that moves the bead away from the center experiences a restoring force."],"traps":["ATP is not merely fuel stored beside the motor. Binding, hydrolysis, product release, and nucleotide exchange change the motor's conformation.","G-actin and F-actin are two assembly states of actin, not two unrelated proteins.","Scattering force follows the beam direction; gradient force is the centering or restoring force.","The optical-tweezer readout is bead displacement, from which motor displacement, force, and attachment behavior can be inferred."],"checkpoint":["Without notes, explain a molecular motor to an engineering student using the sequence energy source, conformational change, directed motion, and load. Keep the explanation under 45 seconds.","Sketch G-actin polymerizing into F-actin beside a myosin molecule. Label the myosin head, neck, tail, actin-binding site, and ATP-binding site.","Draw the dual-beam optical-trap setup and add force arrows. Your diagram must show two trapped beads, the tensed actin filament, sparse myosin on a pedestal bead, gradient restoring force, and the measured displacement."],"topics":["Biological Motors"]},{"title":"Module 6: Cellular Signaling - From Message to Response and Shutoff","source":"Cellular Sigaling.pdf, pages 1-22","mission":"Operate a cell-signaling control system. You must classify a signal by range, choose the correct receptor location, run the GPCR cycle in order, explain amplification through cAMP, and identify the mechanisms that terminate the signal.","primer":["Treat signaling as a control loop: sensor, information processing, and response. Add cascade, amplification, integration, feedback, and specificity around the processing stage.","Classify by distance and contact. Autocrine returns to the same cell, paracrine acts locally, juxtacrine requires direct surface contact, and endocrine travels through blood to distant targets.","Use the membrane test: lipid-soluble steroid hormones can cross the plasma membrane and bind intracellular receptors. Signals that cannot cross use cell-surface receptors and intracellular relay pathways.","Memorize the three surface-receptor classes named in the slides: G protein-coupled receptors, receptor tyrosine kinases, and ion channels.","Run the GPCR cycle with seven cards: ligand binds receptor, GDP leaves, GTP binds G alpha, G alpha activates an effector, adenylyl cyclase makes cAMP, GTP hydrolysis switches G alpha off, and the trimer reforms.","Explain amplification numerically without inventing numbers: one ligand-bound receptor can activate multiple downstream molecules, and diffusible cAMP can reach multiple intracellular targets.","Attach the brakes after the accelerator: G alpha hydrolyzes GTP, GRK phosphorylates the active receptor, and arrestin binds the phosphorylated receptor so it cannot keep activating G proteins."],"traps":["Signaling types are classified by route and distance, not by the chemical identity of the messenger.","Endocrine means travel through the bloodstream to distant targets; paracrine means short-range local action.","The GPCR is the seven-transmembrane receptor, while the G protein is the separate trimeric nucleotide-binding switch.","cAMP amplifies the response, but GTP hydrolysis plus GRK and arrestin provide shutoff. Do not confuse activation with attenuation."],"checkpoint":["For each scenario, answer in under three seconds: self-stimulating cancer cell, PDGF at a wound, cadherin contact between neighbors, and insulin carried in blood. The sequence should be autocrine, paracrine, juxtacrine, endocrine.","Close the slides and arrange these from first to last: cAMP production, ligand binding, GTP hydrolysis, GDP-GTP exchange, effector activation, trimer re-formation. Then insert GRK phosphorylation and arrestin binding as the receptor-level shutoff branch.","Teach the whole pathway aloud in 60 seconds using only these words as prompts: seven helices, trimeric G protein, GDP, GTP, adenylyl cyclase, cAMP, amplification, GTPase, GRK, arrestin."],"topics":["Cellular Signaling"]},{"title":"Module 7 - Decide the Cell's Fate: Apoptosis, the Cell Cycle, and Mitosis","source":"cell death and cell division.pdf, slides 1-30","mission":"Work with blank paper and the slides closed unless a step tells you to look. First, draw two columns labeled APOPTOSIS and MITOSIS. In 90 seconds, write everything you already associate with each word. Open slides 2-14 and build an apoptosis flowchart from trigger to removal; close the slides and redraw it from memory. Open slides 16-29 and make a cell-cycle clock plus a four-frame PMAT comic. Finish by answering the recall and MCQs without looking. Reopen the slides only to repair answers you missed, and write each repair as one short cause -> event -> result chain.","primer":["Act it out: curl inward to represent apoptotic shrinkage, make finger 'blebs,' split an imaginary nucleus into fragments, and mime a macrophage engulfing the apoptotic bodies. Say the four events aloud in order.","Build the extrinsic chain from cards or scraps: TNF -> TNFR1 -> TRADD/FADD + procaspase-8 -> caspase-8 -> executioner caspases -> apoptosis. Shuffle it, then restore the order.","Build the intrinsic chain beside it: stress -> BAX/BAK pore in mitochondrial outer membrane -> cytochrome c release -> Apaf-1 + procaspase-9 -> caspase-9 -> executioner caspases.","Sort the BCL-2 family aloud: BCL-2/BCL-XL/MCL-1/BCL-w/A1 oppose apoptosis; BAX/BAK/BOK promote it; BID/BIM/NOXA/BAD are BH3-only inducers.","Point to an imaginary plasma membrane: phosphatidylserine normally faces inward, but flips outward during apoptosis. Say, 'Annexin V detects the outward PS eat-me signal.'","Draw the cycle G1 -> S -> G2 -> M, with G0 branching away. Add one verb per phase: grow, copy, prepare, divide; label interphase as about 90% of the cycle.","Make PMAT physical: condense and dismantle the nuclear boundary; line chromosomes at the equator; pull sister chromatids apart; rebuild nuclei and pinch the cell. Name each stage while moving."],"traps":["Do not swap the initiators: extrinsic uses caspase-8; intrinsic uses caspase-9.","Do not call BCL-2 pro-apoptotic: BCL-2 opposes apoptosis, whereas BAX and BAK promote mitochondrial permeabilization.","DNA replication occurs in S phase, not during mitosis; mitosis distributes the already replicated chromatids.","Metaphase means alignment; anaphase means separation. If a stem says 'equator,' think metaphase."],"checkpoint":["Close everything and draw both apoptosis pathways in under 90 seconds. You pass only if the receptors/adaptors or mitochondria components and the correct initiator caspase appear.","From a blank circle, recreate G1-S-G2-M-G0 and PMAT in under two minutes. Then explain what happens to DNA at each transition.","Answer the eight MCQs twice: first normally, then justify why every wrong option is wrong. Continue only after scoring at least 7/8 without guessing."],"topics":["Cell Death and Cell Division"]},{"title":"Module 8 - Control Cell Identity: Potency, Differentiation, and Reprogramming","source":"Stem cells and differentiation.pdf, slides 1-30","mission":"Start by drawing a potency staircase from totipotent to unipotent and place one example from the slides at each step. Then make a two-column comparison of determination versus differentiation. Use slides 11-16 to sketch blastulation -> inner cell mass -> gastrulation -> three germ layers, adding at least three tissue derivatives per layer. Finally, become the experimentalist: for Till-McCulloch, Gurdon, and Yamanaka, state the input, intervention, observation, and conclusion. Close the slides and teach the whole story in five minutes to an imaginary engineering class.","primer":["Say the core distinction aloud: fate is what a cell normally becomes; potency is the range of cell types it can become.","Draw a narrowing funnel labeled totipotent -> pluripotent -> multipotent -> oligopotent -> unipotent. As the funnel narrows, say, 'developmental potential decreases as fate becomes restricted.'","Separate two moments: determination is commitment before visible specialization; differentiation is execution of the specialized morphology and physiology.","Explain cell specialization using one mechanism only: different cells express different subsets of genes, so they contain different subsets of proteins.","Draw a stem cell division with two outputs: one arrow loops back to 'self-renewal'; the other moves toward a specialized cell. Add quiescence as a common adult stem-cell state.","Make a germ-layer body map: endoderm -> digestive tract/liver/pancreas; mesoderm -> kidney/cartilage/bone/spleen/circulatory and lymphatic systems; ectoderm -> nail/hair/dermis/brain/spinal cord/retina.","Turn the reprogramming experiments into a proof ladder: differentiated nucleus can support development (Gurdon/Dolly); defined factors can return differentiated cells to pluripotency (Yamanaka); directed culture can then build organized tissue-like structures such as an optic cup."],"traps":["Fate and potency are not synonyms: fate is the normal destination; potency is the available range.","Determination comes before visible differentiation. A committed cell can still resemble its neighbors.","Self-renewal makes more stem cells; differentiation makes specialized descendants. Do not swap the arrows.","Do not mix the named gene sets: Oct3/4-Sox2-c-Myc-Klf4 are reprogramming factors; Rx/Pax6/Chx10 and related markers belong to the optic-cup example."],"checkpoint":["On blank paper, reconstruct the potency funnel and define all five levels. Give a slide example where one is provided.","Draw the blastula-to-gastrula sequence and label all three germ layers with three derivatives each. Complete it in under three minutes.","For Till-McCulloch, Gurdon, and Yamanaka, speak a 20-second input -> intervention -> result -> conclusion summary. Then score at least 7/8 on the MCQs."],"topics":["Stem Cells and Differentiation"]},{"title":"Module 9 - Defend the System: Barriers, Innate Cells, and the Innate-Adaptive Handoff","source":"Host pathogen interaction.pdf, slides 1-30 (first half: immune-system overview and innate immunity)","mission":"Treat the body like a defended engineering system. Draw three layers: boundary defenses, rapid internal innate defenses, and slower specific adaptive defenses. Populate each layer from the slides. Next, follow one bacterium from attempted entry to removal: barrier breach -> chemotaxis -> neutrophil arrival -> phagocytosis -> granule-mediated killing -> inflammatory/adaptive signaling. Then follow one virus-infected host cell to NK-cell killing. End by making a comparison table from memory and completing the recall and MCQs without reopening the deck.","primer":["Build the top-level contrast from memory: innate is rapid, broad/nonspecific, and lacks memory; adaptive has a lag, is antigen-specific, and develops memory. Say aloud that the two systems interact.","Sort external innate defenses into three bins: mechanical (skin, mucociliary escalator, flushing), chemical (antimicrobial peptides, stomach HCl, lysozyme), and biological (normal flora competing for nutrients and space).","Sketch the immune supply network: bone marrow generates blood cells; blood and lymph transport immune cells; liver makes complement proteins; lymphoid organs and tissue-resident immune cells support responses.","Turn the typical response into a routing diagram: external barriers first; if breached, phagocytes, antimicrobial proteins, inflammation, NK cells, and complement act; adaptive humoral and cell-mediated responses follow.","Act out neutrophil recruitment: point to an infection, trace a chemical gradient with your finger, move toward it for chemotaxis, engulf the microbe, and 'open' granules containing digestive enzymes and antimicrobial proteins.","Contrast the phagocytes: neutrophils are abundant rapid responders normally in blood; monocytes circulate and become tissue macrophages; macrophages phagocytose in tissues and present antigen.","Model NK-cell selection as a missing-signal detector: a normal cell displays expected surface proteins; an infected or cancer cell may lose some; the NK cell releases perforins and proteases to kill the host cell and its intracellular microbes."],"traps":["Innate does not mean only barriers: phagocytes, complement, inflammation, and NK cells are also innate.","Neutrophils and macrophages both phagocytose, but neutrophils are abundant rapid blood responders; macrophages are tissue cells derived from monocytes and can present antigen.","NK cells are lymphocyte-like but are not B or T lymphocytes; in this deck they belong to innate immunity.","Humoral adaptive response means antibodies; cell-mediated adaptive response means cytotoxic lymphocytes. Do not assign antibodies to neutrophils or NK cells."],"checkpoint":["Draw the three-layer defense architecture and correctly place at least 12 slide examples in three minutes: barriers, internal innate defenses, and adaptive defenses.","Narrate a bacterial invasion and a virus-infected-cell response without notes. Your bacterial story must include chemotaxis, phagocytosis, and granules; your viral story must include missing surface signals, perforins, and proteases.","Complete the eight MCQs, then cover the answers and convert every option into a true statement. Continue only after scoring at least 7/8."],"topics":["Host Pathogen Interaction"]},{"title":"Module 10 - Host-Pathogen Interaction: How Bacteria Enter, Evade, Damage, and Exit","source":"Host pathogen interaction.pdf, pp. 30-59","mission":"Build a one-page 'pathogen attack pipeline' from memory. Draw five boxes: entry/adherence -> colonization/biofilm -> immune evasion -> tissue damage/toxins -> exit. As you study, place every named factor from the primer into one box. Then close the slides and explain aloud how any three factors increase virulence. Finish by answering the recall set and MCQs without looking back.","primer":["Virulence is the capacity of a pathogen to harm the host. The slide sequence frames disease as entry, adherence, penetration or evasion of defenses, host-cell damage, and exit.","Adherence is often essential for colonization. It requires a microbial ligand or adhesin and a receptor on the host cell; it can determine host specificity and is a potential drug target.","Group A Streptococcus M protein helps attachment and invasion through fibronectin binding. It can also recruit host proteins to form a cloak that hides bacterial epitopes and changes antibody access.","Capsules promote attachment and immune evasion. They can mask PAMP recognition by Toll-like receptors, inhibit phagocytosis, and help bacteria resist lysosomal digestion after uptake.","Biofilms are organized microbial communities. Quorum sensing lets bacteria detect population density and alter gene expression, helping coordinate biofilm behavior.","Tissue invasion can be aided by enzymes: hyaluronidase and collagenase digest connective tissue; coagulase produces a protective clot-like barrier; kinases such as streptokinase dissolve clots; IgA protease attacks a mucosal antibody.","Other invasion and survival tools include invasins that rearrange host actin, mycolic acid that resists lysosomal digestion, and mucus-barrier breach that gives microbes access to host cells.","Exotoxins are secreted proteins with specific targets: diphtheria toxin ADP-ribosylates eEF-2 and stops translation; cholera toxin locks Gs-alpha active, raises cAMP, and drives ion and water loss. Endotoxin is heat-stable lipid A of Gram-negative LPS and promotes cytokine release, inflammation, and fever."],"traps":["Do not swap coagulase and kinase: coagulase forms a protective clot; streptokinase dissolves clots.","Do not equate capsule only with attachment. In these slides it also masks recognition, inhibits phagocytosis, and can resist lysosomal digestion.","Do not swap the toxin mechanisms: diphtheria toxin blocks translation through eEF-2; cholera toxin raises cAMP through Gs-alpha.","Bacterial death does not guarantee endotoxin removal. Lipid A is heat stable and may be released during lysis or antibiotic treatment."],"checkpoint":["On blank paper, rebuild the pathogenesis pipeline and correctly place M protein, capsule, biofilm, coagulase, collagenase, invasins, exotoxin, and endotoxin. Pass condition: at least 7 of 8 placed correctly.","Give yourself 90 seconds each to explain diphtheria toxin and cholera toxin without notes. Pass condition: receptor or entry, intracellular target, signaling or biochemical change, and clinical consequence are all present.","Retake the eight MCQs closed-book. Pass condition: 7/8. For every miss, add a two-column correction: 'I confused...' and 'The deciding clue is...'."],"topics":["Host Pathogen Interaction"]},{"title":"Module 11 - Cell Death Pathways: Identify the Mechanism from the Clues","source":"Lecture 31 SMondal_16102026.pdf, pp. 1-13","mission":"Create a four-column death-mode discriminator for apoptosis, necroptosis, autophagy, and ferroptosis. For each, fill in trigger or control, key machinery, membrane or morphology, and inflammatory or biochemical outcome. Then cover the table and diagnose eight imaginary cells using only their clues. Finish with the recall and MCQs closed-book.","primer":["Programmed cell death is required for tissue control and removal of unwanted or damaged cells. The central exam task is to distinguish pathways by morphology, molecular machinery, and inflammatory outcome.","Apoptosis shows cell shrinkage, chromatin condensation, nuclear fragmentation, membrane blebbing, apoptotic bodies, and phagocytosis. Biochemical clues include caspase activation, DNA fragmentation, and phosphatidylserine exposure.","Initiator caspases begin the cascade: caspase-8 is associated with the extrinsic pathway and caspase-9 with the intrinsic pathway. Executioner caspases 3, 6, and 7 dismantle the cell.","In intrinsic apoptosis, pro-apoptotic BAX and BAK oligomerize in the mitochondrial outer membrane, cytochrome c is released, the apoptosome forms, and caspases activate. Anti-apoptotic BCL-2 can sequester pro-apoptotic proteins and prevent BAX/BAK activation.","BCL-2 family organization is testable: effectors and anti-apoptotic members contain BH1-BH4 domains, while activators and derepressors or sensitizers are BH3-only proteins.","Extrinsic apoptosis begins at a death receptor such as Fas. Fas ligand promotes receptor activation, FADD recruitment, DISC assembly, caspase-8 dimerization and activation, followed by executioner caspases 3 and 7.","Necroptosis is caspase-independent, lytic, and inflammatory, often appearing when caspase-8 or apoptosis is inhibited. It features membrane rupture, cytoplasmic swelling and vacuolization, swollen mitochondria, and a lack of the condensed fragmented nucleus typical of apoptosis.","Autophagy uses acidic lysosomes containing degradative enzymes, including abundant cathepsins. Ferroptosis is driven by iron-linked oxidation of PUFA-containing phospholipids and membrane disruption; protective systems shown include GPX4/GSH, FSP1/CoQ, and DHFR/BH4."],"traps":["Do not label every programmed death as apoptosis. Necroptosis and ferroptosis are regulated but have different machinery and morphology.","Do not swap caspase-8 and caspase-9: 8 is the key extrinsic initiator; 9 is the key intrinsic initiator.","Membrane blebbing with an intact membrane favors apoptosis; membrane rupture with swelling and DAMP release favors necroptosis.","BCL-2 is anti-apoptotic, whereas BAX and BAK are pro-apoptotic effectors that permeabilize mitochondria."],"checkpoint":["Draw the intrinsic and extrinsic apoptosis pathways side by side from memory. Pass condition: each has the correct trigger, adaptor or organelle event, initiator caspase, and executioner stage.","Complete a blind comparison of apoptosis, necroptosis, autophagy, and ferroptosis using four headings: membrane, morphology, key machinery, inflammatory or biochemical clue. Pass condition: no pathway is confused with another.","Retake all eight MCQs closed-book. Pass condition: 7/8, plus a one-sentence explanation for why each rejected option is wrong on any missed question."],"topics":["Cell Death Pathways"]},{"title":"Module 12 - Cancer Biology: From Mutation to Tumor Survival","source":"Lecture 32 SMondal_21102026.pdf, pp. 1-11; Lecture 33 SMondal_23102026.pdf, pp. 1-7","mission":"Build a causal map with six nodes: mutation -> altered growth or death control -> tumor formation -> microenvironment and metabolism -> invasion or metastasis -> immune evasion. Attach every named molecule or process in the primer to a node. Then use the map to explain one complete cancer story aloud, from an activating EGFR or RAS mutation to tumor survival. Finish the recall set and MCQs without reopening the slides.","primer":["Cancer cells differ from normal cells through persistent proliferation, failure of normal apoptosis, invasion through extracellular matrix and basement membrane, and metastasis. Tumors can therefore arise through increased division or decreased cell death, and transformed cells lose contact inhibition and form piled-up foci instead of an orderly monolayer.","The tumor microenvironment includes nonmalignant stroma: fibroblasts, immune cells, endothelial cells, and other support cells. Carcinoma-associated fibroblasts remodel extracellular matrix and secrete factors that affect growth, invasion, inflammation, and angiogenesis.","As tumor cells move farther from blood vessels, oxygen falls and severe hypoxia can lead to necrosis. Under normoxia HIF-alpha is hydroxylated, recognized by VHL, ubiquitinated, and degraded; under hypoxia stabilized HIF activates genes supporting metabolism, erythropoiesis, and angiogenesis.","The Warburg-effect slide emphasizes elevated glucose uptake and conversion of pyruvate to lactate even when oxygen may be present. This reaction uses NADH and regenerates NAD+, allowing continued glucose-to-pyruvate metabolism.","Tumors evade immunity by losing tumor antigens or MHC, expressing non-classical HLA, delivering inhibitory signals to T cells, secreting immunosuppressive cytokines, and building a microenvironment containing suppressive cells such as Tregs and MDSCs.","PD-1 on T cells binding PD-L1 on tumor or immune cells reduces T-cell activity. Anti-PD-1 or anti-PD-L1 antibodies block this inhibitory interaction, increase T-cell activity, and can promote tumor-cell death.","Cancer development usually requires multiple rare genetic or epigenetic events. Proto-oncogenes become oncogenes through gain-of-function changes, often in one allele; tumor-suppressor genes promote cancer through loss of function, commonly requiring inactivation of both copies.","EGFR and RAS illustrate oncogenic activation. EGFR truncation can cause ligand-independent hyperphosphorylation; mutant RAS can remain in the active GTP-bound signaling state. DNA damage normally raises p53, which induces p21 to inhibit cyclin-CDK and pause the cell cycle; MDM2 and MDMX negatively regulate p53, including inhibition, nuclear export, ubiquitination, and proteasomal degradation."],"traps":["Do not use invasion and metastasis as synonyms: invasion is local tissue penetration; metastasis is spread to a new site.","Do not assume all tumor cells are simply dividing faster. Reduced apoptosis can also produce net cell accumulation.","Do not reverse the gene logic: oncogenes are activated gain-of-function drivers; tumor suppressors contribute when function is lost.","PD-1:PD-L1 binding suppresses T-cell activity. Blocking the interaction restores activity; it does not block the T cell."],"checkpoint":["From memory, draw the six-node cancer causal map from mutation to immune evasion and place EGFR, RAS, p53/p21, CAFs, HIF, lactate, MHC loss, and PD-L1 correctly. Pass condition: 7 of 8 placements are correct.","Teach a two-minute contrast: oncogene versus tumor suppressor. Pass condition: you include gain versus loss of function, one-hit versus two-hit logic, and one slide example of each.","Retake the eight MCQs closed-book. Pass condition: 7/8. Then answer this synthesis prompt in four sentences: 'How can a genetically altered cancer cell use its microenvironment, metabolism, and immune checkpoints to survive?'"],"topics":["Cancer Biology 1","Cancer Biology 2 and Drug Development"]},{"title":"Module 13 - Drug Development: From Exposure to an ACE Inhibitor","source":"Lecture 34 slides 2-9 and Lecture 35 slides 2-9","mission":"Build a one-page drug-development map from memory. Start with ADME and the plasma concentration curve, add Phase I/II/III metabolism, then trace the funnel from 10,000 candidates to one drug. Finish by reconstructing the captopril story and labeling the ACE-binding features. You may look at the slides only after each attempted reconstruction.","primer":["DO FIRST - Draw a plasma concentration-versus-time curve. Mark Cmax, tmax, half-life, and AUC before checking slide 3 of Lecture 34. Correct it in a different color.","Cmax is the highest measured plasma concentration; tmax is when that maximum occurs. Half-life tells you how quickly concentration falls, while AUC represents total exposure over time.","Make three metabolism boxes. Phase I commonly exposes or introduces functional groups through oxidation, reduction, or hydrolysis. Phase II conjugates molecules with polar groups. The Lecture 34 Phase III example processes glutathione conjugates toward excretion.","Rebuild the paracetamol branch as a safety story: glutathione can detoxify a reactive metabolite. The glutathione-conjugate mercapturic acid pathway can yield urinary products, while beta-lyase processing of some cysteine conjugates can generate nephrotoxic reactive thiols.","Drug discovery is a funnel, not a single lucky experiment. The slide-level recognition fact is approximately 10,000 candidates narrowing to one drug molecule through discovery, testing, optimization, and development.","Say the screening distinction aloud: computational approaches prioritize compounds in silico; high-throughput screening experimentally tests large compound libraries to find hits; medicinal chemistry turns promising hits into improved leads.","Turn RAAS into arrows: renin leads toward angiotensin I, ACE produces angiotensin II, and angiotensin II supports vasoconstriction and aldosterone-related blood-pressure effects. Therefore, an ACE inhibitor reduces formation of angiotensin II.","Reconstruct the captopril case without notes: Bothrops jararaca venom had hypotensive activity; teprotide was an ACE-inhibiting peptide lead; captopril became the first orally bioavailable ACE inhibitor. For binding, remember Zn2+ coordination, carboxylate ionic/H-bond interactions, and hydrophobic contacts."],"traps":["Do not confuse Cmax with AUC: one is the highest concentration; the other is total exposure.","Do not label every metabolic reaction as detoxification. Some pathways produce reactive or toxic metabolites.","Do not confuse a hit with an approved drug. A hit is only an early active compound.","Do not say captopril is the venom peptide. Teprotide was the peptide lead; captopril was the orally bioavailable small-molecule ACE inhibitor."],"checkpoint":["Without slides, draw and label the pharmacokinetic curve in 60 seconds, then explain each label in one sentence.","Sort these aloud into Phase I-like transformation or conjugation: hydroxylation, hydrolysis, glucuronidation, sulfation, dealkylation, glutathionylation.","Teach the captopril story to an imaginary classmate in 90 seconds: biological clue, molecular target, lead, optimized drug, and three binding features."],"topics":["Drug Development 1","Drug Development 2"]},{"title":"Module 14 - Biochemical and Biophysical Methods: What Each Signal Means","source":"Lecture 36 slides 2-12 and Lecture 37 slides 2-12","mission":"Make a method-choice table with four columns: method, physical signal, result, and limitation/control. Fill it for HTS or phenotypic screening, TSA, ITC, and FRET. Then solve the eight MCQs without slides and explain why every rejected option is wrong.","primer":["DO FIRST - Write four method names on separate slips: phenotypic screening, TSA, ITC, and FRET. For each, predict what is directly measured. Check the slides only after committing an answer.","Screening asks whether a compound produces a useful effect. High-throughput screening tests many compounds; phenotypic screening starts from an observable cellular or organismal phenotype and may find activity before the molecular target is fully known.","The RAS example links phenotype to selectivity: RAS mutations drive uncontrolled growth in many cancers, and compounds can be compared by EC50 in mutant versus wild-type cells. Lower EC50 means less compound is required for the measured effect.","Ferroptosis is a regulated cell-death phenotype associated with iron-dependent lipid peroxidation. In the Lecture 36 map, glutathione/GPX-related defenses oppose damaging phospholipid oxidation.","In TSA, slowly heat the protein while SYPRO Orange reports exposed hydrophobic surfaces. Fluorescence rises during unfolding, reaches a transition region used to estimate Tm, and can later fall when aggregation causes dye dissociation.","A stabilizing ligand usually shifts a protein's TSA melt curve to a higher Tm. This supports binding but does not by itself provide a complete affinity or binding-site description.","In ITC, ligand injections produce heat peaks while feedback power keeps sample and reference cells at the same temperature. Integrating the peaks and plotting heat against molar ratio yields affinity, stoichiometry, and enthalpy. Ka equals 1/Kd.","FRET is a proximity ruler: donor emission excites an acceptor only when spectra overlap and the pair is very close, typically within about 10 nm. Efficiency falls steeply with distance. The cameleon sensor converts Ca2+-dependent CaM-M13 association into a CFP-to-YFP FRET change."],"traps":["TSA measures thermal stability changes; a Tm shift supports ligand interaction but is not a complete affinity measurement.","ITC heat peaks are not concentrations. They are power-versus-time signals that must be integrated before fitting the binding isotherm.","A lower EC50 means greater apparent potency, not weaker activity.","FRET requires proximity and spectral overlap; donor and acceptor expression alone does not prove interaction."],"checkpoint":["Method sprint: for each of TSA, ITC, and FRET, state the input, direct signal, and one conclusion in under 20 seconds.","Sketch an exothermic ITC titration with large early peaks, shrinking peaks, saturation, and heat of dilution. Label which region contains the most binding.","Explain cameleon twice: first as a biological Ca2+ sensor, then as an engineering system that converts a nanoscale conformational change into a color-ratio output."],"topics":["Drug Development and Techniques","Techniques in Biochemistry and Biophysics"]},{"title":"Module 15 - Final Integration: Mixed Recognition and Distinction Drill","source":"Course-wide integration of Modules 1-14: bioenergetics, gene expression, genetic engineering, molecular motors, signaling, cell division/death, stem cells, host-pathogen interactions, cancer, drug development, and biochemical/biophysical methods","mission":"Run this as a closed-slide final. First build the 11-theme distinction grid in the primer from memory. Then answer all recall prompts orally and all MCQs on paper. For every error, write a two-line correction: 'I confused X with Y' and 'The deciding clue is Z.' Reattempt only the missed items after a 20-minute gap.","primer":["DO FIRST - Make an 11-row table using these headings: energy, information, engineering, motion, signaling, cell fate, stem cells, immunity, cancer, drugs, methods. In each row write one core process, one named molecule/example, and one common confusion.","Energy versus information: ATP and ion gradients couple energy to work; DNA-to-RNA-to-protein transfers biological information. Do not answer an energy question with a gene-expression mechanism merely because ATP is consumed.","Editing versus expression: restriction enzymes, ligases, vectors, PCR, and related tools manipulate or amplify nucleic acid; promoters, transcription factors, RNA processing, ribosomes, and regulatory RNAs control whether genetic information is expressed.","Motor versus signal: molecular motors convert chemical energy into directed movement on cytoskeletal tracks. Receptors and signaling cascades detect information, relay it, amplify it, and change cellular behavior.","Division versus death versus differentiation: the cell cycle produces daughter cells; apoptosis removes cells through an organized program; differentiation changes cell identity and function. Cancer can involve excessive proliferation plus failure of growth-control or death pathways.","Innate versus adaptive defense: innate responses are rapid and pattern-based; adaptive responses use highly specific receptors and memory. A pathogen can cause disease through entry, replication, tissue damage, immune evasion, or harmful host responses.","Drug versus measurement: a drug perturbs a biological target or process. A method reports a property: TSA reports thermal stability, ITC reports binding thermodynamics, and FRET reports nanometer-scale proximity. Screening connects the two by finding compounds with a desired activity.","Use the deciding-clue habit for MCQs. Circle the clue that distinguishes the answer: 'total exposure' means AUC; 'lower half-maximal concentration' means greater potency; 'heat per injection' points to ITC; 'Tm shift' points to TSA; 'distance-dependent donor-acceptor transfer' points to FRET."],"traps":["Do not choose a familiar term just because it appears in the stem. Identify whether the question asks about energy, information, movement, fate, defense, drug behavior, or measurement.","Do not merge association with causation: a TSA shift supports stabilization, FRET supports proximity, and a phenotype supports activity; each needs the correct follow-up interpretation.","Do not confuse potency, affinity, and exposure. EC50 is a functional concentration, Kd describes binding, and AUC describes in-body exposure.","Do not confuse pathway position with pathway effect. Blocking an upstream enzyme changes downstream products; trace arrows before selecting the answer."],"checkpoint":["Two-minute blank page: write 20 terms from the course, then connect them with labeled arrows. Any isolated term becomes a priority for review.","Run a contrast lightning round: DNA versus RNA; transcription versus translation; receptor versus motor; apoptosis versus ferroptosis; innate versus adaptive; hit versus lead; Cmax versus AUC; TSA versus ITC versus FRET.","Score yourself out of 24 using the eight recall prompts, eight MCQs, and eight distinctions in checkpoint 2. Continue only if you can explain at least 20 without guessing; otherwise redo the missed distinction grid once."],"topics":["Mixed Review (all topics)"]}]};
const KEY="sbl-slides-reader-v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(3,"0");
const store={get(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return{}}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch{}}};
let cur=0;
function renderNav(){
  $("nav").innerHTML=D.topics.map((t,i)=>{
    const ss=D.slides.filter(s=>s.topic===t);
    const toc=i===cur?`<ul class="toc">${ss.map(s=>`<li><a href="#p${s.page}">${s.slideInLecture}. ${esc(s.title)}</a></li>`).join("")}</ul>`:"";
    return `<button class="topic${i===cur?" on":""}" data-i="${i}">${i+1}. ${esc(t)}<small>${ss.length} slides · pp. ${ss[0].page}–${ss.at(-1).page}</small></button>${toc}`;
  }).join("");
  $("nav").querySelectorAll(".topic").forEach(b=>b.onclick=()=>{open(+b.dataset.i);$("nav").classList.remove("open")});
}
function list(title,arr,cls=""){return arr&&arr.length?`<section class="${cls}"><h3>${title}</h3><ul>${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>`:""}
function open(i,page){
  cur=i;const t=D.topics[i];store.set({topic:t});
  const ss=D.slides.filter(s=>s.topic===t);
  const ov=D.overviews.filter(o=>o.topics.includes(t));
  $("where").textContent=`Topic ${i+1} of ${D.topics.length}: ${t}`;
  $("summaryLink").href=`summary.html#topic=${encodeURIComponent(t)}`;
  $("practiceLink").href=`questions.html#topic=${encodeURIComponent(t)}`;
  const ovHtml=ov.map(o=>`<section class="overview"><h2>${esc(o.title)}</h2><div class="meta">${esc(o.source)}</div><p>${esc(o.mission)}</p>
    <details open><summary>Key ideas summary</summary><ul>${o.primer.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>
    ${o.traps.length?`<div class="traps"><h3>Common traps</h3><ul>${o.traps.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    ${list("Self-check without notes",o.checkpoint)}</section>`).join("");
  const cards=ss.map(s=>`<article class="card" id="p${s.page}">
    <div><img loading="lazy" src="slides/slide-${pad(s.page)}.jpg" alt="Slide ${s.page}: ${esc(s.title)}"><div class="meta">Slide ${s.page} · ${esc(s.topic)} #${s.slideInLecture}</div></div>
    <div><h2>${esc(s.title)}</h2><p>${esc(s.explain)}</p>
      ${s.diagramGuide.length?list("How to read the diagram",s.diagramGuide,"diagram"):""}
      ${list("What the examiner can ask",s.mustKnow)}
      ${s.terms.length?`<h3>Vocabulary</h3><dl class="terms">${s.terms.map(x=>`<dt>${esc(x.term)}</dt><dd>${esc(x.meaning)}</dd>`).join("")}</dl>`:""}
    </div></article>`).join("");
  const prev=i>0?`<button class="btn" id="prevT">← ${esc(D.topics[i-1])}</button>`:"<span></span>";
  const next=i<D.topics.length-1?`<button class="btn" id="nextT">${esc(D.topics[i+1])} →</button>`:"<span></span>";
  $("main").innerHTML=ovHtml+cards+`<div class="pager">${prev}${next}</div>`;
  if($("prevT"))$("prevT").onclick=()=>open(i-1);
  if($("nextT"))$("nextT").onclick=()=>open(i+1);
  $("main").querySelectorAll(".card img").forEach(img=>img.onclick=()=>{const z=document.createElement("div");z.className="zoom";z.innerHTML=`<img src="${img.src}" alt="">`;z.onclick=()=>z.remove();document.body.append(z)});
  renderNav();
  if(page){const el=$("p"+page);if(el)el.scrollIntoView()}else window.scrollTo(0,0);
}
$("menuBtn").onclick=()=>{if(matchMedia("(max-width:900px)").matches)$("nav").classList.toggle("open");else{const c=document.body.classList.toggle("collapsed");try{localStorage.setItem("sbl-nav-collapsed",c?"1":"")}catch{}}};
try{if(localStorage.getItem("sbl-nav-collapsed"))document.body.classList.add("collapsed")}catch{}
// deep link: #page=123 or #topic=Name
const h=new URLSearchParams(location.hash.slice(1));
if(h.get("page")){const s=D.slides.find(x=>x.page===+h.get("page"));if(s)open(D.topics.indexOf(s.topic),s.page);else open(0)}
else{const t=h.get("topic")||store.get().topic;open(Math.max(0,D.topics.indexOf(t)))}
</script>
</body>
