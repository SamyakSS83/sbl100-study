 at the center and fades toward the edges."},{"term":"Scattering force","meaning":"A light-driven force generally directed along beam propagation."},{"term":"Refraction","meaning":"Bending of light as it passes between materials."}],"diagramGuide":["The central laser ray passes through the bead center; off-axis rays refract. Their horizontal force components point inward, while vertical components and scattering act along the beam axis."]},{"page":164,"topic":"Biological Motors","slideInLecture":27,"title":"Light Momentum Produces Force","explain":"Light carries momentum. When a bead bends light by refraction or reflection, the light's momentum changes; conservation of momentum gives the bead an equal and opposite momentum change, which appears as force.","mustKnow":["Light carries momentum.","Changing light direction changes light momentum.","The bead experiences an equal and opposite momentum change."],"terms":[{"term":"Conservation of momentum","meaning":"Total momentum is conserved, so a change in light momentum is balanced by the object."},{"term":"Radiation pressure","meaning":"Pressure or force caused by transfer of light momentum."}],"diagramGuide":["For each refracted ray, compare incoming and outgoing directions. The light's momentum change is balanced by an equal and opposite momentum change of the bead."]},{"page":165,"topic":"Biological Motors","slideInLecture":28,"title":"Gradient and Scattering Forces in an Optical Trap","explain":"Scattering force pushes mainly along the incident beam. Gradient force points toward the high-intensity beam center and acts as a restoring force; displacement of a trapped bead can therefore report the force applied by a molecular motor.","mustKnow":["Gradient force pulls the bead toward the beam center.","Scattering force points mainly along beam propagation.","Optical traps measure piconewton forces and nanometer displacements."],"terms":[{"term":"Gradient force","meaning":"The restoring optical force directed toward the highest-intensity region."},{"term":"Piconewton","meaning":"A force unit equal to 10^-12 newton."},{"term":"Nanometer","meaning":"A length unit equal to 10^-9 meter."}],"diagramGuide":["Separate the force vectors: scattering force points with beam propagation; gradient force points toward the high-intensity beam center and acts as the restoring force."]},{"page":166,"topic":"Biological Motors","slideInLecture":29,"title":"Optical Trap as a Spring","explain":"Near its center, an optical trap behaves like a spring: force is proportional to bead displacement. Hooke's law, F = -kx, lets displacement become a force measurement once trap stiffness k is known.","mustKnow":["An optical trap can be calibrated like a spring.","Force magnitude equals stiffness times displacement.","The minus sign indicates restoring force."],"terms":[{"term":"Hooke's law","meaning":"The relation F = -kx for a linear restoring force."},{"term":"Trap stiffness","meaning":"The proportionality constant k between displacement and restoring force."}],"diagramGuide":["The spring analogy gives F = −kx. Displacement x from equilibrium produces an opposing restoring force; doubling x at fixed stiffness k doubles force magnitude."]},{"page":167,"topic":"Biological Motors","slideInLecture":30,"title":"Measuring Single-Myosin Mechanics","explain":"The slide introduces an optical-tweezers experiment designed to detect piconewton forces and nanometer steps from individual myosin molecules. The apparatus converts tiny bead movements into quantitative motor measurements.","mustKnow":["Single-molecule experiments resolve individual motor events.","Relevant scales are piconewtons for force and nanometers for displacement."],"terms":[{"term":"Single-molecule mechanics","meaning":"Measurement of movement and force from individual molecules rather than a bulk average."}],"diagramGuide":["The apparatus photograph shows the optical-tweezers setup used to measure piconewton forces and nanometre steps from a single myosin molecule."]},{"page":168,"topic":"Biological Motors","slideInLecture":31,"title":"Dual-Beam Optical Trap","explain":"An actin filament is held taut between two trapped beads and lowered onto a pedestal bead carrying sparse myosin. When myosin binds and pulls actin, the trapped beads move, revealing stroke size, attachment time, and force.","mustKnow":["The two trapped beads hold the actin filament.","Myosin is placed on a separate pedestal bead.","Bead displacement reports myosin activity."],"terms":[{"term":"Working stroke","meaning":"The force-producing movement made by a motor protein."},{"term":"Attachment lifetime","meaning":"How long the motor remains bound during one interaction."}],"diagramGuide":["Two laser traps hold beads attached to opposite ends of one actin filament. A myosin-coated pedestal bead lies below; myosin binding displaces the suspended actin-bead assembly."]},{"page":169,"topic":"Biological Motors","slideInLecture":32,"title":"Single-Myosin Experimental Setup","explain":"The actin filament is stretched between two optically trapped beads to about 2 pN and positioned near a sparsely myosin-coated support. A quadrant photodiode tracks bead position with high resolution, allowing brief motor events to be detected.","mustKnow":["Sparse myosin coating helps isolate one or a few motors.","The actin filament is held under about 2 pN tension.","A quadrant photodiode detects bead position."],"terms":[{"term":"Heavy meromyosin","meaning":"A myosin fragment containing the motor heads and part of the tail."},{"term":"Quadrant photodiode","meaning":"A detector that measures small changes in the position of a light image."}],"diagramGuide":["The two end beads tension the actin filament; sparse heavy meromyosin on the fixed support favors events from one or a few motors. A quadrant photodiode records bead position."]},{"page":170,"topic":"Biological Motors","slideInLecture":33,"title":"Myosin Step Traces","explain":"The upper trace records bead motion parallel to the actin filament and the lower trace records perpendicular motion. The detected displacement is close to 11 nm at both low and high ATP concentrations, supporting a characteristic myosin stroke size.","mustKnow":["The productive displacement is measured along the actin filament.","The observed step is about 11 nm.","Step distance is similar at low and high ATP in the shown traces."],"terms":[{"term":"Displacement trace","meaning":"A graph showing measured position as a function of time."}],"diagramGuide":["In each plot, time is horizontal and displacement is vertical. The upper trace is motion parallel to actin and contains steps; the lower trace is perpendicular control motion. The highlighted step size is about 11 nm at both ATP concentrations."]},{"page":171,"topic":"Biological Motors","slideInLecture":34,"title":"Distribution of Myosin Displacements","explain":"The histogram collects many single-motor displacement events instead of relying on one trace. Most events cluster around roughly 10 to 13 nm, while biological and measurement variation spreads the values.","mustKnow":["A histogram shows how frequently each displacement range occurred.","The main cluster is around the approximately 11 nm working stroke."],"terms":[{"term":"Histogram","meaning":"A plot that groups measurements into ranges and counts their frequency."},{"term":"Distribution","meaning":"The pattern of values observed across repeated measurements."}],"diagramGuide":["Histogram axes: displacement in nm is horizontal and number of events is vertical. The tallest bars cluster near roughly 10–13 nm."]},{"page":172,"topic":"Biological Motors","slideInLecture":35,"title":"Force from a Single Myosin Motor","explain":"The force histogram shows repeated single-motor measurements in piconewtons. Most events lie around 2 to 5 pN, with the highest frequency near 3 pN.","mustKnow":["Single myosin forces are in the piconewton range.","The displayed distribution peaks near 3 pN.","Repeated events vary rather than giving one identical value."],"terms":[{"term":"Force distribution","meaning":"The frequency pattern of force values from repeated motor events."}],"diagramGuide":["Histogram axes: force in pN is horizontal and number of events is vertical. The modal region is near 3 pN, with fewer events at larger forces."]},{"page":173,"topic":"Biological Motors","slideInLecture":36,"title":"Bacteria-Powered 3D Micromotors","explain":"The slide presents fabricated micromotor structures whose motion is powered by bacteria and controlled using light. It is an example of coupling living biological motors to engineered microscale devices.","mustKnow":["Bacteria can provide propulsion for engineered micromotors.","Light is used to control the system.","The device scale is micrometers."],"terms":[{"term":"Micromotor","meaning":"A motor-like device built at micrometer scale."},{"term":"Biohybrid","meaning":"A system combining biological components with engineered material."}],"diagramGuide":["The micrograph shows gear-like synthetic micromotors. Attached or confined bacteria provide the biological propulsion and light controls the system."]},{"page":174,"topic":"Biological Motors","slideInLecture":37,"title":"Array of Bacterial Micromotors","explain":"The microscopy image shows repeated gear-like micromotor structures surrounded by bacteria. It demonstrates that the biohybrid design can be fabricated as multiple microscale units rather than only one device.","mustKnow":["The repeated structures are microscale engineered devices.","Bacteria around the structures are part of the propulsion system."],"terms":[{"term":"Microscopy array","meaning":"A field containing multiple repeated small structures viewed by microscopy."}],"diagramGuide":["Repeated four-gear assemblies demonstrate the geometry and replication of the bacteria-powered micromotor design; the image is structural, not a force graph."]},{"page":175,"topic":"Biological Motors","slideInLecture":38,"title":"Bacterial Flagella","explain":"The slide introduces bacterial flagella as rotary motility structures. A flagellar motor rotates the helical flagellum, allowing a bacterium to move through liquid.","mustKnow":["Bacterial flagella generate swimming motion by rotation.","The bacterial flagellar motor is a rotary biological motor."],"terms":[{"term":"Flagellum","meaning":"A long helical appendage used for bacterial swimming."},{"term":"Flagellar motor","meaning":"The membrane-associated rotary motor that turns a bacterial flagellum."}],"diagramGuide":["The video still shows bacterial trajectories. The key mechanism is rotary motion of the flagellar motor transmitted to the helical flagellum."]},{"page":176,"topic":"Biological Motors","slideInLecture":39,"title":"Biological Motors Reference","explain":"The lecture cites Molecular Biology of the Cell by Bruce Alberts as its reference text. This page contains source information rather than a new mechanism.","mustKnow":["The cited reference is Molecular Biology of the Cell, 5th edition."],"terms":[],"diagramGuide":[]},{"page":177,"topic":"Cellular Signaling","slideInLecture":1,"title":"Cellular Signaling","explain":"This begins the cellular signaling lecture. The central topic is how cells detect information, process it internally, and produce an appropriate response.","mustKnow":["Cell signaling links detection of a signal to a cellular response."],"terms":[{"term":"Cellular signaling","meaning":"Communication processes by which cells detect and respond to information."}],"diagramGuide":[]},{"page":178,"topic":"Cellular Signaling","slideInLecture":2,"title":"Perceiving the Environment","explain":"The examples emphasize that living systems detect external cues and direct movement or behavior in response. At cell level, receptors perform the sensing and signaling pathways organize the response.","mustKnow":["Environmental information must first be detected.","Sensing is followed by a directed response."],"terms":[{"term":"Chemotaxis","meaning":"Directed cell movement in response to a chemical gradient."},{"term":"Phagocytosis","meaning":"Engulfment of a particle by a cell."}],"diagramGuide":["The right panel names a neutrophil response to a micropipette-held target: chemical sensing directs movement (chemotaxis), followed by engulfment (phagocytosis)."]},{"page":179,"topic":"Cellular Signaling","slideInLecture":3,"title":"Why Cells Need Signaling","explain":"Cells must detect changes around them and respond. Because a cell may receive several signals at once, it must process and integrate them into one coordinated action plan.","mustKnow":["Cells sense environmental change.","Cells can receive multiple signals simultaneously.","Signal information is integrated into a response."],"terms":[{"term":"Signal integration","meaning":"Combining multiple inputs to determine one cellular response."}],"diagramGuide":["The left micrograph shows a cell interacting with nearby material; the right time-lapse field illustrates that a cell population can change behavior over time after receiving information."]},{"page":180,"topic":"Cellular Signaling","slideInLecture":4,"title":"Core Features of Cell Signaling","explain":"Signals can operate over short or long distances, and cells respond only if they have the right receptor and state. Lipid-soluble signals may cross the membrane to intracellular receptors, while many other signals use cell-surface receptors and internal relay pathways.","mustKnow":["Only target cells with suitable receptors respond.","Responses may be rapid or slow.","Some hormones use intracellular receptors; others use cell-surface receptors."],"terms":[{"term":"Target cell","meaning":"A cell able to respond because it has the appropriate receptor and machinery."},{"term":"Intracellular receptor","meaning":"A receptor located inside the cell."},{"term":"Cell-surface receptor","meaning":"A membrane receptor that detects an extracellular signal."}],"diagramGuide":["No pathway diagram is shown. Organize the bullets as range, cell competence, response speed, and receptor location."]},{"page":181,"topic":"Cellular Signaling","slideInLecture":5,"title":"Chemical Types of Signals","explain":"Cell signals have many chemical forms: amino-acid derivatives, gases, steroids, peptides or proteins, and surface-bound molecules. Their chemistry influences how they travel and whether they can cross the plasma membrane.","mustKnow":["NO and CO are gaseous signals.","Steroid hormones are derived from cholesterol.","Many peptide and protein signals act outside the cell through receptors."],"terms":[{"term":"Steroid hormone","meaning":"A cholesterol-derived signal that can often cross the plasma membrane."},{"term":"Neurotransmitter","meaning":"A signal released by a neuron to act on another cell."},{"term":"Antigen receptor","meaning":"A B-cell or T-cell receptor that recognizes foreign antigen."}],"diagramGuide":[]},{"page":182,"topic":"Cellular Signaling","slideInLecture":6,"title":"Autocrine and Paracrine Signaling","explain":"In autocrine signaling, the producing cell also responds to its own messenger. In paracrine signaling, the messenger travels a short distance to nearby target cells; PDGF released during wound repair is the slide's example.","mustKnow":["Autocrine means self-signaling.","Paracrine means local signaling to nearby cells.","PDGF is a paracrine wound-repair example."],"terms":[{"term":"Autocrine","meaning":"A signaling mode in which a cell responds to its own secreted signal."},{"term":"Paracrine","meaning":"Short-range signaling to nearby cells."},{"term":"PDGF","meaning":"Platelet-derived growth factor, a local signal involved in repair."}],"diagramGuide":["Autocrine diagram: signal returns to receptors on the same producing cell. Paracrine diagram: a signaling cell releases local mediator that diffuses only to nearby target cells."]},{"page":183,"topic":"Cellular Signaling","slideInLecture":7,"title":"Juxtacrine and Endocrine Signaling","explain":"Juxtacrine signaling requires direct contact between surface molecules on neighboring cells. Endocrine hormones enter the bloodstream and act at distant targets; insulin released by pancreatic beta cells is the slide's example.","mustKnow":["Juxtacrine signaling is contact-dependent.","Endocrine signaling uses the bloodstream for long-range delivery.","Insulin is an endocrine hormone."],"terms":[{"term":"Juxtacrine","meaning":"Direct contact-dependent signaling between neighboring cells."},{"term":"Endocrine","meaning":"Long-range hormonal signaling through the bloodstream."},{"term":"Contact inhibition","meaning":"Reduced cell growth or division when cells contact neighbors."}],"diagramGuide":["Juxtacrine diagram: membrane-bound ligand and receptor touch across adjacent cells. Endocrine diagram: hormone enters blood, travels, exits near a distant target, and binds its receptor."]},{"page":184,"topic":"Cellular Signaling","slideInLecture":8,"title":"Examples of Hormone Signals","explain":"The table links each hormone to its origin, chemical nature, and action. High-yield pairs include adrenal epinephrine, adrenal cortisol, pancreatic alpha-cell glucagon, pancreatic beta-cell insulin, and thyroid-gland thyroxine.","mustKnow":["Epinephrine and cortisol originate in the adrenal gland.","Glucagon comes from pancreatic alpha cells; insulin from beta cells.","Cortisol, estradiol, and testosterone are steroids."],"terms":[{"term":"Glucagon","meaning":"A pancreatic alpha-cell peptide hormone that promotes fuel mobilization."},{"term":"Insulin","meaning":"A pancreatic beta-cell protein hormone that promotes glucose uptake and synthesis."},{"term":"Cortisol","meaning":"An adrenal steroid hormone that affects metabolism in many tissues."}],"diagramGuide":["Read the table across each row: signal → site of origin → chemical nature → action. Do not mix a hormone's source with its target tissue."]},{"page":185,"topic":"Cellular Signaling","slideInLecture":9,"title":"Local, Neural, and Contact Signals","explain":"The table contrasts local mediators, neurotransmitters, and contact-dependent signals. EGF and PDGF promote proliferation, NGF supports neurons, TGF-beta inhibits proliferation, histamine promotes inflammatory vessel changes, and GABA is inhibitory in the central nervous system.","mustKnow":["EGF and PDGF stimulate proliferation.","Histamine promotes vessel dilation and leakiness in inflammation.","GABA is an inhibitory neurotransmitter.","Delta is a contact-dependent transmembrane signal."],"terms":[{"term":"EGF","meaning":"Epidermal growth factor, a protein signal that stimulates proliferation."},{"term":"GABA","meaning":"An inhibitory neurotransmitter in the central nervous system."},{"term":"Histamine","meaning":"A mast-cell signal that promotes blood-vessel dilation and leakiness."},{"term":"Delta","meaning":"A membrane-bound contact-dependent signal."}],"diagramGuide":["Read the table across each row and first classify the signal as local mediator, neurotransmitter, or contact-dependent signal; then link source and action."]},{"page":186,"topic":"Cellular Signaling","slideInLecture":10,"title":"Signal Processing Architecture","explain":"Cell signaling can be viewed as an engineering chain: sensor, information processing, and response. Useful pathway properties include specificity, cascades, amplification, feedback, and integration.","mustKnow":["The basic sequence is sensor to processing to response.","Amplification increases signal output.","Feedback modifies pathway activity.","Integration combines inputs."],"terms":[{"term":"Specificity","meaning":"Selective recognition of particular signals and targets."},{"term":"Amplification","meaning":"Production of a larger downstream response from a smaller initial input."},{"term":"Feedback","meaning":"A downstream effect that changes earlier pathway activity."},{"term":"Cascade","meaning":"A sequence in which one activated component activates the next."}],"diagramGuide":["Top flow is sensor → information processing → response/action. Bottom symbols summarize specificity, cascade, amplification, feedback, and integration as pathway properties."]},{"page":187,"topic":"Cellular Signaling","slideInLecture":11,"title":"Signaling Pathways Form Networks","explain":"The waterfall analogy and pathway map show that signals pass through multiple connected components rather than one isolated switch. Different receptors can converge on shared proteins, and one pathway can branch toward several outputs.","mustKnow":["Signaling often proceeds as a multistep cascade.","Different receptor inputs can converge.","One signal can branch into multiple responses."],"terms":[{"term":"Convergence","meaning":"Different upstream signals meeting at a shared pathway component."},{"term":"Divergence","meaning":"One upstream signal branching toward multiple downstream effects."}],"diagramGuide":["The waterfall is an analogy for a multistep cascade. In the network, arrows show direction; branching is divergence to several outputs, while merging arrows show convergence on shared intermediates."]},{"page":188,"topic":"Cellular Signaling","slideInLecture":12,"title":"Nuclear Receptor Signaling","explain":"Cortisol diffuses through the lipid bilayer and binds an intracellular glucocorticoid receptor. The activated receptor moves to the nucleus, binds target DNA, and changes transcription, leading to synthesis of specific proteins.","mustKnow":["Cortisol can cross the plasma membrane.","Its receptor is intracellular.","The hormone-receptor complex regulates gene transcription.","This response requires new protein synthesis."],"terms":[{"term":"Glucocorticoid receptor","meaning":"An intracellular receptor activated by glucocorticoid hormones such as cortisol."},{"term":"Transcription","meaning":"Production of RNA from a DNA template."},{"term":"Nuclear receptor","meaning":"An intracellular receptor that directly regulates gene expression."}],"diagramGuide":["Follow the numbered route: cortisol outside cell → diffusion through membrane → receptor binding in cytoplasm → receptor conformational change and nuclear entry → DNA binding/transcription → mRNA → protein synthesis."]},{"page":189,"topic":"Cellular Signaling","slideInLecture":13,"title":"Major Membrane Receptor Classes","explain":"The lecture lists three major cell-surface receptor types: G protein-coupled receptors, receptor tyrosine kinases, and ion channels. All detect extracellular information but use different mechanisms to transmit it across the membrane.","mustKnow":["GPCRs activate G proteins.","Receptor tyrosine kinases use regulated phosphorylation.","Ligand-gated ion channels control ion flow."],"terms":[{"term":"GPCR","meaning":"A seven-pass membrane receptor that activates a G protein."},{"term":"Receptor tyrosine kinase","meaning":"A receptor whose cytosolic kinase activity phosphorylates tyrosines."},{"term":"Ion channel receptor","meaning":"A receptor that changes ion flow across the membrane."}],"diagramGuide":[]},{"page":190,"topic":"Cellular Signaling","slideInLecture":14,"title":"GPCR Examples and Outputs","explain":"GPCRs mediate many physiological responses. The table links signals such as epinephrine, serotonin, light, odorants, fMet peptides, and acetylcholine to specific GPCRs, effectors, and outcomes.","mustKnow":["One receptor family can control many different physiological processes.","GPCR specificity comes from the receptor, G protein, effector, and cell context.","Rhodopsin is the light-detecting GPCR example."],"terms":[{"term":"Rhodopsin","meaning":"A light-sensitive GPCR involved in visual excitation."},{"term":"Effector","meaning":"A downstream enzyme or channel directly regulated by an activated G protein."}],"diagramGuide":["Read each table row as stimulus → GPCR → effector → physiological response. Examples include light → rhodopsin → cGMP phosphodiesterase → visual excitation."]},{"page":191,"topic":"Cellular Signaling","slideInLecture":15,"title":"GPCRs Activate Trimeric G Proteins","explain":"GPCRs contain seven membrane-spanning helices. Ligand binding changes receptor shape, allowing it to activate a heterotrimeric G protein, which can then regulate an effector such as adenylyl cyclase. Figure focus: Trace the diagram left to right: extracellular ligand -> seven-pass receptor -> alpha-beta-gamma G protein -> membrane effector.","mustKnow":["GPCRs have seven transmembrane helices.","They interact with a trimeric G protein.","Adenylyl cyclase is a common downstream effector."],"terms":[{"term":"Heterotrimeric G protein","meaning":"A GTP-binding signaling protein made of alpha, beta, and gamma subunits."},{"term":"Adenylyl cyclase","meaning":"A membrane enzyme that produces cAMP from ATP."},{"term":"Ligand","meaning":"A molecule that binds specifically to a receptor."}],"diagramGuide":["Trace the diagram left to right: extracellular ligand -> seven-pass receptor -> alpha-beta-gamma G protein -> membrane effector.","The nucleotide label is on G-alpha; GDP/GTP exchange changes the state of G-alpha, not the receptor."]},{"page":192,"topic":"Cellular Signaling","slideInLecture":16,"title":"Three-Dimensional GPCR Structure","explain":"The structural model shows a GPCR as a compact bundle of seven alpha helices crossing the membrane. A ligand approaching the receptor can stabilize a new conformation that is transmitted to the intracellular G-protein-binding side. Figure focus: Count the seven colored alpha-helices forming the compact receptor bundle.","mustKnow":["The seven helices form one receptor bundle.","Ligand binding changes receptor conformation.","The conformational change connects outside binding to inside signaling."],"terms":[{"term":"Conformational change","meaning":"A change in a protein's three-dimensional shape."},{"term":"Transmembrane helix","meaning":"An alpha helix that passes through the lipid bilayer."}],"diagramGuide":["Count the seven colored alpha-helices forming the compact receptor bundle.","The small space-filling ligand approaches the extracellular face; signaling is transmitted to the opposite, cytoplasmic face."]},{"page":193,"topic":"Cellular Signaling","slideInLecture":17,"title":"GPCR Activation, Amplification, and Attenuation","explain":"The diagram follows activation from ligand-bound receptor to G protein and effector. One active receptor can activate multiple G proteins, creating amplification; receptor phosphorylation and arrestin binding then stop further activation. Figure focus: Follow numbered panels rather than reading by rows: receptor activation precedes G-protein separation and effector activation.","mustKnow":["A single active receptor can activate multiple G proteins.","This one-to-many step amplifies the signal.","Phosphorylation plus arrestin produces attenuation."],"terms":[{"term":"Signal attenuation","meaning":"Reduction or termination of signaling strength."},{"term":"Arrestin","meaning":"A protein that binds an active phosphorylated GPCR and blocks further G-protein activation."},{"term":"GRK","meaning":"A GPCR kinase that phosphorylates an active receptor."}],"diagramGuide":["Follow numbered panels rather than reading by rows: receptor activation precedes G-protein separation and effector activation.","Green box marks amplification; the upper red box marks GTP-hydrolysis shutoff; the lower red box marks GRK/arrestin attenuation."]},{"page":194,"topic":"Cellular Signaling","slideInLecture":18,"title":"The GPCR-G Protein Cycle","explain":"Ligand-bound GPCR promotes GDP release and GTP binding on G alpha. G alpha-GTP activates an effector such as adenylyl cyclase, which produces cAMP; G alpha then hydrolyzes GTP, reassociates with beta-gamma, and signaling stops. GRK and arrestin further desensitize the receptor. Figure focus: Map each written step to the adjacent cycle on slide 193.","mustKnow":["GDP-to-GTP exchange activates G alpha.","Adenylyl cyclase produces cAMP.","GTP hydrolysis deactivates G alpha.","GRK phosphorylation and arrestin block the receptor."],"terms":[{"term":"G alpha","meaning":"The nucleotide-binding G-protein subunit that regulates an effector."},{"term":"GTPase activity","meaning":"Hydrolysis of bound GTP to GDP, switching G alpha off."},{"term":"Desensitization","meaning":"Reduced receptor signaling despite continued ligand presence."}],"diagramGuide":["Map each written step to the adjacent cycle on slide 193.","Separate three shutoff events: G-alpha hydrolyzes GTP, subunits reassociate, and GRK/arrestin desensitizes the receptor."]},{"page":195,"topic":"Cellular Signaling","slideInLecture":19,"title":"AMP Compared with Cyclic AMP","explain":"Both molecules contain adenine, ribose, and phosphate. In cAMP, the phosphate forms a cyclic linkage on the ribose; this ring structure distinguishes the second messenger from ordinary AMP. Figure focus: Compare the phosphate connections, not the shared adenine and ribose.","mustKnow":["cAMP is cyclic adenosine monophosphate.","Its phosphate forms a cyclic bond with ribose.","cAMP acts as an intracellular second messenger."],"terms":[{"term":"cAMP","meaning":"Cyclic adenosine monophosphate, an intracellular second messenger."},{"term":"AMP","meaning":"Adenosine monophosphate, a nucleotide with adenine, ribose, and one phosphate."}],"diagramGuide":["Compare the phosphate connections, not the shared adenine and ribose.","AMP has a non-cyclic phosphate; cAMP has a phosphate bridge linking two ribose oxygens."]},{"page":196,"topic":"Cellular Signaling","slideInLecture":20,"title":"cAMP as an Amplifying Second Messenger","explain":"A first messenger such as serotonin binds a surface receptor, and the cell produces cAMP inside. cAMP diffuses to intracellular targets and can regulate several activities, allowing one extracellular stimulus to create a broad coordinated response. Figure focus: Read the color key: blue is low cAMP, yellow intermediate, red high.","mustKnow":["The ligand is the first messenger.","cAMP is an intracellular second messenger.","Second messengers amplify and distribute the signal."],"terms":[{"term":"First messenger","meaning":"The extracellular ligand that binds a receptor."},{"term":"Second messenger","meaning":"A small intracellular molecule generated or released after receptor activation."},{"term":"Aplysia","meaning":"The sea hare whose neuron is shown in the cAMP imaging example."}],"diagramGuide":["Read the color key: blue is low cAMP, yellow intermediate, red high.","Compare the same Aplysia neuron before 5-HT, at 19 seconds, at 100 seconds, and at 10 minutes to see a transient response."]},{"page":197,"topic":"Cellular Signaling","slideInLecture":21,"title":"cAMP Cascade in a Liver Cell","explain":"Glucagon or epinephrine activates a GPCR, G protein, adenylyl cyclase, cAMP, and protein kinase A. The cascade promotes glycogen breakdown and glucose release, while another branch activates CREB to alter gene transcription. Figure focus: Trace the metabolic branch from receptor to glucose release and the nuclear branch from PKA to CREB.","mustKnow":["GPCR activation leads to cAMP and protein kinase A.","The pathway activates glycogen phosphorylase and inhibits glycogen synthase.","The metabolic output is glucose mobilization.","PKA can also activate the transcription factor CREB."],"terms":[{"term":"Protein kinase A","meaning":"A cAMP-activated kinase that phosphorylates downstream proteins."},{"term":"Glycogen phosphorylase","meaning":"An enzyme that promotes glycogen breakdown."},{"term":"CREB","meaning":"A transcription factor activated by phosphorylation in the cAMP pathway."},{"term":"Phosphodiesterase","meaning":"An enzyme that converts cAMP to AMP and helps terminate the signal."}],"diagramGuide":["Trace the metabolic branch from receptor to glucose release and the nuclear branch from PKA to CREB.","Notice opposing phosphorylation effects: phosphorylase kinase/glycogen phosphorylase are activated, whereas glycogen synthase is inhibited."]},{"page":198,"topic":"Cellular Signaling","slideInLecture":22,"title":"GPCR Signal Attenuation","explain":"GRKs phosphorylate an active GPCR, creating a high-affinity site for arrestin. Arrestin and G proteins compete for the same cytoplasmic receptor cavity, so arrestin binding prevents additional G-protein activation and can promote receptor internalization. Figure focus: Follow the receptor between surface, coated pit, vesicle, and recycling routes.","mustKnow":["GRKs phosphorylate active GPCRs.","Arrestin selectively binds the active phosphorylated receptor.","Arrestin blocks G-protein coupling.","Attenuation prevents unlimited signaling."],"terms":[{"term":"Receptor internalization","meaning":"Removal of a receptor from the cell surface into an intracellular vesicle."},{"term":"Competition","meaning":"Mutually exclusive binding of G protein or arrestin to the same receptor region."}],"diagramGuide":["Follow the receptor between surface, coated pit, vesicle, and recycling routes.","GRK phosphorylation enables arrestin binding; arrestin both blocks G-protein access and supports internalization."]},{"page":199,"topic":"Cell Death and Cell Division","slideInLecture":1,"title":"Cell Survival and Cell Death","explain":"This slide opens the next lecture, which examines how cells remain alive or activate controlled death programs. The immediate transition is from signaling pathways to apoptosis. Figure focus: This is a section divider; use the background apoptotic-cell imagery only as context.","mustKnow":["Cell survival and cell death are regulated biological outcomes.","Apoptosis is the first cell-death mode introduced."],"terms":[{"term":"Cell survival","meaning":"Maintenance of cellular functions and resistance to death signals."},{"term":"Cell death","meaning":"Loss of cell viability through regulated or damaging processes."}],"diagramGuide":["This is a section divider; use the background apoptotic-cell imagery only as context.","The examinable transition is from receptor signaling to regulated survival/death decisions."]},{"page":200,"topic":"Cell Death and Cell Division","slideInLecture":2,"title":"Apoptosis","explain":"The tissue image marks cells with the condensed, rounded appearance associated with apoptosis. Apoptosis is a regulated form of cell death in which a cell dismantles itself in an orderly way. Figure focus: Arrows indicate isolated cells with dark, compact nuclei and reduced cell volume relative to neighbors.","mustKnow":["Apoptosis is regulated cell death.","Apoptotic cells show condensation and fragmentation.","Apoptosis removes individual cells in an organized manner."],"terms":[{"term":"Apoptosis","meaning":"A programmed, tightly regulated process of cell self-destruction."},{"term":"Cell condensation","meaning":"Shrinkage and compacting of an apoptotic cell and its contents."}],"diagramGuide":["Arrows indicate isolated cells with dark, compact nuclei and reduced cell volume relative to neighbors.","Do not identify apoptosis from stain color alone; use condensation, shrinkage, and isolation together."]},{"page":201,"topic":"Cell Death and Cell Division","slideInLecture":3,"title":"Core Features of Apoptosis","explain":"Apoptosis is a controlled cell-death program. The cell and nucleus shrink, the dying cell loses contact with neighboring cells, and the plasma membrane forms surface blebs. Figure focus: Read images A-D as a time sequence ending in fragmentation.","mustKnow":["Apoptosis is programmed and orderly.","Cell shrinkage and nuclear shrinkage are characteristic.","Loss of adhesion and membrane blebbing occur."],"terms":[{"term":"Apoptosis","meaning":"An organized program that causes a cell to die."},{"term":"Blebbing","meaning":"Formation of rounded bulges on the plasma membrane."}],"diagramGuide":["Read images A-D as a time sequence ending in fragmentation.","The SEM pair emphasizes loss of a smooth outline and formation of membrane blebs."]},{"page":202,"topic":"Cell Death and Cell Division","slideInLecture":4,"title":"Final Events in Apoptosis","explain":"As apoptosis proceeds, chromatin is cut into small fragments. The cell corpse is then rapidly engulfed by phagocytosis, limiting the release of intracellular material. Figure focus: The electron micrograph shows an apoptotic cell breaking into discrete membrane-bound fragments.","mustKnow":["Chromatin becomes fragmented.","The apoptotic corpse is rapidly removed by phagocytosis."],"terms":[{"term":"Chromatin fragmentation","meaning":"Breakdown of nuclear DNA-protein material into smaller pieces."},{"term":"Phagocytosis","meaning":"Engulfment and removal of particles or cells by another cell."}],"diagramGuide":["The electron micrograph shows an apoptotic cell breaking into discrete membrane-bound fragments.","Dark compact nuclear material represents chromatin condensation/fragmentation."]},{"page":203,"topic":"Cell Death and Cell Division","slideInLecture":5,"title":"Morphological Sequence of Apoptosis","explain":"The diagram shows a normal cell progressing through chromatin condensation, membrane blebbing, nuclear collapse, and formation of membrane-bound apoptotic bodies. Figure focus: Follow arrows clockwise: normal cell -> chromatin condensation -> membrane blebbing/nuclear collapse -> apoptotic bodies.","mustKnow":["Chromatin condensation occurs early.","Membrane blebbing precedes apoptotic-body formation.","The dying cell breaks into apoptotic bodies."],"terms":[{"term":"Chromatin condensation","meaning":"Tight packing of chromatin in the dying nucleus."},{"term":"Apoptotic body","meaning":"A membrane-bound fragment produced by an apoptotic cell."}],"diagramGuide":["Follow arrows clockwise: normal cell -> chromatin condensation -> membrane blebbing/nuclear collapse -> apoptotic bodies.","The final particles retain membrane boundaries, distinguishing orderly packaging from lysis."]},{"page":204,"topic":"Cell Death and Cell Division","slideInLecture":6,"title":"Clearance of Apoptotic Cells","explain":"Apoptotic bodies retain tightly packed organelles and may contain nuclear fragments, all enclosed by an intact membrane. Macrophages engulf them and degrade them in phagolysosomes, so their contents do not spill into surrounding tissue and inflammation is minimal. Figure focus: The micrograph shows a larger phagocyte contacting/engulfing a compact apoptotic body.","mustKnow":["Apoptotic bodies remain membrane enclosed.","Macrophages degrade them in phagolysosomes.","Rapid clearance limits inflammation and secondary necrosis."],"terms":[{"term":"Macrophage","meaning":"A phagocytic immune cell that engulfs cellular debris."},{"term":"Phagolysosome","meaning":"Degradative compartment formed after a phagosome combines with lysosomal machinery."},{"term":"Secondary necrosis","meaning":"Loss of membrane integrity when an apoptotic cell is not cleared promptly."}],"diagramGuide":["The micrograph shows a larger phagocyte contacting/engulfing a compact apoptotic body.","Link intact membranes and fast macrophage uptake to minimal leakage and inflammation."]},{"page":205,"topic":"Cell Death and Cell Division","slideInLecture":7,"title":"Apoptosis Video Reinforcement","explain":"This slide provides a linked video intended to reinforce the visible sequence of programmed cell death. Figure focus: The embedded video frame is unavailable in the PDF; treat this as reinforcement, not a new pathway.","mustKnow":["Use the video to recognize cell shrinkage, blebbing, fragmentation, and clearance."],"terms":[{"term":"Programmed cell death","meaning":"A regulated process that dismantles and removes a cell."}],"diagramGuide":["The embedded video frame is unavailable in the PDF; treat this as reinforcement, not a new pathway.","Recall the morphology sequence from slides 201-204."]},{"page":206,"topic":"Cell Death and Cell Division","slideInLecture":8,"title":"Apoptosis Animation","explain":"This linked animation is a visual review of apoptotic changes and cell removal. Figure focus: The highlighted cell is the intended focus of the animation frame.","mustKnow":["An apoptotic cell is dismantled into membrane-bound fragments rather than simply bursting."],"terms":[{"term":"Cell dismantling","meaning":"Controlled breakdown of a dying cell into removable parts."}],"diagramGuide":["The highlighted cell is the intended focus of the animation frame.","Use the surrounding epithelial sheet to judge that apoptosis removes individual cells without dissolving the whole tissue."]},{"page":207,"topic":"Cell Death and Cell Division","slideInLecture":9,"title":"Apoptotic Cell Imaging","explain":"The microscopy image shows cells undergoing visible structural changes during apoptosis. Such imaging allows membrane and shape changes to be followed directly. Figure focus: Compare the bright rounded/blebbing cells with the flatter intact cell at left.","mustKnow":["Apoptosis can be recognized by characteristic changes in cell morphology."],"terms":[{"term":"Morphology","meaning":"The observable shape and structural appearance of a cell."}],"diagramGuide":["Compare the bright rounded/blebbing cells with the flatter intact cell at left.","The fluorescence marks cells as morphology changes; it is not itself a named molecular assay on this slide."]},{"page":208,"topic":"Cell Death and Cell Division","slideInLecture":10,"title":"Extrinsic Apoptosis Pathway","explain":"In the receptor-mediated pathway, TNF binds TNFR1. The activated receptor recruits TRADD, FADD, and procaspase-8 into a membrane-associated complex. Procaspase-8 becomes active caspase-8, which activates executioner caspases. Figure focus: Read top to bottom: TNF/TNFR1 -> death-domain adaptors -> procaspase-8 -> initiator caspase-8 -> executioner caspases.","mustKnow":["The extrinsic pathway begins at a death receptor.","TNFR1 recruits TRADD, FADD, and procaspase-8.","Caspase-8 is the initiator caspase in this pathway.","Executioner caspases carry out cell dismantling."],"terms":[{"term":"TNFR1","meaning":"A TNF receptor that can initiate extrinsic apoptosis."},{"term":"FADD","meaning":"An adaptor that helps recruit procaspase-8."},{"term":"Caspase-8","meaning":"The initiator caspase activated in the extrinsic pathway."}],"diagramGuide":["Read top to bottom: TNF/TNFR1 -> death-domain adaptors -> procaspase-8 -> initiator caspase-8 -> executioner caspases.","TRADD and FADD are adaptors; they are not the proteases that execute cleavage."]},{"page":209,"topic":"Cell Death and Cell Division","slideInLecture":11,"title":"BCL-2 Family Controls Mitochondrial Permeability","explain":"BCL-2-family proteins form a survival-versus-death switch. Anti-apoptotic members oppose BAX and BAK, while BH3-only proteins promote their activation. Activated BAX and BAK oligomerize in the mitochondrial outer membrane and cause MOMP. Figure focus: Use the left domain diagrams to sort anti-apoptotic, multidomain pro-apoptotic, and BH3-only groups.","mustKnow":["BCL-2, BCL-XL, MCL-1, BCL-w, and A1 are anti-apoptotic.","BAX, BAK, and BOK are pro-apoptotic.","BH3-only proteins include BID, BIM, NOXA, and BAD.","BAX/BAK oligomerization causes MOMP."],"terms":[{"term":"MOMP","meaning":"Mitochondrial outer-membrane permeabilization."},{"term":"BAX/BAK","meaning":"Pro-apoptotic proteins that form membrane-permeabilizing oligomers."},{"term":"BH3-only proteins","meaning":"Upstream apoptosis inducers that activate or release pro-apoptotic BCL-2-family activity."},{"term":"BCL-2","meaning":"An anti-apoptotic protein that opposes mitochondrial permeabilization."}],"diagramGuide":["Use the left domain diagrams to sort anti-apoptotic, multidomain pro-apoptotic, and BH3-only groups.","In the right network, BCL-2 inhibits BAX/BAK while BH3-only proteins either activate BAX/BAK or neutralize BCL-2; MOMP releases cytochrome c."]},{"page":210,"topic":"Cell Death and Cell Division","slideInLecture":12,"title":"Intrinsic Apoptosis Pathway","explain":"Cellular stress activates pro-apoptotic BCL-2-family proteins such as BAX. Mitochondria release cytochrome c, which combines with Apaf-1 and procaspase-9. Activated caspase-9 then activates executioner caspases. Figure focus: Read top to bottom: internal damage -> Bax at mitochondrion -> cytochrome-c release -> Apaf-1/procaspase-9 complex -> executioner caspases.","mustKnow":["The intrinsic pathway is mitochondria mediated.","MOMP releases cytochrome c into the cytosol.","Cytochrome c, Apaf-1, and procaspase-9 form the activation complex.","Caspase-9 activates executioner caspases."],"terms":[{"term":"Cytochrome c","meaning":"A mitochondrial protein that promotes apoptosome formation after release into the cytosol."},{"term":"Apaf-1","meaning":"A cytosolic scaffold that recruits procaspase-9."},{"term":"Caspase-9","meaning":"The initiator caspase of the intrinsic pathway."}],"diagramGuide":["Read top to bottom: internal damage -> Bax at mitochondrion -> cytochrome-c release -> Apaf-1/procaspase-9 complex -> executioner caspases.","The mitochondrion is upstream of caspase-9 in the intrinsic pathway."]},{"page":211,"topic":"Cell Death and Cell Division","slideInLecture":13,"title":"Detecting Apoptosis with Annexin V","explain":"Healthy cells keep phosphatidylserine on the inner leaflet of the plasma membrane. During apoptosis it moves to the outer leaflet, where it acts as an eat-me signal. Annexin V binds exposed phosphatidylserine and can therefore mark apoptotic cells. Figure focus: Compare leaflet position of phosphatidylserine in normal versus apoptotic membrane cartoons.","mustKnow":["Phosphatidylserine is normally on the cytoplasmic leaflet.","Apoptosis exposes phosphatidylserine on the cell surface.","Annexin V detects exposed phosphatidylserine."],"terms":[{"term":"Annexin V","meaning":"A phospholipid-binding protein used to detect exposed phosphatidylserine."},{"term":"Phosphatidylserine","meaning":"A membrane phospholipid that becomes an external eat-me signal during apoptosis."},{"term":"Eat-me signal","meaning":"A surface cue that promotes phagocytic clearance."}],"diagramGuide":["Compare leaflet position of phosphatidylserine in normal versus apoptotic membrane cartoons.","Annexin V binds only after PS becomes exposed on the extracellular leaflet."]},{"page":212,"topic":"Cell Death and Cell Division","slideInLecture":14,"title":"Detecting Cytochrome c Release","explain":"BAX/BAK pores compromise the mitochondrial outer membrane and release cytochrome c. In healthy cells, cytochrome c staining is confined to mitochondria; after apoptosis induction, its staining becomes diffuse throughout the cytosol. Figure focus: Untreated cells show punctate/reticular green mitochondrial cytochrome c; treated cells show diffuse green cytosolic signal.","mustKnow":["BAX/BAK pores release cytochrome c.","Diffuse cytochrome c staining indicates mitochondrial release.","Staurosporine is used here to induce apoptosis."],"terms":[{"term":"Staurosporine","meaning":"A compound commonly used experimentally to induce apoptosis."},{"term":"Diffuse localization","meaning":"A spread-out staining pattern consistent with release from mitochondria."}],"diagramGuide":["Untreated cells show punctate/reticular green mitochondrial cytochrome c; treated cells show diffuse green cytosolic signal.","Blue nuclei are a positional reference, not the apoptosis readout."]},{"page":213,"topic":"Cell Death and Cell Division","slideInLecture":15,"title":"Apoptosis Detection Video","explain":"This linked video reinforces experimental detection of apoptotic cells. Figure focus: The embedded video is reinforcement for apoptotic morphology.","mustKnow":["Annexin V detects external phosphatidylserine, while diffuse cytochrome c indicates mitochondrial release."],"terms":[{"term":"Apoptosis marker","meaning":"A measurable change used to identify cells undergoing apoptosis."}],"diagramGuide":["The embedded video is reinforcement for apoptotic morphology.","Use shrinkage, blebbing, fragmentation, and loss of attachment as the observable criteria."]},{"page":214,"topic":"Cell Death and Cell Division","slideInLecture":16,"title":"Cell Cycle and Mitosis Overview","explain":"The eukaryotic cell cycle contains interphase—G1, S, and G2—and M phase. DNA and cellular components are duplicated during interphase. Mitosis separates chromosomes, and cytokinesis divides one cell into two genetically identical diploid daughter cells. Figure focus: Read the cycle clockwise G1 -> S -> G2 -> M -> cytokinesis.","mustKnow":["Interphase consists of G1, S, and G2.","DNA is replicated before mitosis.","Mitosis partitions chromosomes.","Cytokinesis physically divides the cell."],"terms":[{"term":"Mitosis","meaning":"Nuclear division that produces genetically equivalent chromosome sets."},{"term":"Cytokinesis","meaning":"Physical division of the cell into two daughters."},{"term":"Interphase","meaning":"G1, S, and G2 phases between cell divisions."}],"diagramGuide":["Read the cycle clockwise G1 -> S -> G2 -> M -> cytokinesis.","Keep chromosome partitioning (mitosis) distinct from physical cell splitting (cytokinesis)."]},{"page":215,"topic":"Cell Death and Cell Division","slideInLecture":17,"title":"Purposes of Mitosis","explain":"Mitosis increases cell number during growth, replaces damaged or worn-out cells, and enables asexual reproduction in organisms such as yeast. Propidium iodide can stain DNA for analysis. Figure focus: Panel A is the phase wheel; panel B links DNA/chromosome form to phase; the histogram is DNA-content measurement after propidium iodide staining.","mustKnow":["Mitosis supports growth and development.","Mitosis replaces and repairs cells.","Mitosis can support asexual reproduction.","Propidium iodide stains DNA."],"terms":[{"term":"Propidium iodide","meaning":"A fluorescent DNA-binding stain."},{"term":"Asexual reproduction","meaning":"Production of offspring without fusion of gametes."}],"diagramGuide":["Panel A is the phase wheel; panel B links DNA/chromosome form to phase; the histogram is DNA-content measurement after propidium iodide staining.","A replicated chromosome has two cohesin-linked sister chromatids but is still counted as one chromosome until separation."]},{"page":216,"topic":"Cell Death and Cell Division","slideInLecture":18,"title":"Interphase and G0","explain":"Interphase occupies most of the cell cycle. G1 supports growth and organelle production, S phase replicates nuclear DNA, and G2 prepares proteins and energy for division. Cells that stop cycling can enter the quiescent G0 state. Figure focus: Use the circular diagram to place DNA replication in S and chromosome segregation in M.","mustKnow":["G1: growth and organelle duplication.","S: DNA replication and sister-chromatid formation.","G2: final preparation for division.","G0: temporary or permanent cell-cycle exit."],"terms":[{"term":"G0","meaning":"A non-dividing, quiescent state outside the active cycle."},{"term":"S phase","meaning":"The phase in which nuclear DNA is replicated."},{"term":"Sister chromatids","meaning":"The two replicated copies of one chromosome."}],"diagramGuide":["Use the circular diagram to place DNA replication in S and chromosome segregation in M.","G0 branches from the proliferative cycle rather than forming part of G1-S-G2-M progression."]},{"page":217,"topic":"Cell Death and Cell Division","slideInLecture":19,"title":"DNA State Across G1, S, and G2","explain":"In G1, each chromosome contains one linear double-stranded DNA molecule. S phase replicates it. In G2, each chromosome has two sister chromatids held together by cohesins. Figure focus: The text contrasts one unreplicated chromosome in G1 with two cohesin-linked sister chromatids after S.","mustKnow":["A G1 chromosome has one DNA double helix.","S phase duplicates the chromosome.","G2 sister chromatids are held together by cohesins."],"terms":[{"term":"Cohesin","meaning":"A protein complex that holds replicated sister chromatids together."},{"term":"Decondensed chromosome","meaning":"A less compact chromosome state typical of interphase."}],"diagramGuide":["The text contrasts one unreplicated chromosome in G1 with two cohesin-linked sister chromatids after S.","The dark video rectangle adds no independent label; the testable feature is DNA state across G1, S, and G2."]},{"page":218,"topic":"Cell Death and Cell Division","slideInLecture":20,"title":"Chromosome Movement During Mitosis","explain":"Mitosis depends on interactions between spindle microtubules and chromosome kinetochores. Chromosomes condense in prophase, spindle microtubules attach in prometaphase, chromosomes align at the midplane in metaphase, and sister chromatids move to opposite poles in anaphase. Figure focus: In the right diagram, homologous chromosomes replicate independently; mitosis separates sister chromatids, not homologous pairs.","mustKnow":["Kinetochores connect chromosomes to spindle microtubules.","Metaphase chromosomes align at the spindle midplane.","Anaphase separates sister chromatids toward opposite poles."],"terms":[{"term":"Kinetochore","meaning":"A chromosome protein structure that binds spindle microtubules."},{"term":"Mitotic spindle","meaning":"The microtubule-based apparatus that separates chromosomes."},{"term":"Prometaphase","meaning":"Stage when spindle microtubules gain access to and attach to chromosomes."}],"diagramGuide":["In the right diagram, homologous chromosomes replicate independently; mitosis separates sister chromatids, not homologous pairs.","In the microscopy sequence, chromosomes condense, attach to spindle, align at the midplane, then move to opposite poles."]},{"page":219,"topic":"Cell Death and Cell Division","slideInLecture":21,"title":"Mitosis Video Reinforcement","explain":"This linked video reviews chromosome condensation, alignment, separation, and formation of daughter cells. Figure focus: Cyan fibers are spindle microtubules; yellow structures are chromosomes/DNA.","mustKnow":["The mitotic sequence is prophase, prometaphase, metaphase, anaphase, and telophase, followed by cytokinesis."],"terms":[{"term":"Mitotic sequence","meaning":"The ordered stages that partition duplicated chromosomes."}],"diagramGuide":["Cyan fibers are spindle microtubules; yellow structures are chromosomes/DNA.","Identify stage from chromosome position relative to spindle poles, not from cell shape alone."]},{"page":220,"topic":"Cell Death and Cell Division","slideInLecture":22,"title":"Prophase","explain":"During prophase, chromosomes condense and become visible as paired sister chromatids. Compaction reduces chromosome length and increases thickness, while transcription largely shuts down. Centrosomes move apart and the mitotic spindle forms; nuclear-envelope breakdown follows at the end of this transition. Figure focus: Compare diffuse interphase chromatin in the top micrograph with thick individualized prophase chromosomes below.","mustKnow":["Chromosomes condense in prophase.","Each replicated chromosome contains two sister chromatids.","Transcription is reduced as chromatin compacts.","The mitotic spindle begins to form."],"terms":[{"term":"Chromosome condensation","meaning":"Compaction that makes chromosomes shorter, thicker, and visibly distinct."},{"term":"Centrosome","meaning":"A microtubule-organizing structure that helps form spindle poles."}],"diagramGuide":["Compare diffuse interphase chromatin in the top micrograph with thick individualized prophase chromosomes below.","The nuclear envelope breaks down late in prophase/prometaphase while centrosomes organize the spindle."]},{"page":221,"topic":"Cell Death and Cell Division","slideInLecture":23,"title":"Metaphase and Kinetochore Attachment","explain":"At metaphase, chromosomes align at the cell equator. Spindle microtubules connect to kinetochores assembled on each chromatid. Kinetochore-associated motors, including dynein, contribute to chromosome movement on the spindle. Figure focus: The micrograph shows chromosomes concentrated at one equatorial plate between opposite spindle poles.","mustKnow":["Metaphase chromosomes align at the equator.","Microtubules attach through kinetochores.","Dynein can help move chromosomes along spindle microtubules."],"terms":[{"term":"Metaphase plate","meaning":"The equatorial plane where chromosomes align."},{"term":"Dynein","meaning":"A microtubule motor involved in chromosome movement."}],"diagramGuide":["The micrograph shows chromosomes concentrated at one equatorial plate between opposite spindle poles.","Spindle microtubules attach through kinetochores assembled at sister chromatids."]},{"page":222,"topic":"Cell Death and Cell Division","slideInLecture":24,"title":"Spindle Attachment Video","explain":"This linked video reinforces how spindle microtubules attach to kinetochores and position chromosomes. Figure focus: The frame is labeled metaphase; chromosome alignment at the equator is the diagnostic feature.","mustKnow":["Kinetochore attachment connects chromosome movement to the mitotic spindle."],"terms":[{"term":"Spindle attachment","meaning":"Binding of spindle microtubules to chromosome kinetochores."}],"diagramGuide":["The frame is labeled metaphase; chromosome alignment at the equator is the diagnostic feature.","Do not confuse metaphase alignment with anaphase poleward separation."]},{"page":223,"topic":"Cell Death and Cell Division","slideInLecture":25,"title":"Anaphase, Telophase, and Cytokinesis","explain":"In anaphase, sister chromatids separate and move to opposite poles. During telophase, a nuclear membrane forms around each chromosome set. Cytokinesis then pinches the cell into two daughter cells. Figure focus: Top micrograph: sister chromatids move toward opposite poles in anaphase. Bottom: chromosome sets are at poles and nuclei reform in telophase.","mustKnow":["Anaphase separates sister chromatids.","Telophase rebuilds daughter nuclei.","Cytokinesis divides the cytoplasm."],"terms":[{"term":"Anaphase","meaning":"Mitotic stage in which sister chromatids move apart."},{"term":"Telophase","meaning":"Stage in which chromosome sets are enclosed in new nuclei."},{"term":"Cytokinesis","meaning":"Division of one cell into two daughter cells."}],"diagramGuide":["Top micrograph: sister chromatids move toward opposite poles in anaphase. Bottom: chromosome sets are at poles and nuclei reform in telophase.","The cleavage furrow/cell pinching belongs to cytokinesis, which overlaps late telophase."]},{"page":224,"topic":"Cell Death and Cell Division","slideInLecture":26,"title":"Mitosis Completion Video","explain":"This linked video reviews the final mitotic stages and physical separation of daughter cells. Figure focus: The frame is labeled prophase and shows condensed material within one cell.","mustKnow":["Nuclear re-formation occurs in telophase, while cell separation occurs by cytokinesis."],"terms":[{"term":"Daughter cell","meaning":"One of the two cells produced by division of a parent cell."}],"diagramGuide":["The frame is labeled prophase and shows condensed material within one cell.","At this stage chromosomes are becoming visible but have not formed a metaphase plate."]},{"page":225,"topic":"Cell Death and Cell Division","slideInLecture":27,"title":"Discovery of a Cytoplasmic Cell-Cycle Factor","explain":"Cytoplasm from a Xenopus oocyte undergoing meiosis was injected into an immature oocyte. The recipient underwent premature germinal-vesicle breakdown and entered meiosis, showing that a transferable cytoplasmic factor can drive maturation. Figure focus: The donor oocyte is at germinal-vesicle-breakdown stage; cytoplasm is extracted and injected into an immature oocyte.","mustKnow":["The experiment transferred cytoplasm between Xenopus oocytes.","Injected cytoplasm triggered premature meiotic entry.","A soluble cytoplasmic factor controls maturation."],"terms":[{"term":"Germinal-vesicle breakdown","meaning":"Breakdown of the oocyte nucleus as meiosis resumes."},{"term":"Maturation-promoting factor","meaning":"Cytoplasmic activity that drives entry into M phase."},{"term":"Xenopus","meaning":"A frog genus widely used in cell-cycle experiments."}],"diagramGuide":["The donor oocyte is at germinal-vesicle-breakdown stage; cytoplasm is extracted and injected into an immature oocyte.","Premature germinal-vesicle breakdown in the recipient proves a transferable cytoplasmic maturation-promoting activity."]},{"page":226,"topic":"Cell Death and Cell Division","slideInLecture":28,"title":"Cyclin-CDK Activity Across the Cell Cycle","explain":"Different cyclin-CDK complexes dominate at different transitions. Cyclin E–CDK2 promotes the G1-to-S transition, Cyclin A with CDK1/CDK2 acts through S and G2, and Cyclin B–CDK1 drives M phase. Figure focus: Left ring maps checkpoints to G1-S, G2-M, and metaphase-anaphase transitions.","mustKnow":["Cyclin E–CDK2 peaks around G1/S.","Cyclin A–CDK activity spans S and G2.","Cyclin B–CDK1 controls entry into M phase."],"terms":[{"term":"Cyclin","meaning":"A regulatory protein whose level changes during the cell cycle."},{"term":"CDK","meaning":"A cyclin-dependent kinase that phosphorylates cell-cycle targets."},{"term":"G1/S transition","meaning":"Commitment point for entering DNA synthesis."}],"diagramGuide":["Left ring maps checkpoints to G1-S, G2-M, and metaphase-anaphase transitions.","Right graph shows sequential cyclin-CDK waves: Cyclin E-CDK2, Cyclin A-CDK1/CDK2, then Cyclin B-CDK1."]},{"page":227,"topic":"Cell Death and Cell Division","slideInLecture":29,"title":"RB1 Controls the G1-to-S Checkpoint","explain":"Active, hypophosphorylated pRb binds and inhibits E2F transcription factors, preventing premature S-phase entry. Loss of both RB1 copies removes this control, allowing uncontrolled proliferation and predisposing to retinoblastoma and other cancers. Figure focus: Read the causal chain: hypophosphorylated pRb binds E2F -> S-phase genes stay off; loss of both RB1 copies -> E2F control is lost -> proliferation.","mustKnow":["Active pRb blocks E2F.","pRb controls the G1-to-S checkpoint.","Loss of both RB1 copies removes cell-cycle restraint.","RB1 loss is linked to retinoblastoma."],"terms":[{"term":"RB1","meaning":"A tumor-suppressor gene encoding the pRb cell-cycle regulator."},{"term":"E2F","meaning":"A family of transcription factors that promotes S-phase gene expression."},{"term":"Hypophosphorylated pRb","meaning":"The active form of pRb that binds and inhibits E2F."}],"diagramGuide":["Read the causal chain: hypophosphorylated pRb binds E2F -> S-phase genes stay off; loss of both RB1 copies -> E2F control is lost -> proliferation.","The named primary tumor is retinal; osteosarcoma and soft-tissue sarcoma are additional risks."]},{"page":228,"topic":"Cell Death and Cell Division","slideInLecture":30,"title":"Apoptosis Reference","explain":"The slide points to Gerald Karp's Cell and Molecular Biology as the reference for deeper coverage of apoptosis. Figure focus: This is a bibliography slide with no new pathway diagram.","mustKnow":["Use the reference only when a slide concept needs clarification; the examinable framework remains the apoptosis sequence and pathways presented here."],"terms":[{"term":"Reference textbook","meaning":"A source for expanded explanation beyond the lecture slide."}],"diagramGuide":["This is a bibliography slide with no new pathway diagram.","Retain the cited author/textbook only if your exam tests references."]},{"page":229,"topic":"Stem Cells and Differentiation","slideInLecture":1,"title":"Stem Cells, Differentiation, and Apoptosis","explain":"This title slide introduces the lecture's three connected themes: cells that self-renew, acquisition of specialized cell identity, and regulated cell removal. Figure focus: This is the title slide for stem cells, differentiation, and apoptosis.","mustKnow":["The lecture links stem-cell potency, differentiation, and cell fate."],"terms":[{"term":"Stem cell","meaning":"An unspecialized cell capable of self-renewal and differentiation."},{"term":"Differentiation","meaning":"Acquisition of a specialized cell structure and function."}],"diagramGuide":["This is the title slide for stem cells, differentiation, and apoptosis.","The salamander image signals regeneration but supplies no labeled mechanism."]},{"page":230,"topic":"Stem Cells and Differentiation","slideInLecture":2,"title":"Hematopoietic Differentiation Tree","explain":"The diagram shows a multipotent hematopoietic stem cell branching into common myeloid and common lymphoid progenitors. These branches generate red cells, platelets, granulocytes, monocytes/macrophages, B cells, T cells, and natural killer cells. Figure focus: Start at the multipotent hematopoietic stem cell and split into common myeloid versus common lymphoid progenitors.","mustKnow":["One hematopoietic stem cell can generate multiple blood-cell types.","The first major branches are myeloid and lymphoid progenitors.","B cells, T cells, and natural killer cells arise from the lymphoid branch.","Erythrocytes, megakaryocytes, granulocytes, and monocytes arise from the myeloid branch."],"terms":[{"term":"Hematopoietic stem cell","meaning":"A multipotent stem cell that produces blood-cell lineages."},{"term":"Myeloid progenitor","meaning":"A precursor for erythroid, megakaryocyte, granulocyte, mast-cell, and monocyte lineages."},{"term":"Lymphoid progenitor","meaning":"A precursor for B, T, and natural killer cell lineages."}],"diagramGuide":["Start at the multipotent hematopoietic stem cell and split into common myeloid versus common lymphoid progenitors.","Trace terminal branches: megakaryocyte -> thrombocytes; monocyte -> macrophage; B lymphocyte -> plasma cell; lymphoid branch also yields T and NK cells."]},{"page":231,"topic":"Stem Cells and Differentiation","slideInLecture":3,"title":"Development Before Birth","explain":"This linked video introduces the developmental journey from a fertilized egg to a multicellular organism. Figure focus: The video is developmental overview, not a labeled still.","mustKnow":["Development transforms one fertilized cell into many organized, specialized cell types."],"terms":[{"term":"Development","meaning":"The ordered process by which an organism grows and forms specialized tissues."}],"diagramGuide":["The video is developmental overview, not a labeled still.","Use the subsequent slides for testable stages: zygote, cleavage/blastulation, gastrulation, and differentiation."]},{"page":232,"topic":"Stem Cells and Differentiation","slideInLecture":4,"title":"Beating Cardiomyocytes in Culture","explain":"The linked example shows differentiated heart-muscle cells beating in a culture dish. Their contraction is a visible specialized function acquired through differentiation. Figure focus: The field shows cultured cardiomyocytes; beating demonstrates acquisition of a specialized muscle-cell function.","mustKnow":["Cardiomyocytes are differentiated cells specialized for contraction.","A specialized phenotype can be observed in cultured cells."],"terms":[{"term":"Cardiomyocyte","meaning":"A heart-muscle cell specialized for contraction."},{"term":"Culture","meaning":"Growth and maintenance of cells under controlled laboratory conditions."}],"diagramGuide":["The field shows cultured cardiomyocytes; beating demonstrates acquisition of a specialized muscle-cell function.","Functional contraction is stronger differentiation evidence than cell shape alone."]},{"page":233,"topic":"Stem Cells and Differentiation","slideInLecture":5,"title":"What Is Differentiation?","explain":"Differentiation converts unspecialized cells into cells with distinct structures and functions. Nerve cells conduct signals, muscle cells generate force, and red blood cells transport oxygen, yet all ultimately descend from the zygote. Figure focus: Read the vertical direction as normal development from zygote/blastocyst to organism; the reverse arrow represents experimental reprogramming.","mustKnow":["Differentiation creates specialized morphology and physiology.","Different cell types perform different functions.","All cell types of the organism originate from the zygote."],"terms":[{"term":"Zygote","meaning":"The single fertilized egg cell from which the organism develops."},{"term":"Cellular differentiation","meaning":"The process by which an unspecialized cell becomes specialized."}],"diagramGuide":["Read the vertical direction as normal development from zygote/blastocyst to organism; the reverse arrow represents experimental reprogramming.","Bottom branches show pluripotent cells directed toward ectoderm, mesoderm, or endoderm by different signals."]},{"page":234,"topic":"Stem Cells and Differentiation","slideInLecture":6,"title":"Fate, Potency, Determination, and Differentiation","explain":"Cell fate is what a cell normally becomes. Potency is the range of cell types it could become. Development progressively restricts potency. Determination commits a cell to a fate before visible specialization, and differentiation later produces the recognizable specialized phenotype. Figure focus: Treat the terms as a sequence: potency is what a cell can become; determination fixes a fate before visible change; differentiation produces the specialized phenotype.","mustKnow":["Fate means the normal developmental outcome.","Potency means the range of possible outcomes.","Determination precedes visible differentiation.","Development usually reduces potency over time."],"terms":[{"term":"Cell fate","meaning":"The cell type a cell will normally become."},{"term":"Potency","meaning":"The range of cell types a cell can potentially generate."},{"term":"Determination","meaning":"Commitment to a developmental fate before visible specialization."},{"term":"Differentiation","meaning":"Execution of a specialized cell program and phenotype."}],"diagramGuide":["Treat the terms as a sequence: potency is what a cell can become; determination fixes a fate before visible change; differentiation produces the specialized phenotype.","A determined cell may still resemble undetermined neighbors morphologically."]},{"page":235,"topic":"Stem Cells and Differentiation","slideInLecture":7,"title":"Hierarchy of Developmental Potency","explain":"Stem-cell potency narrows through a hierarchy. Totipotent cells can form all embryonic and supporting tissues needed for an organism; pluripotent cells can form the body's many tissue types but not a complete organism; multipotent and oligopotent cells are progressively more lineage restricted; unipotent cells generate one cell type. Figure focus: Order categories by decreasing breadth: totipotent -> pluripotent -> multipotent -> oligopotent -> unipotent.","mustKnow":["Totipotent has the broadest potential.","Pluripotent cells form many body cell types but not a whole organism by themselves.","Multipotent and oligopotent cells are lineage restricted.","Unipotent cells generate one cell type."],"terms":[{"term":"Totipotent","meaning":"Able to generate all embryonic and extraembryonic cell types needed for a complete organism."},{"term":"Pluripotent","meaning":"Able to generate cell types from all major body lineages but not a complete organism alone."},{"term":"Multipotent","meaning":"Able to generate several cell types within a limited lineage range."},{"term":"Unipotent","meaning":"Able to generate only one mature cell type."}],"diagramGuide":["Order categories by decreasing breadth: totipotent -> pluripotent -> multipotent -> oligopotent -> unipotent.","Use definitions rather than the slide's questionable example assigning hematopoietic stem cells to pluripotency; standard biology classifies them as multipotent."]},{"page":236,"topic":"Stem Cells and Differentiation","slideInLecture":8,"title":"Clonality and Clonal Expansion","explain":"A clone is a group of cells descended from one original cell. Clonal expansion occurs when that founder cell repeatedly divides, producing many genetically related descendants. Figure focus: Follow one lymphocyte clone: diversity is generated first, one antigen-matching clone is selected, and that clone expands.","mustKnow":["Clonality traces cells back to one founder.","Clonal expansion increases the number of descendants from that founder."],"terms":[{"term":"Clone","meaning":"A population of cells descended from one original cell."},{"term":"Clonal expansion","meaning":"Repeated division that enlarges a clone."}],"diagramGuide":["Follow one lymphocyte clone: diversity is generated first, one antigen-matching clone is selected, and that clone expands.","Cells labeled 2 share specificity; expansion increases number, not receptor diversity."]},{"page":237,"topic":"Stem Cells and Differentiation","slideInLecture":9,"title":"Differentiation from a Totipotent Starting Cell","explain":"The slide emphasizes that early totipotent cells begin with broad potential and generate increasingly specialized descendants through differentiation. Figure focus: The tree narrows from one high-potency state at the apex to many fixed differentiated endpoints at the base.","mustKnow":["Differentiation moves cells from broad potential toward specialized identity.","Totipotency is associated with the earliest embryonic cells."],"terms":[{"term":"Lineage restriction","meaning":"Progressive narrowing of the cell types a developing cell can produce."}],"diagramGuide":["The tree narrows from one high-potency state at the apex to many fixed differentiated endpoints at the base.","The arrows encode an inverse relation: differentiation increases downward while potency decreases."]},{"page":238,"topic":"Stem Cells and Differentiation","slideInLecture":10,"title":"Differential Gene Expression Drives Differentiation","explain":"Differentiated cells behave differently because they express different subsets of genes. Different gene-expression patterns produce different protein sets, which create different structures and functions even though cells generally contain the same genome. Figure focus: Compare heat-map color patterns between progenitor groups rather than reading every gene name.","mustKnow":["Differentiation depends on differential gene expression.","Different expressed genes produce different protein complements.","Cell identity is determined by which genes are active, not by wholesale replacement of the genome."],"terms":[{"term":"Differential gene expression","meaning":"Activation of different gene subsets in different cells."},{"term":"Proteome","meaning":"The set of proteins present in a cell under particular conditions."}],"diagramGuide":["Compare heat-map color patterns between progenitor groups rather than reading every gene name.","Different rows changing between cell types illustrate differential gene expression producing different protein sets."]},{"page":239,"topic":"Stem Cells and Differentiation","slideInLecture":11,"title":"Blastulation","explain":"Blastulation is an early developmental stage in which cleavage-stage cells organize into a blastula or blastocyst with a fluid-filled cavity. In mammals, this stage separates the inner cell mass from the outer trophoblast. Figure focus: Follow cleavage from few blastomeres to morula and then blastocyst.","mustKnow":["Blastulation follows early cleavage divisions.","It produces a hollow early embryo.","The mammalian inner cell mass gives rise to the embryo proper."],"terms":[{"term":"Blastula","meaning":"An early embryo organized around a fluid-filled cavity."},{"term":"Blastocyst","meaning":"The mammalian blastula containing an inner cell mass and outer trophoblast."},{"term":"Blastocoel","meaning":"The fluid-filled cavity of the blastula."}],"diagramGuide":["Follow cleavage from few blastomeres to morula and then blastocyst.","In the blastocyst diagram, outer trophoblast surrounds the blastocoel; the inner cell mass sits asymmetrically inside."]},{"page":240,"topic":"Stem Cells and Differentiation","slideInLecture":12,"title":"Inner Cell Mass and Embryonic Stem Cells","explain":"The inner cell mass of the mammalian blastocyst contains cells that form the embryo proper. Embryonic stem-cell lines can be derived from these cells and retain pluripotency under suitable culture conditions. Figure focus: The XYClone laser is shown as a tool for isolating the inner cell mass.","mustKnow":["Embryonic stem cells are associated with the inner cell mass.","Inner-cell-mass cells contribute to the embryo proper.","Embryonic stem cells are pluripotent."],"terms":[{"term":"Inner cell mass","meaning":"The blastocyst cell group that gives rise to the embryo proper."},{"term":"Embryonic stem cell","meaning":"A pluripotent cell derived from the early embryo and maintained in culture."}],"diagramGuide":["The XYClone laser is shown as a tool for isolating the inner cell mass.","Embryonic stem-cell derivation uses inner-cell-mass cells, not trophoblast or blastocoel fluid."]},{"page":241,"topic":"Stem Cells and Differentiation","slideInLecture":13,"title":"Gastrulation","explain":"Gastrulation reorganizes the early embryo and establishes the primary germ layers. These layers later generate the tissues and organs of the body. Figure focus: Left diagram labels trophoblast, blastocoel, and inner cell mass before gastrulation; right sequence shows coordinated cell spreading/inward movement.","mustKnow":["Gastrulation reorganizes the blastula-stage embryo.","Gastrulation establishes ectoderm, mesoderm, and endoderm in triploblastic animals."],"terms":[{"term":"Gastrulation","meaning":"Early embryonic reorganization that establishes primary germ layers."},{"term":"Germ layer","meaning":"An early embryonic tissue layer that produces defined sets of organs."}],"diagramGuide":["Left diagram labels trophoblast, blastocoel, and inner cell mass before gastrulation; right sequence shows coordinated cell spreading/inward movement.","Gastrulation reorganizes a hollow embryo and establishes germ layers rather than simply increasing cell number."]},{"page":242,"topic":"Stem Cells and Differentiation","slideInLecture":14,"title":"Gastrulation Video Reinforcement","explain":"This linked video visualizes the cell movements that reorganize the early embryo during gastrulation. Figure focus: The historical video frame introduces classic embryology experiments.","mustKnow":["Gastrulation uses coordinated cell movement to establish germ-layer organization."],"terms":[{"term":"Morphogenetic movement","meaning":"Coordinated movement of cells that changes embryonic form."}],"diagramGuide":["The historical video frame introduces classic embryology experiments.","Treat it as context for transplantation/fate experiments discussed around slides 241-244."]},{"page":243,"topic":"Stem Cells and Differentiation","slideInLecture":15,"title":"Testing Whether Cell Behavior Is Retained","explain":"The slide asks whether cells preserve their characteristic developmental behavior outside the original embryo. This motivates transplantation and culture experiments that test whether a cell's behavior is intrinsic, imposed by its environment, or both. Figure focus: The bright sheet spreading over the blastocoel roof is the behavior being tested outside the original embryo.","mustKnow":["Cell behavior can be tested by changing the cell's environment.","Retention of behavior outside the embryo supports a stable internal developmental state."],"terms":[{"term":"Cell-autonomous behavior","meaning":"Behavior maintained by properties within the cell itself."},{"term":"Developmental environment","meaning":"External signals and neighboring tissues that influence cell behavior."}],"diagramGuide":["The bright sheet spreading over the blastocoel roof is the behavior being tested outside the original embryo.","Persistence after transplantation/culture supports a stable determined state; altered behavior would support environmental instruction."]},{"page":244,"topic":"Stem Cells and Differentiation","slideInLecture":16,"title":"The Three Germ Layers","explain":"Gastrulation establishes germ layers. Endoderm contributes to the digestive
