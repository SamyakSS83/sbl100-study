tract, liver, and pancreas; mesoderm contributes to kidney, cartilage, bone, spleen, and circulatory and lymphatic systems; ectoderm contributes to hair, nails, nervous system, and retina. Figure focus: Organize the text into a three-column map: ectoderm, mesoderm, endoderm and their derivatives.","mustKnow":["Endoderm: digestive tract, liver, pancreas.","Mesoderm: bone, cartilage, kidney, blood-associated systems.","Ectoderm: nervous system, retina, hair, and nails.","Diploblasts have two primary layers; triploblasts have three."],"terms":[{"term":"Endoderm","meaning":"Inner germ layer that forms much of the digestive tract and associated organs."},{"term":"Mesoderm","meaning":"Middle germ layer that forms muscle, bone, blood, kidney, and related tissues."},{"term":"Ectoderm","meaning":"Outer germ layer that forms the nervous system and external body structures."},{"term":"Triploblastic","meaning":"Having ectoderm, mesoderm, and endoderm."}],"diagramGuide":["Organize the text into a three-column map: ectoderm, mesoderm, endoderm and their derivatives.","The slide distinguishes diploblasts (two layers) from triploblasts such as mammals (three layers)."]},{"page":245,"topic":"Stem Cells and Differentiation","slideInLecture":17,"title":"Till and McCulloch Bone-Marrow Experiment","explain":"Whole-body irradiation damaged the mice's blood-forming system. Intravenous bone-marrow transplantation rescued survival in proportion to the number of marrow cells injected, supporting the presence of rare, consistently represented marrow cells with regenerative capacity. Figure focus: Top flow is experimental design: irradiate mice -> inject graded bone-marrow doses -> measure survival.","mustKnow":["The recipients were whole-body irradiated mice.","Bone-marrow cells were injected intravenously.","More injected marrow cells correlated with greater survival.","The result supported a rare regenerative cell population in marrow."],"terms":[{"term":"Bone marrow","meaning":"Tissue containing blood-forming stem and progenitor cells."},{"term":"Hematopoietic regeneration","meaning":"Restoration of blood-cell production after damage."},{"term":"Irradiation","meaning":"Radiation treatment used here to destroy endogenous blood-forming cells."}],"diagramGuide":["Top flow is experimental design: irradiate mice -> inject graded bone-marrow doses -> measure survival.","In the left graph, survival changes with injected cell number; this dose-response supports rare regenerative units in marrow."]},{"page":246,"topic":"Stem Cells and Differentiation","slideInLecture":18,"title":"Mauro and the Muscle Satellite Cell","explain":"Electron microscopy of frog muscle revealed satellite cells next to muscle fibers. Mauro proposed that these cells were either precursors capable of producing muscle cells or remnants of embryonic development; later work established their role as muscle stem cells. Figure focus: The TEM shows a small satellite cell positioned beside a frog muscle fiber.","mustKnow":["Satellite cells were identified by microscopy in muscle.","They were proposed as possible muscle-cell precursors.","Satellite cells are associated with muscle regeneration."],"terms":[{"term":"Satellite cell","meaning":"A muscle-associated stem cell that can generate muscle-lineage cells."},{"term":"TEM","meaning":"Transmission electron microscopy, used to view cell ultrastructure."},{"term":"Precursor cell","meaning":"A cell capable of producing a more differentiated descendant."}],"diagramGuide":["The TEM shows a small satellite cell positioned beside a frog muscle fiber.","The 1961 interpretation offered two alternatives: muscle precursor or embryonic remnant; later evidence supports the precursor/stem-cell role."]},{"page":247,"topic":"Stem Cells and Differentiation","slideInLecture":19,"title":"Defining Properties of Stem Cells","explain":"Stem cells combine long-term proliferative capacity with self-renewal and differentiation. Their output depends on their potency: embryonic stem cells generate all body cell types, while tissue-specific adult stem cells generate cells of their own tissue. Many adult stem cells spend time in a low-activity quiescent state. Figure focus: Group the list into defining capacities (self-renewal, differentiation, long-term proliferation) and physiological state (often quiescent).","mustKnow":["Stem cells self-renew.","Stem cells generate differentiated descendants.","Adult stem cells reside in tissues and usually have restricted output.","Many stem cells can remain quiescent."],"terms":[{"term":"Self-renewal","meaning":"Division that preserves the stem-cell population."},{"term":"Quiescence","meaning":"A reversible low-activity, non-dividing state."},{"term":"Adult stem cell","meaning":"A tissue-resident stem cell that maintains or repairs a limited set of cell types."}],"diagramGuide":["Group the list into defining capacities (self-renewal, differentiation, long-term proliferation) and physiological state (often quiescent).","Contrast broad ESC output with tissue-restricted adult stem-cell output."]},{"page":248,"topic":"Stem Cells and Differentiation","slideInLecture":20,"title":"Mature Cells Can Be Reprogrammed","explain":"The slide highlights the 2012 Nobel Prize awarded to John B. Gurdon and Shinya Yamanaka for showing that mature cells can be reprogrammed to a pluripotent state. Differentiation is therefore not necessarily an irreversible loss of genetic potential. Figure focus: The two portraits are John Gurdon and Shinya Yamanaka; the citation is the 2012 Nobel Prize in Physiology or Medicine.","mustKnow":["Gurdon and Yamanaka shared the 2012 Nobel Prize in Physiology or Medicine.","Their work showed that mature cells can be reprogrammed.","Reprogrammed mature cells can regain pluripotency."],"terms":[{"term":"Reprogramming","meaning":"Resetting a differentiated cell's gene-expression state toward an earlier developmental potential."},{"term":"Induced pluripotency","meaning":"Acquisition of pluripotent properties by a previously differentiated cell."}],"diagramGuide":["The two portraits are John Gurdon and Shinya Yamanaka; the citation is the 2012 Nobel Prize in Physiology or Medicine.","The shared concept is reprogramming mature cells to pluripotency by two different experimental routes."]},{"page":249,"topic":"Stem Cells and Differentiation","slideInLecture":21,"title":"Gurdon's Somatic Cell Nuclear Transfer","explain":"Gurdon transferred nuclei from differentiated tadpole intestinal cells into enucleated Xenopus eggs. A small fraction developed into normal tadpoles, showing that a differentiated nucleus can still contain the genetic information needed to direct an entire organism when reset by egg cytoplasm. Figure focus: Follow source boxes into the enucleated Xenopus egg, then read the developmental outcome.","mustKnow":["The donor nucleus came from differentiated intestinal epithelium.","The recipient was an enucleated Xenopus egg.","Some transplants produced normal tadpoles.","Differentiation does not normally delete the genome needed for development."],"terms":[{"term":"Somatic cell nuclear transfer","meaning":"Transfer of a body-cell nucleus into an egg whose nucleus has been removed."},{"term":"Enucleated egg","meaning":"An egg cell from which the nucleus has been removed."},{"term":"Nuclear reprogramming","meaning":"Resetting a differentiated nucleus to support an earlier developmental program."}],"diagramGuide":["Follow source boxes into the enucleated Xenopus egg, then read the developmental outcome.","The one-nucleolus mutation is a lineage marker proving offspring nuclei came from the differentiated donor rather than residual egg nucleus."]},{"page":250,"topic":"Stem Cells and Differentiation","slideInLecture":22,"title":"Dolly the Sheep","explain":"Dolly was produced by somatic cell nuclear transfer using a nucleus from an adult mammary cell and an enucleated egg. Her birth demonstrated that an adult somatic nucleus can be reprogrammed to support mammalian development. Figure focus: The TIME cover identifies Dolly and the year 1997.","mustKnow":["Dolly was produced by somatic cell nuclear transfer.","The donor nucleus came from an adult somatic cell.","An enucleated egg provided the reprogramming cytoplasm.","Dolly provided mammalian evidence for nuclear reprogramming."],"terms":[{"term":"Dolly","meaning":"The first mammal cloned from an adult somatic-cell nucleus."},{"term":"Clone","meaning":"An organism or cell population derived from one genetic source."},{"term":"Somatic nucleus","meaning":"The nucleus of a non-germline body cell."}],"diagramGuide":["The TIME cover identifies Dolly and the year 1997.","Dolly is the mammalian extension of somatic-cell nuclear reprogramming, not an iPSC experiment."]},{"page":251,"topic":"Stem Cells and Differentiation","slideInLecture":23,"title":"Induced pluripotent stem cells: the Yamanaka factors","explain":"Yamanaka reprogrammed differentiated mouse fibroblasts into stem-cell-like cells by delivering selected transcription-factor genes with retroviral vectors. The minimum four-factor combination was Oct3/4, Sox2, c-Myc and Klf4, often abbreviated OSKM. Figure focus: Follow the boxes: differentiated mouse embryonic fibroblasts + retroviral candidate genes -> stem-cell-like colonies.","mustKnow":["iPSCs are differentiated cells reprogrammed back to a pluripotent state.","The four Yamanaka factors are Oct3/4, Sox2, c-Myc and Klf4.","The starting cells shown are mouse embryonic fibroblasts."],"terms":[{"term":"iPSC","meaning":"Induced pluripotent stem cell made by reprogramming a differentiated cell."},{"term":"OSKM","meaning":"Oct3/4, Sox2, Klf4 and c-Myc."},{"term":"Retroviral vector","meaning":"A modified virus used here to deliver reprogramming genes into cells."},{"term":"Pluripotent","meaning":"Able to produce nearly every cell type of the body."}],"diagramGuide":["Follow the boxes: differentiated mouse embryonic fibroblasts + retroviral candidate genes -> stem-cell-like colonies.","The micrographs compare ES cells, an iPS clone, and parental MEFs; colony morphology shifts toward ES-like appearance after reprogramming."]},{"page":252,"topic":"Stem Cells and Differentiation","slideInLecture":24,"title":"How the four reprogramming factors were identified","explain":"The graphs show a stepwise elimination experiment. Researchers began with 24 candidate factors, removed factors one at a time, narrowed the active set to 10, and then tested smaller combinations. Loss of colony formation identified factors required for reprogramming, leading to the four-factor OSKM set. Figure focus: Panel A removes one of 24 factors, panel B removes one of a narrowed 10, and panel C tests three-, two-, and four-factor mixtures.","mustKnow":["Candidate factors were narrowed by systematic removal and colony-count assays.","A sharp fall in colonies after removing a factor indicates that factor is important.","Four factors were sufficient; two- or three-factor combinations were much less effective."],"terms":[{"term":"Colony assay","meaning":"A test that counts groups of successfully reprogrammed, proliferating cells."},{"term":"Candidate factor","meaning":"A gene tested for a possible role in reprogramming."},{"term":"Factor elimination","meaning":"Removing one factor from a mixture to test whether it is required."}],"diagramGuide":["Panel A removes one of 24 factors, panel B removes one of a narrowed 10, and panel C tests three-, two-, and four-factor mixtures.","A sharp colony decrease on factor removal implies necessity; retained colonies after reduction imply sufficiency of the remaining combination."]},{"page":253,"topic":"Stem Cells and Differentiation","slideInLecture":25,"title":"Tests used to validate iPSCs","explain":"A useful iPSC line should retain a normal chromosome set and show pluripotency. A normal karyotype checks chromosome number and structure. Teratoma formation after transplantation is a classic functional test because a teratoma can contain tissues derived from multiple germ layers. Figure focus: Left image is a karyotype for chromosome integrity; right panels show tissues such as heart, gut, liver, gonad, neural tube, and skin in a teratoma.","mustKnow":["Karyotyping checks chromosome number and large structural abnormalities.","Teratoma formation is evidence that candidate iPSCs can form diverse tissue types.","Genetic stability and pluripotency are separate properties and both must be checked."],"terms":[{"term":"Karyotype","meaning":"An ordered display of a cell's chromosomes."},{"term":"Teratoma","meaning":"A tumor containing several tissue types, used experimentally as a pluripotency test."},{"term":"Germ layers","meaning":"Ectoderm, mesoderm and endoderm, which generate the body's tissues."}],"diagramGuide":["Left image is a karyotype for chromosome integrity; right panels show tissues such as heart, gut, liver, gonad, neural tube, and skin in a teratoma.","The two tests answer different questions: genetic stability versus multilineage differentiation capacity."]},{"page":254,"topic":"Stem Cells and Differentiation","slideInLecture":26,"title":"Why iPSCs changed biomedical research","explain":"iPSCs avoid many ethical issues associated with obtaining embryonic stem cells and can be made from a particular patient. They enable patient-specific disease models, drug screening on relevant differentiated cells, and possible gene correction followed by replacement of diseased tissue. Figure focus: Group applications into modeling/testing (patient disease models, drug screens) and future intervention (gene correction, tissue engineering, transplantation).","mustKnow":["iPSCs provide an alternative to embryonic stem cells.","Patient-derived iPSCs can model that patient's disease.","Directed differentiation produces target cells for drug testing.","CRISPR plus iPSCs offers a possible route to gene correction and cell replacement."],"terms":[{"term":"Disease model","meaning":"A laboratory system that reproduces important features of a disease."},{"term":"Directed differentiation","meaning":"Guiding stem cells toward a chosen mature cell type."},{"term":"Gene correction","meaning":"Repairing a disease-causing DNA sequence."},{"term":"Tissue engineering","meaning":"Combining cells and materials to build or restore tissue."}],"diagramGuide":["Group applications into modeling/testing (patient disease models, drug screens) and future intervention (gene correction, tissue engineering, transplantation).","Patient-derived iPSCs preserve the donor genotype while directed differentiation supplies the disease-relevant cell type."]},{"page":255,"topic":"Stem Cells and Differentiation","slideInLecture":27,"title":"Starting optic-cup development from embryonic stem cells","explain":"Mouse embryonic stem cells were grown as a three-dimensional embryoid body under conditions that favor retinal development. Matrix proteins supplied structural support, while Activin promoted the retinal-field gene Rx. GFP made Rx-positive regions visible as spherical outgrowths. Figure focus: Read the timeline Day 1 -> Day 5 -> Day 7 -> Day 9: ES aggregate -> Rx-positive neuroepithelium -> evagination/spherical vesicle -> invagination and neural-retina/RPE pattern.","mustKnow":["Activin was used to induce Rx expression.","Rx-positive cells were visualized by GFP.","The culture produced spherical evaginations that begin optic-cup morphogenesis."],"terms":[{"term":"Embryoid body","meaning":"A three-dimensional aggregate of pluripotent stem cells that can begin organized differentiation."},{"term":"Rx/Rax","meaning":"A transcription factor important in early eye and retinal development."},{"term":"GFP","meaning":"Green fluorescent protein used as a visible reporter of gene expression."},{"term":"Matrigel","meaning":"A protein-rich matrix that supports three-dimensional cell growth."}],"diagramGuide":["Read the timeline Day 1 -> Day 5 -> Day 7 -> Day 9: ES aggregate -> Rx-positive neuroepithelium -> evagination/spherical vesicle -> invagination and neural-retina/RPE pattern.","Green signal is Rx-GFP; red/blue outlines mark apical-basal organization in the schematic."]},{"page":256,"topic":"Stem Cells and Differentiation","slideInLecture":28,"title":"Self-organization into an optic cup","explain":"The Rx-positive vesicles change shape over time without being manually sculpted. By about day 9, the initially spherical retinal tissue bends inward and develops the characteristic cup-like architecture of the early eye. Figure focus: Compare Day 7 spherical vesicle with Day 9 cup; green Rx-GFP identifies retinal tissue throughout.","mustKnow":["Rx-positive spherical vesicles develop into optic cups.","The characteristic cup shape appears at approximately day 9.","The experiment demonstrates self-organizing morphogenesis in a 3D culture."],"terms":[{"term":"Morphogenesis","meaning":"The biological process that generates tissue shape and structure."},{"term":"Evagination","meaning":"Outward bulging of a tissue layer."},{"term":"Invagination","meaning":"Inward folding of a tissue layer."}],"diagramGuide":["Compare Day 7 spherical vesicle with Day 9 cup; green Rx-GFP identifies retinal tissue throughout.","The shape change is self-organized morphogenesis, not manual folding."]},{"page":257,"topic":"Stem Cells and Differentiation","slideInLecture":29,"title":"Neural retina and pigment epithelium separate","explain":"Different parts of the optic vesicle acquire different marker profiles. The invaginating distal layer expresses neural-retina markers such as Chx10 together with Rx and Pax6. The proximal outer layer expresses markers including Mitf and Otx2 and later becomes pigmented, resembling retinal pigment epithelium. Figure focus: Follow phases 1-4 from spherical vesicle through distal flattening, flexure, and apically convex invagination.","mustKnow":["Distal invaginated tissue becomes neural retina.","The outer proximal epithelium becomes retinal pigment epithelium (RPE).","Chx10 marks neural-retina progenitors; Mitf and Otx2 support RPE identity.","Pigmentation of the outer layer is visible by about day 12."],"terms":[{"term":"Chx10","meaning":"A marker associated with neural-retina progenitor cells."},{"term":"RPE","meaning":"Retinal pigment epithelium, the pigmented support layer outside the neural retina."},{"term":"Mitf","meaning":"A transcription factor associated here with RPE development."},{"term":"Pax6","meaning":"A transcription factor with a central role in eye development."}],"diagramGuide":["Follow phases 1-4 from spherical vesicle through distal flattening, flexure, and apically convex invagination.","Distal invaginated layer carries neural-retina markers (Chx10, Rx, Pax6); proximal outer shell carries RPE markers and pigments by Day 12."]},{"page":258,"topic":"Stem Cells and Differentiation","slideInLecture":30,"title":"Reference for apoptosis","explain":"This is a reference slide rather than new examinable content. It points to Gerald Karp's Cell and Molecular Biology for additional detail on apoptosis. Figure focus: This bibliography slide repeats the apoptosis reference and adds no stem-cell mechanism.","mustKnow":["The cited topic is apoptosis.","The cited textbook author is Gerald Karp."],"terms":[{"term":"Apoptosis","meaning":"A regulated program of cell death."}],"diagramGuide":["This bibliography slide repeats the apoptosis reference and adds no stem-cell mechanism.","Do not infer new optic-cup facts from this slide."]},{"page":259,"topic":"Host Pathogen Interaction","slideInLecture":1,"title":"Host–pathogen interaction","explain":"This lecture introduces how host defenses detect and eliminate infectious agents and how pathogens enter, attach, evade immunity and damage the host. Figure focus: This is the title slide for host-pathogen interaction.","mustKnow":["Host–pathogen interaction includes both immune defense and microbial disease mechanisms."],"terms":[{"term":"Host","meaning":"The organism in or on which another organism lives."},{"term":"Pathogen","meaning":"A microbe capable of causing disease."}],"diagramGuide":["This is the title slide for host-pathogen interaction.","Use it as a section boundary; specific immune-cell lineages begin on the next slide."]},{"page":260,"topic":"Host Pathogen Interaction","slideInLecture":2,"title":"Where blood cells form","explain":"Blood-cell production is called hematopoiesis. In adults, it occurs mainly in bone marrow. Lymphocytes also mature or become activated in lymphoid organs such as the thymus, lymph nodes, spleen and tonsils. Figure focus: Locate primary blood-cell production in bone marrow, then distinguish lymphoid tissues shown around the body.","mustKnow":["Adult blood cells are produced mainly in bone marrow.","The thymus is important for T-cell maturation.","The spleen and lymph nodes are lymphoid organs, not the primary source of all blood cells."],"terms":[{"term":"Hematopoiesis","meaning":"Formation of blood cells from stem and progenitor cells."},{"term":"Bone marrow","meaning":"Soft tissue inside bones and the main adult site of blood-cell production."},{"term":"Lymphoid organ","meaning":"An organ where immune cells develop, reside or respond to antigens."}],"diagramGuide":["Locate primary blood-cell production in bone marrow, then distinguish lymphoid tissues shown around the body.","Thymus supports T-cell maturation; lymph nodes, spleen, and tonsils organize immune-cell residence/activation rather than making all blood cells."]},{"page":261,"topic":"Host Pathogen Interaction","slideInLecture":3,"title":"The blood-cell lineage tree","explain":"A multipotent hematopoietic stem cell branches into common myeloid and common lymphoid progenitors. The myeloid branch produces erythrocytes, platelets, mast cells, granulocytes and monocytes/macrophages. The lymphoid branch produces B cells, T cells and natural killer cells.","mustKnow":["All blood-cell lineages begin from hematopoietic stem cells.","Neutrophils, monocytes and macrophages belong to the myeloid branch.","B cells, T cells and NK cells belong to the lymphoid branch.","Monocytes can differentiate into macrophages."],"terms":[{"term":"Progenitor","meaning":"A partially specialized precursor that produces a restricted set of cell types."},{"term":"Myeloid lineage","meaning":"Branch producing red cells, platelets, granulocytes, monocytes and several other cells."},{"term":"Lymphoid lineage","meaning":"Branch producing B cells, T cells and NK cells."},{"term":"Megakaryocyte","meaning":"Large marrow cell that releases platelets."}],"diagramGuide":["Start at the multipotent hematopoietic stem cell, then follow the first split into common myeloid and common lymphoid progenitors.","Trace monocyte to macrophage; trace small lymphocyte to B cell/plasma cell, T cell, and NK cell.","Do not group NK cells with the myeloid phagocytes: the diagram places NK cells on the lymphoid branch."]},{"page":262,"topic":"Host Pathogen Interaction","slideInLecture":4,"title":"The immune system is distributed","explain":"The immune system is a functional network rather than one anatomically isolated organ system. It combines barriers, antimicrobial secretions, circulating white blood cells, bone marrow, liver-made complement, lymphatic organs and immune cells permanently resident in tissues.","mustKnow":["Skin and mucous membranes are physical barriers.","The liver produces many complement proteins.","Bone marrow produces immune-cell precursors.","Many tissues contain resident immune cells."],"terms":[{"term":"Complement","meaning":"A group of blood proteins that helps tag, inflame and destroy microbes."},{"term":"Resident immune cell","meaning":"An immune cell that normally lives within a tissue."},{"term":"Mucous membrane","meaning":"Moist epithelial lining that protects body passages exposed to the environment."}],"diagramGuide":["Read the slide as a distributed system: barriers and secretions act at surfaces, WBCs circulate, bone marrow supplies cells, liver supplies complement, and lymphoid organs organize responses."]},{"page":263,"topic":"Host Pathogen Interaction","slideInLecture":5,"title":"Blood and lymph transport immune cells","explain":"Blood rapidly carries immune cells and soluble proteins around the body. Fluid leaving blood capillaries becomes tissue fluid; much of it enters lymphatic vessels as lymph. Lymph passes through lymph nodes and eventually returns to the bloodstream.","mustKnow":["Blood and lymph form linked transport routes for immune surveillance.","Lymph is derived from interstitial fluid.","Lymph nodes filter lymph and organize immune-cell encounters."],"terms":[{"term":"Lymph","meaning":"Interstitial fluid after it enters lymphatic vessels."},{"term":"Lymph node","meaning":"A filtering organ where lymph-borne material meets immune cells."},{"term":"Interstitial fluid","meaning":"Fluid surrounding cells within tissues."}],"diagramGuide":["Red arrows show blood leaving the heart through arteries and returning through veins; green lymphatics collect tissue fluid and return lymph to the venous circulation.","At capillary beds, fluid leaves blood to become tissue fluid; lymphatic capillaries collect the excess."]},{"page":264,"topic":"Host Pathogen Interaction","slideInLecture":6,"title":"Two interacting arms of immunity","explain":"Innate immunity provides rapid, broad defense, while adaptive immunity generates highly specific responses. They are presented as first and second lines of defense, but they cooperate continuously rather than acting as isolated systems.","mustKnow":["Innate immunity is rapid and nonspecific.","Adaptive immunity is antigen-specific.","Innate and adaptive immunity interact."],"terms":[{"term":"Innate immunity","meaning":"Immediate defense using pre-existing barriers, cells and molecules."},{"term":"Adaptive immunity","meaning":"Antigen-specific defense mediated mainly by B and T lymphocytes."}],"diagramGuide":["The tree divides immunity into innate/nonspecific first-line defense and adaptive/specific second-line defense.","The bottom statement is important: the two arms interact rather than operating independently."]},{"page":265,"topic":"Host Pathogen Interaction","slideInLecture":7,"title":"Innate versus adaptive immunity","explain":"Innate responses begin with little or no delay, recognize broad microbial patterns and do not generate classical antigen-specific memory. Adaptive responses have a slower first response because matching lymphocytes must activate and expand, but they are specific and form memory cells.","mustKnow":["Innate: no major time lag, broad recognition, no classical antigen-specific memory.","Adaptive: initial lag, antigen specificity and memory.","Memory makes later adaptive responses faster and stronger."],"terms":[{"term":"Antigen","meaning":"A molecule specifically recognized by an antibody or lymphocyte receptor."},{"term":"Immunological memory","meaning":"Enhanced response after previous exposure to the same antigen."},{"term":"Time lag","meaning":"Delay before a measurable immune response develops."}],"diagramGuide":["Compare each row horizontally: innate has no lag, no antigen specificity, and no memory; adaptive has a lag, specificity, and memory."]},{"page":266,"topic":"Host Pathogen Interaction","slideInLecture":8,"title":"Map of a typical immune response","explain":"External innate defenses try to prevent entry. If microbes enter, internal innate mechanisms respond rapidly through phagocytes, antimicrobial proteins, inflammation, complement and NK cells. Adaptive immunity adds antibody-mediated humoral responses and cytotoxic cell-mediated responses.","mustKnow":["External innate defenses include skin, mucous membranes and secretions.","Internal innate defenses include phagocytes, inflammation, complement and NK cells.","Humoral adaptive immunity uses antibodies.","Cell-mediated adaptive immunity uses cytotoxic lymphocytes."],"terms":[{"term":"Humoral response","meaning":"Antibody-based adaptive defense in body fluids."},{"term":"Cell-mediated response","meaning":"Adaptive defense carried out mainly by T cells."},{"term":"Phagocyte","meaning":"A cell that engulfs particles or microbes."},{"term":"Inflammation","meaning":"A local protective response that recruits cells and molecules to injury or infection."}],"diagramGuide":["Follow invading microbes into external innate defenses first, then internal innate defenses; the adaptive branch splits into humoral antibodies and cell-mediated cytotoxic lymphocytes.","Complement is shown with internal innate defenses, not with antibody-producing humoral immunity."]},{"page":267,"topic":"Host Pathogen Interaction","slideInLecture":9,"title":"External innate defenses","explain":"External defenses are the body's boundary-level protections. They reduce the chance that microbes cross epithelial surfaces and enter internal tissues.","mustKnow":["External innate defenses act before microbes enter tissues.","They include mechanical, chemical and biological barriers."],"terms":[{"term":"Barrier defense","meaning":"A physical, chemical or biological feature that blocks microbial entry."},{"term":"Epithelium","meaning":"A sheet of cells covering surfaces and lining cavities."}],"diagramGuide":["The wall and fortress image represents intact external barriers preventing entry before immune cells need to attack."]},{"page":268,"topic":"Host Pathogen Interaction","slideInLecture":10,"title":"Mechanical barriers","explain":"Mechanical defenses physically block or remove microbes. Intact skin is a hard-to-cross surface. Saliva, tears and urine flush organisms away, while cilia move mucus and trapped particles out of the respiratory tract.","mustKnow":["Skin blocks entry.","Saliva, tears and urine remove microbes by flushing.","The mucociliary escalator clears inhaled material from airways."],"terms":[{"term":"Mucociliary escalator","meaning":"Coordinated ciliary movement that carries mucus and trapped particles toward the throat."},{"term":"Cilia","meaning":"Motile hair-like cell projections that move material across a surface."}],"diagramGuide":["Match each picture to its mechanical action: skin blocks entry, cilia move mucus upward, and saliva/tears/urine flush organisms away."]},{"page":269,"topic":"Host Pathogen Interaction","slideInLecture":11,"title":"Chemical barriers","explain":"Chemical defenses create conditions that damage or inhibit microbes. Sweat contains antimicrobial peptides, tears and saliva contain lysozyme, and stomach hydrochloric acid provides a very low pH that kills many swallowed organisms.","mustKnow":["Lysozyme is present in tears and saliva.","Stomach HCl is a low-pH antimicrobial barrier.","Sweat contains antimicrobial peptides."],"terms":[{"term":"Lysozyme","meaning":"An enzyme that breaks bonds in bacterial peptidoglycan cell walls."},{"term":"Antimicrobial peptide","meaning":"A short peptide that inhibits or kills microbes, often by damaging membranes."},{"term":"pH","meaning":"A scale of acidity or alkalinity; low pH is acidic."}],"diagramGuide":["The three chemical mechanisms are antimicrobial peptides in sweat, very low gastric pH from HCl, and lysozyme in tears/saliva."]},{"page":270,"topic":"Host Pathogen Interaction","slideInLecture":12,"title":"Normal flora as a biological barrier","explain":"Normal flora are the resident microbes that usually coexist with the host. They hinder pathogens by occupying attachment sites, consuming nutrients and sometimes producing inhibitory substances. This competition is called microbial antagonism or colonization resistance.","mustKnow":["Normal flora compete with pathogens for nutrients and space.","This protective competition is called antagonism or colonization resistance.","Normal flora are part of external innate defense."],"terms":[{"term":"Normal flora","meaning":"Microorganisms that normally live on or in the body without causing disease."},{"term":"Colonization resistance","meaning":"Protection created when resident microbes prevent pathogen establishment."},{"term":"Antagonism","meaning":"One organism suppressing another through competition or inhibitory products."}],"diagramGuide":["The body map marks colonized sites; the key relationship is competition by normal flora for nutrients and space, termed antagonism."]},{"page":271,"topic":"Host Pathogen Interaction","slideInLecture":13,"title":"From barriers to internal defense","explain":"This repeated overview emphasizes the transition: barriers act first; if a pathogen breaches them, internal innate defenses respond, followed by antigen-specific adaptive responses.","mustKnow":["Defense proceeds from external barriers to internal innate mechanisms and adaptive immunity.","Complement and inflammation are innate; antibodies and cytotoxic lymphocytes are adaptive."],"terms":[{"term":"Breach","meaning":"Successful crossing of a protective barrier by a pathogen."}],"diagramGuide":["The enlarged response map adds internal innate defenses after the external barrier: phagocytes, antimicrobial proteins, inflammation, NK cells, and complement."]},{"page":272,"topic":"Host Pathogen Interaction","slideInLecture":14,"title":"Internal innate defenses","explain":"Once microbes enter tissues or blood, internal defenses detect, contain and eliminate them. Major components include soluble blood proteins and innate immune cells.","mustKnow":["Internal innate defenses act after barrier penetration.","They include soluble proteins, phagocytes, inflammatory mechanisms and NK cells."],"terms":[{"term":"Internal defense","meaning":"Immune mechanisms acting within tissues, blood or lymph after microbial entry."}],"diagramGuide":["The breached-wall and army images signal the transition from barrier defenses to cellular and soluble internal defenses."]},{"page":273,"topic":"Host Pathogen Interaction","slideInLecture":15,"title":"Immune components in blood","explain":"Blood contains cellular and soluble defense components. White blood cells are cellular. Complement proteins, coagulation proteins and cytokines are extracellular molecules that can tag microbes, control inflammation, form clots and coordinate cell behavior.","mustKnow":["WBCs are cellular blood components.","Complement, coagulation proteins and cytokines act extracellularly.","Cytokines are communication signals between cells."],"terms":[{"term":"Cytokine","meaning":"A secreted signaling protein that changes the behavior of immune or other cells."},{"term":"Coagulation","meaning":"The clot-forming process that limits bleeding and can help contain infection."},{"term":"Extracellular","meaning":"Located or acting outside cells."},{"term":"WBC","meaning":"White blood cell, also called a leukocyte."}],"diagramGuide":["The centrifuged blood tube separates plasma from formed elements; complement, coagulation proteins, and cytokines are extracellular plasma components, whereas WBCs are cells."]},{"page":274,"topic":"Host Pathogen Interaction","slideInLecture":16,"title":"Major white blood cell types","explain":"White blood cells have distinct jobs. Macrophages engulf microbes and present antigens; B cells make antibodies after becoming plasma cells; T cells coordinate responses or kill infected cells; NK cells kill abnormal cells without antigen-specific receptors; mast cells release inflammatory mediators.","mustKnow":["B and T lymphocytes are central to adaptive immunity.","NK cells and macrophages contribute strongly to innate immunity.","Mast cells promote inflammation."],"terms":[{"term":"B lymphocyte","meaning":"Adaptive immune cell that can differentiate into an antibody-secreting plasma cell."},{"term":"T lymphocyte","meaning":"Adaptive immune cell involved in coordination or direct killing."},{"term":"Mast cell","meaning":"Tissue immune cell that releases inflammatory mediators from granules."},{"term":"Macrophage","meaning":"Large tissue phagocyte with microbe-killing and antigen-presenting functions."}],"diagramGuide":["Use morphology only as a cue, but learn the labels: monocyte has a kidney-shaped nucleus, neutrophil a multilobed nucleus, eosinophil a bilobed nucleus with granules, and basophil dense granules.","The arrows separately group B, T, and NK lymphocytes."]},{"page":275,"topic":"Host Pathogen Interaction","slideInLecture":17,"title":"Neutrophils: rapid first responders","explain":"Neutrophils are the most abundant circulating white blood cells and highly efficient phagocytes. They rapidly leave blood and accumulate at infection sites, making them major early-response cells of innate immunity.","mustKnow":["Neutrophils make up roughly 50–60% of circulating WBCs.","They are efficient phagocytes.","They arrive early at sites of infection."],"terms":[{"term":"Neutrophil","meaning":"Abundant short-lived granulocyte specialized for rapid antimicrobial defense."},{"term":"First responder","meaning":"A cell recruited very early during infection or injury."},{"term":"Granulocyte","meaning":"A white blood cell containing prominent cytoplasmic granules."}],"diagramGuide":["The neutrophil image has a multilobed nucleus. The bullets identify it as the most abundant WBC, an efficient phagocyte, and an early cell at infection sites."]},{"page":276,"topic":"Host Pathogen Interaction","slideInLecture":18,"title":"Chemotaxis guides neutrophils","explain":"Neutrophils locate infection by chemotaxis: they detect soluble attractant molecules and move up the concentration gradient toward the source.","mustKnow":["Chemotaxis is directed movement along a chemical gradient.","Neutrophils move toward higher concentrations of attractant signals."],"terms":[{"term":"Chemotaxis","meaning":"Directed cell movement in response to a chemical concentration gradient."},{"term":"Chemoattractant","meaning":"A molecule that attracts motile cells."},{"term":"Concentration gradient","meaning":"A spatial change from lower to higher concentration."}],"diagramGuide":["Chemotaxis means directed movement along a chemical concentration gradient toward a microbial or inflammatory source."]},{"page":277,"topic":"Host Pathogen Interaction","slideInLecture":19,"title":"Neutrophil chemotaxis in motion","explain":"The linked demonstration visualizes a neutrophil changing shape and crawling toward a chemical source. Receptor sensing at the front polarizes the cell so that protrusion and movement are directed rather than random.","mustKnow":["Chemotaxis requires sensing plus polarized cell movement.","The leading edge faces the chemoattractant source."],"terms":[{"term":"Cell polarity","meaning":"An asymmetric front–rear organization that gives a migrating cell direction."},{"term":"Leading edge","meaning":"The forward, protruding side of a moving cell."}],"diagramGuide":["The moving neutrophil changes shape and extends its leading edge toward the chemoattractant source; this is directional migration, not random motion."]},{"page":278,"topic":"Host Pathogen Interaction","slideInLecture":20,"title":"Phagocytosis","explain":"Phagocytosis is cellular eating. A phagocyte recognizes and surrounds a microbe, encloses it inside a membrane-bound compartment and then digests it using antimicrobial molecules and enzymes.","mustKnow":["Phagocytosis means engulfment of a particle or microbe by a cell.","Neutrophils are professional phagocytes.","Engulfment is followed by intracellular killing and digestion."],"terms":[{"term":"Phagocytosis","meaning":"Engulfment of a large particle or microbe into a cell."},{"term":"Phagocyte","meaning":"A cell specialized to engulf particles or microbes."},{"term":"Engulfment","meaning":"Extension of the cell membrane around a target to internalize it."}],"diagramGuide":["The word roots explain the process: phago means eat and cyte means cell; the operational sequence is find, engulf, and digest."]},{"page":279,"topic":"Host Pathogen Interaction","slideInLecture":21,"title":"Neutrophils engulf bacteria","explain":"The linked microscopy shows a motile neutrophil chasing and engulfing bacteria. It combines the two processes just introduced: chemotaxis brings the cell to its target, then phagocytosis internalizes the target.","mustKnow":["Chemotaxis precedes contact with the bacterium.","Phagocytosis begins after recognition and contact."],"terms":[{"term":"Recognition","meaning":"Binding of a target directly or through molecules coating its surface."}],"diagramGuide":["The micrograph shows a neutrophil among red blood cells with bacteria being engulfed; recognition and enclosure precede intracellular digestion."]},{"page":280,"topic":"Host Pathogen Interaction","slideInLecture":22,"title":"The phagocytosis pathway","explain":"After chemotaxis and attachment, the neutrophil surrounds the microbe and encloses it in a phagosome. Lysosomes or antimicrobial granules fuse with the phagosome to make a phagolysosome. Enzymes digest the microbe, and indigestible residue is later discharged.","mustKnow":["Engulfment forms a phagosome.","Phagosome–lysosome fusion forms a phagolysosome.","Microbial digestion occurs in the phagolysosome.","Residual waste can be expelled."],"terms":[{"term":"Phagosome","meaning":"Membrane-bound vesicle containing an engulfed particle."},{"term":"Lysosome","meaning":"Enzyme-rich acidic organelle that degrades material."},{"term":"Phagolysosome","meaning":"Digestive compartment formed by fusion of a phagosome with lysosomes."},{"term":"Pseudopod","meaning":"Temporary cell extension used to surround a target."}],"diagramGuide":["Read clockwise: attachment, pseudopod extension, phagosome formation, lysosome fusion, killing/digestion, and discharge of residual material.","Granules/lysosomes deliver antimicrobial molecules to the microbe-containing compartment."]},{"page":281,"topic":"Host Pathogen Interaction","slideInLecture":23,"title":"What neutrophil granules contain","explain":"Neutrophil granules store concentrated antimicrobial cargo. Their contents include digestive enzymes that break microbial structures and other proteins that kill or inhibit microbes. Fusion delivers this cargo into the phagocytic compartment.","mustKnow":["Granules contain digestive enzymes and antimicrobial proteins.","Granule contents help kill and digest engulfed bacteria.","Storage in granules permits rapid deployment."],"terms":[{"term":"Granule","meaning":"Intracellular storage compartment containing ready-made antimicrobial molecules."},{"term":"Digestive enzyme","meaning":"A protein that chemically breaks large biological molecules into smaller products."},{"term":"Degranulation","meaning":"Release of stored granule contents."}],"diagramGuide":["The highlighted granules contain digestive enzymes and antimicrobial proteins; after fusion, these contents act inside the phagolysosome."]},{"page":282,"topic":"Host Pathogen Interaction","slideInLecture":24,"title":"Neutrophils also signal","explain":"Neutrophils do more than ingest microbes. They release mediators that promote inflammation and influence other immune cells, helping connect the immediate innate response with later adaptive immunity.","mustKnow":["Neutrophils can trigger or amplify inflammation.","Neutrophil signals can affect adaptive immune responses.","Neutrophils are not only microbe-eating cells."],"terms":[{"term":"Inflammatory mediator","meaning":"A released molecule that promotes vascular or cellular features of inflammation."},{"term":"Immune crosstalk","meaning":"Communication between different immune cells or immune-system branches."}],"diagramGuide":["The red annotation adds a signaling role to killing: neutrophils release mediators that trigger inflammation and influence adaptive immunity."]},{"page":283,"topic":"Host Pathogen Interaction","slideInLecture":25,"title":"Neutrophil extracellular traps","explain":"Neutrophils can release web-like neutrophil extracellular traps, or NETs. These structures contain decondensed DNA associated with antimicrobial proteins, allowing them to trap microbes outside cells and concentrate toxic molecules around them.","mustKnow":["NET stands for neutrophil extracellular trap.","NETs are DNA-rich extracellular webs.","NETs trap microbes and expose them to antimicrobial proteins."],"terms":[{"term":"NET","meaning":"Neutrophil extracellular trap made largely of DNA and antimicrobial proteins."},{"term":"NETosis","meaning":"A process by which a neutrophil releases an extracellular trap."},{"term":"Decondensed DNA","meaning":"DNA loosened from its compact chromatin organization."}],"diagramGuide":["Follow the numbered sequence: rolling, slow rolling, adhesion, transmigration, then effector actions including NET release and exocytosis/ROS.","The NET is a web-like extracellular scaffold that traps microbes."]},{"page":284,"topic":"Host Pathogen Interaction","slideInLecture":26,"title":"Monocytes become tissue macrophages","explain":"Monocytes are circulating white blood cells that make up roughly 2–10% of WBCs. After leaving blood and entering tissues, they can differentiate into macrophages with tissue-adapted forms in organs such as lung, liver, brain, bone and intestine.","mustKnow":["Monocytes circulate in blood.","Monocytes migrate into tissues and become macrophages.","Different tissues contain specialized macrophage populations."],"terms":[{"term":"Monocyte","meaning":"Circulating myeloid white blood cell that can differentiate into macrophages."},{"term":"Differentiation","meaning":"Acquisition of a more specialized cell identity and function."},{"term":"Tissue macrophage","meaning":"A macrophage residing and functioning within a particular organ."}],"diagramGuide":["The central monocyte leaves blood and differentiates into tissue macrophages; the organ icons show specialized macrophages in lung, liver, brain, intestine, and other tissues."]},{"page":285,"topic":"Host Pathogen Interaction","slideInLecture":27,"title":"Macrophages: big eaters and antigen presenters","explain":"Macrophages are long-lived tissue phagocytes. They engulf microbes and debris and can display microbial peptide fragments to T cells. This antigen-presentation function helps connect innate detection to adaptive activation.","mustKnow":["Macrophages phagocytose microbes in tissues.","Macrophages can present antigens to T cells.","Neutrophils normally circulate in blood, whereas macrophages reside in tissues."],"terms":[{"term":"Antigen presentation","meaning":"Display of peptide fragments on cell-surface MHC molecules for recognition by T cells."},{"term":"MHC","meaning":"Cell-surface proteins that hold peptide fragments for T-cell inspection."},{"term":"Tissue phagocyte","meaning":"A particle-engulfing immune cell located within tissue."}],"diagramGuide":["The slide assigns macrophages two linked jobs: tissue phagocytosis and antigen presentation to adaptive immune cells."]},{"page":286,"topic":"Host Pathogen Interaction","slideInLecture":28,"title":"Natural killer cells","explain":"Natural killer cells are innate lymphocytes, not B or T cells. They survey host cells and kill cells altered by viral infection, some intracellular infections or cancer. Their response does not require the same antigen-specific priming used by adaptive cytotoxic T cells.","mustKnow":["NK cells are part of innate immunity.","NK cells are lymphoid cells but are neither B nor T lymphocytes.","They kill infected and cancerous host cells."],"terms":[{"term":"Natural killer cell","meaning":"Innate lymphocyte that kills stressed, infected or transformed host cells."},{"term":"Intracellular pathogen","meaning":"A pathogen that lives or replicates within host cells."},{"term":"Transformed cell","meaning":"A cell with cancer-like abnormal growth properties."}],"diagramGuide":["The cartoon separates NK cells from B and T lymphocytes and shows their targets as infected cells and cancer cells."]},{"page":287,"topic":"Host Pathogen Interaction","slideInLecture":29,"title":"Missing-self recognition by NK cells","explain":"Healthy cells display surface molecules, especially MHC class I, that provide inhibitory 'do not kill' signals to NK cells. Infected or cancerous cells may lose these molecules. Loss of inhibitory signaling shifts the balance toward NK-cell killing; this is called missing-self recognition.","mustKnow":["Normal MHC class I helps inhibit NK-cell killing.","Reduced or missing MHC class I can mark an abnormal cell.","NK decisions reflect a balance of activating and inhibitory signals."],"terms":[{"term":"Missing self","meaning":"NK-cell recognition of abnormally low self MHC class I on a target cell."},{"term":"MHC class I","meaning":"A surface molecule on most nucleated cells that can deliver an inhibitory signal to NK cells."},{"term":"Inhibitory receptor","meaning":"A receptor whose engagement reduces cell activation."}],"diagramGuide":["Compare the two target cells: normal cells display inhibitory self-surface signals, while infected/cancer cells may lose them; loss of inhibition permits NK killing."]},{"page":288,"topic":"Host Pathogen Interaction","slideInLecture":30,"title":"How NK cells kill targets","explain":"After recognizing an abnormal target, an NK cell releases cytotoxic granules at the contact site. Perforin helps create membrane pores or supports granzyme entry; granzymes are proteases that activate apoptosis. Killing the infected host cell also removes the pathogen's intracellular niche.","mustKnow":["NK cells release cytotoxic granules.","Perforin promotes granzyme access to the target cell.","Granzymes trigger apoptotic death.","The host target cell, not only the microbe, is eliminated."],"terms":[{"term":"Perforin","meaning":"Pore-forming cytotoxic protein released by NK cells and cytotoxic T cells."},{"term":"Granzyme","meaning":"Cytotoxic protease that enters a target and activates cell-death pathways."},{"term":"Cytotoxic granule","meaning":"Secretory vesicle containing cell-killing proteins."},{"term":"Apoptosis","meaning":"Controlled cell death triggered here in the abnormal target cell."}],"diagramGuide":["The top panel shows inhibitory recognition sparing a healthy cell; the lower panel shows an abnormal target receiving released granules.","Perforin enables entry/pore formation and proteases such as granzymes activate target-cell death."]},{"page":289,"topic":"Host Pathogen Interaction","slideInLecture":31,"title":"NK-cell killing demonstration","explain":"The linked material illustrates contact-dependent cytotoxicity. An NK cell forms a focused junction with a selected target, directs granules toward that junction and triggers target-cell death while limiting damage to nearby cells.","mustKnow":["Cytotoxic granules are released directionally at the immune-cell–target junction.","Focused secretion helps protect neighboring cells."],"terms":[{"term":"Immune synapse","meaning":"Organized contact zone between an immune cell and its target."},{"term":"Directed secretion","meaning":"Release of molecules toward one selected target rather than in all directions."}],"diagramGuide":["Treat the molecular image as the recognition/contact stage: a cytotoxic lymphocyte must first form a close interface with its target before polarized granule release."]},{"page":290,"topic":"Host Pathogen Interaction","slideInLecture":32,"title":"Cytotoxic lymphocyte mechanism","explain":"This video resource reinforces the sequence of target recognition, stable contact, polarized granule release and apoptotic target death. The essential molecular pair is perforin plus granzymes.","mustKnow":["Target recognition precedes granule release.","Perforin and granzymes execute cytotoxic killing.","The target typically dies by apoptosis."],"terms":[{"term":"Cytotoxic lymphocyte","meaning":"An NK cell or cytotoxic T cell capable of killing another cell."}],"diagramGuide":["The faint video frame belongs to the killing sequence: target recognition and synapse formation precede directed release of cytotoxic granules and target death."]},{"page":291,"topic":"Host Pathogen Interaction","slideInLecture":33,"title":"Cytotoxic T cells","explain":"The linked cytotoxic T-cell example uses a killing mechanism similar to NK cells but target selection differs. Cytotoxic T cells belong to adaptive immunity and recognize a specific antigen peptide displayed on MHC class I before releasing perforin and granzymes.","mustKnow":["Cytotoxic T cells are adaptive immune cells.","They recognize specific peptide–MHC class I complexes.","They can kill through perforin and granzymes."],"terms":[{"term":"Cytotoxic T cell","meaning":"Adaptive T lymphocyte that kills cells displaying its specific antigen on MHC class I."},{"term":"Peptide–MHC complex","meaning":"A peptide fragment held by an MHC molecule for T-cell recognition."},{"term":"T-cell receptor","meaning":"Antigen-specific receptor used by a T cell to inspect peptide–MHC."}],"diagramGuide":["The cytotoxic T-cell frame represents adaptive cell-mediated killing; unlike NK missing-self recognition, a cytotoxic T cell recognizes a specific peptide-MHC complex."]},{"page":292,"topic":"Host Pathogen Interaction","slideInLecture":34,"title":"Overall mechanism of microbial pathogenicity","explain":"Disease depends on a sequence of successful events: enough microbes reach a portal of entry, adhere, penetrate or evade defenses, damage host cells and eventually leave through a portal of exit. Virulence factors are microbial features that increase success at one or more steps.","mustKnow":["Virulence is a pathogen's capacity to harm a host.","Pathogenicity involves entry, adherence, defense evasion, damage and exit.","The number of invading microbes can affect whether disease develops.","Virulence factors convert a microbe into a more effective pathogen."],"terms":[{"term":"Virulence","meaning":"Degree or capacity of a pathogen to cause harm."},{"term":"Virulence factor","meaning":"A microbial structure or product that promotes colonization, invasion, evasion or damage."},{"term":"Portal of entry","meaning":"Route by which a pathogen enters the host."},{"term":"Portal of exit","meaning":"Route by which a pathogen leaves the host for transmission."}],"diagramGuide":["Read the flow left to right: portal of entry, penetration/evasion, damage, and portal of exit.","Adherence feeds into establishment of infection, while inoculum size and virulence factors influence whether disease occurs."]},{"page":293,"topic":"Host Pathogen Interaction","slideInLecture":35,"title":"Steps in bacterial pathogenesis","explain":"The diagram organizes bacterial disease into exposure, adhesion, invasion, colonization with immune evasion, toxin action and tissue damage. Not every bacterium uses every step, but successful disease generally requires persistence at the host site and enough damage to disturb normal function.","mustKnow":["Exposure is followed by attachment or adhesion.","Invasion and colonization allow persistence and spread.","Immune evasion helps bacteria survive in the host.","Toxins and direct microbial effects produce tissue damage and disease."],"terms":[{"term":"Colonization","meaning":"Establishment and multiplication of microbes at a host site."},{"term":"Invasion","meaning":"Entry into host tissues or cells beyond the initial surface."},{"term":"Immune evasion","meaning":"Avoidance, suppression or resistance of host immune defenses."},{"term":"Toxin","meaning":"A microbial product that directly damages cells or disrupts physiology."}],"diagramGuide":["Follow the panels in order: exposure, adhesion, invasion, colonization/growth, toxicity, then tissue damage and disease.","The epithelial surface and mucus layer remain the spatial reference throughout."]},{"page":294,"topic":"Host Pathogen Interaction","slideInLecture":36,"title":"Adherence requires a microbial ligand and host receptor","explain":"Adherence is often essential because microbes must resist being washed away before they can colonize. Attachment depends on complementary binding: a microbial surface ligand, often called an adhesin, binds a receptor on the host cell.","mustKnow":["Adherence is microbial attachment to host cells.","A microbial ligand binds a host receptor.","Attachment commonly precedes colonization and infection."],"terms":[{"term":"Adherence","meaning":"Attachment of a microorganism to a host surface or cell."},{"term":"Adhesin","meaning":"A microbial surface molecule that mediates attachment."},{"term":"Ligand","meaning":"A molecule that binds specifically to a receptor."},{"term":"Receptor","meaning":"A host component recognized and bound by a microbial ligand."}],"diagramGuide":["The binding pair is asymmetric: the receptor is a host-cell component and the ligand/adhesin is microbial."]},{"page":295,"topic":"Host Pathogen Interaction","slideInLecture":37,"title":"M protein in Group A Streptococcus","explain":"Group A Streptococcus uses surface M protein in adherence and immune evasion. M protein helps interactions with fibronectin, promoting attachment and invasion. It also recruits host proteins such as fibrinogen, albumin and plasminogen, forming a cloak that hides bacterial epitopes and changes antibody access.","mustKnow":["M protein is a virulence factor of Group A Streptococcus.","Fibronectin binding promotes attachment and invasion.","A host-protein cloak can hide bacterial epitopes from antibodies.","M protein contributes to both adherence and immune evasion."],"terms":[{"term":"M protein","meaning":"Major surface virulence protein of Group A Streptococcus."},{"term":"Fibronectin","meaning":"A host extracellular-matrix protein that bacteria can exploit for attachment."},{"term":"Epitope","meaning":"The specific part of an antigen recognized by an antibody or receptor."},{"term":"Host-protein cloak","meaning":"Layer of recruited host proteins that masks a pathogen's surface."}],"diagramGuide":["The diagram places GAS M protein on the bacterial surface, binding host proteins such as fibronectin; the resulting cloak changes antibody access and supports adherence/invasion."]},{"page":296,"topic":"Host Pathogen Interaction","slideInLecture":38,"title":"Why adherence matters","explain":"Attachment lets microbes remain at a favorable site long enough to colonize and cause disease. Because adhesin–receptor binding is selective, it can determine which host species or tissue a pathogen infects. Blocking adherence is therefore a possible treatment strategy.","mustKnow":["Adherence supports colonization and disease.","Receptor availability contributes to host and tissue specificity.","Adhesins or their receptor interactions can be drug targets."],"terms":[{"term":"Host specificity","meaning":"Restriction of a pathogen to particular host species."},{"term":"Tissue tropism","meaning":"Preference of a pathogen for particular tissues or cell types."},{"term":"Drug target","meaning":"A molecule or interaction whose inhibition can reduce disease."}],"diagramGuide":["The receptor-ligand cartoon explains host specificity: adherence succeeds only when a microbial adhesin matches a receptor on the host tissue."]},{"page":297,"topic":"Host Pathogen Interaction","slideInLecture":39,"title":"Bacterial capsules","explain":"A capsule is an organized outer layer, usually made of polysaccharide, located outside the bacterial cell wall. It can promote attachment and protect bacteria from host defenses. Encapsulated pathogens listed here include Streptococcus pneumoniae, Haemophilus influenzae and Bacillus anthracis.","mustKnow":["A capsule lies outside the bacterial cell wall.","Most bacterial capsules are polysaccharide-rich.","Capsules can aid attachment and immune evasion.","S. pneumoniae, H. influenzae and B. anthracis are examples shown."],"terms":[{"term":"Capsule","meaning":"Organized protective layer external to a bacterial cell wall."},{"term":"Polysaccharide","meaning":"A long carbohydrate polymer; a common capsule material."},{"term":"Encapsulated bacterium","meaning":"A bacterium surrounded by a distinct capsule."}],"diagramGuide":["The capsule is the outer polysaccharide layer beyond the cell wall; the slide links it to attachment and evasion of host defenses."]},{"page":298,"topic":"Host Pathogen Interaction","slideInLecture":40,"title":"Capsules can mask PAMP recognition","explain":"Innate immune cells use pattern-recognition receptors such as Toll-like receptors to detect conserved pathogen-associated molecular patterns. TLR4 recognizes bacterial lipopolysaccharide. A capsule can cover underlying microbial patterns, reducing receptor access and weakening early immune activation.","mustKnow":["PAMPs are conserved microbial features recognized by innate immunity.","TLRs are pattern-recognition receptors.","TLR4 recognizes bacterial LPS.","A capsule may mask PAMPs and reduce recognition."],"terms":[{"term":"PAMP","meaning":"Pathogen-associated molecular pattern: a conserved microbial structure sensed by innate immunity."},{"term":"TLR","meaning":"Toll-like receptor, a family of pattern-recognition receptors."},{"term":"TLR4","meaning":"A receptor best known for detecting bacterial lipopolysaccharide."},{"term":"LPS","meaning":"Lipopolysaccharide, a major outer-membrane component of Gram-negative bacteria."}],"diagramGuide":["In the normal route, bacterial PAMP recognition by a TLR activates signaling and inflammatory cytokines; the capsule blocks access, so the crossed-out route produces little/no response."]},{"page":299,"topic":"Host Pathogen Interaction","slideInLecture":41,"title":"Capsules inhibit phagocytosis","explain":"Phagocytes ingest bacteria more efficiently when the microbial surface is directly recognizable or coated with opsonins. A capsule can hide binding targets and prevent close receptor contact, making attachment and engulfment less efficient.","mustKnow":["Capsules can reduce phagocyte binding to bacteria.","Reduced binding leads to reduced engulfment.","Opsonization can improve phagocytosis of encapsulated bacteria."],"terms":[{"term":"Opsonization","meaning":"Coating a target with molecules that make it easier for phagocytes to bind and ingest."},{"term":"Opsonin","meaning":"A molecule, such as certain antibodies or complement fragments, that promotes phagocytosis."},{"term":"Antiphagocytic","meaning":"Able to resist or inhibit engulfment by phagocytes."}],"diagramGuide":["Compare left and right: complement C3b opsonization promotes binding to the phagocyte; the capsule interferes with opsonization/binding and therefore uptake."]},{"page":300,"topic":"Host Pathogen Interaction","slideInLecture":42,"title":"Capsules can support survival after engulfment","explain":"Some capsules protect bacteria even after they enter a phagocyte. The capsule can reduce access or effectiveness of lysosomal enzymes and other antimicrobial factors, allowing the bacterium to resist digestion inside the phagolysosomal pathway.","mustKnow":["Some encapsulated bacteria resist intracellular digestion.","Capsules may reduce damage by lysosomal enzymes.","Engulfment does not guarantee microbial killing."],"terms":[{"term":"Intracellular survival","meaning":"Persistence of a microbe inside a host cell despite antimicrobial mechanisms."},{"term":"Lysosomal enzyme","meaning":"An acidic-compartment enzyme that degrades biological material."},{"term":"Phagocyte evasion","meaning":"A microbial strategy that prevents engulfment, killing or digestion by phagocytes."}],"diagramGuide":["The bacterium is already inside a phagocyte, but its capsule resists lysosomal enzyme action; engulfment therefore does not guarantee killing."]},{"page":301,"topic":"Host Pathogen Interaction","slideInLecture":43,"title":"Biofilms and Quorum Sensing","explain":"A biofilm is a surface-associated microbial community. Quorum sensing lets bacteria detect population density and change gene expression together, which helps coordinate biofilm behavior.","mustKnow":["Biofilms are organized bacterial communities.","Quorum sensing links population density to altered gene expression."],"terms":[{"term":"Biofilm","meaning":"A community of microorganisms attached to a surface."},{"term":"Quorum sensing","meaning":"Population-density sensing that changes bacterial gene expression."}],"diagramGuide":["Follow the biofilm stages left to right: attachment, initial adherence, microcolony/biofilm maturation, then dispersal.","Quorum sensing coordinates density-dependent gene expression during community development."]},{"page":302,"topic":"Host Pathogen Interaction","slideInLecture":44,"title":"Breaching the Mucus Barrier","explain":"Mucus keeps many pathogens away from host-cell surfaces. To attach to or invade those cells, a pathogen often must first cross or disrupt this protective barrier.","mustKnow":["Mucus is a physical host barrier.","Breaching mucus can be necessary for access to host cells."],"terms":[{"term":"Mucus barrier","meaning":"A protective secretion that limits microbial access to underlying cells."},{"term":"Barrier breach","meaning":"Crossing or disrupting a host defense layer."}],"diagramGuide":["The diagram is layered: mucus is the first barrier, epithelial cells lie below it, and basement membrane is deeper. Pathogens must cross mucus to contact cell receptors."]},{"page":303,"topic":"Host Pathogen Interaction","slideInLecture":45,"title":"Bacterial Enzymes as Virulence Factors","explain":"Pathogenic bacteria can produce enzymes that change host barriers or defenses. The listed groups are coagulase and kinases, hyaluronidase and collagenase, and IgA protease.","mustKnow":["Bacterial enzymes can promote invasion or immune evasion.","Know the three listed enzyme groups."],"terms":[{"term":"Virulence factor","meaning":"A microbial feature that helps cause disease."},{"term":"IgA protease","meaning":"A bacterial enzyme that cleaves the antibody IgA."}],"diagramGuide":["The brick wall represents connective-tissue barriers; the listed enzymes are grouped by what they help bacteria overcome: clotting, matrix, or mucosal antibody."]},{"page":304,"topic":"Host Pathogen Interaction","slideInLecture":46,"title":"Hyaluronidase and Collagenase","explain":"These enzymes digest components of connective tissue, making tissue invasion easier. The slide associates hyaluronidase with Staphylococcus aureus and Streptococcus pyogenes, and collagenase with Clostridium perfringens.","mustKnow":["Both enzymes support invasion by digesting connective tissue.","Hyaluronidase: S. aureus and S. pyogenes.","Collagenase: C. perfringens and gas gangrene."],"terms":[{"term":"Hyaluronidase","meaning":"An enzyme that helps break down connective-tissue material."},{"term":"Collagenase","meaning":"An enzyme that breaks down collagen."},{"term":"Gas gangrene","meaning":"A severe tissue infection associated here with C. perfringens."}],"diagramGuide":["Hyaluronidase digests hyaluronic-acid-rich ground substance; collagenase digests collagen. Both open paths through connective tissue.","The examples pair hyaluronidase with S. aureus/S. pyogenes and collagenase with C. perfringens."]},{"page":305,"topic":"Host Pathogen Interaction","slideInLecture":47,"title":"Coagulase and Streptokinase","explain":"Coagulase promotes clot formation around bacteria, which can reduce access by phagocytes, immune factors, and antibiotics. Streptokinase has the opposite clot-related use: it is used clinically to dissolve clots.","mustKnow":["Coagulase can shield bacteria from host defenses.","Coagulase-producing S. aureus strains are associated with pathogenicity.","Streptokinase is used to dissolve clots."],"terms":[{"term":"Coagulase","meaning":"A bacterial enzyme that promotes clot formation."},{"term":"Streptokinase","meaning":"A clot-dissolving bacterial protein used clinically."},{"term":"Phagocytosis","meaning":"Engulfment and digestion of microbes by host cells."}],"diagramGuide":["The left-to-right clot sequence contrasts coagulase, which creates a protective clot, with kinase/streptokinase, which dissolves clots and permits spread.","The checks connect clot formation with reduced phagocyte, immune, and antibiotic access."]},{"page":306,"topic":"Host Pathogen Interaction","slideInLecture":48,"title":"Basic Bacterial Cell-Wall Structure","explain":"The bacterial cell wall is an outer layer containing peptidoglycan, a network built from sugars and amino acids. Surface proteins may also be carried on the wall.","mustKnow":["Peptidoglycan contains sugars and amino acids.","The cell wall can display surface proteins."],"terms":[{"term":"Peptidoglycan","meaning":"A sugar-and-amino-acid polymer that forms the bacterial cell wall."},{"term":"Surface protein","meaning":"A protein exposed or attached at the bacterial surface."}],"diagramGuide":["The envelope diagram places peptidoglycan outside the cytoplasmic membrane; surface proteins may project from or associate with the wall."]},{"page":307,"topic":"Host Pathogen Interaction","slideInLecture":49,"title":"Mycolic Acid Resists Lysosomal Digestion","explain":"Mycolic acid in the cell wall helps some bacteria resist digestion by lysosomal enzymes after they are engulfed. The examples given are Mycobacterium tuberculosis and Mycobacterium leprae.","mustKnow":["Mycolic acid increases resistance to lysosomal digestion.","M. tuberculosis and M. leprae contain mycolic acid in their walls."],"terms":[{"term":"Mycolic acid","meaning":"A waxy cell-wall lipid that helps mycobacteria resist degradation."},{"term":"Lysosomal enzyme","meaning":"A degradative enzyme inside a lysosome."}],"diagramGuide":["The phagocyte diagram shows mycobacteria surviving after uptake because the mycolic-acid-rich wall resists lysosomal digestion."]},{"page":308,"topic":"Host Pathogen Interaction","slideInLecture":50,"title":"Invasins and Membrane Ruffling","explain":"Invasins are pathogen surface proteins that rearrange actin in the host-cell cytoskeleton. This produces membrane ruffling and helps the microbe enter the cell.","mustKnow":["Invasins are pathogen surface proteins.","They alter host actin filaments.","Actin rearrangement enables microbial entry."],"terms":[{"term":"Invasin","meaning":"A microbial surface protein that promotes entry into host cells."},{"term":"Membrane ruffling","meaning":"Actin-driven folding or movement of the host plasma membrane."},{"term":"Actin","meaning":"A cytoskeletal protein involved in cell shape and movement."}],"diagramGuide":["Follow the arrows: bacterial invasin signals to host actin, membrane ruffles rise around the bacterium, the bacterium is enclosed, and then enters the cell."]},{"page":309,"topic":"Host Pathogen Interaction","slideInLecture":51,"title":"Toxins, Toxigenicity, and Toxemia","explain":"A toxin is a poisonous substance produced by a microorganism. Toxigenicity is the organism's ability to produce toxins, while toxemia means toxins are present in the blood.","mustKnow":["Toxin: poisonous microbial product.","Toxigenicity: ability to produce toxin.","Toxemia: toxin present in blood."],"terms":[{"term":"Toxin","meaning":"A poisonous substance produced by a microorganism."},{"term":"Toxigenicity","meaning":"The ability of a microorganism to produce toxins."},{"term":"Toxemia","meaning":"The presence of toxins in the bloodstream."}],"diagramGuide":["The lower cartoons contrast exotoxin secretion from a living bacterium with endotoxin as part of the outer envelope released especially when cells break down."]},{"page":310,"topic":"Host Pathogen Interaction","slideInLecture":52,"title":"Diphtheria Toxin Blocks Translation","explain":"Diphtheria toxin is an A-B toxin. After receptor-mediated endocytosis and acid-triggered translocation, fragment A enters the cytoplasm and ADP-ribosylates eEF-2, stopping protein translation and killing the host cell.","mustKnow":["Diphtheria toxin is an A-B toxin.","Fragment A modifies eEF-2.","The result is inhibition of protein synthesis."],"terms":[{"term":"A-B toxin","meaning":"A toxin with an active component and a cell-binding or delivery component."},{"term":"eEF-2","meaning":"A eukaryotic elongation factor required for protein translation."},{"term":"ADP-ribosylation","meaning":"Covalent addition of an ADP-ribose group to a target protein."}],"diagramGuide":["Follow the A-B toxin route: receptor binding and endocytosis, endosomal acidification, A-fragment translocation, then eEF-2 ADP-ribosylation and halted translation."]},{"page":311,"topic":"Host Pathogen Interaction","slideInLecture":53,"title":"Cholera Toxin Raises cAMP","explain":"Cholera toxin is an AB5 toxin: five B subunits bind GM1 and deliver the active A1 fragment. A1 locks Gs alpha in its active GTP-bound state, keeping adenylyl cyclase active. The resulting cAMP surge drives ion and water loss into the intestine, causing diarrhea.","mustKnow":["Cholera toxin has one active A subunit and five binding B subunits.","It keeps Gs alpha active and raises cAMP.","High cAMP causes ion and water efflux into the intestine."],"terms":[{"term":"AB5 toxin","meaning":"A toxin containing one active A subunit and five receptor-binding B subunits."},{"term":"GM1","meaning":"The cell-surface receptor bound by cholera toxin B subunits."},{"term":"cAMP","meaning":"A second messenger produced by adenylyl cyclase."}],"diagramGuide":["The AB5 diagram shows five B subunits binding GM1 and one enzymatic A subunit entering the cell.","The signaling chain is persistent Gs activation to adenylyl cyclase to high cAMP to ion/water secretion into the intestine."]},{"page":312,"topic":"Host Pathogen Interaction","slideInLecture":54,"title":"How GPCR Signaling Begins","explain":"G protein-coupled receptors have seven membrane-spanning helices. Ligand binding activates a trimeric G protein, which then regulates an effector such as adenylyl cyclase.","mustKnow":["GPCRs have seven transmembrane helices.","They activate trimeric G proteins after ligand binding.","Adenylyl cyclase is one possible downstream effector."],"terms":[{"term":"GPCR","meaning":"A seven-transmembrane receptor that signals through G proteins."},{"term":"Trimeric G protein","meaning":"A signaling protein complex with alpha, beta, and gamma subunits."},{"term":"Effector","meaning":"A downstream protein whose activity is changed by a signal."}],"diagramGuide":["The receptor crosses the membrane seven times; ligand binding changes the cytosolic face, where it activates a heterotrimeric G protein that regulates an effector such as adenylyl cyclase."]},{"page":313,"topic":"Host Pathogen Interaction","slideInLecture":55,"title":"GPCR Amplification and Shutoff","explain":"An activated G protein can stimulate an effector to generate many second-messenger molecules, amplifying the signal. Signaling stops when the G alpha subunit hydrolyzes GTP, and receptor phosphorylation plus arrestin binding attenuates further receptor signaling.","mustKnow":["Effector activation can amplify the original signal.","GTP hydrolysis on G alpha helps stop signaling.","Receptor phosphorylation and arrestin produce attenuation."],"terms":[{"term":"Signal amplification","meaning":"Production of a larger intracellular response from a smaller initial signal."},{"term":"Signal attenuation","meaning":"Reduction of signaling despite continued or repeated stimulation."},{"term":"Arrestin","meaning":"A protein that binds phosphorylated GPCRs and limits further G-protein activation."}],"diagramGuide":["The left panels show signal amplification: one receptor activates multiple G proteins and effectors. The right panels show cessation/attenuation as GTP is hydrolyzed and components reset."]},{"page":314,"topic":"Host Pathogen Interaction","slideInLecture":56,"title":"Endotoxin Is Lipid A of LPS","explain":"In Gram-negative bacteria, the lipid A portion of lipopolysaccharide acts as endotoxin and contributes importantly to disease.","mustKnow":["Endotoxin is the lipid A portion of LPS.","LPS is associated with the Gram-negative bacterial cell wall."],"terms":[{"term":"Endotoxin","meaning":"The inflammatory lipid A component of Gram-negative LPS."},{"term":"LPS","meaning":"Lipopolysaccharide, a major component of the Gram-negative outer membrane."},{"term":"Lipid A","meaning":"The endotoxin-containing lipid portion of LPS."}],"diagramGuide":["The envelope diagram locates LPS in the outer membrane of Gram-negative bacteria; lipid A is the membrane-anchored toxic portion."]},{"page":315,"topic":"Host Pathogen Interaction","slideInLecture":57,"title":"How Endotoxin Is Released","explain":"Endotoxin can be released when Gram-negative bacteria are broken down. The listed causes are complement-mediated lysis, phagocytic digestion, and antibiotic use.","mustKnow":["Bacterial breakdown can release endotoxin.","Complement lysis, phagocytic digestion, and antibiotics are listed release routes."],"terms":[{"term":"Complement-mediated lysis","meaning":"Destruction of a microbial cell by complement proteins."},{"term":"Phagocytic digestion","meaning":"Breakdown of engulfed microbes inside a phagocyte."}],"diagramGuide":["The broken bacterium icon represents endotoxin release during bacterial lysis/digestion; listed causes include complement, phagocytes, and antibiotic treatment."]},{"page":316,"topic":"Host Pathogen Interaction","slideInLecture":58,"title":"Effects of Endotoxin","explain":"Endotoxin stimulates inflammatory signaling and cytokine secretion. The slide links this response with fever and effects involving the blood-brain barrier.","mustKnow":["Endotoxin promotes inflammation.","It stimulates cytokine secretion.","Fever is a major outcome."],"terms":[{"term":"Cytokine","meaning":"A secreted signaling protein that coordinates immune and inflammatory responses."},{"term":"Inflammation","meaning":"A coordinated host response to infection or tissue damage."},{"term":"Blood-brain barrier","meaning":"A selective barrier between circulating blood and brain tissue."}],"diagramGuide":["The central endotoxin node branches to cytokine secretion, inflammation, fever, and blood-brain-barrier effects; cytokines mediate several downstream effects."]},{"page":317,"topic":"Host Pathogen Interaction","slideInLecture":59,"title":"Endotoxin Is Heat Stable","explain":"Endotoxins are pyrogens, meaning they can cause fever. They are heat stable, so killing bacteria by some sterilization methods does not necessarily remove the endotoxin already present.","mustKnow":["Endotoxins are pyrogens.","Endotoxins are heat stable.","Bacterial killing does not guarantee endotoxin removal."],"terms":[{"term":"Pyrogen","meaning":"A substance that can produce fever."},{"term":"Heat stable","meaning":"Not readily destroyed by heating."},{"term":"Sterilization","meaning":"A process intended to eliminate viable microorganisms."}],"diagramGuide":["Read the sequence left to right: macrophage uptake of endotoxin, cytokine release into blood, hypothalamic prostaglandin production, and increased temperature set point.","The red note separates bacterial killing from endotoxin removal because endotoxin is heat stable."]},{"page":318,"topic":"Cell Death Pathways","slideInLecture":1,"title":"Lecture 31: Cell Death Pathways","explain":"This lecture introduces major regulated cell-death pathways, including apoptosis, necroptosis, autophagy-related degradation, and ferroptosis.","mustKnow":["The lecture topic is cell death pathways.","The following slides compare distinct mechanisms of cell death."],"terms":[{"term":"Cell-death pathway","meaning":"A defined molecular process that leads to loss of cell viability."}],"diagramGuide":["This is a section divider. The concentric-cell graphic introduces multiple regulated routes of cell death covered in the following slides."]},{"page":319,"topic":"Cell Death Pathways","slideInLecture":2,"title":"Why Programmed Cell Death Is Needed","explain":"Programmed cell death supports normal development and tissue homeostasis, regulates immune-cell populations, removes infected or damaged cells, and responds to cellular stress.","mustKnow":["It shapes tissues during devel
