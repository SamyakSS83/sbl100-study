<script>
const D={"topics":["Bioenergetics","Gene Expression and Regulation","Genetic Engineering Applications 1","Genetic Engineering Applications 2","Genetic Engineering Applications 3","Biological Motors","Cellular Signaling","Cell Death and Cell Division","Stem Cells and Differentiation","Host Pathogen Interaction","Cell Death Pathways","Cancer Biology 1","Cancer Biology 2 and Drug Development","Drug Development 1","Drug Development 2","Drug Development and Techniques","Techniques in Biochemistry and Biophysics"],"slides":[{"page":1,"topic":"Bioenergetics","slideInLecture":1,"title":"Bioenergetics","explain":"This lecture studies how cells obtain, transfer, and spend energy through chemical reactions.","mustKnow":["Bioenergetics connects cellular chemistry with energy flow."],"terms":[{"term":"Bioenergetics","meaning":"Study of energy changes and transfers in living systems."}],"diagramGuide":[]},{"page":2,"topic":"Bioenergetics","slideInLecture":2,"title":"Bioenergetics reference","explain":"This is a source-link slide and introduces no additional examinable concept.","mustKnow":["The lecture topic remains bioenergetics."],"terms":[],"diagramGuide":[]},{"page":3,"topic":"Bioenergetics","slideInLecture":3,"title":"What metabolism accomplishes","explain":"Metabolism is the coordinated reaction network that captures energy, converts nutrients into cellular building blocks, joins small units into macromolecules, and makes or removes specialized molecules.","mustKnow":["Cells obtain energy from sunlight or energy-rich nutrients.","Nutrients are converted into cellular precursors.","Monomers are polymerized into proteins, nucleic acids, and polysaccharides.","Metabolism also handles lipids, messengers, and pigments."],"terms":[{"term":"Precursor","meaning":"Starting molecule used to build another molecule."},{"term":"Macromolecule","meaning":"Large cellular molecule built from smaller units."}],"diagramGuide":["The lower-left loop pairs photosynthetic autotrophs with heterotrophs: plants supply organic products and O₂; heterotrophs return CO₂.","Read the numbered text as four outputs of metabolism: obtain energy, make precursors, polymerize macromolecules, and make or degrade specialized biomolecules."]},{"page":4,"topic":"Bioenergetics","slideInLecture":4,"title":"Nitrogen and unavoidable energy loss","explain":"Organisms need nitrogen to build amino acids and nucleic acids. During metabolism, not all energy remains useful: some becomes heat and entropy increases.","mustKnow":["Nitrogen is required for amino-acid and nucleic-acid synthesis.","Metabolic energy conversion loses some useful free energy as heat.","Entropy inevitably increases."],"terms":[{"term":"Free energy","meaning":"Energy available to perform useful work."},{"term":"Entropy","meaning":"Measure associated with energy dispersal or disorder."}],"diagramGuide":["The nitrogen-cycle arrows connect atmospheric N₂, ammonia (NH₄⁺), nitrite (NO₂⁻), nitrate (NO₃⁻), and amino acids.","Red arrows show microbial interconversion, including nitrogen fixation, nitrification, denitrification, and anammox; blue arrows connect inorganic nitrogen to plants, animals, and amino acids."]},{"page":5,"topic":"Bioenergetics","slideInLecture":5,"title":"Definition of metabolism","explain":"Metabolism is the complete set of chemical transformations in a cell or organism. These transformations occur as ordered, enzyme-catalyzed metabolic pathways.","mustKnow":["Metabolism is the sum of all chemical transformations.","Metabolic pathways are series of enzyme-catalyzed reactions."],"terms":[{"term":"Metabolic pathway","meaning":"Ordered series of enzyme-catalyzed reactions."}],"diagramGuide":["The blue upward arrow is anabolism: precursor molecules plus chemical energy form cell macromolecules.","The red downward arrow is catabolism: energy-containing nutrients become energy-depleted products while producing ATP and reduced electron carriers.","The center links the two directions through ATP/ADP and NAD(P)H/FADH₂ carrier pairs."]},{"page":6,"topic":"Bioenergetics","slideInLecture":6,"title":"Catabolic and anabolic pathway patterns","explain":"Catabolism usually funnels many starting molecules toward fewer products, so it is convergent. Anabolism starts from a smaller set of precursors and builds many products, so it is divergent. Separate enzymes prevent a futile back-and-forth cycle.","mustKnow":["Catabolic pathways are generally convergent.","Anabolic pathways are generally divergent.","Anabolism and catabolism use separate enzyme sets.","Pathways may be linear, branched, or cyclic."],"terms":[{"term":"Catabolism","meaning":"Breakdown pathways that extract energy from nutrients."},{"term":"Anabolism","meaning":"Biosynthetic pathways that use energy to make cellular molecules."},{"term":"Convergent","meaning":"Several inputs lead toward a common product."},{"term":"Divergent","meaning":"One precursor leads toward several products."}],"diagramGuide":["The left network funnels many carbohydrates and amino acids into acetyl-CoA: this is converging catabolism.","The right network branches from acetyl-CoA and other precursors to many products: this is diverging anabolism.","The circular route below is a cyclic pathway: intermediates regenerate while material enters or leaves."]},{"page":7,"topic":"Bioenergetics","slideInLecture":7,"title":"Reciprocal regulation and compartmentation","explain":"Opposing anabolic and catabolic routes are controlled reciprocally, may follow different reaction sequences, and can occur in different cellular compartments. This prevents both directions from running strongly at once.","mustKnow":["Opposing pathways are reciprocally regulated.","Opposite pathways may use different reaction sequences.","Paired pathways can occur in different compartments."],"terms":[{"term":"Reciprocal regulation","meaning":"Activation of one opposing pathway is coordinated with inhibition of the other."},{"term":"Compartmentation","meaning":"Separation of processes into different cellular locations."}],"diagramGuide":[]},{"page":8,"topic":"Bioenergetics","slideInLecture":8,"title":"Michaelis–Menten enzyme kinetics","explain":"As substrate concentration rises, reaction rate approaches a maximum because the enzyme becomes saturated. Vmax is that maximum rate; KM is the substrate concentration giving half of Vmax.","mustKnow":["Vmax is reached near saturating substrate concentration.","At substrate concentration KM, rate equals Vmax/2.","Vmax applies for a given enzyme concentration."],"terms":[{"term":"Vmax","meaning":"Maximum reaction rate at enzyme saturation."},{"term":"KM","meaning":"Substrate concentration at which rate is half Vmax."},{"term":"Saturation","meaning":"Condition in which adding substrate produces little further rate increase."}],"diagramGuide":["The x-axis is substrate concentration and the y-axis is reaction rate.","The curve approaches Vmax asymptotically as enzyme becomes saturated.","Projecting from ½Vmax to the curve and then down to the x-axis identifies KM."]},{"page":9,"topic":"Bioenergetics","slideInLecture":9,"title":"Regulation of metabolism","explain":"The slide lists three ways metabolism is controlled: substrate availability, allosteric regulation, and hormonal regulation. Each changes whether an enzyme can efficiently run its reaction.","mustKnow":["Low substrate relative to KM limits reaction rate.","Allosteric molecules bind enzymes and alter activity.","Hormones can change enzyme synthesis or degradation."],"terms":[{"term":"Allosteric regulation","meaning":"Control by a molecule binding away from the active site and changing enzyme activity."},{"term":"Hormonal regulation","meaning":"Control of metabolism in response to hormones."}],"diagramGuide":["The small saturation curve reinforces that when substrate concentration is below KM, reaction rate is below half Vmax."]},{"page":10,"topic":"Bioenergetics","slideInLecture":10,"title":"Thermodynamic quantities","explain":"ΔG combines the effects of enthalpy and entropy and predicts energetic favorability. Negative ΔG means energy release; positive ΔG means energy input is required. ΔH tracks heat change, while ΔS tracks entropy change.","mustKnow":["Negative ΔG describes an exergonic reaction.","Positive ΔG describes an endergonic reaction.","Negative ΔH releases heat; positive ΔH absorbs heat.","Positive ΔS means products are more disordered than reactants."],"terms":[{"term":"ΔG","meaning":"Free-energy change of a reaction."},{"term":"ΔH","meaning":"Enthalpy or heat change."},{"term":"ΔS","meaning":"Entropy change."},{"term":"Exergonic","meaning":"Energy-releasing reaction with negative ΔG."}],"diagramGuide":[]},{"page":11,"topic":"Bioenergetics","slideInLecture":11,"title":"Relationship among ΔG, ΔH, and ΔS","explain":"The equation ΔG = ΔH − TΔS combines heat and entropy effects at temperature T. A reaction is favorable when ΔG is negative; heat release or increased entropy tends to make ΔG more negative.","mustKnow":["ΔG = ΔH − TΔS.","A negative ΔG indicates a favorable reaction.","Negative ΔH and positive ΔS favor a negative ΔG."],"terms":[{"term":"Favorable reaction","meaning":"Reaction with negative free-energy change under the stated conditions."},{"term":"T","meaning":"Absolute temperature used in the free-energy equation."}],"diagramGuide":["In ΔG = ΔH − TΔS, increasing positive ΔS makes the subtracted TΔS term larger and therefore makes ΔG more negative.","A negative ΔH also drives ΔG downward; either heat release or increased entropy can favor a reaction."]},{"page":12,"topic":"Bioenergetics","slideInLecture":12,"title":"Biochemical standard state and reaction quotient","explain":"For aA + bB ⇌ cC + dD, the equilibrium constant uses product concentrations over reactant concentrations, each raised to its coefficient. Biochemical standard conditions set pH 7 and treat water as 55.5 M; away from equilibrium, ΔG supplies the driving force.","mustKnow":["Keq = [C]^c[D]^d / [A]^a[B]^b.","Biochemical standard state uses [H+] = 10^-7 M, or pH 7.","Water is treated as 55.5 M.","When not at equilibrium, ΔG drives movement toward equilibrium."],"terms":[{"term":"Equilibrium constant","meaning":"Concentration ratio describing a reaction at equilibrium."},{"term":"Biochemical standard state","meaning":"Standard convention using pH 7 for biochemical reactions."}],"diagramGuide":["In the equilibrium expression, product concentrations are in the numerator and reactant concentrations are in the denominator; stoichiometric coefficients become exponents.","The double arrow means the reaction can proceed in either direction until equilibrium is reached."]},{"page":13,"topic":"Bioenergetics","slideInLecture":13,"title":"Exergonic reactions","explain":"An exergonic reaction releases free energy, has negative ΔG, and can perform work. It may occur spontaneously under the given conditions, although that does not say how fast it occurs.","mustKnow":["Exergonic reactions release energy.","Exergonic reactions have ΔG < 0.","They can perform work and include many catabolic reactions.","Exergonic does not mean instantaneous."],"terms":[{"term":"Exergonic reaction","meaning":"Reaction with negative ΔG that releases free energy."},{"term":"Spontaneous","meaning":"Thermodynamically able to proceed without net energy input under stated conditions."}],"diagramGuide":["The energy profile rises to an activation barrier and ends with products below reactants.","The vertical difference between reactant and product levels is negative ΔG; the downward final level represents net energy release."]},{"page":14,"topic":"Bioenergetics","slideInLecture":14,"title":"Endergonic reactions","explain":"An endergonic reaction requires energy input and has positive ΔG. Many anabolic reactions are endergonic. If the reaction is reversed, the reverse direction is exergonic.","mustKnow":["Endergonic reactions require energy input.","Endergonic reactions have ΔG > 0.","Many anabolic reactions are endergonic.","The reverse of an endergonic reaction is exergonic."],"terms":[{"term":"Endergonic reaction","meaning":"Reaction with positive ΔG that requires free-energy input."},{"term":"Anabolic reaction","meaning":"Reaction involved in building complex cellular molecules."}],"diagramGuide":["The profile ends with products above reactants, so ΔG is positive.","An energy input is required to move from the lower reactant level to the higher product level."]},{"page":15,"topic":"Bioenergetics","slideInLecture":15,"title":"Standard free energy and equilibrium","explain":"Standard transformed free energy is linked to the equilibrium constant by ΔG°′ = −RT ln K′eq. A large equilibrium constant gives a negative ΔG°′ and favors products under standard biochemical conditions.","mustKnow":["ΔG°′ = −RT ln K′eq.","K′eq > 1 corresponds to negative ΔG°′.","K′eq = 1 corresponds to ΔG°′ = 0.","K′eq < 1 corresponds to positive ΔG°′."],"terms":[{"term":"ΔG°′","meaning":"Standard transformed free-energy change at biochemical standard conditions."},{"term":"K′eq","meaning":"Equilibrium constant using biochemical conventions."}],"diagramGuide":["The table links K′eq > 1 with negative ΔG′° and forward direction, K′eq = 1 with ΔG′° = 0, and K′eq < 1 with positive ΔG′° and reverse direction."]},{"page":16,"topic":"Bioenergetics","slideInLecture":16,"title":"Energy-unit conversion","explain":"Biochemical energies may be written in kilocalories or kilojoules. Convert using 1 kcal = 4.184 kJ.","mustKnow":["1 kcal equals 4.184 kJ."],"terms":[{"term":"kcal","meaning":"Kilocalorie, a unit of energy."},{"term":"kJ","meaning":"Kilojoule, a unit of energy."}],"diagramGuide":["Moving K′eq by each tenfold step changes ΔG′° by about 5.7 kJ/mol at 25°C.","Values above 1 give negative ΔG′°; reciprocal values below 1 give equal positive magnitudes."]},{"page":17,"topic":"Bioenergetics","slideInLecture":17,"title":"Calculating ΔG°′ from K′eq","explain":"For A ⇌ B with K′eq = 12, inserting the value into ΔG°′ = −RT ln K′eq gives about −6.15 kJ/mol. The negative sign means the standard-condition reaction favors B.","mustKnow":["A K′eq of 12 gives negative ΔG°′.","The shown result is approximately −6.15 kJ/mol.","Negative ΔG°′ favors the forward direction under standard conditions."],"terms":[{"term":"R","meaning":"Gas constant used in thermodynamic equations."},{"term":"ln","meaning":"Natural logarithm."}],"diagramGuide":["For A ⇌ B, K′eq is [B]/[A]. Substituting 12 into −RT ln K′eq gives approximately −6.16 kJ/mol."]},{"page":18,"topic":"Bioenergetics","slideInLecture":18,"title":"Actual free-energy change","explain":"Actual ΔG depends on both the reaction's standard ΔG°′ and the current product-to-reactant concentration ratio. Changing concentrations can therefore change the direction favored inside a cell.","mustKnow":["ΔG = ΔG°′ + RT ln([C][D]/[A][B]) for the shown reaction.","ΔG varies with reactant and product concentrations.","ΔG°′ alone does not determine cellular direction."],"terms":[{"term":"Reaction quotient","meaning":"Current product-to-reactant concentration ratio used before equilibrium."}],"diagramGuide":["The reaction quotient shown is [C][D]/[A][B]: raising products raises ΔG, whereas raising reactants lowers ΔG.","Actual ΔG equals the standard transformed value plus the concentration-dependent RT ln Q term."]},{"page":19,"topic":"Bioenergetics","slideInLecture":19,"title":"Glycolysis as a reaction sequence","explain":"The diagram presents glycolysis as linked enzyme-catalyzed steps converting glucose toward pyruvate, with ATP used in early steps and energy captured later as ATP and NADH.","mustKnow":["Glycolysis is a multistep pathway.","ATP is consumed in early phosphorylation steps.","Later steps produce ATP and NADH.","The pathway proceeds from glucose toward pyruvate."],"terms":[{"term":"Glycolysis","meaning":"Pathway that converts glucose through multiple steps toward pyruvate."},{"term":"NADH","meaning":"Reduced electron-carrying form of NAD+."},{"term":"Phosphorylation","meaning":"Addition or transfer of a phosphoryl group."}],"diagramGuide":["Follow glycolysis left-to-right across the upper row and then right-to-left across the lower row to pyruvate.","ATP is consumed at hexokinase and phosphofructokinase; NADH is formed at glyceraldehyde-3-phosphate dehydrogenase; ATP is produced at phosphoglycerate kinase and pyruvate kinase."]},{"page":20,"topic":"Bioenergetics","slideInLecture":20,"title":"Free-energy changes are additive","explain":"For consecutive reactions A → B and B → C, the intermediate B cancels in the net equation. The overall free-energy change is the sum ΔG°′1 + ΔG°′2.","mustKnow":["Free-energy changes of successive reactions add.","A shared intermediate cancels from the net reaction.","The net reaction shown is A → C."],"terms":[{"term":"Intermediate","meaning":"Molecule produced in one step and consumed in a later step."},{"term":"Net reaction","meaning":"Overall reaction after canceling shared intermediates."}],"diagramGuide":["The two arrows A→B and B→C share intermediate B; cancellation of B gives the net reaction A→C.","The net ΔG′° is the arithmetic sum ΔG′°₁ + ΔG′°₂."]},{"page":21,"topic":"Bioenergetics","slideInLecture":21,"title":"Coupling unfavorable and favorable reactions","explain":"An unfavorable glucose phosphorylation can proceed when coupled to favorable ATP hydrolysis through a shared intermediate. Adding +13.8 and −30.5 kJ/mol gives a negative overall ΔG°′ of −16.7 kJ/mol.","mustKnow":["Reaction coupling adds component ΔG values.","ATP hydrolysis can drive an endergonic reaction.","The shown coupled reaction has ΔG°′ = −16.7 kJ/mol.","A negative overall ΔG°′ makes the combined process favorable."],"terms":[{"term":"Reaction coupling","meaning":"Linking an unfavorable reaction to a favorable one so the combined ΔG is negative."},{"term":"Glucose 6-phosphate","meaning":"Phosphorylated glucose product in the shown coupled reaction."}],"diagramGuide":["The unfavorable phosphorylation of glucose (+13.8 kJ/mol) is added to favorable ATP hydrolysis (−30.5 kJ/mol).","Pi is the common intermediate and cancels, leaving ATP + glucose → ADP + glucose-6-phosphate with net −16.7 kJ/mol."]},{"page":22,"topic":"Bioenergetics","slideInLecture":22,"title":"Free-energy summary I","explain":"ΔG is the net result of bonding stability, represented by enthalpy, and energy dispersal, represented by entropy. ΔG°′ is a reaction constant linked to equilibrium, while actual ΔG also includes current concentrations.","mustKnow":["ΔG reflects both enthalpy and entropy.","ΔG°′ can be calculated from K′eq.","Actual ΔG depends on ΔG°′ and concentrations."],"terms":[{"term":"Enthalpy","meaning":"Thermodynamic quantity associated here with bonding and heat."},{"term":"Standard transformed free energy","meaning":"Reaction-specific free-energy change under biochemical standard conditions."}],"diagramGuide":[]},{"page":23,"topic":"Bioenergetics","slideInLecture":23,"title":"Free-energy summary II","explain":"Negative ΔG favors forward reaction, positive ΔG favors reverse reaction, and ΔG = 0 marks equilibrium. ΔG does not depend on the route taken, and stepwise ΔG values add.","mustKnow":["ΔG < 0 favors forward direction.","ΔG > 0 favors reverse direction.","ΔG = 0 at equilibrium.","ΔG is path-independent and additive."],"terms":[{"term":"Path-independent","meaning":"Depends only on initial and final states, not the reaction route."},{"term":"Equilibrium","meaning":"State at which ΔG equals zero and there is no net driving force."}],"diagramGuide":[]},{"page":24,"topic":"Bioenergetics","slideInLecture":24,"title":"ATP as the cellular energy currency","explain":"ATP is the main energy currency used to drive metabolic and catabolic processes. Cells synthesize ATP, hydrolyze it to ADP and phosphate for work, and monitor the ATP-to-ADP balance as an energy-charge signal.","mustKnow":["ATP is the main metabolic energy currency.","ATP hydrolysis produces ADP and inorganic phosphate.","The ATP/ADP ratio reports cellular energy status.","Low ATP relative to ADP promotes ATP synthesis by oxidative phosphorylation."],"terms":[{"term":"ATP","meaning":"Adenosine triphosphate, the major cellular energy-transfer molecule."},{"term":"ADP","meaning":"Adenosine diphosphate, produced when ATP loses a phosphate."},{"term":"Energy charge","meaning":"Cellular energy status reflected by adenine nucleotide ratios."},{"term":"Oxidative phosphorylation","meaning":"Process that synthesizes ATP when cellular energy is low."}],"diagramGuide":[]},{"page":25,"topic":"Bioenergetics","slideInLecture":25,"title":"Sources and uses of free energy","explain":"Cells are isothermal systems that need a continuous free-energy source. Photosynthetic cells capture solar radiation, while heterotrophic cells obtain energy from nutrient molecules; both convert energy into ATP and other energy-rich compounds.","mustKnow":["Cells require a source of free energy.","Photosynthetic cells obtain energy from sunlight.","Heterotrophic cells obtain energy from nutrients.","Cells convert captured energy into ATP and other energy-rich compounds."],"terms":[{"term":"Isothermal system","meaning":"System operating at approximately constant temperature."},{"term":"Photosynthetic cell","meaning":"Cell that captures energy from solar radiation."},{"term":"Heterotrophic cell","meaning":"Cell that obtains energy from nutrient molecules."}],"diagramGuide":[]},{"page":26,"topic":"Bioenergetics","slideInLecture":26,"title":"Redox potential","explain":"Redox potential measures a compound's tendency to give or receive electrons. The slide relates it to the ratio of reducing and oxidizing forms and notes the NAD+/NADH pair as important in bioenergetics.","mustKnow":["Redox potential describes electron-donation or electron-acceptance tendency.","It depends on the ratio of reducing to oxidizing agent.","The NAD+/NADH ratio is metabolically important."],"terms":[{"term":"Redox potential","meaning":"Quantitative measure of tendency to donate or accept electrons."},{"term":"Reducing agent","meaning":"Electron donor."},{"term":"Oxidizing agent","meaning":"Electron acceptor."},{"term":"NAD+/NADH","meaning":"Oxidized/reduced forms of a biological electron carrier."}],"diagramGuide":["In the Nernst-style expression, the reducing-agent concentration is in the numerator and oxidizing-agent concentration in the denominator.","The slide uses the NAD⁺/NADH + H⁺ pair as the biologically relevant redox ratio."]},{"page":27,"topic":"Bioenergetics","slideInLecture":27,"title":"High-energy compounds","explain":"High-energy compounds release substantial free energy on hydrolysis. The slide uses more than 7.0 kcal/mol as its cutoff and notes that many, but not all, contain phosphate groups.","mustKnow":["High-energy compounds release more than 7.0 kcal/mol on hydrolysis by the slide's definition.","Low-energy compounds release less than 7.0 kcal/mol.","Many high-energy compounds are high-energy phosphates.","Not every high-energy compound must be a phosphate."],"terms":[{"term":"High-energy compound","meaning":"Compound whose hydrolysis releases a large amount of free energy."},{"term":"Hydrolysis","meaning":"Bond cleavage involving water."},{"term":"High-energy phosphate","meaning":"Phosphate-containing compound with high free energy of hydrolysis."}],"diagramGuide":[]},{"page":28,"topic":"Bioenergetics","slideInLecture":28,"title":"Classes of high-energy compounds","explain":"The table groups high-energy molecules by bond type: acyl phosphates, enol phosphates, thiol esters, and guanidino phosphates. ATP and pyrophosphate appear among the acyl-phosphate examples.","mustKnow":["Acyl phosphates include ATP and pyrophosphate in the table.","Phosphoenolpyruvate is an enol phosphate.","Acetyl-CoA is a thiol ester.","Phosphocreatine is a guanidino phosphate."],"terms":[{"term":"Acyl phosphate","meaning":"High-energy class containing a carbonyl-linked phosphate arrangement."},{"term":"Enol phosphate","meaning":"High-energy phosphate class represented by phosphoenolpyruvate."},{"term":"Thiol ester","meaning":"High-energy sulfur-containing ester represented by acetyl-CoA."},{"term":"Guanidino phosphate","meaning":"High-energy phosphate class represented by phosphocreatine."}],"diagramGuide":["Read each row as class → characteristic bond → examples: pyrophosphates, acyl phosphates, enol phosphates, thioesters, and guanidino phosphates."]},{"page":29,"topic":"Bioenergetics","slideInLecture":29,"title":"ATP structure and cleavage","explain":"ATP contains adenine, ribose, and three phosphate groups. Removal of the terminal phosphate produces ADP + Pi, while pyrophosphate cleavage produces AMP + PPi; both reactions release energy.","mustKnow":["ATP contains adenine, ribose, and three phosphates.","ATP → ADP + Pi removes one terminal phosphate.","ATP → AMP + PPi cleaves off pyrophosphate.","Both cleavage modes release energy."],"terms":[{"term":"Pi","meaning":"Inorganic phosphate."},{"term":"PPi","meaning":"Inorganic pyrophosphate, two linked phosphate units."},{"term":"AMP","meaning":"Adenosine monophosphate."}],"diagramGuide":["ATP consists of adenine attached to ribose at the ribose 1′ carbon, with three phosphates attached at the 5′ carbon.","The diagram labels the nitrogenous base, ribose sugar, and triphosphate chain as separate structural regions."]},{"page":30,"topic":"Bioenergetics","slideInLecture":30,"title":"Standard versus cellular ATP hydrolysis","explain":"ATP hydrolysis has ΔG°′ = −30.5 kJ/mol under standard conditions, but actual cellular ΔG differs because ATP, ADP, and Pi concentrations are unequal and far below 1 M.","mustKnow":["Standard ATP-hydrolysis ΔG°′ is −30.5 kJ/mol.","Actual cellular ΔG is not the same as ΔG°′.","Cellular ATP, ADP, and Pi concentrations are unequal.","Cellular concentrations are much lower than the 1 M standard."],"terms":[{"term":"Standard conditions","meaning":"Reference conditions used to define ΔG°′."},{"term":"Cellular ΔG","meaning":"Free-energy change calculated with actual intracellular conditions."}],"diagramGuide":["The table compares ATP, ADP, AMP, Pi, and phosphocreatine concentrations across cell types; these are millimolar values, not the 1 M standard state."]},{"page":31,"topic":"Bioenergetics","slideInLecture":31,"title":"Mg2+ complexes with ATP and ADP","explain":"In the cytosol, Mg2+ binds ATP and ADP. For most enzymatic phosphoryl transfers, the true substrate is MgATP2+, so the relevant standard free energy is for hydrolysis of the magnesium complex.","mustKnow":["Cytosolic Mg2+ binds ATP and ADP.","MgATP2+ is the true substrate for most ATP-dependent phosphoryl transfers.","The relevant ΔG°′ is for MgATP2+ hydrolysis."],"terms":[{"term":"MgATP2+","meaning":"Magnesium-bound ATP complex used by many enzymes."},{"term":"Phosphoryl-group donor","meaning":"Molecule that transfers a phosphoryl group to another molecule."}],"diagramGuide":["Mg²⁺ is drawn chelating phosphate oxygens of ATP and ADP.","The labeled complexes are MgATP²⁻ and MgADP⁻; for phosphoryl transfer, MgATP²⁻ is the true enzymatic substrate."]},{"page":32,"topic":"Bioenergetics","slideInLecture":32,"title":"Actual ATP-hydrolysis energy in an erythrocyte","explain":"Using erythrocyte ATP, ADP, and Pi concentrations in the ΔG equation gives approximately −51.82 kJ/mol, more negative than the standard −30.5 kJ/mol value.","mustKnow":["The calculation uses actual ATP, ADP, and Pi concentrations.","The shown erythrocyte result is about −51.82 kJ/mol.","Cellular ATP hydrolysis can release more free energy than the standard value."],"terms":[{"term":"Erythrocyte","meaning":"Red blood cell."},{"term":"Concentration correction","meaning":"RT ln term used to convert ΔG°′ to actual ΔG."}],"diagramGuide":["The calculation inserts erythrocyte [ATP], [ADP], and [Pi] into ΔG = ΔG′° + RT ln([ADP][Pi]/[ATP]).","The concentration term makes cellular ATP hydrolysis more favorable: the result is −51.8 kJ/mol rather than −30.5 kJ/mol."]},{"page":33,"topic":"Bioenergetics","slideInLecture":33,"title":"ATP use and production in glycolysis","explain":"The pathway diagram marks ATP-consuming phosphorylation steps near the beginning and ATP-producing substrate-level phosphorylation steps later, alongside NADH formation.","mustKnow":["Glycolysis first invests ATP.","Later glycolytic steps generate ATP.","NAD+ is reduced to NADH during glycolysis.","Energy transfer occurs across a sequence of intermediates."],"terms":[{"term":"Substrate-level phosphorylation","meaning":"Direct formation of ATP by transfer of phosphate from a metabolic intermediate to ADP."},{"term":"Glycolytic intermediate","meaning":"Molecule formed and consumed between glucose and pathway end products."}],"diagramGuide":["The glycolysis map highlights the two ATP-investment reactions, the NADH-producing oxidation, and the two ATP-producing substrate-level phosphorylation reactions."]},{"page":34,"topic":"Bioenergetics","slideInLecture":34,"title":"1,3-Bisphosphoglycerate transfers phosphate to ADP","explain":"The diagram shows 1,3-bisphosphoglycerate donating a phosphate to ADP, forming ATP and 3-phosphoglycerate. Its hydrolysis is more favorable than ATP hydrolysis, enabling ATP formation.","mustKnow":["1,3-bisphosphoglycerate has high phosphoryl-transfer potential.","It transfers phosphate to ADP.","The products shown are ATP and 3-phosphoglycerate."],"terms":[{"term":"1,3-Bisphosphoglycerate","meaning":"High-energy glycolytic intermediate that can phosphorylate ADP."},{"term":"Phosphoryl-transfer potential","meaning":"Tendency of a molecule to donate a phosphoryl group."}],"diagramGuide":["Each panel explains a favorable hydrolysis product: 1,3-bisphosphoglycerate gains resonance stabilization, PEP forms pyruvate by tautomerization, and phosphocreatine products gain resonance stabilization."]},{"page":35,"topic":"Bioenergetics","slideInLecture":35,"title":"Why phosphoenolpyruvate has high transfer potential","explain":"Phosphoenolpyruvate hydrolysis first forms an enol form of pyruvate, which then rearranges to the more stable keto form. This product stabilization makes hydrolysis strongly favorable.","mustKnow":["Phosphoenolpyruvate has high standard free energy of hydrolysis.","Hydrolysis forms enol pyruvate.","Enol pyruvate tautomerizes to stable keto pyruvate.","Product stabilization drives the reaction."],"terms":[{"term":"Phosphoenolpyruvate","meaning":"High-energy glycolytic phosphate donor abbreviated PEP."},{"term":"Tautomerization","meaning":"Rearrangement between structural forms, here enol and keto pyruvate."},{"term":"Keto form","meaning":"More stable pyruvate form shown after rearrangement."}],"diagramGuide":["Acetyl-CoA hydrolysis first forms acetic acid and CoA-SH; ionization then gives resonance-stabilized acetate.","The table ranks PEP most negative, followed by 1,3-BPG, phosphocreatine, ADP→AMP+Pi, ATP→ADP+Pi, and lower-energy phosphate esters."]},{"page":36,"topic":"Bioenergetics","slideInLecture":36,"title":"ATP powers work through transfers and conformational cycles","explain":"ATP commonly drives work by transferring chemical groups or by hydrolysis-linked changes in protein shape. These cycles power muscle motion and proteins moving along DNA, mRNA, or other tracks.","mustKnow":["ATP energy is often delivered by group transfer, not isolated hydrolysis.","ATP hydrolysis can switch proteins between conformations.","Such switching powers mechanical motion.","Helicases, RecA, topoisomerases, and replication ATPases are listed examples."],"terms":[{"term":"Conformation","meaning":"Three-dimensional shape adopted by a protein."},{"term":"ATPase","meaning":"Enzyme or protein activity that hydrolyzes ATP."},{"term":"Helicase","meaning":"ATP-dependent protein involved in separating nucleic-acid strands."}],"diagramGuide":["The top drawing compresses glutamine synthesis into one arrow, but the lower drawing shows the actual two-step route.","ATP first forms enzyme-bound glutamyl phosphate; NH₃ then displaces phosphate to form glutamine."]},{"page":37,"topic":"Bioenergetics","slideInLecture":37,"title":"Ranking phosphoryl-transfer potential","explain":"The graph ranks phosphate compounds by standard free energy of hydrolysis. Compounds above ATP, such as phosphoenolpyruvate, 1,3-bisphosphoglycerate, and phosphocreatine, can donate phosphate to ADP; ATP can donate to compounds below it.","mustKnow":["More negative hydrolysis ΔG°′ means higher phosphoryl-transfer potential.","PEP, 1,3-BPG, and phosphocreatine rank above ATP.","ATP occupies an intermediate transfer position.","Glucose 6-phosphate and glycerol phosphate rank below ATP."],"terms":[{"term":"Phosphocreatine","meaning":"High-energy phosphate reserve capable of phosphorylating ADP."},{"term":"Transfer potential","meaning":"Relative ability to donate a chemical group."}],"diagramGuide":["The y-axis is ΔG′° of hydrolysis in kJ/mol; more negative values are higher phosphoryl-transfer potential.","PEP, 1,3-BPG, and phosphocreatine lie above ATP; glucose-6-phosphate and glycerol phosphate lie below ATP.","Arrows toward ATP indicate high-energy donors can phosphorylate ADP; arrows from ATP toward lower compounds indicate ATP can phosphorylate those acceptors."]},{"page":38,"topic":"Bioenergetics","slideInLecture":38,"title":"Three group transfers from ATP","explain":"ATP can transfer different groups depending on which phosphorus atom is attacked: phosphoryl transfer yields ADP, pyrophosphoryl transfer yields AMP, and adenylyl transfer yields pyrophosphate.","mustKnow":["Phosphoryl transfer leaves ADP.","Pyrophosphoryl transfer leaves AMP.","Adenylyl transfer leaves PPi.","ATP is a donor of more than just terminal phosphate."],"terms":[{"term":"Phosphoryl transfer","meaning":"Transfer of the terminal phosphate group from ATP."},{"term":"Pyrophosphoryl transfer","meaning":"Transfer of a two-phosphate group from ATP."},{"term":"Adenylyl transfer","meaning":"Transfer of the AMP portion of ATP."}],"diagramGuide":["Attack at ATP's γ phosphate transfers phosphoryl and leaves ADP; attack at β transfers pyrophosphoryl and leaves AMP; attack at α transfers adenylyl and releases PPi.","The three red attack arrows map directly to the three labeled products below."]},{"page":39,"topic":"Bioenergetics","slideInLecture":39,"title":"ATP activates luciferin in fireflies","explain":"Firefly light production begins when luciferase uses ATP to activate luciferin. ATP is cleaved to form luciferyl adenylate, converting chemical energy into a form used by the light-producing reaction.","mustKnow":["Luciferin is the light-producing substrate.","Luciferase is the enzyme.","ATP activation forms luciferyl adenylate.","The pathway converts chemical energy into light energy."],"terms":[{"term":"Luciferin","meaning":"Firefly substrate that participates in light production."},{"term":"Luciferase","meaning":"Enzyme catalyzing firefly bioluminescence reactions."},{"term":"Luciferyl adenylate","meaning":"ATP-activated luciferin intermediate."},{"term":"Bioluminescence","meaning":"Light production by a living organism."}],"diagramGuide":[]},{"page":40,"topic":"Bioenergetics","slideInLecture":40,"title":"Oxidation produces firefly light","explain":"With oxygen and luciferase, activated luciferin undergoes oxidative decarboxylation to oxyluciferin and emits light. Luciferase structure influences light color, and luciferin is later regenerated.","mustKnow":["Molecular oxygen and luciferase are required in the shown light-producing step.","Luciferin is converted to oxyluciferin.","Light accompanies oxidative decarboxylation.","Species differences in luciferase structure affect light color."],"terms":[{"term":"Oxyluciferin","meaning":"Oxidized product formed during firefly light emission."},{"term":"Oxidative decarboxylation","meaning":"Oxidation coupled to removal of a carboxyl group as carbon dioxide."}],"diagramGuide":["The cycle starts with luciferin activation by ATP to luciferyl adenylate, releasing PPi.","Luciferase and O₂ convert the activated intermediate to oxyluciferin with light emission and release of CO₂ and AMP.","Regenerating reactions return oxyluciferin to luciferin."]},{"page":41,"topic":"Gene Expression and Regulation","slideInLecture":1,"title":"Gene Expression and Regulation","explain":"This lecture follows information from genes to proteins and then examines how cells regulate that flow, especially through prokaryotic operons.","mustKnow":["The lecture moves from genes and expression to operon-based regulation."],"terms":[{"term":"Gene expression","meaning":"Use of genetic information to produce a functional product."},{"term":"Operon","meaning":"Cluster of prokaryotic genes controlled together."}],"diagramGuide":[]},{"page":42,"topic":"Gene Expression and Regulation","slideInLecture":2,"title":"Lecture roadmap","explain":"The lecture covers genes, replication, transcription, translation, positive and negative regulation, constitutive and inducible genes, and prokaryotic operons including the lac operon.","mustKnow":["Expression topics include replication, transcription, and translation.","Regulation may be positive or negative.","Genes may be constitutive or inducible.","The lac operon is the main prokaryotic example."],"terms":[{"term":"Constitutive gene","meaning":"Gene expressed continuously under the stated conditions."},{"term":"Inducible gene","meaning":"Gene whose expression can be switched on by an inducing signal."}],"diagramGuide":[]},{"page":43,"topic":"Gene Expression and Regulation","slideInLecture":3,"title":"What is a gene?","explain":"A gene is a segment of genetic material encoded in DNA. Genes pass between generations and contribute to inherited characteristics and disease risk.","mustKnow":["A gene is a piece of genetic material encoded in DNA.","Genes are inherited from parents.","Genes contribute to characteristics and inherited disease."],"terms":[{"term":"Gene","meaning":"Segment of DNA carrying genetic information."},{"term":"Inherited","meaning":"Passed genetically from parent to offspring."},{"term":"Chromosome","meaning":"DNA-containing structure that carries genes."}],"diagramGuide":["The nesting sequence is cell → nucleus → chromosome → DNA; the bracket marks a gene as a segment of DNA."]},{"page":44,"topic":"Gene Expression and Regulation","slideInLecture":4,"title":"Gene expression and the central dogma","explain":"Gene expression is the multistep use of genetic information to produce proteins. The central dogma summarizes residue-by-residue information flow as DNA → RNA → protein.","mustKnow":["Central information flow is DNA → RNA → protein.","DNA-to-DNA transfer occurs in replication.","DNA-to-RNA transfer occurs in transcription.","RNA-to-protein transfer occurs in translation."],"terms":[{"term":"Central dogma","meaning":"Framework describing information flow from DNA to RNA to protein."},{"term":"Replication","meaning":"Copying DNA into DNA."},{"term":"Transcription","meaning":"Using DNA information to synthesize RNA."},{"term":"Translation","meaning":"Using mRNA information to synthesize protein."}],"diagramGuide":["The central vertical arrows show DNA replication, DNA→RNA transcription, RNA→protein translation, and protein folding.","Side arrows add recognized information transfers such as reverse transcription and RNA-dependent RNA replication.","The diagram does not show information transfer from protein back to nucleic acid."]},{"page":45,"topic":"Gene Expression and Regulation","slideInLecture":5,"title":"DNA replication","explain":"Replication duplicates DNA during S phase. It is semiconservative: each daughter DNA molecule contains one parental strand and one newly synthesized strand.","mustKnow":["Replication is DNA synthesis or duplication.","Replication occurs in S phase.","Replication is semiconservative.","Each daughter DNA has one old and one new strand."],"terms":[{"term":"S phase","meaning":"Cell-cycle phase in which DNA is replicated."},{"term":"Semiconservative replication","meaning":"Replication producing DNA molecules with one parental and one new strand."},{"term":"Daughter molecule","meaning":"New DNA molecule produced by replication."}],"diagramGuide":[]},{"page":46,"topic":"Gene Expression and Regulation","slideInLecture":6,"title":"The replication fork","explain":"At the fork, helicase opens DNA. The leading strand is synthesized continuously toward fork movement, while the lagging strand is made discontinuously as Okazaki fragments from RNA primers.","mustKnow":["Helicase opens the parental DNA.","The leading strand is synthesized continuously.","The lagging strand forms Okazaki fragments.","RNA primers provide starts for DNA synthesis."],"terms":[{"term":"Replication fork","meaning":"Y-shaped region where parental DNA opens and is copied."},{"term":"Leading strand","meaning":"New strand synthesized continuously toward fork movement."},{"term":"Lagging strand","meaning":"New strand synthesized discontinuously."},{"term":"Okazaki fragment","meaning":"Short DNA segment made on the lagging strand."}],"diagramGuide":["The fork moves downward while helicase opens the parental duplex; topoisomerase acts ahead of helicase and SSB proteins coat separated strands.","The leading strand is synthesized continuously toward the fork; the lagging strand is synthesized discontinuously as Okazaki fragments away from the fork.","Every new DNA segment extends 5′→3′ from an RNA primer."]},{"page":47,"topic":"Gene Expression and Regulation","slideInLecture":7,"title":"Replication video references","explain":"This slide contains external video links intended to reinforce the DNA-replication mechanism.","mustKnow":["The referenced topic is DNA replication."],"terms":[],"diagramGuide":[]},{"page":48,"topic":"Gene Expression and Regulation","slideInLecture":8,"title":"Transcription: DNA to RNA","explain":"RNA polymerase converts DNA information into RNA. It binds a promoter, opens a transcription bubble, escapes the promoter, elongates RNA by complementary base addition, and terminates to release the RNA.","mustKnow":["Transcription occurs in prokaryotic cytoplasm and the eukaryotic nucleus.","RNA polymerase synthesizes RNA.","The four listed stages are initiation, promoter escape, elongation, and termination.","Initiation begins at a promoter."],"terms":[{"term":"RNA polymerase","meaning":"Enzyme that synthesizes RNA from a DNA template."},{"term":"Promoter","meaning":"DNA site where transcription machinery binds to begin transcription."},{"term":"Transcription bubble","meaning":"Locally opened DNA region being transcribed."},{"term":"Elongation","meaning":"Stage in which complementary nucleotides lengthen the RNA chain."}],"diagramGuide":["The upper gene diagram places promoter upstream, structural gene in the middle, and terminator downstream; template and coding strands run antiparallel.","In the transcription bubble, RNA polymerase moves along the template strand while the nascent RNA exits behind it.","Read the stated sequence as initiation → promoter escape → elongation → termination."]},{"page":49,"topic":"Gene Expression and Regulation","slideInLecture":9,"title":"Template and coding DNA strands","explain":"RNA is synthesized using the noncoding antisense strand as the template. The coding or sense strand matches the mRNA sequence except that DNA has thymine where RNA has uracil.","mustKnow":["The antisense/noncoding strand is the transcription template.","The sense/coding strand has the same sequence as mRNA except T replaces U.","mRNA is complementary to the template strand."],"terms":[{"term":"Template strand","meaning":"DNA strand read by RNA polymerase; also called antisense or noncoding."},{"term":"Coding strand","meaning":"DNA strand matching mRNA sequence except for T instead of U."},{"term":"Uracil","meaning":"RNA base used in place of thymine."}],"diagramGuide":["The three panels show initiation at the promoter with sigma factor, elongation by RNA polymerase, and termination near the terminator with rho factor.","The RNA is complementary to the template/antisense strand and nearly matches the coding/sense strand except U replaces T."]},{"page":50,"topic":"Gene Expression and Regulation","slideInLecture":10,"title":"Eukaryotic RNA processing","explain":"Eukaryotic mRNA is first made as pre-mRNA containing coding exons and noncoding introns. RNA processing removes introns by splicing and joins exons to create mature mRNA.","mustKnow":["Eukaryotes initially produce pre-mRNA.","Exons are the coding segments shown.","Introns are noncoding segments.","Splicing removes introns to form mature mRNA."],"terms":[{"term":"Pre-mRNA","meaning":"Initial eukaryotic RNA transcript before processing."},{"term":"Exon","meaning":"Coding segment retained in mature mRNA."},{"term":"Intron","meaning":"Noncoding segment removed during processing."},{"term":"Splicing","meaning":"Removal of introns and joining of exons."}],"diagramGuide":["The top bar is pre-mRNA with cap, leader, alternating exons and introns, trailer, and poly(A) tail.","The lower bar is mature mRNA after introns are removed and exons joined; the protein-coding sequence remains between untranslated end regions."]},{"page":51,"topic":"Gene Expression and Regulation","slideInLecture":11,"title":"Supplementary translation video","explain":"This slide contains only a link to a supplementary video. It adds no new written fact beyond the surrounding translation slides.","mustKnow":["Treat this as optional supporting material, not a new pathway or definition."],"terms":[],"diagramGuide":[]},{"page":52,"topic":"Gene Expression and Regulation","slideInLecture":12,"title":"Translation direction","explain":"Translation is the process of making a protein from an mRNA. A ribosome moves along mRNA from its 5′ end toward its 3′ end, while the protein chain grows from the amino end to the carboxyl end.","mustKnow":["Translation occurs on ribosomes.","mRNA is read 5′ to 3′.","Protein is synthesized N-terminus to C-terminus."],"terms":[{"term":"Translation","meaning":"Synthesis of a protein using the sequence in mRNA."},{"term":"N-terminus","meaning":"The amino end and first end made of a protein."},{"term":"C-terminus","meaning":"The carboxyl end toward which a protein grows."}],"diagramGuide":["Read the mRNA strand left to right as 5′→3′; each codon feeds one amino acid into the growing chain.","The chain grows by adding each new amino acid to the C-terminal end, so synthesis is N→C."]},{"page":53,"topic":"Gene Expression and Regulation","slideInLecture":13,"title":"Translation machinery","explain":"The ribosome is the molecular machine that joins amino acids. The mRNA supplies the coded instructions, and tRNAs carry the corresponding amino acids to the ribosome in the cytoplasm.","mustKnow":["mRNA provides the genetic message.","tRNA delivers amino acids.","The ribosome forms the protein chain."],"terms":[{"term":"Ribosome","meaning":"RNA-protein machine where peptide synthesis occurs."},{"term":"tRNA","meaning":"Transfer RNA that carries an amino acid to the ribosome."},{"term":"mRNA","meaning":"Messenger RNA containing the sequence to be translated."}],"diagramGuide":["Follow the three-part machine: mRNA is the template, tRNA is the adaptor carrying an amino acid, and the ribosome is the catalytic assembly site.","In the peptide-bond inset, the bond forms between the carboxyl group of one amino acid and the amino group of the next."]},{"page":54,"topic":"Gene Expression and Regulation","slideInLecture":14,"title":"From gene to functional protein","explain":"Gene expression proceeds through linked stages. DNA is transcribed into RNA in the nucleus, the RNA is processed into mature mRNA, and the mRNA is translated in the cytoplasm. The new protein then folds and may be transported through the endoplasmic reticulum and Golgi.","mustKnow":["Transcription: DNA to RNA.","RNA processing produces mature mRNA.","Translation: mRNA to protein.","Folding gives a protein its three-dimensional structure."],"terms":[{"term":"Chaperone","meaning":"Protein that helps another protein fold correctly."},{"term":"Golgi apparatus","meaning":"Organelle that modifies and sorts many transported proteins."}],"diagramGuide":["Read the boxes left to right: DNA transcription in the nucleus → RNA processing → translation in the cytoplasm → folding and ER/Golgi transport.","The arrows indicate order, not chemical reversibility."]},{"page":55,"topic":"Gene Expression and Regulation","slideInLecture":15,"title":"Why gene expression is regulated","explain":"Cells do not need every gene product at the same time. Regulation lets cells match gene activity to metabolism, growth, development, and tissue specialization. Bacteria mainly control the start of transcription, while eukaryotes use more layers of control.","mustKnow":["Gene regulation supports metabolism, growth, development, and differentiation.","Prokaryotic genes are controlled mainly at transcription.","Eukaryotic regulation is more complex."],"terms":[{"term":"Differentiation","meaning":"Development of cells into specialized cell types."},{"term":"Gene regulation","meaning":"Control of when and how strongly a gene is expressed."}],"diagramGuide":[]},{"page":56,"topic":"Gene Expression and Regulation","slideInLecture":16,"title":"Regulatory levels in prokaryotes and eukaryotes","explain":"Prokaryotes mainly regulate transcription initiation. Because they have no nucleus, transcription and translation can occur at the same time. Eukaryotes can regulate transcription, RNA processing, RNA export from nucleus to cytosol, and translation.","mustKnow":["Prokaryotic control is mainly at transcription initiation.","Prokaryotic transcription and translation can be simultaneous.","Eukaryotes regulate gene expression at several stages."],"terms":[{"term":"Co-translation","meaning":"Translation beginning while an mRNA is still being transcribed."},{"term":"Post-transcriptional regulation","meaning":"Control applied after an RNA has been transcribed."}],"diagramGuide":["The tree splits regulation by cell type: prokaryotes mainly regulate transcription initiation; eukaryotes add post-transcriptional processing, export, and translation controls.","The prokaryotic branch links simultaneous transcription and translation to the absence of compartmentalization."]},{"page":57,"topic":"Gene Expression and Regulation","slideInLecture":17,"title":"Positive and negative gene regulation","explain":"Positive regulation increases gene expression, usually through an activator or inducer. Negative regulation decreases gene expression, usually through a repressor or inhibitor.","mustKnow":["Positive regulation increases expression.","Negative regulation decreases expression.","Activator and repressor have opposite effects."],"terms":[{"term":"Activator","meaning":"Regulatory factor that increases gene expression."},{"term":"Repressor","meaning":"Regulatory factor that decreases gene expression."},{"term":"Inducer","meaning":"Molecule that promotes expression of a gene or operon."}],"diagramGuide":[]},{"page":58,"topic":"Gene Expression and Regulation","slideInLecture":18,"title":"Operons","explain":"An operon is a bacterial DNA unit containing several functionally related genes controlled by one promoter. The genes are transcribed together, allowing a whole pathway to be switched as one unit. Operons are characteristic of prokaryotes, not eukaryotes.","mustKnow":["One promoter controls a cluster of genes.","Operons are found in prokaryotes.","Lac, ara, and gal operons control sugar metabolism."],"terms":[{"term":"Operon","meaning":"Cluster of prokaryotic genes controlled together by one promoter."},{"term":"Promoter","meaning":"DNA site where RNA polymerase binds to begin transcription."},{"term":"Operator","meaning":"Regulatory DNA site where a repressor can bind."}],"diagramGuide":["The colored DNA blocks show one promoter and operator controlling several structural genes as one unit.","A single promoter upstream of multiple genes implies one polycistronic transcript."]},{"page":59,"topic":"Gene Expression and Regulation","slideInLecture":19,"title":"Purpose of the lac operon","explain":"The lac operon contains genes that let bacteria take up and use lactose as an energy source. E. coli strongly uses this system when lactose is available but the preferred sugar, glucose, is unavailable.","mustKnow":["The lac operon supports lactose use.","Its genes share one promoter and one mRNA.","Glucose is preferred over lactose."],"terms":[{"term":"Lac operon","meaning":"Bacterial operon encoding proteins needed for lactose metabolism."}],"diagramGuide":[]},{"page":60,"topic":"Gene Expression and Regulation","slideInLecture":20,"title":"Lactose uptake and breakdown","explain":"The diagram links lac-operon products to lactose use. LacY permease transports lactose into the bacterium. LacZ β-galactosidase breaks lactose into glucose and galactose and also produces the inducer allolactose. LacA encodes a transacetylase.","mustKnow":["Permease brings lactose into the cell.","β-galactosidase acts on lactose.","Allolactose helps switch on the operon."],"terms":[{"term":"Permease","meaning":"Membrane transport protein encoded by lacY that imports lactose."},{"term":"β-galactosidase","meaning":"lacZ enzyme that breaks lactose and can form allolactose."},{"term":"Allolactose","meaning":"Lactose isomer that acts as the lac-operon inducer."}],"diagramGuide":["Trace lactose from the external medium through permease, then to β-galactosidase-mediated breakdown inside the bacterium.","Use the diagram to separate transport (LacY) from catalysis (LacZ)."]},{"page":61,"topic":"Gene Expression and Regulation","slideInLecture":21,"title":"Two controls of the lac operon","explain":"The lac operon integrates two nutrient signals. The lac repressor responds indirectly to lactose through allolactose and blocks transcription when lactose is absent. CAP responds indirectly to glucose through cAMP and stimulates transcription when glucose is low.","mustKnow":["Lac repressor is the lactose-control arm.","CAP is the glucose-control arm.","Allolactose disables repression.","High cAMP indicates low glucose."],"terms":[{"term":"CAP","meaning":"Catabolite activator protein that promotes lac transcription when activated by cAMP."},{"term":"cAMP","meaning":"Signal that rises when glucose is low and activates CAP."}],"diagramGuide":[]},{"page":62,"topic":"Gene Expression and Regulation","slideInLecture":22,"title":"Genes of the lac operon","explain":"The three structural genes lacZ, lacY, and lacA are transcribed together as one mRNA. Their products perform different parts of lactose handling: breakdown, transport, and transacetylation.","mustKnow":["lacZ encodes β-galactosidase.","lacY encodes lactose permease.","lacA encodes transacetylase.","All three genes share one transcript."],"terms":[{"term":"lacZ","meaning":"Gene for β-galactosidase."},{"term":"lacY","meaning":"Gene for lactose permease."},{"term":"lacA","meaning":"Gene for transacetylase."}],"diagramGuide":["Read the DNA map left to right: CAP site → promoter → operator → lacZ → lacY → lacA.","Match the products shown at right: LacZ β-galactosidase, LacY permease, LacA transacetylase."]},{"page":63,"topic":"Gene Expression and Regulation","slideInLecture":23,"title":"Promoter, operator, and CAP site","explain":"The promoter is where RNA polymerase binds. The operator overlaps the promoter and can be occupied by the lac repressor, physically blocking transcription. The CAP-binding site is a positive-control site; bound CAP helps RNA polymerase attach.","mustKnow":["RNA polymerase binds the promoter.","Lac repressor binds the operator.","CAP binds the CAP site and promotes transcription."],"terms":[{"term":"Promoter","meaning":"DNA site for RNA polymerase binding."},{"term":"Operator","meaning":"Negative-control DNA site bound by the lac repressor."},{"term":"CAP-binding site","meaning":"Positive-control DNA site where CAP helps recruit RNA polymerase."}],"diagramGuide":["The operator overlaps the promoter region, so a bound repressor physically obstructs RNA polymerase.","CAP binds upstream and assists RNA-polymerase recruitment rather than removing the repressor."]},{"page":64,"topic":"Gene Expression and Regulation","slideInLecture":24,"title":"How lactose removes repression","explain":"Without lactose, the lac repressor binds tightly to the operator and blocks RNA polymerase. When lactose is present, its isomer allolactose binds the repressor, reducing the repressor's ability to bind DNA and clearing the operator.","mustKnow":["No lactose: repressor bound, operon blocked.","Lactose present: allolactose releases the repressor.","Removing the repressor permits transcription but does not guarantee strong transcription."],"terms":[{"term":"Lac repressor","meaning":"Protein that blocks lac-operon transcription by binding the operator."}],"diagramGuide":[]},{"page":65,"topic":"Gene Expression and Regulation","slideInLecture":25,"title":"The lac operon is inducible","explain":"Allolactose is an inducer because it triggers expression of the lac operon. The lac operon is called inducible because its default state is off, but the inducer can remove repression and permit expression.","mustKnow":["Allolactose is the inducer.","An inducible operon is normally off.","Inducer presence makes expression possible."],"terms":[{"term":"Inducible operon","meaning":"Operon normally off that can be switched on by an inducer."},{"term":"Inducer","meaning":"Small molecule that triggers gene or operon expression."}],"diagramGuide":["Compare the two panels: without lactose the repressor occupies the operator; with allolactose the repressor changes shape and leaves DNA.","Allolactose acts on the repressor, not directly on RNA polymerase."]},{"page":66,"topic":"Gene Expression and Regulation","slideInLecture":26,"title":"CAP boosts transcription","explain":"RNA polymerase binds the lac promoter weakly on its own. Active CAP binds DNA before the promoter and helps RNA polymerase bind, producing high transcription. The CAP protein is made continuously from a separate regulatory gene but becomes active only under the correct signal.","mustKnow":["CAP increases RNA polymerase binding.","CAP is encoded outside the lac operon.","CAP protein is constitutively available.","CAP must bind cAMP to become active."],"terms":[{"term":"Constitutive expression","meaning":"Continuous expression rather than switching on only under one condition."},{"term":"CAP","meaning":"Activator that helps RNA polymerase bind the lac promoter."}],"diagramGuide":[]},{"page":67,"topic":"Gene Expression and Regulation","slideInLecture":27,"title":"cAMP activates CAP","explain":"CAP cannot bind its DNA site effectively by itself. When glucose is low, the cell produces more cAMP. cAMP binds CAP, changes its shape, and allows CAP to bind DNA and promote transcription.","mustKnow":["Low glucose produces high cAMP.","cAMP binds and activates CAP.","CAP without cAMP is inactive."],"terms":[{"term":"Cyclic AMP","meaning":"cAMP, a low-glucose signal that activates CAP."},{"term":"Hunger signal","meaning":"Slide description for cAMP produced when glucose is low."}],"diagramGuide":["Compare low- and high-glucose panels: low glucose gives high cAMP and CAP–cAMP binding; high glucose gives low cAMP and inactive CAP.","The red transcription arrow appears only when CAP–cAMP can occupy the CAP site and repression is absent."]},{"page":68,"topic":"Gene Expression and Regulation","slideInLecture":28,"title":"Conditions for strong lac transcription","explain":"Strong lac-operon expression requires two conditions at once: lactose must be present, removing the repressor through allolactose, and glucose must be absent, activating CAP through high cAMP. This leaves RNA polymerase an open path and gives it strong promoter support.","mustKnow":["Lactose present removes repression.","Glucose absent activates CAP.","Both conditions together produce strong transcription."],"terms":[{"term":"Catabolite activation","meaning":"Activation of sugar-use genes by CAP when preferred glucose is scarce."}],"diagramGuide":[]},{"page":69,"topic":"Gene Expression and Regulation","slideInLecture":29,"title":"Lac states when glucose is present","explain":"With glucose present, cAMP is low and CAP is inactive. If lactose is absent, the repressor also remains bound, so there is no transcription. If lactose is present, the repressor leaves, but inactive CAP means only low, leaky transcription.","mustKnow":["Glucose present keeps CAP inactive.","Glucose present plus no lactose gives no transcription.","Glucose present plus lactose gives low transcription."],"terms":[{"term":"Leaky transcription","meaning":"Low basal transcription occurring without full activation."}],"diagramGuide":["Read each panel from environmental inputs to DNA occupancy: glucose controls CAP through cAMP, while lactose controls the repressor through allolactose.","Both panels have glucose present, so CAP is absent; lactose only changes no transcription to low basal transcription."]},{"page":70,"topic":"Gene Expression and Regulation","slideInLecture":30,"title":"Lac states when glucose is absent","explain":"When glucose is absent, cAMP is high and CAP is active. If lactose is also absent, the bound repressor still blocks transcription. If lactose is present, the repressor is released and active CAP produces strong transcription.","mustKnow":["Low glucose alone cannot overcome a bound repressor.","No glucose plus no lactose gives no transcription.","No glucose plus lactose gives strong transcription."],"terms":[],"diagramGuide":["Both panels lack glucose, so CAP is bound; the decisive difference is lactose, which removes the repressor.","CAP cannot overcome an operator-bound repressor, but CAP plus repressor release produces strong transcription."]},{"page":71,"topic":"Gene Expression and Regulation","slideInLecture":31,"title":"Four-condition lac-operon table","explain":"The table combines the two switches. Lactose determines whether the repressor binds; glucose determines whether CAP binds. Strong expression occurs only with lactose present and glucose absent.","mustKnow":["Glucose+, lactose−: no transcription.","Glucose+, lactose+: low transcription.","Glucose−, lactose−: no transcription.","Glucose−, lactose+: strong transcription."],"terms":[],"diagramGuide":["Treat each row as a truth table: '+' under glucose predicts CAP off, while '+' under lactose predicts repressor off.","The only strong-transcription row is glucose − / lactose + / CAP + / repressor −."]},{"page":72,"topic":"Gene Expression and Regulation","slideInLecture":32,"title":"Organization of the trp operon","explain":"The trp operon contains the structural genes trpE, trpD, trpC, trpB, and trpA. They are transcribed together and translated into enzymes needed for tryptophan biosynthesis. A promoter and operator control the group.","mustKnow":["The trp genes encode enzymes for tryptophan synthesis.","The genes share one transcript.","The promoter binds RNA polymerase; the operator binds the repressor."],"terms":[{"term":"trp operon","meaning":"Operon encoding enzymes that synthesize tryptophan."},{"term":"Structural genes","meaning":"Genes encoding the pathway enzymes controlled by the operon."}],"diagramGuide":["The upper line is the trp DNA unit; the lower arrows show one transcript translated into enzymes for tryptophan biosynthesis.","The regulatory gene is separate from the clustered structural genes."]},{"page":73,"topic":"Gene Expression and Regulation","slideInLecture":33,"title":"Tryptophan switches the trp operon off","explain":"The trp operon is on when tryptophan is absent because the repressor cannot block the operator. When tryptophan is present, it binds the repressor as a co-repressor. The active complex binds the operator and stops transcription.","mustKnow":["Tryptophan present: operon off.","Tryptophan absent: operon on.","Tryptophan activates the repressor as a co-repressor."],"terms":[{"term":"Co-repressor","meaning":"Small molecule that activates a repressor so it can block transcription."},{"term":"Repressible operon","meaning":"Operon normally on that can be switched off."}],"diagramGuide":["Compare the two rows: tryptophan present forms an active repressor–corepressor complex that binds the operator; tryptophan absent leaves the repressor inactive.","The red X marks blocked transcription; the lower row proceeds to enzyme production."]},{"page":74,"topic":"Gene Expression and Regulation","slideInLecture":34,"title":"Inducible versus repressible operons","explain":"The lac operon is normally off and is induced when allolactose disables an active repressor. The trp operon is normally on because its repressor is inactive; tryptophan acts as a co-repressor and switches it off. Both systems use negative regulation through a repressor.","mustKnow":["Lac: default off; inducer turns it on.","Trp: default on; co-repressor turns it off.","Both are negatively regulated by repressors.","Constitutive genes do not require this switching."],"terms":[{"term":"Constitutive gene","meaning":"Gene expressed continuously with little or no switching."},{"term":"Regulatory gene","meaning":"Gene whose expression is controlled according to cellular need."}],"diagramGuide":["Read across each row rather than down a column: lac is default OFF and induced ON, whereas trp is default ON and corepressed OFF.","Both are negative regulation because a repressor is the direct DNA-blocking protein."]},{"page":75,"topic":"Gene Expression and Regulation","slideInLecture":35,"title":"Gene-regulation references","explain":"This slide lists textbooks and a web source used for the lecture. It introduces no new mechanism or definition.","mustKnow":["No new examinable concept is presented on this references slide."],"terms":[],"diagramGuide":[]},{"page":76,"topic":"Genetic Engineering Applications 1","slideInLecture":1,"title":"Genetic engineering overview","explain":"A recombinant DNA construct combines a gene of interest with vector elements that let the DNA replicate, be selected, and sometimes be expressed. The slide highlights a promoter, terminator, selectable marker, and origin of replication.","mustKnow":["A gene of interest is inserted into a DNA vector.","The origin permits replication.","A selectable marker identifies cells carrying the construct.","Promoter and terminator control transcription."],"terms":[{"term":"Recombinant DNA","meaning":"DNA assembled from sequences that originated from different sources."},{"term":"Origin of replication","meaning":"Vector sequence that permits DNA replication in a host."},{"term":"Selectable marker","meaning":"Gene used to select cells carrying the vector."}],"diagramGuide":["The circular recombinant-DNA map labels the minimum functional parts: origin, selectable marker, promoter, inserted gene, and terminator.","Promoter/terminator govern expression; origin governs replication; marker governs selection."]},{"page":77,"topic":"Genetic Engineering Applications 1","slideInLecture":2,"title":"Milestones in GMO development","explain":"The timeline moves from the first genetically modified bacteria in 1973 to GM mice in 1974, commercial insulin-producing bacteria in 1982, GM food sales in 1994, and GM pets such as GloFish in 2003.","mustKnow":["1973: first genetically modified bacteria.","1982: commercial insulin-producing bacteria.","1994: genetically modified food sold.","2003: GM pets sold."],"terms":[{"term":"GMO","meaning":"Organism whose genetic material has been deliberately modified."},{"term":"GloFish","meaning":"Genetically modified fluorescent fish sold as pets."}],"diagramGuide":[]},{"page":78,"topic":"Genetic Engineering Applications 1","slideInLecture":3,"title":"Central dogma reminder","explain":"The central dogma states the main direction of genetic information flow: DNA is used to make RNA, and RNA is used to make protein.","mustKnow":["DNA → RNA → protein."],"terms":[{"term":"Central dogma","meaning":"Main flow of sequence information from DNA to RNA to protein."}],"diagramGuide":["The top arrow is information flow DNA→RNA→protein; the lower panels distinguish replication, transcription, and translation.","Do not confuse DNA replication (DNA→DNA) with gene expression."]},{"page":79,"topic":"Genetic Engineering Applications 1","slideInLecture":4,"title":"Definition of genetic engineering","explain":"Genetic engineering is deliberate DNA modification using molecular biology. A chosen gene is isolated, modified if needed, placed in a vector, and transferred to a host where it can be copied or expressed to make a product.","mustKnow":["It involves isolation, modification, and transfer of DNA.","A vector carries the gene of interest.","A host maintains or expresses the recombinant DNA.","It underlies recombinant DNA technology."],"terms":[{"term":"Gene of interest","meaning":"Specific DNA sequence selected for cloning or expression."},{"term":"Vector","meaning":"DNA vehicle used to carry foreign DNA into a host."},{"term":"Host cell","meaning":"Cell that receives and maintains recombinant DNA."}],"diagramGuide":["Follow the lower workflow: gene of interest → vector → recombinant DNA → host cell → desired product.","The vector is the carrier; the host is the living system that maintains or expresses it."]},{"page":80,"topic":"Genetic Engineering Applications 1","slideInLecture":5,"title":"Basic genetic-engineering workflow","explain":"The standard workflow is: isolate or amplify the target gene, cut the gene and vector with compatible restriction enzymes, join them with DNA ligase, introduce the recombinant vector into a host, select and verify positive cells, and express the gene to obtain the product.","mustKnow":["Restriction enzymes cut gene and vector.","DNA ligase joins insert and vector.","Transformation introduces DNA into the host.","Selection and screening identify correct clones."],"terms":[{"term":"Ligation","meaning":"Covalent joining of DNA fragments by DNA ligase."},{"term":"Transformation","meaning":"Introduction of foreign DNA into a host cell."},{"term":"Screening","meaning":"Testing selected cells to identify the correct recombinant clone."}],"diagramGuide":["Read the six numbered stages in order; cutting precedes ligation, and transformation precedes selection/screening.","The same restriction enzyme creates compatible ends on insert and vector."]},{"page":81,"topic":"Genetic Engineering Applications 1","slideInLecture":6,"title":"Core genetic-engineering terms","explain":"The slide defines the parts and outcomes of cloning. A vector carries foreign DNA into a host; recombinant DNA contains joined sequences from different sources; transformation delivers it; a clone is the genetically identical population produced from one starting cell.","mustKnow":["Vector carries DNA.","Host cell receives recombinant DNA.","Transformation is DNA introduction.","A selectable marker allows carrier cells to survive or be identified."],"terms":[{"term":"Clone","meaning":"Genetically identical population derived from one progenitor cell."},{"term":"Transformation","meaning":"Introduction of foreign or recombinant DNA into a host."},{"term":"Recombinant DNA","meaning":"DNA made by joining sequences from different sources."},{"term":"Selectable marker","meaning":"Gene that enables selection of cells containing a vector."}],"diagramGuide":["Each icon is a separate term: free DNA segment = gene of interest, circle = vector, circle plus insert = recombinant DNA, cell = host.","A clone is the descendant population after one transformed progenitor grows."]},{"page":82,"topic":"Genetic Engineering Applications 1","slideInLecture":7,"title":"Restriction enzymes","explain":"Restriction endonucleases are bacterial defense enzymes that cut DNA at specific short recognition sequences, usually 4–8 base pairs. Many sites are palindromic. Cutting the insert and vector with the same enzyme can create matching ends for cloning.","mustKnow":["Restriction enzymes recognize specific DNA sequences.","Many recognition sites are palindromic.","The same enzyme can generate compatible vector and insert ends.","They naturally help bacteria defend against foreign DNA."],"terms":[{"term":"Restriction endonuclease","meaning":"Enzyme that cuts DNA at or near a specific recognition sequence."},{"term":"Palindromic sequence","meaning":"DNA site read the same 5′ to 3′ on both complementary strands."},{"term":"Recognition site","meaning":"Specific DNA sequence recognized by a restriction enzyme."}],"diagramGuide":["The recognition-site inset is antiparallel: the sequence reads identically 5′→3′ on the two strands.","The scissors mark a sequence-specific cut; the resulting compatible ends permit cloning."]},{"page":83,"topic":"Genetic Engineering Applications 1","slideInLecture":8,"title":"Sticky and blunt DNA ends","explain":"Different restriction enzymes create different cut ends. Sticky ends contain single-stranded overhangs that can base-pair with complementary ends. Blunt ends have no overhang. The enzyme choice depends on the available recognition sites and required compatibility.","mustKnow":["Sticky ends have overhangs.","Blunt ends have no overhangs.","Compatible ends make ligation easier.","Restriction-site location affects enzyme choice."],"terms":[{"term":"Sticky end","meaning":"DNA end with a single-stranded overhang."},{"term":"Blunt end","meaning":"DNA end with no single-stranded overhang."},{"term":"Compatible ends","meaning":"DNA ends able to align for joining."}],"diagramGuide":["Sticky-end drawings have single-stranded overhangs that base-pair before ligation; blunt-end drawings terminate flush.","The bottom equation shows vector and insert cut with compatible ends and then sealed into a recombinant plasmid."]},{"page":84,"topic":"Genetic Engineering Applications 1","slideInLecture":9,"title":"DNA ligase joins DNA fragments","explain":"DNA ligase seals breaks in the sugar-phosphate backbone. It forms a phosphodiester bond between a 3′-OH and a 5′-phosphate. Sticky-end ligation is usually more efficient because complementary overhangs align the fragments before sealing.","mustKnow":["Ligase forms phosphodiester bonds.","It joins a 3′-OH to a 5′-phosphate.","It joins insert and vector after restriction digestion.","Sticky ends usually ligate more efficiently than blunt ends."],"terms":[{"term":"Phosphodiester bond","meaning":"Covalent bond linking neighboring nucleotides in the DNA backbone."},{"term":"Nick","meaning":"Single-strand break in an otherwise continuous DNA duplex."}],"diagramGuide":["In the nick-sealing inset, ligase connects an adjacent 3′-OH and 5′-phosphate to restore the sugar-phosphate backbone.","The sticky-end panel shows base pairing aligns fragments before covalent sealing."]},{"page":85,"topic":"Genetic Engineering Applications 1","slideInLecture":10,"title":"T4 DNA ligase mechanism","explain":"T4 DNA ligase uses ATP. First it forms a ligase–AMP intermediate, then transfers AMP to the DNA 5′-phosphate. The neighboring 3′-OH attacks this activated phosphate, forming the phosphodiester bond and sealing the DNA.","mustKnow":["T4 DNA ligase is ATP-dependent.","A ligase–AMP intermediate forms.","AMP activates the DNA 5′-phosphate.","The 3′-OH attack completes backbone joining."],"terms":[{"term":"Ligase–AMP","meaning":"Activated covalent intermediate formed between ligase and AMP."},{"term":"PPi","meaning":"Pyrophosphate released when ligase reacts with ATP."}],"diagramGuide":["Read the numbered mechanism: ligase binds → ATP forms ligase–AMP → AMP activates the DNA 5′-phosphate → 3′-OH attack forms the bond.","AMP is an enzyme/DNA intermediate, not part of the final phosphodiester bond."]},{"page":86,"topic":"Genetic Engineering Applications 1","slideInLecture":11,"title":"Requirements for efficient ligation","explain":"Successful ligation requires DNA ends that can be physically joined and ATP for T4 DNA ligase. Sticky ends are usually more efficient because complementary base pairing holds the fragments in alignment, increasing their effective local concentration.","mustKnow":["T4 ligase requires ATP.","DNA ends must be compatible or blunt.","Ligation creates a stable recombinant molecule.","Sticky ends are generally more efficient."],"terms":[{"term":"Cohesive end","meaning":"Another name for a sticky end with a complementary overhang."},{"term":"Effective concentration","meaning":"Local availability of aligned DNA ends for the ligase reaction."}],"diagramGuide":["The plasmid cartoon shows insert and vector first held together by complementary sticky ends, then covalently closed by ligase.","The final continuous circle represents a stable recombinant molecule."]},{"page":87,"topic":"Genetic Engineering Applications 1","slideInLecture":12,"title":"PCR principle and components","explain":"Polymerase chain reaction is an in vitro method that selectively amplifies a chosen DNA region. Repeated temperature changes in a thermal cycler allow a small starting amount to produce millions of copies. The reaction requires template DNA, primers, nucleotides, polymerase, and suitable buffer.","mustKnow":["PCR amplifies a specific DNA sequence.","It is performed in vitro.","A thermal cycler repeatedly changes temperature.","Primers define the target region."],"terms":[{"term":"PCR","meaning":"Polymerase chain reaction, a method for amplifying selected DNA."},{"term":"Primer","meaning":"Short DNA strand that defines an amplification boundary and provides a starting 3′ end."},{"term":"Thermal cycler","meaning":"Instrument that runs PCR temperature cycles."}],"diagramGuide":["Identify every required PCR component in the bottom row: template, two primers, thermostable polymerase, dNTPs, Mg²⁺ buffer, and thermal cycler.","Forward and reverse primers flank opposite e
