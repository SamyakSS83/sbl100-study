<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SBL100 - 15 Hour Active Course</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f1ea; --ink:#17211b; --panel:#fffdf7; --line:#d6d0c3; --accent:#236b4e; --soft:#e4efe8; --warn:#9a4b22; --good:#17633f; }
    @media (prefers-color-scheme:dark){:root{--bg:#111714;--ink:#eef4ef;--panel:#18201c;--line:#344039;--accent:#7dd3a7;--soft:#233b2e;--warn:#ffb080;--good:#8ee0b3}}
    *{box-sizing:border-box} body{margin:0;font:16px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
    button,select,textarea{font:inherit} button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:20px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    h1,h2,h3,p{margin-top:0}.muted{opacity:.72}.pill{padding:5px 10px;border-radius:999px;background:var(--soft);font-size:13px}.progress{height:12px;background:var(--line);border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--accent);transition:width .25s}
    .layout{display:grid;grid-template-columns:260px 1fr;gap:20px;margin-top:18px}.sidebar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.sidebar{align-self:start;position:sticky;top:12px}
    .modules{display:grid;gap:7px;max-height:72vh;overflow:auto}.module-btn{border:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;padding:9px;border-radius:10px}.module-btn.active{background:var(--soft);border-color:var(--accent)}.module-btn.done::after{content:" ✓";color:var(--good)}
    .stage{min-height:540px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button,.action{border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 13px;border-radius:10px}.nav button.active,.primary{background:var(--accent)!important;color:var(--bg)!important;border-color:var(--accent)!important}
    .card{border:1px solid var(--line);border-radius:14px;padding:18px;margin:13px 0;background:var(--panel)}.primer li{margin:10px 0}.recall-q{font-size:20px}.answer{margin-top:14px;padding:14px;border-left:4px solid var(--accent);background:var(--soft)}.hidden{display:none!important}
    textarea{width:100%;min-height:95px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);padding:10px}.choices{display:grid;gap:9px}.choice{text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);padding:12px;border-radius:10px}.choice.correct{border-color:var(--good);background:var(--soft)}.choice.wrong{border-color:var(--warn)}
    .timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spacer{flex:1}.score{font-size:30px;font-weight:700}.trap{border-left:4px solid var(--warn);padding-left:12px;margin:12px 0}.dashboard{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:14px;background:var(--soft);border-radius:12px}.stat strong{display:block;font-size:24px}
    @media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{position:static}.modules{grid-template-columns:repeat(3,1fr);max-height:none}.module-btn{font-size:12px}.dashboard{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="app">
  <div class="top">
    <div><h1>SBL100: 15-Hour Active Course</h1><p class="muted">You cannot advance by merely scrolling. Predict, retrieve, answer, then correct.</p></div>
    <div class="row"><span id="timer" class="timer">25:00</span><button id="timerBtn" class="action">Start sprint</button><button id="resetTimer" class="action">Reset</button></div>
  </div>
  <div class="progress" aria-label="Overall progress"><div id="overallBar" class="bar"></div></div>
  <div class="layout">
    <aside class="sidebar">
      <h3>15 one-hour missions</h3>
      <div id="modules" class="modules"></div>
      <hr><button id="reviewMistakes" class="action">Review mistake queue</button>
    </aside>
    <section class="panel stage">
      <div class="row"><span id="source" class="pill"></span><span id="status" class="pill"></span><span class="spacer"></span><button id="markDone" class="action">Mark hour complete</button></div>
      <h2 id="title"></h2><p id="mission"></p>
      <nav id="phaseNav" class="nav"></nav>
      <div id="content"></div>
    </section>
  </div>
</main>
<script>
const COURSE = __COURSE_DATA__;
const KEY="sbl-active-course-v1";
const saved=JSON.parse(localStorage.getItem(KEY)||"{}");
const state={module:saved.module||0,done:saved.done||{},mistakes:saved.mistakes||[],phase:saved.phase||"learn", recallIndex:0, mcqIndex:0, mcqCorrect:0};
let timer=1500,timerHandle=null;
const phases=[["learn","Learn"],["recall","Recall"],["quiz","MCQ drill"],["traps","Exam traps"],["checkpoint","Checkpoint"]];
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify({module:state.module,done:state.done,mistakes:state.mistakes,phase:state.phase}))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderModules(){ $("modules").innerHTML=COURSE.map((m,i)=>`<button class="module-btn ${i===state.module?"active":""} ${state.done[i]?"done":""}" data-i="${i}">${i+1}. ${esc(m.title)}</button>`).join(""); document.querySelectorAll(".module-btn").forEach(b=>b.onclick=()=>{state.module=+b.dataset.i;state.phase="learn";state.recallIndex=0;state.mcqIndex=0;state.mcqCorrect=0;save();render()})}
function renderNav(){ $("phaseNav").innerHTML=phases.map(([k,v])=>`<button class="${state.phase===k?"active":""}" data-p="${k}">${v}</button>`).join("");document.querySelectorAll("#phaseNav button").forEach(b=>b.onclick=()=>{state.phase=b.dataset.p;save();renderMain()})}
function learn(m){return `<div class="card primer"><h3>The mental model</h3><ol>${m.primer.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div><div class="card"><strong>Before moving on:</strong> explain the module aloud in 60 seconds without looking. Then open Recall.</div>`}
function recall(m){let x=m.recall[state.recallIndex%m.recall.length];return `<div class="card"><div class="muted">Retrieval ${state.recallIndex+1} of ${m.recall.length}</div><p class="recall-q">${esc(x.q)}</p><textarea id="recallDraft" placeholder="Type or say your answer before revealing."></textarea><div class="row"><button id="reveal" class="action primary">Reveal answer</button><button id="nextRecall" class="action hidden">Next prompt</button></div><div id="recallAnswer" class="answer hidden"><strong>Expected:</strong> ${esc(x.a)}<div class="row" style="margin-top:12px"><button class="action rate" data-rate="miss">Missed it</button><button class="action rate" data-rate="hard">Got it, barely</button><button class="action rate" data-rate="easy">Knew it</button></div></div></div>`}
function quiz(m){let x=m.mcqs[state.mcqIndex%m.mcqs.length];return `<div class="card"><div class="row"><span class="muted">Question ${state.mcqIndex+1} of ${m.mcqs.length}</span><span class="spacer"></span><strong>${state.mcqCorrect} correct</strong></div><p class="recall-q">${esc(x.q)}</p><div class="choices">${x.options.map((o,i)=>`<button class="choice" data-choice="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div><div id="explain" class="answer hidden"></div><button id="nextMcq" class="action primary hidden">Next question</button></div>`}
function traps(m){return `<div class="card"><h3>High-risk confusions</h3>${m.traps.map(x=>`<div class="trap">${esc(x)}</div>`).join("")}</div>`}
function checkpoint(m){return `<div class="card"><h3>Exit ticket - no notes</h3>${m.checkpoint.map((x,i)=>`<label><strong>${i+1}. ${esc(x)}</strong><textarea placeholder="Answer from memory"></textarea></label>`).join("")}<button id="finishModule" class="action primary">Finish this hour</button></div>`}
function renderMain(){let m=COURSE[state.module];$("title").textContent=`Hour ${state.module+1}: ${m.title}`;$("source").textContent=m.sourcePages;$("mission").textContent=m.mission;$("status").textContent=state.done[state.module]?"Completed":"In progress";renderNav();$("content").innerHTML=({learn,recall,quiz,traps,checkpoint}[state.phase])(m);wire(m)}
function wire(m){
 if($("reveal"))$("reveal").onclick=()=>{$("recallAnswer").classList.remove("hidden");$("nextRecall").classList.remove("hidden");$("reveal").disabled=true};
 document.querySelectorAll(".rate").forEach(b=>b.onclick=()=>{if(b.dataset.rate!=="easy"){let q=m.recall[state.recallIndex%m.recall.length];state.mistakes.push({module:state.module,q:q.q,a:q.a,at:Date.now()});save()} state.recallIndex=(state.recallIndex+1)%m.recall.length;renderMain()});
 if($("nextRecall"))$("nextRecall").onclick=()=>{state.recallIndex=(state.recallIndex+1)%m.recall.length;renderMain()};
 document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{let x=m.mcqs[state.mcqIndex%m.mcqs.length],pick=+b.dataset.choice;document.querySelectorAll(".choice").forEach((c,i)=>{c.disabled=true;if(i===x.answer)c.classList.add("correct")});if(pick===x.answer)state.mcqCorrect++;else{b.classList.add("wrong");state.mistakes.push({module:state.module,q:x.q,a:x.options[x.answer],at:Date.now()});save()} $("explain").innerHTML=`<strong>${pick===x.answer?"Correct.":"Not quite."}</strong> ${esc(x.explanation)}`;$("explain").classList.remove("hidden");$("nextMcq").classList.remove("hidden")});
 if($("nextMcq"))$("nextMcq").onclick=()=>{state.mcqIndex++;if(state.mcqIndex>=m.mcqs.length){$("content").innerHTML=`<div class="card"><div class="score">${state.mcqCorrect}/${m.mcqs.length}</div><p>${state.mcqCorrect>=6?"Good enough to move on. Review mistakes tomorrow.":"Repeat Recall, then retry this drill."}</p><button class="action primary" onclick="state.mcqIndex=0;state.mcqCorrect=0;renderMain()">Retry MCQs</button></div>`}else renderMain()};
 if($("finishModule"))$("finishModule").onclick=()=>{state.done[state.module]=true;save();render();};
}
function render(){renderModules();renderMain();let n=Object.values(state.done).filter(Boolean).length;$("overallBar").style.width=`${n/COURSE.length*100}%`}
$("markDone").onclick=()=>{state.done[state.module]=!state.done[state.module];save();render()};
$("reviewMistakes").onclick=()=>{let list=state.mistakes.slice(-30).reverse();$("content").innerHTML=`<h2>Mistake queue</h2>${list.length?list.map(x=>`<details class="card"><summary>${esc(x.q)}</summary><div class="answer">${esc(x.a)}</div></details>`).join(""):"<p>No mistakes logged yet. Go earn some.</p>"}`};
function tick(){timer--;if(timer<=0){clearInterval(timerHandle);timerHandle=null;alert("Sprint over. Stand up for 5 minutes, then retrieve three facts before continuing.");timer=1500}$("timer").textContent=`${String(Math.floor(timer/60)).padStart(2,"0")}:${String(timer%60).padStart(2,"0")}`}
$("timerBtn").onclick=()=>{if(timerHandle){clearInterval(timerHandle);timerHandle=null;$("timerBtn").textContent="Resume sprint"}else{timerHandle=setInterval(tick,1000);$("timerBtn").textContent="Pause"}};
$("resetTimer").onclick=()=>{clearInterval(timerHandle);timerHandle=null;timer=1500;tick();timer=1500;$("timerBtn").textContent="Start sprint"};
render();
</script>
</body>
</html>
